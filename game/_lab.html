<!doctype html>
<meta charset="utf-8">
<title>лаборатория моделей</title>
<style>html,body{margin:0;height:100%;background:#05070c}canvas{display:block;width:100vw;height:100vh}</style>
<canvas id="view"></canvas>
<script type="module">
import { THREE, Viewport } from './js/engine.js';
import { buildShip, buildSupplyField, buildGreebleShip } from './js/models.js';
import { FACTIONS, SHIPS } from './js/data.js';
import { loadModelLibrary } from './js/assets.js';

// Внешние модели подтягиваем и в стенде: без этого стенд показывает
// процедурную заглушку и правки в загрузчике на нём не видны
await loadModelLibrary();

const viewport = new Viewport(document.getElementById('view'));
viewport.setBloom({ strength: 0.8, radius: 0.6, threshold: 0.7, exposure: 1.05 });
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070c);
scene.add(new THREE.AmbientLight(0x8090b0, 1.4));
const key = new THREE.DirectionalLight(0xffe8cc, 3.4);
key.position.set(-120, 90, 140);
scene.add(key);
const rim = new THREE.DirectionalLight(0x7fa8ff, 1.6);
rim.position.set(160, 40, -120);
scene.add(rim);

const params = new URLSearchParams(location.search);
const shipId = params.get('ship') || 'capital';
// стенд умеет показывать не только корабли
const what = params.get('what') || 'ship';
const thrust = Number(params.get('thrust') ?? 2.4);
let def, ship;
if (what === 'greeble') {
  const t0 = performance.now();
  ship = buildGreebleShip(Number(params.get('count') ?? 100000), 7);
  const ms = Math.round(performance.now() - t0);
  def = { radius: 30 };
  window.__built = { count: ship.userData.count, ms, draws: ship.children.length };
  console.log(`ГРИБЛЫ: ${ship.userData.count} деталей за ${ms} мс`);
} else if (what === 'field') {
  def = { radius: 9 };
  ship = buildSupplyField();
  const ground = new THREE.Mesh(new THREE.CircleGeometry(60, 48).rotateX(-Math.PI / 2),
    new THREE.MeshStandardMaterial({ color: 0x5f5a44, roughness: 1 }));
  scene.add(ground);
} else {
  def = SHIPS.troyden.find(s => s.id === shipId) || SHIPS.troyden[0];
  ship = buildShip(def, FACTIONS.troyden);
  for (const en of ship.userData.engines || []) en.scale.set(0.95, 0.95, thrust);
}
scene.add(ship);

const cam = new THREE.PerspectiveCamera(45, 1, 0.5, 5000);
const R = def.radius;
const D = Number(params.get('dist') ?? 1);
// вид сбоку-сзади: только так видно длину факела, а не его торец
cam.position.set(R * 4.2 * D, R * 1.3 * D, R * 0.8 * D);
cam.lookAt(0, 0, R * 1.4);

let t = 0;
function loop() {
  t += 0.016;
  ship.rotation.y = Number(params.get('spin') ?? 1) ? t * 0.25 : 0;
  viewport.render(scene, cam);
  requestAnimationFrame(loop);
}
loop();
window.__lab = { ship, def };
</script>
