                      <div className="flex flex-col sm:flex-row justify-between sm:items-center border-b border-white/10 pb-5 gap-4">
                        <div className="flex items-baseline gap-3 flex-wrap">
                          <h2 className="text-xl font-bold text-white flex items-center gap-2"><Icons.Table/> КПП</h2>
                          <span className="text-[11px] font-mono text-zinc-500">
                            {(() => { const sh = new Set(scenes.map(s => s.date).filter(Boolean)).size;
                              return `${scenes.length} ${plur(scenes.length, 'сцена', 'сцены', 'сцен')} · ${sh} ${plur(sh, 'смена', 'смены', 'смен')}`; })()}
                          </span>
                        </div>
                        <div className="flex glass-panel p-1.5 rounded-lg border border-white/5">
                          <button onClick={() => setTableSubView('grouped')} title="Что снимаем в этот день и чем"
                                  className={`px-5 py-2 rounded-lg text-xs font-bold transition-all ${tableSubView === 'grouped' ? 'bg-indigo-600/60 text-white' : 'text-zinc-400 hover:text-white'}`}>По сменам</button>
                          <button onClick={() => setTableSubView('scenes')} title="Полный документ: экспликация, раскадровка, текст сцены"
                                  className={`px-5 py-2 rounded-lg text-xs font-bold transition-all ${tableSubView === 'scenes' ? 'bg-indigo-600/60 text-white' : 'text-zinc-400 hover:text-white'}`}>Все сцены</button>
                        </div>
                      </div>

                      {currentView === 'table' && sortedScenes.length === 0 && (
                        <div className="glass-panel rounded-lg border border-white/10 p-10 text-center text-sm text-zinc-500 leading-relaxed">
                          Сцен пока нет.<br />Заведите первую в разделе «Сцены» — или загрузите КПП и сценарий целиком через «···» → «Агент КПП».
                        </div>
                      )}

                      {currentView === 'table' && sortedScenes.length > 0 && (tableSubView === 'scenes' ? (
                        /* ВСЕ СЦЕНЫ — бывшая вкладка «Документ». Всё, что там
                           было (номер, название, дата, экспликация, раскадровка),
                           плюс текст сцены из сценария по кнопке. */
                        <div className="max-w-4xl mx-auto space-y-6">
                          {sortedScenes.map(s => {
                            const sceneFrames = storyboard.filter(f => f.sceneId === s.id);
                            const hasScript = !!(s.script || '').trim();
                            const scriptOpen = !!openScript[s.id];
                            return (
                              <div key={s.id} className="glass-panel p-6 md:p-8 rounded-lg space-y-5">
                                <div className="flex justify-between items-center border-b border-white/10 pb-4 relative z-10 gap-3">
                                  <span className="font-mono text-white font-extrabold text-sm md:text-lg">СЦЕНА #{s.number} | {s.title}</span>
                                  <span className="text-[11px] md:text-xs text-zinc-400 font-mono bg-black/50 px-3 py-1 rounded-lg border border-white/10 font-semibold shrink-0">{s.date ? formatDateDisplay(s.date) : 'Дата не назначена'}</span>
                                </div>
                                <p className="text-sm text-zinc-300 bg-black/30 p-4 rounded-lg border border-white/5 leading-relaxed relative z-10 font-medium" style={{ whiteSpace: 'pre-wrap' }}>{s.content || 'Описание отсутствует'}</p>

                                {/* Текст из сценария — по кнопке: он длиной со
                                    страницу и раскрытый у всех сцен разом
                                    превратил бы документ в рулон. */}
                                {hasScript && (
                                  <div className="relative z-10">
                                    <button onClick={() => setOpenScript(prev => ({ ...prev, [s.id]: !prev[s.id] }))}
                                            className="flex items-center gap-2 text-[11px] font-bold uppercase tracking-widest text-zinc-400 hover:text-white bg-white/5 hover:bg-white/10 border border-white/10 px-4 py-2.5 rounded-lg transition-colors">
                                      <Icons.Docs/> <span>{scriptOpen ? 'Скрыть текст сцены' : 'Текст сцены из сценария'}</span>
                                      <span className="text-zinc-500">{scriptOpen ? '▲' : '▼'}</span>
                                    </button>
                                    {scriptOpen && (
                                      <p className="mt-3 text-sm text-zinc-300 bg-black/40 p-5 rounded-lg border border-white/5 leading-relaxed font-medium" style={{ whiteSpace: 'pre-wrap' }}>{s.script}</p>
                                    )}
                                  </div>
                                )}

                                {sceneFrames.length > 0 && (
                                  <div className="space-y-3 pt-3 relative z-10">
                                    <span className="text-[11px] md:text-xs font-bold text-zinc-500 uppercase tracking-widest block ml-1">Раскадровка / План смены:</span>
                                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-4">
                                      {sceneFrames.map(frame => (
                                        <div key={frame.id} className="bg-black/40 rounded-lg border border-white/10 p-2.5 flex flex-col space-y-2">
                                          {/* Кадр стоит в пропорции проекта: раскадровка
                                              в 16:9 при анаморфе обещает не тот кадр. */}
                                          {frame.image && (<div className="bg-black/60 rounded-lg overflow-hidden border border-white/5"><img src={frame.image} style={{ width: '100%', aspectRatio: projectRatio, objectFit: 'cover', display: 'block' }} className="pointer-events-none" draggable="false" /></div>)}
                                          <div className="text-[11px] md:text-xs leading-tight flex flex-col space-y-1.5 p-1">
                                            <span className="font-mono text-indigo-400 font-bold bg-indigo-500/10 self-start px-2 py-0.5 rounded-md">{frame.frameNum}</span>
                                            <span className="text-zinc-400 font-medium line-clamp-4">{frame.description || '...'}</span>
                                          </div>
                                        </div>
                                      ))}
                                    </div>
                                  </div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      ) : (() => {
                        /* ПО СМЕНАМ — то же, что и было, плюс правка номера
                           и даты в строке и техника со светом по каждой сцене:
                           на площадке спрашивают «чем снимаем эту сцену»,
                           а не «сколько всего камер на смене». */
                        const grouped = {}; sortedScenes.forEach(s => { const dk = s.date || ''; if (!grouped[dk]) grouped[dk] = []; grouped[dk].push(s); });
                        const sortedDates = Object.keys(grouped).sort((a, b) => { if (!a) return 1; if (!b) return -1; return new Date(a) - new Date(b); });
                        const sumOf = (list, field) => { const acc = {}; list.forEach(s => { const m = s[field] || {}; Object.keys(m).forEach(k => { if (m[k] > 0) acc[k] = (acc[k] || 0) + m[k]; }); }); return acc; };
                        const totalChips = (sum, types, cls) => Object.entries(sum).map(([key, qty]) => {
                          const item = (types || {})[key] || { label: key };
                          return (<span key={key} className={`text-xs px-3 py-1 rounded-lg font-mono font-semibold flex items-center space-x-2 ${cls.chip}`}>
                                    <span>{item.label}</span>
                                    <span className={`font-extrabold text-white px-1.5 py-0.5 rounded-md ${cls.num}`}>{qty}</span>
                                  </span>);
                        });
                        return (
                          <div className="space-y-8">
                            {sortedDates.map(dateKey => {
                              const dayScenes = grouped[dateKey];
                              const camSum = sumOf(dayScenes, 'gear'), lightSum = sumOf(dayScenes, 'lightGear');
                              return (
                                <div key={dateKey || 'unassigned'} className="glass-panel rounded-lg overflow-hidden border-t border-white/10">
                                  <div className="bg-white/5 px-6 py-4 border-b border-white/10 flex flex-col md:flex-row md:items-center justify-between gap-4">
                                    <div className="flex items-center space-x-4">
                                      <span className="text-sm font-black text-indigo-300 font-mono tracking-wide">{dateKey ? `СМЕНА: ${formatDateDisplay(dateKey)}` : 'СЦЕНЫ ВНЕ СМЕН'}</span>
                                      <span className="text-zinc-600">|</span>
                                      <span className="text-xs font-bold text-zinc-300 bg-black/50 px-3 py-1 rounded-full border border-white/10">{dayScenes.length} {plur(dayScenes.length, 'сцена', 'сцены', 'сцен')}</span>
                                    </div>
                                    <div className="flex flex-col gap-2 md:items-end">
                                      {Object.keys(camSum).length > 0 && (
                                        <div className="flex flex-wrap items-center gap-2">
                                          <span className="text-[11px] text-zinc-400 uppercase font-bold tracking-wider mr-1">Итого техника:</span>
                                          {totalChips(camSum, gearTypes || DEFAULT_GEAR, { chip: 'bg-indigo-950/60 text-indigo-200', num: 'bg-indigo-600' })}
                                        </div>
                                      )}
                                      {Object.keys(lightSum).length > 0 && (
                                        <div className="flex flex-wrap items-center gap-2">
                                          <span className="text-[11px] text-zinc-400 uppercase font-bold tracking-wider mr-1">Итого свет:</span>
                                          {totalChips(lightSum, lightGearTypes || DEFAULT_LIGHT_GEAR, { chip: 'bg-amber-950/60 text-amber-200', num: 'bg-amber-700' })}
                                        </div>
                                      )}
                                    </div>
                                  </div>
                                  <div className="divide-y divide-white/5">
                                    {dayScenes.map(s => {
                                      const cam = gearLine(s.gear, gearTypes || DEFAULT_GEAR);
                                      const lig = gearLine(s.lightGear, lightGearTypes || DEFAULT_LIGHT_GEAR);
                                      return (
                                        <div key={s.id} className="p-5 flex flex-col md:flex-row md:items-start justify-between gap-4 hover:bg-white/5 transition-colors">
                                          <div className="flex items-start space-x-4 flex-1 min-w-0">
                                            {/* Номер правится прямо здесь: перенумеровать
                                                смену подряд удобнее, чем ходить по карточкам.
                                                Только через updateSceneNumber — он же
                                                переносит номера кадров раскадровки.
                                                cf-edit-only тут НЕЛЬЗЯ: он прячет элемент
                                                целиком, а в режиме просмотра номер сцены —
                                                как раз то, ради чего ссылку открывают.
                                                Править его там и так не дадут: у READ_ONLY
                                                все поля становятся pointer-events: none. */}
                                            <input type="text" value={s.number || ''} onChange={(e) => updateSceneNumber(s.id, e.target.value)}
                                                   placeholder="—" maxLength="12" title="Номер сцены — правится прямо здесь"
                                                   className={`shrink-0 mt-0.5 w-16 text-center font-mono font-black text-sm bg-black/40 px-2 py-2 rounded-lg border transition-colors focus:outline-none placeholder-zinc-600 ${duplicateNumbers[String(s.number || '').trim()] ? 'text-amber-300 border-amber-500/50' : 'text-indigo-400 border-white/10 hover:border-white/25 focus:border-indigo-400'}`} />
                                            <div className="space-y-1.5 min-w-0">
                                              <h4 className="text-sm font-bold text-white tracking-wide">{s.title || 'Без названия'}</h4>
                                              <p className="text-xs text-zinc-400 font-medium line-clamp-2 leading-relaxed max-w-3xl">{s.content || '...'}</p>
                                              {(cam || lig) && (
                                                <div className="flex flex-col gap-1 pt-1">
                                                  {cam && (<span className="text-[11px] font-mono text-zinc-400 leading-relaxed"><span className="text-indigo-400 font-bold uppercase">камера: </span>{cam}</span>)}
                                                  {lig && (<span className="text-[11px] font-mono text-zinc-400 leading-relaxed"><span className="text-amber-400 font-bold uppercase">свет: </span>{lig}</span>)}
                                                </div>
                                              )}
                                            </div>
                                          </div>
                                          {/* Дата — она же смена: поменял дату, и сцена
                                              уехала в другую группу. Это и есть перенос
                                              сцены на другой день. */}
                                          <input type="date" value={s.date || ''} onChange={(e) => updateScene(s.id, 'date', e.target.value)}
                                                 title="Дата смены — перенести сцену на другой день"
                                                 className="glass-input rounded-lg px-3 py-2 font-mono text-xs shrink-0 md:mt-0.5" />
                                        </div>
                                      );
                                    })}
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        );
                      })())}
                    </div>
                  </div>


                  {/* ЭКСПЛИКАЦИИ И ДОКУМЕНТЫ */}
                  <div className={`h-full w-full ${currentView === 'docs' ? 'block' : 'hidden'}`}>
                    <div className="flex flex-col lg:flex-row h-full max-w-7xl mx-auto p-4 md:p-6 gap-6 overflow-y-auto lg:overflow-hidden">
                      <div className="w-full lg:w-72 glass-panel p-5 rounded-lg flex flex-col shrink-0 relative border-t border-white/10 overflow-hidden">
                        <div className="space-y-4 overflow-y-auto hide-scrollbar pb-4 flex-1">
                          <div>
                              <span className="text-[11px] font-bold text-zinc-500 uppercase tracking-widest block mb-3 ml-2">Операторские Гайды</span>
                              {docs.map(doc => (
                                <div key={doc.id} className="group relative mb-2">
                                  <button onClick={() => {setActiveDocId(doc.id); setActiveSchemeId(null);}} className={`w-full text-left pl-4 pr-16 py-3 rounded-lg text-sm font-bold transition-all border ${activeDocId === doc.id && !activeSchemeId ? 'bg-indigo-600/30 text-white border-indigo-500/40' : 'text-zinc-400 border-transparent hover:bg-white/5'}`}>{doc.title}</button>
                                  {/* Документ можно вынести на доску и связать со сценой */}
                                  <button onClick={(e) => { e.stopPropagation(); if (doc.boardId === activeBoardId) removeDocFromBoard(doc.id); else putDocOnBoard(doc.id); }}
                                          title={doc.boardId === activeBoardId ? 'Убрать с доски — документ останется здесь' : 'Положить на текущую доску'}
                                          className="cf-edit-only absolute right-11 top-3 w-7 h-7 flex items-center justify-center rounded-lg transition-all"
                                          style={doc.boardId === activeBoardId
                                            ? { background: 'var(--accent)', color: 'var(--bg)' }
                                            : { color: 'var(--muted-2)' }}>
                                    <Icons.Board />
                                  </button>
                                  {docs.length > 1 && (<button onClick={(e) => { e.stopPropagation(); setConfirmAction({title:'Удалить документ?', message:'', onConfirm:()=> { const rem = docs.filter(d=>d.id !== doc.id); setDocs(rem); setActiveDocId(rem[0].id); deleteNetDoc('docs', doc.id); }})}} className="cf-edit-only absolute right-3 top-3 opacity-0 group-hover:opacity-100 hover:bg-red-500/20 text-zinc-500 hover:text-red-400 transition-all w-7 h-7 flex items-center justify-center rounded-lg text-xs"><Icons.Trash/></button>)}
                                </div>
                              ))}
                              <button onClick={() => { const nD = { id: `doc-${Date.now()}`, title: `Новый гайд`, content: '' }; setDocs([...docs, nD]); setActiveDocId(nD.id); setActiveSchemeId(null); syncDoc('docs', nD.id, nD); }} className="cf-edit-only w-full mt-2 py-3 glass-panel hover:bg-white/10 text-white rounded-lg text-xs font-bold transition-colors flex items-center justify-center gap-2"><span>+</span><span>Создать гайд</span></button>
                          </div>
                          <div className="pt-4 border-t border-white/10">
                              <span className="text-[11px] font-bold text-zinc-500 uppercase tracking-widest block mb-3 ml-2">Схемы Света</span>
                              {lightSchemes.map(sch => (
                                <div key={sch.id} className="group relative mb-2">
                                  <button onClick={() => {setActiveSchemeId(sch.id); setActiveDocId(null);}} className={`w-full text-left px-4 py-3 rounded-lg text-sm font-bold transition-all border flex items-center gap-2 ${activeSchemeId === sch.id ? 'bg-amber-600/30 text-amber-200 border-amber-500/40' : 'text-zinc-400 border-transparent hover:bg-white/5'}`}><Icons.Lightbulb/> <span className="truncate">{sch.title}</span></button>
                                  <button onClick={(e) => { e.stopPropagation(); setConfirmAction({title:'Удалить схему?', message:'Схема отвяжется от всех связанных сцен.', onConfirm:()=> { const rem = lightSchemes.filter(d=>d.id !== sch.id); setLightSchemes(rem); setActiveSchemeId(null); setActiveDocId(docs[0].id); deleteNetDoc('lightSchemes', sch.id); }})}} className="cf-edit-only absolute right-3 top-3 opacity-0 group-hover:opacity-100 hover:bg-red-500/20 text-zinc-500 hover:text-red-400 transition-all w-7 h-7 flex items-center justify-center rounded-lg text-xs"><Icons.Trash/></button>
                                </div>
                              ))}
                              <button onClick={() => { const nS = { id: `lsch-${Date.now()}`, title: `Схема света`, elements: [], drawData: '' }; setLightSchemes([...lightSchemes, nS]); setActiveSchemeId(nS.id); setActiveDocId(null); syncDoc('lightSchemes', nS.id, nS); }} className="cf-edit-only w-full mt-2 py-3 glass-panel hover:bg-white/10 text-amber-300 rounded-lg text-xs font-bold transition-colors flex items-center justify-center gap-2"><span>+</span><span>Новая схема</span></button>
                          </div>
                        </div>
                      </div>

                      {/* Текстовый документ */}
                      {activeDocId && !activeSchemeId && docs.find(d => d.id === activeDocId) && (() => {
                        const activeDoc = docs.find(d => d.id === activeDocId);
                        return (
                          <div className="flex-1 glass-panel p-6 md:p-8 rounded-lg flex flex-col space-y-6 lg:overflow-y-auto relative border-t border-white/10">
                            <input type="text" value={activeDoc.title} onChange={(e) => { const up = docs.map(d=>d.id===activeDoc.id?{...d,title:e.target.value}:d); setDocs(up); syncDoc('docs', activeDoc.id, up.find(d=>d.id===activeDoc.id)); }} className="font-serif bg-transparent text-2xl md:text-3xl font-bold w-full focus:outline-none text-white placeholder-zinc-600" placeholder="Заголовок гайда..." />
                            {/* Гайд ЧИТАЮТ, а не только пишут, и до этого его было нечем
                                дочитать: текст в полторы тысячи знаков — это
                                тысяча точек по высоте, а поле было 460, и вторая
                                половина пряталась во ВНУТРЕННЮЮ прокрутку.
                                В режиме просмотра она не работала вовсе
                                (у полей `pointer-events: none`), то есть гость
                                видел ровно первый экран гайда и всё. На телефоне
                                помещалась пятая часть.
                                Теперь текст разворачивается — тем же жестом, что
                                и текст сцены из сценария: свёрнутый показывает
                                начало, «развернуть» отдаёт его целиком, и дальше
                                прокручивается сама панель, как страница. */}
                            {(() => {
                              const open = !!docOpen[activeDoc.id];
                              const body = activeDoc.content || '';
                              // Длинный ли он — считаем по строкам и знакам, а не
                              // по высоте: замерять DOM ради подписи на кнопке
                              // значит перерисовывать экран на каждую букву.
                              const long = body.length > 700 || body.split('\n').length > 12;
                              return (
                                <div className={`flex flex-col ${open ? 'shrink-0' : ''}`}
                                     style={open ? null : { flex: '1 1 0%', minHeight: 0 }}>
                                  {READ_ONLY ? (
                                    // Гостю поле ввода не нужно вовсе, а неподвижное
                                    // поле с обрезанным текстом — это тупик: прокрутить
                                    // его нельзя. Обычный текст течёт вместе со страницей.
                                    <div className="w-full glass-input rounded-lg p-6 text-sm md:text-base leading-relaxed font-medium border border-white/10 overflow-y-auto"
                                         style={open ? { whiteSpace: 'pre-wrap', flexShrink: 0 } : { whiteSpace: 'pre-wrap', maxHeight: 420 }}>
                                      {body || 'Гайд пока пустой'}
                                    </div>
                                  ) : (
                                    <textarea value={body}
                                              ref={el => { if (el && open) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; } }}
                                              onChange={(e) => { const up = docs.map(d=>d.id===activeDoc.id?{...d,content:e.target.value}:d); setDocs(up); syncDoc('docs', activeDoc.id, up.find(d=>d.id===activeDoc.id)); }}
                                              className={`w-full glass-input rounded-lg p-6 text-sm md:text-base transition-shadow leading-relaxed resize-none font-medium border border-white/10 ${open ? '' : 'flex-1 min-h-[300px] lg:min-h-0'}`}
                                              style={open ? { overflow: 'hidden', flexShrink: 0 } : null}
                                              placeholder="Содержание документа..." />
                                  )}
                                  {long && (
                                    <button onClick={() => setDocOpen(prev => ({ ...prev, [activeDoc.id]: !prev[activeDoc.id] }))}
                                            className="self-start mt-2 cf-chip shrink-0">
                                      {open ? 'свернуть ⤡' : 'развернуть ⤢'}
                                    </button>
                                  )}
                                </div>
                              );
                            })()}
                            
                            <div className="space-y-4 border-t border-white/10 pt-6">
                              <div className="flex justify-between items-center px-1">
                                <span className="text-xs font-bold text-zinc-400 uppercase tracking-widest flex items-center gap-2"><Icons.User/> Состав съемочной группы</span>
                                <button onClick={() => { const nc = { id: `cr-${Date.now()}`, name: '', role: '', phone: '' }; setCrew([...crew, nc]); syncDoc('crew', nc.id, nc); }} className="cf-edit-only text-xs font-bold text-indigo-300 hover:text-white bg-indigo-600/30 hover:bg-indigo-600/50 px-4 py-2 rounded-lg transition-colors">+ Добавить участника</button>
                              </div>
                              <div className="glass-panel rounded-lg overflow-x-auto border border-white/5">
                                <table className="w-full min-w-[500px] text-left text-sm border-collapse">
                                  <thead><tr className="bg-white/5 text-zinc-400 text-[11px] uppercase tracking-widest font-bold border-b border-white/10"><th className="p-4 w-1/3">Имя Фамилия</th><th className="p-4 w-1/3">Цех / Должность</th><th className="p-4">Телефон / Контакт</th><th className="p-4 w-14"></th></tr></thead>
                                  <tbody className="divide-y divide-white/5 text-zinc-200">
                                    {crew.map(c => (
                                      <tr key={c.id} className="hover:bg-white/5 transition-colors">
                                        <td className="p-2"><input type="text" value={c.name} onChange={e => { const up = crew.map(cr=>cr.id===c.id?{...cr,name:e.target.value}:cr); setCrew(up); syncDoc('crew', c.id, up.find(cr=>cr.id===c.id)); }} className="bg-transparent w-full px-3 py-2 text-white focus:outline-none font-bold placeholder-zinc-600" placeholder="ФИО" /></td>
                                        <td className="p-2"><input type="text" value={c.role} onChange={e => { const up = crew.map(cr=>cr.id===c.id?{...cr,role:e.target.value}:cr); setCrew(up); syncDoc('crew', c.id, up.find(cr=>cr.id===c.id)); }} className="bg-transparent w-full px-3 py-2 text-zinc-400 font-medium focus:outline-none placeholder-zinc-600" placeholder="Роль" /></td>
                                        <td className="p-2"><input type="text" value={c.phone} onChange={e => { const up = crew.map(cr=>cr.id===c.id?{...cr,phone:e.target.value}:cr); setCrew(up); syncDoc('crew', c.id, up.find(cr=>cr.id===c.id)); }} className="bg-transparent w-full px-3 py-2 font-mono font-medium focus:outline-none placeholder-zinc-600" placeholder="+7..." /></td>
                                        <td className="p-2 text-center"><button onClick={() => { setCrew(crew.filter(cr=>cr.id!==c.id)); deleteNetDoc('crew', c.id); }} className="cf-edit-only w-8 h-8 flex items-center justify-center rounded-lg glass-panel hover:bg-white/10 text-zinc-400 hover:text-red-400 transition-colors mx-auto font-bold"><Icons.Trash/></button></td>
                                      </tr>
                                    ))}
                                  </tbody>
                                </table>
                              </div>
                            </div>
                          </div>
                        );
                      })()}
                      
                      {/* Схема света */}
                      {activeSchemeId && lightSchemes.find(s=>s.id === activeSchemeId) && (() => {
                          const sch = lightSchemes.find(s=>s.id === activeSchemeId);
                          return (
                            <div className="flex-1 glass-panel p-6 md:p-8 rounded-lg flex flex-col space-y-6 lg:overflow-y-auto relative">
                                <div className="flex justify-between items-center gap-4">
                                    <input type="text" value={sch.title} onChange={(e) => { const up = lightSchemes.map(s=>s.id===sch.id?{...s,title:e.target.value}:s); setLightSchemes(up); syncDoc('lightSchemes', sch.id, up.find(s=>s.id===sch.id)); }} className="font-serif bg-transparent text-2xl md:text-3xl font-bold w-full focus:outline-none text-white placeholder-zinc-600" placeholder="Название световой схемы..." />
                                    <button onClick={() => setDrawingSchemeId(sch.id)} className="cf-edit-only bg-amber-600/30 hover:bg-amber-500/50 text-amber-200 px-6 py-3 rounded-lg font-bold transition-colors shrink-0">Открыть графический редактор</button>
                                </div>
                                <div className="w-full aspect-video bg-black/70 rounded-lg border border-white/10 flex items-center justify-center overflow-hidden">
                                    {(sch.preview || sch.drawData) ? <img src={sch.preview || sch.drawData} className="w-full h-full object-contain" /> : <div className="text-zinc-500 flex flex-col items-center"><Icons.Lightbulb/><span className="mt-2 text-xs">Нажмите «Открыть графический редактор» для моделирования схемы</span></div>}
                                </div>
                                <div className="pt-4 border-t border-white/10">
                                    <span className="text-xs text-zinc-400 font-bold block mb-2">Привязано к сценам:</span>
                                    <div className="flex gap-2 flex-wrap">
                                        {scenes.filter(s=>s.lightSchemeId===sch.id).length > 0 
                                            ? scenes.filter(s=>s.lightSchemeId===sch.id).map(s=>(<span key={s.id} className="bg-indigo-950/60 px-3 py-1 rounded-lg text-xs font-mono text-indigo-300">Сцена #{s.number}</span>))
                                            : <span className="text-xs text-zinc-600">Схема не привязана ни к одной сцене</span>
                                        }
                                    </div>
                                </div>
                            </div>
                          );
                      })()}

                      {/* Правая колонка: Файлы */}
                      <div className="w-full lg:w-80 glass-panel p-6 rounded-lg shrink-0 space-y-8 relative border-t border-white/10">
                        {/* Печать — самая редкая работа на этом экране, поэтому
                            она свёрнута в один подпункт: раскрыл — и выбрал,
                            что печатать. Четыре кнопки в развёрнутом виде
                            занимали верх панели каждый день ради того, чем
                            пользуются раз в неделю. */}
                        <div className="space-y-3">
                          <button onClick={() => setPrintPanelOpen(v => !v)}
                                  title="Выбрать, что печатать"
                                  className="w-full flex items-center justify-between gap-2 px-4 py-3 rounded-lg glass-panel border border-white/10 hover:bg-white/10 transition-colors">
                            <span className="flex items-center gap-2 text-[11px] font-bold text-zinc-300 uppercase tracking-widest"><Icons.Print/> Печать и экспорт</span>
                            <span className="text-zinc-500 text-[11px] font-bold">{printPanelOpen ? '▲' : '▼'}</span>
                          </button>
                          {printPanelOpen && (() => {
                            const openDoc = docs.find(d => d.id === activeDocId);
                            const openScheme = lightSchemes.find(s => s.id === activeSchemeId);
                            const btn = "w-full py-3 rounded-lg text-sm font-bold tracking-wide transition-all flex items-center justify-center gap-2 border";
                            return (
                              <div className="space-y-2">
                                <button onClick={() => requestPrint('full')} className={`${btn} bg-zinc-800 hover:bg-zinc-700 text-white border-white/10`}>
                                  <Icons.Print/> <span>Весь план</span>
                                </button>
                                <button onClick={() => requestPrint('doc')} disabled={!openDoc || !!activeSchemeId}
                                        title={openDoc && !activeSchemeId ? `Печать: ${openDoc.title}` : 'Сначала откройте гайд слева'}
                                        className={`${btn} ${openDoc && !activeSchemeId ? 'bg-zinc-800 hover:bg-zinc-700 text-white border-white/10' : 'bg-zinc-900/60 text-zinc-600 border-white/5 cursor-not-allowed'}`}>
                                  <Icons.Docs/> <span className="truncate">Гайд{openDoc && !activeSchemeId ? `: ${openDoc.title}` : ''}</span>
                                </button>
                                <button onClick={() => requestPrint('scheme')} disabled={!openScheme}
                                        title={openScheme ? `Печать: ${openScheme.title}` : 'Сначала откройте схему света слева'}
                                        className={`${btn} ${openScheme ? 'bg-amber-900/40 hover:bg-amber-900/60 text-amber-100 border-amber-500/30' : 'bg-zinc-900/60 text-zinc-600 border-white/5 cursor-not-allowed'}`}>
                                  <Icons.Lightbulb/> <span className="truncate">Схема света{openScheme ? `: ${openScheme.title}` : ''}</span>
                                </button>
                                <button onClick={() => requestPrint('gear')} className={`${btn} bg-zinc-800 hover:bg-zinc-700 text-white border-white/10`}>
                                  <Icons.Video/> <span>Список техники</span>
                                </button>
                              </div>
                            );
                          })()}
                        </div>
                        <div className="space-y-4 pt-6 border-t border-white/10">
                          <span className="text-[11px] font-bold text-zinc-500 uppercase tracking-widest block ml-1">Файлы и документы проекта</span>
                          <div className="cf-edit-only border border-dashed border-white/20 hover:border-indigo-500/50 rounded-lg p-6 text-center bg-black/30 hover:bg-indigo-500/10 transition-all group">
                            <label className="text-xs font-bold text-zinc-400 group-hover:text-indigo-300 cursor-pointer block w-full h-full flex flex-col items-center gap-2">
                              <span className="opacity-60 group-hover:opacity-100 transition-opacity"><Icons.Folder/></span>
                              <span>Загрузить КПП или доки</span>
                              <input type="file" onChange={(e) => { const f = e.target.files[0]; e.target.value = ''; if (f) addProjectFile(f); }} accept=".pdf,.xlsx,.csv,.txt,.png,.jpg" className="hidden" />
                            </label>
                          </div>
                          <div className="space-y-3 max-h-[300px] overflow-y-auto pr-2 hide-scrollbar">
                            {projectFiles.map(file => (
                              <div key={file.id} className="glass-panel p-4 rounded-lg flex flex-col space-y-3 group hover:border-indigo-500/30 transition-colors border border-white/5">
                                <div className="truncate flex flex-col">
                                  <span className="text-sm text-zinc-200 truncate font-bold tracking-wide" title={file.name}>{file.name}</span>
                                  <span className="text-[11px] font-mono text-zinc-500 mt-0.5">{file.size}{file.full ? ` · ${CLOUD_NAMES[(file.cloud || {}).provider] || 'облако'}` : ''}</span>
                                </div>
                                <div className="flex gap-2 justify-end">
                                  {file.data && file.data !== '#'
                                    ? (<a href={file.data} download={file.name} className="flex-1 text-emerald-400 font-bold px-3 py-2 rounded-lg bg-emerald-500/10 hover:bg-emerald-500/20 transition-all text-center text-xs">Скачать</a>)
                                    : file.full
                                      ? (<a href={file.full} target="_blank" rel="noopener noreferrer" className="flex-1 text-emerald-400 font-bold px-3 py-2 rounded-lg bg-emerald-500/10 hover:bg-emerald-500/20 transition-all text-center text-xs">Скачать</a>)
                                      : null}
                                  {!file.full && file.data && file.data !== '#' && cloudCfg.provider && (
                                    <button onClick={() => sendFileToCloud(file)} title={`Отправить в ${CLOUD_NAMES[cloudCfg.provider]}`}
                                      className="cf-edit-only w-10 flex items-center justify-center text-zinc-500 hover:text-indigo-300 rounded-lg bg-black/50 hover:bg-white/10 transition-colors border border-white/5"><Icons.Cloud/></button>
                                  )}
                                  <button onClick={() => setConfirmAction({title:'Удалить файл?', message: '', onConfirm:()=>{ setProjectFiles(projectFiles.filter(f=>f.id!==file.id)); deleteNetDoc('projectFiles', file.id); }})} className="cf-edit-only w-10 flex items-center justify-center text-zinc-500 hover:text-red-400 font-bold rounded-lg bg-black/50 hover:bg-white/10 transition-colors text-xs border border-white/5"><Icons.Trash/></button>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                </div>

                {/* ЧАТ КОМАНДЫ */}
                {showChat && <div className="fixed inset-0 bg-black/70 z-40 md:hidden backdrop-blur-sm" onClick={() => setShowChat(false)}></div>}
                {/* overflow-hidden у ЗАКРЫТОГО чата обязателен: ширина
                    становится нулевой, но внутренние поля и крестик,
                    прижатый к правому краю, всё равно занимают место —
                    и краешек крестика торчал на экране телефона рядом
                    с шапкой, притворяясь чужой кнопкой. */}
                <div className={`cf-chat-drawer fixed inset-y-0 right-0 z-50 md:relative md:z-10 glass-panel flex flex-col h-full transition-transform duration-300 ease-out md:shadow-none md:border-l border-white/10 ${showChat ? 'translate-x-0 w-[85%] sm:w-80' : 'translate-x-full md:translate-x-0 w-0 border-none overflow-hidden'}`}>
                  
                  <div className="p-5 border-b border-white/10 space-y-4 bg-white/5 relative">
                    <button onClick={() => setShowChat(false)} className="md:hidden absolute top-4 right-4 w-8 h-8 flex items-center justify-center glass-panel rounded-full text-zinc-400 font-bold">✕</button>
                    <span className="text-[11px] font-bold text-zinc-500 uppercase tracking-widest block">Профиль участника</span>
                    <div className="flex flex-col gap-3">
                      <div className="glass-panel rounded-lg px-4 py-3 flex items-center border border-white/10">
                        <span className="text-zinc-300 mr-3"><Icons.User/></span>
                        <div className="flex flex-col">
                            <span className="text-sm font-extrabold text-white">{userName}</span>
                            <span className="text-xs text-indigo-400 font-bold">{userRole}</span>
                        </div>
                      </div>
                      <button onClick={() => setShowWelcome(true)} className="text-xs font-semibold text-zinc-500 hover:text-indigo-400 transition-colors text-left pl-1 underline decoration-zinc-700 hover:decoration-indigo-500 underline-offset-4">Изменить имя/роль</button>
                    </div>
                  </div>

                  <div className="flex-1 p-5 overflow-y-auto space-y-4 hide-scrollbar flex flex-col relative bg-black/30">
                    {messages.map(msg => {
                        const isMe = msg.senderId ? msg.senderId === clientId : (msg.senderName === userName && msg.senderRole === userRole);
                        return (
                          <div key={msg.id} className={`flex flex-col max-w-[85%] ${isMe ? 'self-end items-end' : 'self-start items-start'}`}>
                            <div className={`flex items-baseline space-x-1.5 mb-1 ${isMe ? 'flex-row-reverse space-x-reverse' : ''}`}>
                              <span className="text-[11px] font-extrabold text-zinc-400">{msg.senderName}</span>
                              <span className="text-[10px] text-zinc-500 font-mono font-semibold">{msg.senderRole}</span>
                            </div>
                            <div className={`px-4 py-2.5 rounded-lg text-[13px] font-medium leading-relaxed border ${isMe ? 'bg-indigo-500 text-[#1a1918] border-indigo-500/50 rounded-tr-sm' : 'glass-panel text-zinc-200 rounded-tl-sm border-white/10'}`}>
                              {msg.text}
                            </div>
                          </div>
                        );
                    })}
                    {messages.length === 0 && (
                        <div className="absolute inset-0 flex flex-col items-center justify-center text-zinc-600">
                            <span className="mb-2"><Icons.Chat/></span>
                            <span className="text-xs font-bold uppercase tracking-widest">Чат цеха</span>
                        </div>
                    )}
                  </div>

                  <div className="p-4 border-t border-white/10 bg-black/50">
                    <div className="flex glass-input rounded-lg p-1.5 transition-all">
                        <input type="text" value={chatInput} onChange={(e) => setChatInput(e.target.value)} onKeyDown={(e) => { if(e.key === 'Enter' && chatInput.trim()){ const nm = { id: `msg-${Date.now()}`, text: chatInput.trim(), senderId: clientId, senderName: userName, senderRole: userRole, timestamp: Date.now() }; if(db && user){ syncDoc('messages', nm.id, nm); } else { setMessages([...messages, nm]); } setChatInput(''); } }} className="flex-1 bg-transparent px-3 text-sm font-medium text-white focus:outline-none placeholder-zinc-500" placeholder="Сообщение..." />
                        <button onClick={() => { if(!chatInput.trim()) return; const nm = { id: `msg-${Date.now()}`, text: chatInput.trim(), senderId: clientId, senderName: userName, senderRole: userRole, timestamp: Date.now() }; if(db && user){ syncDoc('messages', nm.id, nm); } else { setMessages([...messages, nm]); } setChatInput(''); }} className="bg-indigo-500 hover:bg-indigo-400 text-[#1a1918] w-10 h-10 rounded-lg flex items-center justify-center transition-colors font-bold">↑</button>
                    </div>
                  </div>
                </div>
              </div>

              {/* ТАБ-БАР ТЕЛЕФОНА. Пять вкладок — предел, за которым подписи
                  перестают читаться: четыре главных модуля площадки и «Ещё»
                  для остального. Стоит в потоке, а не поверх содержимого:
                  плавающая панель на телефоне закрывает последнюю строку
                  списка, и до неё не долистать. */}
              {isPhone && (
                <nav className="cf-tabbar z-40">
                  {/* По ссылке на одну страницу в таб-баре не должно быть
                      кнопок в никуда: они уводили бы на пустой экран. */}
                  {[
                    { id: 'notion', label: 'Сцены', icon: <Icons.Scene /> },
                    { id: 'gallery', label: 'Галерея', icon: <Icons.Gallery /> },
                    { id: 'locations', label: 'Объекты', icon: <Icons.Place /> }
                  ].filter(t => CF_VIEWS.indexOf(t.id) >= 0).map(t => (
                    <button key={t.id} onClick={() => {
                              // Нажатие по вкладке, на которой уже стоишь,
                              // возвращает к списку — так работает любой
                              // телефон, и объяснять это не нужно.
                              if (currentView === t.id && t.id === 'notion') setPhoneSceneOpen(false);
                              setCurrentView(t.id); setShowChat(false); setPhoneSheet(null);
                            }}
                            className={`cf-tab ${currentView === t.id && !showChat ? 'on' : ''}`}>
                      {t.icon}<span>{t.label}</span>
                    </button>
                  ))}
                  <button onClick={toggleChat} className={`cf-tab relative cf-edit-only ${showChat ? 'on' : ''}`}>
                    <Icons.Chat /><span>Чат</span>
                    {unreadCount > 0 && (
                      <span className="absolute flex items-center justify-center font-bold rounded-full"
                            style={{ top: 0, right: '24%', minWidth: 14, height: 14, padding: '0 3px', fontSize: 9, background: 'var(--accent)', color: 'var(--bg)' }}>{unreadCount}</span>
                    )}
                  </button>
                  <button onClick={() => setPhoneSheet(phoneSheet === 'more' ? null : 'more')}
                          className={`cf-tab ${phoneSheet === 'more' ? 'on' : ''}`}>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
                    <span>Ещё</span>
                  </button>
                </nav>
              )}
              </div>

              {/* ШТОРКА СНИЗУ — вместо правой панели-вкладок и меню «···».
                  На телефоне панель сбоку съела бы весь экран, а выпадающее
                  меню у верхнего края не достаётся большим пальцем. */}
              {isPhone && phoneSheet && (
                <React.Fragment>
                  <div className="fixed inset-0 z-[255]" style={{ background: 'rgba(0,0,0,.5)' }} onClick={() => setPhoneSheet(null)} />
                  <div className="cf-sheet">
                    <div className="cf-sheet-grip" />
                    <div className="flex items-center gap-2 px-4 pt-2.5 pb-1">
                      <span style={{ fontSize: 11, letterSpacing: '.1em', textTransform: 'uppercase', color: 'var(--text)' }}>
                        {phoneSheet === 'more' ? 'Ещё' : phoneSheet === 'gear' ? 'Камера и техника'
                          : phoneSheet === 'light' ? 'Свет' : phoneSheet === 'sun' ? 'Объект и солнце' : 'Экспликация и замысел'}
                      </span>
                      <button onClick={() => setPhoneSheet(null)} className="ml-auto flex items-center justify-center"
                              style={{ width: 44, height: 44, border: '1px solid var(--border)', borderRadius: 10, color: 'var(--muted-2)', fontSize: 14 }}>✕</button>
                    </div>
                    {phoneSheet === 'more' && (
                      <div className="px-3 pb-4">
                        {navItems.filter(t => !['notion', 'gallery', 'locations'].includes(t.id)).map(t => (
                          <button key={t.id} onClick={() => { setCurrentView(t.id); setPhoneSheet(null); setShowChat(false); }}
                                  className="w-full flex items-center gap-3 px-3 rounded-lg transition-colors"
                                  style={{ minHeight: 48, fontSize: 14, color: currentView === t.id ? 'var(--accent)' : 'var(--text-2)' }}>
                            {t.icon}{t.label}
                          </button>
                        ))}
                        {!READ_ONLY && (
                          <React.Fragment>
                            <div style={{ borderTop: '1px solid var(--line)', margin: '6px 3px' }} />
                            {currentView === 'notion' && (
                              <React.Fragment>
                                <span className="cf-meta block px-3 pt-1 pb-1.5">Режим экрана сцены</span>
                                {SCENE_MODES.map(m => (
                                  <button key={m.id} onClick={() => { setSceneMode(m.id); setPhoneSheet(null); }}
                                          className="w-full flex items-center gap-3 px-3 rounded-lg"
                                          style={{ minHeight: 44, fontSize: 14, color: sceneMode === m.id ? 'var(--accent)' : 'var(--text-2)' }}>
                                    {sceneMode === m.id ? '●' : '○'} {m.label}
                                  </button>
                                ))}
                                <div style={{ borderTop: '1px solid var(--line)', margin: '6px 3px' }} />
                              </React.Fragment>
                            )}
                            <button onClick={() => { setPhoneSheet(null); setShowProjectModal(true); }}
                                    className="w-full flex items-center gap-3 px-3 rounded-lg" style={{ minHeight: 48, fontSize: 14, color: 'var(--text-2)' }}>
                              <Icons.Folder /> Проект
                            </button>
                            <button onClick={() => { setPhoneSheet(null); setShowShareModal(true); }}
                                    className="w-full flex items-center gap-3 px-3 rounded-lg" style={{ minHeight: 48, fontSize: 14, color: 'var(--text-2)' }}>
                              <Icons.Link /> Доступ
                            </button>
                            <button onClick={() => { setPhoneSheet(null); setShowAgentModal(true); }}
                                    className="w-full flex items-center gap-3 px-3 rounded-lg" style={{ minHeight: 48, fontSize: 14, color: 'var(--text-2)' }}>
                              <Icons.Bot /> Агент КПП
                            </button>
                          </React.Fragment>
                        )}
                      </div>
                    )}
                    {/* Содержимое остальных шторок собирает экран сцены —
                        там же, где живут списки техники и света. */}
                    {phoneSheet !== 'more' && phoneSheetBody}
                  </div>
                </React.Fragment>
              )}

              {/* РУКОПИСЬ С ДОСКИ, РАСШИФРОВАННАЯ В ТЕКСТ.
                  Показываем ДО того, как положить в гайд: почерк есть почерк,
                  и поправить одно слово здесь проще, чем потом искать его
                  в готовом документе. */}
              {ocrResult && (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[420] p-4">
                  <div className="cf-modal-box glass-panel rounded-lg p-6 max-w-lg w-full relative">
                    <button onClick={() => setOcrResult(null)} className="cf-modal-x w-8 h-8 flex items-center justify-center hover:bg-red-500/20 hover:text-red-400 rounded-full text-zinc-400 font-bold transition-colors">✕</button>
                    <h3 className="text-lg font-bold text-white mb-1">Рукопись прочитана</h3>
                    <p className="text-sm text-zinc-400 mb-3 leading-relaxed">Проверьте и поправьте прямо здесь — потом положите в гайд.</p>
                    <textarea value={ocrResult.text}
                              onChange={e => setOcrResult({ ...ocrResult, text: e.target.value })}
                              rows={10}
                              className="w-full glass-input rounded-lg px-4 py-3 text-sm leading-relaxed resize-y mb-4" />
                    <div className="flex flex-col gap-2">
                      <button onClick={ocrToDoc} className="w-full py-3 rounded-lg text-sm font-bold transition-colors"
                              style={{ background: 'var(--accent)', color: 'var(--bg)' }}>
                        Новым гайдом на доску
                      </button>
                      {docs.length > 0 && (
                        <div className="flex gap-2">
                          <select value={ocrResult.into} onChange={e => setOcrResult({ ...ocrResult, into: e.target.value })}
                                  className="glass-input rounded-lg px-3 py-2.5 text-sm flex-1 bg-zinc-900">
                            {docs.map(d => <option key={d.id} value={d.id}>{d.title}</option>)}
                          </select>
                          <button onClick={ocrAppend}
                                  className="px-4 py-2.5 glass-panel hover:bg-white/10 text-zinc-200 rounded-lg text-sm font-bold transition-colors whitespace-nowrap">
                            Дописать
                          </button>
                        </div>
                      )}
                      <button onClick={() => { if (navigator.clipboard) navigator.clipboard.writeText(ocrResult.text); showToast('Текст скопирован'); }}
                              className="w-full py-2.5 glass-panel hover:bg-white/10 text-zinc-300 rounded-lg text-xs font-bold transition-colors">
                        Скопировать текст
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* ПОВТОРНАЯ ЗАГРУЗКА КАРТИНОК */}
              {dupPrompt && (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[420] p-4">
                  <div className="cf-modal-box glass-panel rounded-lg p-6 max-w-md w-full relative">
                    <h3 className="text-lg font-bold text-white mb-2">Такие картинки уже есть</h3>
                    <p className="text-sm text-zinc-400 mb-3 leading-relaxed">
                      {dupPrompt.names.length === dupPrompt.total
                        ? `Все ${dupPrompt.total} выбранных файлов уже загружены в проект под теми же именами.`
                        : `${dupPrompt.names.length} из ${dupPrompt.total} файлов уже есть в проекте под теми же именами.`}
                    </p>
                    <div className="rounded-md p-3 mb-4 max-h-40 overflow-y-auto"
                         style={{ background: 'var(--bg)', border: '1px solid var(--border)' }}>
                      {dupPrompt.names.map((n, i) => (
                        <div key={i} className="truncate" style={{ fontSize: 11.5, color: 'var(--muted)', fontFamily: 'var(--font-mono)' }}>{n}</div>
                      ))}
                    </div>
                    <div className="flex flex-col gap-2">
                      <button onClick={() => dupPrompt.onResolve('skip')}
                              className="w-full py-3 rounded-lg text-sm font-bold transition-colors"
                              style={{ background: 'var(--accent)', color: 'var(--bg)' }}>
                        Пропустить повторы{dupPrompt.names.length < dupPrompt.total ? ` · загрузить ${dupPrompt.total - dupPrompt.names.length}` : ''}
                      </button>
                      <button onClick={() => dupPrompt.onResolve('all')}
                              className="w-full py-3 glass-panel hover:bg-white/10 text-zinc-300 rounded-lg text-sm font-bold transition-colors">
                        Загрузить всё равно
                      </button>
                      <button onClick={() => dupPrompt.onResolve('cancel')}
                              className="w-full py-2 text-zinc-500 hover:text-zinc-300 rounded-lg text-xs font-semibold transition-colors">
                        Отмена
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* МОДАЛЬНЫЕ ОКНА */}
              {/* ГДЕ ХРАНЯТСЯ ФОТОГРАФИИ.
                  Настройки лежат на устройстве, а не в комнате: это ключи
                  от личного облака, а в комнату пускают любого, у кого есть
                  код. Смотреть фотографии при этом может вся группа —
                  ссылки на файлы публичные. */}
              {showCloudModal && (() => {
                const p = cloudCfg.provider || '';
                const connected = p === 'nextcloud' ? !!(cloudCfg.server && cloudCfg.user) : !!cloudCfg.token;
                // Адрес возврата надо перенести в кабинет облака знак в знак.
                // На планшете выделять его пальцем мучительно, поэтому кнопкой.
                const copyRedirect = () => {
                  const v = cloudRedirect();
                  const done = () => showToast('Адрес скопирован');
                  navigator.clipboard.writeText(v).then(done).catch(() => {
                    const t = document.createElement('input');
                    t.value = v; document.body.appendChild(t); t.select();
                    document.execCommand('copy'); document.body.removeChild(t); done();
                  });
                };
                const redirectRow = (
                  <span className="flex items-start gap-2 mt-1">
                    <span className="font-mono text-indigo-300 break-all flex-1">{cloudRedirect()}</span>
                    <button onClick={copyRedirect}
                            className="shrink-0 text-[11px] font-bold px-2 py-1 rounded-md border border-white/10 text-zinc-300 hover:bg-white/10 transition-colors">
                      копировать
                    </button>
                  </span>
                );
                const field = (label, key, opts = {}) => (
                  <div className="mb-3">
                    <label className="text-xs text-zinc-400 font-semibold block mb-1.5 ml-1">{label}</label>
                    <input type={opts.secret ? 'password' : 'text'} value={cloudCfg[key] || ''}
                           onChange={(e) => patchCloud({ [key]: e.target.value.trim() })}
                           placeholder={opts.placeholder || ''} autoComplete="off" spellCheck="false"
                           className="w-full glass-input rounded-lg px-4 py-2.5 text-sm font-mono" />
                    {opts.hint && <p className="text-[11px] text-zinc-500 mt-1.5 ml-1 leading-relaxed">{opts.hint}</p>}
                  </div>
                );
                return (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[200] p-4">
                  <div className="cf-modal-box glass-panel rounded-lg p-6 md:p-8 max-w-lg w-full relative">
                    <button onClick={() => setShowCloudModal(false)} className="cf-modal-x w-8 h-8 flex items-center justify-center hover:bg-red-500/20 hover:text-red-400 rounded-full text-zinc-400 font-bold transition-colors">✕</button>
                    <h3 className="text-xl font-extrabold text-white mb-4 flex items-center gap-2"><Icons.Gallery /> Где хранить фотографии</h3>

                      {/* Раньше тут стояло «настройка запоминается на этом
                          устройстве, на другом её надо повторить» — и это
                          было главной причиной, по которой с планшета
                          облако выглядело неподключённым. Теперь настройка
                          живёт в комнате. */}
                      <p className="text-[12px] text-zinc-500">
                        {shareKeys
                          ? 'Настройка запоминается в комнате: подключили один раз — работает на всех устройствах, где открыт этот проект, и у всей группы. Кто знает код комнаты, тот получает и доступ к этой папке в облаке — выключить общий доступ можно в меню «Проект».'
                          : 'Сейчас настройка хранится только на этом устройстве (общие ключи выключены в меню «Проект»). На другом устройстве, откуда вы тоже загружаете фото, её придётся повторить.'}
                        {' '}Смотреть фотографии сможет вся группа — для этого ничего настраивать не надо.
                      </p>
                    </div>

                    <div className="grid grid-cols-2 gap-2 mb-5">
                      {[['', 'В проекте'], ['dropbox', 'Dropbox'], ['yandex', 'Яндекс.Диск'], ['nextcloud', 'Nextcloud']].map(([id, label]) => (
                        <button key={id} onClick={() => { patchCloud({ provider: id }); setCloudError(''); }}
                                className={`px-3 py-2.5 rounded-lg text-sm font-bold transition-colors border ${p === id ? 'bg-indigo-600/30 text-white border-indigo-500/40' : 'bg-transparent text-zinc-400 border-white/10 hover:bg-white/5'}`}>
                          {label}
                        </button>
                      ))}
                    </div>

                    {p === '' && (
                      <p className="text-[13px] text-zinc-400 leading-relaxed bg-black/30 p-4 rounded-lg border border-white/10">
                        Фотографии хранятся внутри проекта, как и раньше. Ничего настраивать не нужно.
                      </p>
                    )}

                    {p === 'dropbox' && (
                      <div>
                        <details className="mb-4 bg-black/30 rounded-lg border border-white/10 p-3">
                          <summary className="text-[13px] font-bold text-zinc-300 cursor-pointer">Как получить ключ приложения</summary>
                          <ol className="text-[12px] text-zinc-400 leading-relaxed mt-2 ml-4 list-decimal space-y-1">
                            <li>Откройте <span className="font-mono text-zinc-300">dropbox.com/developers/apps</span> и нажмите Create app.</li>
                            <li>Выберите Scoped access, затем App folder — приложение будет видеть только свою папку, а не весь ваш Dropbox.</li>
                            <li>На вкладке Permissions отметьте <span className="font-mono">files.content.write</span>, <span className="font-mono">files.content.read</span>, <span className="font-mono">sharing.write</span> и нажмите Submit.</li>
                            <li>На вкладке Settings в поле Redirect URIs впишите ровно этот адрес и нажмите Add:{redirectRow}</li>
                            <li>Оттуда же скопируйте App key и вставьте ниже.</li>
                          </ol>
                        </details>
                        {field('Ключ приложения (App key)', 'appKey', { placeholder: 'например, a1b2c3d4e5f6g7h' })}
                        {field('Папка в облаке', 'folder', { placeholder: 'CineFlow', hint: 'Если оставить пустым — папка CineFlow.' })}
                        <button onClick={connectDropbox}
                                className="w-full py-3 bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-200 rounded-lg text-sm font-extrabold transition-all mb-2">
                          {connected ? 'Подключить заново' : 'Подключить Dropbox'}
                        </button>
                      </div>
                    )}

                    {p === 'yandex' && (
                      <div>
                        <details className="mb-4 bg-black/30 rounded-lg border border-white/10 p-3">
                          <summary className="text-[13px] font-bold text-zinc-300 cursor-pointer">Как получить ClientID</summary>
                          <ol className="text-[12px] text-zinc-400 leading-relaxed mt-2 ml-4 list-decimal space-y-1">
                            <li>Откройте <span className="font-mono text-zinc-300">oauth.yandex.ru/client/new</span>.</li>
                            <li>Платформа — «Веб-сервисы». В поле Redirect URI впишите ровно этот адрес:{redirectRow}</li>
                            <li>В доступах отметьте «Яндекс.Диск REST API»: запись, чтение и информация о диске.</li>
                            <li>Скопируйте ClientID и вставьте ниже.</li>
                          </ol>
                        </details>
                        {field('ClientID приложения', 'clientId', { placeholder: '32 знака из кабинета Яндекса' })}
                        {field('Папка на Диске', 'folder', { placeholder: 'CineFlow', hint: 'Если оставить пустым — папка CineFlow.' })}
                        <button onClick={connectYandex}
                                className="w-full py-3 bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-200 rounded-lg text-sm font-extrabold transition-all mb-2">
                          {connected ? 'Подключить заново' : 'Подключить Яндекс.Диск'}
                        </button>
                      </div>
                    )}

                    {p === 'nextcloud' && (
                      <div>
                        <div className="mb-4 bg-amber-500/10 border border-amber-500/30 rounded-lg p-3">
                          <p className="text-[12px] text-amber-200 leading-relaxed">
                            Nextcloud по умолчанию не разрешает загрузку из браузера с чужого адреса. Если проверка связи не проходит, покажите администратору сервера эту строку: нужно разрешить запросы с <span className="font-mono break-all">{location.origin}</span> (заголовки CORS для WebDAV и OCS). У Dropbox и Яндекс.Диска такого ограничения нет.
                          </p>
                        </div>
                        {field('Адрес сервера', 'server', { placeholder: 'https://cloud.example.com' })}
                        {/* Показываем адрес, по которому приложение реально
                            пойдёт. Без «https://» адрес считается путём внутри
                            сайта, запрос уходит не туда, и ответ приходит
                            чужой — по нему причину не понять. */}
                        {(cloudCfg.server || '').trim() && (
                          <p className="text-[11px] text-zinc-500 -mt-1 mb-3 ml-1 break-all">
                            Обращаться будем к: <span className="font-mono text-zinc-400">{ncBase(cloudCfg)}</span>
                          </p>
                        )}
                        {field('Логин', 'user', { placeholder: 'ваш логин' })}
                        {field('Пароль приложения', 'pass', { secret: true, hint: 'Не основной пароль! Настройки → Безопасность → «Пароль приложения». Его можно отозвать, не меняя свой.' })}
                        {field('Папка', 'folder', { placeholder: 'CineFlow', hint: 'Если оставить пустым — папка CineFlow.' })}
                      </div>
                    )}

                    {p && (
                      <React.Fragment>
                        <div className="flex flex-wrap gap-2 mb-3">
                          <button onClick={checkCloud} disabled={!!cloudBusy}
                                  className="flex-1 py-2.5 glass-panel hover:bg-white/10 text-zinc-300 rounded-lg text-sm font-bold transition-colors border border-white/10 disabled:opacity-40"
                                  style={{ minWidth: 130 }}>
                            {cloudBusy === 'check' ? 'Проверяю...' : 'Проверить связь'}
                          </button>
                          <button onClick={runCloudTest} disabled={!!cloudBusy || !connected}
                                  title="Отправит пробную картинку и попробует открыть её по ссылке — как это сделает группа"
                                  className="flex-1 py-2.5 bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-200 rounded-lg text-sm font-bold transition-colors disabled:opacity-40"
                                  style={{ minWidth: 130 }}>
                            {cloudBusy === 'test' ? 'Проверяю...' : 'Проверить загрузку'}
                          </button>
                          {connected && (
                            <button onClick={disconnectCloud} disabled={!!cloudBusy}
                                    className="px-4 py-2.5 text-red-400 hover:text-white hover:bg-red-500/20 rounded-lg text-sm font-bold transition-colors border border-transparent disabled:opacity-40">
                              Отключить
                            </button>
                          )}
                        </div>

                        {/* Результат проверки по шагам: видно, где именно встало */}
                        {cloudTest && cloudTest.length > 0 && (
                          <div className="mb-3 bg-black/30 border border-white/10 rounded-lg p-3 space-y-2">
                            {cloudTest.map((s, i) => (
                              <div key={i} className="flex items-start gap-2">
                                <span className="shrink-0 font-bold" style={{ color: s.ok ? '#10b981' : '#f87171', lineHeight: 1.5 }}>
                                  {s.ok ? '✓' : '✕'}
                                </span>
                                <span className="min-w-0">
                                  <span className="block text-[13px] font-semibold text-zinc-200">{s.name}</span>
                                  {s.note && <span className="block text-[11px] text-zinc-500 break-all leading-relaxed">{s.note}</span>}
                                </span>
                              </div>
                            ))}
                            {cloudTest.length === 3 && cloudTest.every(s => s.ok) && (
                              <p className="text-[12px] text-emerald-300 pt-1">
                                Всё работает. Пробный файл <span className="font-mono">cineflow-test.jpg</span> остался в папке — его можно удалить, он больше не нужен.
                              </p>
                            )}
                          </div>
                        )}

                        {cloudError && (
                          <div className="mb-3 bg-red-500/10 border border-red-500/30 rounded-lg p-3">
                            <p className="text-[12px] text-red-200 leading-relaxed break-all">
                              <b>Что ответило облако:</b><br />{cloudError}
                            </p>
                          </div>
                        )}

                        {/* Перенос уже загруженного */}
                        <div className="bg-black/30 p-4 rounded-lg border border-white/10">
                          <p className="text-[13px] font-bold text-zinc-200 mb-1">Уже загруженные фотографии</p>
                          <p className="text-[12px] text-zinc-500 leading-relaxed mb-3">
                            {localRefs.length
                              ? `Внутри проекта лежит ${localRefs.length} шт. Их можно перенести в облако — в проекте останется превью, а сами файлы уедут в вашу папку. Фотографии при этом никуда не пропадают.`
                              : 'Всё, что есть в проекте, уже перенесено в облако.'}
                          </p>
                          {migrate ? (
                            <div>
                              <div className="h-1.5 rounded-full bg-white/10 overflow-hidden mb-2">
                                <div className="h-full transition-all" style={{ width: `${Math.round(migrate.done / Math.max(1, migrate.total) * 100)}%`, background: 'var(--accent)' }} />
                              </div>
                              <div className="flex items-center justify-between gap-3">
                                <span className="cf-meta">Перенесено {migrate.done} из {migrate.total}{migrate.failed ? ` · не вышло ${migrate.failed}` : ''}</span>
                                <button onClick={() => { migrateStop.current = true; }}
                                        className="text-xs text-zinc-400 hover:text-white px-3 py-1.5 rounded-lg border border-white/10">Остановить</button>
                              </div>
                            </div>
                          ) : (
                            <button onClick={migrateToCloud} disabled={!localRefs.length || !connected}
                                    className="w-full py-2.5 bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-200 rounded-lg text-sm font-bold transition-all disabled:opacity-40">
                              Перенести в облако ({localRefs.length})
                            </button>
                          )}
                        </div>
                      </React.Fragment>
                    )}
                  </div>
                </div>
                );
              })()}

              {/* РЕЖИМ ПРОСМОТРА — что происходит и как выйти.
                  Единственное окно, доступное при READ_ONLY: человеку,
                  которому прислали ссылку для просмотра, больше некуда
                  нажать, а «пустой проект без кнопок» выглядит поломкой. */}
              {showViewInfo && (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[200] p-4">
                  <div className="cf-modal-box glass-panel rounded-lg p-6 md:p-8 max-w-md w-full relative">
                    <button onClick={() => setShowViewInfo(false)} className="cf-modal-x w-8 h-8 flex items-center justify-center hover:bg-red-500/20 hover:text-red-400 rounded-full text-zinc-400 font-bold transition-colors">✕</button>
                    <h3 className="text-xl font-extrabold text-white mb-4">Это режим просмотра</h3>
                    <div className="text-sm font-medium text-zinc-300 leading-relaxed space-y-3 mb-6">
                      {CF_SNAPSHOT ? (
                        <React.Fragment>
                          <p>Вы открыли файл-снимок — копию проекта, сохранённую на один раз. Менять в нём ничего нельзя, и с облаком он не связан.</p>
                          <p>Чтобы вести свой проект, откройте само приложение: <span className="font-mono text-[12px] text-indigo-300 break-all">afalin8-ui.github.io/cineflow/</span></p>
                        </React.Fragment>
                      ) : (
                        <React.Fragment>
                          <p>Ссылку, по которой вы пришли, дали <b>для просмотра</b>: показать материалы, не давая их менять. Поэтому кнопок «Проект» и «Доступ» здесь нет, а поля не набираются — это не поломка.</p>
                          <p>Если вы хотели вести <b>свой</b> проект, откройте приложение по обычному адресу. Вы начнёте с чистого листа: свои сцены, своё облако для фотографий, свой ключ ИИ.</p>
                        </React.Fragment>
                      )}
                    </div>
                    {!CF_SNAPSHOT && (
                      <button onClick={() => { location.href = plainLink; }}
                              className="w-full py-3.5 rounded-lg text-sm font-extrabold transition-all"
                              style={{ background: 'var(--accent)', color: 'var(--bg)' }}>
                        Открыть своё приложение
                      </button>
                    )}
                    <p className="text-[11px] text-zinc-500 mt-3 leading-relaxed">
                      Тому, кто прислал ссылку: чтобы дать человеку само приложение, нужна ссылка из окна «Доступ» → «Дать человеку само приложение» — она без кода комнаты.
                    </p>
                  </div>
                </div>
              )}

              {showShareModal && (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[200] p-4">
                  <div className="cf-modal-box glass-panel rounded-lg p-8 max-w-md w-full relative">
                    <button onClick={() => setShowShareModal(false)} className="cf-modal-x w-8 h-8 flex items-center justify-center hover:bg-red-500/20 hover:text-red-400 rounded-full text-zinc-400 font-bold transition-colors">✕</button>
                    <h3 className="text-xl font-extrabold text-white mb-4 flex items-center gap-2"><Icons.Link/> Совместный доступ</h3>
                    <div className="text-sm font-medium text-zinc-300 leading-relaxed space-y-3 mb-6">
                      <p>Проект живёт в «комнате». Кто открыл ссылку с кодом комнаты — тот работает вместе с вами; кто открыл адрес без кода — получает свой пустой проект и ваших данных не видит.</p>
                      <p className="text-[12px] text-zinc-500">Значит, для бетатеста давайте людям адрес <span className="font-mono">без</span> кода — каждый начнёт с чистого листа. А своей группе присылайте ссылку-приглашение ниже.</p>
                    </div>
                    <div className="mb-4">
                      <label className="text-xs text-zinc-400 font-semibold block mb-1.5 ml-1">Код комнаты проекта</label>
                      <div className="flex gap-2">
                        <input type="text" defaultValue={appId} id="cf-room-input" className="flex-1 glass-input rounded-lg px-4 py-2.5 text-sm font-mono" />
                        <button onClick={() => { const v = document.getElementById('cf-room-input').value.trim(); if (v && v !== appId) { localStorage.setItem('cf_room', v); window.location.reload(); } }} className="bg-indigo-500 hover:bg-indigo-400 text-[#1a1918] text-xs font-bold px-4 rounded-lg transition-colors">Войти</button>

                        const url = URL.createObjectURL(new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' })); const a = document.createElement('a'); a.href = url; a.download = `CineFlow_Backup_${new Date().toISOString().split('T')[0]}.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);

                    <button onClick={() => setShowAgentModal(false)} className="cf-modal-x w-8 h-8 flex items-center justify-center hover:bg-red-500/20 hover:text-red-400 rounded-full text-zinc-400 font-bold transition-colors">✕</button>
                    <h3 className="text-xl font-extrabold text-white mb-4 flex items-center gap-2"><Icons.Bot/> Агент импорта: КПП и сценарий</h3>
                    
                    <div className="space-y-6">
                      <div className="bg-black/40 p-4 rounded-lg border border-white/10">

                        <label className="w-full bg-indigo-600/40 hover:bg-indigo-600/60 text-indigo-100 px-4 py-3 rounded-lg text-sm font-semibold transition-colors cursor-pointer flex items-center justify-center gap-2">
