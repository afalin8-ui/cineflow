                         className="glass-input w-full rounded-lg px-3 py-2.5 text-sm" />
                  {folders.length > 0 && (
                    <div className="flex gap-2 overflow-x-auto hide-scrollbar mt-2.5 pb-1">
                      <button onClick={() => setFolder('')} className={`cf-chip shrink-0 ${folder === '' ? 'cf-chip-accent' : ''}`}>Все · {refs.length}</button>
                      {folders.map(([f, n]) => (
                        <button key={f} onClick={() => setFolder(folder === f ? '' : f)}
                                className={`cf-chip shrink-0 flex items-center gap-1.5 ${folder === f ? 'cf-chip-accent' : ''}`}>
                          <Icons.Folder /> {f} · {n}
                        </button>
                      ))}
                    </div>
                  )}
                </div>

                <div className="flex-1 overflow-y-auto p-4" style={{ minHeight: 160 }}>
                  {refs.length === 0 ? (
                    <p className="text-[13px] text-zinc-500 px-1 py-6 text-center leading-relaxed">
                      Свободных референсов нет — все уже здесь.<br />Загрузить новые можно во вкладке «Галерея».
                    </p>
                  ) : shown.length === 0 ? (
                    <p className="text-[13px] text-zinc-500 px-1 py-6 text-center">По запросу ничего не нашлось.</p>
                  ) : (
                    <div className="grid gap-3" style={{ gridTemplateColumns: 'repeat(auto-fill, minmax(118px, 1fr))' }}>
                      {shown.map(r => {
                        const on = sel.includes(r.id);
                        return (
                          <button key={r.id} onClick={() => toggle(r.id)} title={r.label || ''}
                                  className="cf-ref-card rounded-lg overflow-hidden relative text-left transition-all"
                                  style={{ aspectRatio: '1 / 1', containIntrinsicSize: 'auto 118px',
                                           border: on ? '2px solid var(--accent)' : '1px solid var(--border)' }}>
                            <div className="absolute inset-0 bg-cover bg-center blur-md opacity-40" style={bgStyle(r.id, r.url)}></div>
                            {r.url
                              ? <img src={r.url} alt="" className="w-full h-full object-contain relative z-10 pointer-events-none" draggable="false" />
                              : <span className="absolute inset-0 flex items-center justify-center text-zinc-600 text-[11px]">без картинки</span>}
                            {on && (
                              <span className="absolute top-1.5 left-1.5 z-20 rounded-full flex items-center justify-center font-bold"
                                    style={{ width: 20, height: 20, background: 'var(--accent)', color: 'var(--bg)', fontSize: 11 }}>
                                {sel.indexOf(r.id) + 1}
                              </span>
                            )}
                            <span className="absolute bottom-0 left-0 right-0 z-20 px-1.5 py-1 truncate"
                                  style={{ background: 'rgba(0,0,0,.82)', fontSize: 10.5, color: 'var(--text-2)' }}>
                              {r.label || 'без подписи'}
                            </span>
                          </button>
                        );
                      })}
                    </div>
                  )}
                </div>

                <div className="p-4 flex items-center justify-between gap-3 shrink-0" style={{ borderTop: '1px solid var(--border)' }}>
                  <span className="cf-meta">{sel.length ? `выбрано ${sel.length}` : `показано ${shown.length} из ${refs.length}`}</span>
                  <div className="flex gap-2">
                    {sel.length > 0 && <button onClick={() => setSel([])} className="cf-chip shrink-0">Снять</button>}
                    <button onClick={done} disabled={!sel.length}
                            className="rounded-lg px-4 py-2 text-sm font-bold transition-colors disabled:opacity-40"
                            style={{ background: 'var(--accent)', color: 'var(--bg)' }}>
                      {actionLabel}{sel.length ? ` · ${sel.length}` : ''}
                    </button>
                  </div>
                </div>
              </div>
            </div>, document.body);
        };

        const TagInput = ({ ref_, hints, onAdd, narrow }) => {
          const [typed, setTyped] = useState('');
          const [open, setOpen] = useState(false);
          const [at, setAt] = useState(null);
          const inputRef = useRef(null);
          const list = open ? hints(typed, ref_.tags) : [];

          // Список подсказок рисуем ОТДЕЛЬНЫМ слоем поверх страницы, а не
          // внутри карточки: у карточки обрезка по краю (overflow-hidden плюс
          // пропуск отрисовки за экраном), и список в ней просто не было
          // видно. Отсюда position: fixed и портал в body.
          const place = () => {
            const el = inputRef.current; if (!el) return;
            const r = el.getBoundingClientRect();
            const w = Math.min(240, window.innerWidth - 16);
            const left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8));
            // У нижнего края экрана разворачиваем список вверх, иначе он
            // уедет за пределы окна и снова окажется невидим.
            const вверх = r.bottom > window.innerHeight - 160;
            setAt({ left, width: w,
                    top: вверх ? null : Math.round(r.bottom + 4),
                    bottom: вверх ? Math.round(window.innerHeight - r.top + 4) : null });
          };
          useEffect(() => {
            if (!open) return;
            place();
            // Пока список открыт, страница может уехать под ним — держим его
            // у поля. scroll слушаем с перехватом: прокручивается не окно,
            // а внутренняя область галереи.
            const on = () => place();
            window.addEventListener('scroll', on, true);
            window.addEventListener('resize', on);
            return () => { window.removeEventListener('scroll', on, true); window.removeEventListener('resize', on); };
          }, [open, typed]);

          const put = (v) => { onAdd(ref_, v); setTyped(''); setOpen(false); };
          return (
            <span className="inline-block">
              <input ref={inputRef} type="text" placeholder="+ тег" value={typed}
                onChange={e => { setTyped(e.target.value); setOpen(true); }}
                onFocus={() => setOpen(true)}
                onKeyDown={e => {
                  if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); put(typed); }
                  if (e.key === 'Escape') setOpen(false);
                }}
                // Закрываем с задержкой: без неё палец не успевает нажать
                // подсказку — поле теряет фокус раньше, чем срабатывает выбор.
                onBlur={() => setTimeout(() => { setOpen(false); if (typed.trim()) put(typed); }, 180)}
                className={`bg-transparent text-[11px] text-zinc-400 border-b border-white/10 focus:border-indigo-500 focus:outline-none min-w-0 ${narrow ? 'w-14 focus:w-24 transition-all' : 'w-24'}`} />
              {list.length > 0 && at && ReactDOM.createPortal(
                <div className="flex flex-wrap gap-1 p-1.5 rounded-lg cf-tag-hints"
                     style={{ position: 'fixed', left: at.left, width: at.width,
                              top: at.top === null ? undefined : at.top,
                              bottom: at.bottom === null ? undefined : at.bottom,
                              zIndex: 500, background: 'var(--panel-2)',
                              border: '1px solid var(--border)', boxShadow: '0 8px 24px rgba(0,0,0,.45)' }}>
                  {list.map(t => (
                    <button key={t} type="button" onMouseDown={e => e.preventDefault()} onClick={() => put(t)}
                            className="cf-chip shrink-0" style={{ fontSize: 11 }}>{t}</button>
                  ))}
                </div>, document.body)}
            </span>
          );
        };

        // ОТКУДА ВЗЯТЬ ФОТО — СПРАШИВАЕМ, А НЕ РЕШАЕМ ЗА ЧЕЛОВЕКА.
        // У кнопки «+ фото» стоял capture="environment", и телефон уходил
        // ПРЯМО В КАМЕРУ, минуя всякий выбор. На выезде это верно, а в
        // остальное время нужные кадры уже лежат в телефоне: их снимали
        // штатной камерой (она лучше), присылали в мессенджере, скачивали
        // с карт. Добраться до них было НЕЧЕМ — кнопка вела в одно место.
        //
        // Путей ТРИ, и различаются они атрибутами поля, а не подписью:
        //   камера     — accept="image/*" плюс capture, браузер открывает съёмку
        //   фотоплёнка — accept="image/*" без capture
        //   файлы      — ПЕРЕЧИСЛЕНИЕ РАСШИРЕНИЙ вместо image/*
        // Третье — не придирка. Safari открывает «Файлы» сразу только
        // тогда, когда из accept НЕ следует, что нужна картинка из
        // фотоплёнки: с image/* он всегда показывает свой список из трёх
        // пунктов, и кнопка «Файлы» вела бы ровно туда же, куда
        // «Фотоплёнка», — то есть врала бы. Расширения Safari при этом
        // толком не фильтрует, поэтому нефотографию отсекает уже
        // handleMultiFileUpload — и говорит об этом вслух.
        const PHOTO_SOURCES = [
          { key: 'cam',  label: 'Снять камерой', hint: 'откроется камера',
            accept: 'image/*', capture: 'environment' },
          { key: 'lib',  label: 'Фотоплёнка',    hint: 'снимки на устройстве',
            accept: 'image/*' },
          { key: 'file', label: 'Файлы',         hint: 'загрузки, облака, флешка',
            accept: '.jpg,.jpeg,.png,.heic,.heif,.webp,.gif,.avif,.bmp,.tif,.tiff' }
        ];
        const PHOTO_SOURCE_ICON = { cam: Icons.Camera, lib: Icons.Image, file: Icons.Folder };
        // СПРАШИВАЕМ ТОЛЬКО ТАМ, ГДЕ ЕСТЬ ИЗ ЧЕГО ВЫБИРАТЬ. У компьютера
        // нет ни фотоплёнки, ни камеры в том смысле, в каком они есть
        // у телефона: все три пути ведут в одно и то же окно выбора
        // файла, и список посреди дороги был бы лишним нажатием на
        // каждую загрузку — а референсы грузят пачками. Поэтому на
        // мыши открываем окно сразу, как было всегда.
        //
        // Считаем именно КАСАНИЕ, а не отсутствие мыши: iPad с клавиатурой
        // и трекпадом отвечает `(hover: hover)`, и по наведению мы отняли
        // бы выбор ровно у главного устройства.
        const TOUCH_DEVICE = (typeof navigator !== 'undefined' && navigator.maxTouchPoints > 0)
                          || (typeof window !== 'undefined' && 'ontouchstart' in window);

        // Плитка «+ фото» со списком источников. Своё состояние живёт
        // ВНУТРИ — как у TagInput: открытие меню не должно перерисовывать
        // всю ленту объектов.
        const PhotoSourcePicker = ({ onFiles, className, style, children, hint, title, multiple = true, cardTap }) => {
          // Что открыто и КАК показывать: на телефоне шторкой снизу
          // (до верха экрана большой палец не достаёт), на широком
          // экране — списком у самой кнопки.
          const [menu, setMenu] = useState(null);
          const btnRef = useRef(null);
          const inputs = useRef({});

          // Выбор файла браузер разрешает ТОЛЬКО из обработчика нажатия,
          // поэтому click() зовём прямо здесь и синхронно. Отложенный
          // через таймер вызов iPad считает всплывающим окном и молча
          // отклоняет — то же правило, что у окна печати.
          const pick = (key) => {
            const el = inputs.current[key];
            setMenu(null);
            // Сброс перед открытием: без него повторный выбор ТОГО ЖЕ
            // файла не даёт события change, и кнопка выглядит нерабочей.
            if (el) { el.value = ''; el.click(); }
          };

          const openMenu = (e) => {
            // Нажатие, которое зовёт доска сама (кнопка занимает всю карточку,
            // и настоящий click достаётся карточке), браузер не считает
            // жестом человека — окно выбора файла по нему не откроется.
            // Поэтому в таком случае ВСЕГДА показываем список: настоящее
            // нажатие по строке и откроет окно.
            if (!TOUCH_DEVICE && e && e.isTrusted !== false) { pick('lib'); return; }
            const phone = !!(window.matchMedia && window.matchMedia('(max-width: 699px)').matches);
            let at = null;
            if (!phone && btnRef.current) {
              const r = btnRef.current.getBoundingClientRect();
              const w = 240, h = 8 + PHOTO_SOURCES.length * 46;
              // У нижнего края экрана разворачиваем список вверх — иначе
              // он уедет за пределы окна и станет невидим, как когда-то
              // подсказки тегов.
              const вверх = r.bottom + h > window.innerHeight - 8;
              at = { width: w,
                     left: Math.max(8, Math.min(r.left, window.innerWidth - w - 8)),
                     top: вверх ? Math.max(8, Math.round(r.top - h - 4)) : Math.round(r.bottom + 4) };
            }
            setMenu({ phone, at });
          };

          const row = (s, phone) => {
            const Ico = PHOTO_SOURCE_ICON[s.key];
            return (
              <button key={s.key} type="button" onClick={() => pick(s.key)}
                      style={{ minHeight: phone ? 54 : 44, display: 'flex', alignItems: 'center', gap: 10,
                               width: '100%', textAlign: 'left', padding: phone ? '11px 12px' : '7px 10px',
                               borderRadius: phone ? 10 : 7, color: 'var(--text-2)', cursor: 'pointer',
                               // Подложка обязана отличаться от самой шторки: на
                               // одинаковом фоне строки читаются как текст, а не
                               // как кнопки, и человек не понимает, что нажимать.
                               background: phone ? 'var(--raised)' : 'transparent' }}>
                <span style={{ color: 'var(--accent)', display: 'flex', flexShrink: 0 }}><Ico /></span>
                <span style={{ minWidth: 0 }}>
                  <span style={{ display: 'block', fontSize: phone ? 14 : 12.5, color: 'var(--text)' }}>{s.label}</span>
                  <span style={{ display: 'block', fontSize: phone ? 11.5 : 10.5, color: 'var(--muted-2)' }}>{s.hint}</span>
                </span>
              </button>
            );
          };

          // Меню лежит в ОТДЕЛЬНОМ слое (портал в body), но React ведёт его
          // события по дереву КОМПОНЕНТОВ, а не по разметке: нажатие по строке
          // прилетало карточке доски, та забирала указатель себе — и до самой
          // строки доходил только pointerdown, а click доставался карточке.
          // Меню обязано глушить всё указательное у себя.
          const stop = {
            onPointerDown: (e) => e.stopPropagation(),
            onPointerMove: (e) => e.stopPropagation(),
            onPointerUp: (e) => e.stopPropagation(),
            onClick: (e) => e.stopPropagation()
          };

          return (
            <React.Fragment>
              <button ref={btnRef} type="button" onClick={openMenu} className={className} style={style} title={title}
                      {...(cardTap ? { 'data-card-tap': '1' } : {})}>
                {children}
                {/* Подпись только там, где выбор и правда есть: на мыши
                    она обещала бы камеру, которой нет. */}
                {hint && TOUCH_DEVICE && <span style={{ fontSize: 10, color: 'var(--border)' }}>{hint}</span>}
              </button>
              {PHOTO_SOURCES.map(s => (
                <input key={s.key} ref={el => { inputs.current[s.key] = el; }}
                       type="file" multiple={multiple} accept={s.accept}
                       {...(s.capture ? { capture: s.capture } : {})}
                       className="hidden"
                       onChange={(e) => onFiles(e.target.files)} />
              ))}
              {menu && ReactDOM.createPortal(
                menu.phone ? (
                  <React.Fragment>
                    <div className="fixed inset-0" style={{ zIndex: 300, background: 'rgba(0,0,0,.5)' }}
                         {...stop} onClick={(e) => { e.stopPropagation(); setMenu(null); }} />
                    <div className="cf-sheet" style={{ zIndex: 301 }} {...stop}>
                      <div className="cf-sheet-grip" />
                      <div className="flex items-center gap-2 px-4 pt-2.5 pb-1">
                        <span style={{ fontSize: 11, letterSpacing: '.1em', textTransform: 'uppercase', color: 'var(--text)' }}>Откуда взять фото</span>
                        <button onClick={() => setMenu(null)} className="ml-auto flex items-center justify-center"
                                style={{ width: 44, height: 44, border: '1px solid var(--border)', borderRadius: 10, color: 'var(--muted-2)', fontSize: 14 }}>✕</button>
                      </div>
                      <div className="px-3 pb-4 flex flex-col gap-2">{PHOTO_SOURCES.map(s => row(s, true))}</div>
                    </div>
                  </React.Fragment>
                ) : (
                  <React.Fragment>
                    <div className="fixed inset-0" style={{ zIndex: 300 }}
                         {...stop} onClick={(e) => { e.stopPropagation(); setMenu(null); }} />
                    <div {...stop} style={{ position: 'fixed', zIndex: 301, left: menu.at.left, top: menu.at.top, width: menu.at.width,
                                  background: 'var(--card)', border: '1px solid var(--border)', borderRadius: 10,
                                  boxShadow: '0 12px 32px rgba(0,0,0,.5)', padding: 4 }}>
                      {PHOTO_SOURCES.map(s => row(s, false))}
                    </div>
                  </React.Fragment>
                ), document.body)}
            </React.Fragment>
          );
        };

        // ПОИСК ПО ВСЕМУ ПРОЕКТУ (⌘K). Задача не «показать совпадения»,
        // а увести туда, где они лежат: главная жалоба была в том, что
        // человек помнит кадр, но не помнит, в каком из семи модулей его
        // искать. Поэтому каждая находка — это переход, а не карточка.
        // Ищем по словам-настроениям тоже: теги референсов входят в строку
        // поиска наравне с подписью.
        const SearchPalette = ({ scenes, references, locations, boards, docs, storyboard, onGo, onClose }) => {
          const [q, setQ] = useState('');
          const inputRef = useRef(null);
          useEffect(() => { if (inputRef.current) inputRef.current.focus(); }, []);
          const norm = (v) => String(v || '').toLowerCase();
          const hits = useMemo(() => {
            const needle = norm(q).trim();
            if (!needle) return [];
            const words = needle.split(/\s+/).filter(Boolean);
            const match = (hay) => words.every(w => hay.indexOf(w) !== -1);
            const out = [];
            const push = (kind, id, title, sub, go) => out.push({ kind, id, title, sub, go });
            scenes.forEach(s => {
              if (match(norm(`#${s.number} ${s.title} ${s.content} ${s.script}`)))
                push('Сцена', 'sc' + s.id, `#${s.number} · ${s.title || 'без названия'}`, (s.content || s.script || '').slice(0, 80), () => onGo('notion', { sceneId: s.id }));
            });
            storyboard.forEach(f => {
              const sc = scenes.find(s => s.id === f.sceneId);
              if (match(norm(`${f.frameNum} ${f.description}`)))
                push('Кадр', 'fr' + f.id, `${f.frameNum || 'кадр'} · ${(f.description || '').slice(0, 60)}`, sc ? `сцена #${sc.number}` : '', () => onGo('notion', { sceneId: f.sceneId }));
            });
            references.forEach(r => {
              if (match(norm(`${r.label} ${(r.tags || []).join(' ')} ${r.folder}`)))
                push('Кадр в галерее', 'rf' + r.id, r.label || 'без подписи', (r.tags || []).join(' · '), () => onGo('gallery', { refId: r.id }));
            });
            locations.forEach(l => {
              if (match(norm(`${l.name} ${l.address} ${l.description}`)))
                push('Объект', 'lc' + l.id, l.name || 'без названия', l.address || '', () => onGo('locations', { locationId: l.id }));
            });
            boards.forEach(b => {
              if (match(norm(b.title)))
                push('Доска', 'bd' + b.id, b.title || 'без названия', '', () => onGo('whiteboard', { boardId: b.id }));
            });
            docs.forEach(d => {
              if (match(norm(`${d.title} ${d.content}`)))
                push('Экспликация', 'dc' + d.id, d.title || 'без названия', (d.content || '').slice(0, 80), () => onGo('docs', { docId: d.id }));
            });
            return out.slice(0, 40);
          }, [q, scenes, references, locations, boards, docs, storyboard]);

          return (
            <div className="fixed inset-0 z-[450] flex items-start justify-center p-4 pt-[12vh]"
                 style={{ background: 'rgba(0,0,0,.55)' }} onClick={onClose}>
              <div className="w-full max-w-xl rounded-xl overflow-hidden cf-modal-box" onClick={e => e.stopPropagation()}
                   style={{ background: 'var(--card)', border: '1px solid var(--border)', boxShadow: '0 24px 64px rgba(0,0,0,.6)' }}>
                <div className="flex items-center gap-2.5 px-4" style={{ borderBottom: '1px solid var(--line)' }}>
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--muted-2)" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                  <input ref={inputRef} data-ro-ok type="text" value={q} onChange={e => setQ(e.target.value)}
                         onKeyDown={e => {
                           if (e.key === 'Escape') onClose();
                           if (e.key === 'Enter' && hits.length) { hits[0].go(); onClose(); }
                         }}
                         placeholder="Сцена, кадр, объект, доска… или слово-настроение: пыль, воздух"
                         className="flex-1 bg-transparent focus:outline-none"
                         style={{ padding: '14px 0', fontSize: 14, color: 'var(--text)' }} />
                  <button onClick={onClose} className="cf-kbd" style={{ color: 'var(--muted-2)' }}>esc</button>
                </div>
                <div className="overflow-y-auto" style={{ maxHeight: '52vh' }}>
                  {!q.trim() ? (
                    <p className="px-4 py-6 text-center" style={{ fontSize: 12.5, color: 'var(--muted-2)', lineHeight: 1.6 }}>
                      Ищет сразу везде: по номеру и названию сцены, по описанию кадра,<br />
                      по подписи и тегам референса, по объекту, доске и экспликации.
                    </p>
                  ) : hits.length === 0 ? (
                    <p className="px-4 py-6 text-center" style={{ fontSize: 12.5, color: 'var(--muted-2)' }}>Ничего не нашлось.</p>
                  ) : hits.map(h => (
                    <button key={h.kind + h.id} onClick={() => { h.go(); onClose(); }}
                            className="w-full text-left flex items-baseline gap-3 px-4 transition-colors hover:bg-white/5"
                            style={{ minHeight: 40, padding: '9px 16px', borderBottom: '1px solid var(--line)' }}>
                      <span className="cf-meta shrink-0" style={{ width: 104 }}>{h.kind}</span>
                      <span className="truncate" style={{ fontSize: 13, color: 'var(--text)' }}>{h.title}</span>
                      {h.sub && <span className="truncate hidden sm:block" style={{ fontSize: 11.5, color: 'var(--muted-2)' }}>{h.sub}</span>}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          );
        };

        function AppCore() {
          const [user, setUser] = useState(null);
          const [userName, setUserName] = useState('');
          const [userRole, setUserRole] = useState('');
          const [showWelcome, setShowWelcome] = useState(false);
          // Считается во время отрисовки, поэтому отказ хранилища здесь ронял
          // всё приложение прямо при запуске. Не запомнили номер — работаем
          // с временным: свои сообщения в чате перестанут узнаваться после
          // перезагрузки, и только.
          const clientId = useMemo(() => { let cid = null; try { cid = localStorage.getItem('cf_client_id'); } catch (e) {} if (!cid) { cid = 'u-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); try { localStorage.setItem('cf_client_id', cid); } catch (e) {} } return cid; }, []);
          const [isOnline, setIsOnline] = useState(navigator.onLine);
          // Сколько правок ещё не подтверждено облаком. Офлайн запись в
          // Firestore не отклоняется, а ждёт связи — по этому счётчику видно,
          // всё ли уже уехало на сервер (можно ли закрывать ноутбук).
          const [pendingWrites, setPendingWrites] = useState(0);
          // Настоящий счётчик живёт в ref, а состояние догоняет его не чаще
          // раза в 300 мс. Точка связи в шапке — вещь справочная, ей хватит;
          // а вот перерисовывать всё приложение на каждую запись и на каждое
          // подтверждение нельзя: на плохой связи правки уходят пачками
          // и подтверждаются вразнобой, и это давало десятки лишних
          // перерисовок в секунду поверх и без того тяжёлого жеста.
          const pendingRef = useRef(0);
          const pendingT = useRef(0);
          const bumpPending = (d) => {
            pendingRef.current = Math.max(0, pendingRef.current + d);
            if (pendingT.current) return;
            pendingT.current = setTimeout(() => {
              pendingT.current = 0;
              setPendingWrites(pendingRef.current);
            }, 300);
          };
          const trackWrite = (p) => {
            bumpPending(1);
            p.finally(() => bumpPending(-1));
            return p;
          };
          // Пока на доске идёт жест (панорама, щипок, перенос карточки),
          // тяжёлая местная копия ждёт. Ref, а не состояние: сама отметка
          // не должна ничего перерисовывать.
          const boardBusy = useRef(false);
          
          const safeLoad = (key, fallback, isArray = true) => {
            // В файле-снимке данные лежат прямо внутри страницы, а не
            // в localStorage: снимок должен открываться на чужом устройстве.
            if (CF_SNAPSHOT && CF_SNAPSHOT.data && CF_SNAPSHOT.data[key] !== undefined) return CF_SNAPSHOT.data[key];
            try {
              const saved = localStorage.getItem(key); if (!saved) return fallback;
              const parsed = JSON.parse(saved); 
              if (isArray) return Array.isArray(parsed) ? parsed : fallback;
              return (parsed !== null && typeof parsed === 'object') ? parsed : fallback;
            } catch (e) { return fallback; }
          };

          const [scenes, setScenes] = useState(() => safeLoad('cf_scenes', initialScenes, true));
          const sortedScenes = useMemo(() => [...scenes].sort((a, b) => String(a.number).localeCompare(String(b.number), undefined, {numeric: true})), [scenes]);
          // ПРАВДА О СПИСКЕ СЦЕН ЖИВЁТ ЗДЕСЬ, а не только в состоянии.
          // Каждая функция правки строила новый список от `scenes` из СВОЕГО
          // отрисовочного замыкания. Пока правка одна на нажатие, это верно;
          // но агент КПП применяет СПИСОК правок разом, и в одном такте вторая
          // затирала первую: полоска говорила «применено 2», а переезжала одна
          // сцена. Присваивание при отрисовке — тот же приём, что у viewRef
          // и inkDraw; сами функции правки дописывают сюда свой результат,
          // поэтому следующая в том же такте видит уже изменённый список.
          const scenesRef = useRef(scenes);
          scenesRef.current = scenes;
          const [storyboard, setStoryboard] = useState(() => safeLoad('cf_storyboard', [], true));
          // Ссылка объявляется ПОСЛЕ самого списка: обращение к нему выше
          // по файлу — это обращение к ещё не созданной переменной, то есть
          // белый экран при запуске (поймано проверкой в браузере).
          const storyboardRef = useRef(storyboard);
          storyboardRef.current = storyboard;
          const [references, setReferences] = useState(() => safeLoad('cf_references', [], true));
          const [stickies, setStickies] = useState(() => safeLoad('cf_stickies', [], true));
          const [docs, setDocs] = useState(() => safeLoad('cf_docs', initialDocs, true));
          const [crew, setCrew] = useState(() => safeLoad('cf_crew', [], true));
          const [projectFiles, setProjectFiles] = useState(() => safeLoad('cf_files', [], true));

          // --- Объекты (места съёмки со скаутинга) ---
          // Объект — это МЕСТО, а не сцена: одна и та же квартира снимается
          // в пяти сценах, и договариваться о ней надо один раз. Поэтому
          // связь со сценами хранится списком у объекта (`sceneIds`),
          // а не полем у сцены.
          // Фотографии со скаута — обычные референсы с полем `locationId`.
          // Отдельного хранилища картинок объекту НАМЕРЕННО не заведено:
          // иначе пришлось бы второй раз писать сжатие, теги, загрузку
          // в облако и полноэкранный просмотр — и они разъехались бы
          // при первой же правке. Заодно фото со скаута попадают в общую
          // галерею, где и должны быть.
          const [locations, setLocations] = useState(() => safeLoad('cf_locations', [], true));
          const [activeLocationId, setActiveLocationId] = useState(null);
          // Подсветка объекта, над которым держат файл. Без неё непонятно,
          // отпустят картинку «сюда» или мимо: у перетаскивания нет курсора,
          // который сам говорит, что цель приняла.
          const [dragOverLoc, setDragOverLoc] = useState(false);
          // То же самое для галереи: без подсветки непонятно, примут
          // картинку «сюда» или мимо — у перетаскивания нет курсора,
          // который сам сказал бы, что цель готова.
          const [dragOverGal, setDragOverGal] = useState(false);
          // Порядок — как отсняли на скауте, а не по алфавиту: переименование
          // объекта не должно перекладывать список под руками.
          const sortedLocations = useMemo(
            () => [...locations].sort((a, b) => (a.order || 0) - (b.order || 0)), [locations]);

          const [gearTypes, setGearTypes] = useState(() => safeLoad('cf_geartypes', DEFAULT_GEAR, false));
          const [lightGearTypes, setLightGearTypes] = useState(() => safeLoad('cf_lightgeartypes', DEFAULT_LIGHT_GEAR, false));
          const [lightSchemes, setLightSchemes] = useState(() => safeLoad('cf_lightschemes', [], true));

          // --- ДОСКИ ---
          // Раньше доска была одна: все стикеры, референсы и один общий
          // рисунок. Теперь досок несколько — у каждой свои стикеры,
          // свои референсы и свой холст.
          const DEFAULT_BOARD = { id: 'board-main', title: 'Основная', order: 0 };
          const [boards, setBoards] = useState(() => safeLoad('cf_boards', [DEFAULT_BOARD], true));
          const [activeBoardId, setActiveBoardId] = useState(() => localStorage.getItem('cf_active_board') || DEFAULT_BOARD.id);
          const sortedBoards = useMemo(() => {
            const list = (boards && boards.length) ? [...boards] : [DEFAULT_BOARD];
            return list.sort((a, b) => (a.order || 0) - (b.order || 0));
          }, [boards]);
          // Если выбранной доски больше нет (удалили на другом устройстве) —
          // возвращаемся на первую, иначе доска покажется пустой без причины.
          useEffect(() => {
            if (!sortedBoards.some(b => b.id === activeBoardId) && sortedBoards.length) {
              setActiveBoardId(sortedBoards[0].id);
            }
          }, [sortedBoards, activeBoardId]);
          // Место под местную копию на устройстве кончается, и тогда запись
          // БРОСАЕТ исключение. Здесь оно роняло ВСЁ приложение в аварийный
          // экран «Что-то пошло не так»: эффект выполняется на смене доски,
          // а ошибка из эффекта уходит прямиком в ErrorBoundary. Выглядело
          // это так: нажал «новая доска» — и приложения нет. Запомнить,
          // какая доска открыта, — не та задача, ради которой стоит терять
          // приложение, поэтому молча переживаем отказ.
          useEffect(() => { try { localStorage.setItem('cf_active_board', activeBoardId); } catch (e) {} }, [activeBoardId]);
          // Старые стикеры/референсы созданы без boardId — считаем их
          // принадлежащими первой доске, чтобы ничего не пропало.
          const belongsToBoard = (item, boardId) => (item.boardId || DEFAULT_BOARD.id) === boardId;

          // --- Сцены на доске ---
          // Доска — это текущая работа, поэтому карточку сцены с неё можно
          // снять, не трогая саму сцену. У сцены три состояния boardId:
          // поля нет вовсе — старая сцена, живёт на основной доске;
          // пустая строка — сняли руками, не показываем нигде;
          // id доски — лежит на ней. Пустую строку от отсутствия поля
          // отличаем намеренно: у стикеров (belongsToBoard) правило другое,
          // там пусто = основная доска, и смешивать их нельзя.
          const sceneOnBoard = (s, boardId) =>
            (s.boardId === undefined || s.boardId === null ? DEFAULT_BOARD.id : s.boardId) === boardId;
          const boardScenes = useMemo(() => sortedScenes.filter(s => sceneOnBoard(s, activeBoardId)), [sortedScenes, activeBoardId]);
          const offBoardScenes = useMemo(() => sortedScenes.filter(s => !sceneOnBoard(s, activeBoardId)), [sortedScenes, activeBoardId]);

          // Снять с доски. Связи с референсами (`sceneId` у референса) НЕ трогаем:
          // вернёте сцену на доску — пунктир нарисуется снова.
          const removeSceneFromBoard = (id) => {
            pushUndo(false, [{ coll: 'scenes', id }]);
            freezeArrowsForCards([id]);
            const up = scenes.map(s => s.id === id ? { ...s, boardId: '' } : s);
            setScenes(up);
            syncDoc('scenes', id, up.find(s => s.id === id));
            setSelectedWbItems(prev => prev.filter(x => x !== id));
            showToast('Убрано с доски · сцена осталась в проекте, вернуть — кнопкой «Сцена» слева');
          };

          // Положить на текущую доску, в видимую часть холста.
          const putSceneOnBoard = (id) => {
            const up = scenes.map(s => s.id === id ? { ...s, boardId: activeBoardId,
              x: (260 - canvasOffset.x) / zoom + Math.random() * 60,
              y: (240 - canvasOffset.y) / zoom + Math.random() * 60 } : s);
            setScenes(up);
            syncDoc('scenes', id, up.find(s => s.id === id));
            showToast('Сцена на доске');
          };

          const [messages, setMessages] = useState([]); 
          // Сколько раз облако присылало список сообщений (см. уведомления)
          const msgBatch = useRef(0);

          const [currentView, setCurrentView] = useState(
            READ_ONLY ? CF_VIEWS[0] : 'notion'
          ); 
          const [activeSceneId, setActiveSceneId] = useState('scene-1');
          const [activeDocId, setActiveDocId] = useState('doc-1');
          // Что открыто в карточке сцены: экспликация оператора или текст
          // сцены из сценария. Это разные тексты и живут в разных полях.
          const [showImages, setShowImages] = useState(true);
          const [showProjectModal, setShowProjectModal] = useState(false);
          const [showShareModal, setShowShareModal] = useState(false);
          const [showChat, setShowChat] = useState(false); 
          const [chatInput, setChatInput] = useState('');
          // КПП: какой из двух видов открыт — «По сменам» или «Все сцены».
          // Помним между запусками: рабочий вид у оператора один, второй
          // открывают изредка, и переключать его каждое утро незачем.
          const [tableSubView, setTableSubView] = useState(() => {
            try { return localStorage.getItem('cf_kpp_view') === 'scenes' ? 'scenes' : 'grouped'; } catch (e) { return 'grouped'; }
          });
          // Любая запись в localStorage — только внутри try: место на
          // устройстве кончается, и тогда setItem бросает исключение.
          useEffect(() => { try { localStorage.setItem('cf_kpp_view', tableSubView); } catch (e) {} }, [tableSubView]);
          // Текст сцены из сценария в виде «Все сцены» разворачивается ТОЛЬКО
          // по кнопке: он длиной со страницу, и раскрытый у всех сцен разом
          // документ пришлось бы прокручивать метрами. {id сцены: true}
          const [openScript, setOpenScript] = useState({});
          // Какой гайд развёрнут целиком в «Экспликациях». {id гайда: true}
          const [docOpen, setDocOpen] = useState({});
          // Развёрнут ли выбор «что печатать» в «Экспликациях».
          const [printPanelOpen, setPrintPanelOpen] = useState(false);
          const [toast, setToast] = useState(null);
          const [isAILoading, setIsAILoading] = useState(false);
          
          // ВСЕ «Удалить …?» проходят через эту дверь, и в режиме просмотра
          // она заперта. Кнопки правки помечаются `cf-edit-only` и не видны,
          // но пометить ЗАБЫВАЮТ — так из просмотра однажды удалили доску:
          // крестик на вкладке пометки не имел, и гость сносил доску себе
          // с экрана. В облако при этом не уходило ничего (syncDoc и
          // deleteNetDoc выходят по READ_ONLY), но человек видел, как чужой
          // проект разваливается у него на глазах, и не понимал, цел ли он.
          // Поэтому забытая кнопка теперь не срабатывает, а объясняется.
          // Молчать нельзя: нажатие без ответа читается как «сломалось».
          // `allowRO: true` — для того немногого, что гостю ПОЛОЖЕНО: чинить
          // свою же местную копию базы проект не меняет.
          const [confirmAction, _setConfirmAction] = useState(null);
          const setConfirmAction = (a) => {
            if (READ_ONLY && a && !a.allowRO) { showToast('Режим просмотра — менять проект нельзя'); return; }
            _setConfirmAction(a);
          };
          const [drawingFrameId, setDrawingFrameId] = useState(null);
          const [lightboxData, setLightboxData] = useState(null);
          const [showAgentModal, setShowAgentModal] = useState(false);
          const [manualJsonInput, setManualJsonInput] = useState('');
          // Разговор с агентом КПП. Живёт на сеанс и в облако НЕ уезжает:
          // это переписка одного человека с ИИ, а не общее содержимое проекта.
          const [agentChat, setAgentChat] = useState([]);
          const [agentInput, setAgentInput] = useState('');
          const [agentBusy, setAgentBusy] = useState(false);
          // Предложенные правки, которые ждут вашего «Применить».
          const [agentPlan, setAgentPlan] = useState(null);
          const [tagSearch, setTagSearch] = useState('');
          // Панель тегов в галерее: сворачивается в полоску 40px.
          const [galleryTagsOpen, setGalleryTagsOpen] = useState(true);
          // Папки референсов. Папка — просто поле folder у референса,
          // отдельной сущности нет: так ничего не рассинхронизируется,
          // и папка исчезает сама, когда из неё убрали последний файл.
          const [activeFolder, setActiveFolder] = useState('');
          // Мультивыбор в галерее. Объявлено здесь, до visibleRefs:
          // ниже по коду эти значения читаются прямо во время отрисовки.
          const [selectedRefIds, setSelectedRefIds] = useState([]);
          const [bulkTagInput, setBulkTagInput] = useState('');
          // Предупреждение о повторной загрузке картинок с теми же именами
          const [dupPrompt, setDupPrompt] = useState(null);
          const folderCounts = useMemo(() => {
            const m = {};
            references.forEach(r => { const f = (r.folder || '').trim(); if (f) m[f] = (m[f] || 0) + 1; });
            return Object.entries(m).sort((a, b) => a[0].localeCompare(b[0], 'ru'));
          }, [references]);
          const noFolderCount = useMemo(() => references.filter(r => !(r.folder || '').trim()).length, [references]);
          const moveToFolder = (ref, folder) => {
            const up = references.map(r => r.id === ref.id ? { ...r, folder } : r);
            setReferences(up);
            syncDoc('references', ref.id, up.find(r => r.id === ref.id));
          };

          // --- Массовые операции над выделенными референсами ---
          const toggleRefSelection = (id) => {
            setSelectedRefIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
          };
          const bulkPatchRefs = (patchFn, message) => {
            const up = references.map(r => selectedRefIds.includes(r.id) ? patchFn(r) : r);
            setReferences(up);
            selectedRefIds.forEach(id => { const f = up.find(r => r.id === id); if (f) syncDoc('references', id, f); });
            if (message) showToast(message);
          };
          const bulkAddTag = () => {
            const t = bulkTagInput.trim().toLowerCase(); if (!t) return;
            bulkPatchRefs(r => ({ ...r, tags: (r.tags || []).includes(t) ? r.tags : [...(r.tags || []), t] }),
                          `Тег «${t}» добавлен · ${selectedRefIds.length} шт.`);
            setBulkTagInput('');
          };
          const bulkMoveToFolder = (folder) => {
            bulkPatchRefs(r => ({ ...r, folder }), folder ? `Перемещено в «${folder}» · ${selectedRefIds.length} шт.` : `Убрано из папки · ${selectedRefIds.length} шт.`);
          };
          const bulkPutOnBoard = () => {
            let i = 0;
            bulkPatchRefs(r => ({ ...r, boardId: activeBoardId,
                                  x: (260 - canvasOffset.x) / zoom + (i % 5) * 210,
                                  y: (240 - canvasOffset.y) / zoom + Math.floor(i++ / 5) * 190 }),
                          `На доску добавлено ${selectedRefIds.length} шт.`);
          };
          // Кадр уходит из галереи НА СЦЕНУ и В ОБЪЕКТ, не уводя человека
          // с галереи. В этом и была главная боль: чтобы приложить кадр
          // к сцене, приходилось идти в сцену, вспоминать, как назывался
          // кадр, и искать его там заново. Теперь адресат — та сцена
          // (тот объект), которая выбрана, и её имя написано на кнопке.
          const bulkToScene = () => {
            const sc = scenes.find(x => x.id === activeSceneId);
            if (!sc) { showToast('Сначала выберите сцену'); return; }
            bulkPatchRefs(r => ({ ...r, sceneId: sc.id }), `На сцену #${sc.number} · ${selectedRefIds.length} шт.`);
            setSelectedRefIds([]);
          };
          const bulkToLocation = () => {
            const lc = locations.find(x => x.id === activeLocationId) || sortedLocations[0];
            if (!lc) { showToast('Объектов пока нет — заведите объект на экране «Объекты»'); return; }
            bulkPatchRefs(r => ({ ...r, locationId: lc.id, folder: (r.folder || '').trim() || (lc.name || '') }),
                          `В объект «${lc.name}» · ${selectedRefIds.length} шт.`);
            setSelectedRefIds([]);
          };

          // МЕТКА «СЦ 143» / «ОБ 07» на карточке галереи. Смысл — видеть,
          // что кадр уже пристроен, не открывая его: на общем листе
          // из четырёхсот картинок иначе не отличить «ещё не смотрел»
          // от «уже поставил в сцену».
          const refUsedLabel = (r) => {
            if (r.sceneId) {
              const sc = scenes.find(x => x.id === r.sceneId);
              if (sc) return 'сц ' + sc.number;
            }
            if (r.locationId) {
              const i = sortedLocations.findIndex(x => x.id === r.locationId);
              if (i >= 0) return 'об ' + String(i + 1).padStart(2, '0');
            }
            return '';
          };

          // Удаление референсов — ТОЛЬКО через эту дверь: она же кладёт
          // удалённое в корзину, откуда его можно вернуть. Потерять чужую
          // подборку из-за одного промаха по крестику слишком дорого.
          const undoTimer = useRef(null);
          const [undoBin, setUndoBin] = useState(null);
          const deleteRefs = (list) => {
            if (READ_ONLY) return;
            const items = (list || []).filter(Boolean);
            if (!items.length) return;
            const ids = items.map(r => r.id);
            freezeArrowsForCards(ids);
            setReferences(references.filter(r => !ids.includes(r.id)));
            ids.forEach(id => deleteNetDoc('references', id));
            setSelectedRefIds(sel => sel.filter(id => !ids.includes(id)));
            setUndoBin({ items });
            clearTimeout(undoTimer.current);
            undoTimer.current = setTimeout(() => setUndoBin(null), 15000);
          };
          const restoreRefs = () => {
            if (!undoBin) return;
            const items = undoBin.items;
            setReferences(prev => {
              const есть = new Set(prev.map(r => r.id));
              return [...prev, ...items.filter(r => !есть.has(r.id))];
            });
            items.forEach(r => syncDoc('references', r.id, r));
            clearTimeout(undoTimer.current);
            setUndoBin(null);
            showToast(items.length === 1 ? 'Референс возвращён' : `Возвращено ${items.length} шт.`);
          };
          const bulkDeleteRefs = () => {
            const ids = [...selectedRefIds];
            setConfirmAction({
              title: `Удалить ${ids.length} изображений?`,
              message: 'Выделенные референсы удалятся из проекта. Сразу после удаления их можно будет вернуть кнопкой.',
              onConfirm: () => deleteRefs(references.filter(r => ids.includes(r.id)))
            });
          };
          // Список тегов с количеством референсов у каждого.
          const tagCounts = useMemo(() => {
            const m = {};
            references.forEach(r => (r.tags || []).forEach(t => { m[t] = (m[t] || 0) + 1; }));
            return Object.entries(m).sort((a, b) => a[0].localeCompare(b[0], 'ru'));
          }, [references]);
          // Теги по ЧАСТОТЕ — для подсказок нужен именно такой порядок:
          // сверху то, чем реально размечают проект.
          const popularTags = useMemo(
            () => [...tagCounts].sort((a, b) => b[1] - a[1]).map(t => t[0]), [tagCounts]);
          // Что подсказать под полем ввода тега: совпадения по началу слова
          // впереди, уже проставленные у этого референса — прочь.
          const tagHints = (typed, already) => {
            const q = String(typed || '').trim().toLowerCase();
            const have = new Set((already || []).map(t => String(t).toLowerCase()));
            const list = popularTags.filter(t => !have.has(t));
            if (!q) return list.slice(0, 8);
            const starts = list.filter(t => t.startsWith(q));
            const inside = list.filter(t => !t.startsWith(q) && t.includes(q));
            return [...starts, ...inside].slice(0, 8);
          };
          const visibleRefs = useMemo(() => references.filter(r => {
            // Ищем и по тегу, и по подписи: человек пишет «пыль» и ждёт,
            // что найдётся всё, где это слово есть, — не важно, в теге оно
            // или в названии кадра.
            const q = tagSearch.trim().toLowerCase();
            const byTag = !q
              || (r.tags && r.tags.some(t => t.toLowerCase().includes(q)))
              || String(r.label || '').toLowerCase().includes(q);
            const f = (r.folder || '').trim();
            const byFolder = activeFolder === '' ? true : (activeFolder === '__none__' ? !f : f === activeFolder);
            return byTag && byFolder;
          }), [references, tagSearch, activeFolder]);
          const allVisibleSelected = visibleRefs.length > 0 && visibleRefs.every(r => selectedRefIds.includes(r.id));
          
          const [activeSchemeId, setActiveSchemeId] = useState(null);
          const [drawingSchemeId, setDrawingSchemeId] = useState(null);

          // --- Экспорт в PDF: что именно печатаем ---
          // 'full' — весь план, 'doc' — открытый гайд, 'scheme' — открытая
          // схема света, 'gear' — сводный список техники.
          const [printMode, setPrintMode] = useState('full');
          const [printRequested, setPrintRequested] = useState(false);
          // Приложение, установленное на домашний экран. Это НЕ мелочь для
          // печати: там window.print() не делает ВООБЩЕ ничего — печать живёт
          // в оболочке Safari, а оболочки в таком режиме нет. Кнопка нажимается,
          // и не происходит ничего, без единой ошибки.
          const isStandalone = () => {
            try {
              return window.navigator.standalone === true ||
                     (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
            } catch (e) { return false; }
          };
          // Окно под печать открываем ПРЯМО в обработчике нажатия и держим
          // здесь: всё, что открыто позже (после таймера), браузер считает
          // всплывающим окном и блокирует.
          const printWin = useRef(null);
          const PRINT_PAGE_CSS = `@page { margin: 14mm; }
            body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
                   color: #111; background: #fff; margin: 0; padding: 18px; }
            img { max-width: 100%; }
            .print-scene { page-break-inside: avoid; border-bottom: 1px solid #ccc; padding: 12px 0; }
            /* Объект НЕЛЬЗЯ держать на одной странице: у него бывает шесть
               десятков фотографий, и «не разрывать» на блоке выше страницы
               означает, что лишнее просто пропадает — отчёт уходит обрезанным
               и на глаз это заметно не сразу. Разрывать нельзя только сами
               карточки фотографий, отсюда .print-keep */
            .print-loc { border-bottom: 1px solid #ccc; padding: 12px 0; }
            .print-keep { page-break-inside: avoid; }
            .cf-hint { background: #fff4e5; border: 1px solid #f0c992; color: #6b4a12;
                       border-radius: 8px; padding: 10px 12px; margin: 0 0 16px;
                       font-size: 13px; line-height: 1.5; }
            @media print { .cf-hint { display: none !important; } body { padding: 0; } }`;

          // Собрать из #print-area отдельную готовую страницу. Оттуда печать
          // работает где угодно: в Safari это «Поделиться» → «Напечатать»,
          // там же «Сохранить в Файлы» даёт PDF.
          const openPrintPage = () => {
            const area = document.getElementById('print-area');
            const body = area ? area.innerHTML : '';
            if (!body.trim()) { showToast('Нечего печатать'); return; }
            const html = '<!doctype html><html lang="ru"><head><meta charset="utf-8">'
              + '<meta name="viewport" content="width=device-width, initial-scale=1">'
              + '<title>CineFlow — план</title><style>' + PRINT_PAGE_CSS + '</style></head><body>'
              + '<div class="cf-hint">Готовая страница для печати. Кнопка «Поделиться» → «Напечатать»; '
              + 'чтобы получить PDF — «Поделиться» → «Сохранить в Файлы».</div>'
              + body + '</body></html>';
            const w = printWin.current;
            printWin.current = null;
            if (w && !w.closed) {
              try {
                w.document.open(); w.document.write(html); w.document.close();
                showToast('Открыл готовую страницу · «Поделиться» → «Напечатать»');
                return;
              } catch (e) { /* ниже сохраним файлом */ }
            }
            // Окно не дали открыть — отдаём файлом. Открывается из «Файлов»
            // и печатается оттуда же.
            try {
              const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
              const a = document.createElement('a');
              a.href = url; a.download = 'CineFlow-план.html';
              document.body.appendChild(a); a.click(); a.remove();
              setTimeout(() => URL.revokeObjectURL(url), 4000);
              showToast('Сохранил страницу файлом — откройте её и напечатайте');
            } catch (e) { showToast('Не удалось подготовить печать'); }
          };

          // Печать запускаем только после того, как React перерисует
          // #print-area под выбранный режим, иначе уйдёт старое содержимое.
          useEffect(() => {
            if (!printRequested) return;
            let dead = false;
            (async () => {
              await new Promise(r => setTimeout(r, 120));
              // Печатать по НЕДОГРУЖЕННЫМ картинкам нельзя: в готовом PDF
              // на их месте будут пустые прямоугольники, и увидит это уже
              // тот, кому отчёт отправили. Ждём отрисовки, но не вечно.
              const area = document.getElementById('print-area');
              if (area) {
                const waiting = Array.from(area.querySelectorAll('img')).filter(i => !i.complete);
                if (waiting.length) await Promise.race([
                  Promise.all(waiting.map(i => new Promise(res => { i.onload = res; i.onerror = res; }))),
                  new Promise(r => setTimeout(r, 20000))
                ]);
              }
              if (dead) return;
              if (isStandalone()) openPrintPage(); else window.print();
              setPrintRequested(false); setPrintPhotos({});
            })();
            return () => { dead = true; };
          }, [printRequested, printMode]);
          // prep — необязательная подготовка (например, выкачать из облака
          // копии фотографий покрупнее). Окно печати на iPad ОБЯЗАНО
          // открыться прямо здесь, до всякого await: всё, что открыто после,
          // iPad считает всплывающим и блокирует.
          const requestPrint = (mode, prep) => {
            if (isStandalone()) {
              try { printWin.current = window.open('', '_blank'); } catch (e) { printWin.current = null; }
              if (prep && printWin.current) {
                try { printWin.current.document.write('<meta charset="utf-8"><p style="font:15px -apple-system,sans-serif;padding:24px">Готовлю фотографии…</p>'); } catch (e) {}
              }
            }
            setPrintMode(mode);
            if (!prep) { setPrintRequested(true); return; }
            Promise.resolve().then(prep).then(map => { setPrintPhotos(map || {}); setPrintRequested(true); })
                             .catch(() => setPrintRequested(true));
          };

          // Выкачать под печать копии покрупнее. Не ответило облако, нет
          // связи, нет ключа — молча остаёмся на превью: отчёт должен
          // собираться всегда, пусть и мягче.
          //
          // Три вещи, на которых держится скорость, и все три ничего не
          // отнимают у качества:
          //   1. тянем ПАРАЛЛЕЛЬНО. Время уходит не на байты, а на череду
          //      обращений к облаку: по одной шесть десятков фотографий
          //      ждут своей очереди по кругу;
          //   2. НЕ тянем то, чьё превью и так крупное (см. PRINT_MIN_PX);
          //   3. ПОМНИМ уже вытянутое до перезагрузки: второй экспорт того
          //      же объекта не должен качать то же самое заново.
          const PRINT_PARALLEL = 5;
          // Превью шире этого печатать уже не мешает: 1280 px на пол-листа
          // A4 — это ~370 dpi, лучше, чем нужно печати. Новые фотографии
          // кладутся именно такими, и для них облако не нужно вовсе.
          const PRINT_MIN_PX = 1100;
          const printCache = useRef(new Map());
          const preparePrintPhotos = async (refs) => {
            const cfg = loadCloudCfg();
            const out = {};
            const need = [];
            refs.forEach(r => {
              const had = printCache.current.get(r.id);
              if (had) { out[r.id] = had; return; }
              if (!r.full && !(r.cloud || {}).path) return;
              const sz = dataUrlJpegSize(r.url);
              if (sz && Math.max(sz.w, sz.h) >= PRINT_MIN_PX) return;
              need.push(r);
            });
            if (!cfg.provider || !need.length) return out;
            if (typeof navigator !== 'undefined' && navigator.onLine === false) {
              showToast('Связи нет — отчёт соберу из превью'); return out;
            }
            // Ключ Dropbox спрашиваем ОДИН раз: пять одновременных запросов
            // за ним подняли бы пять обновлений ключа сразу.
            let token = '';
            if (cfg.provider === 'dropbox') {
              try { token = await dropboxAccess(cfg); } catch (e) { token = ''; }
            }
            const keep = (id, url) => {
              printCache.current.set(id, url);
              // Кэш не должен расти без края: держим последние две сотни.
              if (printCache.current.size > 200) {
                printCache.current.delete(printCache.current.keys().next().value);
              }
              out[id] = url;
            };
            const one = async (r) => {
              try {
                const cl = r.cloud || {};
                // У Dropbox есть готовая копия нужного размера — это дёшево.
                if (cl.provider === 'dropbox' && cl.path && token) {
                  // Размер просим ПО ОРИЕНТАЦИИ. У Dropbox размеры фиксированы:
                  // альбомный кадр в рамку 1024×768 ложится ровно нужной
                  // ширины, а портрет в ней встаёт боком и выходит всего
                  // 768 точек в ширину — мягко. Портрету поэтому просим
                  // рамку вдвое больше и ужимаем у себя.
                  const sz = dataUrlJpegSize(r.url);
                  const box = (sz && sz.h > sz.w) ? 'w2048h1536' : 'w1024h768';
                  const blob = await dropboxThumb(cfg, cl.path, token, box);
                  if (blob) { keep(r.id, await fitPrintWidth(await blobToDataUrl(blob), PRINT_W)); return true; }
                }
                // У остальных облаков готовой копии не спросишь — тянем файл
                // и уменьшаем у себя. Дороже по трафику, зато работает везде.
                const direct = await cloudDirectUrl(r);
                if (!direct || direct === r.url) return false;
                const res = await fetch(direct);
                if (!res.ok) return false;
                const raw = await blobToDataUrl(await res.blob());
                const small = await new Promise(done => compressImage(raw, PRINT_PX, PRINT_PX, done, 0.85));
                keep(r.id, await fitPrintWidth(small, PRINT_W));
                return true;
              } catch (e) { console.warn('Печать: копия из облака не пришла', e); return false; }
            };
            let done = 0, bad = 0, streak = 0, next = 0;
            const worker = async () => {
              while (next < need.length) {
                // Облако не отвечает подряд — дальше не спрашиваем. У каждой
                // попытки свои повторы с паузой, и на шести десятках
                // фотографий упрямство стоило бы минут ожидания там, где
                // ответ уже ясен.
                if (streak >= PRINT_PARALLEL) { bad += need.length - next; next = need.length; break; }
                const r = need[next++];
                if (await one(r)) streak = 0; else { bad++; streak++; }
                showToast(`Фотографии из облака: ${++done} из ${need.length}…`);
              }
            };
            await Promise.all(Array.from({ length: Math.min(PRINT_PARALLEL, need.length) }, worker));
            if (bad) showToast(`Облако отдало ${need.length - bad} из ${need.length} — остальные из превью`);
            else showToast(`Готово: ${need.length} фото из облака`);
            return out;
          };

          // ОБЪЕКТ НА ПЕЧАТЬ — ОДИН блок и для отчёта по всем объектам,
          // и для выгрузки одного. Две вёрстки разъехались бы при первой же
          // правке, а заметил бы это тот, кому отчёт уже уехал.
          // solo — выгрузка одного объекта: заголовок даёт страница, а
          // фотографии идут крупнее, ради них её и открывают.
          const locationPrintBlock = (l, solo) => {
            const photos = locationPhotos(l.id);
            const linked = sortedScenes.filter(sc => (l.sceneIds || []).includes(sc.id));
            const notes = stickies.filter(st => st.locationId === l.id && (st.text || '').trim());
            const sch = lightSchemes.find(x => x.id === l.lightSchemeId);
            const c = parseCoords(l.coords);
            // Дни смены, а если их нет — сегодняшний: на скауте солнце нужно
            // именно сейчас, и пустая строка вместо него бесполезна.
            const dates = [...new Set(linked.filter(sc => sc.date).map(sc => sc.date))].sort();
            const days = c ? (dates.length ? dates : [new Date().toISOString().slice(0, 10)]) : [];
            const row = (label, value) => value
              ? <p style={{fontSize: '10.5pt', margin: '0 0 3pt'}}><b>{label}:</b> {value}</p> : null;
            const sunLine = days.map(dt => {
              const t = sunTimes(c.lat, c.lon, dt);
              if (!t) return null;
              const when = t.sun.polar === 'day' ? 'не садится'
                : t.sun.polar === 'night' ? 'не встаёт'
                : `${hhmm(t.sun.rise)} — ${hhmm(t.sun.set)}`;
              const gold = (!t.sun.polar && !t.golden.polar)
                ? ` · золотой час до ${hhmm(t.golden.rise)} и с ${hhmm(t.golden.set)}` : '';
              return `${formatDateDisplay(dt)}: ${when}${gold}`;
            }).filter(Boolean).join(' · ');
            return (
              <div className={solo ? '' : 'print-loc'} style={{marginBottom: solo ? 0 : '18pt'}}>
                {!solo && <h2 style={{fontSize: '15pt', fontWeight: 800, margin: '0 0 4pt'}}>{l.name || 'Без названия'}</h2>}
                {row('Адрес', l.address)}
                {row('Координаты', l.coords)}
                {row('Питание', l.power)}
                {row('Сцены', linked.length ? linked.map(sc => `#${sc.number} ${sc.title || ''}`.trim()).join(' · ') : '')}
                {row('Солнце', sunLine)}
                {!dates.length && sunLine && (
                  <p style={{fontSize: '9pt', color: '#777', margin: '0 0 3pt'}}>Смены у сцен нет — солнце на сегодня.</p>
                )}
                {row('Схема света', sch ? sch.title : '')}
                {l.description && <p style={{fontSize: '11pt', margin: '6pt 0 8pt', whiteSpace: 'pre-wrap', lineHeight: 1.5}}><b>Комментарий:</b> {l.description}</p>}
                {notes.length > 0 && (
                  <div style={{margin: '6pt 0 8pt'}}>
                    <p style={{fontSize: '10.5pt', margin: '0 0 3pt'}}><b>Заметки с выезда:</b></p>
                    <ul style={{margin: 0, paddingLeft: '14pt', fontSize: '10.5pt', lineHeight: 1.5}}>
                      {notes.map(st => <li key={st.id} className="print-keep" style={{whiteSpace: 'pre-wrap'}}>{st.text}</li>)}
                    </ul>
                  </div>
                )}
                {photos.length > 0 && (
                  <div style={{display: 'flex', flexWrap: 'wrap', gap: '8pt', marginTop: '6pt'}}>
                    {photos.map(ph => (
                      <div key={ph.id} className="print-keep" style={{width: solo ? '48%' : '31%', fontSize: '9pt'}}>
                        <img src={printPhotos[ph.id] || ph.url} style={{width: '100%', border: '1px solid #ccc'}} />
                        {ph.label && <div style={{marginTop: '2pt'}}>{ph.label}</div>}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          };

          // Сводка техники по всему проекту. Считаем максимум за одну сцену:
          // именно столько нужно взять в аренду (сумма по сценам завысила бы
          // — один и тот же стедикам работает в разных сценах).
          const gearSummary = useMemo(() => {
            const build = (field, types) => {
              const acc = {};
              scenes.forEach(s => {
                Object.entries(s[field] || {}).forEach(([k, v]) => {
                  if (!v) return;
                  if (!acc[k]) acc[k] = { label: ((types || {})[k] || { label: k }).label, peak: 0, scenes: [] };
                  acc[k].peak = Math.max(acc[k].peak, v);
                  acc[k].scenes.push(s.number);
                });
              });
              return Object.values(acc).sort((a, b) => a.label.localeCompare(b.label, 'ru'));
            };
            return { camera: build('gear', gearTypes), light: build('lightGear', lightGearTypes) };
          }, [scenes, gearTypes, lightGearTypes]);

          // Добавление тега к референсу. Раньше срабатывало только по Enter:
          // напечатал тег, кликнул мимо — тег молча пропадал, и поэтому
          // казалось, что «теги не сохраняются и поиск не работает».
          // Теперь тег принимается и по Enter, и по запятой, и при уходе фокуса.
          const addTagTo = (ref, value) => {
            if (READ_ONLY) return;
            const raw = String(value || '').trim().toLowerCase().replace(/,+$/, '').trim();
            if (!raw) return;
            const current = ref.tags || [];
            if (current.includes(raw)) return;
            const up = references.map(r => r.id === ref.id ? { ...r, tags: [...current, raw] } : r);
            setReferences(up);
            syncDoc('references', ref.id, up.find(r => r.id === ref.id));
          };
          const removeTagFrom = (ref, tag) => {
            if (READ_ONLY) return;
            const up = references.map(r => r.id === ref.id
              ? { ...r, tags: (r.tags || []).filter(t => t !== tag) } : r);
            setReferences(up);
            syncDoc('references', ref.id, up.find(r => r.id === ref.id));
          };
          const commitTag = (ref, inputEl) => {
            const v = inputEl.value; inputEl.value = '';
            addTagTo(ref, v);
          };

          // Переключатель «это панорама» вручную — последнее слово всегда
          // за человеком: метку в файл Insta360 кладёт не всегда, а ровно
          // 2:1 бывает и у обычного кадрированного снимка.
          // У фотографии, приехавшей как обычная, панорамного превью нет,
          // и без интернета крутить было бы нечего. Поэтому, если оригинал
          // лежит в облаке, готовим превью прямо сейчас — один раз.
          const setRefPano = async (ref, value) => {
            if (READ_ONLY) return;
            const up = references.map(r => r.id === ref.id ? { ...r, pano: !!value } : r);
            setReferences(up);
            syncDoc('references', ref.id, up.find(r => r.id === ref.id));
            if (!value || ref.panoUrl || !ref.full) return;
            try {
              showToast('Готовлю панораму для работы без интернета...');
              const res = await fetch(await cloudDirectUrl(ref));
              if (!res.ok) throw new Error('облако не отдало файл');
              const { panoUrl } = await makePanoAssets(await res.blob());
              if (!panoUrl) throw new Error('превью не собралось');
              setReferences(prev => {
                const n = prev.map(r => r.id === ref.id ? { ...r, panoUrl } : r);
                const t = n.find(r => r.id === ref.id);
                if (t) syncDoc('references', ref.id, t);
                return n;
              });
              showToast('Панорама готова, теперь открывается и без связи');
            } catch (e) {
              console.warn('Панорама: превью для офлайна не сделать', e);
              showToast('Смотреть можно, но без связи эта панорама не откроется');
            }
          };

          const [lastReadChat, setLastReadChat] = useState(() => Number(localStorage.getItem('cf_last_read')) || Date.now());
          const [newGearName, setNewGearName] = useState('');
          const [newLightGearName, setNewLightGearName] = useState('');

          const [wbMode, setWbMode] = useState('select'); 
          // Рамка «распознать рукопись». Ведём её в ref, как черновик фигуры:
          // за одно движение пальца прилетает десяток событий, и каждое
          // перерисовывало бы всё приложение вместе со списком сцен.
          const ocrDraft = useRef(null);
          const [ocrBusy, setOcrBusy] = useState(false);
          const [ocrResult, setOcrResult] = useState(null);
          const [brushColor, setBrushColor] = useState('#d97757'); 
          const [brushType, setBrushType] = useState('pen'); 
          // РАЗМЕРЫ КИСТИ — короткий набор, смещённый к ТОНКОМУ краю.
          // Был ползунок 2…32, и тонкая часть, которой пользуются почти
          // всегда, занимала пятую часть его хода: попасть пером в «4»
          // и не задеть «7» на планшете почти нельзя. Из шести размеров
          // половина — тонкие, а толстый остался для обводки референса.
          // Та же мысль, что у палитры из шести цветов: короткий набор
          // хороших значений вместо бесконечной точности.
          const BRUSH_SIZES = [2, 3, 4, 6, 10, 18];
          const [brushSize, setBrushSize] = useState(() => {
            try { const v = Number(localStorage.getItem('cf_brush')); return v > 0 ? v : 3; } catch (e) { return 3; }
          });
          // Любая запись в localStorage — только внутри try.
          useEffect(() => { try { localStorage.setItem('cf_brush', String(brushSize)); } catch (e) {} }, [brushSize]);
          const [canvasOffset, setCanvasOffset] = useState({ x: 0, y: 0 });
          const [zoom, setZoom] = useState(1.0);
          // --- ГДЕ ДОСКА СЕЙЧАС ---
          // Панорама и щипок меняют положение доски десятки раз в секунду.
          // Пока это лежало в состоянии React, КАЖДОЕ такое движение
          // перерисовывало всё приложение целиком — со списком сцен, всеми
          // карточками доски и панелями. На хорошей связи это ещё влезало
          // в кадр, а на плохой уже нет: библиотека облака в это время
          // переподключается, копается в своей базе на устройстве и
          // отъедает то самое время. Отсюда и «в онлайне ровно, а на
          // плохом интернете доска дёргается».
          //
          // Теперь во время жеста состояние МОЛЧИТ. Положение живёт здесь,
          // преобразование пишется прямо в узел, холст перерисовывается
          // как и раньше — по кадру. Состояние догоняет ОДИН раз, когда
          // палец оторвали: всё, что считает от него (новые карточки,
          // подпись «120 %»), продолжает работать без изменений.
          const viewRef = useRef({ x: 0, y: 0, z: 1 });
          const viewLive = useRef(false);
          // Присваивание во время отрисовки — намеренно, как у inkDraw ниже:
          // пока жеста нет, правда в состоянии; во время жеста — здесь,
          // и состояние её не перебивает. Поэтому ВСЕ, кто считает
          // координаты, обязаны смотреть сюда, а не в canvasOffset/zoom, —
          // иначе во время жеста они возьмут вчерашнее.
          if (!viewLive.current) {
            viewRef.current.x = canvasOffset.x;
            viewRef.current.y = canvasOffset.y;
            viewRef.current.z = zoom;
          }
          const applyView = (x, y, z) => {
            const v = viewRef.current;
            v.x = x; v.y = y; if (z !== undefined) v.z = z;
            viewLive.current = true;
            boardBusy.current = true;
            const el = canvasRef.current;
            if (el) el.style.transform = `translate(${v.x}px, ${v.y}px) scale(${v.z})`;
            requestStatic();
          };
          // Жест кончился — переносим положение в состояние. Один раз.
          const commitView = () => {
            if (!viewLive.current) return;
            viewLive.current = false;
            boardBusy.current = false;
            const v = viewRef.current;
            setCanvasOffset({ x: v.x, y: v.y });
            setZoom(v.z);
          };
          // У колеса мыши и щипка нет «отпускания», после которого можно
          // было бы записать положение, — поэтому по затишью.
          const viewCommitT = useRef(0);
          const commitViewSoon = () => {
            clearTimeout(viewCommitT.current);
            viewCommitT.current = setTimeout(commitView, 180);
          };
          const [isPainting, setIsPainting] = useState(false);
          const [isPanning, setIsPanning] = useState(false);
          const [panStart, setPanStart] = useState({ x: 0, y: 0 });
          // Щипок двумя пальцами по доске. Живёт в ССЫЛКАХ, а не в состоянии:
          // за один жест прилетают сотни событий, и перерисовывать на каждое
          // всю доску вместе с карточками нельзя. Наружу отдаём только
          // готовые zoom и canvasOffset — ровно как это делает панорама.
          const boardTouch = useRef(new Map());   // пальцы, лежащие на доске
          const pinchRef2 = useRef(null);         // что было в начале щипка
          // Пока не оторваны ВСЕ пальцы, ни рисование, ни перенос карточек
          // событий не получают: иначе после щипка остаётся случайная линия.
          const pinchLock = useRef(false);

          // Идёт ли сейчас штрих обратным концом стилуса
          const penErase = useRef(false);
          // Стилус на планшете. Как только человек хоть раз коснулся доски
          // пером, палец перестаёт рисовать и начинает двигать доску —
          // так устроены все рисовалки на iPad, и так ладонь не оставляет
          // клякс. Пока пера не видели, ничего не меняется: палец рисует,
          // как рисовал, иначе на устройстве без стилуса рисовать стало бы
          // нечем. Замеченный стилус помним между запусками — на iPad
          // приложение выгружается из памяти постоянно.
          const [penSeen, setPenSeen] = useState(() => { try { return localStorage.getItem('cf_pen_seen') === '1'; } catch (e) { return false; } });
          const [fingerPans, setFingerPans] = useState(() => { try { return localStorage.getItem('cf_pen_pan') !== '0'; } catch (e) { return true; } });
          const notePen = (e) => {
            if (e.pointerType !== 'pen' || penSeen) return;
            setPenSeen(true);
            try { localStorage.setItem('cf_pen_seen', '1'); } catch (err) {}
          };
          const toggleFingerPans = () => setFingerPans(v => {
            const next = !v;
            try { localStorage.setItem('cf_pen_pan', next ? '1' : '0'); } catch (e) {}
            return next;
          });
          // Обратный конец стилуса: браузер сообщает о нём отдельной кнопкой
          // (button 5 при касании, бит 32 в buttons — в том числе на весу).
          const isPenEraser = (e) => e.pointerType === 'pen' && (e.button === 5 || (e.buttons & 32) === 32);

          // --- ДВИЖОК КИСТИ ---
          // Штрихи хранятся ВЕКТОРОМ — списком точек, а не картинкой.
          // Раньше линия писалась прямо в холст 4000×4000, растянутый на всю
          // доску: на планшете, где в одной точке CSS сидят две-три настоящие,
          // и тем более при увеличении браузеру нечего было показать, кроме
          // растянутого пикселя. Отсюда и мыло, и рваный край — сколько ни
          // улучшай форму штриха, растр остаётся растром. Теперь холст
          // размером с ОКНО, рисуем в него по-настоящему мелко
          // (devicePixelRatio) и заново на каждый шаг зума: линия резкая при
          // любом увеличении, как в Excalidraw. Побочно вектор даёт даром
          // три вещи: отсечение невидимого, дешёвую отмену и ластик, который
          // режет линии, а не выедает дырки в картинке.
          // Точек в одном штрихе. Это не предел длины линии: набрав их,
          // штрих ЗАКРЫВАЕТСЯ и тут же продолжается новым от той же точки —
          // для человека линия остаётся одной.
          const INK_MAX = 1200;
          const INK_LEAD = 0.575;             // «поводок» за указателем, см. ниже
          const brushAlpha = (type) => type === 'marker' ? 0.32 : (type === 'soft' ? 0.5 : 1.0);
          const brushWidthK = (type) => type === 'soft' ? 1.7 : 1;
          // Насколько нажим меняет толщину. У маркера почти не меняет —
          // у настоящего маркера ширина задана пером, а не рукой.
          const brushThin = (type) => type === 'marker' ? 0.12 : (type === 'soft' ? 0.34 : 0.62);

          // Нажим в точке. У пера настоящий, у мыши и пальца считаем по
          // скорости: ведут быстро — след тоньше. Сглаживание обязательно,
          // иначе толщина скачет от события к событию.
          const inkPress = (prev, dist, size, dev) => dev != null
            ? prev + (dev - prev) * 0.5
            : prev + (Math.min(1, 1 - Math.min(1, dist / Math.max(1, size))) - prev) * 0.275;

          // КОНТУР штриха. Главная мысль (она же у perfect-freehand, на
          // котором рисует Excalidraw): рисуем не «линию с толщиной», а
          // замкнутую ФИГУРУ, обведённую по обе стороны от пути, где у каждой
          // точки свой радиус. Только так получаются и живой нажим, и гладкие
          // изломы, и сход на нет у концов: линия с lineWidth так не умеет
          // в принципе — у неё одна толщина на весь отрезок.
          // jn — стыки: бит 1 «не сужать начало», бит 2 «не сужать конец».
          // Нужны там, где длинная линия разрезана на куски: без этого на
          // каждом стыке линия схлопывалась бы в ноль и снова расширялась.
          const inkOutline = (pts, size, thin, jn) => {
            const n = pts.length;
            if (!n) return [];
            const R = size / 2;
            const circle = (cx, cy, r) => {
              const out = [];
              for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2; out.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
              return out;
            };
            if (n === 1) return circle(pts[0][0], pts[0][1], Math.max(0.6, R * 0.7));

            // Шаги и пройденный путь — нужны для сужения у концов.
            const step = [0], run = [0];
            for (let i = 1; i < n; i++) {
              step[i] = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
              run[i] = run[i - 1] + step[i];
            }
            const total = run[n - 1] || 0;
            // Начало набирает ширину, конец её теряет. Именно сход на нет
            // отличает живую линию от сардельки. Хвост длиннее носа —
            // так ведёт себя перо, когда его отрывают от бумаги.
            const tS = ((jn || 0) & 1) ? 0 : Math.min(size * 1.2, total * 0.35);
            const tE = ((jn || 0) & 2) ? 0 : Math.min(size * 2.2, total * 0.45);
            const rad = [];
            for (let i = 0; i < n; i++) {
              const r = R * 2 * (0.5 - thin * (0.5 - pts[i][2]));
              const a = tS > 0 ? Math.min(1, run[i] / tS) : 1;
              const b = tE > 0 ? Math.min(1, (total - run[i]) / tE) : 1;
              const k = Math.min(a * (2 - a), 1 - Math.pow(1 - b, 3));
              rad[i] = Math.max(0.35, r * Math.max(0.06, k));
            }

            const L = [], Rt = [];
            const add = (p, dx, dy, r) => { L.push([p[0] - dy * r, p[1] + dx * r]); Rt.push([p[0] + dy * r, p[1] - dx * r]); };
            const dir = (a, b) => { const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy); return l < 1e-6 ? null : [dx / l, dy / l]; };
            let last = null, first = null;
            for (let i = 0; i < n; i++) {
              const din = i > 0 ? (dir(pts[i - 1], pts[i]) || last) : null;
              const dout = i < n - 1 ? dir(pts[i], pts[i + 1]) : null;
              const a = din || dout, b = dout || din;
              if (!a || !b) continue;
              if (!first) first = a;
              last = b;
