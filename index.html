                                      </select>
                                      {scheme && (
                                        <button onClick={() => { setActiveSchemeId(scheme.id); setActiveDocId(null); setCurrentView('docs'); }}
                                                className="shrink-0 rounded-lg px-3 text-xs font-semibold"
                                                style={{ minHeight: 32, background: 'var(--raised)', color: 'var(--text-2)' }}>Открыть</button>
                                      )}
                                    </div>
                                  </div>
                                </div>
                              )}

                              {scenePanel === 'sun' && (
                                <div className="px-4 pb-4 pt-1">
                                  {!loc ? (
                                    <p style={{ fontSize: 12.5, color: 'var(--muted-2)', lineHeight: 1.6 }}>
                                      Сцена не привязана к объекту. Привязка живёт на экране «Объекты»: там у объекта отмечают, какие сцены в нём снимают.
                                    </p>
                                  ) : (
                                    <React.Fragment>
                                      <div className="flex items-baseline gap-2">
                                        <span style={{ fontSize: 12.5, color: 'var(--text-2)' }}>{loc.name}</span>
                                        <button onClick={() => { setActiveLocationId(loc.id); setCurrentView('locations'); }} className="ml-auto" style={linkish}>открыть объект →</button>
                                      </div>
                                      {!locCoords ? (
                                        <p style={{ fontSize: 12, color: 'var(--muted-2)', marginTop: 8, lineHeight: 1.6 }}>
                                          У объекта нет координат — впишите их там, и здесь появится дуга солнца на день смены.
                                        </p>
                                      ) : !s.date ? (
                                        <p style={{ fontSize: 12, color: 'var(--muted-2)', marginTop: 8, lineHeight: 1.6 }}>
                                          Поставьте смену сцене — и дуга солнца посчитается на этот день.
                                        </p>
                                      ) : (() => {
                                        const t = sunTimes(locCoords.lat, locCoords.lon, s.date);
                                        if (!t) return null;
                                        if (t.sun.polar) return <p style={{ fontSize: 12, color: 'var(--warn)', marginTop: 8 }}>{t.sun.polar === 'day' ? 'Солнце не садится — полярный день.' : 'Солнце не встаёт — полярная ночь.'}</p>;
                                        return (
                                          <React.Fragment>
                                            <svg width="100%" height="86" viewBox="0 0 262 86" preserveAspectRatio="xMidYMid meet" style={{ marginTop: 6, display: 'block' }}>
                                              <line x1="0" y1="70" x2="262" y2="70" stroke="var(--border)" strokeWidth="1" />
                                              <path d="M20 70 Q131 -18 242 70" fill="none" stroke="var(--muted-2)" strokeWidth="1" strokeDasharray="3 4" />
                                              <circle cx="20" cy="70" r="2.5" fill="var(--accent)" /><circle cx="242" cy="70" r="2.5" fill="var(--accent)" />
                                              <text x="8" y="82" fontFamily="var(--font-mono)" fontSize="9" fill="var(--muted-2)">{hhmm(t.sun.rise)}</text>
                                              <text x="212" y="82" fontFamily="var(--font-mono)" fontSize="9" fill="var(--muted-2)">{hhmm(t.sun.set)}</text>
                                              <text x="112" y="26" fontFamily="var(--font-mono)" fontSize="9" fill="var(--muted)">{hhmm(t.transit)}</text>
                                            </svg>
                                            {t.golden.set && (
                                              <div className="cf-meta" style={{ color: 'var(--warn)', opacity: .85 }}>
                                                золотой час {hhmm(t.sun.rise)}–{hhmm(t.golden.rise)} и {hhmm(t.golden.set)}–{hhmm(t.sun.set)}
                                              </div>
                                            )}
                                            <p className="cf-meta mt-2" style={{ lineHeight: 1.6 }}>
                                              Время по часам этого устройства. Считается на месте, интернет не нужен.
                                            </p>
                                          </React.Fragment>
                                        );
                                      })()}
                                    </React.Fragment>
                                  )}
                                </div>
                              )}
                            </aside>
                          )}
                        </React.Fragment>
                      );
                    })()}
                  </div>

                  {/* ГАЛЕРЕЯ РЕФЕРЕНСОВ */}
                  <div className={`h-full w-full relative ${currentView === 'gallery' ? 'flex' : 'hidden'}`}>

                    {/* КОЛОНКА ТЕГОВ */}
                    {galleryTagsOpen ? (
                      <div className="hidden md:flex flex-col shrink-0" style={{ width: 212, background: 'var(--panel-3)', borderRight: '1px solid var(--border)' }}>
                        <div className="flex items-center justify-between px-4 shrink-0" style={{ minHeight: 44, borderBottom: '1px solid var(--border)' }}>
                          <span className="cf-eyebrow">Папки · теги</span>
                          <div className="flex items-center gap-2">
                            {tagSearch && <button onClick={() => setTagSearch('')} style={{ color: 'var(--accent)', fontSize: 11.5 }}>Сбросить</button>}
                            <button onClick={() => setGalleryTagsOpen(false)} title="Свернуть"
                                    className="flex items-center justify-center rounded shrink-0"
                                    style={{ width: 22, height: 22, border: '1px solid var(--border)', color: 'var(--muted-2)', fontSize: 12 }}>‹</button>
                          </div>
                        </div>
                        <div className="flex-1 overflow-y-auto">
                          {/* ПАПКИ */}
                          <div style={{ borderBottom: '1px solid var(--border)' }}>
                            <div className="flex items-center justify-between px-4 pt-3 pb-1">
                              <span className="cf-eyebrow">Папки</span>
                              <button onClick={() => {
                                        const name = prompt('Название папки');
                                        if (name && name.trim()) setActiveFolder(name.trim());
                                      }}
                                      title="Создать папку (появится, когда положите в неё референс)"
                                      style={{ color: 'var(--muted-2)', fontSize: 14, lineHeight: 1 }}>+</button>
                            </div>
                            {[['', 'Все', references.length], ...folderCounts.map(([f, n]) => [f, f, n]), ...(noFolderCount ? [['__none__', 'Без папки', noFolderCount]] : [])]
                              .map(([key, label, count]) => {
                                const on = activeFolder === key;
                                return (
                                  <button key={key || 'all'} onClick={() => setActiveFolder(key)}
                                          className="w-full flex items-center justify-between gap-2 px-4 text-left transition-colors"
                                          style={{ minHeight: 38, background: on ? 'var(--accent)' : 'transparent', color: on ? 'var(--bg)' : 'var(--text-2)' }}>
                                    <span className="truncate flex items-center gap-1.5" style={{ fontSize: 12.5 }}>
                                      <Icons.Folder /> {label}
                                    </span>
                                    <span className="cf-meta shrink-0" style={on ? { color: 'var(--bg)' } : undefined}>{count}</span>
                                  </button>
                                );
                              })}
                            {activeFolder && activeFolder !== '__none__' && !folderCounts.some(([f]) => f === activeFolder) && (
                              <p className="px-4 pb-3" style={{ fontSize: 11.5, color: 'var(--muted-2)', lineHeight: 1.5 }}>
                                Папка «{activeFolder}» пока пустая. Перетащите сюда референсы или выберите папку на карточке.
                              </p>
                            )}
                          </div>

                          {/* ПОИСК ПО СЛОВУ-НАСТРОЕНИЮ. Картинку ищут не по
                              имени файла, а по тому, чем она была: «пыль»,
                              «воздух», «тревога». Словарь не фиксируем —
                              подсказки берутся из уже введённых тегов. */}
                          <div className="px-3 pt-3 pb-1.5">
                            <input data-ro-ok type="text" value={tagSearch} onChange={(e) => setTagSearch(e.target.value)}
                                   placeholder="пыль, воздух, тревога…" list="cf-tag-hints"
                                   className="glass-input w-full rounded-lg px-2.5" style={{ minHeight: 32, fontSize: 12 }} />
                            <datalist id="cf-tag-hints">{tagCounts.map(([t]) => <option key={t} value={t} />)}</datalist>
                          </div>
                          <div className="px-4 pt-1 pb-1"><span className="cf-eyebrow">Все теги</span></div>
                          {tagCounts.map(([tag, count]) => {
                            const on = tagSearch.toLowerCase() === tag;
                            return (
                              <button key={tag} onClick={() => setTagSearch(on ? '' : tag)}
                                      className="w-full flex items-center justify-between gap-2 px-4 text-left transition-colors"
                                      style={{ minHeight: 44, borderBottom: '1px solid var(--border-soft)', background: on ? 'var(--accent)' : 'transparent', color: on ? 'var(--bg)' : 'var(--text-2)' }}>
                                <span className="truncate" style={{ fontSize: 13 }}>{tag}</span>
                                <span className="cf-meta shrink-0" style={on ? { color: 'var(--bg)' } : undefined}>{count}</span>
                              </button>
                            );
                          })}
                          {tagCounts.length === 0 && (
                            <p className="px-4 py-4" style={{ fontSize: 12, color: 'var(--muted-2)', lineHeight: 1.5 }}>
                              Тегов пока нет. Добавьте их на карточке референса — поле «+ тег».
                            </p>
                          )}
                        </div>
                        <div className="p-3 shrink-0 cf-edit-only space-y-2" style={{ borderTop: '1px solid var(--border)' }}>
                          <PhotoSourcePicker onFiles={(fs) => handleMultiFileUpload(fs, null, null, null, galleryDropFolder())}
                                 className="w-full flex items-center justify-center gap-2 rounded-lg transition-colors hover:bg-white/5"
                                 style={{ minHeight: 44, background: 'var(--panel)', border: '1px solid var(--border)', fontSize: 12, color: 'var(--text-2)' }}>
                            <Icons.Gallery /> Загрузить референсы
                          </PhotoSourcePicker>
                          {/* Отдельная кнопка вставки нужна планшету: Ctrl+V
                              там нет вовсе, а картинку из браузера копируют
                              долгим нажатием. Спрашивать буфер можно только
                              из обработчика нажатия. */}
                          <button onClick={() => pasteFromClipboard({ folder: galleryDropFolder() })}
                                  title="Вставить картинку из буфера обмена"
                                  className="w-full flex items-center justify-center gap-2 rounded-lg transition-colors hover:bg-white/5"
                                  style={{ minHeight: 40, background: 'transparent', border: '1px solid var(--border)', fontSize: 12, color: 'var(--muted)' }}>
                            <Icons.Paste /> Вставить
                          </button>
                          {/* Про оба пути надо СКАЗАТЬ: невидимая возможность —
                              это возможность, которой нет. */}
                          <p style={{ fontSize: 11, color: 'var(--muted-2)', lineHeight: 1.5 }}>
                            Картинку можно просто бросить на галерею или вставить — Ctrl+V.
                            {activeFolder && activeFolder !== '__none__' ? ` Ляжет в папку «${activeFolder}».` : ''}
                          </p>
                        </div>
                      </div>
                    ) : (
                      <div className="hidden md:flex cf-strip shrink-0" onClick={() => setGalleryTagsOpen(true)} title="Развернуть папки и теги">
                        <span style={{ writingMode: 'horizontal-tb', border: '1px solid var(--border)', borderRadius: 6, width: 22, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12 }}>›</span>
                        <span>Папки · теги</span>
                      </div>
                    )}

                    {/* СЕТКА РЕФЕРЕНСОВ.
                        Файл можно бросить на ВЕСЬ лист, а не в узкую полоску:
                        целиться мышью с зажатой кнопкой неудобно, а на планшете
                        и нечем. Перехватываем только то, что несёт картинку
                        (dropHasImage) — иначе у полей ввода отнялся бы обычный
                        перенос текста. */}
                    <div className={`flex-1 min-w-0 overflow-y-auto transition-shadow ${dragOverGal ? 'ring-2 ring-indigo-400/70 ring-inset' : ''}`}
                         onDragOver={(e) => {
                           if (READ_ONLY || !dropHasImage(e.dataTransfer)) return;
                           e.preventDefault(); e.dataTransfer.dropEffect = 'copy';
                           if (!dragOverGal) setDragOverGal(true);
                         }}
                         onDragLeave={(e) => {
                           // Уход к СВОЕМУ же потомку — не уход: без этой
                           // проверки подсветка мигает над каждой картинкой.
                           if (e.currentTarget.contains(e.relatedTarget)) return;
                           setDragOverGal(false);
                         }}
                         onDrop={(e) => {
                           if (READ_ONLY || !dropHasImage(e.dataTransfer)) return;
                           e.preventDefault(); setDragOverGal(false);
                           acceptDropped(e.dataTransfer, { folder: galleryDropFolder() });
                         }}>
                     <div className="p-4 md:p-6 pb-24 space-y-5">
                        <div className="flex flex-wrap items-center justify-between gap-3">
                            <div className="flex items-baseline gap-3 min-w-0">
                              <span className="cf-eyebrow truncate">{[activeFolder === '' ? null : (activeFolder === '__none__' ? 'Без папки' : activeFolder), tagSearch ? `тег: ${tagSearch}` : null].filter(Boolean).join(' · ') || 'Все референсы'}</span>
                              <span className="cf-meta shrink-0">{visibleRefs.length} из {references.length}</span>
                            </div>
                            <div className="flex items-center gap-2 shrink-0 cf-edit-only">
                              {visibleRefs.length > 0 && (
                                <button onClick={() => setSelectedRefIds(allVisibleSelected ? [] : visibleRefs.map(r => r.id))}
                                        className="cf-chip shrink-0">{allVisibleSelected ? 'Снять выделение' : 'Выделить все'}</button>
                              )}
                              <button onClick={() => pasteFromClipboard({ folder: galleryDropFolder() })}
                                      title="Вставить картинку из буфера обмена"
                                      className="cf-chip shrink-0 flex items-center gap-1.5"><Icons.Paste /> Вставить</button>
                              <PhotoSourcePicker onFiles={(fs) => handleMultiFileUpload(fs, null, null, null, galleryDropFolder())}
                                     className="md:hidden flex items-center gap-2 rounded-lg px-4 shrink-0"
                                     style={{ minHeight: 44, background: 'var(--panel)', border: '1px solid var(--border)', fontSize: 12, color: 'var(--text-2)' }}>
                                  + Загрузить
                              </PhotoSourcePicker>
                            </div>
                        </div>

                        {/* Панель массовых действий уехала ВНИЗ и всплывает
                            над сеткой. Сверху она отодвигала картинки при
                            каждом выборе — лист «дёргался» ровно тогда, когда
                            по нему ведут глазами. Главное на ней — три
                            адресата кадра: сцена, доска, объект. */}

                        {/* папки на телефоне — горизонтальной лентой (боковая колонка скрыта на узких экранах) */}
                        <div className="md:hidden flex gap-2 overflow-x-auto hide-scrollbar pb-1">
                          {[['', 'Все', references.length], ...folderCounts.map(([f, n]) => [f, f, n]), ...(noFolderCount ? [['__none__', 'Без папки', noFolderCount]] : [])]
                            .map(([key, label, count]) => {
                              const on = activeFolder === key;
                              return (
                                <button key={key || 'all'} onClick={() => setActiveFolder(key)}
                                        className={`cf-chip shrink-0 flex items-center gap-1.5 ${on ? 'cf-chip-accent' : ''}`}>
                                  <Icons.Folder /> {label} · {count}
                                </button>
                              );
                            })}
                          <button onClick={() => { const name = prompt('Название папки'); if (name && name.trim()) setActiveFolder(name.trim()); }}
                                  className="cf-chip shrink-0 cf-edit-only" style={{ color: 'var(--muted-2)' }}>+ папка</button>
                        </div>

                        {/* теги на телефоне — горизонтальной лентой */}
                        {tagCounts.length > 0 && (
                          <div className="md:hidden flex gap-2 overflow-x-auto hide-scrollbar pb-1">
                            {tagSearch && <button onClick={() => setTagSearch('')} className="cf-chip shrink-0" style={{ color: 'var(--accent)', borderColor: 'var(--accent-line)' }}>Сбросить</button>}
                            {tagCounts.map(([tag, count]) => {
                              const on = tagSearch.toLowerCase() === tag;
                              return (
                                <button key={tag} onClick={() => setTagSearch(on ? '' : tag)} className={`cf-chip shrink-0 ${on ? 'cf-chip-accent' : ''}`}>
                                  {tag} · {count}
                                </button>
                              );
                            })}
                          </div>
                        )}

                        {/* Сетка собирается, только пока галерея открыта: держать
                            сотню картинок в памяти круглосуточно на планшете дорого.
                            Прокрутка при уходе теряется, фильтры и выделение — нет. */}
                        {/* align-items:start обязателен: без него ячейки сетки
                            растягиваются до высоты самой высокой в ряду,
                            и под невысокой картинкой зияет пустая карточка. */}
                        <div className="grid gap-4" style={{ gridTemplateColumns: 'repeat(auto-fill, minmax(min(212px, 100%), 1fr))', alignItems: 'start' }}>
                            {currentView === 'gallery' && visibleRefs.map(ref => {
                              const isSel = selectedRefIds.includes(ref.id);
                              return (
                                <div key={ref.id} className={`cf-ref-card rounded-lg overflow-hidden flex flex-col group transition-all`}
                                     style={{ background: 'var(--card)', border: '2px solid ' + (isSel ? 'var(--accent)' : 'var(--border)') }}>
                                    {/* Картинка в РОДНЫХ пропорциях: квадратная ячейка
                                        либо резала кадр, либо оставляла вокруг него
                                        пустые поля, и лукбук читался как файловый
                                        менеджер. Высота теперь по картинке, сетка
                                        заполняется слева направо построчно. */}
                                    <div className="relative cursor-pointer" onClick={() => { if (selectedRefIds.length > 0) { toggleRefSelection(ref.id); } else { setLightboxData({ scope: visibleRefs.map(x => x.id), scopeLabel: [activeFolder === '' ? null : (activeFolder === '__none__' ? 'Без папки' : activeFolder), tagSearch ? `тег: ${tagSearch}` : null].filter(Boolean).join(' · ') || 'Вся галерея', currentId: ref.id }); } }}>
                                        {/* Метка «сц 143» / «об 07»: видно, что кадр
                                            уже пристроен, не открывая его. */}
                                        {refUsedLabel(ref) && (
                                          <span className="absolute z-20 rounded pointer-events-none"
                                                style={{ top: 6, left: 6, fontFamily: 'var(--font-mono)', fontSize: 9,
                                                         background: 'rgba(26,25,24,.72)', color: 'var(--ok)', padding: '2px 5px' }}>{refUsedLabel(ref)}</span>
                                        )}
                                        <button onClick={(e) => { e.stopPropagation(); toggleRefSelection(ref.id); }}
                                                title={isSel ? 'Снять выделение' : 'Выделить'}
                                                className={`cf-edit-only absolute bottom-2 left-2 w-7 h-7 rounded-lg z-20 flex items-center justify-center transition-all ${isSel ? '' : 'opacity-0 group-hover:opacity-100'}`}
                                                style={isSel ? { background: 'var(--accent)', color: 'var(--bg)' } : { background: 'rgba(0,0,0,.8)', color: 'var(--muted)', border: '1px solid var(--border)' }}>
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                                        </button>
                                        <button onClick={(e) => { e.stopPropagation(); setConfirmAction({
                                                    title: 'Удалить референс?',
                                                    message: (ref.label ? `«${ref.label}» удалится` : 'Референс удалится') + ' из проекта. Сразу после удаления его можно будет вернуть кнопкой.',
                                                    onConfirm: () => deleteRefs([ref]) }); }}
                                                title="Удалить референс"
                                                className="cf-edit-only absolute top-2 right-2 bg-black/80 backdrop-blur text-zinc-400 hover:text-red-400 w-7 h-7 rounded-lg opacity-0 group-hover:opacity-100 transition-all text-xs z-20 flex items-center justify-center"><Icons.Trash/></button>
                                        {/* ОДИНОЧНЫЙ КАДР НА СЦЕНУ — не уходя
                                            из галереи. Пачкой это делает панель
                                            снизу, а поодиночке ходить туда-сюда
                                            через выделение слишком долго:
                                            разбирают лист по одной картинке. */}
                                        {!READ_ONLY && (() => {
                                          const sc = scenes.find(x => x.id === activeSceneId);
                                          if (!sc) return null;
                                          const mine = ref.sceneId === sc.id;
                                          return (
                                            <button onClick={(e) => {
                                                      e.stopPropagation();
                                                      const up = references.map(r => r.id === ref.id ? { ...r, sceneId: mine ? '' : sc.id } : r);
                                                      setReferences(up); syncDoc('references', ref.id, up.find(r => r.id === ref.id));
                                                      showToast(mine ? 'Снято со сцены · осталось в галерее' : `На сцену #${sc.number}`);
                                                    }}
                                                    title={mine ? `Уже в сцене #${sc.number} — снять` : `На сцену #${sc.number}`}
                                                    className="absolute top-2 backdrop-blur w-7 h-7 rounded-lg transition-all text-xs z-20 flex items-center justify-center opacity-0 group-hover:opacity-100"
                                                    style={mine
                                                      ? { right: 74, background: 'var(--accent)', color: 'var(--bg)', opacity: 1 }
                                                      : { right: 74, background: 'rgba(0,0,0,.8)', color: 'var(--muted)' }}>
                                              <Icons.Scene/>
                                            </button>
                                          );
                                        })()}
                                        {!READ_ONLY && (() => {
                                          const onBoard = !!ref.boardId;
                                          const boardName = onBoard ? ((sortedBoards.find(b => b.id === ref.boardId) || {}).title || 'доске') : '';
                                          return (
                                            <button onClick={(e) => {
                                                      e.stopPropagation();
                                                      const nextBoard = onBoard ? '' : activeBoardId;
                                                      const placed = { ...ref, boardId: nextBoard,
                                                        x: (260 - canvasOffset.x) / zoom + Math.random() * 60,
                                                        y: (240 - canvasOffset.y) / zoom + Math.random() * 60 };
                                                      setReferences(references.map(r => r.id === ref.id ? placed : r));
                                                      syncDoc('references', ref.id, placed);
                                                      showToast(onBoard ? 'Убрано с доски · осталось в галерее' : 'Добавлено на доску');
                                                    }}
                                                    title={onBoard ? `Уже на доске «${boardName}» — убрать` : 'Положить на текущую доску'}
                                                    className="absolute top-2 backdrop-blur w-7 h-7 rounded-lg transition-all text-xs z-20 flex items-center justify-center opacity-0 group-hover:opacity-100"
                                                    style={onBoard
                                                      ? { right: 38, background: 'var(--accent)', color: 'var(--bg)', opacity: 1 }
                                                      : { right: 38, background: 'rgba(0,0,0,.8)', color: 'var(--muted)' }}>
                                              <Icons.Board/>
                                            </button>
                                          );
                                        })()}
                                        <img src={ref.url} draggable="false"
                                             style={{ width: '100%', height: 'auto', display: 'block', background: 'var(--bg)' }} />
                                        {/* Панораму надо отличать от обычного кадра на общем
                                            листе: плоская развёртка сама по себе выглядит
                                            просто странно снятой фотографией. */}
                                        {ref.pano && (
                                          <span className="absolute bottom-2 right-2 z-20 rounded-md pointer-events-none"
                                                style={{ background: 'rgba(0,0,0,.75)', color: 'var(--accent)',
                                                         fontSize: 10, fontWeight: 700, letterSpacing: '.04em', padding: '2px 5px' }}>360°</span>
                                        )}
                                    </div>
                                    <div className="p-3 space-y-2 bg-black/30">
                                        <input type="text" value={ref.label} onChange={(e) => { const up = references.map(r=>r.id===ref.id?{...r,label:e.target.value}:r); setReferences(up); syncDoc('references', ref.id, up.find(r=>r.id===ref.id)); }} className="bg-transparent w-full text-sm font-bold text-zinc-200 focus:outline-none placeholder-zinc-600" placeholder="Название референса..." />
                                        <select value={(ref.folder || '')}
                                                onChange={(e) => {
                                                  if (e.target.value === '__new__') {
                                                    const name = prompt('Новая папка');
                                                    if (name && name.trim()) moveToFolder(ref, name.trim());
                                                  } else moveToFolder(ref, e.target.value);
                                                }}
                                                className="w-full rounded-md px-2 py-1"
                                                style={{ fontSize: 11, background: 'var(--bg)', border: '1px solid var(--border)', color: (ref.folder ? 'var(--text-2)' : 'var(--muted-2)') }}>
                                          <option value="">Без папки</option>
                                          {folderCounts.map(([f]) => <option key={f} value={f}>{f}</option>)}
                                          {activeFolder && activeFolder !== '__none__' && !folderCounts.some(([f]) => f === activeFolder) && <option value={activeFolder}>{activeFolder}</option>}
                                          <option value="__new__">+ новая папка…</option>
                                        </select>
                                        {/* Теги видны ВСЕ — в этом весь смысл общего листа:
                                            пробегаешь глазами и сразу понимаешь, что чем
                                            размечено. Прятать их в одну строку с прокруткой
                                            ПРОБОВАЛИ и откатили. Экономим иначе: чипы
                                            плотнее, поле ввода узкое и расширяется при наборе. */}
                                        <div className="flex flex-wrap items-center gap-1">
                                            {(ref.tags || []).map((tag, idx) => (
                                                <span key={idx} className="bg-indigo-900/40 text-indigo-200 rounded flex items-center gap-0.5 whitespace-nowrap"
                                                      style={{ fontSize: 10.5, padding: '1px 5px', lineHeight: 1.45 }}>
                                                    {tag} <button onClick={() => removeTagFrom(ref, tag)} className="hover:text-white cf-edit-only" style={{ fontSize: 9, opacity: .75 }}>✕</button>
                                                </span>
                                            ))}
                                            <span className="cf-edit-only"><TagInput ref_={ref} hints={tagHints} onAdd={addTagTo} narrow /></span>
                                        </div>
                                    </div>
                                </div>
                              );
                            })}
                        </div>
                     </div>
                    </div>

                    {/* ВЫБРАНО N → КУДА. Всплывает снизу поверх листа и
                        никуда не уводит: в этом весь смысл — кадр уходит
                        на сцену, на доску или в объект, а человек остаётся
                        в галерее и продолжает разбирать. */}
                    {selectedRefIds.length > 0 && !READ_ONLY && (() => {
                      const sc = scenes.find(x => x.id === activeSceneId);
                      const lc = locations.find(x => x.id === activeLocationId) || sortedLocations[0];
                      return (
                        <div className="absolute z-40 flex flex-wrap items-center gap-2 rounded-xl px-3 py-2"
                             style={{ left: '50%', transform: 'translateX(-50%)', bottom: 16, maxWidth: 'calc(100% - 24px)',
                                      background: 'var(--card)', border: '1px solid var(--border)', boxShadow: '0 12px 32px rgba(0,0,0,.5)' }}>
                          <span className="shrink-0" style={{ fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--text)' }}>выбрано {selectedRefIds.length}</span>
                          <button onClick={bulkToScene} disabled={!sc}
                                  title={sc ? `Привязать к сцене #${sc.number}` : 'Сначала выберите сцену на экране «Сцены»'}
                                  className="shrink-0 rounded-lg px-3 font-semibold"
                                  style={{ minHeight: 32, fontSize: 11.5, background: sc ? 'var(--accent)' : 'var(--raised)', color: sc ? 'var(--bg)' : 'var(--muted-2)' }}>
                            на сцену {sc ? '#' + sc.number : '—'} →
                          </button>
                          <button onClick={bulkPutOnBoard} className="shrink-0 rounded-lg px-3"
                                  title="Положить на текущую доску"
                                  style={{ minHeight: 32, fontSize: 11.5, color: 'var(--text-2)', border: '1px solid var(--border)' }}>на доску</button>
                          <button onClick={bulkToLocation} disabled={!lc}
                                  title={lc ? `В объект «${lc.name}»` : 'Объектов пока нет'}
                                  className="shrink-0 rounded-lg px-3"
                                  style={{ minHeight: 32, fontSize: 11.5, color: lc ? 'var(--text-2)' : 'var(--muted-2)', border: '1px solid var(--border)' }}>в объект</button>
                          <span className="shrink-0" style={{ width: 1, height: 20, background: 'var(--border)' }} />
                          <input type="text" value={bulkTagInput} onChange={e => setBulkTagInput(e.target.value)}
                                 onKeyDown={e => { if (e.key === 'Enter') bulkAddTag(); }}
                                 placeholder="общий тег…" list="cf-bulk-tags"
                                 className="glass-input rounded-lg px-2.5 min-w-0" style={{ minHeight: 32, fontSize: 11.5, width: 130 }} />
                          {/* Подсказки из уже введённых: словарь не фиксируем,
                              но разнобой («ночь» и «Ночь») ломает поиск по тегу. */}
                          <datalist id="cf-bulk-tags">{tagCounts.map(([t]) => <option key={t} value={t} />)}</datalist>
                          <button onClick={bulkAddTag} className="shrink-0 rounded-lg px-3"
                                  style={{ minHeight: 32, fontSize: 11.5, color: 'var(--text-2)', border: '1px solid var(--border)' }}>+ тег</button>
                          <select value="" onChange={(e) => {
                                    if (e.target.value === '__new__') { const name = prompt('Новая папка'); if (name && name.trim()) bulkMoveToFolder(name.trim()); }
                                    else if (e.target.value === '__none__') bulkMoveToFolder('');
                                    else if (e.target.value) bulkMoveToFolder(e.target.value);
                                  }}
                                  className="shrink-0 rounded-lg px-2"
                                  style={{ minHeight: 32, fontSize: 11.5, background: 'var(--bg)', border: '1px solid var(--border)', color: 'var(--text-2)', maxWidth: 150 }}>
                            <option value="">в папку…</option>
                            {folderCounts.map(([f]) => <option key={f} value={f}>{f}</option>)}
                            <option value="__new__">+ новая папка…</option>
                            <option value="__none__">— без папки —</option>
                          </select>
                          <button onClick={bulkDeleteRefs} title="Удалить выбранное"
                                  className="shrink-0 flex items-center justify-center rounded-lg"
                                  style={{ width: 32, height: 32, color: 'var(--danger)', border: '1px solid var(--border)' }}><Icons.Trash /></button>
                          <button onClick={() => setSelectedRefIds([])} title="Снять выделение"
                                  className="shrink-0 flex items-center justify-center rounded-lg"
                                  style={{ width: 32, height: 32, color: 'var(--muted-2)', fontSize: 12 }}>✕</button>
                        </div>
                      );
                    })()}
                  </div>

                  {/* ЭКРАН «ОБЪЕКТЫ» — визуальный штаб места съёмки.
                      Раньше это была анкета: сверху поля адреса и координат,
                      фотографии в самом низу, солнце текстом. Спрашивают же
                      у объекта другое — «как это место выглядит» и «откуда
                      там свет», — поэтому вперёд вышли фотографии точек,
                      компас с дугой солнца и карта, а поля ушли внутрь
                      карточек. Собирается только когда открыт: фотографий
                      у объекта бывают десятки. */}
                  <div className={`h-full w-full ${currentView === 'locations' ? 'flex' : 'hidden'}`}>
                    {currentView === 'locations' && (() => {
                      const l = locations.find(x => x.id === activeLocationId) || sortedLocations[0] || null;
                      const eyebrow = { fontSize: 11, letterSpacing: '.1em', textTransform: 'uppercase', color: 'var(--muted)' };
                      const cardBox = { background: 'var(--card)', borderRadius: 10 };
                      const linkish = { fontSize: 11, color: 'var(--accent)', cursor: 'pointer' };

                      const locList = locListOpen ? (
                        <aside className="flex flex-col shrink-0" style={{ width: 212, background: 'var(--panel-2)', borderRight: '1px solid var(--border)' }}>
                          <div className="flex items-center gap-1.5 px-2.5 pt-2.5 pb-2">
                            <span className="cf-meta flex-1 truncate">Объекты · {locations.length}</span>
                            <button onClick={() => setLocListOpen(false)} title="Свернуть список объектов"
                                    className="flex items-center justify-center shrink-0"
                                    style={{ width: 22, height: 22, border: '1px solid var(--border)', borderRadius: 6, color: 'var(--muted-2)', fontSize: 12 }}>‹</button>
                          </div>
                          <div className="flex-1 overflow-y-auto">
                            {sortedLocations.map(x => {
                              const ph = locationPhotos(x.id);
                              const cnt = (x.sceneIds || []).length;
                              const on = l && x.id === l.id;
                              return (
                                <div key={x.id} onClick={() => setActiveLocationId(x.id)}
                                     className={`cf-row flex items-center gap-2 px-2.5 ${on ? 'cf-row-on' : ''}`}
                                     style={{ minHeight: 34, paddingTop: 6, paddingBottom: 6 }}>
                                  {ph[0] && <img src={ph[0].url} className="shrink-0 rounded" style={{ width: 40, height: 26, objectFit: 'cover' }} draggable="false" />}
                                  <span className="flex-1 min-w-0 truncate" title={x.name}
                                        style={{ fontSize: 12.5, color: on ? 'var(--text)' : 'var(--text-2)' }}>{x.name || 'Без названия'}</span>
                                  <span className="shrink-0" style={{ fontFamily: 'var(--font-mono)', fontSize: 8.5, color: 'var(--muted-2)', border: '1px solid var(--line)', borderRadius: 4, padding: '1px 4px' }}>{cnt} сц</span>
                                </div>
                              );
                            })}
                            <div className="p-2.5 space-y-2">
                              <button onClick={addLocation} className="cf-edit-only w-full text-center rounded-lg"
                                      style={{ border: '1px dashed var(--border)', color: 'var(--muted-2)', fontSize: 11.5, minHeight: 32 }}>+ объект</button>
                              {sortedLocations.length > 0 && (
                                <button onClick={() => requestPrint('locations')}
                                        title="Отчёт со скаутинга: адреса, заметки и фотографии по всем объектам"
                                        className="w-full text-center rounded-lg"
                                        style={{ border: '1px solid var(--border)', color: 'var(--muted)', fontSize: 11, minHeight: 32 }}>Отчёт по объектам (PDF)</button>
                              )}
                            </div>
                          </div>
                        </aside>
                      ) : (
                        <div className="cf-strip shrink-0" onClick={() => setLocListOpen(true)} title="Развернуть список объектов">
                          <span style={{ writingMode: 'horizontal-tb', border: '1px solid var(--border)', borderRadius: 6, width: 22, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12 }}>›</span>
                          <span>Объекты · {locations.length}</span>
                        </div>
                      );

                      if (!l) {
                        return (
                          <React.Fragment>
                            {locList}
                            <main className="flex-1 min-w-0 flex items-center justify-center p-8">
                              <div className="text-center" style={{ maxWidth: 420 }}>
                                <p style={{ fontSize: 13, fontWeight: 600, color: 'var(--text-2)', marginBottom: 6 }}>Объектов пока нет</p>
                                <p style={{ fontSize: 12.5, color: 'var(--muted-2)', lineHeight: 1.7 }}>
                                  Объект — это место съёмки: квартира, двор, бухта. Сюда складывают фотографии
                                  со скаутинга, солнце на этот день, карту и список сцен, которые здесь снимают.
                                </p>
                              </div>
                            </main>
                          </React.Fragment>
                        );
                      }

                      const photos = locationPhotos(l.id);
                      const linked = l.sceneIds || [];
                      const linkedScenes = sortedScenes.filter(s => linked.includes(s.id));
                      const c = parseCoords(l.coords);
                      const notes = stickies.filter(st => st.locationId === l.id);
                      const dates = [...new Set(linkedScenes.filter(s => s.date).map(s => s.date))].sort();
                      const shiftDate = dates[0] || null;
                      const scheme = l.lightSchemeId ? lightSchemes.find(x => x.id === l.lightSchemeId) : null;

                      return (
                        <React.Fragment>
                          {locList}
                          {/* Файл можно бросить на ВЕСЬ лист объекта, а не в узкую
                              полоску: целиться в маленькую цель мышью с зажатой
                              кнопкой неудобно, а на планшете и вовсе нечем.
                              Перехватываем только то, что несёт картинку
                              (dropHasImage) — иначе у полей ввода отнялся бы
                              обычный перенос текста. */}
                          <main className={`flex-1 min-w-0 overflow-y-auto transition-shadow ${dragOverLoc ? 'ring-2 ring-inset' : ''}`}
                                style={{ padding: '16px 18px 36px' }}
                                onDragOver={(e) => {
                                  if (READ_ONLY || !dropHasImage(e.dataTransfer)) return;
                                  e.preventDefault(); e.dataTransfer.dropEffect = 'copy';
                                  if (!dragOverLoc) setDragOverLoc(true);
                                }}
                                onDragLeave={(e) => {
                                  // Уход к СВОЕМУ же потомку — не уход: без этой
                                  // проверки подсветка мигает над каждой картинкой.
                                  if (e.currentTarget.contains(e.relatedTarget)) return;
                                  setDragOverLoc(false);
                                }}
                                onDrop={(e) => {
                                  if (READ_ONLY || !dropHasImage(e.dataTransfer)) return;
                                  e.preventDefault(); setDragOverLoc(false);
                                  acceptDropped(e.dataTransfer, { locationId: l.id });
                                }}>
                            <div className="flex items-baseline gap-2.5">
                              <span style={{ fontFamily: 'var(--font-mono)', fontSize: 13, color: 'var(--accent)', fontWeight: 500 }}>
                                ОБ {String(sortedLocations.findIndex(x => x.id === l.id) + 1).padStart(2, '0')}
                              </span>
                              <div className="relative shrink-0" ref={locMenuRef}>
                                <button onClick={() => setLocMenu(v => !v)} title="Отчёт, удалить объект"
                                        className="flex items-center justify-center transition-colors hover:bg-white/5"
                                        style={{ width: 26, height: 22, border: '1px solid var(--border)', borderRadius: 6, color: 'var(--muted-2)', fontSize: 13, letterSpacing: 1 }}>···</button>
                                {locMenu && (
                                  <div className="cf-menu cf-menu-left">
                                    {/* «···» у объекта отдаёт ЭТОТ объект, отчёт по
                                        всем живёт кнопкой в списке слева. Раньше
                                        оба места печатали одно и то же — все
                                        объекты в куче, и выгрузить один было
                                        нечем. Две кнопки — два разных ответа. */}
                                    <button onClick={() => { setLocMenu(false); setPrintLocation(l.id); requestPrint('location', () => preparePrintPhotos(locationPhotos(l.id))); }}><Icons.Print /> Экспорт объекта в PDF</button>
                                    <hr />
                                    <button className="cf-edit-only" onClick={() => { setLocMenu(false); deleteLocation(l.id); }} style={{ color: 'var(--danger)' }}><Icons.Trash /> Удалить объект</button>
                                  </div>
                                )}
                              </div>
                            </div>
                            <div className="flex items-center gap-2.5 flex-wrap" style={{ marginTop: 2, marginBottom: 14 }}>
                              <input type="text" value={l.name || ''} onChange={(e) => updateLocation(l.id, 'name', e.target.value)}
                                     placeholder="Название объекта"
                                     className="bg-transparent focus:outline-none min-w-0"
                                     style={{ fontSize: 24, fontWeight: 700, letterSpacing: '-.02em', color: 'var(--text)', flex: '1 1 240px' }} />
                              {photos.length > 0 && <span className="cf-chip shrink-0">{photos.length} фото</span>}
                              {linkedScenes.length > 0 && <span className="cf-chip shrink-0">{linkedScenes.length} сц</span>}
                            </div>

                            {/* ФОТО ТОЧЕК СЪЁМКИ — ПЕРВЫМ БЛОКОМ.
                                Место узнают по фотографии, а не по адресу.
                                Раньше они лежали в самом низу, под четырьмя
                                формами, и до них надо было доскроллить. */}
                            <div className="flex items-center gap-2.5 flex-wrap" style={{ marginBottom: 7 }}>
                              <span style={eyebrow}>Фотографии · {photos.length}</span>
                              {photos.length > 1 && (
                                <button onClick={() => setLocPhotosOpen(v => !v)} style={linkish}>
                                  {locPhotosOpen ? 'свернуть ⤡' : 'развернуть все ⤢'}
                                </button>
                              )}
                            </div>
                            <div className={locPhotosOpen ? 'grid gap-2.5 pb-1.5' : 'flex gap-2.5 overflow-x-auto pb-1.5'}
                                 style={locPhotosOpen ? { gridTemplateColumns: 'repeat(auto-fill, minmax(min(300px, 100%), 1fr))' } : null}>
                              {photos.map(r => (
                                <div key={r.id} className="relative shrink-0 group cursor-pointer"
                                     style={{ width: locPhotosOpen ? 'auto' : 320, borderRadius: 10, overflow: 'hidden', border: '1px solid var(--border)' }}
                                     onClick={() => setLightboxData({ scope: photos.map(p => p.id), scopeLabel: `Объект · ${l.name || 'без названия'}`, currentId: r.id })}>
                                  <img src={r.url} style={{ width: '100%', height: 190, objectFit: 'cover', display: 'block' }} draggable="false" loading="lazy" />
                                  {/* Отвязываем от объекта, а НЕ удаляем из проекта —
                                      это правило всего приложения */}
                                  <button onClick={(e) => { e.stopPropagation(); setRefLocation(r.id, ''); showToast('Фото отвязано · осталось в галерее'); }}
                                          title="Убрать из объекта — фото останется в галерее"
                                          className="cf-edit-only absolute opacity-0 group-hover:opacity-100 transition-all flex items-center justify-center"
                                          style={{ top: 6, right: 6, width: 24, height: 24, borderRadius: 6, background: 'rgba(26,25,24,.8)', color: 'var(--muted)', fontSize: 11 }}>✕</button>
                                  <div className="absolute" style={{ left: 6, bottom: 6, right: 6 }} onClick={e => e.stopPropagation()}>
                                    <input type="text" value={r.label || ''}
                                           onChange={(e) => { const up = references.map(x => x.id === r.id ? { ...x, label: e.target.value } : x); setReferences(up); syncDoc('references', r.id, up.find(x => x.id === r.id)); }}
                                           placeholder="точка А · с обрыва"
                                           className="cf-overlay w-full focus:outline-none" style={{ border: 'none' }} />
                                  </div>
                                </div>
                              ))}
                              {/* Спрашиваем, откуда взять фото: камера · фотоплёнка ·
                                  файлы. Раньше кнопка уводила прямо в камеру, и
                                  снимок, уже лежащий в телефоне, положить сюда
                                  было нечем. */}
                              <PhotoSourcePicker onFiles={(fs) => handleMultiFileUpload(fs, null, null, l.id)}
                                     hint="камера · плёнка · файлы"
                                     className="cf-edit-only shrink-0 flex flex-col items-center justify-center gap-1.5"
                                     style={{ width: locPhotosOpen ? 'auto' : 160, height: 190, border: '1px dashed var(--border)', borderRadius: 10, color: 'var(--muted-2)', boxSizing: 'border-box' }}>
                                <span style={{ fontSize: 20, lineHeight: 1 }}>+</span>
                                <span style={{ fontSize: 11.5 }}>фото со скаутинга</span>
                              </PhotoSourcePicker>
                              {/* Отдельная кнопка вставки нужна планшету: Ctrl+V
                                  там нет вовсе, а картинку из браузера копируют
                                  долгим нажатием. Спрашивать буфер можно только
                                  из обработчика нажатия. */}
                              <button onClick={() => pasteFromClipboard({ locationId: l.id })}
                                      title="Вставить картинку из буфера обмена"
                                      className="cf-edit-only shrink-0 flex flex-col items-center justify-center gap-1.5"
                                      style={{ width: locPhotosOpen ? 'auto' : 120, height: 190, border: '1px dashed var(--border)', borderRadius: 10, color: 'var(--muted-2)', fontSize: 11.5, boxSizing: 'border-box' }}>
                                <Icons.Paste /> вставить
                              </button>
                            </div>

                            <div className="grid gap-3.5 mt-3.5 items-start" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(min(320px, 100%), 1fr))' }}>
                              {/* СОЛНЦЕ СЛОВАМИ, А НЕ ТАБЛИЦЕЙ. Компас отвечает
                                  «откуда светит», дуга — «сколько осталось»,
                                  строчка внизу переводит это на язык площадки. */}
                              <div style={{ ...cardBox, padding: '14px 16px' }}>
                                <div className="flex items-center gap-2 flex-wrap">
                                  <span style={eyebrow}>Солнце{shiftDate ? ' · ' + formatDateDisplay(shiftDate) : ''}</span>
                                  {c && shiftDate && (() => {
                                    const t = sunTimes(c.lat, c.lon, shiftDate);
                                    if (!t || t.sun.polar || !t.golden.set) return null;
                                    return <span className="ml-auto cf-meta" style={{ color: 'var(--warn)', opacity: .85 }}>золотой час {hhmm(t.golden.set)}–{hhmm(t.sun.set)}</span>;
                                  })()}
                                </div>
                                {!c ? (
                                  <p style={{ fontSize: 12.5, color: 'var(--muted-2)', marginTop: 10, lineHeight: 1.6 }}>
                                    Впишите координаты в карточке справа — и здесь появится компас, дуга солнца и во сколько уходит свет.
                                  </p>
                                ) : (() => {
                                  const now = new Date();
                                  const p = sunPosition(c.lat, c.lon, now);
                                  const t = sunTimes(c.lat, c.lon, shiftDate || now.toISOString().slice(0, 10));
                                  const rad = p.az * Math.PI / 180;
                                  const R = 40;
                                  const sx = 60 + R * Math.sin(rad), sy = 60 - R * Math.cos(rad);
                                  return (
                                    <div className="flex gap-3.5 items-center mt-2.5 flex-wrap">
                                      <svg width="120" height="120" viewBox="0 0 120 120" className="shrink-0">
                                        <circle cx="60" cy="60" r="52" fill="none" stroke="var(--border)" strokeWidth="1" />
                                        <text x="60" y="16" textAnchor="middle" fontFamily="var(--font-mono)" fontSize="9" fill="var(--muted)">С</text>
                                        <text x="60" y="112" textAnchor="middle" fontFamily="var(--font-mono)" fontSize="9" fill="var(--muted-2)">Ю</text>
                                        <text x="10" y="63" textAnchor="middle" fontFamily="var(--font-mono)" fontSize="9" fill="var(--muted-2)">З</text>
                                        <text x="110" y="63" textAnchor="middle" fontFamily="var(--font-mono)" fontSize="9" fill="var(--muted-2)">В</text>
                                        {p.alt > 0 && <path d={`M60 60 L${sx.toFixed(1)} ${sy.toFixed(1)}`} stroke="var(--warn)" strokeWidth="2" />}
                                        {p.alt > 0 && <circle cx={sx.toFixed(1)} cy={sy.toFixed(1)} r="5" fill="var(--warn)" />}
                                        <circle cx="60" cy="60" r="3" fill="var(--accent)" />
                                      </svg>
                                      <div className="flex-1" style={{ minWidth: 160 }}>
                                        {t && !t.sun.polar && t.sun.rise && (
                                          <svg width="100%" height="64" viewBox="0 0 220 64" preserveAspectRatio="xMidYMid meet" style={{ display: 'block' }}>
                                            <line x1="0" y1="52" x2="220" y2="52" stroke="var(--border)" strokeWidth="1" />
                                            <path d="M16 52 Q110 -12 204 52" fill="none" stroke="var(--muted-2)" strokeWidth="1" strokeDasharray="3 4" />
                                            <circle cx="16" cy="52" r="2.5" fill="var(--accent)" /><circle cx="204" cy="52" r="2.5" fill="var(--accent)" />
                                            <text x="6" y="62" fontFamily="var(--font-mono)" fontSize="8.5" fill="var(--muted-2)">{hhmm(t.sun.rise)}</text>
                                            <text x="172" y="62" fontFamily="var(--font-mono)" fontSize="8.5" fill="var(--muted-2)">{hhmm(t.sun.set)}</text>
                                          </svg>
                                        )}
                                        <div style={{ fontSize: 12, color: 'var(--text-2)', marginTop: 6, lineHeight: 1.55 }}>
                                          {sunWords(p)}
                                          {t && t.sun.polar === 'day' && ' Солнце не садится — полярный день.'}
                                          {t && t.sun.polar === 'night' && ' Солнце не встаёт — полярная ночь.'}
                                        </div>
                                        <p className="cf-meta" style={{ marginTop: 4 }}>
                                          {shiftDate ? 'Дуга — на день смены. ' : 'Смены у сцен нет — дуга на сегодня. '}
                                          Считается на месте, интернет не нужен.
                                        </p>
                                      </div>
                                    </div>
                                  );
                                })()}
                              </div>

                              {/* КАРТА И ПОДЪЕЗД. Здесь же адрес и координаты:
                                  они нужны ровно двум вещам — открыть точку
                                  на карте и посчитать солнце. */}
                              <div style={{ ...cardBox, padding: '14px 16px' }}>
                                <div className="flex items-center gap-2">
                                  <span style={eyebrow}>Карта и подъезд</span>
                                  {c && (
                                    <a href={`https://www.openstreetmap.org/?mlat=${c.lat}&mlon=${c.lon}#map=17/${c.lat}/${c.lon}`}
                                       target="_blank" rel="noopener" className="ml-auto" style={linkish}>открыть карту →</a>
                                  )}
                                </div>
                                <input type="text" value={l.address || ''} onChange={(e) => updateLocation(l.id, 'address', e.target.value)}
                                       placeholder="Улица, дом, как заезжать"
                                       className="glass-input w-full rounded-lg px-2.5 mt-2.5" style={{ minHeight: 34, fontSize: 12.5 }} />
                                <div className="flex gap-2 mt-2">
                                  <input type="text" value={l.coords || ''} onChange={(e) => updateLocation(l.id, 'coords', e.target.value)}
                                         placeholder="44.612, 33.518"
                                         className="glass-input flex-1 min-w-0 rounded-lg px-2.5" style={{ minHeight: 34, fontSize: 12.5, fontFamily: 'var(--font-mono)' }} />
                                  <button onClick={() => findCoords(l)} disabled={geoBusy === l.id || !(l.address || '').trim()}
                                          title={(l.address || '').trim() ? 'Найти координаты по адресу' : 'Сначала впишите адрес'}
                                          className="cf-edit-only shrink-0 rounded-lg px-3"
                                          style={{ minHeight: 34, fontSize: 11.5, border: '1px solid var(--border)', color: 'var(--text-2)', opacity: (geoBusy === l.id || !(l.address || '').trim()) ? .4 : 1 }}>
                                    {geoBusy === l.id ? 'Ищу…' : 'по адресу'}
                                  </button>
                                </div>
                                {geoError && geoError.id === l.id && <p style={{ fontSize: 11, color: 'var(--warn)', marginTop: 4 }}>{geoError.text}</p>}
                                {!c && (l.coords || '').trim() && <p style={{ fontSize: 11, color: 'var(--warn)', marginTop: 4 }}>Не разобрал координаты. Нужны два числа: широта, долгота.</p>}

                                {/* Питание и одна строчка-комментарий. Всё
                                    остальное — расстояние от базы, разрешения —
                                    убрано: этого либо не знают на этом этапе,
                                    либо оно живёт в договорах, а не здесь. */}
                                <div className="flex gap-2 items-baseline mt-3">
                                  <span className="shrink-0" style={{ fontSize: 12.5, color: 'var(--muted-2)', width: 88 }}>Питание</span>
                                  <input type="text" value={l.power || ''} onChange={(e) => updateLocation(l.id, 'power', e.target.value)}
                                         className="flex-1 min-w-0 bg-transparent focus:outline-none" style={{ fontSize: 12.5, color: 'var(--text-2)' }} />
                                </div>
                                {/* Была одна длинная подсказка серым, да ещё
                                    с двоеточием внутри («строчка-комментарий:
                                    грунтовка до обрыва…»). Она читалась как УЖЕ
                                    заполненное поле: непонятно, это чей-то текст
                                    или подсказка, и надо ли её стирать. Теперь
                                    как у «Питания» — слева подпись, справа
                                    пустое поле, и ничего стирать не надо. */}
                                <div className="flex gap-2 items-baseline mt-2">
                                  <span className="shrink-0" style={{ fontSize: 12.5, color: 'var(--muted-2)', width: 88 }}>Комментарий</span>
                                  <textarea value={l.description || ''} onChange={(e) => updateLocation(l.id, 'description', e.target.value)}
                                            className="flex-1 min-w-0 bg-transparent focus:outline-none resize-none"
                                            style={{ fontSize: 12.5, color: 'var(--text-2)', lineHeight: 1.5, minHeight: 34 }} />
                                </div>

                                {lightSchemes.length > 0 && (
                                  <div className="flex gap-2 mt-3">
                                    <select value={l.lightSchemeId || ''} onChange={(e) => updateLocation(l.id, 'lightSchemeId', e.target.value)}
                                            className="glass-input rounded-lg px-2.5 flex-1 min-w-0" style={{ minHeight: 32, fontSize: 11.5, background: 'var(--bg)' }}>
                                      <option value="">— схема света объекта не выбрана —</option>
                                      {lightSchemes.map(sch => (<option key={sch.id} value={sch.id}>{sch.title}</option>))}
                                    </select>
                                    {scheme && (
                                      <button onClick={() => { setActiveSchemeId(scheme.id); setActiveDocId(null); setCurrentView('docs'); }}
                                              className="shrink-0 rounded-lg px-3" style={{ minHeight: 32, fontSize: 11.5, background: 'var(--raised)', color: 'var(--text-2)' }}>Открыть</button>
                                    )}
                                  </div>
                                )}
                              </div>
                            </div>

                            {/* СЦЕНЫ ОБЪЕКТА — КАРТОЧКАМИ С ПРЕВЬЮ, а не чипами.
                                Чип отвечал только «какие номера», а спрашивают
                                «что мы тут снимаем» — на это отвечает картинка. */}
                            <div className="flex items-baseline gap-2.5" style={{ marginTop: 18 }}>
                              <span style={eyebrow}>Сцены на объекте · {linkedScenes.length}</span>
                              <button onClick={() => setLocScenePicker(v => !v)} className="cf-edit-only" style={linkish}>
                                {locScenePicker ? 'скрыть список ⤡' : '+ привязать сцену'}
                              </button>
                            </div>
                            {locScenePicker && (
                              <div className="flex flex-wrap gap-1.5 mt-2 p-2 rounded-lg" style={{ border: '1px solid var(--line)', maxHeight: 180, overflowY: 'auto' }}>
                                {!sortedScenes.length && <span className="cf-meta">Сцен в проекте ещё нет.</span>}
                                {sortedScenes.map(sc => {
                                  const on = linked.includes(sc.id);
                                  return (
                                    <button key={sc.id} onClick={() => toggleLocationScene(l.id, sc.id)} disabled={READ_ONLY}
                                            title={sc.title || 'Без названия'}
                                            className={`cf-chip ${on ? 'cf-chip-accent' : ''}`}>
                                      #{sc.number} <span style={{ fontFamily: 'var(--font-ui)' }}>{(sc.title || 'без названия').slice(0, 22)}</span>
                                    </button>
                                  );
                                })}
                              </div>
                            )}
                            <div className="grid gap-2.5 mt-2" style={{ gridTemplateColumns: 'repeat(auto-fill, minmax(min(210px, 100%), 1fr))' }}>
                              {linkedScenes.map(sc => {
                                const cover = references.find(r => r.sceneId === sc.id && r.url)
                                           || storyboard.find(f => f.sceneId === sc.id && f.image);
                                return (
                                  <button key={sc.id} onClick={() => { setActiveSceneId(sc.id); setCurrentView('notion'); }}
                                          className="text-left" style={{ ...cardBox, padding: 8 }}
                                          title="Открыть сцену">
                                    {cover
                                      ? <img src={cover.url || cover.image} draggable="false" style={{ width: '100%', height: 92, objectFit: 'cover', borderRadius: 7, display: 'block' }} />
                                      : <div className="flex items-center justify-center cf-meta" style={{ width: '100%', height: 92, border: '1px dashed var(--border)', borderRadius: 7, boxSizing: 'border-box' }}>без кадров</div>}
                                    <div className="flex gap-1.5 items-baseline" style={{ marginTop: 7 }}>
                                      <span style={{ fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--accent)' }}>#{sc.number}</span>
                                      <span className="truncate" style={{ fontSize: 12, color: 'var(--text)' }}>{sc.title || 'без названия'}</span>
                                    </div>
                                    <div className="cf-meta" style={{ marginTop: 3 }}>
                                      {sceneBadge(sc) || '—'}{sc.date ? ' · ' + formatDateDisplay(sc.date) : ''}
                                    </div>
                                  </button>
                                );
                              })}
                              {linkedScenes.length === 0 && (
                                <button onClick={() => setLocScenePicker(true)} className="cf-edit-only flex flex-col items-center justify-center gap-1.5"
                                        style={{ border: '1px dashed var(--border)', borderRadius: 10, minHeight: 140, color: 'var(--muted-2)' }}>
                                  <span style={{ fontSize: 20, lineHeight: 1 }}>+</span><span style={{ fontSize: 11.5 }}>привязать сцену</span>
                                </button>
                              )}
                            </div>

                            {/* ЗАМЕТКИ БЛОКАМИ. Одно длинное поле на всё
                                превращалось в свалку: там жили и свет, и звук,
                                и «спросить у охраны». Блок — одна мысль. */}
                            <div className="flex items-baseline gap-2.5" style={{ marginTop: 18 }}>
                              <span style={eyebrow}>Заметки</span>
                              <button onClick={() => addLocationNote(l.id)} className="cf-edit-only" style={linkish}>+ заметка</button>
                            </div>
                            <div className="grid gap-2.5 mt-2" style={{ gridTemplateColumns: 'repeat(auto-fill, minmax(min(240px, 100%), 1fr))' }}>
                              {notes.map(st => (
                                <div key={st.id} className="rounded-lg p-3 relative group" style={{ backgroundColor: st.color || '#fef08a', color: '#1a1918' }}>
                                  <button onClick={() => setConfirmAction({ title: 'Удалить заметку?', message: 'Заметка объекта исчезнет насовсем.',
                                            onConfirm: () => { setStickies(stickies.filter(x => x.id !== st.id)); deleteNetDoc('stickies', st.id); } })}
                                          title="Удалить заметку"
                                          className="cf-edit-only absolute flex items-center justify-center rounded-full opacity-0 group-hover:opacity-100 transition-all"
                                          style={{ top: 6, right: 6, width: 22, height: 22, color: 'rgba(0,0,0,.5)', fontSize: 11 }}>✕</button>
                                  <textarea value={st.text} onChange={(e) => { const up = stickies.map(x => x.id === st.id ? { ...x, text: e.target.value } : x); setStickies(up); syncDoc('stickies', st.id, up.find(x => x.id === st.id)); }}
                                            className="w-full bg-transparent border-none focus:outline-none resize-none font-bold leading-tight pr-5"
                                            style={{ fontSize: 13, minHeight: 72 }} placeholder="Что заметили на месте…" />
                                  <div className="flex gap-1 mt-1">
                                    {STICKY_COLORS.map(cc => (
                                      <button key={cc} onClick={() => paintStickies(st.id, cc)} title="Цвет заметки"
                                              style={{ background: cc, width: 14, height: 14 }}
                                              className={`cf-edit-only rounded-full border ${st.color === cc ? 'border-black/50' : 'border-black/10 hover:border-black/30'} transition-colors`} />
                                    ))}
                                  </div>
                                </div>
                              ))}
                              {notes.length === 0 && (
                                <button onClick={() => addLocationNote(l.id)} className="cf-edit-only flex items-center justify-center"
                                        style={{ border: '1px dashed var(--border)', borderRadius: 10, minHeight: 80, color: 'var(--muted-2)', fontSize: 11.5 }}>+ заметка</button>
                              )}
                            </div>
                          </main>
                        </React.Fragment>
                      );
                    })()}
                  </div>

                  {/* ИНТЕРАКТИВНАЯ ДОСКА (WHITEBOARD) */}
                  <div className={`h-full w-full relative ${currentView === 'whiteboard' ? 'flex flex-col' : 'hidden'}`}>

                    {/* ВКЛАДКИ ДОСОК */}
                    <div className="flex items-end gap-1 px-3 shrink-0 overflow-x-auto hide-scrollbar"
                         style={{ background: 'var(--panel-2)', borderBottom: '1px solid var(--border)' }}>
                      {sortedBoards.map(b => {
                        const on = b.id === activeBoardId;
                        return (
                          <button key={b.id} onClick={() => setActiveBoardId(b.id)}
                                  onDoubleClick={() => {
                                    // Правка спрятана в двойное нажатие, а не в кнопку,
                                    // поэтому cf-edit-only её не закрывает — проверяем сами.
                                    if (READ_ONLY) return;
                                    const t = prompt('Название доски', b.title);
                                    if (t && t.trim()) { const up = boards.map(x => x.id === b.id ? { ...x, title: t.trim() } : x); setBoards(up); syncDoc('boards', b.id, up.find(x => x.id === b.id)); }
                                  }}
                                  title={on ? 'Двойной клик — переименовать' : b.title}
                                  className="shrink-0 flex items-center gap-2 transition-colors"
                                  style={{ padding: '9px 15px', borderRadius: '8px 8px 0 0', minHeight: 40,
                                           background: on ? 'var(--bg)' : 'transparent',
                                           borderBottom: on ? '2px solid var(--accent)' : '2px solid transparent',
                                           color: on ? 'var(--text)' : 'var(--muted-2)', fontSize: 12.5 }}>
                            {b.title}
                            {/* Крестик виден только тому, кто может править:
                                у гостя по ссылке доска исчезала с экрана —
                                в облаке она оставалась цела, но выглядело
                                это как «я сломал чужой проект». */}
                            {on && !READ_ONLY && sortedBoards.length > 1 && (
                              <span onClick={(e) => {
                                      e.stopPropagation();
                                      setConfirmAction({ title: 'Удалить доску?', message: `«${b.title}» и всё, что на ней нарисовано и разложено.`, onConfirm: () => {
                                        const rest = boards.filter(x => x.id !== b.id);
                                        setBoards(rest); deleteNetDoc('boards', b.id);
                                        // Заметки объекта живут на доске как обычные
                                        // бумажки, но принадлежат МЕСТУ, а не доске:
                                        // вместе с доской они бы молча пропали
                                        // с экрана объекта. Их снимаем с доски,
                                        // а не удаляем.
                                        const doomed = stickies.filter(st => belongsToBoard(st, b.id) && !st.locationId);
                                        const rehomed = stickies.filter(st => belongsToBoard(st, b.id) && st.locationId)
                                                                .map(st => ({ ...st, boardId: '' }));
                                        doomed.forEach(st => deleteNetDoc('stickies', st.id));
                                        rehomed.forEach(st => syncDoc('stickies', st.id, st));
                                        setStickies(stickies
                                          .filter(st => !belongsToBoard(st, b.id) || st.locationId)
                                          .map(st => (belongsToBoard(st, b.id) && st.locationId) ? { ...st, boardId: '' } : st));
                                        setReferences(references.map(r => r.boardId === b.id ? { ...r, boardId: '' } : r));
                                        references.filter(r => r.boardId === b.id).forEach(r => syncDoc('references', r.id, { ...r, boardId: '' }));
                                        // Сцены с удалённой доски просто снимаем — сами сцены остаются в проекте
                                        setScenes(scenes.map(s => s.boardId === b.id ? { ...s, boardId: '' } : s));
                                        scenes.filter(s => s.boardId === b.id).forEach(s => syncDoc('scenes', s.id, { ...s, boardId: '' }));
                                        try { localStorage.removeItem('cf_canvas_draw_' + b.id); localStorage.removeItem('cf_ink_' + b.id); localStorage.removeItem('cf_shapes_' + b.id); } catch (err) {}
                                        deleteNetDoc('canvas', canvasDocId(b.id));
                                        deleteNetDoc('canvas', strokesDocId(b.id));
                                        deleteNetDoc('canvas', shapesDocId(b.id));
                                        setActiveBoardId((rest[0] || DEFAULT_BOARD).id);
                                        showToast('Доска удалена · референсы остались в галерее');
                                      }});
