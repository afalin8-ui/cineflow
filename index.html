<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1918">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="./icon.svg">
    <link rel="apple-touch-icon" href="./icon.svg">
    <title>CineFlow Prep — Doppler Studio</title>
    <script>
        // Service worker: кэширует оболочку приложения и библиотеки с CDN,
        // чтобы приложение открывалось без интернета. Данные офлайн
        // обеспечивает сам Firestore (enablePersistence ниже).
        if ('serviceWorker' in navigator) {
          // Как только новый service worker берёт управление, перезагружаем
          // страницу — иначе на телефоне (особенно у иконки с рабочего стола)
          // можно неделями сидеть на старой версии и не видеть правок.
          let cfReloading = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (cfReloading) return;
            cfReloading = true;
            window.location.reload();
          });
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').then(reg => {
              reg.update();
              // Проверяем обновление каждый раз, когда возвращаются во вкладку.
              document.addEventListener('visibilitychange', () => {
                if (!document.hidden) reg.update();
              });
            }).catch(err => {
              console.warn('Service worker не зарегистрирован:', err);
            });
          });
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                indigo: { 50:'#fdf5f1',100:'#f9e5db',200:'#f3ccb8',300:'#eba98a',400:'#e28a63',500:'#d97757',600:'#c65d3d',700:'#a54a30',800:'#863e2b',900:'#6d3527',950:'#3a1a12' },
                // Шкала zinc — те же шесть шагов поверхностей и четыре
                // ступени текста, что и в :root. Классы zinc-* стоят в коде
                // тысячами, и подгонять их по одному значило бы навсегда
                // оставить два расходящихся набора оттенков.
                zinc: { 50:'#f0eee6',100:'#f0eee6',200:'#dedbd2',300:'#c9c5bb',400:'#a6a39a',500:'#6f6b63',600:'#4a4741',700:'#33312d',800:'#242322',900:'#1e1d1c',950:'#1a1918' }
              },
              fontFamily: {
                // Системный стек: на macOS/iPad это SF Pro, на остальных —
                // Helvetica/Arial. Ничего не загружается по сети.
                // serif намеренно тот же стек: отдельного display-шрифта
                // больше нет, а класс font-serif стоит в разметке во многих
                // местах — так он просто перестал что-либо менять.
                sans: ['-apple-system','SF Pro Text','Helvetica Neue','Helvetica','Arial','sans-serif'],
                serif: ['-apple-system','SF Pro Text','Helvetica Neue','Helvetica','Arial','sans-serif'],
                mono: ['ui-monospace','SF Mono','JetBrains Mono','Menlo','monospace']
              }
            }
          }
        };
    </script>
    <!-- Шрифты больше не загружаются: интерфейс идёт системным стеком
         (на macOS/iPad это SF Pro), моно — SF Mono. JetBrains Mono остался
         в списке фолбэков для тех, у кого он стоит в системе, но по сети
         не тянется: минус три запроса и мигание текста на старте. -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
          /* ОДНА ШКАЛА ПОВЕРХНОСТЕЙ, ШЕСТЬ ШАГОВ. Раньше рядом жили
             1c1b1a/1e1d1c и 2c2b28/363430 — разница между ними меньше
             того, что глаз считает намеренной, и оттенки «скакали»
             от экрана к экрану. Ничего мимо этой шкалы не заводим:
             новый оттенок — это всегда сначала вопрос «а какой из шести». */
          --bg: #1a1918;          /* холст, рабочая область */
          --surface: #1e1d1c;     /* шапка, левая панель, правая панель */
          --card: #242322;        /* карточки, блоки, выбранная строка */
          --raised: #2b2a28;      /* ховер, активная иконка */
          --border: #33312d;      /* все рамки */
          --line: #262421;        /* разделители строк в списках */

          /* Прежние имена оставлены и указывают на те же шесть шагов.
             Ими размечены тысячи строк, и переименование ради красоты
             означало бы правку в каждой из них — а любая пропущенная
             строка стала бы новым «скачущим» оттенком, ровно тем, что
             мы здесь и убираем. Читая ТЗ, держи в голове пару:
             --panel здесь = «карточка» из ТЗ, --surface = «панель». */
          --panel:   var(--card);    /* карточки, кнопки, выбранная строка, стикеры */
          --panel-2: var(--surface); /* шапка, боковые панели, чат */
          --panel-3: var(--surface); /* было #1c1b1a — слилось с панелью */
          --border-soft: var(--line);   /* было #2c2b28 */
          --canvas: var(--bg);          /* холст доски: его отличают точки сетки, не цвет */

          --text: #f0eee6;
          --text-2: #c9c5bb;      /* абзацы, описания */
          --muted: #a6a39a;       /* подписи, метки разделов */
          --muted-2: #6f6b63;     /* служебное, моно-метки */

          --accent: #d97757;
          --accent-hover: #e28a63;
          --accent-soft: rgba(217,119,87,.12);  /* фон своего сообщения в чате */
          --accent-line: rgba(217,119,87,.45);  /* рамка активного тега */

          --ok: #7a9d6b;          /* снято, сохранено */
          --warn: #facc15;        /* солнце, приборы на схеме света, стикеры */
          --danger: #a8574a;      /* очистить, удалить */
          --ink-yellow: var(--warn);
          --ink-blue: #60a5fa;

          --header-h: 42px;
          --panel-strip: 40px;    /* свёрнутая боковая панель */
          --tool-rail: 44px;      /* панель инструментов доски */
          --tabbar-h: 56px;       /* нижняя навигация телефона */

          /* ДВА ШРИФТА, ОБА СИСТЕМНЫЕ. На macOS и iPad -apple-system даёт
             SF Pro — ту самую гельветику, — на остальных падаем в Helvetica
             и Arial. Загружать нечего, поэтому текст не мигает на старте.
             Моно нужен там, где цифры обязаны стоять столбиком: номера сцен,
             оптика, тайм-коды, бейджи. */
          --font-ui: -apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif;
          --font-mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace;
        }
        body {
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            touch-action: none;
            font-family: var(--font-ui);
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }
        ::selection { background: rgba(217,119,87,0.3); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--raised); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .wb-color-well::-webkit-color-swatch-wrapper { padding: 0; }
        .wb-color-well::-webkit-color-swatch { border: none; border-radius: 9999px; }
        .wb-color-well::-moz-color-swatch { border: none; border-radius: 9999px; }
        .no-select { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }

        /* Кнопки, которые «появляются при наведении», на планшете НЕ появляются
           никогда: наведения мыши там не существует. То есть удалить кадр,
           выделить референс или положить его на доску пальцем было нельзя.
           Показываем их приглушённо — видно, но не кричит. */
        @media (hover: none) {
          .opacity-0.group-hover\:opacity-100 { opacity: .62 !important; }
        }
        /* Отдельного display-шрифта больше нет: заголовок отличает вес
           и плотный трекинг, а не другая гарнитура. */
        h1, h2, h3 { font-family: var(--font-ui); font-weight: 700; letter-spacing: -0.02em; }
        .glass-panel {
            background: var(--panel);
            border: 1px solid var(--border);
        }
        .glass-input {
            background: var(--panel-2);
            border: 1px solid var(--border);
            color: var(--text);
        }
        .glass-input::placeholder { color: var(--muted-2); }
        .glass-input:focus, .glass-input:focus-within {
            border-color: var(--accent);
            outline: none;
        }
        /* Текст на карточке доски, пока его не правят: обычный текст,
           а не поле ввода. Нажатие должно попадать в карточку — иначе её
           не сдвинуть пальцем, а это на планшете главный жест. */
        .cf-card-text { white-space: pre-wrap; overflow-wrap: anywhere; overflow: hidden;
                        cursor: move; user-select: none; -webkit-user-select: none; }
        .cf-card-text:empty::before { content: ''; }
        .scene-drop-target { box-shadow: 0 0 0 2px var(--accent), 0 0 20px rgba(217,119,87,0.4); }

        /* ---------- утилиты редизайна ---------- */
        :focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }

        /* метка раздела над блоком */
        .cf-eyebrow { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

        /* служебная моно-подпись: слаглайн, дата, счётчики */
        .cf-meta { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .04em; color: var(--muted-2); }

        /* Карточка галереи: браузер пропускает отрисовку того, что за
           экраном. При сотне референсов это главный рычаг для прокрутки.
           Где не поддерживается (старые Safari) — правило просто
           игнорируется, ничего не ломая. Высоту подсказываем заранее,
           иначе полоса прокрутки скачет. */
        .cf-ref-card { content-visibility: auto; contain-intrinsic-size: auto 300px; }
        /* чип параметра или тега */
        .cf-chip { font-family: var(--font-mono); font-size: 10px; letter-spacing: .04em; color: var(--muted); background: var(--panel); border: 1px solid var(--border); padding: 4px 7px; border-radius: 5px; }
        .cf-chip-accent { color: var(--accent); background: transparent; border-color: var(--accent-line); }

        /* строка списка: граница есть всегда, меняется только цвет — текст не сдвигается при выборе */
        .cf-row { border-left: 2px solid transparent; border-bottom: 1px solid var(--border-soft); cursor: pointer; }
        .cf-row-on { background: var(--panel); border-left-color: var(--accent); }

        /* свёрнутая боковая панель */
        .cf-strip { width: var(--panel-strip); background: var(--panel-3); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px 0; cursor: pointer; }
        .cf-strip span { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted-2); writing-mode: vertical-rl; }

        /* холст доски */
        /* точки намеренно еле заметны: сетка нужна как ориентир при
           перетаскивании, но не должна спорить с референсами на доске */
        .cf-canvas { background: var(--canvas); background-image: radial-gradient(rgba(240,238,230,.05) 1.2px, transparent 1.2px); background-size: 26px 26px; }
        /* ДЛИННЫЙ ШТРИХ ПЕРОМ — это рисование, а не «правый щелчок».
           Браузер считает долгое удержание пера или пальца вызовом
           контекстного меню, и на отпускании оно выскакивало прямо
           поверх доски: медленную линию нельзя было довести до конца.
           На iPad то же самое делает системная выноска (callout).
           Гасим и то, и другое — но только на самих холстах и на
           области доски, а не на карточках: текст в карточке
           по-прежнему выделяется и копируется. */
        #whiteboard-canvas { -webkit-touch-callout: none; }
        #whiteboard-canvas canvas { touch-action: none; -webkit-touch-callout: none;
                                    -webkit-user-select: none; user-select: none; }

        /* Режим «только просмотр». Ничего не уходит в облако (см. syncDoc),
           а здесь дополнительно гасим саму возможность что-то печатать,
           чтобы человек не решил, будто его правки сохранятся. */
        body.cf-readonly input,
        body.cf-readonly textarea,
        body.cf-readonly select { pointer-events: none !important; user-select: none; }
        body.cf-readonly .cf-edit-only { display: none !important; }
        .cf-ro-badge { position: fixed; top: 8px; right: 8px; z-index: 300; font-size: 11px;
                       letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px;
                       border-radius: 999px; background: var(--panel); color: var(--muted);
                       border: 1px solid var(--border); pointer-events: none; }

        /* метка поверх превью кадра */
        .cf-overlay { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--text); background: rgba(26,25,24,.72); padding: 3px 6px; border-radius: 3px; }

        /* ---------- навигация: одна строка, в шапке ----------
           Левого рельса больше нет. Он был второй навигацией рядом со
           списком сцен, и человек каждый раз выбирал, в какой из двух
           колонок искать. Модули переехали в шапку строкой иконок:
           у активного вместо иконки — оранжевый квадратик с заглавной
           буквой, вплотную к остатку слова («[С]цены»), у остальных
           только иконка с подсказкой в title. Так навигация занимает
           одну строку высотой 42 точки вместо целой колонки в 66. */
        .cf-navtab { display: flex; align-items: center; padding: 5px 7px; border-radius: 6px; color: var(--muted); flex-shrink: 0; }
        .cf-navtab svg { width: 14px; height: 14px; }
        .cf-navtab:hover { color: var(--text-2); background: var(--raised); }
        /* Активный: лёгкий контур вместо подложки — подложка спорила
           с оранжевым квадратиком и читалась как «нажато», а не «здесь я». */
        .cf-navtab-on, .cf-navtab-on:hover {
          padding: 3px 9px 3px 3px; border: 1px solid #4a4741; background: transparent;
          color: var(--text); font-size: 12px; font-weight: 600; cursor: default;
        }
        /* Зазор в 1px: буква обязана читаться как часть слова, иначе
           квадратик выглядит отдельным значком рядом с обрубком. */
        .cf-navtab-key {
          width: 20px; height: 20px; margin-right: 1px; flex-shrink: 0;
          background: var(--accent); color: var(--bg); border-radius: 5px;
          font-weight: 700; letter-spacing: -.02em; font-size: 12px;
          display: flex; align-items: center; justify-content: center;
        }
        /* Поиск сжимается первым: на 924 точках места на всё не хватает,
           и уступить обязано именно поле, а не навигация. */
        .cf-search {
          display: flex; align-items: center; gap: 8px; flex: 1; min-width: 40px; max-width: 170px;
          background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
          padding: 5px 10px; color: var(--muted-2); font-size: 11.5px; white-space: nowrap; overflow: hidden;
        }
        .cf-search:hover { border-color: #4a4741; color: var(--muted); }
        .cf-kbd { font-family: var(--font-mono); font-size: 9.5px; border: 1px solid var(--border); border-radius: 4px; padding: 1px 4px; flex-shrink: 0; }
        /* Прятать на узком экране. Своим классом, а не tailwind-овским
           `hidden`: у него тот же вес, что у .cf-seg{display:flex}, и кто
           победит, зависело от того, в каком порядке браузер собрал таблицы
           стилей — на телефоне режимы то появлялись, то нет. */
        .cf-wide-only { display: none !important; }
        @media (min-width: 768px) { .cf-wide-only { display: flex !important; } }

        /* переключатель-сегменты: режимы сцены, кадры/текст в раскадровке */
        .cf-seg { display: flex; padding: 2px; border: 1px solid var(--border); border-radius: 7px; gap: 2px; flex-shrink: 0; }
        .cf-seg > * { font-size: 11px; padding: 4px 9px; border-radius: 5px; color: var(--muted); font-weight: 600; white-space: nowrap; }
        .cf-seg > .on { background: var(--accent); color: var(--bg); }
        /* ---------- инструменты доски ----------
           Один размер на все кнопки: 32 точки внутри полосы в 44 — цель,
           в которую попадают пальцем, и колонка, которая помещается
           на экран планшета. У полосы свой скролл (её высота фиксирована
           по холсту), поэтому ничего не срезается снизу. */
        .cf-tool { width: 32px; height: 32px; flex-shrink: 0; border-radius: 7px; color: var(--muted);
                   display: flex; align-items: center; justify-content: center; transition: background .12s, color .12s; }
        .cf-tool:hover { background: var(--raised); color: var(--accent); }
        .cf-tool.on, .cf-tool.on:hover { background: var(--accent); color: var(--bg); }
        .cf-tool.off { color: var(--border); cursor: not-allowed; }
        .cf-tool.off:hover { background: transparent; color: var(--border); }
        .cf-tool-sep { display: block; width: 24px; height: 1px; background: var(--border); margin: 3px 0; flex-shrink: 0; }

        /* ---------- ТЕЛЕФОН ----------
           Телефон — прибор ПЛОЩАДКИ, а не уменьшенный планшет. Строка
           иконок в шапке там нечитаема и не попадаема пальцем, поэтому
           навигация уезжает вниз, в таб-бар: большой палец достаёт до него,
           не перехватывая телефон. Наведения на телефоне не существует —
           все состояния только нажатием. */
        .cf-tabbar { display: flex; flex-shrink: 0; background: var(--panel-2); border-top: 1px solid var(--border);
                     padding: 6px 6px calc(4px + env(safe-area-inset-bottom, 0px)); }
        .cf-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
                  gap: 3px; min-height: 46px; color: var(--muted-2); }
        .cf-tab span { font-size: 10px; }
        .cf-tab.on { color: var(--accent); }
        .cf-tab.on span { font-weight: 600; }
        /* Фильтр-пилюля: 30 точек в высоту плюс поля — палец попадает. */
        .cf-pill { flex-shrink: 0; white-space: nowrap; font-size: 12px; padding: 8px 14px; min-height: 36px;
                   border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
        .cf-pill.on { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
        /* Лента до самых краёв экрана: обрезанная по полям она читается
           как «здесь всё», и вбок никто не листает. */
        .cf-bleed { margin-left: -16px; margin-right: -16px; padding-left: 16px; padding-right: 16px; }
        /* Шторка снизу — вместо правой панели-вкладок: на телефоне панель
           сбоку съела бы весь экран. Высота по видимой части (dvh):
           панели браузера то появляются, то исчезают. */
        .cf-sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 260;
                    background: var(--card); border-top: 1px solid var(--border); border-radius: 16px 16px 0 0;
                    max-height: 80vh; max-height: 80dvh; overflow-y: auto; overscroll-behavior: contain;
                    box-shadow: 0 -12px 40px rgba(0,0,0,.5); padding-bottom: env(safe-area-inset-bottom, 0px); }
        .cf-sheet-grip { width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: 8px auto 0; }
        /* Плитка вместо вкладки правой панели */
        .cf-tile { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 10px;
                   padding: 11px 12px; font-size: 12.5px; color: var(--text-2); min-height: 44px; text-align: left; }
        /* карточка шаблона на пустой доске */
        .cf-tpl { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; cursor: pointer; transition: border-color .12s; }
        .cf-tpl:hover { border-color: var(--accent); }
        .cf-tools::-webkit-scrollbar { width: 0; height: 0; }

        /* выпадающее меню «···» */
        /* Меню прижато к ПРАВОМУ краю своей кнопки и потому годится только
           для кнопки у правого края экрана. У «···» сцены и объекта кнопка
           стоит СЛЕВА, у номера (см. «Экран сцены»), и меню шириной 190
           уезжало за левый край: на телефоне на 57 точек, а на планшете его
           срезала прокручиваемая середина. Строки при этом не нажимались
           вовсе. Такому меню нужен .cf-menu-left — оно раскрывается вправо.
           Заводя новое меню, смотри, у какого края стоит его кнопка. */
        .cf-menu-left { left: 0; right: auto; }
        .cf-menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 60; min-width: 190px; padding: 4px;
                   max-width: calc(100vw - 16px);
                   background: var(--card); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.5); }
        .cf-menu button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
                          padding: 8px 10px; border-radius: 7px; font-size: 12.5px; color: var(--text-2); min-height: 34px; }
        .cf-menu button:hover { background: var(--raised); color: var(--text); }
        .cf-menu hr { border: none; border-top: 1px solid var(--line); margin: 4px 2px; }

        /* Чат на телефоне выезжает справа ПОВЕРХ страницы, но живёт внутри
           слоя основной части (z-10), а шапка приложения лежит снаружи и
           выше (z-40). Из-за этого шапка накрывала верх чата вместе с его
           крестиком: нажатие на крестик попадало в кнопку «Доступ».
           Поднять чат выше нельзя — вместе с ним поднялась бы вся
           страница, — поэтому на телефоне он начинается ПОД шапкой.
           Класс повторён дважды намеренно: так правило перевешивает
           tailwind-классы (inset-y-0, h-full) и не зависит от того,
           в каком порядке браузер собрал таблицы стилей. */
        @media (max-width: 767px) {
          /* Чат не должен накрывать нижнюю навигацию: иначе, открыв его,
             из чата уже не выйти нажатием по вкладке. */
          .cf-chat-drawer.cf-chat-drawer { top: var(--header-h); height: auto; bottom: var(--tabbar-h); }
        }

        /* ---------- всплывающие окна ---------- */
        /* На телефоне окно почти всегда выше экрана. Раньше оно
           центрировалось ЦЕЛИКОМ, и лишняя высота уезжала за ОБА края:
           верх вместе с крестиком оказывался выше экрана, прокрутить
           туда было нельзя (окно не прокручивалось вовсе) — закрыть
           «Проект» или «Доступ» с телефона было попросту нечем.
           Теперь высота ограничена экраном, прокручивается содержимое,
           а крестик прилипает к верхнему краю и виден на любой прокрутке.
           Второй мерой обязателен dvh — высота ВИДИМОЙ части: панели
           браузера на телефоне то появляются, то исчезают, и 100vh
           заметно больше того, что человек видит. Строка с vh стоит
           первой как запасная, где dvh не понимают. */
        .cf-modal-box {
          max-height: calc(100vh - 32px);
          max-height: calc(100dvh - 32px);
          overflow-y: auto;
          overscroll-behavior: contain;
          -webkit-overflow-scrolling: touch;
        }
        /* Крестик вынут из потока (float) и прилипает (sticky), поэтому
           не сдвигает заголовок и не уезжает вверх при прокрутке.
           Фон обязателен НЕПРОЗРАЧНЫЙ: прилипший крестик проходит
           поверх текста, и сквозь полупрозрачный читались бы буквы. */
        .cf-modal-x {
          position: sticky;
          top: 0;
          float: right;
          z-index: 30;
          margin: -4px -4px 0 10px;
          background: var(--panel);
        }
        #print-area { display: none; }
        @media print {
            body { background: white !important; color: black !important; overflow: auto; touch-action: auto; }
            body * { visibility: hidden; }
            #print-area { display: block !important; position: absolute; left: 0; top: 0; width: 100%; padding: 24px; background: white !important; color: black !important; }
            #print-area, #print-area * { visibility: visible !important; }
            #print-area img { max-width: 100%; }
            .print-scene { page-break-inside: avoid; border-bottom: 1px solid #ccc; padding: 12px 0; }
            /* Объект НЕЛЬЗЯ держать на одной странице: у него бывает шесть
               десятков фотографий, и «не разрывать» на блоке выше страницы
               означает, что лишнее просто пропадает — отчёт уходит обрезанным
               и на глаз это заметно не сразу. Разрывать нельзя только сами
               карточки фотографий, отсюда .print-keep */
            .print-loc { border-bottom: 1px solid #ccc; padding: 12px 0; }
            .print-keep { page-break-inside: avoid; }
        }
    </style>

          appId: "1:1056447066293:web:c29cb639b3a3cdc3d0cefc"
        };
        // --- Режим «только просмотр» ---
        // Два способа поделиться, ничего не давая менять:
        //  1) ссылка вида ...?view=gallery — живые данные из облака,
        //     но все правки заблокированы и в облако ничего не уходит;
        //  2) файл-снимок: копия приложения со вшитыми данными
        //     (window.__CF_SNAPSHOT__), облако не подключается вообще.
        // scope — какие СТРАНИЦЫ показывать, через запятую.
        const CF_SNAPSHOT = (typeof window !== 'undefined' && window.__CF_SNAPSHOT__) || null;
        const CF_VIEW_SCOPE = CF_SNAPSHOT
          ? (CF_SNAPSHOT.scope || 'all')
          : (new URLSearchParams(location.search).get('view') || '');
        const READ_ONLY = !!CF_SNAPSHOT || !!CF_VIEW_SCOPE;

        // Ссылка-просмотр открывает СТРАНИЦЫ, а не «всё или ничего».
        // Умели ровно три случая — галерея, доска, весь проект, — и позвать
        // посмотреть ОДНИ объекты (то, ради чего чаще всего и зовут: «вот
        // куда едем») было нечем: `?view=locations` проваливался в ветку
        // «показать всё». Теперь в `?view=` лежит список страниц через
        // запятую. Старые ссылки продолжают работать: `gallery`, `board`
        // и `all` разбираются как прежде, а их уже разослали.
        const CF_ALL_VIEWS = ['notion', 'whiteboard', 'gallery', 'locations', 'table', 'docs'];
        const CF_VIEW_ALIAS = {
          all: '*',            gallery: 'gallery',   board: 'whiteboard',
          boards: 'whiteboard', whiteboard: 'whiteboard',
          scenes: 'notion',    notion: 'notion',     locations: 'locations',
          table: 'table',      kpp: 'table',         docs: 'docs'
        };
        const CF_VIEWS = (() => {
          if (!CF_VIEW_SCOPE) return CF_ALL_VIEWS;
          const out = [];
          String(CF_VIEW_SCOPE).split(',').forEach(part => {
            const id = CF_VIEW_ALIAS[part.trim().toLowerCase()];
            if (id === '*') CF_ALL_VIEWS.forEach(v => { if (out.indexOf(v) < 0) out.push(v); });
            else if (id && out.indexOf(id) < 0) out.push(id);
          });
          // Ссылка с опечаткой не должна открывать пустой экран без единой
          // вкладки: непонятное слово читаем как «весь проект».
          return out.length ? out : CF_ALL_VIEWS;
        })();
        if (READ_ONLY) document.body.classList.add('cf-readonly');

        // --- Комната проекта ---
        // Комната — это и есть граница между проектами: у кого код, тот
        // и видит данные. Раньше любой, кто открыл адрес, попадал в комнату
        // по умолчанию — то есть в ЧУЖОЙ проект. Теперь новый человек
        // получает свою пустую, а попасть в общую можно только по ссылке
        // с кодом (её даёт окно «Доступ»).
        const CF_URL_ROOM = new URLSearchParams(location.search).get('room');
        const LEGACY_ROOM = 'cineflow-room-3';
        const appId = (() => {
          if (CF_SNAPSHOT) return CF_SNAPSHOT.room;
          // Режим просмотра чужой ссылки комнату себе НЕ запоминает,
          // иначе своё приложение уехало бы в чужой проект.
          if (CF_VIEW_SCOPE) return CF_URL_ROOM || localStorage.getItem('cf_room') || LEGACY_ROOM;
          let room = CF_URL_ROOM || localStorage.getItem('cf_room');
          if (!room) {
            // Тот, кто уже работал до появления личных комнат, остаётся
            // в общей — иначе его проект «пропал бы».
            const worked = localStorage.getItem('cf_scenes') || localStorage.getItem('cf_user_name');
            room = worked ? LEGACY_ROOM
                          : 'room-' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
          }
          try { localStorage.setItem('cf_room', room); } catch (e) {}
          return room;
        })();

        let db = null;
        let auth = null;
        // Статус офлайн-копии: 'off' — кэш не включён, 'on' — работает
        window.cfPersistence = 'off';
        try {
          // Файл-снимок живёт полностью автономно: данные вшиты внутрь,
          // облако подключать нечего и незачем.
          if (CF_SNAPSHOT) throw new Error('snapshot mode');
          if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
          auth = firebase.auth();
          db = firebase.firestore();
          // Живые правки Firestore шлёт по одному длинному соединению.
          // Мобильные операторы такое соединение часто копят у себя
          // и отдают кусками — правка уезжает в облако, но обратно на
          // телефон приходит с большой задержкой или не приходит вовсе,
          // пока страницу не перезагрузишь. Ошибок при этом никаких:
          // подписка жива, просто молчит. Отсюда и «на iPad есть,
          // а с телефона нет» — iPad обычно сидит в Wi-Fi.
          // С этой настройкой библиотека сама замечает, что поток
          // не идёт, и переключается на обычные запросы. Вызывать
          // строго до первого обращения к базе.
          // Отдельная попытка: настройка необязательная, и если её
          // однажды переименуют, приложение должно потерять ускорение,
          // а не облако целиком — общий catch ниже увёл бы его
          // в автономный режим совсем без синхронизации.
          try {
            db.settings({ experimentalAutoDetectLongPolling: true });
          } catch (err) { console.warn('Настройка соединения не применилась:', err); }
          // Офлайн-копия базы прямо на устройстве (IndexedDB).
          // Читает из кэша без интернета, копит правки и сам досылает их,
          // когда связь вернётся. Вызывать строго до первых запросов.
          // synchronizeTabs — чтобы несколько вкладок делили один кэш.
          db.enablePersistence({ synchronizeTabs: true })
            .then(() => { window.cfPersistence = 'on'; })
            .catch(err => {
              // failed-precondition — открыто в нескольких вкладках старого браузера
              // unimplemented — браузер не поддерживает (например, приватный режим)
              // Приложение продолжает работать, просто без офлайн-кэша.
              console.warn("Офлайн-кэш недоступен:", err && err.code);
            });
        } catch (e) { console.warn("Локальный режим автономности:", e); }

        // --- Возврат к приложению на телефоне ---
        // Телефон усыпляет вкладку, как только её свернули, и соединение
        // с облаком засыпает вместе с ней. Обратно оно поднимается само,
        // но не сразу: минуту-другую приложение показывает вчерашнее.
        // На iPad это менее заметно — там приложение чаще остаётся
        // открытым. Поэтому при возврате обрываем соединение и поднимаем
        // заново: подписки цепляются к облаку сразу и приносят свежее.
        // Ничего не теряется — правки, которые не успели уехать, лежат
        // в очереди на устройстве и уходят следом.
        let cfKickAt = 0, cfHiddenAt = 0, cfKicking = null;
        const cfKickSync = (force) => {
          if (!db) return Promise.resolve();
          // Второй заход поверх первого запускать НЕЛЬЗЯ. «Появилась сеть»,
          // возврат из фона и нажатие на точку связи прилетают почти
          // одновременно, а disableNetwork/enableNetwork — дело
          // асинхронное: именно наложение таких переключений и роняет
          // библиотеку с «INTERNAL ASSERTION FAILED». Пока идёт одно
          // переподключение, всем желающим отдаём его же.
          if (cfKicking) return cfKicking;
          const now = Date.now();
          if (!force && now - cfKickAt < 10000) return Promise.resolve();
          cfKickAt = now;
          cfKicking = db.disableNetwork()
            .then(() => db.enableNetwork())
            .catch(err => console.warn('Переподключение не удалось:', err))
            .then(() => { cfKicking = null; cfKickAt = Date.now(); });
          return cfKicking;
        };
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden') { cfHiddenAt = Date.now(); return; }
          // Мгновенное переключение вкладки соединение не роняет —
          // дёргать его на каждый такой чих значит только мешать.
          if (Date.now() - cfHiddenAt > 5000) cfKickSync();
        });
        window.addEventListener('online', () => cfKickSync(true));
        // Телефон умеет возвращать страницу из «замороженных» целиком,
        // минуя обычную загрузку: событие приходит с persisted.
        window.addEventListener('pageshow', (e) => { if (e.persisted) cfKickSync(true); });

        // --- СБОЙ ВНУТРИ САМОЙ БИБЛИОТЕКИ FIRESTORE ---
        // «INTERNAL ASSERTION FAILED: Unexpected state» — давняя её болезнь:
        // сообщения о ней есть на всех версиях с 7-й по 12-ю, и обновлением
        // она не лечится. Нам важно другое: после неё подписки МОЛЧАТ.
        // Приложение продолжает работать, показывает вчерашнюю картину и
        // ни слова об этом не говорит — а на площадке это значит, что
        // человек правит проект, которого никто не видит. Поэтому ловим
        // сами и говорим прямо. Данные при этом целы: в облаке лежит всё,
        // что успело уехать, испорчена только местная копия базы.
        window.cfCloudBroken = '';
        const cfIsAssert = (m) => /INTERNAL ASSERTION FAILED/i.test(String(m || ''));
        const cfCloudCrash = (msg) => {
          if (window.cfCloudBroken) return;
          window.cfCloudBroken = String(msg || 'Firestore').slice(0, 300);
          try { window.dispatchEvent(new CustomEvent('cf-cloud-broken')); } catch (e) {}
        };
        window.addEventListener('error', (e) => { if (cfIsAssert(e && e.message)) cfCloudCrash(e.message); });
        window.addEventListener('unhandledrejection', (e) => {
          const r = (e && e.reason) || '';
          const m = r && r.message ? r.message : r;
          if (cfIsAssert(m)) cfCloudCrash(m);
        });

        // Чтение Excel нужно ровно в одном месте — при импорте КПП.
        // На старте эта библиотека стоила 861 КБ загрузки и разбора КАЖДОМУ,
        // включая тех, кто таблиц не открывает вовсе. Теперь подгружаем её
        // в момент нажатия. Из кэша service worker'а она достаётся и офлайн.
        let xlsxLoading = null;
        const loadXLSX = () => {
          if (window.XLSX) return Promise.resolve(window.XLSX);
          if (!xlsxLoading) xlsxLoading = new Promise((res, rej) => {
            const s = document.createElement('script');
            s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
            s.onload = () => res(window.XLSX);
            s.onerror = () => { xlsxLoading = null; rej(new Error('не удалось загрузить чтение таблиц')); };
            document.head.appendChild(s);
          });
          return xlsxLoading;
        };

        const compressImage = (base64Str, maxWidth, maxHeight, callback, quality) => {
          const img = new Image();
          img.onerror = () => callback(base64Str);
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width; let height = img.height;
            if (width > height) { if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; } }
            else { if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; } }
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);
            callback(canvas.toDataURL('image/jpeg', quality || 0.8));
          };
          img.src = base64Str;
        };

        // =====================================================================
        // ПАНОРАМЫ 360° (Insta360 X5 и любые другие сферические кадры)
        // =====================================================================
        // Что кладут в приложение: ГОТОВЫЙ 360-снимок в обычном JPG.
        // Сама камера пишет свой формат .insp — это НЕ панорама, а два
        // круглых полукадра, которые сшивает приложение Insta360 по
        // калибровке конкретной камеры. Повторить сшивку в браузере нечем,
        // поэтому шаг «Экспорт → 360 фото» в приложении камеры остаётся
        // ручным всегда. Забирать кадры прямо с камеры по её Wi-Fi тоже
        // нельзя: камера отвечает по http, а приложение живёт на https,
        // и браузер такие запросы запрещает наглухо.
        //
        // Готовый кадр — равнопромежуточная развёртка: вся сфера разложена
        // в прямоугольник ровно 2:1. Плоским его смотреть бессмысленно,
        // поэтому в полноэкранном просмотре он натягивается обратно на сферу.

        // Сколько точек в ширину показываем. Полный кадр X5 — 11968×5984,
        // в распакованном виде это около 290 МБ памяти видеокарты: планшет
        // столько не даст и молча покажет пустоту, без единой ошибки.
        // 4096 — практический потолок для iPad и заметно больше того,
        // что реально видно на экране.
        const PANO_VIEW_W = 4096;
        // Панорамное превью, которое лежит в САМОМ проекте. Оно тут ради
        // площадки: связи там часто нет вовсе, а полный размер живёт
        // в облаке. Предел документа Firestore — 1 МБ, и base64 раздувает
        // картинку ещё на треть, поэтому 2048×1024 — мягко, но осмотреться
        // можно, и весит около 300 КБ.
        const PANO_THUMB_W = 2048;
        const PANO_THUMB_MAX = 640 * 1024;

        // Уменьшение ПРИ РАСПАКОВКЕ. Обычный путь «прочитать файл целиком
        // → отдать картинке → нарисовать в canvas» на 72 мегапикселях
        // разворачивает в памяти те самые 290 МБ, и Safari на планшете
        // отдаёт пустоту вместо картинки. createImageBitmap умеет
        // распаковывать сразу в нужный размер, полный кадр в память
        // не попадает. Где его нет — старый путь, он хотя бы работает
        // на снимках поменьше.
        const decodeScaled = async (src, w, h) => {
          const blob = src instanceof Blob ? src : await (await fetch(src)).blob();
          if (typeof createImageBitmap === 'function') {
            try {
              return await createImageBitmap(blob, { resizeWidth: w, resizeHeight: h, resizeQuality: 'high' });
            } catch (e) { /* старый Safari не знает про resizeWidth — идём ниже */ }
          }
          const url = URL.createObjectURL(blob);
          try {
            return await new Promise((res, rej) => {
              const img = new Image();
              img.onload = () => res(img);
              img.onerror = rej;
              img.src = url;
            });
          } finally { setTimeout(() => URL.revokeObjectURL(url), 10000); }
        };

        // Ближайшая степень двойки вверх. Нужна, потому что бесшовное
        // заворачивание текстуры по горизонтали (без него на стыке
        // панорамы видна щель) в WebGL работает только на таких размерах.
        const potCeil = (v) => { let p = 1; while (p < v) p *= 2; return p; };

        // Размер кадра ИЗ ЗАГОЛОВКА файла, без распаковки. Обычный путь
        // «отдать файл картинке и спросить naturalWidth» заставляет браузер
        // распаковать все 72 мегапикселя — только чтобы узнать два числа.
        // На планшете это лишние 290 МБ на каждую фотографию в пачке.
        const jpegSizeOf = (buf) => {
          try {
            const d = new DataView(buf);
            if (d.getUint16(0) !== 0xFFD8) return null;
            let o = 2;
            while (o + 9 < d.byteLength) {
              if (d.getUint8(o) !== 0xFF) { o++; continue; }
              const m = d.getUint8(o + 1);
              if (m === 0xD8 || m === 0x01 || (m >= 0xD0 && m <= 0xD7)) { o += 2; continue; }
              const len = d.getUint16(o + 2);
              // Начало кадра (SOF): там и лежат высота с шириной.
              // C4, C8, CC — это таблицы, а не кадр.
              if (m >= 0xC0 && m <= 0xCF && m !== 0xC4 && m !== 0xC8 && m !== 0xCC) {
                return { h: d.getUint16(o + 5), w: d.getUint16(o + 7) };
              }
              if (len < 2) return null;
              o += 2 + len;
            }
          } catch (e) {}
          return null;
        };

        const imageSizeOf = (file) => new Promise((resolve) => {
          const url = URL.createObjectURL(file);
          const img = new Image();
          img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
          img.onload = () => {
            URL.revokeObjectURL(url);
            resolve({ w: img.naturalWidth || img.width, h: img.naturalHeight || img.height });
          };
          img.src = url;
        });

        // Панорама или обычная фотография. Сначала метка в файле, и только
        // если её нет — пропорции: у развёртки они ровно 2:1. Ошибиться
        // может и то и другое (метки Insta360 кладёт не всегда, а 2:1
        // бывает и у обычного кадрированного снимка), поэтому последнее
        // слово оставлено человеку — в просмотре есть переключатель.
        const detectPano = async (file) => {
          let size = null;
          try {
            const head = await file.slice(0, 512 * 1024).arrayBuffer();
            const txt = new TextDecoder('iso-8859-1').decode(head);
            const i = txt.indexOf('GPano:ProjectionType');
            if (i >= 0) return /equirectangular/i.test(txt.slice(i, i + 120));
            if (/GPano:UsePanoramaViewer[^a-z]{1,4}True/i.test(txt)) return true;
            size = jpegSizeOf(head);
          } catch (e) {}
          if (!size) size = await imageSizeOf(file);
          return !!size && size.w >= 2048 && Math.abs(size.w / size.h - 2) < 0.01;
        };

        // Две картинки из одного распаковывания: панорамное превью для
        // проекта и обычная плоская миниатюра для галереи, доски и печати.
        // Распаковывать дважды незачем — большой кадр это самая дорогая
        // часть всей загрузки.
        const makePanoAssets = async (file) => {
          try {
            const bmp = await decodeScaled(file, PANO_THUMB_W, PANO_THUMB_W / 2);
            const cv = document.createElement('canvas');
            cv.width = PANO_THUMB_W; cv.height = PANO_THUMB_W / 2;
            cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
            let pano = '';
            // Качество снижаем ступенями: лучше мягче, чем не влезть
            // в документ и потерять возможность смотреть офлайн.
            for (const q of [0.72, 0.6, 0.5, 0.4]) {
              pano = cv.toDataURL('image/jpeg', q);
              if (pano.length <= PANO_THUMB_MAX) break;
            }
            if (pano.length > PANO_THUMB_MAX) pano = '';
            const flat = document.createElement('canvas');
            flat.width = 640; flat.height = 320;
            flat.getContext('2d').drawImage(cv, 0, 0, flat.width, flat.height);
            if (bmp.close) bmp.close();
            return { panoUrl: pano, url: flat.toDataURL('image/jpeg', 0.75) };
          } catch (e) {
            console.warn('Панорама: не удалось подготовить превью', e);
            return { panoUrl: '', url: '' };
          }
        };

        // =====================================================================
        // ВНЕШНЕЕ ХРАНИЛИЩЕ ФОТОГРАФИЙ (Dropbox / Яндекс.Диск / Nextcloud)
        // =====================================================================
        // Зачем: картинки лежали в базе целиком, в base64. Предел документа
        // Firestore — 1 МБ, и на сотне фотографий проект упирался в потолок.
        // Теперь оригинал уезжает в облако пользователя, а в базе остаётся
        // МАЛЕНЬКОЕ превью (`url`) и ссылка на оригинал (`full`).
        //
        // Почему превью всё-таки хранится в базе: галерея и доска обязаны
        // открываться мгновенно и БЕЗ интернета — на площадке связи часто
        // нет вовсе. Полный размер подтягивается из облака только когда
        // фотографию открывают на весь экран.
        //
        // Поле `url` НЕ переименовано намеренно: на него смотрят галерея,
        // доска, печать, файл-снимок и старые фотографии, залитые до
        // появления облака. Пусть в нём лежит то, что показывают.
        const CLOUD_KEY = 'cf_cloud';
        const CLOUD_NAMES = { dropbox: 'Dropbox', yandex: 'Яндекс.Диск', nextcloud: 'Nextcloud' };
        const loadCloudCfg = () => {
          try { return JSON.parse(localStorage.getItem(CLOUD_KEY)) || {}; } catch (e) { return {}; }
        };
        // Ключи живут в ДВУХ местах, и оба обязательны:
        //   localStorage — рабочая копия. Она читается СИНХРОННО и работает
        //     без связи; на неё смотрят loadCloudCfg, dropboxAccess и всё
        //     остальное, что уже написано. Её и оставляем.
        //   документ комнаты (settings/keys) — общая правда. Ради него всё
        //     и затевалось: раньше облако приходилось подключать на КАЖДОМ
        //     устройстве, откуда грузят фотографии, и человек с планшета
        //     видел «облако не подключено» на проекте, где оно подключено.
        // Порядок такой: пишем местную копию (она нужна сейчас же), потом
        // отправляем в комнату. Обратно приезжает через подписку.
        //
        // Хук, а не прямой вызов: saveCloudCfg живёт на модульном уровне
        // (её зовёт и обновление ключа Dropbox раз в четыре часа, вне
        // всякого React), а отправка в комнату умеет работать только
        // изнутри приложения, где есть db и appId.
        window.cfPushKeys = null;
        const saveCloudCfg = (cfg, share = true) => {
          try { localStorage.setItem(CLOUD_KEY, JSON.stringify(cfg)); } catch (e) {}
          if (share && window.cfPushKeys) { try { window.cfPushKeys({ cloud: cfg }); } catch (e) {} }
          return cfg;
        };
        // Комната — ЕДИНСТВЕННАЯ граница: кто знает код, тот видит данные.
        // Значит и ключи из этого документа получает любой, у кого есть код.
        // Сказано об этом прямо в обоих окнах настройки, и там же стоит
        // выключатель для тех, кто раздаёт код широко.

        // Имя файла в облаке: латиница и цифры, остальное — подчёркиванием.
        // Кириллица в пути ломает заголовок Dropbox-API-Arg и путается
        // в WebDAV, а ценности не несёт — подпись хранится в проекте.
        const cloudFileName = (refId, original) => {
          const dot = String(original || '').lastIndexOf('.');
          let ext = dot > 0 ? String(original).slice(dot + 1).toLowerCase() : 'jpg';
          if (!/^[a-z0-9]{1,5}$/.test(ext)) ext = 'jpg';
          return `${refId}.${ext}`;
        };
        // Имя файла ПРОЕКТА (КПП, сценарий, доки) в облаке. Отличается от
        // фотографии тем, что его скачивают руками: браузер сохранит файл
        // ровно под тем именем, под которым он лежит в облаке, и «file-1755…
        // .pdf» вместо «КПП.pdf» — это то, что человек потом не найдёт
        // у себя в загрузках. Поэтому латиницу из настоящего имени
        // оставляем, а id дописываем, чтобы два одинаковых имени
        // не затёрли друг друга.
        const cloudDocName = (id, original) => {
          const s = String(original || '');
          const dot = s.lastIndexOf('.');
          let ext = dot > 0 ? s.slice(dot + 1).toLowerCase() : '';
          if (!/^[a-z0-9]{1,5}$/.test(ext)) ext = 'bin';
          const base = (dot > 0 ? s.slice(0, dot) : s)
            .replace(/[^a-zA-Z0-9._-]+/g, '_').replace(/^[_.]+|[_.]+$/g, '').slice(0, 40);
          return `${base ? base + '-' : ''}${id}.${ext}`;
        };
        // Заголовок HTTP не пропускает буквы вне ASCII — Dropbox требует
        // экранировать их прямо в JSON.
        const asciiJSON = (obj) => JSON.stringify(obj)
          .replace(/[\u007f-\uffff]/g, c => '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0'));

        const cloudErr = async (res, what) => {
          let text = '';
          try { text = (await res.text()).slice(0, 300); } catch (e) {}
          // Номер запроса Dropbox кладёт в заголовок и НАМЕРЕННО открывает
          // его браузеру (он перечислен в Access-Control-Expose-Headers).
          // Без него ответ «501 unexpected error occurred» — тупик: по
          // такому тексту нельзя понять ничего, а по номеру их поддержка
          // видит, что именно случилось на их стороне.
          let rid = '';
          try { rid = res.headers.get('x-dropbox-request-id') || ''; } catch (e) {}
          throw new Error(`${what}: ${res.status} ${text}${rid ? ` · номер запроса ${rid}` : ''}`);
        };

        // **Ответ 5xx — это «сломалось у них», а не «файл плохой».**
        // Один такой ответ не должен стоить фотографии: пробуем ещё
        // дважды с нарастающей паузой. Повторять безопасно — файл
        // уезжает в режиме overwrite, то есть повтор кладёт то же самое
        // на то же место. Ошибки 4xx не повторяем вовсе: там дело
        // в самой заявке, и второй такой же ответ будет тем же.
        // **«Failed to fetch» — это НЕ ответ облака, это ОТСУТСТВИЕ ответа.**
        // Запрос не дошёл вовсе: ни кода, ни текста, ни номера запроса.
        // Человеку такая строка не говорит ничего, а причина почти всегда
        // лежит снаружи приложения — VPN, антивирус со сканированием
        // соединений, расширение браузера или сеть, где этот адрес закрыт.
        // Отличать это от «облако отказало» обязательно: там чинят
        // настройки, здесь — дорогу до облака, и советы прямо
        // противоположные.
        const netErr = (url) => {
          let host = url;
          try { host = new URL(url).hostname; } catch (e) {}
          return new Error(
            `Не удалось соединиться с ${host}: запрос не дошёл, ответа нет вовсе. ` +
            `Это не отказ облака — до него ничего не долетело. Обычно мешает ` +
            `что-то снаружи приложения: VPN, антивирус, расширение браузера ` +
            `или сеть, где этот адрес закрыт. Проверить просто: откройте ` +
            `https://${host}/ в новой вкладке — если страница не открывается ` +
            `вовсе, дело в дороге до облака, а не в настройках.`);
        };

        const cloudFetch = async (url, opts, tries = 3) => {
          let last = null;
          for (let i = 0; i < tries; i++) {
            try {
              const res = await fetch(url, opts);
              if (res.status < 500) return res;
              last = res;
            } catch (e) {
              last = e;
              if (i === tries - 1) throw netErr(url);
            }
            if (i < tries - 1) await new Promise(r => setTimeout(r, 700 * (i + 1)));
          }
          if (last instanceof Error) throw netErr(url);
          return last;
        };

        // --- Dropbox ---
        // Короткий ключ доступа живёт 4 часа, поэтому храним долгий
        // refresh_token и меняем его на свежий ключ по необходимости.
        const dropboxAccess = async (cfg) => {
          if (cfg.token && cfg.expires && Date.now() < cfg.expires - 60000) return cfg.token;
          if (!cfg.refresh) {
            if (cfg.token) return cfg.token; // вставили ключ руками
            throw new Error('Dropbox не подключён');
          }
          const res = await fetch('https://api.dropboxapi.com/oauth2/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
              grant_type: 'refresh_token', refresh_token: cfg.refresh, client_id: cfg.appKey || ''
            })
          });
          if (!res.ok) await cloudErr(res, 'Dropbox не обновил ключ доступа');
          const j = await res.json();
          const next = saveCloudCfg({ ...loadCloudCfg(), token: j.access_token, expires: Date.now() + (j.expires_in || 14400) * 1000 });
          return next.token;
        };
        // Ссылка вида .../file.jpg?rlkey=..&dl=0 открывает СТРАНИЦУ Dropbox.
        // Картинку отдаёт та же ссылка с raw=1; dl=1 не годится — он
        // помечает файл как вложение, и <img> его не покажет.
        // Адрес разбираем по-настоящему, а не вырезаем строкой: если dl=0
        // окажется не последним параметром, вырезание строкой оставит
        // висящий «&» и склеит ссылку в мусор.
        const dropboxRaw = (url) => {
          try {
            const u = new URL(url);
            u.searchParams.delete('dl');
            u.searchParams.set('raw', '1');
            return u.toString();
          } catch (e) { return String(url); }
        };
        const dropboxUpload = async (cfg, file, name) => {
          const token = await dropboxAccess(cfg);
          const path = '/' + (cfg.folder || 'CineFlow').replace(/^\/+|\/+$/g, '') + '/' + name;
          const up = await cloudFetch('https://content.dropboxapi.com/2/files/upload', {
            method: 'POST',
            headers: {
              'Authorization': 'Bearer ' + token,
              'Dropbox-API-Arg': asciiJSON({ path, mode: 'overwrite', mute: true }),
              'Content-Type': 'application/octet-stream'
            },
            body: file
          });
          if (!up.ok) await cloudErr(up, 'Dropbox не принял файл');
          const meta = await up.json();
          // Публичная ссылка. Если она уже есть, Dropbox отвечает ошибкой —
          // тогда спрашиваем существующую, а не считаем это провалом.
          const mk = await fetch('https://api.dropboxapi.com/2/sharing/create_shared_link_with_settings', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: asciiJSON({ path: meta.path_lower, settings: { requested_visibility: 'public' } })
          });
          let link = '';
          if (mk.ok) { link = (await mk.json()).url; }
          else {
            const list = await fetch('https://api.dropboxapi.com/2/sharing/list_shared_links', {
              method: 'POST',
              headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
              body: asciiJSON({ path: meta.path_lower, direct_only: true })
            });
            if (!list.ok) await cloudErr(list, 'Dropbox не дал ссылку на файл');
            const j = await list.json();
            link = (j.links && j.links[0] && j.links[0].url) || '';
          }
          if (!link) throw new Error('Dropbox не дал ссылку на файл');
          return { full: dropboxRaw(link), path: meta.path_lower };
        };

        // --- Яндекс.Диск ---
        const yandexHead = (cfg) => ({ 'Authorization': 'OAuth ' + (cfg.token || '') });
        const yandexUpload = async (cfg, file, name) => {
          const folder = (cfg.folder || 'CineFlow').replace(/^\/+|\/+$/g, '');
          // Папку создаём молча: 409 значит «уже есть», это не ошибка.
          await fetch('https://cloud-api.yandex.net/v1/disk/resources?path=' + encodeURIComponent('disk:/' + folder),
            { method: 'PUT', headers: yandexHead(cfg) }).catch(() => {});
          const path = 'disk:/' + folder + '/' + name;
          const ask = await fetch('https://cloud-api.yandex.net/v1/disk/resources/upload?overwrite=true&path=' + encodeURIComponent(path),
            { headers: yandexHead(cfg) });
          if (!ask.ok) await cloudErr(ask, 'Яндекс.Диск не дал адрес для загрузки');
          const { href } = await ask.json();
          // На сам href токен слать не надо — он одноразовый и уже подписан.
          const put = await fetch(href, { method: 'PUT', body: file });
          if (!put.ok) await cloudErr(put, 'Яндекс.Диск не принял файл');
          const pub = await fetch('https://cloud-api.yandex.net/v1/disk/resources/publish?path=' + encodeURIComponent(path),
            { method: 'PUT', headers: yandexHead(cfg) });
          if (!pub.ok) await cloudErr(pub, 'Яндекс.Диск не опубликовал файл');
          const info = await fetch('https://cloud-api.yandex.net/v1/disk/resources?fields=public_url&path=' + encodeURIComponent(path),
            { headers: yandexHead(cfg) });
          if (!info.ok) await cloudErr(info, 'Яндекс.Диск не дал ссылку');
          const { public_url } = await info.json();
          if (!public_url) throw new Error('Яндекс.Диск не дал ссылку');
          return { full: public_url, path };
        };

        // --- Nextcloud ---
        const ncHead = (cfg) => ({ 'Authorization': 'Basic ' + btoa(unescape(encodeURIComponent((cfg.user || '') + ':' + (cfg.pass || '')))) });
        // Адрес сервера человек пишет как придётся: «cloud.example.com»,
        // «https://cloud.example.com/», с пробелом на конце. Без «https://»
        // адрес превращается в ОТНОСИТЕЛЬНЫЙ путь, и запрос уходит не на
        // сервер пользователя, а на сайт самого приложения — в ответ
        // прилетает чужая страница «404», и выглядит это так, будто
        // Nextcloud отказал во входе. Поэтому схему дописываем сами.
        // Именно https: приложение открыто по https, и на обычный http
        // браузер его не пустит вовсе (смешанное содержимое).
        const ncBase = (cfg) => {
          let s = String(cfg.server || '').trim().replace(/\/+$/, '');
          if (!s) return '';
          if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
          return s;
        };
        // Отдельная дверь для проверок: возвращает адрес либо понятную
        // причину, почему по нему нельзя обратиться.
        const ncCheckedBase = (cfg) => {
          const base = ncBase(cfg);
          if (!base) throw new Error('Не указан адрес сервера');
          let u;
          try { u = new URL(base); } catch (e) { throw new Error('Не могу разобрать адрес сервера: ' + base); }
          if (u.protocol === 'http:') {
            throw new Error('Адрес начинается с http:// — браузер не пустит: приложение открыто по https. '
                          + 'Нужен адрес на https://');
          }
          return base;
        };
        // Nextcloud отвечает JSON. Если пришла веб-страница, значит по
        // этому адресу сидит не он — самая частая причина, и по голому
        // коду ответа её не видно.
        const ncNotNextcloud = (text, base) => {
          if (!/^\s*<(!doctype|html)/i.test(String(text || ''))) return null;
          return `по адресу ${base} ответил не Nextcloud, а обычная веб-страница. `
               + 'Проверьте адрес сервера — он должен быть тем, по которому вы входите в Nextcloud.';
        };
        const nextcloudUpload = async (cfg, file, name) => {
          const base = ncCheckedBase(cfg);
          const folder = (cfg.folder || 'CineFlow').replace(/^\/+|\/+$/g, '');
          const dav = base + '/remote.php/dav/files/' + encodeURIComponent(cfg.user || '');
          await fetch(dav + '/' + encodeURIComponent(folder), { method: 'MKCOL', headers: ncHead(cfg) }).catch(() => {});
          const rel = '/' + folder + '/' + name;
          let put;
          try {
            put = await fetch(dav + '/' + encodeURIComponent(folder) + '/' + encodeURIComponent(name),
              { method: 'PUT', headers: ncHead(cfg), body: file });
          } catch (err) {
            throw new Error(`Не удалось связаться с ${base}. Проверьте адрес; если он верный — `
              + `сервер не разрешает обращения из браузера (нужны заголовки CORS для ${location.origin}).`);
          }
          if (!put.ok) {
            const text = await put.text().catch(() => '');
            throw new Error(ncNotNextcloud(text, base) || `Nextcloud не принял файл: ${put.status} ${text.slice(0, 200)}`);
          }
          const share = await fetch(base + '/ocs/v2.php/apps/files_sharing/api/v1/shares?format=json', {
            method: 'POST',
            headers: { ...ncHead(cfg), 'OCS-APIRequest': 'true', 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ path: rel, shareType: '3', permissions: '1' })
          });
          let link = '';
          if (share.ok) {
            const j = await share.json();
            link = ((j.ocs || {}).data || {}).url || '';
          }
          if (!link) {
            // Ссылка на этот файл уже могла быть создана раньше — спрашиваем её.
            const ex = await fetch(base + '/ocs/v2.php/apps/files_sharing/api/v1/shares?format=json&path=' + encodeURIComponent(rel),
              { headers: { ...ncHead(cfg), 'OCS-APIRequest': 'true' } });
            if (ex.ok) {
              const j = await ex.json();
              const arr = ((j.ocs || {}).data) || [];
              const found = arr.find(s => s.url);
              link = found ? found.url : '';
            }
          }
          if (!link) throw new Error('Nextcloud не дал публичную ссылку');
          return { full: link.replace(/\/+$/, '') + '/download', path: rel };
        };

        // --- Подключение облака ---
        // Dropbox идёт по PKCE: приложению на статичном хостинге секрет
        // хранить негде, а PKCE его и не требует. Взамен получаем долгий
        // refresh_token — иначе ключ протухал бы каждые четыре часа.
        // Яндекс проще: токен приезжает прямо в адресе и живёт около года.
        const b64url = (buf) => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)))
          .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        const randomVerifier = () => {
          const a = new Uint8Array(48); crypto.getRandomValues(a); return b64url(a);
        };
        const pkceChallenge = async (verifier) =>
          b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
        // Адрес возврата обязан совпадать с тем, что вписан в кабинете
        // облака, знак в знак. Поэтому — без параметров: комната и так
        // помнится на устройстве.
        const cloudRedirect = () => location.origin + location.pathname;

        // Проверка связи. Дешёвый запрос, по которому сразу видно,
        // приняли ключ или нет.
        const cloudCheck = async (cfg) => {
          if (cfg.provider === 'dropbox') {
            const token = await dropboxAccess(cfg);
            // **Спрашиваем `check/user`, а НЕ `users/get_current_account`.**
            // Второй требует разрешения `account_info.read`, а наша же
            // инструкция по настройке велит отметить только файловые
            // разрешения — то есть проверка спрашивала то, чего сама
            // никогда не просила выдать. Дропбокс отвечал на это 403
            // из своих внутренностей (текст про spiffe/envoy-edge), и
            // человек видел «не принял ключ» там, где ключ ЖИВОЙ и
            // фотографии уезжают нормально. `check/user` заведён ровно
            // для такой проверки и не требует НИКАКИХ разрешений.
            const res = await cloudFetch('https://api.dropboxapi.com/2/check/user', {
              method: 'POST',
              headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
              body: JSON.stringify({ query: 'cineflow' })
            });
            if (!res.ok) await cloudErr(res, 'Dropbox не принял ключ');
            // Имя владельца — приятная мелочь, а не предмет проверки: за
            // него отвечает отдельное разрешение, которого у большинства
            // нет. Не ответили — связь всё равно есть.
            try {
              const who = await fetch('https://api.dropboxapi.com/2/users/get_current_account',
                { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } });
              if (who.ok) {
                const j = await who.json();
                if (j.name && j.name.display_name) return j.name.display_name;
              }
            } catch (e) {}
            return 'подключено';
          }
          if (cfg.provider === 'yandex') {
            const res = await fetch('https://cloud-api.yandex.net/v1/disk/', { headers: yandexHead(cfg) });
            if (!res.ok) await cloudErr(res, 'Яндекс.Диск не принял ключ');
            const j = await res.json();
            const free = j.total_space ? Math.round((j.total_space - j.used_space) / 1073741824) : null;
            return free === null ? 'подключено' : `свободно ${free} ГБ`;
          }
          if (cfg.provider === 'nextcloud') {
            const base = ncCheckedBase(cfg);
            let res;
            try {
              res = await fetch(base + '/ocs/v2.php/cloud/user?format=json',
                { headers: { ...ncHead(cfg), 'OCS-APIRequest': 'true' } });
            } catch (err) {
              // До сервера вообще не достучались: либо адрес не тот, либо
              // сервер не разрешает обращения из браузера с чужого адреса.
              throw new Error(`Не удалось связаться с ${base}. Проверьте адрес; `
                + 'если он верный — сервер не разрешает обращения из браузера '
                + `(нужны заголовки CORS для ${location.origin}).`);
            }
            const text = await res.text();
            const notNc = ncNotNextcloud(text, base);
            if (notNc) throw new Error(notNc);
            if (!res.ok) throw new Error(`Nextcloud не принял вход: ${res.status} ${text.slice(0, 200)}`);
            let who = '';
            try { who = (((JSON.parse(text).ocs || {}).data || {}).id) || ''; } catch (e) {}
            return who ? 'вошли как ' + who : 'подключено';
          }
          throw new Error('Облако не выбрано');
        };

        // base64 из базы обратно в файл — нужно, чтобы перенести в облако
        // фотографии, загруженные до его появления.
        const dataUrlToBlob = (d) => {
          const parts = String(d).split(',');
          const mime = (parts[0].match(/:(.*?);/) || [])[1] || 'image/jpeg';
          const bin = atob(parts[1] || '');
          const arr = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
          return new Blob([arr], { type: mime });
        };

        // Единая дверь наружу. Возвращает {full, path} либо бросает ошибку.
        const cloudUpload = async (cfg, file, name) => {
          if (cfg.provider === 'dropbox') return dropboxUpload(cfg, file, name);
          if (cfg.provider === 'yandex') return yandexUpload(cfg, file, name);
          if (cfg.provider === 'nextcloud') return nextcloudUpload(cfg, file, name);
          throw new Error('Облако не выбрано');
        };

        // Ссылка, которую можно поставить в <img src>.
        // У Dropbox и Nextcloud публичная ссылка уже прямая, а Яндекс
        // отдаёт СТРАНИЦУ просмотра — настоящий адрес файла приходится
        // спрашивать отдельно. Спрашиваем без токена: у публичных файлов
        // это открытый метод, иначе фотографии видел бы только владелец,
        // а не вся группа. Ответ живёт недолго, поэтому держим его
        // в памяти на время сеанса.
        const ydCache = new Map();
        // КОПИЯ ПОКРУПНЕЕ ДЛЯ ПЕЧАТИ. Просим у облака именно КОПИЮ, а не
        // оригинал: снимок со смартфона весит 3-5 МБ, а на шести десятках
        // фотографий объекта это четверть гигабайта — планшет столько не
        // вытянет. У Dropbox для этого есть готовый метод, он отдаёт 2048 px
        // за пару сотен килобайт.
        const PRINT_PX = 2048;
        // Ширина, с которой фотография ложится на лист. Считаем от неё, а не
        // от «длинной стороны»: на странице у фотографии фиксированная
        // ШИРИНА, и портрет с альбомом обязаны прийти к ней одинаково —
        // иначе портретный кадр печатается заметно мягче соседа.
        // 1100 px на 81 мм — это ~345 dpi, с запасом над печатным стандартом.
        const PRINT_W = 1100;
        const fitPrintWidth = (dataUrl, w) => new Promise((done) => {
          const img = new Image();
          img.onerror = () => done(dataUrl);
          img.onload = () => {
            if (img.width <= w) { done(dataUrl); return; }
            const c = document.createElement('canvas');
            c.width = w; c.height = Math.max(1, Math.round(img.height * w / img.width));
            const g = c.getContext('2d');
            g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
            g.drawImage(img, 0, 0, c.width, c.height);
            done(c.toDataURL('image/jpeg', 0.82));
          };
          img.src = dataUrl;
        });
        const blobToDataUrl = (blob) => new Promise((res, rej) => {
          const r = new FileReader(); r.onerror = rej; r.onloadend = () => res(r.result); r.readAsDataURL(blob);
        });
        // Ширина картинки прямо из заголовка data:-строки. Декодировать
        // всю фотографию ради двух чисел незачем, а из base64 хватает
        // первых полутора килобайт: наши превью пересобраны канвой, EXIF
        // в них нет, и SOF стоит в самом начале.
        const dataUrlJpegSize = (dataUrl) => {
          try {
            const str = String(dataUrl || '');
            if (!/^data:image\/jpe?g/i.test(str)) return null;
            const i = str.indexOf(',');
            if (i < 0) return null;
            let head = str.slice(i + 1, i + 1 + 2048);
            head = head.slice(0, head.length - head.length % 4);
            const bin = atob(head);
            const buf = new Uint8Array(bin.length);
            for (let k = 0; k < bin.length; k++) buf[k] = bin.charCodeAt(k);
            return jpegSizeOf(buf.buffer);
          } catch (e) { return null; }
        };
        const dropboxThumb = async (cfg, path, ready, size) => {
          const token = ready || await dropboxAccess(cfg);
          const res = await cloudFetch('https://content.dropboxapi.com/2/files/get_thumbnail_v2', {
            method: 'POST',
            headers: { Authorization: 'Bearer ' + token,
                       'Dropbox-API-Arg': asciiJSON({ resource: { '.tag': 'path', path },
                                                      format: 'jpeg', size: size || 'w2048h1536', mode: 'fitone_bestfit' }) }
          });
          if (!res.ok) await cloudErr(res, 'Dropbox не отдал копию для печати');
          return res.blob();
        };
        const cloudDirectUrl = async (ref) => {
          const full = ref && ref.full;
          if (!full) return (ref && ref.url) || '';
          if ((ref.cloud || {}).provider !== 'yandex') return full;
          if (ydCache.has(full)) return ydCache.get(full);
          try {
            const res = await fetch('https://cloud-api.yandex.net/v1/disk/public/resources/download?public_key=' + encodeURIComponent(full));
            if (!res.ok) return ref.url || full;
            const { href } = await res.json();
            if (href) { ydCache.set(full, href); return href; }
          } catch (e) { console.warn('Яндекс.Диск: не удалось получить прямую ссылку', e); }
          return ref.url || full;
        };

        // =====================================================================
        // СОЛНЦЕ НА ОБЪЕКТЕ
        // =====================================================================
        // Во сколько встаёт и садится солнце в этом месте в день съёмки.
        // Считаем САМИ, а не спрашиваем у сервера: на площадке связи часто
        // нет, а как раз там это и нужно. Алгоритм NOAA, сверен с двумя
        // независимыми выкладками — расхождение до двух минут.
        const SUN_RAD = Math.PI / 180;
        const J2000 = 2451545.0;
        // Возвращает {sun, golden, transit}; у sun/golden либо {rise, set},
        // либо {polar:'day'|'night'} — за полярным кругом солнце может
        // вообще не сесть или не встать, и это не ошибка.
        const sunTimes = (lat, lon, dateStr) => {
          const d = new Date(dateStr + 'T12:00:00Z');
          if (isNaN(d)) return null;
          const jd = d.getTime() / 86400000 + 2440587.5;
          const n = Math.round(jd - J2000 - 0.0009 + lon / 360);
          const Jstar = n + 0.0009 - lon / 360 + J2000;
          const M = (357.5291 + 0.98560028 * (Jstar - J2000)) % 360;
          const C = 1.9148 * Math.sin(M * SUN_RAD) + 0.02 * Math.sin(2 * M * SUN_RAD) + 0.0003 * Math.sin(3 * M * SUN_RAD);
          const lambda = (M + C + 180 + 102.9372) % 360;
          const Jtransit = Jstar + 0.0053 * Math.sin(M * SUN_RAD) - 0.0069 * Math.sin(2 * lambda * SUN_RAD);
          const decl = Math.asin(Math.sin(lambda * SUN_RAD) * Math.sin(23.44 * SUN_RAD));
          const toDate = (j) => new Date((j - 2440587.5) * 86400000);
          const at = (alt) => {
            const cosW = (Math.sin(alt * SUN_RAD) - Math.sin(lat * SUN_RAD) * Math.sin(decl))
                       / (Math.cos(lat * SUN_RAD) * Math.cos(decl));
            if (cosW > 1) return { polar: 'night' };
            if (cosW < -1) return { polar: 'day' };
            const w = Math.acos(cosW) / SUN_RAD;
            return { rise: toDate(Jtransit - w / 360), set: toDate(Jtransit + w / 360) };
          };
          // -0,833° — видимый край солнца с поправкой на преломление воздуха,
          // это и есть общепринятый «восход». 6° — верхняя граница золотого часа.
          return { sun: at(-0.833), golden: at(6), transit: toDate(Jtransit) };
        };
        const hhmm = (d) => d ? d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '—';

        // ГДЕ СОЛНЦЕ ПРЯМО СЕЙЧАС — высота над горизонтом и азимут
        // (0° = север, 90° = восток). Восход и закат из sunTimes отвечают
        // «когда», а на площадке спрашивают «с какой стороны светит»:
        // на это отвечает компас, и без азимута он был бы картинкой.
        // Формулы те же, что у восхода: положение Солнца на эклиптике,
        // перевод в экваториальные координаты и оттуда в горизонтальные.
        const sunPosition = (lat, lon, when) => {
          const d = when.getTime() / 86400000 + 2440587.5 - J2000;
          const M = (357.5291 + 0.98560028 * d) % 360;
          const C = 1.9148 * Math.sin(M * SUN_RAD) + 0.02 * Math.sin(2 * M * SUN_RAD) + 0.0003 * Math.sin(3 * M * SUN_RAD);
          const lambda = (M + C + 180 + 102.9372) % 360;
          const decl = Math.asin(Math.sin(lambda * SUN_RAD) * Math.sin(23.44 * SUN_RAD));
          const ra = Math.atan2(Math.sin(lambda * SUN_RAD) * Math.cos(23.44 * SUN_RAD), Math.cos(lambda * SUN_RAD));
          const theta = (280.16 + 360.9856235 * d) * SUN_RAD;
          const H = theta + lon * SUN_RAD - ra;
          const phi = lat * SUN_RAD;
          const alt = Math.asin(Math.sin(phi) * Math.sin(decl) + Math.cos(phi) * Math.cos(decl) * Math.cos(H));
          // Азимут в этих формулах считается от ЮГА к западу — переводим
          // в привычный «от севера по часовой стрелке», иначе компас
          // показывал бы солнце ровно напротив.
          const az = Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(phi) - Math.tan(decl) * Math.cos(phi));
          return { alt: alt / SUN_RAD, az: ((az / SUN_RAD) + 180 + 360) % 360 };
        };

        // Куда светит, сказанное словами. Оператору нужен не угол в градусах,
        // а «контровой от воды после 14:30» — но сторону света мы знаем
        // точно, а что за ней (вода, обрыв) — нет, поэтому говорим сторону
        // и высоту, а остальное человек допишет заметкой.
        const SUN_SIDES = ['севера', 'северо-востока', 'востока', 'юго-востока', 'юга', 'юго-запада', 'запада', 'северо-запада'];
        const sunWords = (p) => {
          if (!p) return '';
          if (p.alt < -6) return 'Солнца нет — ночь.';
          if (p.alt < 0) return 'Солнце за горизонтом, идут сумерки.';
          const side = SUN_SIDES[Math.round(p.az / 45) % 8];
          const high = p.alt > 45 ? 'высоко, тени короткие'
                     : p.alt > 12 ? 'вполнеба'
                     : 'низко — время контрового и длинных теней';
          return `Светит с ${side}, ${high}.`;
        };

        // Координаты человек либо ищет по адресу, либо вставляет из карт.
        // Поэтому храним строкой как есть, а разбираем при счёте: и
        // «55.7558, 37.6173», и «55,7558 37,6173» — одно и то же.
        const parseCoords = (s) => {
          const m = String(s || '').match(/(-?\d+(?:[.,]\d+)?)\s*[,;\s]\s*(-?\d+(?:[.,]\d+)?)/);
          if (!m) return null;
          const lat = parseFloat(m[1].replace(',', '.'));
          const lon = parseFloat(m[2].replace(',', '.'));
          if (!isFinite(lat) || !isFinite(lon)) return null;
          if (Math.abs(lat) > 90 || Math.abs(lon) > 180) return null;
          return { lat, lon };
        };

        // Адрес → координаты. Nominatim (карты OpenStreetMap): открытый,
        // без ключа и без регистрации. Просит не частить — у нас запрос
        // идёт только по нажатию кнопки, поэтому это не про нас.
        const geocodeAddress = async (q) => {
          const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ru&q='
                    + encodeURIComponent(q);
          const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
          if (!res.ok) throw new Error('Служба карт ответила ' + res.status);
          const list = await res.json();
          if (!list || !list.length) throw new Error('Такой адрес не нашёлся');
          return {
            coords: `${parseFloat(list[0].lat).toFixed(5)}, ${parseFloat(list[0].lon).toFixed(5)}`,
            name: list[0].display_name || ''
          };
        };

        class ErrorBoundary extends React.Component {
          constructor(props) { super(props); this.state = { hasError: false, msg: '' }; }
          // Текст ошибки показываем ЧЕЛОВЕКУ намеренно. Пользователь —
          // не программист, консоль браузера он не открывает, и сказать,
          // что именно сломалось, ему было НЕЧЕМ: экран сообщал только
          // то, что что-то сломалось. Одна строка с причиной — это разница
          // между «опять слетело» и починенной ошибкой.
          static getDerivedStateFromError(error) {
            const nm = (error && error.name) ? error.name + ': ' : '';
            return { hasError: true, msg: nm + ((error && error.message) || String(error || '')) };
          }
          render() {
