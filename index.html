    <script>
        // Service worker: кэширует оболочку приложения и библиотеки с CDN,
        // чтобы приложение открывалось без интернета. Данные офлайн
        // обеспечивает сам Firestore (enablePersistence ниже).
        if ('serviceWorker' in navigator) {
          // Как только новый service worker берёт управление, перезагружаем
          // страницу — иначе на телефоне (особенно у иконки с рабочего стола)
          // можно неделями сидеть на старой версии и не видеть правок.
          let cfReloading = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (cfReloading) return;
            cfReloading = true;
            window.location.reload();
          });
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').then(reg => {
              reg.update();
              // Проверяем обновление каждый раз, когда возвращаются во вкладку.
              document.addEventListener('visibilitychange', () => {
                if (!document.hidden) reg.update();
              });
            }).catch(err => {
              console.warn('Service worker не зарегистрирован:', err);
            });
          });
        }
    </script>

    <style>
        :root {
          /* поверхности: --canvas < --bg < --panel-3 < --panel-2 < --panel < изображения */
          --bg: #1a1918;
          --panel: #242322;       /* карточки, кнопки, выбранная строка, стикеры */
          --panel-2: #1e1d1c;     /* рельс, шапка, правые панели, чат */
          --panel-3: #1c1b1a;     /* боковые списки: сцены, теги, оглавление */
          --canvas: #14130f;      /* холст доски и превью схем света */

          --border: #363430;      /* границы панелей и кнопок */
          --border-soft: #2c2b28; /* разделители строк в списках */

          --text: #f0eee6;
          --text-2: #c9c5bb;      /* абзацы, описания */
          --muted: #a6a39a;       /* подписи, метки разделов */
          --muted-2: #6f6b63;     /* служебное, моно-метки */

          --accent: #d97757;
          --accent-hover: #e28a63;
          --accent-soft: rgba(217,119,87,.12);  /* фон своего сообщения в чате */
          --accent-line: rgba(217,119,87,.45);  /* рамка активного тега */

          --ink-yellow: #facc15;  /* приборы на схеме света, стикеры */
          --ink-blue: #60a5fa;

          --rail-w: 66px;
          --header-h: 42px;
          --panel-strip: 40px;
        }
        body {
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            touch-action: none;
            font-family: 'Archivo', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }
        ::selection { background: rgba(217,119,87,0.3); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #3d3a36; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .wb-color-well::-webkit-color-swatch-wrapper { padding: 0; }
        .wb-color-well::-webkit-color-swatch { border: none; border-radius: 9999px; }
        .wb-color-well::-moz-color-swatch { border: none; border-radius: 9999px; }
        @media (max-width: 767px) {
          .nav-scroll-hint { -webkit-mask-image: linear-gradient(to right, transparent 0, black 16px, black calc(100% - 24px), transparent 100%); mask-image: linear-gradient(to right, transparent 0, black 16px, black calc(100% - 24px), transparent 100%); }
        }
        .no-select { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }

        /* Кнопки, которые «появляются при наведении», на планшете НЕ появляются
           никогда: наведения мыши там не существует. То есть удалить кадр,
           выделить референс или положить его на доску пальцем было нельзя.
           Показываем их приглушённо — видно, но не кричит. */
        @media (hover: none) {
          .opacity-0.group-hover\:opacity-100 { opacity: .62 !important; }
        }
        h1, h2, h3 { font-family: 'Lora', Georgia, serif; letter-spacing: -0.01em; }
        .glass-panel {
            background: var(--panel);
            border: 1px solid var(--border);
        }
        .glass-input {
            background: var(--panel-2);
            border: 1px solid var(--border);
            color: var(--text);
        }
        .glass-input::placeholder { color: var(--muted-2); }
        .glass-input:focus, .glass-input:focus-within {
            border-color: var(--accent);
            outline: none;
        }
        /* Текст на карточке доски, пока его не правят: обычный текст,
           а не поле ввода. Нажатие должно попадать в карточку — иначе её
           не сдвинуть пальцем, а это на планшете главный жест. */
        .cf-card-text { white-space: pre-wrap; overflow-wrap: anywhere; overflow: hidden;
                        cursor: move; user-select: none; -webkit-user-select: none; }
        .cf-card-text:empty::before { content: ''; }
        .scene-drop-target { box-shadow: 0 0 0 2px var(--accent), 0 0 20px rgba(217,119,87,0.4); }

        /* ---------- утилиты редизайна ---------- */
        :focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }

        /* метка раздела над блоком */
        .cf-eyebrow { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

        /* служебная моно-подпись: слаглайн, дата, счётчики */
        .cf-meta { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: .04em; color: var(--muted-2); }

        /* Карточка галереи: браузер пропускает отрисовку того, что за
           экраном. При сотне референсов это главный рычаг для прокрутки.
           Где не поддерживается (старые Safari) — правило просто
           игнорируется, ничего не ломая. Высоту подсказываем заранее,
           иначе полоса прокрутки скачет. */
        .cf-ref-card { content-visibility: auto; contain-intrinsic-size: auto 300px; }
        /* чип параметра или тега */
        .cf-chip { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .04em; color: var(--muted); background: var(--panel); border: 1px solid var(--border); padding: 4px 7px; border-radius: 5px; }
        .cf-chip-accent { color: var(--accent); background: transparent; border-color: var(--accent-line); }

        /* строка списка: граница есть всегда, меняется только цвет — текст не сдвигается при выборе */
        .cf-row { border-left: 2px solid transparent; border-bottom: 1px solid var(--border-soft); cursor: pointer; }
        .cf-row-on { background: var(--panel); border-left-color: var(--accent); }

        /* свёрнутая боковая панель */
        .cf-strip { width: var(--panel-strip); background: var(--panel-3); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px 0; cursor: pointer; }
        .cf-strip span { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted-2); writing-mode: vertical-rl; }

        /* холст доски */
        /* точки намеренно еле заметны: сетка нужна как ориентир при
           перетаскивании, но не должна спорить с референсами на доске */
        .cf-canvas { background: var(--canvas); background-image: radial-gradient(rgba(240,238,230,.05) 1.2px, transparent 1.2px); background-size: 26px 26px; }

        /* Режим «только просмотр». Ничего не уходит в облако (см. syncDoc),
           а здесь дополнительно гасим саму возможность что-то печатать,
           чтобы человек не решил, будто его правки сохранятся. */
        body.cf-readonly input,
        body.cf-readonly textarea,
        body.cf-readonly select { pointer-events: none !important; user-select: none; }
        body.cf-readonly .cf-edit-only { display: none !important; }
        .cf-ro-badge { position: fixed; top: 8px; right: 8px; z-index: 300; font-size: 11px;
                       letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px;
                       border-radius: 999px; background: var(--panel); color: var(--muted);
                       border: 1px solid var(--border); pointer-events: none; }

        /* метка поверх превью кадра */
        .cf-overlay { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--text); background: rgba(26,25,24,.72); padding: 3px 6px; border-radius: 3px; }

        /* рельс навигации */
        .cf-rail { width: var(--rail-w); background: var(--panel-2); border-right: 1px solid var(--border); padding: 10px 0; }
        .cf-rail-item { width: 56px; padding: 8px 0 6px; gap: 5px; border-radius: 8px; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .cf-rail-item span { font-size: 9.5px; }
        .cf-rail-item:hover { color: var(--text-2); }
        .cf-rail-on { background: #2b2a28; color: var(--accent); }
        .cf-rail-on:hover { color: var(--accent); }

        /* Чат на телефоне выезжает справа ПОВЕРХ страницы, но живёт внутри
           слоя основной части (z-10), а шапка приложения лежит снаружи и
           выше (z-40). Из-за этого шапка накрывала верх чата вместе с его
           крестиком: нажатие на крестик попадало в кнопку «Доступ».
           Поднять чат выше нельзя — вместе с ним поднялась бы вся
           страница, — поэтому на телефоне он начинается ПОД шапкой.
           Класс повторён дважды намеренно: так правило перевешивает
           tailwind-классы (inset-y-0, h-full) и не зависит от того,
           в каком порядке браузер собрал таблицы стилей. */
        @media (max-width: 767px) {
          .cf-chat-drawer.cf-chat-drawer { top: var(--header-h); height: auto; }
        }

        /* ---------- всплывающие окна ---------- */
        /* На телефоне окно почти всегда выше экрана. Раньше оно
           центрировалось ЦЕЛИКОМ, и лишняя высота уезжала за ОБА края:
           верх вместе с крестиком оказывался выше экрана, прокрутить
           туда было нельзя (окно не прокручивалось вовсе) — закрыть
           «Проект» или «Доступ» с телефона было попросту нечем.
           Теперь высота ограничена экраном, прокручивается содержимое,
           а крестик прилипает к верхнему краю и виден на любой прокрутке.
           Второй мерой обязателен dvh — высота ВИДИМОЙ части: панели
           браузера на телефоне то появляются, то исчезают, и 100vh
           заметно больше того, что человек видит. Строка с vh стоит
           первой как запасная, где dvh не понимают. */
        .cf-modal-box {
          max-height: calc(100vh - 32px);
          max-height: calc(100dvh - 32px);
          overflow-y: auto;
          overscroll-behavior: contain;
          -webkit-overflow-scrolling: touch;
        }
        /* Крестик вынут из потока (float) и прилипает (sticky), поэтому
           не сдвигает заголовок и не уезжает вверх при прокрутке.
           Фон обязателен НЕПРОЗРАЧНЫЙ: прилипший крестик проходит
           поверх текста, и сквозь полупрозрачный читались бы буквы. */
        .cf-modal-x {
          position: sticky;
          top: 0;
          float: right;
          z-index: 30;
          margin: -4px -4px 0 10px;
          background: var(--panel);
        }
        #print-area { display: none; }
        @media print {
            body { background: white !important; color: black !important; overflow: auto; touch-action: auto; }
            body * { visibility: hidden; }
            #print-area { display: block !important; position: absolute; left: 0; top: 0; width: 100%; padding: 24px; background: white !important; color: black !important; }
            #print-area, #print-area * { visibility: visible !important; }
            #print-area img { max-width: 100%; }
            .print-scene { page-break-inside: avoid; border-bottom: 1px solid #ccc; padding: 12px 0; }
        }
    </style>

            flat.getContext('2d').drawImage(cv, 0, 0, flat.width, flat.height);
            if (bmp.close) bmp.close();
            return { panoUrl: pano, url: flat.toDataURL('image/jpeg', 0.75) };
          } catch (e) {
            console.warn('Панорама: не удалось подготовить превью', e);
            return { panoUrl: '', url: '' };
          }
        };

        // =====================================================================
        // ВНЕШНЕЕ ХРАНИЛИЩЕ ФОТОГРАФИЙ (Dropbox / Яндекс.Диск / Nextcloud)
        // =====================================================================
        // Зачем: картинки лежали в базе целиком, в base64. Предел документа
        // Firestore — 1 МБ, и на сотне фотографий проект упирался в потолок.
        // Теперь оригинал уезжает в облако пользователя, а в базе остаётся
        // МАЛЕНЬКОЕ превью (`url`) и ссылка на оригинал (`full`).
        //
        // Почему превью всё-таки хранится в базе: галерея и доска обязаны
        // открываться мгновенно и БЕЗ интернета — на площадке связи часто
        // нет вовсе. Полный размер подтягивается из облака только когда
        // фотографию открывают на весь экран.
        //
        // Поле `url` НЕ переименовано намеренно: на него смотрят галерея,
        // доска, печать, файл-снимок и старые фотографии, залитые до
        // появления облака. Пусть в нём лежит то, что показывают.
        const CLOUD_KEY = 'cf_cloud';
        const CLOUD_NAMES = { dropbox: 'Dropbox', yandex: 'Яндекс.Диск', nextcloud: 'Nextcloud' };
        const loadCloudCfg = () => {
          try { return JSON.parse(localStorage.getItem(CLOUD_KEY)) || {}; } catch (e) { return {}; }
        };
        const saveCloudCfg = (cfg) => {
          try { localStorage.setItem(CLOUD_KEY, JSON.stringify(cfg)); } catch (e) {}
          return cfg;
        };
        // Настройки живут на УСТРОЙСТВЕ, а не в комнате: это ключи от чужого
        // Dropbox, и класть их в общую базу, куда пускают любого с кодом
        // комнаты, нельзя. Обратная сторона — подключать облако надо на
        // каждом устройстве, откуда загружают фотографии. Смотреть их
        // при этом может кто угодно: ссылки публичные.

        // Имя файла в облаке: латиница и цифры, остальное — подчёркиванием.
        // Кириллица в пути ломает заголовок Dropbox-API-Arg и путается
        // в WebDAV, а ценности не несёт — подпись хранится в проекте.
        const cloudFileName = (refId, original) => {
          const dot = String(original || '').lastIndexOf('.');
          let ext = dot > 0 ? String(original).slice(dot + 1).toLowerCase() : 'jpg';
          if (!/^[a-z0-9]{1,5}$/.test(ext)) ext = 'jpg';
          return `${refId}.${ext}`;
        };
        // Заголовок HTTP не пропускает буквы вне ASCII — Dropbox требует
        // экранировать их прямо в JSON.
        const asciiJSON = (obj) => JSON.stringify(obj)
          .replace(/[\u007f-\uffff]/g, c => '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0'));

        const cloudErr = async (res, what) => {
          let text = '';
          try { text = (await res.text()).slice(0, 300); } catch (e) {}
          throw new Error(`${what}: ${res.status} ${text}`);
        };

        // --- Dropbox ---
        // Короткий ключ доступа живёт 4 часа, поэтому храним долгий
        // refresh_token и меняем его на свежий ключ по необходимости.
        const dropboxAccess = async (cfg) => {
          if (cfg.token && cfg.expires && Date.now() < cfg.expires - 60000) return cfg.token;
          if (!cfg.refresh) {
            if (cfg.token) return cfg.token; // вставили ключ руками
            throw new Error('Dropbox не подключён');
          }
          const res = await fetch('https://api.dropboxapi.com/oauth2/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
              grant_type: 'refresh_token', refresh_token: cfg.refresh, client_id: cfg.appKey || ''
            })
          });
          if (!res.ok) await cloudErr(res, 'Dropbox не обновил ключ доступа');
          const j = await res.json();
          const next = saveCloudCfg({ ...loadCloudCfg(), token: j.access_token, expires: Date.now() + (j.expires_in || 14400) * 1000 });
          return next.token;
        };
        // Ссылка вида .../file.jpg?rlkey=..&dl=0 открывает СТРАНИЦУ Dropbox.
        // Картинку отдаёт та же ссылка с raw=1; dl=1 не годится — он
        // помечает файл как вложение, и <img> его не покажет.
        // Адрес разбираем по-настоящему, а не вырезаем строкой: если dl=0
        // окажется не последним параметром, вырезание строкой оставит
        // висящий «&» и склеит ссылку в мусор.
        const dropboxRaw = (url) => {
          try {
            const u = new URL(url);
            u.searchParams.delete('dl');
            u.searchParams.set('raw', '1');
            return u.toString();
          } catch (e) { return String(url); }
        };
        const dropboxUpload = async (cfg, file, name) => {
          const token = await dropboxAccess(cfg);
          const path = '/' + (cfg.folder || 'CineFlow').replace(/^\/+|\/+$/g, '') + '/' + name;
          const up = await fetch('https://content.dropboxapi.com/2/files/upload', {
            method: 'POST',
            headers: {
              'Authorization': 'Bearer ' + token,
              'Dropbox-API-Arg': asciiJSON({ path, mode: 'overwrite', mute: true }),
              'Content-Type': 'application/octet-stream'
            },
            body: file
          });
          if (!up.ok) await cloudErr(up, 'Dropbox не принял файл');
          const meta = await up.json();
          // Публичная ссылка. Если она уже есть, Dropbox отвечает ошибкой —
          // тогда спрашиваем существующую, а не считаем это провалом.
          const mk = await fetch('https://api.dropboxapi.com/2/sharing/create_shared_link_with_settings', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: asciiJSON({ path: meta.path_lower, settings: { requested_visibility: 'public' } })
          });
          let link = '';
          if (mk.ok) { link = (await mk.json()).url; }
          else {
            const list = await fetch('https://api.dropboxapi.com/2/sharing/list_shared_links', {
              method: 'POST',
              headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
              body: asciiJSON({ path: meta.path_lower, direct_only: true })
            });
            if (!list.ok) await cloudErr(list, 'Dropbox не дал ссылку на файл');
            const j = await list.json();
            link = (j.links && j.links[0] && j.links[0].url) || '';
          }
          if (!link) throw new Error('Dropbox не дал ссылку на файл');
          return { full: dropboxRaw(link), path: meta.path_lower };
        };

        // --- Яндекс.Диск ---
        const yandexHead = (cfg) => ({ 'Authorization': 'OAuth ' + (cfg.token || '') });
        const yandexUpload = async (cfg, file, name) => {
          const folder = (cfg.folder || 'CineFlow').replace(/^\/+|\/+$/g, '');
          // Папку создаём молча: 409 значит «уже есть», это не ошибка.
          await fetch('https://cloud-api.yandex.net/v1/disk/resources?path=' + encodeURIComponent('disk:/' + folder),
            { method: 'PUT', headers: yandexHead(cfg) }).catch(() => {});
          const path = 'disk:/' + folder + '/' + name;
          const ask = await fetch('https://cloud-api.yandex.net/v1/disk/resources/upload?overwrite=true&path=' + encodeURIComponent(path),
            { headers: yandexHead(cfg) });
          if (!ask.ok) await cloudErr(ask, 'Яндекс.Диск не дал адрес для загрузки');
          const { href } = await ask.json();
          // На сам href токен слать не надо — он одноразовый и уже подписан.
          const put = await fetch(href, { method: 'PUT', body: file });
          if (!put.ok) await cloudErr(put, 'Яндекс.Диск не принял файл');
          const pub = await fetch('https://cloud-api.yandex.net/v1/disk/resources/publish?path=' + encodeURIComponent(path),
            { method: 'PUT', headers: yandexHead(cfg) });
          if (!pub.ok) await cloudErr(pub, 'Яндекс.Диск не опубликовал файл');
          const info = await fetch('https://cloud-api.yandex.net/v1/disk/resources?fields=public_url&path=' + encodeURIComponent(path),
            { headers: yandexHead(cfg) });
          if (!info.ok) await cloudErr(info, 'Яндекс.Диск не дал ссылку');
          const { public_url } = await info.json();
          if (!public_url) throw new Error('Яндекс.Диск не дал ссылку');
          return { full: public_url, path };
        };

        // --- Nextcloud ---
        const ncHead = (cfg) => ({ 'Authorization': 'Basic ' + btoa(unescape(encodeURIComponent((cfg.user || '') + ':' + (cfg.pass || '')))) });
        // Адрес сервера человек пишет как придётся: «cloud.example.com»,
        // «https://cloud.example.com/», с пробелом на конце. Без «https://»
        // адрес превращается в ОТНОСИТЕЛЬНЫЙ путь, и запрос уходит не на
        // сервер пользователя, а на сайт самого приложения — в ответ
        // прилетает чужая страница «404», и выглядит это так, будто
        // Nextcloud отказал во входе. Поэтому схему дописываем сами.
        // Именно https: приложение открыто по https, и на обычный http
        // браузер его не пустит вовсе (смешанное содержимое).
        const ncBase = (cfg) => {
          let s = String(cfg.server || '').trim().replace(/\/+$/, '');
          if (!s) return '';
          if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
          return s;
        };
        // Отдельная дверь для проверок: возвращает адрес либо понятную
        // причину, почему по нему нельзя обратиться.
        const ncCheckedBase = (cfg) => {
          const base = ncBase(cfg);
          if (!base) throw new Error('Не указан адрес сервера');
          let u;
          try { u = new URL(base); } catch (e) { throw new Error('Не могу разобрать адрес сервера: ' + base); }
          if (u.protocol === 'http:') {
            throw new Error('Адрес начинается с http:// — браузер не пустит: приложение открыто по https. '
                          + 'Нужен адрес на https://');
          }
          return base;
        };
        // Nextcloud отвечает JSON. Если пришла веб-страница, значит по
        // этому адресу сидит не он — самая частая причина, и по голому
        // коду ответа её не видно.
        const ncNotNextcloud = (text, base) => {
          if (!/^\s*<(!doctype|html)/i.test(String(text || ''))) return null;
          return `по адресу ${base} ответил не Nextcloud, а обычная веб-страница. `
               + 'Проверьте адрес сервера — он должен быть тем, по которому вы входите в Nextcloud.';
        };
        const nextcloudUpload = async (cfg, file, name) => {
          const base = ncCheckedBase(cfg);
          const folder = (cfg.folder || 'CineFlow').replace(/^\/+|\/+$/g, '');
          const dav = base + '/remote.php/dav/files/' + encodeURIComponent(cfg.user || '');
          await fetch(dav + '/' + encodeURIComponent(folder), { method: 'MKCOL', headers: ncHead(cfg) }).catch(() => {});
          const rel = '/' + folder + '/' + name;
          let put;
          try {
            put = await fetch(dav + '/' + encodeURIComponent(folder) + '/' + encodeURIComponent(name),
              { method: 'PUT', headers: ncHead(cfg), body: file });
          } catch (err) {
            throw new Error(`Не удалось связаться с ${base}. Проверьте адрес; если он верный — `
              + `сервер не разрешает обращения из браузера (нужны заголовки CORS для ${location.origin}).`);
          }
          if (!put.ok) {
            const text = await put.text().catch(() => '');
            throw new Error(ncNotNextcloud(text, base) || `Nextcloud не принял файл: ${put.status} ${text.slice(0, 200)}`);
          }
          const share = await fetch(base + '/ocs/v2.php/apps/files_sharing/api/v1/shares?format=json', {
            method: 'POST',
            headers: { ...ncHead(cfg), 'OCS-APIRequest': 'true', 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ path: rel, shareType: '3', permissions: '1' })
          });
          let link = '';
          if (share.ok) {
            const j = await share.json();
            link = ((j.ocs || {}).data || {}).url || '';
          }
          if (!link) {
            // Ссылка на этот файл уже могла быть создана раньше — спрашиваем её.
            const ex = await fetch(base + '/ocs/v2.php/apps/files_sharing/api/v1/shares?format=json&path=' + encodeURIComponent(rel),
              { headers: { ...ncHead(cfg), 'OCS-APIRequest': 'true' } });
            if (ex.ok) {
              const j = await ex.json();
              const arr = ((j.ocs || {}).data) || [];
              const found = arr.find(s => s.url);
              link = found ? found.url : '';
            }
          }
          if (!link) throw new Error('Nextcloud не дал публичную ссылку');
          return { full: link.replace(/\/+$/, '') + '/download', path: rel };
        };

        // --- Подключение облака ---
        // Dropbox идёт по PKCE: приложению на статичном хостинге секрет
        // хранить негде, а PKCE его и не требует. Взамен получаем долгий
        // refresh_token — иначе ключ протухал бы каждые четыре часа.
        // Яндекс проще: токен приезжает прямо в адресе и живёт около года.
        const b64url = (buf) => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)))
          .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        const randomVerifier = () => {
          const a = new Uint8Array(48); crypto.getRandomValues(a); return b64url(a);
        };
        const pkceChallenge = async (verifier) =>
          b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
        // Адрес возврата обязан совпадать с тем, что вписан в кабинете
        // облака, знак в знак. Поэтому — без параметров: комната и так
        // помнится на устройстве.
        const cloudRedirect = () => location.origin + location.pathname;

        // Проверка связи. Дешёвый запрос, по которому сразу видно,
        // приняли ключ или нет.
        const cloudCheck = async (cfg) => {
          if (cfg.provider === 'dropbox') {
            const token = await dropboxAccess(cfg);
            const res = await fetch('https://api.dropboxapi.com/2/users/get_current_account',
              { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } });
            if (!res.ok) await cloudErr(res, 'Dropbox не принял ключ');
            const j = await res.json();
            return (j.name && j.name.display_name) || 'подключено';
          }
          if (cfg.provider === 'yandex') {
            const res = await fetch('https://cloud-api.yandex.net/v1/disk/', { headers: yandexHead(cfg) });
            if (!res.ok) await cloudErr(res, 'Яндекс.Диск не принял ключ');
            const j = await res.json();
            const free = j.total_space ? Math.round((j.total_space - j.used_space) / 1073741824) : null;
            return free === null ? 'подключено' : `свободно ${free} ГБ`;
          }
          if (cfg.provider === 'nextcloud') {
            const base = ncCheckedBase(cfg);
            let res;
            try {
              res = await fetch(base + '/ocs/v2.php/cloud/user?format=json',
                { headers: { ...ncHead(cfg), 'OCS-APIRequest': 'true' } });
            } catch (err) {
              // До сервера вообще не достучались: либо адрес не тот, либо
              // сервер не разрешает обращения из браузера с чужого адреса.
              throw new Error(`Не удалось связаться с ${base}. Проверьте адрес; `
                + 'если он верный — сервер не разрешает обращения из браузера '
                + `(нужны заголовки CORS для ${location.origin}).`);
            }
            const text = await res.text();
            const notNc = ncNotNextcloud(text, base);
            if (notNc) throw new Error(notNc);
            if (!res.ok) throw new Error(`Nextcloud не принял вход: ${res.status} ${text.slice(0, 200)}`);
            let who = '';
            try { who = (((JSON.parse(text).ocs || {}).data || {}).id) || ''; } catch (e) {}
            return who ? 'вошли как ' + who : 'подключено';
          }
          throw new Error('Облако не выбрано');
        };

        // base64 из базы обратно в файл — нужно, чтобы перенести в облако
        // фотографии, загруженные до его появления.
        const dataUrlToBlob = (d) => {
          const parts = String(d).split(',');
          const mime = (parts[0].match(/:(.*?);/) || [])[1] || 'image/jpeg';
          const bin = atob(parts[1] || '');
          const arr = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
          return new Blob([arr], { type: mime });
        };

        // Единая дверь наружу. Возвращает {full, path} либо бросает ошибку.
        const cloudUpload = async (cfg, file, name) => {
          if (cfg.provider === 'dropbox') return dropboxUpload(cfg, file, name);
          if (cfg.provider === 'yandex') return yandexUpload(cfg, file, name);
          if (cfg.provider === 'nextcloud') return nextcloudUpload(cfg, file, name);
          throw new Error('Облако не выбрано');
        };

        // Ссылка, которую можно поставить в <img src>.
        // У Dropbox и Nextcloud публичная ссылка уже прямая, а Яндекс
        // отдаёт СТРАНИЦУ просмотра — настоящий адрес файла приходится
        // спрашивать отдельно. Спрашиваем без токена: у публичных файлов
        // это открытый метод, иначе фотографии видел бы только владелец,
        // а не вся группа. Ответ живёт недолго, поэтому держим его
        // в памяти на время сеанса.
        const ydCache = new Map();
        const cloudDirectUrl = async (ref) => {
          const full = ref && ref.full;
          if (!full) return (ref && ref.url) || '';
          if ((ref.cloud || {}).provider !== 'yandex') return full;
          if (ydCache.has(full)) return ydCache.get(full);
          try {
            const res = await fetch('https://cloud-api.yandex.net/v1/disk/public/resources/download?public_key=' + encodeURIComponent(full));
            if (!res.ok) return ref.url || full;
            const { href } = await res.json();
            if (href) { ydCache.set(full, href); return href; }
          } catch (e) { console.warn('Яндекс.Диск: не удалось получить прямую ссылку', e); }
          return ref.url || full;
        };

        // =====================================================================
        // СОЛНЦЕ НА ОБЪЕКТЕ
        // =====================================================================
        // Во сколько встаёт и садится солнце в этом месте в день съёмки.
        // Считаем САМИ, а не спрашиваем у сервера: на площадке связи часто
        // нет, а как раз там это и нужно. Алгоритм NOAA, сверен с двумя
        // независимыми выкладками — расхождение до двух минут.
        const SUN_RAD = Math.PI / 180;
        const J2000 = 2451545.0;
        // Возвращает {sun, golden, transit}; у sun/golden либо {rise, set},
        // либо {polar:'day'|'night'} — за полярным кругом солнце может
        // вообще не сесть или не встать, и это не ошибка.
        const sunTimes = (lat, lon, dateStr) => {
          const d = new Date(dateStr + 'T12:00:00Z');
          if (isNaN(d)) return null;
          const jd = d.getTime() / 86400000 + 2440587.5;
          const n = Math.round(jd - J2000 - 0.0009 + lon / 360);
          const Jstar = n + 0.0009 - lon / 360 + J2000;
          const M = (357.5291 + 0.98560028 * (Jstar - J2000)) % 360;
          const C = 1.9148 * Math.sin(M * SUN_RAD) + 0.02 * Math.sin(2 * M * SUN_RAD) + 0.0003 * Math.sin(3 * M * SUN_RAD);
          const lambda = (M + C + 180 + 102.9372) % 360;
          const Jtransit = Jstar + 0.0053 * Math.sin(M * SUN_RAD) - 0.0069 * Math.sin(2 * lambda * SUN_RAD);
          const decl = Math.asin(Math.sin(lambda * SUN_RAD) * Math.sin(23.44 * SUN_RAD));
          const toDate = (j) => new Date((j - 2440587.5) * 86400000);
          const at = (alt) => {
            const cosW = (Math.sin(alt * SUN_RAD) - Math.sin(lat * SUN_RAD) * Math.sin(decl))
                       / (Math.cos(lat * SUN_RAD) * Math.cos(decl));
            if (cosW > 1) return { polar: 'night' };
            if (cosW < -1) return { polar: 'day' };
            const w = Math.acos(cosW) / SUN_RAD;
            return { rise: toDate(Jtransit - w / 360), set: toDate(Jtransit + w / 360) };
          };
          // -0,833° — видимый край солнца с поправкой на преломление воздуха,
          // это и есть общепринятый «восход». 6° — верхняя граница золотого часа.
          return { sun: at(-0.833), golden: at(6), transit: toDate(Jtransit) };
        };
        const hhmm = (d) => d ? d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '—';

        // Координаты человек либо ищет по адресу, либо вставляет из карт.
        // Поэтому храним строкой как есть, а разбираем при счёте: и
        // «55.7558, 37.6173», и «55,7558 37,6173» — одно и то же.
        const parseCoords = (s) => {
          const m = String(s || '').match(/(-?\d+(?:[.,]\d+)?)\s*[,;\s]\s*(-?\d+(?:[.,]\d+)?)/);
          if (!m) return null;
          const lat = parseFloat(m[1].replace(',', '.'));
          const lon = parseFloat(m[2].replace(',', '.'));
          if (!isFinite(lat) || !isFinite(lon)) return null;
          if (Math.abs(lat) > 90 || Math.abs(lon) > 180) return null;
          return { lat, lon };
        };

        // Адрес → координаты. Nominatim (карты OpenStreetMap): открытый,
        // без ключа и без регистрации. Просит не частить — у нас запрос
        // идёт только по нажатию кнопки, поэтому это не про нас.
        const geocodeAddress = async (q) => {
          const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ru&q='
                    + encodeURIComponent(q);
          const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
          if (!res.ok) throw new Error('Служба карт ответила ' + res.status);
          const list = await res.json();
          if (!list || !list.length) throw new Error('Такой адрес не нашёлся');
          return {
            coords: `${parseFloat(list[0].lat).toFixed(5)}, ${parseFloat(list[0].lon).toFixed(5)}`,
            name: list[0].display_name || ''
          };
        };

        class ErrorBoundary extends React.Component {
          constructor(props) { super(props); this.state = { hasError: false }; }
          static getDerivedStateFromError(error) { return { hasError: true }; }
          render() {

          }
        }

        const ConfirmModal = ({ action, onCancel }) => {

        const hashPin = async (value) => {

        };

        const waitForAuthUser = async (timeoutMs = 4000) => {

        const DrawingModal = ({ onSave, onClose }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [color, setColor] = useState('#ffffff');
            const [brushSize, setBrushSize] = useState(4);
            const [tool, setTool] = useState('brush'); 
            const lastPoint = useRef({ x: 0, y: 0, pressure: 0.5, time: 0 });
          // Идёт ли сейчас штрих обратным концом стилуса
          const penErase = useRef(false);

            useEffect(() => {
                const canvas = canvasRef.current;
                if(canvas) {
                    canvas.width = 1920; canvas.height = 1080;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#262624'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                }
            }, []);

            const getPos = (e) => {
                const canvas = canvasRef.current; const rect = canvas.getBoundingClientRect();
                return { x: (e.clientX - rect.left) * (canvas.width / rect.width), y: (e.clientY - rect.top) * (canvas.height / rect.height), pressure: e.pressure !== undefined && e.pressure !== 0 ? e.pressure : 0.5 };
            };

            const startDrawing = (e) => {
                e.target.setPointerCapture(e.pointerId);
                // Обратный конец стилуса = ластик на один штрих. Браузер
                // сообщает о нём отдельной кнопкой (button 5 / бит 32).
                penErase.current = e.pointerType === 'pen' && (e.button === 5 || (e.buttons & 32) === 32);
                setIsDrawing(true); const pos = getPos(e); lastPoint.current = { ...pos, time: Date.now() };
                const ctx = canvasRef.current.getContext('2d'); ctx.beginPath();
                const baseBrush = brushSize * (canvasRef.current.width / 800);
                ctx.arc(pos.x, pos.y, (baseBrush * (0.5 + pos.pressure)) / 2, 0, Math.PI * 2);
                ctx.fillStyle = (tool === 'eraser' || penErase.current) ? '#262624' : color; ctx.fill();
            };

            const draw = (e) => {
                if (!isDrawing) return; const pos = getPos(e); const ctx = canvasRef.current.getContext('2d');
                const cT = Date.now(); const dist = Math.hypot(pos.x - lastPoint.current.x, pos.y - lastPoint.current.y);
                let press = pos.pressure;
                if (e.pointerType === 'touch' || e.pointerType === 'mouse') { press = Math.max(0.1, 1 - (dist / (cT - lastPoint.current.time || 1)) * 0.15); }

                ctx.beginPath(); ctx.moveTo(lastPoint.current.x, lastPoint.current.y);
                ctx.quadraticCurveTo(lastPoint.current.x, lastPoint.current.y, (lastPoint.current.x + pos.x) / 2, (lastPoint.current.y + pos.y) / 2);
                ctx.lineTo(pos.x, pos.y);
                
                ctx.strokeStyle = (tool === 'eraser' || penErase.current) ? '#262624' : color;
                const baseBrush = brushSize * (canvasRef.current.width / 800);
                ctx.lineWidth = baseBrush * (0.5 + press * 1.5); ctx.stroke();
                lastPoint.current = { ...pos, time: cT };
            };

            const stopDrawing = (e) => {
                if (e.target.hasPointerCapture && e.target.hasPointerCapture(e.pointerId)) {
                    e.target.releasePointerCapture(e.pointerId);
                }
                penErase.current = false;
                setIsDrawing(false);
            };

            return (
                <div className="fixed inset-0 z-[300] bg-[#1a1918]/95 backdrop-blur-xl flex flex-col">
                    <div className="flex justify-between items-center p-4 glass-panel border-b-0 shrink-0">
                        <div className="flex items-center gap-4">
                            <span className="text-white font-bold text-sm flex items-center gap-2"><Icons.Pen /> Модуль быстрого скетча</span>
                            <div className="flex gap-1 bg-black/50 p-1 rounded-lg">
                                <button onClick={() => setTool('brush')} className={`px-3 py-1 text-xs rounded flex items-center gap-1 ${tool === 'brush' ? 'bg-indigo-500 text-[#1a1918]' : 'text-zinc-400'}`}><Icons.Pen /> Кисть</button>
                                <button onClick={() => setTool('eraser')} className={`px-3 py-1 text-xs rounded flex items-center gap-1 ${tool === 'eraser' ? 'bg-zinc-700 text-white' : 'text-zinc-400'}`}><Icons.Eraser /> Ластик</button>
                            </div>
                            <input type="range" min="1" max="20" value={brushSize} onChange={e => setBrushSize(Number(e.target.value))} className="w-24 accent-indigo-500" />
                            <div className="gap-1 ml-4 hidden sm:flex">
                                {['#ffffff', '#f87171', '#60a5fa', '#34d399', '#facc15'].map(c => (
                                    <button key={c} onClick={() => {setColor(c); setTool('brush');}} style={{background: c}} className={`w-6 h-6 rounded-full border-2 ${color === c && tool === 'brush' ? 'border-white scale-110' : 'border-transparent hover:scale-110'} transition-transform`} />
                                ))}
                            </div>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => { const ctx = canvasRef.current.getContext('2d'); ctx.fillStyle = '#262624'; ctx.fillRect(0, 0, canvasRef.current.width, canvasRef.current.height); }} className="px-4 py-2 bg-zinc-800 text-zinc-300 text-xs rounded-lg hover:bg-zinc-700 flex items-center gap-1"><Icons.Trash /> Очистить</button>
                            <button onClick={() => onSave(canvasRef.current.toDataURL('image/jpeg', 0.8))} className="px-4 py-2 bg-indigo-500 text-[#1a1918] text-xs rounded-lg hover:bg-indigo-400 font-bold">Сохранить</button>
                            <button onClick={onClose} className="px-4 py-2 bg-white/10 text-white text-xs rounded-lg hover:bg-white/20">Отмена</button>
                        </div>
                    </div>
                    <div className="flex-1 p-4 md:p-12 flex justify-center items-center overflow-hidden">
                        <div className="w-full max-w-5xl aspect-video relative rounded-lg overflow-hidden border border-zinc-800">
                            <canvas ref={canvasRef} onPointerDown={startDrawing} onPointerMove={draw} onPointerUp={stopDrawing} onPointerCancel={stopDrawing} className="absolute inset-0 w-full h-full cursor-crosshair touch-none" />
                        </div>
                    </div>
                </div>
            );
        };

        // Показ панорамы: кадр натягивается обратно на сферу.
        // Сделано на «голом» WebGL, а не на готовой библиотеке, НАМЕРЕННО.
        // three.js в репозитории есть — им пользуется игра, — но лежит он
        // в папке game, которую service worker не кэширует, то есть без
        // интернета панорама просто не открылась бы. А ради площадки без
        // связи всё и затевалось.
        //
        // Геометрии здесь нет вовсе: рисуется один прямоугольник на весь
        // экран, и для каждой точки считается, куда смотрит луч. Это и
        // проще сферы из треугольников, и точнее — у сферы на полюсах
        // видны грани, а тут их взяться неоткуда.
        const PANO_VS = 'attribute vec2 p;varying vec2 v;void main(){v=p;gl_Position=vec4(p,0.0,1.0);}';
        const PANO_FS = [
          'precision highp float;',
          'varying vec2 v;',
          'uniform sampler2D tex;',
          'uniform float aspect;',   // ширина холста к высоте
          'uniform float tanHalf;',  // тангенс половины угла обзора
          'uniform mat3 rot;',
          'void main(){',
          '  vec3 dir = normalize(vec3(v.x*aspect*tanHalf, v.y*tanHalf, -1.0));',
          '  vec3 d = rot*dir;',
          '  float lon = atan(d.x, -d.z);',
          '  float lat = asin(clamp(d.y,-1.0,1.0));',
          // 0.15915494 = 1/2π, 0.31830989 = 1/π
          '  gl_FragColor = texture2D(tex, vec2(lon*0.15915494+0.5, 0.5-lat*0.31830989));',
          '}'
        ].join('\n');

        const PANO_FOV_MIN = 28, PANO_FOV_MAX = 100;

        const PanoView = ({ src, maxW, onFail }) => {
          const canvasRef = useRef(null);
          const glRef = useRef(null);
          const locRef = useRef(null);
          const viewRef = useRef({ yaw: 0, pitch: 0, fov: 78, vy: 0, vp: 0 });
          const ptrRef = useRef(new Map());
          const pinchRef = useRef(0);
          const rafRef = useRef(0);
          const dirtyRef = useRef(true);
          const [broken, setBroken] = useState(false);
          const [loading, setLoading] = useState(true);

          // Рисуем ПО НАДОБНОСТИ, а не каждый кадр: панорама висит на экране
          // подолгу, и крутить пустой цикл шестьдесят раз в секунду — это
          // просто съеденная батарея на площадке.
          const draw = () => {
            const gl = glRef.current, cv = canvasRef.current, loc = locRef.current;
            if (!gl || !cv || !loc) return;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const w = Math.max(1, Math.round(cv.clientWidth * dpr));
            const h = Math.max(1, Math.round(cv.clientHeight * dpr));
            if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
            gl.viewport(0, 0, w, h);
            const v = viewRef.current;
            const cy = Math.cos(v.yaw), sy = Math.sin(v.yaw);
            const cp = Math.cos(v.pitch), sp = Math.sin(v.pitch);
            // Поворот «рыскание, затем тангаж», по столбцам — так его ждёт WebGL
            gl.uniformMatrix3fv(loc.rot, false, new Float32Array([
              cy, 0, -sy,
              sy * sp, cp, cy * sp,
              sy * cp, -sp, cy * cp
            ]));
            gl.uniform1f(loc.aspect, w / h);
            gl.uniform1f(loc.tanHalf, Math.tan(v.fov * Math.PI / 360));
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          };

          const tick = () => {
            rafRef.current = 0;
            const v = viewRef.current;
            let moving = false;
            // Лёгкий выбег после отпускания: без него панорама
            // останавливается как вкопанная и кажется тяжёлой.
            if (ptrRef.current.size === 0 && (Math.abs(v.vy) > 2e-5 || Math.abs(v.vp) > 2e-5)) {
              v.yaw += v.vy;
              v.pitch = Math.max(-1.55, Math.min(1.55, v.pitch + v.vp));
              v.vy *= 0.9; v.vp *= 0.9;
              moving = true;
            }
            if (dirtyRef.current || moving) { dirtyRef.current = false; draw(); }
            if (moving) kick();
          };
          const kick = () => {
            dirtyRef.current = true;
            if (!rafRef.current) rafRef.current = requestAnimationFrame(tick);
          };

          // Заводим WebGL один раз на всё время показа
          useEffect(() => {
            const cv = canvasRef.current;
            if (!cv) return;
            const gl = cv.getContext('webgl', { alpha: false, antialias: false, preserveDrawingBuffer: false })
                    || cv.getContext('experimental-webgl');
            if (!gl) { setBroken(true); if (onFail) onFail(); return; }
            const mk = (type, code) => {
              const s = gl.createShader(type);
              gl.shaderSource(s, code); gl.compileShader(s);
              if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
                console.warn('Панорама, шейдер:', gl.getShaderInfoLog(s)); return null;
              }
              return s;
            };
            const vs = mk(gl.VERTEX_SHADER, PANO_VS), fs = mk(gl.FRAGMENT_SHADER, PANO_FS);
            if (!vs || !fs) { setBroken(true); if (onFail) onFail(); return; }
            const prog = gl.createProgram();
            gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
            if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { setBroken(true); if (onFail) onFail(); return; }
            gl.useProgram(prog);
            const buf = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buf);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
            const ap = gl.getAttribLocation(prog, 'p');
            gl.enableVertexAttribArray(ap);
            gl.vertexAttribPointer(ap, 2, gl.FLOAT, false, 0, 0);
            const tex = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, tex);
            // По горизонтали текстура заворачивается — иначе на стыке
            // панорамы стоит щель. По вертикали, наоборот, зажимаем:
            // над головой и под ногами заворачивать нечего.
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            gl.uniform1i(gl.getUniformLocation(prog, 'tex'), 0);
            glRef.current = gl;
            locRef.current = {
              rot: gl.getUniformLocation(prog, 'rot'),
              aspect: gl.getUniformLocation(prog, 'aspect'),
              tanHalf: gl.getUniformLocation(prog, 'tanHalf')
            };
            const onResize = () => kick();
            window.addEventListener('resize', onResize);
            kick();
            return () => {
              window.removeEventListener('resize', onResize);
              if (rafRef.current) cancelAnimationFrame(rafRef.current);
              rafRef.current = 0;
              try {
                gl.deleteTexture(tex); gl.deleteBuffer(buf); gl.deleteProgram(prog);
                const lose = gl.getExtension('WEBGL_lose_context');
                if (lose) lose.loseContext();
              } catch (e) {}
              glRef.current = null; locRef.current = null;
            };
          }, []);

          // Картинка приезжает и подменяется прямо на ходу: сначала
          // панорамное превью из проекта, следом — полный размер из облака.
          useEffect(() => {
            const gl = glRef.current;
            if (!gl || !src) return;
            let alive = true;
            setLoading(true);
            (async () => {
              try {
                const cap = Math.min(potCeil(maxW || PANO_VIEW_W), gl.getParameter(gl.MAX_TEXTURE_SIZE), PANO_VIEW_W);
                const bmp = await decodeScaled(src, cap, cap / 2);
                if (!alive) { if (bmp.close) bmp.close(); return; }
                gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, bmp);
                if (bmp.close) bmp.close();
                setLoading(false);
                kick();
              } catch (e) {
                console.warn('Панорама: не удалось показать кадр', e);
                if (alive) { setLoading(false); setBroken(true); if (onFail) onFail(); }
              }
            })();
            return () => { alive = false; };
          }, [src, maxW]);

          const angPerPx = () => (viewRef.current.fov * Math.PI / 180) / Math.max(1, canvasRef.current ? canvasRef.current.clientHeight : 1);

          const onDown = (e) => {
            e.currentTarget.setPointerCapture(e.pointerId);
            ptrRef.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
            const v = viewRef.current; v.vy = 0; v.vp = 0;
            pinchRef.current = 0;
          };
          const onMove = (e) => {
            const pts = ptrRef.current;
            if (!pts.has(e.pointerId)) return;
            const prev = pts.get(e.pointerId);
            pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
            const v = viewRef.current;
            if (pts.size >= 2) {
              // Щипок двумя пальцами приближает — на планшете это
              // единственный привычный способ, колеса там нет.
              const [a, b] = [...pts.values()];
              const d = Math.hypot(a.x - b.x, a.y - b.y);
              if (pinchRef.current) {
                v.fov = Math.max(PANO_FOV_MIN, Math.min(PANO_FOV_MAX, v.fov * (pinchRef.current / Math.max(1, d))));
              }
              pinchRef.current = d;
              kick();
              return;
            }
            const k = angPerPx();
            const dx = (e.clientX - prev.x) * k, dy = (e.clientY - prev.y) * k;
            // Кадр держится за палец: ведём вправо — картинка едет вправо,
            // то есть смотрим левее. Знак тут ровно тот, при котором
            // панорама ощущается взятой рукой, а не проматываемой мимо.
            v.yaw += dx; v.pitch = Math.max(-1.55, Math.min(1.55, v.pitch + dy));
            v.vy = dx; v.vp = dy;
            kick();
          };
          const onUp = (e) => {
            try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (err) {}
            ptrRef.current.delete(e.pointerId);
            if (ptrRef.current.size < 2) pinchRef.current = 0;
            kick();
          };
          const onWheel = (e) => {
            const v = viewRef.current;
            v.fov = Math.max(PANO_FOV_MIN, Math.min(PANO_FOV_MAX, v.fov * (e.deltaY > 0 ? 1.1 : 1 / 1.1)));
            kick();
          };

          if (broken) {
            return (
              <img src={src} className="max-w-full max-h-full object-contain rounded-lg"
                   onClick={(e) => e.stopPropagation()} />
            );
          }
          return (
            <div className="relative w-full h-full" onClick={(e) => e.stopPropagation()}>
              <canvas ref={canvasRef}
                      onPointerDown={onDown} onPointerMove={onMove}
                      onPointerUp={onUp} onPointerCancel={onUp} onWheel={onWheel}
                      className="w-full h-full rounded-lg touch-none cursor-grab active:cursor-grabbing"
                      style={{ display: 'block' }} />
              {loading && (
                <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                  <span className="glass-panel rounded-full px-4 py-2 text-xs font-semibold text-zinc-300">Разворачиваю панораму...</span>
                </div>
              )}
            </div>
          );
        };

        const Lightbox = ({ refs, initialId, onClose, scopeLabel, hints, onAddTag, onRemoveTag, onSetPano }) => {
            const [currentId, setCurrentId] = useState(initialId);
            const currentIndex = refs.findIndex(r => r.id === currentId);
            const currentRef = refs[currentIndex];
            // Окошко тегов: размечать удобнее всего именно здесь, где кадр
            // виден целиком. Показано оно или нет — помним, чтобы не включать
            // заново на каждом кадре.
            const [tagsOpen, setTagsOpen] = useState(() => {
                try { return localStorage.getItem('cf_lb_tags') === '1'; } catch (e) { return false; }
            });
            const toggleTags = (v) => {
                setTagsOpen(v);
                try { localStorage.setItem('cf_lb_tags', v ? '1' : '0'); } catch (e) {}
            };

            // Стрелки листают, Esc закрывает — на компьютере так удобнее мыши.
            useEffect(() => {
                const onKey = (e) => {
                    // Пока набираем тег, стрелки должны двигать курсор в поле,
                    // а не листать кадры. Escape в поле — выход из поля;
                    // второй Escape закроет просмотр, как и раньше.
                    const t = e.target;
                    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) {
                        if (e.key === 'Escape') t.blur();
                        return;
                    }
                    if (e.key === 'Escape') { onClose(); return; }
                    if (e.key === 'ArrowLeft' && currentIndex > 0) setCurrentId(refs[currentIndex - 1].id);
                    if (e.key === 'ArrowRight' && currentIndex < refs.length - 1) setCurrentId(refs[currentIndex + 1].id);
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [currentIndex, refs, onClose]);

            // Полный размер лежит в облаке, а в проекте — только превью.
            // Показываем сразу превью (оно уже на устройстве), а следом
            // подменяем оригиналом, когда тот доедет: пустой экран в
            // ожидании сети хуже, чем мягковатая картинка на секунду.
            // У Яндекс.Диска публичная ссылка ведёт на страницу, а не на
            // файл, поэтому настоящий адрес спрашивается отдельно — этим
            // и занимается cloudDirectUrl.
            const [bigUrl, setBigUrl] = useState('');
            useEffect(() => {
                setBigUrl('');
                if (!currentRef || !currentRef.full) return;
                let alive = true;
                cloudDirectUrl(currentRef).then(u => { if (alive && u) setBigUrl(u); });
                return () => { alive = false; };
            }, [currentRef && currentRef.id, currentRef && currentRef.full]);

            // Полный размер панорамы приходится сначала СКАЧАТЬ файлом,
            // а не отдать адресом прямо в картинку. Причина: кадр уходит
            // в видеокарту, а туда чужие изображения пускают только с
            // разрешения самого облака. Скачанный файл считается своим —
            // и вопрос снимается. Не дало скачать (облако не разрешает
            // читать файлы чужому сайту) — не беда: остаётся панорамное
            // превью из проекта, ради него оно и лежит рядом.
            const [panoFull, setPanoFull] = useState('');
            useEffect(() => {
                setPanoFull('');
                if (!currentRef || !currentRef.pano || !bigUrl) return;
                let alive = true, made = '';
                (async () => {
                    try {
                        const res = await fetch(bigUrl);
                        if (!res.ok) return;
                        const blob = await res.blob();
                        if (!alive) return;
                        made = URL.createObjectURL(blob);
                        setPanoFull(made);
                    } catch (e) {
                        console.warn('Панорама: полный размер не забрать, показываю превью', e);
                    }
                })();
                return () => {
                    alive = false;
                    // С запасом: показ мог ещё не дочитать файл
                    if (made) setTimeout(() => URL.revokeObjectURL(made), 10000);
                };
            }, [currentRef && currentRef.id, currentRef && currentRef.pano, bigUrl]);

            if (!currentRef) return null;

            const isPano = !!currentRef.pano;
            const panoSrc = panoFull || currentRef.panoUrl || currentRef.url;
            const panoMax = panoFull ? PANO_VIEW_W : PANO_THUMB_W;

            return (
                <div className="fixed inset-0 z-[350] bg-[#1a1918]/95 backdrop-blur-md flex flex-col justify-center items-center p-4">
                    <button onClick={onClose} className="absolute top-6 right-6 text-white bg-white/10 hover:bg-white/20 w-10 h-10 rounded-full flex items-center justify-center text-lg z-10 transition-colors border border-white/10">✕</button>
                    {/* Метка «это панорама» — она же переключатель.
                        Распознавание ошибается в обе стороны, и починить
                        это должно быть можно прямо здесь, где кадр виден. */}
                    {onSetPano && (
                        <button onClick={() => onSetPano(currentRef, !isPano)}
                                title={isPano ? 'Показывать обычным плоским кадром' : 'Это панорама 360° — развернуть на сферу'}
                                className="cf-edit-only absolute top-6 left-6 z-20 rounded-full px-3 py-1.5 transition-colors"
                                style={isPano
                                  ? { background: 'var(--accent)', color: 'var(--bg)', fontSize: 11.5, fontWeight: 700 }
                                  : { background: 'rgba(255,255,255,.08)', color: 'var(--muted-2)', border: '1px solid var(--border)', fontSize: 11.5, fontWeight: 700 }}>
                            360°
                        </button>
                    )}
                    <div className="relative w-full h-full flex justify-center items-center max-w-[95vw] max-h-[95vh]">
                        {currentIndex > 0 && ( <button onClick={(e) => { e.stopPropagation(); setCurrentId(refs[currentIndex - 1].id); }} className="absolute left-2 md:left-8 p-4 bg-black/50 rounded-full text-white hover:bg-indigo-600 z-10 transition-colors"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m15 18-6-6 6-6"/></svg></button> )}
                        {isPano ? (
                            <PanoView key={currentRef.id} src={panoSrc} maxW={panoMax} />
                        ) : (
                            <img src={bigUrl || currentRef.url} className="max-w-full max-h-full object-contain rounded-lg" onClick={(e) => e.stopPropagation()}
                                 onError={() => { if (bigUrl) setBigUrl(''); }} />
                        )}
                        {currentIndex < refs.length - 1 && ( <button onClick={(e) => { e.stopPropagation(); setCurrentId(refs[currentIndex + 1].id); }} className="absolute right-2 md:right-8 p-4 bg-black/50 rounded-full text-white hover:bg-indigo-600 z-10 transition-colors"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m9 18 6-6-6-6"/></svg></button> )}
                    </div>
                    {/* Теги кадра — окошком в левом нижнем углу. Поднято над
                        нижней полосой со счётчиком, чтобы не налезать на неё. */}
                    {onAddTag && (tagsOpen ? (
                        <div className="cf-lb-tags absolute glass-panel rounded-lg z-20 border-t border-white/10"
                             style={{ left: 16, bottom: 76, padding: 8, width: 'max-content',
                                      minWidth: 150, maxWidth: 'min(320px, calc(100vw - 32px))' }}>
                            {/* Поле ввода СВЕРХУ, теги под ним. Окошко стоит внизу
                                экрана, поэтому список подсказок разворачивается
                                вверх — и, стой поле последним, он закрывал бы
                                собой сами теги. Заголовка нет намеренно: в
                                полноэкранном режиме место дороже подписи. */}
                            <button onClick={() => toggleTags(false)} title="Спрятать теги"
                                    className="absolute w-5 h-5 flex items-center justify-center rounded text-zinc-600 hover:text-white hover:bg-white/10"
                                    style={{ top: 4, right: 4, fontSize: 10 }}>✕</button>
                            <div className="cf-edit-only" style={{ paddingRight: 22 }}>
                                <TagInput key={currentRef.id} ref_={currentRef} hints={hints} onAdd={onAddTag} narrow />
                            </div>
                            <div className="flex flex-wrap gap-1 items-center mt-1.5">
                                {(currentRef.tags || []).length === 0 && (
                                    <span className="cf-meta">Без тегов</span>
                                )}
                                {(currentRef.tags || []).map(t => (
                                    <span key={t} className="bg-indigo-900/40 text-indigo-200 rounded flex items-center gap-0.5 whitespace-nowrap"
                                          style={{ fontSize: 10.5, padding: '1px 5px', lineHeight: 1.45 }}>
                                        {t}
                                        <button onClick={() => onRemoveTag(currentRef, t)} title="Убрать тег"
                                                className="cf-edit-only hover:text-white" style={{ fontSize: 9, opacity: .75 }}>✕</button>
                                    </span>
                                ))}
                            </div>
                        </div>
                    ) : (
                        <button onClick={() => toggleTags(true)} title="Показать теги кадра"
                                className="absolute glass-panel rounded-full px-3 py-1.5 z-20 flex items-center gap-1.5 text-zinc-400 hover:text-white transition-colors"
                                style={{ left: 16, bottom: 76 }}>
                            <Icons.Tag/>
                            <span style={{ fontSize: 11, fontWeight: 600 }}>
                                {(currentRef.tags || []).length || ''}
                            </span>
                        </button>
                    ))}

                    <div className="absolute bottom-6 flex items-center gap-2 max-w-[92vw]">
                        <span className="glass-panel rounded-full px-4 py-2 text-xs font-mono font-bold text-zinc-300 shrink-0">{currentIndex + 1} / {refs.length}</span>
                        {/* Подсказка нужна и в режиме просмотра: человеку,
                            которому прислали ссылку, иначе неоткуда узнать,
                            что кадр можно крутить. */}
                        {isPano && (
                            <span className="glass-panel rounded-full px-4 py-2 text-xs font-semibold shrink-0 whitespace-nowrap"
                                  style={{ color: 'var(--accent)' }}>
                                360° <span className="hidden sm:inline" style={{ color: 'var(--muted-2)' }}>· ведите пальцем, щипок приближает</span>
                            </span>
                        )}
                        {scopeLabel && <span className="glass-panel rounded-full px-4 py-2 text-xs font-semibold shrink-0 hidden sm:block" style={{ color: 'var(--accent)' }}>{scopeLabel}</span>}
                        {currentRef.label && <span className="px-5 py-2 glass-panel rounded-full text-sm font-medium text-white text-center truncate">{currentRef.label}</span>}
                    </div>
                </div>
            );
        };

        const LightSchemeEditor = ({ scheme, onSave, onClose }) => {
            const [elements, setElements] = useState(scheme?.elements || []);
            const [mode, setMode] = useState('select'); 
            const [selectedId, setSelectedId] = useState(null);
            const [drawData, setDrawData] = useState(scheme?.drawData || null);
            const canvasRef = useRef(null);
            const containerRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [brushColor, setBrushColor] = useState('#facc15');
            const [brushSize, setBrushSize] = useState(10);
            const lastPt = useRef({x:0, y:0});
            
            const [draggingEl, setDraggingEl] = useState(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if(canvas) {
                    canvas.width = 1600; canvas.height = 900;
                    const ctx = canvas.getContext('2d');
                    if (drawData) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0); img.src = drawData; }
                }
            }, []);

            const SHAPE_MODES = ['rect', 'circle', 'triangle', 'diamond', 'star', 'arrow', 'text'];
            const handlePointerDown = (e) => {
                if (mode === 'select' || SHAPE_MODES.includes(mode)) {
                    if (e.target.closest('.scheme-el')) return;
                    if (SHAPE_MODES.includes(mode)) {
                        const rect = containerRef.current.getBoundingClientRect();
                        const x = (e.clientX - rect.left) * (1600 / rect.width);
                        const y = (e.clientY - rect.top) * (900 / rect.height);
                        const newEl = { id: `el-${Date.now()}`, type: mode, x, y, w: 100, h: 100, color: brushColor, text: mode === 'text' ? 'Текст' : '', label: '' };
                        if(mode === 'text') { newEl.w = 200; newEl.h = 50; }
                        setElements([...elements, newEl]);
                        setMode('select'); setSelectedId(newEl.id);
                    } else { setSelectedId(null); }
                    return;
                }
                e.currentTarget.setPointerCapture(e.pointerId);
                setIsDrawing(true);
                const rect = canvasRef.current.getBoundingClientRect();
                lastPt.current = { x: (e.clientX - rect.left) * (1600 / rect.width), y: (e.clientY - rect.top) * (900 / rect.height) };
                const ctx = canvasRef.current.getContext('2d'); ctx.beginPath(); ctx.arc(lastPt.current.x, lastPt.current.y, brushSize/2, 0, Math.PI*2); ctx.fillStyle = mode==='erase' ? 'rgba(0,0,0,1)' : brushColor;
                if(mode==='erase') ctx.globalCompositeOperation = 'destination-out'; else { ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = 0.5; }
                ctx.fill(); ctx.globalAlpha = 1.0; ctx.globalCompositeOperation = 'source-over';
            };

            const handlePointerMove = (e) => {
                if (draggingEl) {
                    const rect = containerRef.current.getBoundingClientRect();
                    const nx = (e.clientX - rect.left) * (1600 / rect.width) - draggingEl.ox;
                    const ny = (e.clientY - rect.top) * (900 / rect.height) - draggingEl.oy;
                    setElements(elements.map(el => el.id === draggingEl.id ? {...el, x: nx, y: ny} : el));
                    return;
                }
                if (!isDrawing) return;
                const rect = canvasRef.current.getBoundingClientRect();
                const pos = { x: (e.clientX - rect.left) * (1600 / rect.width), y: (e.clientY - rect.top) * (900 / rect.height) };
                const ctx = canvasRef.current.getContext('2d');
                ctx.save();
                if (mode === 'erase') { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = brushSize*2; ctx.strokeStyle = 'rgba(0,0,0,1)'; }
                else { ctx.strokeStyle = brushColor; ctx.lineWidth = brushSize; ctx.globalAlpha = 0.5; ctx.globalCompositeOperation = 'screen'; }
                ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(lastPt.current.x, lastPt.current.y); ctx.lineTo(pos.x, pos.y); ctx.stroke(); ctx.restore();
                lastPt.current = pos;
            };

            const handlePointerUp = (e) => { 
                if (e.target.hasPointerCapture && e.target.hasPointerCapture(e.pointerId)) {
                    e.target.releasePointerCapture(e.pointerId);
                }
                setIsDrawing(false); setDraggingEl(null); 
            };

            const updateSelected = (updates) => { setElements(elements.map(el => el.id === selectedId ? {...el, ...updates} : el)); };

            return (
                <div className="fixed inset-0 z-[300] bg-[#1a1918]/95 backdrop-blur-xl flex flex-col">
                    <div className="flex flex-col lg:flex-row lg:justify-between lg:items-center gap-3 p-4 glass-panel border-b-0 shrink-0">
                        <div className="flex flex-wrap items-center gap-y-2 gap-x-4">
                            <span className="text-amber-400 font-bold text-sm flex items-center gap-2 shrink-0"><Icons.Lightbulb /> Интерактивная Схема Света</span>
                            <div className="flex flex-wrap gap-1 bg-black/50 p-1 rounded-lg">
                                <button onClick={() => setMode('select')} className={`px-2 py-1 text-xs rounded ${mode==='select'?'bg-indigo-500 text-[#1a1918]':'text-zinc-400'}`}><Icons.Pointer/></button>
                                <button onClick={() => setMode('draw')} className={`px-2 py-1 text-xs rounded ${mode==='draw'?'bg-indigo-500 text-[#1a1918]':'text-zinc-400'}`}><Icons.Pen/></button>
                                <button onClick={() => setMode('erase')} className={`px-2 py-1 text-xs rounded ${mode==='erase'?'bg-zinc-700 text-white':'text-zinc-400'}`}><Icons.Eraser/></button>
                                <div className="w-[1px] h-4 bg-white/20 my-auto mx-1"></div>
                                <button onClick={() => setMode('rect')} title="Прямоугольник" className={`px-2 py-1 text-xs rounded ${mode==='rect'?'bg-indigo-500 text-[#1a1918]':'text-zinc-400'}`}><Icons.Square/></button>
                                <button onClick={() => setMode('circle')} title="Круг" className={`px-2 py-1 text-xs rounded ${mode==='circle'?'bg-indigo-500 text-[#1a1918]':'text-zinc-400'}`}><Icons.Circle/></button>
                                <button onClick={() => setMode('triangle')} title="Треугольник" className={`px-2 py-1 text-xs rounded ${mode==='triangle'?'bg-indigo-500 text-[#1a1918]':'text-zinc-400'}`}><Icons.Triangle/></button>
                                <button onClick={() => setMode('diamond')} title="Ромб" className={`px-2 py-1 text-xs rounded ${mode==='diamond'?'bg-indigo-500 text-[#1a1918]':'text-zinc-400'}`}><Icons.Diamond/></button>
                                <button onClick={() => setMode('star')} title="Звезда" className={`px-2 py-1 text-xs rounded ${mode==='star'?'bg-indigo-500 text-[#1a1918]':'text-zinc-400'}`}><Icons.Star/></button>
                                <button onClick={() => setMode('arrow')} title="Стрелка (направление луча)" className={`px-2 py-1 text-xs rounded ${mode==='arrow'?'bg-indigo-500 text-[#1a1918]':'text-zinc-400'}`}><Icons.BeamArrow/></button>
                                <button onClick={() => setMode('text')} title="Текст" className={`px-2 py-1 text-xs rounded ${mode==='text'?'bg-indigo-500 text-[#1a1918]':'text-zinc-400'}`}><Icons.TextIcon/></button>
                            </div>
                            <div className="flex gap-1">
                                {['#facc15', '#60a5fa', '#f87171', '#34d399', '#ffffff'].map(c => (
                                    <button key={c} onClick={() => {setBrushColor(c); if(selectedId) updateSelected({color: c});}} style={{background: c}} className={`w-5 h-5 rounded-full border-2 ${brushColor === c ? 'border-white scale-110' : 'border-transparent hover:scale-110'} transition-transform`} />
                                ))}
                            </div>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => {
                                const pc = document.createElement('canvas'); pc.width = 1600; pc.height = 900;
                                const pctx = pc.getContext('2d');
                                pctx.fillStyle = '#262624'; pctx.fillRect(0, 0, 1600, 900);
                                pctx.globalAlpha = 0.85; pctx.drawImage(canvasRef.current, 0, 0); pctx.globalAlpha = 1;
                                elements.forEach(el => {
                                    pctx.fillStyle = el.color || '#facc15';
                                    if (el.type === 'rect') { pctx.fillRect(el.x, el.y, el.w, el.h); }
                                    else if (el.type === 'circle') { pctx.beginPath(); pctx.ellipse(el.x + el.w/2, el.y + el.h/2, el.w/2, el.h/2, 0, 0, Math.PI*2); pctx.fill(); }
                                    else if (el.type === 'triangle') { pctx.beginPath(); pctx.moveTo(el.x + el.w/2, el.y); pctx.lineTo(el.x, el.y + el.h); pctx.lineTo(el.x + el.w, el.y + el.h); pctx.closePath(); pctx.fill(); }
                                    else if (el.type === 'diamond') { pctx.beginPath(); pctx.moveTo(el.x + el.w/2, el.y); pctx.lineTo(el.x + el.w, el.y + el.h/2); pctx.lineTo(el.x + el.w/2, el.y + el.h); pctx.lineTo(el.x, el.y + el.h/2); pctx.closePath(); pctx.fill(); }
                                    else if (el.type === 'star') {
                                        const cx = el.x + el.w/2, cy = el.y + el.h/2, oR = Math.min(el.w, el.h)/2, iR = oR * 0.45;
                                        pctx.beginPath();
                                        for (let i = 0; i < 10; i++) { const r = i % 2 === 0 ? oR : iR; const ang = (Math.PI/5)*i - Math.PI/2; const px = cx + r*Math.cos(ang), py = cy + r*Math.sin(ang); if (i===0) pctx.moveTo(px,py); else pctx.lineTo(px,py); }
                                        pctx.closePath(); pctx.fill();
                                    }
                                    else if (el.type === 'arrow') {
                                        const x1 = el.x, y1 = el.y + el.h, x2 = el.x + el.w, y2 = el.y;
                                        pctx.strokeStyle = el.color || '#facc15'; pctx.lineWidth = Math.max(3, Math.min(el.w, el.h) * 0.06); pctx.lineCap = 'round';
                                        pctx.beginPath(); pctx.moveTo(x1, y1); pctx.lineTo(x2, y2); pctx.stroke();
                                        const ang = Math.atan2(y2-y1, x2-x1); const headLen = Math.min(el.w, el.h) * 0.25;
                                        pctx.beginPath(); pctx.moveTo(x2, y2);
                                        pctx.lineTo(x2 - headLen*Math.cos(ang - Math.PI/6), y2 - headLen*Math.sin(ang - Math.PI/6));
                                        pctx.lineTo(x2 - headLen*Math.cos(ang + Math.PI/6), y2 - headLen*Math.sin(ang + Math.PI/6));
                                        pctx.closePath(); pctx.fill();
                                    }
                                    else if (el.type === 'text') { pctx.font = 'bold 30px Archivo, sans-serif'; pctx.fillText(el.text || '', el.x + 8, el.y + 36); }
                                    if (el.label) { pctx.font = '22px Archivo, sans-serif'; pctx.fillStyle = '#f0eee6'; pctx.textAlign = 'center'; pctx.fillText(el.label, el.x + el.w/2, el.y + el.h + 30); pctx.textAlign = 'left'; }
                                });
                                onSave(scheme.id, elements, canvasRef.current.toDataURL('image/png'), pc.toDataURL('image/jpeg', 0.85));
                            }} className="px-4 py-2 bg-indigo-500 text-[#1a1918] text-xs rounded-lg hover:bg-indigo-400 font-bold">Сохранить схему</button>
                            <button onClick={onClose} className="px-4 py-2 bg-white/10 text-white text-xs rounded-lg hover:bg-white/20">Закрыть</button>
                        </div>
                    </div>

                    <div className="flex-1 flex overflow-hidden">
                        <div className="flex-1 relative p-4 flex justify-center items-center" onPointerMove={handlePointerMove} onPointerUp={handlePointerUp} onPointerCancel={handlePointerUp}>
                            <div ref={containerRef} onPointerDown={handlePointerDown} className="relative w-full max-w-5xl aspect-video bg-zinc-950 rounded-lg overflow-hidden border border-white/10 cursor-crosshair">
                                <canvas ref={canvasRef} className="absolute inset-0 w-full h-full pointer-events-none opacity-80" />
                                {elements.map(el => (
                                    <div key={el.id} className={`scheme-el absolute pointer-events-auto ${selectedId === el.id ? 'ring-2 ring-indigo-400' : ''}`}

                                        onPointerDown={(e) => { e.stopPropagation(); setSelectedId(el.id); setMode('select'); setDraggingEl({id: el.id, ox: (e.clientX - e.currentTarget.getBoundingClientRect().left)*(1600/containerRef.current.getBoundingClientRect().width), oy: (e.clientY - e.currentTarget.getBoundingClientRect().top)*(900/containerRef.current.getBoundingClientRect().height)}); }}>
