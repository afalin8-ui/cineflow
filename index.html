                      // берут на площадку: там смотрят одним глазом, держат
                      // одной рукой и нажимают, не целясь. Поэтому здесь нет
                      // ни трёх колонок, ни панели сбоку, ни наведения —
                      // один вертикальный свиток и цели от 44 точек.
                      if (isPhone) {
                        // --- СПИСОК СЦЕН ---
                        if (!phoneSceneOpen) {
                          const shiftNo = nearestShift ? shiftDates.indexOf(nearestShift) + 1 : 0;
                          const pills = [
                            nearestShift ? { id: 'shift', label: `Смена ${shiftNo}` } : null,
                            { id: 'all', label: 'Все' },
                            { id: 'todo', label: 'Не готовы' },
                            { id: 'nat', label: 'НАТ' },
                            { id: 'int', label: 'ИНТ' }
                          ].filter(Boolean);
                          const keep = (sc) => {
                            if (phoneFilter === 'all') return true;
                            if (phoneFilter === 'shift') return nearestShift ? sc.date === nearestShift : true;
                            // «Не готова» — это сцена, к которой ещё нечего
                            // показать: ни разбора, ни единого кадра.
                            if (phoneFilter === 'todo') return !(sc.content || '').trim() && !storyboard.some(f => f.sceneId === sc.id);
                            if (phoneFilter === 'nat') return sceneBadge(sc).startsWith('НАТ');
                            if (phoneFilter === 'int') return sceneBadge(sc).startsWith('ИНТ');
                            return true;
                          };
                          const shown = sortedScenes.filter(keep);
                          // Секции по объектам: на площадке думают местами,
                          // а не номерами — «сегодня мы на аэродроме».
                          const groups = [];
                          shown.forEach(sc => {
                            const l = locations.find(x => (x.sceneIds || []).includes(sc.id));
                            const key = l ? l.name : 'Без объекта';
                            const g = groups.find(x => x.key === key);
                            if (g) g.items.push(sc); else groups.push({ key, items: [sc] });
                          });
                          return (
                            <div className="flex flex-col w-full min-w-0">
                              <div className="flex gap-1.5 px-4 pb-2.5 overflow-x-auto hide-scrollbar shrink-0">
                                {pills.map(p => (
                                  <button key={p.id} onClick={() => setPhoneFilter(p.id)}
                                          className={`cf-pill ${phoneFilter === p.id ? 'on' : ''}`}>{p.label}</button>
                                ))}
                              </div>
                              <div className="flex-1 min-h-0 overflow-y-auto">
                                {shown.length === 0 && (
                                  <p className="px-4 py-6 text-center" style={{ fontSize: 13, color: 'var(--muted-2)', lineHeight: 1.7 }}>
                                    По этому фильтру сцен нет.<br />Нажмите «Все», чтобы увидеть весь список.
                                  </p>
                                )}
                                {groups.map(g => (
                                  <React.Fragment key={g.key}>
                                    <div className="px-4 pt-2.5 pb-1 cf-meta" style={{ letterSpacing: '.1em', textTransform: 'uppercase' }}>{g.key}</div>
                                    {g.items.map(sc => {
                                      const on = sc.id === (s && s.id);
                                      const cover = references.find(r => r.sceneId === sc.id && r.url)
                                                 || storyboard.find(f => f.sceneId === sc.id && f.image);
                                      const cnt = storyboard.filter(f => f.sceneId === sc.id).length;
                                      const l = locations.find(x => (x.sceneIds || []).includes(sc.id));
                                      const badge = sceneBadge(sc);
                                      return (
                                        <button key={sc.id}
                                                onClick={() => { setActiveSceneId(sc.id); setPhoneSceneOpen(true); }}
                                                className="w-full flex items-center gap-2.5 text-left"
                                                style={{ padding: '11px 16px', minHeight: 52,
                                                         borderBottom: '1px solid var(--line)',
                                                         background: on ? 'var(--card)' : 'transparent',
                                                         borderLeft: on ? '3px solid var(--accent)' : '3px solid transparent' }}>
                                          <span className="shrink-0" style={{ fontFamily: 'var(--font-mono)', fontSize: 12, width: 36, fontWeight: on ? 600 : 400, color: on ? 'var(--accent)' : 'var(--muted)' }}>#{sc.number}</span>
                                          {cover && <img src={cover.url || cover.image} draggable="false" className="shrink-0" style={{ width: 52, height: 34, objectFit: 'cover', borderRadius: 5 }} />}
                                          <span className="flex-1 min-w-0">
                                            <span className="block truncate" style={{ fontSize: 14, fontWeight: on ? 600 : 400, color: 'var(--text)' }}>{sc.title || 'Без названия'}</span>
                                            {on && (cnt || l) && (
                                              <span className="block truncate cf-meta" style={{ marginTop: 2 }}>
                                                {cnt ? `${cnt} кадр.` : ''}{cnt && l ? ' · ' : ''}{l ? l.name : ''}
                                              </span>
                                            )}
                                          </span>
                                          {badge && <span className="shrink-0" style={{ fontFamily: 'var(--font-mono)', fontSize: 9, color: on ? 'var(--warn)' : 'var(--muted-2)', border: '1px solid var(--line)', borderRadius: 4, padding: '2px 5px' }}>{badge}</span>}
                                        </button>
                                      );
                                    })}
                                  </React.Fragment>
                                ))}
                                <div className="p-4">
                                  <button onClick={() => { const num = nextSceneNumber(); const newS = { id: `sc-${Date.now()}`, number: num, title: 'НОВАЯ СЦЕНА', content: '', x: (150 - canvasOffset.x) / zoom, y: (150 - canvasOffset.y) / zoom, date: '', gear: {}, lightGear: {}, lightSchemeId: null }; setScenes([...scenes, newS]); syncDoc('scenes', newS.id, newS); setActiveSceneId(newS.id); setPhoneSceneOpen(true); }}
                                          className="cf-edit-only w-full text-center rounded-lg"
                                          style={{ border: '1px dashed var(--border)', color: 'var(--muted-2)', fontSize: 13, minHeight: 46 }}>+ сцена</button>
                                </div>
                              </div>
                            </div>
                          );
                        }

                        if (!s) {
                          return (
                            <main className="flex-1 min-w-0 flex items-center justify-center p-8 text-center">
                              <p style={{ fontSize: 13, color: 'var(--muted-2)', lineHeight: 1.7 }}>Сцена не выбрана.</p>
                            </main>
                          );
                        }

                        // --- РЕЖИМ «СЪЁМКА» НА ТЕЛЕФОНЕ ---
                        // Главный экран площадки. Текущий кадр развёрнут
                        // и с большой кнопкой на всю ширину; снятое гаснет
                        // и зачёркивается; очередь приглушена. Смотреть
                        // на это будут между дублями, одним взглядом.
                        if (sceneMode === 'shoot') {
                          const doneCount = frames.filter(f => f.shot).length;
                          const current = frames.find(f => !f.shot);
                          return (
                            <main className="flex-1 min-w-0 overflow-y-auto" style={{ padding: '0 16px 20px' }}>
                              <div className="flex items-baseline gap-2.5 flex-wrap pb-1">
                                <span style={{ fontSize: 20, fontWeight: 700, letterSpacing: '-.02em' }}>Съёмка</span>
                                <span className="cf-meta">СЦ {s.number}{s.date ? ' · ' + formatDateDisplay(s.date) : ''}</span>
                                {locCoords && s.date && (() => {
                                  const t = sunTimes(locCoords.lat, locCoords.lon, s.date);
                                  if (!t || t.sun.polar || !t.sun.set) return null;
                                  return <span className="ml-auto" style={{ fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--warn)' }}>свет до {hhmm(t.sun.set)}</span>;
                                })()}
                              </div>
                              <div className="cf-meta pb-2">снято {doneCount} из {frames.length}</div>
                              <div className="grid gap-2">
                                {frames.length === 0 && (
                                  <p style={{ fontSize: 13, color: 'var(--muted-2)', lineHeight: 1.7 }}>
                                    В сцене нет кадров. Заведите их в режиме «Творч» — здесь они станут чек-листом смены.
                                  </p>
                                )}
                                {frames.map(f => {
                                  const isCurrent = current && f.id === current.id;
                                  if (isCurrent) return (
                                    <div key={f.id} style={{ ...cardBox, padding: 12, borderLeft: '3px solid var(--accent)' }}>
                                      <div className="flex gap-2 items-baseline flex-wrap">
                                        <span style={{ fontFamily: 'var(--font-mono)', fontSize: 13, fontWeight: 600, color: 'var(--text)' }}>{f.frameNum} · сейчас</span>
                                        {f.lens && <span className="cf-meta">{f.lens}</span>}
                                      </div>
                                      <div style={{ fontSize: 15, color: 'var(--text)', marginTop: 5, lineHeight: 1.4 }}>{f.description || 'без описания'}</div>
                                      {gearLine(s.lightGear, lightGearTypes) && (
                                        <div style={{ fontSize: 11.5, color: 'var(--muted)', marginTop: 4 }}>свет: {gearLine(s.lightGear, lightGearTypes)}</div>
                                      )}
                                      {/* Кнопка во всю ширину: на площадке
                                          в перчатке целятся плохо, а промах
                                          по «снято» стоит дубля. */}
                                      <button onClick={() => patchFrame(f.id, { shot: true })}
                                              className="cf-edit-only w-full rounded-lg mt-2.5"
                                              style={{ minHeight: 46, background: 'var(--accent)', color: 'var(--bg)', fontSize: 14, fontWeight: 700 }}>
                                        Снят ✓
                                      </button>
                                    </div>
                                  );
                                  return (
                                    <div key={f.id} className="flex items-center gap-2.5"
                                         style={{ ...cardBox, padding: 10, opacity: f.shot ? 1 : .8,
                                                  borderLeft: `3px solid ${f.shot ? 'var(--ok)' : 'var(--border)'}` }}>
                                      <div className="shrink-0" style={{ width: 110, opacity: f.shot ? .5 : 1 }}>{frameThumb(f)}</div>
                                      <div className="flex-1 min-w-0">
                                        <div style={{ fontFamily: 'var(--font-mono)', fontSize: 12, fontWeight: 600, color: f.shot ? 'var(--ok)' : 'var(--text-2)' }}>{f.frameNum}{f.shot ? ' ✓' : ''}</div>
                                        <div className="truncate" style={{ fontSize: 12, marginTop: 2, color: f.shot ? 'var(--muted-2)' : 'var(--muted)', textDecoration: f.shot ? 'line-through' : 'none' }}>{f.description || 'без описания'}</div>
                                      </div>
                                      {f.shot && (
                                        <button onClick={() => patchFrame(f.id, { shot: false })} title="Снять отметку"
                                                className="cf-edit-only shrink-0 flex items-center justify-center"
                                                style={{ width: 44, height: 44, borderRadius: 12, background: 'var(--ok)', color: 'var(--bg)', fontSize: 18, fontWeight: 700 }}>✓</button>
                                      )}
                                    </div>
                                  );
                                })}
                              </div>
                            </main>
                          );
                        }

                        // --- РЕЖИМ «ПРЕЗЕНТАЦИЯ» НА ТЕЛЕФОНЕ ---
                        if (sceneMode === 'present') {
                          const shots = frames.filter(f => f.image);
                          return (
                            <main className="flex-1 min-w-0 overflow-y-auto" style={{ padding: '0 16px 24px' }}>
                              <div style={{ fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--accent)', letterSpacing: '.12em' }}>СЦЕНА {s.number}</div>
                              <h1 style={{ fontSize: 24, margin: '4px 0 0' }}>{s.title || 'Без названия'}</h1>
                              {(s.content || '').trim() && (
                                <p style={{ fontSize: 14.5, lineHeight: 1.6, color: 'var(--text-2)', margin: '10px 0 0', whiteSpace: 'pre-line' }}>{s.content}</p>
                              )}
                              {(shots.length ? shots : sceneRefs).map((f, i) => (
                                <img key={f.id} src={f.image || f.url} draggable="false"
                                     style={{ width: '100%', borderRadius: 10, display: 'block', marginTop: i === 0 ? 14 : 10,
                                              aspectRatio: shots.length ? SHOT_RATIO : 'auto', objectFit: shots.length ? 'cover' : 'contain' }} />
                              ))}
                              <div className="cf-meta" style={{ marginTop: 14 }}>
                                {frames.length} кадр. · {sceneRefs.length} референс.{loc ? ' · ' + loc.name : ''}
                              </div>
                            </main>
                          );
                        }

                        // --- РЕЖИМЫ «ТВОРЧ» И «СКАУТИНГ» НА ТЕЛЕФОНЕ ---
                        // Один вертикальный свиток. Всё, что на планшете
                        // стоит рядом, здесь идёт друг за другом, а ленты
                        // уходят до самых краёв экрана: обрезанная по полям
                        // лента читается как «здесь всё», и вбок никто
                        // не листает.
                        const scoutPhotos = loc ? references.filter(r => r.locationId === loc.id) : [];
                        const strip = sceneMode === 'scout' ? scoutPhotos : sceneRefs;
                        const stripLabel = sceneMode === 'scout' ? 'фото со скаутинга' : 'референсы';
                        return (
                          <main className="flex-1 min-w-0 overflow-y-auto" style={{ padding: '0 16px 24px' }}>
                            <div className="flex items-baseline gap-2">
                              <span style={{ fontFamily: 'var(--font-mono)', fontSize: 12, color: 'var(--accent)', fontWeight: 600 }}>СЦ {s.number}</span>
                              <span className="cf-meta">{sceneBadge(s) || '—'}{s.date ? ' · ' + formatDateDisplay(s.date) : ''}</span>
                            </div>
                            <input type="text" value={s.title} onChange={(e) => updateSceneTitle(s.id, e.target.value)}
                                   className="w-full bg-transparent focus:outline-none"
                                   style={{ fontSize: 21, fontWeight: 700, letterSpacing: '-.02em', color: 'var(--text)', marginTop: 3 }}
                                   placeholder="Название сцены" />

                            <div className="flex gap-2 mt-3 overflow-x-auto cf-bleed" style={{ paddingBottom: 2 }}>
                              {strip.map(r => (
                                <img key={r.id} src={r.url} draggable="false"
                                     onClick={() => setLightboxData({ scope: strip.map(x => x.id), scopeLabel: `Сцена #${s.number}`, currentId: r.id })}
                                     style={{ width: 230, height: 130, objectFit: 'cover', borderRadius: 9, flexShrink: 0 }} />
                              ))}
                              <PhotoSourcePicker onFiles={(fs) => handleMultiFileUpload(fs, sceneMode === 'scout' ? null : s.id, null, sceneMode === 'scout' && loc ? loc.id : null)}
                                     className="cf-edit-only shrink-0 flex flex-col items-center justify-center gap-1"
                                     style={{ width: 130, height: 130, border: '1px dashed var(--border)', borderRadius: 9, color: 'var(--muted-2)', fontSize: 12, boxSizing: 'border-box' }}>
                                <span style={{ fontSize: 20, lineHeight: 1 }}>+</span>
                                {sceneMode === 'scout' ? 'фото' : 'картинки'}
                              </PhotoSourcePicker>
                            </div>
                            <div className="cf-meta" style={{ marginTop: 6 }}>
                              {stripLabel} · {strip.length}
                              {sceneMode !== 'scout' && (
                                <button onClick={() => setRefPicker({ mode: 'scene', sceneId: s.id })}
                                        className="cf-edit-only" style={{ color: 'var(--accent)', marginLeft: 6 }}>+ из галереи</button>
                              )}
                            </div>

                            {/* Текст сцены свёрнут: развёрнутый он занимает
                                весь экран, и до раскадровки не долистать. */}
                            <div style={{ ...cardBox, padding: '13px 14px', marginTop: 14 }}>
                              <div className="flex items-baseline">
                                <span style={{ fontSize: 10.5, letterSpacing: '.1em', textTransform: 'uppercase', color: 'var(--muted)' }}>Текст сцены</span>
                                <span className="ml-auto cf-meta">{(s.script || '').trim() ? `${(s.script || '').trim().split(/\s+/).length} слов` : 'пусто'}</span>
                              </div>
                              {phoneTextOpen ? (
                                <textarea value={s.script || ''} onChange={(e) => updateScene(s.id, 'script', e.target.value)}
                                          className="w-full bg-transparent focus:outline-none"
                                          style={{ fontSize: 14, lineHeight: 1.6, color: '#e3e0d7', marginTop: 8, resize: 'vertical', minHeight: 220, border: 'none', padding: 0 }}
                                          placeholder="Текст сцены из сценария." />
                              ) : (
                                <p style={{ fontSize: 14, lineHeight: 1.6, color: '#e3e0d7', margin: '8px 0 0', whiteSpace: 'pre-line',
                                            display: '-webkit-box', WebkitLineClamp: 4, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>
                                  {(s.script || '').trim() || 'Текст сцены из сценария. Загрузить весь сценарий разом — «Ещё» → «Агент КПП».'}
                                </p>
                              )}
                              <button onClick={() => setPhoneTextOpen(v => !v)}
                                      style={{ fontSize: 12.5, color: 'var(--accent)', marginTop: 6, minHeight: 32 }}>
                                {phoneTextOpen ? 'свернуть ↑' : 'развернуть →'}
                              </button>
                            </div>

                            <div className="flex items-center mt-4">
                              <span style={{ fontSize: 10.5, letterSpacing: '.1em', textTransform: 'uppercase', color: 'var(--muted)' }}>Раскадровка · {frames.length}</span>
                              <button onClick={addFrame} className="cf-edit-only ml-auto" style={{ fontSize: 12.5, color: 'var(--accent)', minHeight: 32 }}>+ кадр</button>
                            </div>
                            <div className="flex gap-2 mt-2 overflow-x-auto cf-bleed" style={{ paddingBottom: 4 }}>
                              {frames.map(f => (
                                <div key={f.id} className="shrink-0" style={{ width: 210, ...cardBox, padding: 7 }}>
                                  {f.image ? (
                                    <img src={f.image} draggable="false" style={{ width: '100%', aspectRatio: SHOT_RATIO, objectFit: 'cover', borderRadius: 6, display: 'block' }} />
                                  ) : (
                                    /* Пустой кадр на телефоне предлагал ОДИН путь — «скетч»,
                                       и положить в раскадровку снимок с телефона было нечем
                                       вовсе. На планшете половинки две, и здесь их две. */
                                    <div className="flex w-full" style={{ aspectRatio: SHOT_RATIO, border: '1px dashed var(--border)', borderRadius: 6, boxSizing: 'border-box', overflow: 'hidden' }}>
                                      <PhotoSourcePicker multiple={false}
                                              onFiles={(fs) => { const file = fs[0]; if (file) { const rd = new FileReader(); rd.onloadend = () => compressImage(rd.result, 600, 450, (c) => patchFrame(f.id, { image: c })); rd.readAsDataURL(file); } }}
                                              className="cf-edit-only flex-1 flex flex-col items-center justify-center gap-1"
                                              style={{ borderRight: '1px solid var(--line)', color: 'var(--muted-2)', fontFamily: 'var(--font-mono)', fontSize: 9, textTransform: 'uppercase' }}>
                                        <Icons.Image />фото
                                      </PhotoSourcePicker>
                                      <button onClick={() => setDrawingFrameId(f.id)} className="cf-edit-only flex-1 flex flex-col items-center justify-center gap-1"
                                              style={{ color: 'var(--muted-2)', fontFamily: 'var(--font-mono)', fontSize: 9, textTransform: 'uppercase' }}>
                                        <Icons.Pen />скетч
                                      </button>
                                    </div>
                                  )}
                                  <div className="flex justify-between gap-2" style={{ marginTop: 6 }}>
                                    <span style={{ fontFamily: 'var(--font-mono)', fontSize: 10.5, color: 'var(--text)' }}>{f.frameNum}</span>
                                    <span className="truncate" style={{ fontFamily: 'var(--font-mono)', fontSize: 9.5, color: 'var(--muted-2)' }}>{f.lens || ''}</span>
                                  </div>
                                  <input type="text" value={f.description || ''} onChange={(e) => patchFrame(f.id, { description: e.target.value })}
                                         placeholder="что в кадре" className="w-full bg-transparent focus:outline-none"
                                         style={{ fontSize: 12, color: 'var(--text-2)', marginTop: 3 }} />
                                </div>
                              ))}
                              <button onClick={addFrame} className="cf-edit-only shrink-0 flex flex-col items-center justify-center gap-1"
                                      style={{ width: 130, border: '1px dashed var(--border)', borderRadius: 10, color: 'var(--muted-2)', fontSize: 12, boxSizing: 'border-box' }}>
                                <span style={{ fontSize: 20, lineHeight: 1 }}>+</span>кадр
                              </button>
                            </div>

                            {/* ЧЕТЫРЕ ПЛИТКИ вместо панели-вкладок: каждая
                                открывает шторку снизу. Панель сбоку на
                                телефоне съела бы весь экран. */}
                            <div className="grid gap-2 mt-3.5" style={{ gridTemplateColumns: '1fr 1fr' }}>
                              <button onClick={() => setPhoneSheet('gear')} className="cf-tile">
                                <span style={{ display: 'flex', color: 'var(--accent)' }}><Icons.Video /></span>
                                Техника{Object.keys(s.gear || {}).length ? ` · ${Object.keys(s.gear).length}` : ''}
                              </button>
                              <button onClick={() => setPhoneSheet('light')} className="cf-tile">
                                <span style={{ display: 'flex', color: 'var(--warn)' }}><Icons.Lightbulb /></span>
                                Свет{Object.keys(s.lightGear || {}).length ? ` · ${Object.keys(s.lightGear).length}` : ''}
                              </button>
                              <button onClick={() => setPhoneSheet('sun')} className="cf-tile">
                                <span style={{ display: 'flex', color: 'var(--muted)' }}><Icons.Place /></span>
                                <span className="truncate">{loc ? loc.name : 'Объект'}</span>
                              </button>
                              <button onClick={() => setPhoneSheet('expl')} className="cf-tile">
                                <span style={{ display: 'flex', color: 'var(--muted)' }}><Icons.Pen /></span>
                                Экспликация
                              </button>
                            </div>

                            <button onClick={() => setSceneToBoard(s.id)} className="cf-edit-only w-full rounded-lg mt-2.5"
                                    style={{ minHeight: 46, border: '1px solid var(--border)', color: 'var(--text-2)', fontSize: 13 }}>
                              Собрать сцену на доске
                            </button>
                          </main>
                        );
                      }
                      // ---------- ЛЕВАЯ КОЛОНКА: СПИСОК СЦЕН ----------
                      // Одна строка на сцену: номер · превью · название ·
                      // бейдж. Раньше строка была двухэтажной и КАПСОМ —
                      // на экран влезало вдвое меньше сцен, а разобрать,
                      // где кончается одна и начинается другая, было трудно.
                      const sceneList = sceneListOpen ? (
                        <aside className="flex flex-col shrink-0" style={{ width: 212, background: 'var(--panel-2)', borderRight: '1px solid var(--border)' }}>
                          <div className="flex items-center gap-1.5 px-2.5 pt-2.5 pb-2">
                            <span className="cf-meta flex-1 truncate">Сцены · {scenes.length}</span>
                            <button onClick={() => setSceneListOpen(false)} title="Свернуть список сцен"
                                    className="flex items-center justify-center shrink-0"
                                    style={{ width: 22, height: 22, border: '1px solid var(--border)', borderRadius: 6, color: 'var(--muted-2)', fontSize: 12 }}>‹</button>
                          </div>
                          <div className="flex-1 overflow-y-auto">
                            {sortedScenes.map(sc => {
                              const cover = references.find(r => r.sceneId === sc.id && r.url)
                                         || storyboard.find(f => f.sceneId === sc.id && f.image);
                              const badge = sceneBadge(sc);
                              return (
                                <div key={sc.id} onClick={() => setActiveSceneId(sc.id)}
                                     className={`cf-row flex items-center gap-2 px-2.5 ${activeSceneId === sc.id ? 'cf-row-on' : ''}`}
                                     style={{ minHeight: 34, paddingTop: 6, paddingBottom: 6 }}>
                                  <span style={{ fontFamily: 'var(--font-mono)', fontSize: 11, width: 34, flexShrink: 0, color: activeSceneId === sc.id ? 'var(--accent)' : 'var(--muted)' }}>#{sc.number}</span>
                                  {cover && <img src={cover.url || cover.image} className="shrink-0 rounded" style={{ width: 40, height: 26, objectFit: 'cover' }} draggable="false" />}
                                  <span className="flex-1 min-w-0 truncate" title={sc.title}
                                        style={{ fontSize: 12.5, color: activeSceneId === sc.id ? 'var(--text)' : 'var(--text-2)' }}>{sc.title || 'Без названия'}</span>
                                  {badge && <span className="shrink-0" style={{ fontFamily: 'var(--font-mono)', fontSize: 8.5, color: 'var(--muted-2)', border: '1px solid var(--line)', borderRadius: 4, padding: '1px 4px' }}>{badge}</span>}
                                </div>
                              );
                            })}
                            <div className="p-2.5">
                              {/* Номер в название НЕ вписываем: он живёт в поле number
                                  и виден чипом рядом. Две копии одного номера расходились. */}
                              <button onClick={() => { const num = nextSceneNumber(); const newS = { id: `sc-${Date.now()}`, number: num, title: 'НОВАЯ СЦЕНА', content: '', x: (150 - canvasOffset.x) / zoom, y: (150 - canvasOffset.y) / zoom, date: '', gear: {}, lightGear: {}, lightSchemeId: null }; setScenes([...scenes, newS]); syncDoc('scenes', newS.id, newS); setActiveSceneId(newS.id); }}
                                      className="cf-edit-only w-full text-center rounded-lg"
                                      style={{ border: '1px dashed var(--border)', color: 'var(--muted-2)', fontSize: 11.5, minHeight: 32 }}>+ сцена</button>
                            </div>
                          </div>
                        </aside>
                      ) : (
                        <div className="cf-strip shrink-0" onClick={() => setSceneListOpen(true)} title="Развернуть список сцен">
                          <span style={{ writingMode: 'horizontal-tb', border: '1px solid var(--border)', borderRadius: 6, width: 22, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12 }}>›</span>
                          <span>Сцены · {scenes.length}</span>
                        </div>
                      );

                      if (!s) {
                        return (
                          <React.Fragment>
                            {sceneList}
                            <main className="flex-1 min-w-0 flex items-center justify-center p-8 text-center">
                              <p style={{ fontSize: 13, color: 'var(--muted-2)', lineHeight: 1.7 }}>
                                Сцен пока нет.<br />Заведите первую кнопкой «+ сцена» слева — или загрузите сценарий целиком через «···» → «Агент КПП».
                              </p>
                            </main>
                          </React.Fragment>
                        );
                      }

                      // ---------- ШАПКА СЦЕНЫ ----------
                      const sceneHead = (
                        <React.Fragment>
                          <div className="flex items-baseline gap-2.5 flex-wrap">
                            <label className="flex items-baseline gap-1 shrink-0" title="Номер сцены — можно поменять. Подойдёт и «12А», и «5-2»">
                              <span style={{ fontFamily: 'var(--font-mono)', fontSize: 13, color: 'var(--accent)', fontWeight: 500 }}>СЦ</span>
                              <input type="text" value={s.number || ''} onChange={(e) => updateSceneNumber(s.id, e.target.value)}
                                     placeholder="—" inputMode="text" maxLength="12"
                                     className="bg-transparent focus:outline-none"
                                     style={{ fontFamily: 'var(--font-mono)', fontSize: 13, fontWeight: 500, color: 'var(--accent)', width: 46 }} />
                            </label>
                            {duplicateNumbers[String(s.number || '').trim()] && (
                              <span className="cf-chip shrink-0" style={{ color: 'var(--warn)', borderColor: 'var(--warn)' }}>номер занят</span>
                            )}
                            {/* Дата и «···» стоят СЛЕВА, у номера, а не у правого
                                края: правая панель разворачивается поверх
                                содержимого, и всё, что прижато вправо,
                                оказывалось под ней. */}
                            <input type="date" value={s.date || ''} onChange={(e) => updateScene(s.id, 'date', e.target.value)}
                                   className="bg-transparent focus:outline-none shrink-0 cf-meta" style={{ colorScheme: 'dark' }} />
                            <div className="relative shrink-0" ref={sceneMenuRef} style={{ marginLeft: 2 }}>
                              <button onClick={() => setSceneMenu(v => !v)} title="Собрать на доске, PDF, удалить"
                                      className="flex items-center justify-center transition-colors hover:bg-white/5"
                                      style={{ width: 26, height: 22, border: '1px solid var(--border)', borderRadius: 6, color: 'var(--muted-2)', fontSize: 13, letterSpacing: 1 }}>···</button>
                              {sceneMenu && (
                                <div className="cf-menu cf-menu-left">
                                  <button className="cf-edit-only" onClick={() => { setSceneMenu(false); setSceneToBoard(s.id); }}><Icons.Board /> Собрать на доске</button>
                                  <button onClick={() => { setSceneMenu(false); setPrintScene(s.id); requestPrint('scene'); }}><Icons.Print /> Экспорт сцены в PDF</button>
                                  <hr className="cf-edit-only" />
                                  <button className="cf-edit-only" onClick={() => { setSceneMenu(false); setConfirmAction({ title: 'Удалить сцену?', message: 'Сцена исчезнет, а её кадры и референсы отвяжутся — из проекта они не пропадут.', onConfirm: () => deleteScene(s.id) }); }}
                                          style={{ color: 'var(--danger)' }}><Icons.Trash /> Удалить сцену</button>
                                </div>
                              )}
                            </div>
                          </div>
                          <div className="flex items-center gap-2.5 flex-wrap" style={{ marginTop: 2, marginBottom: 14 }}>
                            <input type="text" value={s.title} onChange={(e) => updateSceneTitle(s.id, e.target.value)}
                                   className="bg-transparent focus:outline-none min-w-0"
                                   style={{ fontSize: 24, fontWeight: 700, letterSpacing: '-.02em', color: 'var(--text)', flex: '1 1 240px' }}
                                   placeholder="Название сцены" />
                            {sceneBadge(s) && <span className="cf-chip shrink-0">{sceneBadge(s)}</span>}
                            <span className="cf-chip shrink-0">{frames.length} кадр.</span>
                          </div>
                        </React.Fragment>
                      );

                      // ---------- РЕЖИМ «ПРЕЗЕНТАЦИЯ» ----------
                      // Ни одной панели: экран показывают режиссёру, и всё,
                      // что не сцена, здесь мешает.
                      if (lookbook) {
                        return (
                          <main className="flex-1 min-w-0 overflow-y-auto" style={{ padding: '28px 34px 44px' }}>
                            <div style={{ maxWidth: 960, margin: '0 auto' }}>
                              <div style={{ fontFamily: 'var(--font-mono)', fontSize: 12, color: 'var(--accent)', letterSpacing: '.12em' }}>СЦЕНА {s.number}</div>
                              <h1 style={{ fontSize: 34, margin: '6px 0 0' }}>{s.title || 'Без названия'}</h1>
                              {(s.content || '').trim() && (
                                <p style={{ fontSize: 16, lineHeight: 1.6, color: 'var(--text-2)', maxWidth: 640, margin: '14px 0 0', whiteSpace: 'pre-line' }}>{s.content}</p>
                              )}
                              {frames.filter(f => f.image).map((f, i) => (
                                <img key={f.id} src={f.image} draggable="false"
                                     style={{ width: '100%', aspectRatio: SHOT_RATIO, objectFit: 'cover', borderRadius: 12, display: 'block', marginTop: i === 0 ? 22 : 14 }} />
                              ))}
                              {sceneRefs.length > 0 && frames.filter(f => f.image).length === 0 && (
                                <div className="grid gap-3.5" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(min(280px, 100%), 1fr))', marginTop: 22 }}>
                                  {sceneRefs.map(r => <img key={r.id} src={r.url} draggable="false" style={{ width: '100%', borderRadius: 10, display: 'block' }} />)}
                                </div>
                              )}
                              <div className="cf-meta" style={{ marginTop: 18 }}>
                                {frames.length} кадр. · {sceneRefs.length} референс. {loc ? '· ' + loc.name : ''} {s.date ? '· ' + formatDateDisplay(s.date) : ''}
                              </div>
                            </div>
                          </main>
                        );
                      }

                      // ---------- РЕЖИМ «СКАУТИНГ» ----------
                      // На выезде вперёд выходит место: фотографии точек,
                      // солнце прямо сейчас и заметки. Замысел и раскадровка
                      // подождут до стола.
                      const scoutMain = (
                        <main className="flex-1 min-w-0 overflow-y-auto" style={{ padding: '16px 18px 36px' }}>
                          <div className="flex items-baseline gap-2.5 flex-wrap">
                            <span style={{ fontFamily: 'var(--font-mono)', fontSize: 13, color: 'var(--accent)', fontWeight: 500 }}>СЦ {s.number} · СКАУТИНГ</span>
                            <span style={{ fontSize: 12, color: 'var(--muted)' }}>
                              {loc ? loc.name : 'объект не привязан'}{s.date ? ' · ' + formatDateDisplay(s.date) : ''}
                            </span>
                          </div>
                          <div className="flex gap-2.5 mt-3 overflow-x-auto pb-1.5">
                            {locPhotos.map(r => (
                              <div key={r.id} onClick={() => setLightboxData({ scope: locPhotos.map(x => x.id), scopeLabel: loc ? loc.name : 'Объект', currentId: r.id })}
                                   className="relative shrink-0 cursor-pointer"
                                   style={{ width: 340, borderRadius: 10, overflow: 'hidden', border: '1px solid var(--border)' }}>
                                <img src={r.url} style={{ width: '100%', height: 200, objectFit: 'cover', display: 'block' }} draggable="false" />
                                {r.label && <span className="cf-overlay absolute" style={{ left: 6, bottom: 6 }}>{r.label}</span>}
                              </div>
                            ))}
                            {loc ? (
                              <PhotoSourcePicker onFiles={(fs) => handleMultiFileUpload(fs, null, null, loc.id)}
                                     hint="камера · плёнка · файлы"
                                     className="cf-edit-only shrink-0 flex flex-col items-center justify-center gap-1.5"
                                     style={{ width: 180, height: 200, border: '1px dashed var(--border)', borderRadius: 10, color: 'var(--muted-2)', boxSizing: 'border-box' }}>
                                <span style={{ fontSize: 22, lineHeight: 1 }}>+</span>
                                <span style={{ fontSize: 12 }}>фото с точки</span>
                              </PhotoSourcePicker>
                            ) : (
                              <div className="shrink-0 flex items-center justify-center text-center px-4"
                                   style={{ width: 260, height: 200, border: '1px dashed var(--border)', borderRadius: 10, color: 'var(--muted-2)', fontSize: 11.5, lineHeight: 1.6, boxSizing: 'border-box' }}>
                                Привяжите сцену к объекту — и сюда лягут фотографии со скаутинга.
                              </div>
                            )}
                          </div>
                          <div className="grid gap-3.5 mt-3.5 items-start" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(min(300px, 100%), 1fr))' }}>
                            <div style={{ ...cardBox, padding: '14px 16px' }}>
                              <div className="flex items-center gap-2">
                                <span style={eyebrow}>Солнце сейчас</span>
                                <span className="ml-auto cf-meta" style={{ color: 'var(--warn)' }}>{hhmm(new Date())}</span>
                              </div>
                              {!locCoords ? (
                                <p style={{ fontSize: 12.5, color: 'var(--muted-2)', marginTop: 10, lineHeight: 1.6 }}>
                                  Впишите координаты объекта — компас покажет, откуда светит прямо сейчас.
                                </p>
                              ) : (() => {
                                const now = new Date();
                                const p = sunPosition(locCoords.lat, locCoords.lon, now);
                                const t = sunTimes(locCoords.lat, locCoords.lon, now.toISOString().slice(0, 10));
                                // Азимут отсчитан от севера по часовой; на компасе
                                // север сверху, поэтому угол в экранные координаты
                                // переводим как sin/-cos.
                                const rad = p.az * Math.PI / 180;
                                const R = 40;
                                const sx = 60 + R * Math.sin(rad), sy = 60 - R * Math.cos(rad);
                                return (
                                  <div className="flex gap-3.5 items-center mt-2.5">
                                    <svg width="110" height="110" viewBox="0 0 120 120" className="shrink-0">
                                      <circle cx="60" cy="60" r="52" fill="none" stroke="var(--border)" strokeWidth="1" />
                                      <text x="60" y="16" textAnchor="middle" fontFamily="var(--font-mono)" fontSize="9" fill="var(--muted)">С</text>
                                      <text x="60" y="112" textAnchor="middle" fontFamily="var(--font-mono)" fontSize="9" fill="var(--muted-2)">Ю</text>
                                      <text x="10" y="63" textAnchor="middle" fontFamily="var(--font-mono)" fontSize="9" fill="var(--muted-2)">З</text>
                                      <text x="110" y="63" textAnchor="middle" fontFamily="var(--font-mono)" fontSize="9" fill="var(--muted-2)">В</text>
                                      {p.alt > 0 && <path d={`M60 60 L${sx.toFixed(1)} ${sy.toFixed(1)}`} stroke="var(--warn)" strokeWidth="2" />}
                                      {p.alt > 0 && <circle cx={sx.toFixed(1)} cy={sy.toFixed(1)} r="5" fill="var(--warn)" />}
                                      <circle cx="60" cy="60" r="3" fill="var(--accent)" />
                                    </svg>
                                    <div style={{ fontSize: 12.5, lineHeight: 1.55, color: 'var(--text-2)' }}>
                                      {sunWords(p)}
                                      {t && t.sun.rise && <React.Fragment><br />Закат <b style={{ fontFamily: 'var(--font-mono)' }}>{hhmm(t.sun.set)}</b>, золотой час с <b style={{ fontFamily: 'var(--font-mono)' }}>{hhmm(t.golden.set)}</b>.</React.Fragment>}
                                    </div>
                                  </div>
                                );
                              })()}
                            </div>
                            <div style={{ ...cardBox, padding: '14px 16px' }}>
                              <div className="flex items-center gap-2">
                                <span style={eyebrow}>Заметки с выезда</span>
                                <button onClick={addSceneNote} className="cf-edit-only ml-auto" style={linkish}>+ заметка</button>
                              </div>
                              {sceneNotes.length === 0
                                ? <p style={{ fontSize: 12.5, color: 'var(--muted-2)', marginTop: 10 }}>Пока пусто. Что заметили на месте — пишите сюда, заметка ляжет и на доску сцены.</p>
                                : sceneNotes.map((st, i) => (
                                    <textarea key={st.id} value={st.text}
                                              onChange={(e) => { const up = stickies.map(x => x.id === st.id ? { ...x, text: e.target.value } : x); setStickies(up); syncDoc('stickies', st.id, up.find(x => x.id === st.id)); }}
                                              className="w-full bg-transparent focus:outline-none resize-none"
                                              style={{ fontSize: 12.5, lineHeight: 1.55, color: 'var(--text-2)', marginTop: 8, paddingTop: i ? 8 : 0, borderTop: i ? '1px solid var(--line)' : 'none', minHeight: 44 }}
                                              placeholder="Текст заметки…" />
                                  ))}
                            </div>
                          </div>
                          {linkChips}
                        </main>
                      );

                      // ---------- РЕЖИМ «СЪЁМКА» ----------
                      // Съёмочный день: список кадров чек-листом, крупные
                      // кнопки под палец, сверху — сколько снято и сколько
                      // осталось света. Ничего, что нельзя нажать в перчатке.
                      const shotDone = frames.filter(f => f.shot).length;
                      const shootMain = (
                        <main className="flex-1 min-w-0 overflow-y-auto" style={{ padding: '16px 18px 36px' }}>
                          <div className="flex items-baseline gap-2.5 flex-wrap">
                            <span style={{ fontFamily: 'var(--font-mono)', fontSize: 13, color: 'var(--accent)', fontWeight: 500 }}>СЦ {s.number} · СМЕНА</span>
                            <span style={{ fontSize: 12, color: 'var(--muted)' }}>снято {shotDone} из {frames.length}</span>
                            {locCoords && s.date && (() => {
                              const t = sunTimes(locCoords.lat, locCoords.lon, s.date);
                              if (!t || !t.sun.set) return null;
                              return <span className="ml-auto cf-meta" style={{ color: 'var(--warn)' }}>окно света до {hhmm(t.sun.set)}</span>;
                            })()}
                          </div>
                          <div className="grid gap-2 mt-3">
                            {frames.length === 0 && (
                              <p style={{ fontSize: 12.5, color: 'var(--muted-2)', lineHeight: 1.7 }}>
                                В сцене нет кадров. Заведите их в режиме «Творческий» — здесь они станут чек-листом смены.
                              </p>
                            )}
                            {frames.map(f => (
                              <div key={f.id} className="flex items-center gap-3"
                                   style={{ ...cardBox, padding: 10, borderLeft: `3px solid ${f.shot ? 'var(--ok)' : 'var(--border)'}` }}>
                                <div className="shrink-0" style={{ width: 150, opacity: f.shot ? .55 : 1 }}>{frameThumb(f)}</div>
                                <div className="flex-1 min-w-0">
                                  <span style={{ fontFamily: 'var(--font-mono)', fontSize: 13, fontWeight: 600, color: f.shot ? 'var(--ok)' : 'var(--text)' }}>{f.frameNum}{f.shot ? ' ✓' : ''}</span>
                                  <div style={{ fontSize: 13.5, marginTop: 3, color: f.shot ? 'var(--muted)' : 'var(--text)', textDecoration: f.shot ? 'line-through' : 'none' }}>
                                    {f.description || 'без описания'}
                                  </div>
                                </div>
                                {/* 44 точки — минимальная цель, в которую
                                    попадают пальцем не глядя. На площадке
                                    смотрят не на планшет, а на площадку. */}
                                <button onClick={() => patchFrame(f.id, { shot: !f.shot })}
                                        title={f.shot ? 'Снято — снять отметку' : 'Отметить снятым'}
                                        className="cf-edit-only shrink-0 flex items-center justify-center"
                                        style={{ width: 44, height: 44, borderRadius: 10, fontSize: 18, fontWeight: 700,
                                                 background: f.shot ? 'var(--ok)' : 'transparent', color: f.shot ? 'var(--bg)' : 'var(--muted-2)',
                                                 border: f.shot ? 'none' : '2px solid var(--border)' }}>✓</button>
                              </div>
                            ))}
                          </div>
                          {Object.keys(s.lightGear || {}).length > 0 && (
                            <div className="mt-4" style={{ ...cardBox, padding: '12px 14px' }}>
                              <span style={eyebrow}>Свет на сцене</span>
                              <div style={{ fontSize: 12.5, color: 'var(--text-2)', marginTop: 6 }}>{gearLine(s.lightGear, lightGearTypes)}</div>
                            </div>
                          )}
                          {linkChips}
                        </main>
                      );

                      // ---------- РЕЖИМ «ТВОРЧЕСКИЙ» ----------
                      // В центре — ТЕКСТ СЦЕНЫ. Экспликация и замысел уехали
                      // в правую панель: за столом сначала читают сцену,
                      // а уже потом разбирают её. Референсы стоят рядом,
                      // и «развернуть все» раскрывает их НА МЕСТЕ — вдоль
                      // текста в одну колонку и под текстом в две.
                      const creativeMain = (
                        <main className="flex-1 min-w-0 overflow-y-auto" style={{ padding: '16px 18px 36px' }}>
                          {sceneHead}
                          <div style={{ display: refsExpanded ? 'block' : 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(min(300px, 100%), 1fr))', gap: 16, alignItems: 'start', overflow: 'hidden' }}>
                            <div style={{ float: refsExpanded ? 'left' : 'none', width: refsExpanded ? 'min(46%, 560px)' : 'auto',
                                          margin: refsExpanded ? '0 16px 4px 0' : 0, boxSizing: 'border-box', ...cardBox, padding: '14px 16px' }}>
                              <div className="flex items-baseline gap-2">
                                <span style={eyebrow}>Текст сцены</span>
                                <span className="ml-auto cf-meta">{(s.script || '').trim() ? `${(s.script || '').trim().split(/\s+/).length} слов` : 'пусто'}</span>
                              </div>
                              {/* Тянется за нижний правый угол и крупнее, чем
                                  было: сценарий читают глазами, а не проверяют
                                  по диагонали. Моноширинный шрифт здесь убран
                                  намеренно — он делает длинный текст тяжелее. */}
                              <textarea value={s.script || ''} onChange={(e) => updateScene(s.id, 'script', e.target.value)}
                                        className="w-full bg-transparent focus:outline-none"
                                        style={{ fontSize: 14.5, lineHeight: 1.7, color: '#e3e0d7', marginTop: 10, resize: 'vertical', minHeight: 150, maxHeight: '70vh', border: 'none', padding: 0 }}
                                        placeholder="Текст сцены из сценария. Можно вставить вручную или загрузить весь сценарий разом — «···» → «Агент КПП»." />
                            </div>
                            <div>
                              <div className="flex items-baseline gap-2">
                                <span style={eyebrow}>Референсы · {sceneRefs.length}</span>
                                {sceneRefs.length > 0 && (
                                  <button onClick={() => setRefsExpanded(v => !v)} className="ml-auto" style={linkish}>
                                    {refsExpanded ? 'свернуть ⤡' : 'развернуть все ⤢'}
                                  </button>
                                )}
                              </div>
                              {!refsExpanded ? (
                                <div className="flex gap-2 mt-2 overflow-x-auto pb-1">
                                  {sceneRefs.map(r => (
                                    <div key={r.id} onClick={() => setLightboxData({ sceneId: s.id, scopeLabel: `Сцена #${s.number}`, currentId: r.id })}
                                         className="relative shrink-0 cursor-pointer group"
                                         style={{ width: 210, borderRadius: 8, overflow: 'hidden', border: '1px solid var(--border)' }}>
                                      <img src={r.url} style={{ width: '100%', height: 118, objectFit: 'cover', display: 'block' }} draggable="false" />
                                      {r.label && <span className="cf-overlay absolute" style={{ left: 6, bottom: 6 }}>{r.label}</span>}
                                      <button onClick={(e) => { e.stopPropagation(); setItemScene(r.id, 'ref', ''); showToast('Референс отвязан · остался в галерее'); }}
                                              title="Убрать из сцены — картинка останется в галерее"
                                              className="cf-edit-only absolute opacity-0 group-hover:opacity-100 transition-all flex items-center justify-center"
                                              style={{ top: 6, right: 6, width: 24, height: 24, borderRadius: 6, background: 'rgba(26,25,24,.8)', color: 'var(--muted)', fontSize: 11 }}>✕</button>
                                    </div>
                                  ))}
                                  <PhotoSourcePicker onFiles={(fs) => handleMultiFileUpload(fs, s.id)}
                                         className="cf-edit-only shrink-0 flex flex-col items-center justify-center"
                                         style={{ width: 110, height: 118, border: '1px dashed var(--border)', borderRadius: 8, color: 'var(--muted-2)', fontSize: 18, boxSizing: 'border-box' }}
                                         title="Загрузить картинки в сцену">+
                                  </PhotoSourcePicker>
                                  <button onClick={() => setRefPicker({ mode: 'scene', sceneId: s.id })}
                                          title="Взять картинку из уже загруженных"
                                          className="cf-edit-only shrink-0 flex items-center justify-center text-center px-2"
                                          style={{ width: 110, height: 118, border: '1px dashed var(--border)', borderRadius: 8, color: 'var(--muted-2)', fontSize: 11.5, lineHeight: 1.4, boxSizing: 'border-box' }}>
                                    из галереи
                                  </button>
                                </div>
                              ) : (
                                // Развёрнуто — сетка НА МЕСТЕ, картинки в родных
                                // пропорциях. Ширина в 50% контейнера значит:
                                // рядом с текстом (там свободно ~54%) помещается
                                // одна колонка, под текстом — две. Ровно то,
                                // о чём просили: «вдоль текста в одну, под ним в две».
                                <div className="mt-2">
                                  {sceneRefs.map(r => (
                                    <div key={r.id} onClick={() => setLightboxData({ sceneId: s.id, scopeLabel: `Сцена #${s.number}`, currentId: r.id })}
                                         className="relative cursor-pointer"
                                         style={{ display: 'inline-block', boxSizing: 'border-box', width: 'calc(50% - 8px)', margin: '0 8px 10px 0', verticalAlign: 'top', borderRadius: 8, overflow: 'hidden', border: '1px solid var(--border)' }}>
                                      <img src={r.url} style={{ width: '100%', display: 'block' }} draggable="false" />
                                      {r.label && <span className="cf-overlay absolute" style={{ left: 6, bottom: 6 }}>{r.label}</span>}
                                    </div>
                                  ))}
                                  <button onClick={() => setRefPicker({ mode: 'scene', sceneId: s.id })}
                                          className="cf-edit-only"
                                          style={{ display: 'inline-block', boxSizing: 'border-box', width: 'calc(50% - 8px)', margin: '0 8px 10px 0', verticalAlign: 'top', height: 100, border: '1px dashed var(--border)', borderRadius: 8, color: 'var(--muted-2)', fontSize: 12 }}>
                                    + из галереи
                                  </button>
                                </div>
                              )}
                            </div>
                          </div>

                          {/* РАСКАДРОВКА */}
                          <div className="flex items-center gap-2.5 flex-wrap" style={{ marginTop: 20 }}>
                            <span style={eyebrow}>Раскадровка · {frames.length}</span>
                            {frames.length > 0 && (
                              <button onClick={() => setShotsExpanded(v => !v)} style={linkish}>
                                {shotsExpanded ? 'свернуть ⤡' : 'развернуть все ⤢'}
                              </button>
                            )}
                            <span className="cf-seg">
                              <button onClick={() => setShowImages(true)} className={showImages ? 'on' : ''} title="Кадры карточками">кадры</button>
                              <button onClick={() => setShowImages(false)} className={!showImages ? 'on' : ''} title="Таблица: кадр, оптика, описание">текст</button>
                            </span>
                            <button onClick={addFrame} className="cf-edit-only shrink-0 rounded-lg px-3 font-semibold"
                                    style={{ minHeight: 32, fontSize: 11.5, background: 'var(--accent)', color: 'var(--bg)' }}>+ кадр</button>
                          </div>

                          {showImages ? (
                            <div className={shotsExpanded ? 'grid gap-3.5 mt-2' : 'flex gap-2.5 mt-2 overflow-x-auto pb-1.5'}
                                 style={shotsExpanded ? { gridTemplateColumns: 'repeat(auto-fill, minmax(min(300px, 100%), 1fr))' } : null}>
                              {frames.map(f => (
                                <div key={f.id} className="relative group shrink-0"
                                     style={{ ...cardBox, padding: shotsExpanded ? 10 : 8, width: shotsExpanded ? 'auto' : 218 }}>
                                  <div className="relative" style={{ borderRadius: 7, overflow: 'hidden' }}>
                                    {f.image ? (
                                      <img src={f.image} style={{ width: '100%', aspectRatio: SHOT_RATIO, objectFit: 'cover', display: 'block' }} draggable="false" />
                                    ) : (
                                      <div className="flex" style={{ width: '100%', aspectRatio: SHOT_RATIO, border: '1px dashed var(--border)', borderRadius: 7, boxSizing: 'border-box' }}>
                                        {/* Кадр раскадровки чаще всего рисуют на бумаге —
                                            значит, его СНИМАЮТ. Отсюда тот же выбор
                                            источника, что и у фотографий. */}
                                        <PhotoSourcePicker multiple={false}
                                                onFiles={(fs) => { const file = fs[0]; if (file) { const rd = new FileReader(); rd.onloadend = () => compressImage(rd.result, 600, 450, (c) => patchFrame(f.id, { image: c })); rd.readAsDataURL(file); } }}
                                                className="flex-1 flex flex-col items-center justify-center cf-edit-only" style={{ borderRight: '1px solid var(--line)', color: 'var(--muted-2)' }}>
                                          <Icons.Image /><span style={{ fontSize: 10, marginTop: 2 }}>файл</span>
                                        </PhotoSourcePicker>
                                        <button onClick={() => setDrawingFrameId(f.id)} className="flex-1 flex flex-col items-center justify-center cf-edit-only" style={{ color: 'var(--muted-2)' }}>
                                          <Icons.Pen /><span style={{ fontSize: 10, marginTop: 2 }}>скетч</span>
                                        </button>
                                      </div>
                                    )}
                                    <button onClick={() => dropFrame(f.id)} title="Удалить кадр"
                                            className="cf-edit-only absolute opacity-0 group-hover:opacity-100 transition-all flex items-center justify-center"
                                            style={{ top: 5, right: 5, width: 24, height: 24, borderRadius: 6, background: 'rgba(26,25,24,.8)', color: 'var(--muted)', fontSize: 11 }}>✕</button>
                                  </div>
                                  <div className="flex justify-between gap-2" style={{ marginTop: 7 }}>
                                    <input type="text" value={f.frameNum || ''} onChange={(e) => patchFrame(f.id, { frameNum: e.target.value })}
                                           className="bg-transparent focus:outline-none min-w-0"
                                           style={{ fontFamily: 'var(--font-mono)', fontSize: 11.5, color: 'var(--text)', width: 72 }} />
                                    <input type="text" value={f.lens || ''} onChange={(e) => patchFrame(f.id, { lens: e.target.value })}
                                           placeholder="оптика" className="bg-transparent focus:outline-none text-right min-w-0"
                                           style={{ fontFamily: 'var(--font-mono)', fontSize: 10.5, color: 'var(--muted-2)', flex: 1 }} />
                                  </div>
                                  <input type="text" value={f.description || ''} onChange={(e) => patchFrame(f.id, { description: e.target.value })}
                                         placeholder="Крупность, движение, что в кадре…"
                                         className="w-full bg-transparent focus:outline-none"
                                         style={{ fontSize: 12.5, lineHeight: 1.45, color: 'var(--text-2)', marginTop: 4 }} />
                                </div>
                              ))}
                              <button onClick={addFrame} className="cf-edit-only shrink-0 flex flex-col items-center justify-center gap-1.5"
                                      style={{ border: '1px dashed var(--border)', borderRadius: 10, color: 'var(--muted-2)', minHeight: 150, width: shotsExpanded ? 'auto' : 218, boxSizing: 'border-box' }}>
                                <span style={{ fontSize: 20, lineHeight: 1 }}>+</span><span style={{ fontSize: 11.5 }}>кадр или скетч</span>
                              </button>
                            </div>
                          ) : (
                            // РЕЖИМ «ТЕКСТ». Кадр существует раньше картинки:
                            // сначала его записывают словами, а скетч и фото
                            // появляются потом. Раньше кадр без картинки
                            // выглядел как ошибка загрузки.
                            <div className="mt-2" style={{ border: '1px solid var(--line)', borderRadius: 10, overflow: 'hidden' }}>
                              <div className="grid gap-2.5 px-3 py-2" style={{ gridTemplateColumns: '76px 96px minmax(160px,1fr) 32px', background: 'var(--panel-2)', fontFamily: 'var(--font-mono)', fontSize: 9.5, letterSpacing: '.08em', textTransform: 'uppercase', color: 'var(--muted-2)' }}>
                                <span>Кадр</span><span>Оптика</span><span>Описание</span><span></span>
                              </div>
                              {frames.map(f => (
                                <div key={f.id} className="grid gap-2.5 items-center px-3 py-2" style={{ gridTemplateColumns: '76px 96px minmax(160px,1fr) 32px', borderTop: '1px solid var(--line)' }}>
                                  <input type="text" value={f.frameNum || ''} onChange={(e) => patchFrame(f.id, { frameNum: e.target.value })}
                                         className="bg-transparent focus:outline-none min-w-0" style={{ fontFamily: 'var(--font-mono)', fontSize: 11.5, color: 'var(--text)' }} />
                                  <input type="text" value={f.lens || ''} onChange={(e) => patchFrame(f.id, { lens: e.target.value })}
                                         placeholder="—" className="bg-transparent focus:outline-none min-w-0" style={{ fontFamily: 'var(--font-mono)', fontSize: 10.5, color: 'var(--muted-2)' }} />
                                  <input type="text" value={f.description || ''} onChange={(e) => patchFrame(f.id, { description: e.target.value })}
                                         placeholder="Что в кадре" className="bg-transparent focus:outline-none min-w-0" style={{ fontSize: 12.5, color: 'var(--text-2)' }} />
                                  <button onClick={() => dropFrame(f.id)} title="Удалить кадр"
                                          className="cf-edit-only flex items-center justify-center" style={{ width: 32, height: 32, borderRadius: 6, color: 'var(--muted-2)', fontSize: 11 }}>✕</button>
                                </div>
                              ))}
                              <button onClick={addFrame} className="cf-edit-only w-full text-left px-3 py-2.5"
                                      style={{ borderTop: '1px dashed var(--line)', fontSize: 11.5, color: 'var(--muted-2)' }}>
                                + кадр текстом — без картинки, картинка появится позже
                              </button>
                            </div>
                          )}

                          {/* ЗАМЕТКИ И ДОКУМЕНТЫ СЦЕНЫ */}
                          {sceneDocs.length > 0 && (
                            <div style={{ marginTop: 20 }}>
                              <span style={eyebrow}>Документы сцены</span>
                              <div className="grid gap-2 mt-2" style={{ gridTemplateColumns: 'repeat(auto-fill, minmax(min(240px, 100%), 1fr))' }}>
                                {sceneDocs.map(d => (
                                  <div key={d.id} className="flex items-start gap-2.5 group" style={{ ...cardBox, padding: '10px 12px' }}>
                                    <span className="shrink-0" style={{ color: 'var(--muted-2)', marginTop: 2 }}><Icons.Docs /></span>
                                    <div className="min-w-0 flex-1">
                                      <div className="truncate" style={{ fontSize: 12.5, fontWeight: 600, color: 'var(--text)' }}>{d.title || 'Без названия'}</div>
                                      <div className="truncate" style={{ fontSize: 11, color: 'var(--muted-2)' }}>{(d.content || '').trim() || 'пусто'}</div>
                                    </div>
                                    <button onClick={() => { setActiveDocId(d.id); setActiveSchemeId(null); setCurrentView('docs'); }} className="cf-chip shrink-0">Открыть</button>
                                  </div>
                                ))}
                              </div>
                            </div>
                          )}
                          <div style={{ marginTop: 20 }}>
                            <div className="flex items-center gap-2.5">
                              <span style={eyebrow}>Заметки сцены</span>
                              <button onClick={addSceneNote} className="cf-edit-only" style={linkish}>+ заметка</button>
                            </div>
                            {sceneNotes.length === 0 ? (
                              <p style={{ fontSize: 11.5, color: 'var(--muted-2)', marginTop: 6, lineHeight: 1.6 }}>
                                Пока пусто. Заметку можно завести здесь или на доске — потяните за кружок сбоку заметки к карточке сцены.
                              </p>
                            ) : (
                              <div className="grid gap-2.5 mt-2" style={{ gridTemplateColumns: 'repeat(auto-fill, minmax(min(220px, 100%), 1fr))' }}>
                                {sceneNotes.map(st => (
                                  <div key={st.id} className="rounded-lg p-3 relative group" style={{ backgroundColor: st.color || '#fef08a', color: '#1a1918' }}>
                                    <button onClick={() => { setItemScene(st.id, 'sticky', ''); showToast('Заметка отвязана · осталась на доске'); }}
                                            title="Убрать из сцены — заметка останется на доске"
                                            className="cf-edit-only absolute flex items-center justify-center rounded-full opacity-0 group-hover:opacity-100 transition-all"
                                            style={{ top: 6, right: 6, width: 22, height: 22, color: 'rgba(0,0,0,.5)', fontSize: 11 }}>✕</button>
                                    <textarea value={st.text} onChange={(e) => { const up = stickies.map(x => x.id === st.id ? { ...x, text: e.target.value } : x); setStickies(up); syncDoc('stickies', st.id, up.find(x => x.id === st.id)); }}
                                              className="w-full bg-transparent border-none focus:outline-none resize-none font-bold leading-tight pr-5"
                                              style={{ fontSize: 13, minHeight: 72 }} placeholder="Текст заметки…" />
                                    <div className="flex gap-1 mt-1">
                                      {STICKY_COLORS.map(c => (
                                        <button key={c} onClick={() => paintStickies(st.id, c)} title="Цвет заметки"
                                                style={{ background: c, width: 14, height: 14 }}
                                                className={`cf-edit-only rounded-full border ${st.color === c ? 'border-black/50' : 'border-black/10 hover:border-black/30'} transition-colors`} />
                                      ))}
                                    </div>
                                  </div>
                                ))}
                              </div>
                            )}
                          </div>
                          {linkChips}
                        </main>
                      );

                      // ---------- ПРАВАЯ ПАНЕЛЬ: ВКЛАДКИ КАК В BLENDER ----------
                      // Полоса иконок шириной 40 точек всегда на месте,
                      // активная вкладка разворачивает панель ПОВЕРХ середины.
                      // Поверх, а не рядом: если панель сжимает содержимое,
                      // текст сцены переливается каждый раз, когда заглянул
                      // в технику, и читать его заново.
                      const PANEL_TABS = [
                        { id: 'expl',  title: 'Экспликация и замысел', icon: <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 20h9" /><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" /></svg> },
                        { id: 'gear',  title: 'Камера и техника',      icon: <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z" /><circle cx="12" cy="13" r="3" /></svg> },
                        { id: 'light', title: 'Свет',                  icon: <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 18h6" /><path d="M10 22h4" /><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5.76.76 1.23 1.52 1.41 2.5" /></svg> },
                        { id: 'sun',   title: 'Объект и солнце',       icon: <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" /></svg> }
                      ];
                      const panelTitle = (PANEL_TABS.find(t => t.id === scenePanel) || {}).title || '';

                      return (
                        <React.Fragment>
                          {sceneList}
                          {sceneMode === 'scout' ? scoutMain : sceneMode === 'shoot' ? shootMain : creativeMain}

                          <div className="flex flex-col items-center shrink-0 gap-1.5"
                               style={{ order: 2, width: 40, background: 'var(--panel-2)', borderLeft: '1px solid var(--border)', padding: '10px 0' }}>
                            {PANEL_TABS.map(t => (
                              <button key={t.id} onClick={() => setScenePanel(scenePanel === t.id ? null : t.id)} title={t.title}
                                      className="flex items-center justify-center transition-colors"
                                      style={{ width: 34, height: 34, borderRadius: 8,
                                               background: scenePanel === t.id ? 'var(--raised)' : 'transparent',
                                               color: scenePanel === t.id ? 'var(--accent)' : 'var(--muted)' }}>{t.icon}</button>
                            ))}
                          </div>

                          {scenePanel && (
                            <aside className="overflow-y-auto shrink-0"
                                   style={panelSideBySide
                                     ? { order: 1, width: 300, background: 'var(--panel-2)', borderLeft: '1px solid var(--border)' }
                                     : { position: 'absolute', top: 0, right: 40, bottom: 0, width: 300, zIndex: 30,
                                         background: 'var(--panel-2)', borderLeft: '1px solid var(--border)', boxShadow: '-16px 0 36px rgba(0,0,0,.4)' }}>
                              <div className="flex items-center gap-2 px-4 pt-3 pb-1">
                                <span style={{ ...eyebrow, color: 'var(--text)' }}>{panelTitle}</span>
                                <button onClick={() => setScenePanel(null)} title="Свернуть панель"
                                        className="ml-auto flex items-center justify-center"
                                        style={{ width: 22, height: 22, border: '1px solid var(--border)', borderRadius: 6, color: 'var(--muted-2)', fontSize: 11 }}>✕</button>
                              </div>

                              {scenePanel === 'expl' && (
                                <div className="px-4 pb-4 pt-1">
                                  {/* Экспликация и визуальный замысел — одно и то же
                                      поле: разделять их значило заставлять человека
                                      решать, в какую из двух коробок положить мысль. */}
                                  <textarea value={s.content || ''} onChange={(e) => updateScene(s.id, 'content', e.target.value)}
                                            className="w-full glass-input rounded-lg p-3"
                                            style={{ fontSize: 12.5, lineHeight: 1.6, minHeight: 180, resize: 'vertical' }}
                                            placeholder="Настроение, контраст, характер камеры, точка зрения — как эта сцена должна выглядеть." />
                                  <button onClick={() => enhanceSceneWithAI(s.id, s.content, s.title, s.script)} disabled={isAILoading}
                                          className="cf-edit-only mt-2 flex items-center gap-1.5 rounded-lg px-3 font-semibold"
                                          style={{ minHeight: 32, fontSize: 11.5, background: 'var(--raised)', color: 'var(--text-2)' }}>
                                    <Icons.Bot /> {isAILoading ? 'Думаю…' : 'Расширить с ИИ'}
                                  </button>
                                  <p className="cf-meta mt-3" style={{ lineHeight: 1.6 }}>
                                    Текст сцены из сценария лежит в середине экрана и идёт в ИИ контекстом.
                                  </p>
                                </div>
                              )}

                              {scenePanel === 'gear' && gearPanel(s, false)}
                              {scenePanel === 'light' && (
                                <div>
                                  {gearPanel(s, true)}
                                  <div className="px-4 pb-4">
                                    <span style={eyebrow}>Схема света</span>
                                    <div className="flex gap-2 mt-2">
                                      <select value={s.lightSchemeId || ''} onChange={(e) => updateScene(s.id, 'lightSchemeId', e.target.value)}
                                              className="glass-input rounded-lg px-2.5 text-xs flex-1 min-w-0" style={{ minHeight: 32, background: 'var(--bg)' }}>
                                        <option value="">— не выбрана —</option>
                                        {lightSchemes.map(sch => (<option key={sch.id} value={sch.id}>{sch.title}</option>))}
