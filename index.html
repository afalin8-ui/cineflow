              // Вынос кладём трижды: по входу, по биссектрисе и по выходу.
              // На изломе это скругляет угол снаружи, а самопересечение
              // внутри съедает заливка по правилу nonzero — поэтому шов
              // не расходится даже на резком развороте.
              add(pts[i], a[0], a[1], rad[i]);
              if (a !== b) {
                const bx = a[0] + b[0], by = a[1] + b[1], bl = Math.hypot(bx, by);
                if (bl > 1e-6) add(pts[i], bx / bl, by / bl, rad[i]);
                add(pts[i], b[0], b[1], rad[i]);
              }
            }
            if (!L.length || !first || !last) return circle(pts[0][0], pts[0][1], Math.max(0.6, rad[0]));

            // Круглые концы: полукруг от левого выноса к правому через
            // направление движения (в начале — через обратное).
            const cap = (c, r, d, back) => {
              const base = Math.atan2(d[0], -d[1]) - (back ? Math.PI : 0);
              const out = [];
              for (let k = 1; k < 9; k++) out.push([c[0] + Math.cos(base - Math.PI * k / 9) * r, c[1] + Math.sin(base - Math.PI * k / 9) * r]);
              return out;
            };
            return L
              .concat(cap(pts[n - 1], rad[n - 1], last, false))
              .concat(Rt.slice().reverse())
              .concat(cap(pts[0], rad[0], first, true));
          };

          // Геометрию описываем СПИСКОМ КОМАНД, а не сразу Path2D: тот же
          // список уходит и в холст, и в SVG при выгрузке. Держать две копии
          // всей геометрии нельзя — они разъедутся при первой же правке.
          const cmdsPath = (cmds) => {
            const p = new Path2D();
            for (const c of cmds) {
              if (c[0] === 'M') p.moveTo(c[1], c[2]);
              else if (c[0] === 'L') p.lineTo(c[1], c[2]);
              else if (c[0] === 'Q') p.quadraticCurveTo(c[1], c[2], c[3], c[4]);
              else if (c[0] === 'A') p.arcTo(c[1], c[2], c[3], c[4], c[5]);
              else if (c[0] === 'E') p.ellipse(c[1], c[2], c[3], c[4], 0, 0, Math.PI * 2);
              else if (c[0] === 'Z') p.closePath();
            }
            return p;
          };
          const rn = (v) => Math.round(v * 10) / 10;
          const cmdsD = (cmds) => cmds.map(c => {
            if (c[0] === 'M') return `M${rn(c[1])} ${rn(c[2])}`;
            if (c[0] === 'L') return `L${rn(c[1])} ${rn(c[2])}`;
            if (c[0] === 'Q') return `Q${rn(c[1])} ${rn(c[2])} ${rn(c[3])} ${rn(c[4])}`;
            // Скругление угла в SVG выражаем дугой того же радиуса
            if (c[0] === 'A') return `L${rn(c[1])} ${rn(c[2])}`;
            if (c[0] === 'E') return `M${rn(c[1] - c[3])} ${rn(c[2])}a${rn(c[3])} ${rn(c[4])} 0 1 0 ${rn(c[3] * 2)} 0a${rn(c[3])} ${rn(c[4])} 0 1 0 ${rn(-c[3] * 2)} 0`;
            return 'Z';
          }).join('');

          // Полигон обводим квадратичными кривыми через середины сторон:
          // углы полигона исчезают, остаётся гладкий контур.
          const inkCmds = (pl) => {
            const m = pl.length;
            if (m < 3) return [];
            const out = [];
            let a = pl[m - 1], b = pl[0];
            out.push(['M', (a[0] + b[0]) / 2, (a[1] + b[1]) / 2]);
            for (let i = 0; i < m; i++) {
              a = pl[i]; b = pl[(i + 1) % m];
              out.push(['Q', a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2]);
            }
            out.push(['Z']);
            return out;
          };

          // Точки лежат ПЛОСКИМ списком чисел: Firestore не умеет вложенные
          // массивы. Разворачиваем один раз и держим при штрихе — вместе
          // с готовой фигурой и габаритом. Фигура не зависит от масштаба,
          // поэтому переживает и панораму, и зум.
          const strokePts = (s) => {
            if (!s._pts) {
              const a = [];
              for (let i = 0; i + 2 < s.p.length; i += 3) a.push([s.p[i], s.p[i + 1], s.p[i + 2]]);
              s._pts = a;
            }
            return s._pts;
          };
          const strokeCmds = (s) => {
            if (!s._cmds) s._cmds = inkCmds(inkOutline(strokePts(s), s.w * brushWidthK(s.t), brushThin(s.t), s.jn));
            return s._cmds;
          };
          const strokePath = (s) => {
            if (!s._path) s._path = cmdsPath(strokeCmds(s));
            return s._path;
          };
          const strokeBox = (s) => {
            if (s._box) return s._box;
            let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
            for (const p of strokePts(s)) {
              if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0];
              if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
            }
            const m = s.w * brushWidthK(s.t) + 4;
            s._box = { x0: x0 - m, y0: y0 - m, x1: x1 + m, y1: y1 + m };
            return s._box;
          };
          const paintStroke = (ctx, s) => {
            ctx.save();
            if (s.t === 'marker') ctx.globalCompositeOperation = 'screen';
            ctx.globalAlpha = brushAlpha(s.t);
            ctx.fillStyle = s.c;
            ctx.fill(strokePath(s));
            ctx.restore();
          };
          // Координаты округляем: на доске 4000×4000 десятой доли точки
          // хватает с запасом, а документ в Firestore ограничен мегабайтом.
          const packStroke = (t, color, size, pts, jn) => {
            const p = [];
            for (const q of pts) p.push(Math.round(q[0] * 10) / 10, Math.round(q[1] * 10) / 10, Math.round(q[2] * 100) / 100);
            const s = { id: `k${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`, t, c: color, w: size, p };
            if (jn) s.jn = jn;
            return s;
          };

          // --- ФИГУРЫ ---
          // Пять примитивов, всё остальное — их настройки. Это осознанный
          // размен из ТЗ: компактный набор + богатая параметризация вместо
          // библиотеки на триста шейпов, из которой всё равно берут пять.
          // Фигура хранится ПЛОСКОЙ записью с короткими именами полей —
          // весь список доски уезжает в облако одной строкой JSON, и каждый
          // лишний символ умножается на число фигур.
          //   k  — вид: rect | ellipse | diamond | arrow | line
          //   x,y,w,h — рамка; у линии и стрелки w,h это СМЕЩЕНИЕ до второго
          //             конца и может быть отрицательным, у остальных нет
          //   sc — цвет обводки, bg — заливки ('transparent' — без неё)
          //   sw — толщина (1|2|4), sd — solid|dashed|dotted
          //   fs — заливка: solid | hachure | cross
          //   rd — скруглять углы, ro — «от руки» (0 ровно, 1 рука, 2 черновик)
          //   op — прозрачность, a1/a2 — наконечники у концов
          //   sd8 — зерно дрожания: одна и та же фигура обязана дрожать
          //         ОДИНАКОВО между перерисовками, иначе она кипит на экране
          const SHAPE_KINDS = ['rect', 'ellipse', 'diamond', 'arrow', 'line', 'text'];
          const SHAPE_COLORS = ['#d97757', '#fbbf24', '#fb7185', '#34d399', '#38bdf8', '#f0eee6'];
          const SHAPE_FILLS = ['transparent', '#d97757', '#fbbf24', '#fb7185', '#34d399', '#38bdf8'];
          const SHAPE_STYLE0 = { sc: '#d97757', bg: 'transparent', sw: 2, sd: 'solid', fs: 'solid', rd: 1, ro: 1, op: 1, a1: 'none', a2: 'arrow', fz: 20 };
          const isLineKind = (k) => k === 'line' || k === 'arrow';
          // Текст — такой же элемент списка, а не отдельная подсистема.
          // Живёт в двух видах: сам по себе (k:'text') и подписью ВНУТРИ
          // фигуры (поле `ct` — id хозяина). Второй не имеет своего
          // положения вовсе: он всегда по центру хозяина и едет с ним.
          const isText = (s) => s.k === 'text';
          const FONT_UI = '-apple-system, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif';
          const textFont = (s) => `${Math.max(8, s.fz || 20)}px ${FONT_UI}`;
          // Перенос по словам с учётом собственных переводов строки.
          // Меряем настоящим шрифтом холста — на глаз ширину не угадать.
          const wrapText = (ctx, text, maxW) => {
            const out = [];
            String(text || '').split('\n').forEach(para => {
              if (!para) { out.push(''); return; }
              let line = '';
              para.split(/(\s+)/).forEach(part => {
                if (!part) return;
                const test = line + part;
                if (line && ctx.measureText(test).width > maxW) { out.push(line.trimEnd()); line = part.trimStart(); }
                else line = test;
              });
              out.push(line.trimEnd());
            });
            return out.length ? out : [''];
          };
          const textLH = (s) => Math.round((s.fz || 20) * 1.3);
          // Рамка всегда с положительными сторонами: у линии концы могут
          // идти справа налево, а габарит нужен всем — и выделению, и отсечению.
          const shapeBox = (s) => {
            // У подписи внутри фигуры своего положения нет вовсе — она
            // всегда по центру хозяина. Отсюда и рамка берётся его.
            if (s.ct) {
              const host = shapesRef.current.find(q => q.id === s.ct);
              if (host) return shapeBox(host);
            }
            // У привязанной стрелки собственные координаты уже ничего не
            // значат — габарит берём по настоящему маршруту, иначе рамка
            // выделения и отсечение врали бы.
            if (isLineKind(s.k) && (s.b1 || s.b2)) {
              const r = arrowRoute(s);
              let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
              r.pts.forEach(p => { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); });
              return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
            }
            return { x: Math.min(s.x, s.x + s.w), y: Math.min(s.y, s.y + s.h),
                     w: Math.abs(s.w), h: Math.abs(s.h) };
          };
          // --- КОННЕКТОРЫ ---
          // Стрелка цепляется концом за ФИГУРУ, а не за точку: при переносе
          // блока линия перестраивается сама, и схему можно перетасовывать,
          // не поправляя руками ни одной связи. Привязка — просто id хозяина
          // в полях `b1`/`b2`; куда именно упереться, считается каждый раз
          // заново от центров, поэтому хранить нечего.
          const shapeCenter = (s) => { const b = shapeBox(s); return { x: b.x + b.w / 2, y: b.y + b.h / 2 }; };
          // Точка на границе фигуры по лучу из её центра. У каждого вида
          // своя формула — иначе стрелка втыкалась бы в пустой угол рамки
          // овала или ромба.
          const edgePoint = (h, tx, ty, gap) => {
            const b = shapeBox(h);
            const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
            let dx = tx - cx, dy = ty - cy;
            const l = Math.hypot(dx, dy);
            if (l < 0.001) return { x: cx, y: cy };
            dx /= l; dy /= l;
            const hw = Math.max(1, b.w / 2), hh = Math.max(1, b.h / 2);
            let t;
            if (h.k === 'ellipse') t = 1 / Math.hypot(dx / hw, dy / hh);
            else if (h.k === 'diamond') t = 1 / (Math.abs(dx) / hw + Math.abs(dy) / hh);
            else t = Math.min(hw / Math.max(1e-6, Math.abs(dx)), hh / Math.max(1e-6, Math.abs(dy)));
            // Зазор между фигурой и концом линии — мелочь, которая делает
            // схему аккуратной: без него стрелка липнет к самой рамке.
            return { x: cx + dx * (t + (gap === undefined ? 7 : gap)), y: cy + dy * (t + (gap === undefined ? 7 : gap)) };
          };
          const findShape = (id) => id ? shapesRef.current.find(q => q.id === id) : null;
          // Стрелка цепляется не только за фигуру, но и за КАРТОЧКУ — сцену,
          // референс, заметку, документ. Для расчёта края карточка выглядит
          // прямоугольником, и формулы `edgePoint` подходят как есть. Так
          // «связать всё со всем» получается тем же жестом и тем же
          // коннектором, а не второй параллельной механикой связей.
          const cardBind = (id) => {
            const c = cardsRef.current || {};
            const sc = (c.scenes || []).find(x => x.id === id);
            if (sc && sceneOnBoard(sc, activeBoardId)) return { id, k: 'rect', x: sc.x, y: sc.y, w: 288, h: 150 };
            const r = (c.references || []).find(x => x.id === id);
            if (r && r.boardId === activeBoardId) return { id, k: 'rect', x: r.x, y: r.y, w: refW(r), h: refH(r) };
            const st = (c.stickies || []).find(x => x.id === id);
            if (st && belongsToBoard(st, activeBoardId)) return { id, k: 'rect', x: st.x, y: st.y, w: stickyW(st), h: stickyH(st) };
            const dc = (c.docs || []).find(x => x.id === id);
            if (dc && dc.boardId === activeBoardId) return { id, k: 'rect', x: dc.x, y: dc.y, w: docCardW(dc), h: docCardH(dc) };
            return null;
          };
          const findBind = (id) => id ? (findShape(id) || cardBind(id)) : null;
          // Что под точкой: сначала фигура, потом карточка. Карточка берётся
          // рамкой — у неё нет контура, за который можно было бы взяться.
          const cardAt = (x, y) => {
            const list = boardCards();
            for (let i = list.length - 1; i >= 0; i--) {
              const c = list[i];
              if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h)
                return { id: c.o.id, k: 'rect', x: c.x, y: c.y, w: c.w, h: c.h };
            }
            return null;
          };
          // Сама линия целью быть не может, но и загораживать собой то, что
          // под ней, не должна: связей на доске много, они пересекают всё
          // подряд, и нажатие по карточке попадало в чужую линию — связь
          // просто не начиналась. Поэтому линии пропускаем и смотрим ниже.
          // `cards` включают ТОЛЬКО намеренные жесты связывания — инструмент
          // «Связь» и кружок на карточке. Нарисованная линия к карточке НЕ
          // цепляется: связка у нас и есть стрелка, и без этого правила
          // любая прямая, проведённая поверх карточки, превращалась в связь
          // и начинала за ней бегать. Рисование — само по себе.
          const bindAt = (x, y, cards) => {
            const pad = 8 / Math.max(0.05, viewRef.current.z);
            for (let i = shapesRef.current.length - 1; i >= 0; i--) {
              const q = shapesRef.current[i];
              if (q.ct || isLineKind(q.k)) continue;
              if (shapeHit(q, x, y, pad, true)) return q;
            }
            return cards ? cardAt(x, y) : null;
          };
          // Стрелки, привязанные к перечисленным объектам
          const arrowsBoundTo = (ids) => {
            const set = ids instanceof Set ? ids : new Set(ids);
            return shapesRef.current.filter(q => isLineKind(q.k) && ((q.b1 && set.has(q.b1)) || (q.b2 && set.has(q.b2))));
          };
          const arrowEnds = (s) => {
            const h1 = findBind(s.b1), h2 = findBind(s.b2);
            let p1 = { x: s.x, y: s.y }, p2 = { x: s.x + s.w, y: s.y + s.h };
            const c1 = h1 ? shapeCenter(h1) : p1;
            const c2 = h2 ? shapeCenter(h2) : p2;
            if (h1) p1 = edgePoint(h1, c2.x, c2.y, s.gp);
            if (h2) p2 = edgePoint(h2, c1.x, c1.y, s.gp);
            return { p1, p2 };
          };
          // Маршрут. Прямой — от края до края; кривой — одна дуга с изгибом,
          // которым рулит средняя ручка; ортогональный — колено из отрезков
          // по осям. Обхода препятствий тут намеренно нет: простая эвристика
          // покрывает почти все схемы, а полноценный поиск пути — отдельная
          // задача, которой у нас пока не стоит.
          const arrowRoute = (s) => {
            const { p1, p2 } = arrowEnds(s);
            const rt = s.rt || 'straight';
            if (rt === 'ortho') {
              const dx = p2.x - p1.x, dy = p2.y - p1.y;
              if (Math.abs(dx) >= Math.abs(dy)) {
                const mx = p1.x + dx / 2;
                return { pts: [[p1.x, p1.y], [mx, p1.y], [mx, p2.y], [p2.x, p2.y]], curved: false };
              }
              const my = p1.y + dy / 2;
              return { pts: [[p1.x, p1.y], [p1.x, my], [p2.x, my], [p2.x, p2.y]], curved: false };
            }
            if (rt === 'curved') {
              const dx = p2.x - p1.x, dy = p2.y - p1.y, l = Math.hypot(dx, dy) || 1;
              const bow = s.bw === undefined ? l * 0.2 : s.bw;
              return { pts: [[p1.x, p1.y], [(p1.x + p2.x) / 2 - dy / l * bow, (p1.y + p2.y) / 2 + dx / l * bow], [p2.x, p2.y]], curved: true };
            }
            return { pts: [[p1.x, p1.y], [p2.x, p2.y]], curved: false };
          };

          const shapeRnd = (seed) => { let v = (seed >>> 0) || 1; return () => { v = (v * 1664525 + 1013904223) >>> 0; return v / 4294967296; }; };


          // Опорные точки контура. Для «руки» этого достаточно: по ним кладём
          // выгнутые рёбра. Овал режем на 16 дуг — меньше видно грани.
          const shapeCorners = (s) => {
            const b = shapeBox(s);
            if (isLineKind(s.k)) {
              const r = arrowRoute(s);
              if (!r.curved) return r.pts;
              // Дугу для «от руки» РАЗБИВАЕМ на точки: контрольная точка
              // лежит в стороне от самой кривой, и ломаная через неё
              // читается изломом, а не дугой.
              const a = r.pts[0], cp = r.pts[1], z2 = r.pts[2], out = [];
              for (let i = 0; i <= 12; i++) {
                const t = i / 12, u = 1 - t;
                out.push([u * u * a[0] + 2 * u * t * cp[0] + t * t * z2[0],
                          u * u * a[1] + 2 * u * t * cp[1] + t * t * z2[1]]);
              }
              return out;
            }
            if (s.k === 'diamond') return [[b.x + b.w / 2, b.y], [b.x + b.w, b.y + b.h / 2], [b.x + b.w / 2, b.y + b.h], [b.x, b.y + b.h / 2]];
            if (s.k === 'ellipse') {
              // Точек берём по РАЗМЕРУ: на шестнадцати у крупного овала
              // видно грани — он читается многоугольником, а не овалом.
              const n = Math.max(22, Math.min(56, Math.round((b.w + b.h) / 11)));
              const out = [], cx = b.x + b.w / 2, cy = b.y + b.h / 2;
              for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; out.push([cx + Math.cos(a) * b.w / 2, cy + Math.sin(a) * b.h / 2]); }
              return out;
            }
            return [[b.x, b.y], [b.x + b.w, b.y], [b.x + b.w, b.y + b.h], [b.x, b.y + b.h]];
          };
          const shapeSmoothCmds = (s) => {
            const b = shapeBox(s), out = [];
            if (isLineKind(s.k)) {
              const r = arrowRoute(s), q = r.pts;
              out.push(['M', q[0][0], q[0][1]]);
              if (r.curved) out.push(['Q', q[1][0], q[1][1], q[2][0], q[2][1]]);
              else if (q.length > 2) {
                // Колени ортогонального маршрута скругляем: прямой угол
                // в тонкой линии читается как излом, а не как поворот.
                for (let i = 1; i < q.length - 1; i++) out.push(['A', q[i][0], q[i][1], q[i + 1][0], q[i + 1][1], 8]);
                out.push(['L', q[q.length - 1][0], q[q.length - 1][1]]);
              } else out.push(['L', q[1][0], q[1][1]]);
              return out;
            }
            if (s.k === 'ellipse') return [['E', b.x + b.w / 2, b.y + b.h / 2, Math.max(0.1, b.w / 2), Math.max(0.1, b.h / 2)]];
            if (s.k === 'diamond') {
              const c = shapeCorners(s);
              out.push(['M', c[0][0], c[0][1]]);
              for (let i = 1; i < c.length; i++) out.push(['L', c[i][0], c[i][1]]);
              out.push(['Z']);
              return out;
            }
            const r = s.rd ? Math.min(26, Math.min(b.w, b.h) * 0.22) : 0;
            if (r > 0) {
              const x0 = b.x, y0 = b.y, x1 = b.x + b.w, y1 = b.y + b.h;
              out.push(['M', x0 + r, y0]);
              out.push(['L', x1 - r, y0], ['Q', x1, y0, x1, y0 + r]);
              out.push(['L', x1, y1 - r], ['Q', x1, y1, x1 - r, y1]);
              out.push(['L', x0 + r, y1], ['Q', x0, y1, x0, y1 - r]);
              out.push(['L', x0, y0 + r], ['Q', x0, y0, x0 + r, y0], ['Z']);
              return out;
            }
            out.push(['M', b.x, b.y], ['L', b.x + b.w, b.y], ['L', b.x + b.w, b.y + b.h], ['L', b.x, b.y + b.h], ['Z']);
            return out;
          };
          // «От руки» в три шага. Каждый важен, и порядок тоже:
          // 1) длинные стороны ДРОБИМ — одна дуга на всю сторону читается
          //    как ровная линия, которую слегка повело, а рука так не ведёт;
          // 2) смещаем точки по ОДНОМУ разу и переиспользуем — если дёргать
          //    концы у каждого куска отдельно, куски расходятся и контур
          //    рвётся на стыках;
          // 3) между соседними точками кладём выгнутую дугу. Именно выгиб,
          //    а не дрожание по всей длине: от дрожания линия мохнатая.
          const shapeRoughCmds = (s, pass) => {
            const rnd = shapeRnd((s.sd8 || 1) + pass * 7919);
            const b = shapeBox(s);
            const amp = (s.ro === 2 ? 4.2 : 2.0) * (1 + Math.min(1.8, Math.max(b.w, b.h) / 260));
            const c = shapeCorners(s);
            const closed = !isLineKind(s.k);
            const raw = [];
            const n = closed ? c.length : c.length - 1;
            for (let i = 0; i < n; i++) {
              const a = c[i], d = c[(i + 1) % c.length];
              const len = Math.hypot(d[0] - a[0], d[1] - a[1]);
              const parts = Math.max(1, Math.min(5, Math.round(len / 85)));
              for (let q = 0; q < parts; q++) {
                const t = q / parts;
                raw.push([a[0] + (d[0] - a[0]) * t, a[1] + (d[1] - a[1]) * t]);
              }
            }
            if (!closed) raw.push(c[c.length - 1]);
            const j = raw.map(q => [q[0] + (rnd() - 0.5) * amp, q[1] + (rnd() - 0.5) * amp]);
            const out = [];
            if (!j.length) return out;
            out.push(['M', j[0][0], j[0][1]]);
            const m = closed ? j.length : j.length - 1;
            for (let i = 0; i < m; i++) {
              const a = j[i], d = j[(i + 1) % j.length];
              const dx = d[0] - a[0], dy = d[1] - a[1], l = Math.hypot(dx, dy) || 1;
              const bow = (rnd() - 0.5) * amp * 1.3;
              out.push(['Q', (a[0] + d[0]) / 2 - dy / l * bow, (a[1] + d[1]) / 2 + dx / l * bow, d[0], d[1]]);
            }
            if (closed) out.push(['Z']);
            return out;
          };
          // Фигура не зависит от масштаба, поэтому её путь считается один раз
          // и переживает и панораму, и зум. Правка фигуры сбрасывает кэш.
          const shapeCmds = (s, pass) => {
            // Привязанная стрелка зависит от того, где сейчас стоят её
            // фигуры, — кэшировать нечего: подвинули блок, и путь другой.
            const live = isLineKind(s.k) && (s.b1 || s.b2);
            const key = s.ro ? '_c' + pass : '_c';
            if (live) return s.ro ? shapeRoughCmds(s, pass) : shapeSmoothCmds(s);
            if (!s[key]) s[key] = s.ro ? shapeRoughCmds(s, pass) : shapeSmoothCmds(s);
            return s[key];
          };
          const shapePath = (s, pass) => {
            const live = isLineKind(s.k) && (s.b1 || s.b2);
            if (live) return cmdsPath(shapeCmds(s, pass));
            const key = s.ro ? '_p' + pass : '_p';
            if (!s[key]) s[key] = cmdsPath(shapeCmds(s, pass));
            return s[key];
          };
          const shapeDirty = (s) => {
            delete s._p; delete s._p0; delete s._p1;
            delete s._c; delete s._c0; delete s._c1;
            return s;
          };

          // Штриховка: рисуем наклонные линии, обрезав их формой. Заливка
          // сплошным на тёмном фоне читается пятном, поэтому она приглушена,
          // а штриховка наоборот ярче — иначе её просто не видно.
          const fillHatch = (ctx, s, path, cross) => {
            const b = shapeBox(s);
            const gap = Math.max(7, 5 + s.sw * 2.5);
            ctx.save();
            ctx.clip(path);
            ctx.globalAlpha = ctx.globalAlpha * 0.55;
            ctx.strokeStyle = s.bg;
            ctx.lineWidth = Math.max(1, s.sw * 0.7);
            ctx.setLineDash([]);
            const run = (back) => {
              for (let i = -b.h; i < b.w + b.h; i += gap) {
                ctx.beginPath();
                if (back) { ctx.moveTo(b.x + i, b.y); ctx.lineTo(b.x + i + b.h, b.y + b.h); }
                else { ctx.moveTo(b.x + i, b.y); ctx.lineTo(b.x + i - b.h, b.y + b.h); }
                ctx.stroke();
              }
            };
            run(false); if (cross) run(true);
            ctx.restore();
          };
          const arrowHead = (ctx, x, y, fromX, fromY, size) => {
            const a = Math.atan2(y - fromY, x - fromX), w = 0.42;
            ctx.beginPath();
            ctx.moveTo(x - Math.cos(a - w) * size, y - Math.sin(a - w) * size);
            ctx.lineTo(x, y);
            ctx.lineTo(x - Math.cos(a + w) * size, y - Math.sin(a + w) * size);
            ctx.stroke();
          };
          // Текст рисуем ОДНОЙ функцией и для своего элемента, и для подписи
          // внутри фигуры: разница только в том, откуда берётся рамка.
          const paintText = (ctx, s, box) => {
            const b = box || shapeBox(s);
            ctx.save();
            ctx.globalAlpha = s.op === undefined ? 1 : s.op;
            ctx.font = textFont(s);
            ctx.fillStyle = s.sc;
            ctx.textBaseline = 'top';
            const pad = box ? 10 : 0;
            const maxW = Math.max(10, b.w - pad * 2);
            const lines = wrapText(ctx, s.tx, maxW);
            const lh = textLH(s);
            const total = lines.length * lh;
            // Подпись внутри фигуры центрируется по обеим осям — так её
            // ставят и в Freeform, и это единственное, что читается,
            // когда хозяина растянули.
            let y = box ? b.y + (b.h - total) / 2 : b.y;
            const ta = s.ta || (box ? 'center' : 'left');
            ctx.textAlign = ta;
            const x = ta === 'center' ? b.x + b.w / 2 : (ta === 'right' ? b.x + b.w - pad : b.x + pad);
            lines.forEach(ln => { ctx.fillText(ln, x, y); y += lh; });
            ctx.restore();
          };
          // Высота текстового элемента считается по содержимому: рамку
          // задаёт ширина, а сколько строк получилось — знает только
          // перенос. Без пересчёта выделение и попадание врали бы.
          const measureText = (s) => {
            if (!hitCtx.current) hitCtx.current = document.createElement('canvas').getContext('2d');
            const c = hitCtx.current;
            c.font = textFont(s);
            const lines = wrapText(c, s.tx, Math.max(10, s.w));
            return Math.max(textLH(s), lines.length * textLH(s));
          };
          const paintShape = (ctx, s) => {
            if (isText(s)) {
              const host = s.ct ? shapesRef.current.find(q => q.id === s.ct) : null;
              paintText(ctx, s, host ? shapeBox(host) : null);
              return;
            }
            ctx.save();
            ctx.globalAlpha = s.op === undefined ? 1 : s.op;
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            const closed = !isLineKind(s.k);
            if (closed && s.bg && s.bg !== 'transparent') {
              const fp = shapePath(s, 0);
              if (s.fs === 'hachure' || s.fs === 'cross') fillHatch(ctx, s, fp, s.fs === 'cross');
              else { ctx.save(); ctx.globalAlpha = ctx.globalAlpha * 0.22; ctx.fillStyle = s.bg; ctx.fill(fp); ctx.restore(); }
            }
            ctx.strokeStyle = s.sc;
            ctx.lineWidth = s.sw;
            if (s.sd === 'dashed') ctx.setLineDash([s.sw * 4, s.sw * 3.2]);
            else if (s.sd === 'dotted') ctx.setLineDash([0.1, s.sw * 2.6]);
            else ctx.setLineDash([]);
            ctx.stroke(shapePath(s, 0));
            // «От руки» — это ДВА прохода: один контур с дрожанием выглядит
            // просто кривым, два наложенных читаются как нажим карандаша.
            if (s.ro) { ctx.save(); ctx.globalAlpha = ctx.globalAlpha * 0.75; ctx.stroke(shapePath(s, 1)); ctx.restore(); }
            if (isLineKind(s.k)) {
              ctx.setLineDash([]);
              const hs = Math.max(9, s.sw * 4.5);
              // Направление берём у последнего отрезка МАРШРУТА, а не
              // у прямой между концами: на колене и на дуге это разные вещи.
              const q = arrowRoute(s).pts, n = q.length;
              if (s.a2 === 'arrow') arrowHead(ctx, q[n - 1][0], q[n - 1][1], q[n - 2][0], q[n - 2][1], hs);
              if (s.a1 === 'arrow') arrowHead(ctx, q[0][0], q[0][1], q[1][0], q[1][1], hs);
            }
            ctx.restore();
          };

          // Попадание считаем настоящей проверкой по пути, а не «внутри
          // рамки»: у овала и ромба углы рамки пустые, и по ним ловилось
          // то, чего под пальцем нет. Незалитую фигуру берём только за контур.
          const hitCtx = useRef(null);
          // `inside` — считать попаданием и «внутри контура», даже если
          // фигура не залита. Обычному выбору так делать НЕЛЬЗЯ: фигуры
          // лежат поверх карточек, и большой прозрачный прямоугольник
          // накрыл бы собой всё, что под ним. А вот двойному клику
          // «подписать этот блок» именно так и надо.
          const shapeHit = (s, x, y, pad, inside) => {
            const b = shapeBox(s);
            const m = pad + s.sw;
            if (x < b.x - m || x > b.x + b.w + m || y < b.y - m || y > b.y + b.h + m) return false;
            // Текст берётся всей рамкой: ловить его по контуру букв —
            // издевательство, особенно пальцем.
            if (isText(s)) return true;
            if (!hitCtx.current) hitCtx.current = document.createElement('canvas').getContext('2d');
            const c = hitCtx.current;
            c.lineWidth = Math.max(s.sw, 1) + pad * 2;
            const p = shapePath(s, 0);
            if (c.isPointInStroke(p, x, y)) return true;
            if (!isLineKind(s.k) && (inside || (s.bg && s.bg !== 'transparent')) && c.isPointInPath(p, x, y)) return true;
            return false;
          };
          // Ручки. У линии и стрелки их ДВЕ — по концам: тянуть такую за
          // угол рамки бессмысленно, поворот у неё и есть перенос конца.
          // У остальных восемь: четыре угла и четыре середины сторон.
          const shapeHandles = (s) => {
            if (isLineKind(s.k)) {
              const { p1, p2 } = arrowEnds(s);
              const out = [{ n: 'p1', x: p1.x, y: p1.y }, { n: 'p2', x: p2.x, y: p2.y }];
              // Средняя точка рулит изгибом — как зелёная точка в Freeform.
              if ((s.rt || 'straight') === 'curved') {
                const q = arrowRoute(s).pts;
                out.push({ n: 'mid', x: (q[0][0] + 2 * q[1][0] + q[2][0]) / 4, y: (q[0][1] + 2 * q[1][1] + q[2][1]) / 4 });
              }
              return out;
            }
            const b = shapeBox(s), mx = b.x + b.w / 2, my = b.y + b.h / 2;
            // У текста тянется только ширина: высоту задаёт содержимое,
            // и вертикальная ручка обманывала бы — отпустил, а она вернулась.
            if (isText(s)) return [{ n: 'w', x: b.x, y: my }, { n: 'e', x: b.x + b.w, y: my }];
            return [
              { n: 'nw', x: b.x, y: b.y }, { n: 'n', x: mx, y: b.y }, { n: 'ne', x: b.x + b.w, y: b.y },
              { n: 'e', x: b.x + b.w, y: my }, { n: 'se', x: b.x + b.w, y: b.y + b.h },
              { n: 's', x: mx, y: b.y + b.h }, { n: 'sw', x: b.x, y: b.y + b.h }, { n: 'w', x: b.x, y: my }
            ];
          };
          const packShapes = (list) => JSON.stringify(list.map(s => {
            const o = {}; for (const k in s) if (k[0] !== '_') o[k] = s[k];
            return o;
          }));

          // --- СЛОИ РИСОВАНИЯ ---
          // Холстов два, и это главный рычаг плавности: на нижнем лежат
          // готовые штрихи, на верхнем — тот, что ведут прямо сейчас, и
          // кольцо-подсказка. Пока идёт штрих, нижний не трогаем вовсе.
          const inkCanvasRef = useRef(null);   // готовые штрихи + старый растр
          const liveCanvasRef = useRef(null);  // текущий штрих и кольцо кисти
          const strokesRef = useRef([]);       // векторные штрихи открытой доски
          const legacyCv = useRef(null);       // старый растровый рисунок, если он есть
          const legacyUrl = useRef(null);
          const legacyDirty = useRef(false);
          const live = useRef(null);           // штрих, который ведут сейчас
          const hoverPt = useRef(null);        // указатель в ЭКРАННЫХ координатах
          const undoStack = useRef([]);
          const redoStack = useRef([]);
          const [canUndo, setCanUndo] = useState(false);
          const [canRedo, setCanRedo] = useState(false);
          // Фигуры лежат в ref, а не в состоянии React: при ведении мышью
          // они меняются по десять раз в секунду, и каждая такая правка
          // перерисовывала бы всё приложение вместе со списком сцен.
          // Наружу торчит только выделение — оно нужно панели свойств.
          const shapesRef = useRef([]);
          const [selShapes, setSelShapes] = useState([]);
          const [shapeKind, setShapeKind] = useState('rect');
          const [shapeStyle, setShapeStyle] = useState(() => {
            try { return { ...SHAPE_STYLE0, ...(JSON.parse(localStorage.getItem('cf_shape_style')) || {}) }; }
            catch (e) { return { ...SHAPE_STYLE0 }; }
          });
          // Какой текст правят прямо сейчас. Пока правят — на холсте его
          // не рисуем, иначе он двоился бы с полем ввода.
          const [editText, setEditText] = useState(null);   // {id} | null
          const editRef = useRef(null);
          const shapeDraft = useRef(null);      // фигура, которую тянут прямо сейчас
          const shapeAct = useRef(null);        // идёт перемещение или изменение размера
          const bindCand = useRef(null);        // фигура, к которой сейчас притянется конец
          const linkPick = useRef(null);        // первый объект, выбранный в режиме «Связь»
          const linkDown = useRef(null);        // нажатие в режиме «Связь»: что под ним и где
          const guides = useRef([]);            // направляющие, показанные сейчас
          const snapPool = useRef(null);        // к чему притягиваемся в этом жесте
          // Ластик живёт своим размером, а не «кисть × 2,5», как раньше:
          // размер был спрятан в коде, увидеть и задать его было нечем.
          const [eraserSize, setEraserSize] = useState(() => { try { return Number(localStorage.getItem('cf_eraser')) || 40; } catch (e) { return 40; } });
          const changeEraser = (v) => { setEraserSize(v); try { localStorage.setItem('cf_eraser', v); } catch (e) {} };

          // Холст размером с окно и в НАСТОЯЩЕМ разрешении экрана. Множитель
          // ограничен двойкой: на телефонах он бывает 3, и втрое больший холст
          // стоит втрое дороже при разнице, которой не видно.
          const fitInk = (c) => {
            const dpr = Math.min(2, window.devicePixelRatio || 1);
            const w = c.clientWidth || 1, h = c.clientHeight || 1;
            const bw = Math.round(w * dpr), bh = Math.round(h * dpr);
            if (c.width !== bw || c.height !== bh) { c.width = bw; c.height = bh; }
            const ctx = c.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            return { w, h, ctx };
          };

          // Экран → доска. Холсты лежат ровно по размеру области доски,
          // поэтому её левый верхний угол и есть начало отсчёта.
          const inkPt = (cx, cy) => {
            const c = liveCanvasRef.current;
            const r = c ? c.getBoundingClientRect() : { left: 0, top: 0 };
            const sx = cx - r.left, sy = cy - r.top;
            const v = viewRef.current;
            return { sx, sy, x: (sx - v.x) / v.z, y: (sy - v.y) / v.z };
          };
          const erasePt = useRef(null);

          // Грубая карта старой растровой подложки: 100×100 клеток, в каждой
          // просто «есть тут что-нибудь или пусто». Считается ОДИН раз при
          // загрузке уменьшением картинки (это быстро, делает видеокарта).
          // Нужна ради одного: снимок подложки для отмены весит десятки
          // мегабайт и кодируется сотни миллисекунд, поэтому снимать его
          // надо, только если ластик реально что-то у неё забрал.
          const legacyMap = useRef(null);
          const legacyShot = useRef(false);
          const buildLegacyMap = (img) => {
            try {
              const s = document.createElement('canvas');
              s.width = 100; s.height = 100;
              const sc = s.getContext('2d');
              sc.drawImage(img, 0, 0, 100, 100);
              const d = sc.getImageData(0, 0, 100, 100).data;
              const m = new Uint8Array(100 * 100);
              for (let i = 0; i < m.length; i++) m[i] = d[i * 4 + 3] ? 1 : 0;
              legacyMap.current = m;
            } catch (err) { legacyMap.current = null; }
          };
          const legacyHit = (x0, y0, x1, y1, r) => {
            if (!legacyCv.current) return false;
            const m = legacyMap.current;
            if (!m) return true;
            const cell = 40;
            const a = Math.max(0, Math.floor((Math.min(x0, x1) - r) / cell));
            const b = Math.min(99, Math.floor((Math.max(x0, x1) + r) / cell));
            const c = Math.max(0, Math.floor((Math.min(y0, y1) - r) / cell));
            const d = Math.min(99, Math.floor((Math.max(y0, y1) + r) / cell));
            for (let j = c; j <= d; j++) for (let i = a; i <= b; i++) if (m[j * 100 + i]) return true;
            return false;
          };
          // Подложку для отмены снимаем один раз за штрих и только по факту.
          const holdLegacy = () => {
            if (legacyShot.current || !legacyCv.current) return;
            legacyShot.current = true;
            const top = undoStack.current[undoStack.current.length - 1];
            if (top && top.legacy === undefined) top.legacy = legacyCv.current.toDataURL();
          };

          // --- НАПРАВЛЯЮЩИЕ И ПРИТЯЖКА ---
          // Раньше всё жёстко липло к сетке в 24 точки: выровнять карточку
          // по СОСЕДНЕЙ было нельзя в принципе, если та стояла не по сетке.
          // Теперь сначала ищем совпадение с краями и серединами того, что
          // уже лежит на доске, и только если ничего не нашли — падаем
          // обратно на сетку. Порог берётся в ЭКРАННЫХ точках и делится
          // на масштаб, иначе на мелком зуме притягивало бы через пол-доски.
          const SNAP_PX = 7;
          const GRID = 24;
          // Ctrl (Cmd) во время жеста выключает притяжку целиком.
          const noSnap = useRef(false);
          // Собираем кандидатов ОДИН раз в начале жеста: то, что не движется,
          // за время жеста не изменится, а список может быть длинным.
          const buildSnapPool = (skipIds) => {
            const skip = new Set(skipIds || []);
            const out = [];
            const add = (o, w, h) => { if (!skip.has(o.id)) out.push({ x0: o.x, y0: o.y, x1: o.x + w, y1: o.y + h }); };
            boardScenes.forEach(s => add(s, 288, 150));
            references.filter(r => r.boardId === activeBoardId).forEach(r => add(r, refW(r), refH(r)));
            stickies.filter(st => belongsToBoard(st, activeBoardId)).forEach(st => add(st, stickyW(st), stickyH(st)));
            boardDocs.forEach(d => add(d, docCardW(d), docCardH(d)));
            shapesRef.current.forEach(s => { if (!skip.has(s.id)) { const b = shapeBox(s); out.push({ x0: b.x, y0: b.y, x1: b.x + b.w, y1: b.y + b.h }); } });
            snapPool.current = out;
            return out;
          };
          // Считаем поправку по каждой оси отдельно и запоминаем, какие линии
          // показать. Сравниваем три значения с трёх сторон: край, середина,
          // край — этого хватает и для выравнивания, и для «по центру».
          const snapAdjust = (box) => {
            guides.current = [];
            if (noSnap.current) return { dx: 0, dy: 0 };
            const pool = snapPool.current || [];
            const tol = SNAP_PX / Math.max(0.05, viewRef.current.z);
            const mine = {
              x: [box.x0, (box.x0 + box.x1) / 2, box.x1],
              y: [box.y0, (box.y0 + box.y1) / 2, box.y1]
            };
            let bx = null, by = null;
            for (const t of pool) {
              const tx = [t.x0, (t.x0 + t.x1) / 2, t.x1];
              const ty = [t.y0, (t.y0 + t.y1) / 2, t.y1];
              for (const m of mine.x) for (const v of tx) {
                const d = v - m;
                if (Math.abs(d) <= tol && (!bx || Math.abs(d) < Math.abs(bx.d))) bx = { d, v, t };
              }
              for (const m of mine.y) for (const v of ty) {
                const d = v - m;
                if (Math.abs(d) <= tol && (!by || Math.abs(d) < Math.abs(by.d))) by = { d, v, t };
              }
            }
            if (bx) guides.current.push({ vertical: true, at: bx.v, a: Math.min(box.y0 + bx.d * 0, bx.t.y0, box.y0), b: Math.max(bx.t.y1, box.y1) });
            if (by) guides.current.push({ vertical: false, at: by.v, a: Math.min(by.t.x0, box.x0), b: Math.max(by.t.x1, box.x1) });
            return { dx: bx ? bx.d : 0, dy: by ? by.d : 0 };
          };
          // Итоговое положение: сначала направляющие, по осям где их нет —
          // сетка. Сетку не выбрасываем: она гасит дрожание при медленном
          // ведении, и без неё каждое движение указателя двигало бы карточку.
          const snapMove = (box) => {
            const a = snapAdjust(box);
            const gx = a.dx !== 0 ? a.dx : (noSnap.current ? 0 : Math.round(box.x0 / GRID) * GRID - box.x0);
            const gy = a.dy !== 0 ? a.dy : (noSnap.current ? 0 : Math.round(box.y0 / GRID) * GRID - box.y0);
            return { dx: gx, dy: gy };
          };
          const clearGuides = () => { guides.current = []; snapPool.current = null; };
          // Притяжка ОДНОГО значения — для изменения размера: там едет один
          // край, и двигать вместе с ним противоположный нельзя.
          const snapEdge = (v, vertical, a, b) => {
            if (noSnap.current) return v;
            const pool = snapPool.current || [];
            const tol = SNAP_PX / Math.max(0.05, viewRef.current.z);
            let best = null;
            for (const t of pool) {
              const cand = vertical ? [t.x0, (t.x0 + t.x1) / 2, t.x1] : [t.y0, (t.y0 + t.y1) / 2, t.y1];
              for (const c of cand) { const d = c - v; if (Math.abs(d) <= tol && (!best || Math.abs(d) < Math.abs(best.d))) best = { d, c, t }; }
            }
            if (!best) return Math.round(v / GRID) * GRID;
            guides.current.push(vertical
              ? { vertical: true, at: best.c, a: Math.min(best.t.y0, a), b: Math.max(best.t.y1, b) }
              : { vertical: false, at: best.c, a: Math.min(best.t.x0, a), b: Math.max(best.t.x1, b) });
            return best.c;
          };

          // --- ЖИЗНЬ ФИГУРЫ: создать, выбрать, подвинуть, растянуть ---
          const makeShape = (k, x, y) => ({
            id: `sh-${Date.now().toString(36)}${Math.random().toString(36).slice(2, 5)}`,
            k, x, y, w: 0, h: 0,
            tx: k === 'text' ? '' : undefined,
            fz: shapeStyle.fz || 20,
            ta: k === 'text' ? 'left' : 'center',
            sc: shapeStyle.sc,
            bg: isLineKind(k) ? 'transparent' : shapeStyle.bg,
            sw: shapeStyle.sw, sd: shapeStyle.sd, fs: shapeStyle.fs,
            rd: shapeStyle.rd, ro: shapeStyle.ro, op: shapeStyle.op,
            a1: k === 'arrow' ? shapeStyle.a1 : 'none',
            a2: k === 'arrow' ? shapeStyle.a2 : 'none',
            sd8: (Math.random() * 2000000000) | 0
          });
          // Ищем сверху вниз: выше лежит то, что нарисовано позже.
          const shapeAt = (x, y, inside) => {
            const pad = 8 / Math.max(0.05, viewRef.current.z);
            for (let i = shapesRef.current.length - 1; i >= 0; i--) {
              const s = shapesRef.current[i];
              // Подпись внутри фигуры сама не выбирается: нажимают по
              // хозяину, иначе рамка выделения появлялась бы дважды.
              if (s.ct) continue;
              if (shapeHit(s, x, y, pad, inside)) return s;
            }
            return null;
          };
          // Ручку ловим с запасом под палец: 9 точек на экране — это меньше
          // трети подушечки, и попасть в них мышью можно, а пальцем нет.
          const handleAt = (x, y) => {
            const tol = 13 / Math.max(0.05, viewRef.current.z);
            for (const id of selShapes) {
              const s = shapesRef.current.find(q => q.id === id);
              if (!s) continue;
              for (const hd of shapeHandles(s)) {
                if (Math.abs(hd.x - x) <= tol && Math.abs(hd.y - y) <= tol) return { s, h: hd.n };
              }
            }
            return null;
          };
          // Пока указатель не сдвинулся хоть немного, жест НЕ считается
          // движением. Без этого простое нажатие «чтобы выбрать» само
          // подтягивало фигуру к сетке и вдобавок писало пустой шаг отмены:
          // человек ткнул в фигуру, а она уехала.
          const DRAG_START_PX = 3;
          // Открыть правку текста. Для фигуры без подписи заводим её здесь же:
          // человек делает один жест «двойной клик по блоку», а не два —
          // «создай текст» и «положи внутрь».
          const openText = (s) => {
            if (READ_ONLY) return;
            if (READ_ONLY) return;
            let target = s;
            if (!isText(s)) {
              const has = shapesRef.current.find(q => q.ct === s.id);
              if (has) target = has;
              else {
                pushUndo(false);
                target = { ...makeShape('text', 0, 0), ct: s.id, tx: '', ta: 'center', sc: s.sc };
                shapesRef.current = shapesRef.current.concat([target]);
                scheduleInkSave('shapes');
              }
            }
            setSelShapes([]);
            setEditText({ id: target.id });
            requestStatic();
          };
          // Фокус ставим руками, а не через autoFocus: поле появляется после
          // жеста, во время которого фокус мог уехать на кнопку панели, —
          // и тогда набранное просто не попадало в текст. Заодно ставим
          // курсор в конец, чтобы дописывать, а не перезаписывать.
          useEffect(() => {
            if (!editText) return;
            const el = editRef.current;
            if (!el) return;
            el.focus();
            try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {}
          }, [editText]);

          const commitText = (value) => {
            const cur = editText;
            setEditText(null);
            if (!cur) return;
            const s = shapesRef.current.find(q => q.id === cur.id);
            if (!s) { requestStatic(); return; }
            const txt = String(value == null ? s.tx : value);
            if (txt === (s.tx || '')) { requestStatic(); return; }
            pushUndo(false);
            // Пустой текст не оставляем: он невидим, но продолжает ловить
            // нажатия и мешаться под рукой.
            if (!txt.trim()) shapesRef.current = shapesRef.current.filter(q => q.id !== s.id);
            else shapesRef.current = shapesRef.current.map(q => q.id === s.id
              ? shapeDirty({ ...q, tx: txt, h: isText(q) && !q.ct ? measureText({ ...q, tx: txt }) : q.h })
              : q);
            bumpInk();
            scheduleInkSave('shapes');
          };

          // Взяли привязанный конец руками — привязка снимается, а туда,
          // где он был нарисован, кладутся настоящие координаты. Иначе конец
          // прыгал бы обратно к фигуре на каждое движение.
          const freezeArrow = (s, which) => {
            const { p1, p2 } = arrowEnds(s);
            s.x = p1.x; s.y = p1.y; s.w = p2.x - p1.x; s.h = p2.y - p1.y;
            if (which === 'p1') s.b1 = null; else if (which === 'p2') s.b2 = null;
            shapeDirty(s);
          };
          // Карточка уходит с доски или из проекта — привязанные к ней стрелки
          // замирают там, где нарисованы, а не исчезают следом. Удалил одну
          // заметку, а половина схемы пропала — это выглядит как поломка.
          // Звать ДО того, как карточка убрана из состояния: пока она есть,
          // маршрут стрелки ещё можно посчитать.
          const freezeArrowsForCards = (ids) => {
            const set = ids instanceof Set ? ids : new Set(ids);
            const list = arrowsBoundTo(set);
            if (!list.length) return;
            list.forEach(q => {
              if (q.b1 && set.has(q.b1)) freezeArrow(q, 'p1');
              if (q.b2 && set.has(q.b2)) freezeArrow(q, 'p2');
            });
            bumpInk(); scheduleInkSave('shapes');
          };
          const shapeStartAct = (kind, ids, pt, extra) => {
            if (READ_ONLY) return;
            if (kind === 'size' && extra && (extra.h === 'p1' || extra.h === 'p2')) {
              const s = shapesRef.current.find(q => q.id === ids[0]);
              if (s && isLineKind(s.k) && (s.b1 || s.b2)) freezeArrow(s, extra.h);
            }
            shapeAct.current = { kind, ids: new Set(ids), sx: pt.x, sy: pt.y, moved: false,
                                orig: shapesRef.current.filter(s => ids.includes(s.id)).map(s => ({ ...s })), ...extra };
            buildSnapPool(ids);
          };
          const shapeMoveAct = (pt, shift) => {
            const a = shapeAct.current; if (!a) return;
            let dx = pt.x - a.sx, dy = pt.y - a.sy;
            if (!a.moved) {
              if (Math.hypot(dx, dy) * viewRef.current.z < DRAG_START_PX) return;
              a.moved = true;
              pushUndo(false);
              requestStatic();        // снимаем их с нижнего слоя — дальше ведёт верхний
            }
            guides.current = [];
            if (a.kind === 'move') {
              // Рамку считаем по ВСЕМ выбранным разом: выравнивать надо
              // группу целиком, а не каждую фигуру по отдельности.
              let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
              a.orig.forEach(o => { const b = shapeBox(o); x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h); });
              const adj = snapMove({ x0: x0 + dx, y0: y0 + dy, x1: x1 + dx, y1: y1 + dy });
              dx += adj.dx; dy += adj.dy;
              a.orig.forEach(o => {
                const s = shapesRef.current.find(q => q.id === o.id); if (!s) return;
                s.x = o.x + dx; s.y = o.y + dy; shapeDirty(s);
              });
            } else {
              const o = a.orig[0];
              const s = shapesRef.current.find(q => q.id === o.id); if (!s) return;
              if (isLineKind(o.k) && a.h === 'mid') {
                // Изгиб — это перпендикулярное отклонение от прямой между
                // концами. Знак важен: он определяет, в какую сторону гнуть.
                const { p1, p2 } = arrowEnds(s);
                const vx = p2.x - p1.x, vy = p2.y - p1.y, l = Math.hypot(vx, vy) || 1;
                const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
                s.bw = ((pt.x - mx) * (-vy / l) + (pt.y - my) * (vx / l)) * 2;
                shapeDirty(s);
              } else if (isLineKind(o.k)) {
                const bx = shapeBox(o);
                // Ведём конец над фигурой — она подсветится и конец к ней
                // прицепится: это и есть весь жест «связать два блока».
                const over = bindAt(pt.x, pt.y);
                bindCand.current = (over && over.id !== s.id) ? over.id : null;
                if (a.h === 'p1') {
                  let nx = snapEdge(o.x + dx, true, bx.y, bx.y + bx.h), ny = snapEdge(o.y + dy, false, bx.x, bx.x + bx.w);
                  if (shift) { const r = lockAngle(o.x + o.w, o.y + o.h, nx, ny); nx = r.x; ny = r.y; }
                  s.x = nx; s.y = ny; s.w = o.x + o.w - nx; s.h = o.y + o.h - ny;
                } else {
                  let nx = snapEdge(o.x + o.w + dx, true, bx.y, bx.y + bx.h), ny = snapEdge(o.y + o.h + dy, false, bx.x, bx.x + bx.w);
                  if (shift) { const r = lockAngle(o.x, o.y, nx, ny); nx = r.x; ny = r.y; }
                  s.w = nx - o.x; s.h = ny - o.y;
                }
              } else {
                const b = shapeBox(o);
                let L = b.x, T = b.y, R = b.x + b.w, B = b.y + b.h;
                if (a.h.includes('w')) L = snapEdge(L + dx, true, T, B);
                if (a.h.includes('e')) R = snapEdge(R + dx, true, T, B);
                if (a.h.includes('n')) T = snapEdge(T + dy, false, L, R);
                if (a.h.includes('s')) B = snapEdge(B + dy, false, L, R);
                if (R - L < 4) R = L + 4;
                if (B - T < 4) B = T + 4;
                s.x = L; s.y = T; s.w = R - L; s.h = B - T;
                // У текста высоту задаёт содержимое: тянут ширину, а сколько
                // вышло строк — знает только перенос.
                if (isText(s)) s.h = measureText(s);
              }
              shapeDirty(s);
            }
            requestLive();
          };
          const shapeEndAct = () => {
            const a = shapeAct.current;
            if (!a) return;
            // Отпустили конец над фигурой — цепляем.
            if (a.moved && bindCand.current && (a.h === 'p1' || a.h === 'p2')) {
              const s = shapesRef.current.find(q => a.ids.has(q.id));
              if (s && isLineKind(s.k)) { s[a.h === 'p1' ? 'b1' : 'b2'] = bindCand.current; shapeDirty(s); }
            }
            bindCand.current = null;
            shapeAct.current = null;
            clearGuides();
            if (!a.moved) { requestLive(); return; }
            bumpInk();
            scheduleInkSave('shapes');
          };
          // Shift держит угол кратным 15°: без этого ровную горизонталь
          // рукой не проведёшь, а именно её чаще всего и рисуют.
          const lockAngle = (x0, y0, x, y) => {
            const dx = x - x0, dy = y - y0;
            const l = Math.hypot(dx, dy);
            const step = Math.PI / 12;
            const a = Math.round(Math.atan2(dy, dx) / step) * step;
            return { x: x0 + Math.cos(a) * l, y: y0 + Math.sin(a) * l };
          };
          const deleteShapes = (ids) => {
            if (READ_ONLY) return;
            const kill = new Set(ids && ids.length ? ids : selShapes);
            if (!kill.size) return;
            pushUndo(false);
            // Подпись живёт только вместе с хозяином: осиротев, она осталась
            // бы висеть в пустоте и ловить нажатия.
            shapesRef.current.forEach(s => { if (s.ct && kill.has(s.ct)) kill.add(s.id); });
            // Стрелку, потерявшую хозяина, НЕ удаляем — замораживаем там, где
            // она была нарисована. Удалили блок, а половина схемы исчезла
            // следом — это выглядит как поломка, а не как удаление блока.
            shapesRef.current.forEach(s => {
              if (!isLineKind(s.k) || kill.has(s.id)) return;
              if (kill.has(s.b1)) freezeArrow(s, 'p1');
              if (kill.has(s.b2)) freezeArrow(s, 'p2');
            });
            shapesRef.current = shapesRef.current.filter(s => !kill.has(s.id));
            setSelShapes([]);
            bumpInk();
            scheduleInkSave('shapes');
          };
          // Порядок слоёв — это просто порядок в списке: мы пишем весь список
          // одной строкой, поэтому дробные индексы из ТЗ здесь решали бы
          // задачу, которой у нас нет.
          const orderShapes = (dir) => {
            if (READ_ONLY) return;
            if (!selShapes.length) return;
            pushUndo(false);
            const sel = new Set(selShapes);
            const keep = shapesRef.current.filter(s => !sel.has(s.id));
            const move = shapesRef.current.filter(s => sel.has(s.id));
            shapesRef.current = dir > 0 ? keep.concat(move) : move.concat(keep);
            bumpInk();
            scheduleInkSave('shapes');
          };
          // --- ВЫГРУЗКА ДОСКИ ---
          // PNG и SVG рисуются из ОДНОГО описания: тот же список карточек,
          // те же команды пути у фигур и штрихов. Иначе выгрузка со временем
          // расходится с тем, что человек видит на экране, — и заметно это
          // становится ровно в тот момент, когда доску уже отправили группе.
          const [exportBusy, setExportBusy] = useState(false);
          const esc = (t) => String(t == null ? '' : t)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
          // Что вообще лежит на доске: карточки в том же порядке, в каком
          // они нарисованы на экране, а под ними — размеры.
          // МИНИ-КАРТА ДОСКИ. Доска большая, а окно маленькое: отъехал
          // в сторону — и не помнишь, где осталась заметка, которую ищешь.
          // Карта показывает ВСЮ доску целиком и рамкой — то, что сейчас
          // на экране; нажатие переносит туда.
          // Рисуется из тех же `boardCards`/`boardBounds`, что и выгрузка
          // доски картинкой: вторая копия обмера разъехалась бы с первой.
          const MINI_W = 168, MINI_H = 112;   // на телефоне меньше, см. разметку
          const miniRef = useRef(null);
          // k и смещение последней отрисовки — по ним считаем, куда ткнули.
          const miniFit = useRef({ k: 1, ox: 0, oy: 0 });
          const miniDrag = useRef(false);
          const [miniOpen, setMiniOpen] = useState(() => {
            try { return localStorage.getItem('cf_mini') !== '0'; } catch (e) { return true; }
          });
          // Любая запись в localStorage — только внутри try.
          useEffect(() => { try { localStorage.setItem('cf_mini', miniOpen ? '1' : '0'); } catch (e) {} }, [miniOpen]);

          const drawMini = () => {
            const cv = miniRef.current;
            if (!cv) return;
            // Размер спрашиваем у самой канвы: на телефоне карта меньше,
            // и держать это число в двух местах — в разметке и здесь —
            // значило бы однажды их рассинхронить.
            const CW = cv.clientWidth || MINI_W, CH = cv.clientHeight || MINI_H;
            const dpr = Math.min(2, window.devicePixelRatio || 1);
            if (cv.width !== Math.round(CW * dpr) || cv.height !== Math.round(CH * dpr)) {
              cv.width = Math.round(CW * dpr); cv.height = Math.round(CH * dpr);
            }
            const ctx = cv.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, CW, CH);

            const host = liveCanvasRef.current;
            const vwPx = host ? host.clientWidth : 0, vhPx = host ? host.clientHeight : 0;
            const v = viewRef.current;
            // Что сейчас видно — в координатах самой доски.
            const vis = { x: -v.x / v.z, y: -v.y / v.z, w: vwPx / v.z, h: vhPx / v.z };
            const box = boardBounds();
            // Карта охватывает и содержимое, и текущий экран: уехав в пустоту,
            // человек иначе не увидел бы на карте ни себя, ни доски.
            const x0 = Math.min(box ? box.x : vis.x, vis.x);
            const y0 = Math.min(box ? box.y : vis.y, vis.y);
            const x1 = Math.max(box ? box.x + box.w : vis.x + vis.w, vis.x + vis.w);
            const y1 = Math.max(box ? box.y + box.h : vis.y + vis.h, vis.y + vis.h);
            const bw = Math.max(1, x1 - x0), bh = Math.max(1, y1 - y0);
            const k = Math.min(CW / bw, CH / bh) * 0.92;
            const ox = (CW - bw * k) / 2 - x0 * k, oy = (CH - bh * k) / 2 - y0 * k;
            miniFit.current = { k, ox, oy };
            const X = x => x * k + ox, Y = y => y * k + oy;

            // Штрихи — тонкой ломаной, без нажима и сглаживания: на карте
            // важно ГДЕ рисовали, а не чем.
            ctx.strokeStyle = 'rgba(240,238,230,.5)'; ctx.lineWidth = 0.7;
            (strokesRef.current || []).forEach(s => {
              const pts = strokePts(s); if (!pts || pts.length < 2) return;
              ctx.beginPath();
              const step = Math.max(1, Math.floor(pts.length / 24));
              for (let i = 0; i < pts.length; i += step) {
                const px = X(pts[i][0]), py = Y(pts[i][1]);
                if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
              }
              ctx.stroke();
            });
            // Фигуры — только габарит.
            ctx.strokeStyle = 'rgba(240,238,230,.35)'; ctx.lineWidth = 0.7;
            (shapesRef.current || []).forEach(s => {
              if (s.ct) return;
              const b = shapeBox(s);
              ctx.strokeRect(X(b.x), Y(b.y), Math.max(1, b.w * k), Math.max(1, b.h * k));
            });
            // Карточки — заливкой, цвет по виду: так на карте видно не только
            // «что-то лежит», но и что именно.
            const COL = { scene: '#d97757', ref: '#7aa2c7', doc: '#a6a39a', sticky: '#fde68a' };
            boardCards().forEach(c => {
              ctx.fillStyle = c.t === 'sticky' ? ((c.o && c.o.color) || COL.sticky) : COL[c.t];
              ctx.globalAlpha = 0.9;
              ctx.fillRect(X(c.x), Y(c.y), Math.max(1.5, c.w * k), Math.max(1.5, c.h * k));
            });
            ctx.globalAlpha = 1;
            // Рамка «где я сейчас».
            ctx.strokeStyle = '#f0eee6'; ctx.lineWidth = 1.2;
            ctx.strokeRect(X(vis.x) + 0.5, Y(vis.y) + 0.5, Math.max(3, vis.w * k), Math.max(3, vis.h * k));
          };

          // Карта обновляется НЕ каждым кадром. Панорама зовёт перерисовку
          // на каждое движение пальца, а обмер доски проходит по всем
          // штрихам и карточкам — на большой доске это отняло бы у жеста
          // ровно то, ради чего панораму когда-то увели в ref. Десяти
          // обновлений в секунду карте хватает с запасом; последнее
          // обязательно догоняет, иначе рамка замерла бы не там, где встали.
          const miniAt = useRef(0);
          const miniPend = useRef(0);
          const drawMiniSoon = () => {
            const now = Date.now();
            if (now - miniAt.current >= 90) { miniAt.current = now; drawMini(); return; }
            if (miniPend.current) return;
            miniPend.current = setTimeout(() => {
              miniPend.current = 0; miniAt.current = Date.now();
              (inkDraw.current.mm || drawMini)();
            }, 90);
          };

          // Нажали по карте — переносим доску туда. Работает и пальцем:
          // ведение продолжает переносить, как в любой карте.
          const miniGoto = (e) => {
            const cv = miniRef.current; if (!cv) return;
            const r = cv.getBoundingClientRect();
            const m = miniFit.current;
            const bx = ((e.clientX - r.left) - m.ox) / m.k;
            const by = ((e.clientY - r.top) - m.oy) / m.k;
            const host = liveCanvasRef.current;
            const vwPx = host ? host.clientWidth : 0, vhPx = host ? host.clientHeight : 0;
            const z = viewRef.current.z;
            applyView(vwPx / 2 - bx * z, vhPx / 2 - by * z, z);
          };

          useEffect(() => { if (miniOpen) requestStatic(); }, [miniOpen, activeBoardId, currentView]);

          const boardCards = () => {
            const out = [];
            boardScenes.forEach(s => out.push({ t: 'scene', o: s, x: s.x, y: s.y, w: 288, h: 150 }));
            references.filter(r => r.boardId === activeBoardId).forEach(r => out.push({ t: 'ref', o: r, x: r.x, y: r.y, w: refW(r), h: refH(r) }));
            boardDocs.forEach(d => out.push({ t: 'doc', o: d, x: d.x, y: d.y, w: docCardW(d), h: docCardH(d) }));
            stickies.filter(s => belongsToBoard(s, activeBoardId)).forEach(s => out.push({ t: 'sticky', o: s, x: s.x, y: s.y, w: stickyW(s), h: stickyH(s) }));
            return out;
          };
          const boardBounds = () => {
            let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
            const eat = (x, y, w, h) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x + w); y1 = Math.max(y1, y + h); };
            boardCards().forEach(c => eat(c.x, c.y, c.w, c.h));
            shapesRef.current.forEach(s => { if (s.ct) return; const b = shapeBox(s); eat(b.x - s.sw, b.y - s.sw, b.w + s.sw * 2, b.h + s.sw * 2); });
            strokesRef.current.forEach(s => { const b = strokeBox(s); eat(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0); });
            // Старую растровую подложку меряем по грубой карте, а не по всему
            // холсту 4000×4000 — иначе выгрузка всегда была бы во всю доску.
            const m = legacyMap.current;
            if (m) for (let j = 0; j < 100; j++) for (let i = 0; i < 100; i++) if (m[j * 100 + i]) eat(i * 40, j * 40, 40, 40);
            if (!isFinite(x0)) return null;
            const pad = 48;
            return { x: x0 - pad, y: y0 - pad, w: (x1 - x0) + pad * 2, h: (y1 - y0) + pad * 2 };
          };
          const cssVar = (n, dflt) => {
            try { const v = getComputedStyle(document.documentElement).getPropertyValue(n).trim(); return v || dflt; }
            catch (e) { return dflt; }
          };
          // Картинки референсов надо дождаться: рисовать их на холст можно
          // только загруженными, иначе в выгрузке будут дыры.
          const loadImages = (urls) => Promise.all(urls.map(u => new Promise(res => {
            if (!u) return res(null);
            const im = new Image();
            im.onload = () => res(im); im.onerror = () => res(null);
            im.src = u;
          })));

          const paintCardOn = (ctx, c, imgs) => {
            const bg = cssVar('--panel', '#242322'), line = 'rgba(255,255,255,0.10)';
            const round = (x, y, w, h, r) => { ctx.beginPath();
              if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); };
            if (c.t === 'sticky') {
              ctx.fillStyle = c.o.color || '#fef08a';
              round(c.x, c.y, c.w, c.h, 8); ctx.fill();
              ctx.fillStyle = '#1a1918'; ctx.font = `13px ${FONT_UI}`; ctx.textBaseline = 'top';
              wrapText(ctx, c.o.text, c.w - 20).slice(0, 12).forEach((ln, i) => ctx.fillText(ln, c.x + 10, c.y + 10 + i * 17));
              return;
            }
            ctx.fillStyle = bg; round(c.x, c.y, c.w, c.h, 10); ctx.fill();
            ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.stroke();
            ctx.textBaseline = 'top';
            if (c.t === 'scene') {
              ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fillRect(c.x, c.y, c.w, 34);
              ctx.strokeStyle = line; ctx.beginPath(); ctx.moveTo(c.x, c.y + 34); ctx.lineTo(c.x + c.w, c.y + 34); ctx.stroke();
              ctx.fillStyle = cssVar('--muted', '#8b8681'); ctx.font = `bold 11px ${FONT_UI}`;
              ctx.fillText('СЦЕНА #' + (c.o.number || '—'), c.x + 12, c.y + 11);
              ctx.fillStyle = '#ffffff'; ctx.font = `bold 14px ${FONT_UI}`;
              wrapText(ctx, c.o.title, c.w - 24).slice(0, 2).forEach((ln, i) => ctx.fillText(ln, c.x + 12, c.y + 46 + i * 19));
              ctx.fillStyle = cssVar('--text-2', '#cfc9c0'); ctx.font = `12px ${FONT_UI}`;
              wrapText(ctx, c.o.content, c.w - 24).slice(0, 3).forEach((ln, i) => ctx.fillText(ln, c.x + 12, c.y + 92 + i * 16));
              return;
            }
            if (c.t === 'doc') {
              ctx.fillStyle = '#ffffff'; ctx.font = `bold 13px ${FONT_UI}`;
              ctx.fillText(String(c.o.title || 'Документ').slice(0, 40), c.x + 12, c.y + 12);
              ctx.fillStyle = cssVar('--text-2', '#cfc9c0'); ctx.font = `12px ${FONT_UI}`;
              wrapText(ctx, c.o.content, c.w - 24).slice(0, Math.max(1, Math.floor((c.h - 44) / 16))).forEach((ln, i) => ctx.fillText(ln, c.x + 12, c.y + 36 + i * 16));
              return;
            }
            const im = imgs[c.o.id];
            const ih = c.h - 24;
            if (im) {
              // Вписываем как на доске: по ширине, с сохранением пропорций.
              const k = Math.min(c.w - 12 / 1, im.width) / im.width;
              const dw = c.w - 12, dh = Math.min(ih - 4, im.height * (dw / im.width));
              ctx.save(); round(c.x + 6, c.y + 6, dw, dh, 6); ctx.clip();
              ctx.drawImage(im, c.x + 6, c.y + 6, dw, dh); ctx.restore();
            }
            ctx.fillStyle = cssVar('--text-2', '#cfc9c0'); ctx.font = `11px ${FONT_UI}`;
            ctx.fillText(String(c.o.label || '').slice(0, 46), c.x + 8, c.y + c.h - 16);
          };

          const exportBoard = async (fmt) => {
            const box = boardBounds();
            if (!box) { showToast('На доске пока нечего выгружать'); return; }
            setExportBusy(true);
            try {
              const cards = boardCards();
              const list = await loadImages(cards.filter(c => c.t === 'ref').map(c => c.o.url));
              const imgs = {};
              cards.filter(c => c.t === 'ref').forEach((c, i) => { if (list[i]) imgs[c.o.id] = list[i]; });
              const bgCol = cssVar('--canvas', '#1a1918');
              const name = `CineFlow_доска_${new Date().toISOString().split('T')[0]}`;
              const save = (blob, ext) => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `${name}.${ext}`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                URL.revokeObjectURL(url);
              };
              if (fmt === 'png') {
                // Множитель ограничиваем по числу точек: доска бывает
                // огромной, и холст на 100 мегапикселей браузер просто
                // не создаст — вернёт пустую картинку без единой ошибки.
                const maxPix = 26e6;
                const k = Math.min(2, Math.sqrt(maxPix / Math.max(1, box.w * box.h)));
                const cv = document.createElement('canvas');
                cv.width = Math.max(1, Math.round(box.w * k));
                cv.height = Math.max(1, Math.round(box.h * k));
                const ctx = cv.getContext('2d');
                ctx.fillStyle = bgCol; ctx.fillRect(0, 0, cv.width, cv.height);
                ctx.setTransform(k, 0, 0, k, -box.x * k, -box.y * k);
                if (legacyCv.current) ctx.drawImage(legacyCv.current, 0, 0);
                cards.forEach(c => paintCardOn(ctx, c, imgs));
                shapesRef.current.forEach(s => paintShape(ctx, s));
                strokesRef.current.forEach(s => paintStroke(ctx, s));
                await new Promise(res => cv.toBlob(b => { if (b) save(b, 'png'); res(); }, 'image/png'));
                showToast(`Доска выгружена · ${cv.width}×${cv.height}`);
              } else {
                const parts = [];
                parts.push(`<svg xmlns="http://www.w3.org/2000/svg" width="${rn(box.w)}" height="${rn(box.h)}" viewBox="${rn(box.x)} ${rn(box.y)} ${rn(box.w)} ${rn(box.h)}">`);
                parts.push(`<rect x="${rn(box.x)}" y="${rn(box.y)}" width="${rn(box.w)}" height="${rn(box.h)}" fill="${bgCol}"/>`);
                if (legacyUrl.current) parts.push(`<image x="0" y="0" width="4000" height="4000" href="${esc(legacyUrl.current)}"/>`);
                const txt = (s, x, y, size, color, weight, anchor) =>
                  `<text x="${rn(x)}" y="${rn(y)}" font-family="Inter, sans-serif" font-size="${size}" fill="${color}"${weight ? ' font-weight="' + weight + '"' : ''}${anchor ? ' text-anchor="' + anchor + '"' : ''}>${esc(s)}</text>`;
                const mc = hitCtx.current || (hitCtx.current = document.createElement('canvas').getContext('2d'));
                cards.forEach(c => {
                  if (c.t === 'sticky') {
                    parts.push(`<rect x="${rn(c.x)}" y="${rn(c.y)}" width="${rn(c.w)}" height="${rn(c.h)}" rx="8" fill="${c.o.color || '#fef08a'}"/>`);
                    mc.font = `13px ${FONT_UI}`;
                    wrapText(mc, c.o.text, c.w - 20).slice(0, 12).forEach((ln, i) => parts.push(txt(ln, c.x + 10, c.y + 22 + i * 17, 13, '#1a1918')));
                    return;
                  }
                  parts.push(`<rect x="${rn(c.x)}" y="${rn(c.y)}" width="${rn(c.w)}" height="${rn(c.h)}" rx="10" fill="${cssVar('--panel', '#242322')}" stroke="rgba(255,255,255,.10)"/>`);
                  if (c.t === 'scene') {
                    parts.push(txt('СЦЕНА #' + (c.o.number || '—'), c.x + 12, c.y + 22, 11, cssVar('--muted', '#8b8681'), 'bold'));
                    mc.font = `bold 14px ${FONT_UI}`;
                    wrapText(mc, c.o.title, c.w - 24).slice(0, 2).forEach((ln, i) => parts.push(txt(ln, c.x + 12, c.y + 58 + i * 19, 14, '#ffffff', 'bold')));
                    mc.font = `12px ${FONT_UI}`;
                    wrapText(mc, c.o.content, c.w - 24).slice(0, 3).forEach((ln, i) => parts.push(txt(ln, c.x + 12, c.y + 103 + i * 16, 12, cssVar('--text-2', '#cfc9c0'))));
                  } else if (c.t === 'doc') {
                    parts.push(txt(String(c.o.title || 'Документ').slice(0, 40), c.x + 12, c.y + 24, 13, '#ffffff', 'bold'));
                    mc.font = `12px ${FONT_UI}`;
                    wrapText(mc, c.o.content, c.w - 24).slice(0, Math.max(1, Math.floor((c.h - 44) / 16))).forEach((ln, i) => parts.push(txt(ln, c.x + 12, c.y + 48 + i * 16, 12, cssVar('--text-2', '#cfc9c0'))));
                  } else if (c.o.url) {
                    parts.push(`<image x="${rn(c.x + 6)}" y="${rn(c.y + 6)}" width="${rn(c.w - 12)}" height="${rn(c.h - 28)}" preserveAspectRatio="xMidYMid slice" href="${esc(c.o.url)}"/>`);
                    parts.push(txt(String(c.o.label || '').slice(0, 46), c.x + 8, c.y + c.h - 6, 11, cssVar('--text-2', '#cfc9c0')));
                  }
                });
                shapesRef.current.forEach(s => {
                  if (isText(s)) {
                    const host = s.ct ? findShape(s.ct) : null;
                    const b = host ? shapeBox(host) : shapeBox(s);
                    const pad = host ? 10 : 0;
                    mc.font = textFont(s);
                    const lines = wrapText(mc, s.tx, Math.max(10, b.w - pad * 2));
                    const lh = textLH(s), ta = s.ta || (host ? 'center' : 'left');
                    const anchor = ta === 'center' ? 'middle' : (ta === 'right' ? 'end' : 'start');
                    const x = ta === 'center' ? b.x + b.w / 2 : (ta === 'right' ? b.x + b.w - pad : b.x + pad);
                    let y = (host ? b.y + (b.h - lines.length * lh) / 2 : b.y) + (s.fz || 20) * 0.95;
                    lines.forEach(ln => { parts.push(txt(ln, x, y, s.fz || 20, s.sc, null, anchor)); y += lh; });
                    return;
                  }
                  const closed = !isLineKind(s.k);
                  const d0 = cmdsD(shapeCmds(s, 0));
                  const dash = s.sd === 'dashed' ? ` stroke-dasharray="${s.sw * 4} ${s.sw * 3.2}"`
                            : s.sd === 'dotted' ? ` stroke-dasharray="0.1 ${s.sw * 2.6}"` : '';
                  const op = s.op === undefined ? 1 : s.op;
                  if (closed && s.bg && s.bg !== 'transparent') {
                    parts.push(`<path d="${d0}" fill="${s.bg}" fill-opacity="${rn(op * (s.fs === 'solid' ? 0.22 : 0.14))}" stroke="none"/>`);
                  }
                  parts.push(`<path d="${d0}" fill="none" stroke="${s.sc}" stroke-width="${s.sw}" stroke-opacity="${rn(op)}" stroke-linecap="round" stroke-linejoin="round"${dash}/>`);
                  if (s.ro) parts.push(`<path d="${cmdsD(shapeCmds(s, 1))}" fill="none" stroke="${s.sc}" stroke-width="${s.sw}" stroke-opacity="${rn(op * 0.75)}" stroke-linecap="round" stroke-linejoin="round"${dash}/>`);
                  if (isLineKind(s.k)) {
                    const q = arrowRoute(s).pts, n = q.length, hs = Math.max(9, s.sw * 4.5);
                    const head = (x, y, fx, fy) => {
                      const a = Math.atan2(y - fy, x - fx), w = 0.42;
                      return `<path d="M${rn(x - Math.cos(a - w) * hs)} ${rn(y - Math.sin(a - w) * hs)}L${rn(x)} ${rn(y)}L${rn(x - Math.cos(a + w) * hs)} ${rn(y - Math.sin(a + w) * hs)}" fill="none" stroke="${s.sc}" stroke-width="${s.sw}" stroke-linecap="round" stroke-linejoin="round"/>`;
                    };
                    if (s.a2 === 'arrow') parts.push(head(q[n - 1][0], q[n - 1][1], q[n - 2][0], q[n - 2][1]));
                    if (s.a1 === 'arrow') parts.push(head(q[0][0], q[0][1], q[1][0], q[1][1]));
                  }
                });
                strokesRef.current.forEach(s => {
                  parts.push(`<path d="${cmdsD(strokeCmds(s))}" fill="${s.c}" fill-opacity="${rn(brushAlpha(s.t))}" fill-rule="nonzero"/>`);
                });
                parts.push('</svg>');
                save(new Blob([parts.join('\n')], { type: 'image/svg+xml' }), 'svg');
                showToast('Доска выгружена в SVG');
              }
            } catch (err) {
              console.warn('exportBoard', err);
              showToast('Не удалось собрать файл: ' + err.message);
            }
            setExportBusy(false);
          };

          // --- РУКОПИСЬ В ПЕЧАТНЫЙ ТЕКСТ ---
          // Гайд, написанный пером на доске, оцифровывается тем же ключом ИИ,
          // что уже вписан в меню «Проект»: модель читает картинку. Своей
          // библиотеки распознавания нет НАМЕРЕННО — то, что работает в
          // браузере офлайн, читает печатный шрифт, а на почерке бесполезно.
          // Значит без связи это не работает, и обещать иное нельзя.
          const OCR_MAX = 1600;
          const OCR_SYSTEM = 'Ты аккуратно расшифровываешь рукописные записи кинооператора. В ответе только сам текст.';
          const OCR_PROMPT = 'На картинке рукописный текст с доски. Перепиши его печатными буквами ТОЧНО как написано: '
            + 'сохрани порядок строк, абзацы и списки. Текст бывает на русском и на английском — не переводи. '
            + 'Ничего не добавляй от себя, не пиши пояснений и заголовков. Неразборчивое слово помечай [?].';

          // Отдаём модели ТОЛЬКО штрихи и только чёрным по белому: доска
          // тёмная, а почерк узнаётся тем лучше, чем ближе картинка к странице
          // блокнота. Карточки, фигуры и подписи в кадр не берём — модель
          // принялась бы читать и их. Старая растровая подложка тоже не идёт:
          // на досках, где пишут пером, её уже нет.
          const inkImage = (box) => {
            const k = Math.min(2.4, OCR_MAX / Math.max(1, Math.max(box.w, box.h)));
            const cv = document.createElement('canvas');
            cv.width = Math.max(8, Math.round(box.w * k));
            cv.height = Math.max(8, Math.round(box.h * k));
            const ctx = cv.getContext('2d');
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cv.width, cv.height);
            ctx.setTransform(k, 0, 0, k, -box.x * k, -box.y * k);
            ctx.fillStyle = '#101010';
            let n = 0;
            strokesRef.current.forEach(s => {
              const b = strokeBox(s);
              if (b.x1 < box.x || b.x0 > box.x + box.w || b.y1 < box.y || b.y0 > box.y + box.h) return;
              // Заливаем сами, а не через paintStroke: у маркера там режим
              // «screen», и на белом листе он исчез бы целиком.
              ctx.fill(strokePath(s));
              n++;
            });
            return n ? cv.toDataURL('image/png') : '';
          };

          const runOcr = async (box) => {
