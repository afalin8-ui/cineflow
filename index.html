              ids.forEach(i => { const f = up.find(s => s.id === i); if (f) syncDoc('stickies', i, f); });
          };

          // Палитра всплывает только над первой из выделенных заметок:
          // при выделении рамкой их иначе было бы десяток разом.
          const paletteStickyId = (() => {
              const sel = stickies.filter(s => belongsToBoard(s, activeBoardId) && selectedWbItems.includes(s.id));
              return sel.length ? sel[0].id : null;
          })();
          

          // Пункты навигации — общий список для рельса и мобильной ленты.
          // В режиме просмотра остаётся только то, чем поделились.
          const navItems = [
            { id: 'notion',     label: 'Сцены',        icon: <Icons.Scene /> },
            { id: 'whiteboard', label: 'Доска',        icon: <Icons.Board /> },
            { id: 'gallery',    label: 'Галерея',      icon: <Icons.Gallery /> },
            { id: 'locations',  label: 'Объекты',      icon: <Icons.Place /> },
            { id: 'master',     label: 'Документ',     icon: <Icons.Master /> },
            { id: 'table',      label: 'КПП',          icon: <Icons.Table /> },
            { id: 'docs',       label: 'Экспликации',  icon: <Icons.Docs /> }
          ].filter(t => {
            if (!READ_ONLY || CF_VIEW_SCOPE === 'all') return true;
            if (CF_VIEW_SCOPE === 'gallery') return t.id === 'gallery';
            if (CF_VIEW_SCOPE === 'board') return t.id === 'whiteboard';
            return true;
          });
          // Приглашение в СВОЮ комнату; голый адрес даёт человеку пустой проект
          const inviteLink = location.origin + location.pathname + '?room=' + encodeURIComponent(appId);
          // Тот же адрес, но БЕЗ кода комнаты: им дают приложение,
          // а не свой проект.
          const plainLink = location.origin + location.pathname;
          // Счётчик кадров. Включается адресом ?fps=1 и по умолчанию не работает
          // вовсе. Нужен, чтобы мерить на НАСТОЯЩЕМ устройстве: на компьютере
          // разработчика цифры другие, и «медленно» без чисел не починить.
          const [fpsNow, setFpsNow] = useState(null);
          // Включается галочкой в меню «Проект» ИЛИ адресом ?fps=1.
          // Галочка обязательна: в установленном на iPad приложении нет
          // адресной строки, и параметр туда просто не набрать.
          const [fpsOn, setFpsOn] = useState(() =>
            localStorage.getItem('cf_fps') === '1' || new URLSearchParams(location.search).has('fps'));
          const toggleFps = () => setFpsOn(v => {
            const n = !v;
            try { localStorage.setItem('cf_fps', n ? '1' : '0'); } catch (e) {}
            if (!n) setFpsNow(null);
            return n;
          });
          useEffect(() => {
            if (!fpsOn) return;
            let frames = 0, last = performance.now(), raf = 0, low = 999;
            const tick = (t) => {
              frames++;
              if (t - last >= 500) {
                const v = Math.round(frames * 1000 / (t - last));
                low = Math.min(low, v);
                setFpsNow({ now: v, low });
                frames = 0; last = t;
              }
              raf = requestAnimationFrame(tick);
            };
            raf = requestAnimationFrame(tick);
            return () => cancelAnimationFrame(raf);
          }, [fpsOn]);
          const syncing = pendingWrites > 0;
          const syncTitle = !isOnline
            ? (syncing ? `Офлайн · ${pendingWrites} правок ждут связи` : 'Офлайн · правки сохраняются на устройстве')
            : (syncing ? `Отправка в облако · ${pendingWrites}` : 'Всё сохранено в облаке');
          const syncDot = !isOnline ? '#f59e0b' : (syncing ? '#fbbf24' : '#10b981');
          // Соединение поднимается заново и само, но ждать этого вслепую —
          // худшее, что можно предложить человеку на площадке. Нажатие на
          // точку связи делает то же самое немедленно.
          const [kicking, setKicking] = useState(false);
          const kickSyncNow = () => {
            if (kicking) return;
            setKicking(true); showToast('Обновляю связь с облаком...');
            Promise.resolve(cfKickSync(true))
              .then(() => showToast('Связь обновлена'))
              .catch(() => showToast('⚠️ Не удалось обновить связь'))
              .finally(() => setKicking(false));
          };
          // Чат открывается ДВУМЯ кнопками: в рельсе (компьютер) и в ленте
          // табов (телефон) — рельса на телефоне не показывается вовсе,
          // и другого пути к чату оттуда нет. Обработчик поэтому ОДИН:
          // разрешение на уведомления спрашивается ровно там, где человек
          // открывает чат, и только при ОТКРЫТИИ: на закрытии окно
          // браузера выглядит непрошеным.
          // Спрашивать можно ТОЛЬКО из обработчика нажатия: без жеста
          // человека браузер запрос молча отклоняет.
          const toggleChat = () => {
            const opening = !showChat;
            setShowChat(opening);
            if (opening && 'Notification' in window && Notification.permission === 'default') {
              try { Notification.requestPermission(); } catch (e) {}
            }
          };
          const ghostBtn = "flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg transition-colors";
          const ghostStyle = { fontSize: '11.5px', color: 'var(--muted)', border: '1px solid var(--border)', minHeight: '28px' };

          // В режиме просмотра имя не спрашиваем — человек просто смотрит.
          // Выход стоит ПОСЛЕ всех хуков и обязан там стоять: React считает
          // хуки по порядку, и ранний выход посреди списка означал, что при
          // появлении окна их становилось на три меньше. Первый же запуск
          // у нового человека валился в аварийный экран и перезапускал
          // приложение с нуля. Любую новую проверку «вместо всего» ставь
          // сюда же, ниже последнего useState/useEffect.
          if (showWelcome && !READ_ONLY) return <WelcomeModal onComplete={(name, role) => { setUserName(name); setUserRole(role); setShowWelcome(false); }} />;

          return (
            <div className="flex h-screen w-screen relative overflow-hidden bg-transparent">
              <ConfirmModal action={confirmAction} onCancel={() => setConfirmAction(null)} />
              {fpsNow && (
                <div className="fixed pointer-events-none" style={{ left: '50%', transform: 'translateX(-50%)', bottom: 8, zIndex: 500, whiteSpace: 'nowrap', background: 'var(--panel)', border: '1px solid var(--border)', borderRadius: 8, padding: '5px 9px', fontFamily: "'JetBrains Mono', monospace", fontSize: 11.5, color: fpsNow.now >= 50 ? '#10b981' : (fpsNow.now >= 30 ? '#fbbf24' : '#f87171') }}>
                  {/* «кадры» в приложении — это раскадровка, поэтому здесь
                      пишем «плавность» и fps: иначе читается как счётчик кадров */}
                  плавность {fpsNow.now} fps <span style={{ color: 'var(--muted-2)' }}>· хуже всего {fpsNow.low}</span>
                </div>
              )}
              {toast && (<div className="fixed bottom-6 left-1/2 -translate-x-1/2 glass-panel text-white px-6 py-3 rounded-full text-sm font-medium z-[400] flex items-center gap-2"><Icons.Bot /> {toast}</div>)}

              {/* Возврат только что удалённого. Держится 15 секунд — этого
                  хватает, чтобы заметить промах, и не мешает дальше работать.
                  Стоит ВЫШЕ обычных сообщений, чтобы они не перекрывались. */}
              {undoBin && (
                <div className="fixed left-1/2 -translate-x-1/2 glass-panel rounded-full z-[401] flex items-center gap-3 pl-5 pr-2 py-2 border-t border-white/10"
                     style={{ bottom: toast ? 76 : 24, maxWidth: 'calc(100vw - 32px)' }}>
                  <span className="text-sm text-zinc-300 truncate">
                    {undoBin.items.length === 1
                      ? `Удалён «${undoBin.items[0].label || 'без названия'}»`
                      : `Удалено ${undoBin.items.length} шт.`}
                  </span>
                  <button onClick={restoreRefs} className="shrink-0 px-4 py-1.5 rounded-full text-xs font-bold"
                          style={{ background: 'var(--accent)', color: 'var(--bg)' }}>Вернуть</button>
                  <button onClick={() => { clearTimeout(undoTimer.current); setUndoBin(null); }}
                          title="Скрыть" className="shrink-0 w-7 h-7 rounded-full text-zinc-500 hover:text-white hover:bg-white/10 flex items-center justify-center text-xs">✕</button>
                </div>
              )}

              {/* РЕЛЬС НАВИГАЦИИ (десктоп) */}
              <nav className="cf-rail hidden md:flex flex-col items-center shrink-0 z-40">
                <div className="flex items-center justify-center shrink-0"
                     style={{ width: 26, height: 26, background: 'var(--accent)', color: 'var(--bg)', borderRadius: 6, fontFamily: "'Lora', Georgia, serif", fontSize: 14, fontWeight: 600, marginBottom: 12 }}>C</div>
                {navItems.map(t => (
                  <button key={t.id} onClick={() => setCurrentView(t.id)} title={t.label}
                          className={`cf-rail-item transition-colors ${currentView === t.id ? 'cf-rail-on' : ''}`}>
                    {t.icon}<span>{t.label}</span>
                  </button>
                ))}
                <div className="mt-auto flex flex-col items-center gap-1.5 cf-edit-only">
                  <button onClick={toggleChat}
                          title="Чат группы"
                          className={`cf-rail-item relative transition-colors ${showChat ? 'cf-rail-on' : ''}`}>
                    <Icons.Chat /><span>Чат</span>
                    {unreadCount > 0 && (
                      <span className="absolute flex items-center justify-center font-bold rounded-full"
                            style={{ top: 2, right: 8, minWidth: 15, height: 15, padding: '0 4px', fontSize: 9.5, background: 'var(--accent)', color: 'var(--bg)' }}>{unreadCount}</span>
                    )}
                  </button>
                  <button onClick={() => setShowAgentModal(true)} title="Агент КПП"
                          className="flex items-center justify-center rounded-lg transition-colors hover:bg-white/5"
                          style={{ width: 36, height: 36, color: 'var(--muted)' }}>
                    <Icons.Bot />
                  </button>
                </div>
              </nav>

              <div className="flex flex-col flex-1 min-w-0">
                {/* ШАПКА — только то, что не навигация */}
                <header className="flex items-center justify-between shrink-0 z-40 gap-3"
                        style={{ minHeight: 'var(--header-h)', padding: '0 16px', background: 'var(--panel-2)', borderBottom: '1px solid var(--border)' }}>
                  <div className="flex items-center gap-3 min-w-0">
                    <span style={{ fontFamily: "'Lora', Georgia, serif", fontSize: 16, fontWeight: 600, color: 'var(--text)' }}>CineFlow</span>
                    {/* Точка связи заодно и кнопка: нажать, если кажется,
                        что телефон показывает вчерашнее. Площадь нажатия
                        сделана пальцем, сама точка осталась мелкой */}
                    <button onClick={kickSyncNow} title={syncTitle + ' · нажмите, чтобы обновить связь'}
                            className="shrink-0 flex items-center justify-center -m-2 p-2"
                            style={{ opacity: kicking ? 0.4 : 1 }}>
                      <span className="rounded-full block" style={{ width: 6, height: 6, background: syncDot }}></span>
                    </button>
                    <span className="cf-meta hidden lg:inline truncate">{scenes.length} сцен · {storyboard.length} кадров</span>
                  </div>
                  <div className="flex items-center gap-2 shrink-0">
                    {READ_ONLY ? (
                      // Надпись сделана КНОПКОЙ намеренно. Раньше человек,
                      // которому прислали ссылку для просмотра, видел пустой
                      // проект без «Проекта» и «Доступа» и не понимал, почему
                      // ничего не нажимается и куда делись кнопки. Выхода
                      // из этого режима не было вовсе.
                      <button onClick={() => setShowViewInfo(true)}
                              title="Почему нельзя ничего менять"
                              className="cf-meta flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg transition-colors hover:bg-white/5"
                              style={{ color: 'var(--accent)', border: '1px solid var(--accent-line, var(--border))', minHeight: 28 }}>
                        Только просмотр{CF_SNAPSHOT ? ' · снимок' : ''} <span style={{ opacity: .7 }}>?</span>
                      </button>
                    ) : (
                      <React.Fragment>
                        <button onClick={() => setShowProjectModal(true)} className={ghostBtn} style={ghostStyle}><Icons.Folder /> Проект</button>
                        <button onClick={() => setShowShareModal(true)} className={ghostBtn} style={ghostStyle}><Icons.Link /> Доступ</button>
                      </React.Fragment>
                    )}
                  </div>
                </header>

                {/* ЛЕНТА ТАБОВ (телефон) */}
                <div className="md:hidden flex items-stretch shrink-0"
                     style={{ background: 'var(--panel-3)', borderBottom: '1px solid var(--border)' }}>
                  <div className="flex-1 min-w-0 flex overflow-x-auto hide-scrollbar snap-x nav-scroll-hint">
                    {navItems.map(t => (
                      <button key={t.id} onClick={() => setCurrentView(t.id)}
                              className="snap-center shrink-0 flex items-center gap-1.5 px-4 min-h-[44px] text-xs font-semibold transition-colors"
                              style={currentView === t.id ? { background: 'var(--accent)', color: 'var(--bg)' } : { color: 'var(--muted)' }}>
                        {t.icon}{t.label}
                      </button>
                    ))}
                  </div>
                  {/* Чат и агент КПП жили ТОЛЬКО в рельсе, а рельс на телефоне
                      не показывается — значит, с телефона до них было не
                      добраться вовсе. Заодно не спрашивалось и разрешение
                      на уведомления: его просит кнопка чата.
                      Кнопки закреплены СПРАВА, вне прокручиваемой ленты:
                      уехав в прокрутку, чат остался бы так же ненайденным. */}
                  <div className="shrink-0 flex items-center gap-0.5 px-1.5 cf-edit-only"
                       style={{ borderLeft: '1px solid var(--border)' }}>
                    <button onClick={toggleChat} title="Чат группы"
                            className="relative flex items-center justify-center rounded-lg transition-colors"
                            style={{ width: 40, minHeight: 44, color: showChat ? 'var(--accent)' : 'var(--muted)' }}>
                      <Icons.Chat />
                      {unreadCount > 0 && (
                        <span className="absolute flex items-center justify-center font-bold rounded-full"
                              style={{ top: 4, right: 2, minWidth: 15, height: 15, padding: '0 4px', fontSize: 9.5, background: 'var(--accent)', color: 'var(--bg)' }}>{unreadCount}</span>
                      )}
                    </button>
                    <button onClick={() => setShowAgentModal(true)} title="Агент КПП"
                            className="flex items-center justify-center rounded-lg transition-colors"
                            style={{ width: 40, minHeight: 44, color: 'var(--muted)' }}>
                      <Icons.Bot />
                    </button>
                  </div>
                </div>

              <div className="flex flex-1 overflow-hidden relative z-10">
                <div className="flex-1 overflow-hidden relative">
                  
                  {/* СЦЕНЫ И РАСКАДРОВКА */}
                  <div className={`h-full w-full ${currentView === 'notion' ? 'block' : 'hidden'}`}>
                    <div className="flex flex-col md:flex-row h-full max-w-7xl mx-auto p-2 md:p-6 gap-3 md:gap-6 overflow-hidden">
                      <div className="w-full md:w-64 glass-panel p-2 md:p-4 rounded-lg flex flex-row md:flex-col space-x-2 md:space-x-0 md:space-y-1.5 overflow-x-auto md:overflow-y-auto shrink-0 hide-scrollbar snap-x">
                        {sortedScenes.map(s => (
                          <button key={s.id} onClick={() => setActiveSceneId(s.id)} className={`snap-center whitespace-nowrap md:whitespace-normal shrink-0 md:w-full text-left px-3.5 py-2.5 rounded-lg text-sm transition-all border ${activeSceneId === s.id ? 'bg-indigo-600/30 text-white border-indigo-500/40 font-bold' : 'bg-transparent text-zinc-400 border-transparent hover:bg-white/5'}`}>
                            <span className="font-mono text-indigo-400 mr-2 text-xs">#{s.number}</span> {s.title || 'Без названия'}
                          </button>
                        ))}
                        {/* Номер в название НЕ вписываем: он живёт в поле number
                            и виден чипом рядом. Две копии одного номера расходились. */}
                        <button onClick={() => { const num = nextSceneNumber(); const newS = { id: `sc-${Date.now()}`, number: num, title: 'НОВАЯ СЦЕНА', content: '', x: (150 - canvasOffset.x) / zoom, y: (150 - canvasOffset.y) / zoom, date: '', gear: {}, lightGear: {}, lightSchemeId: null }; setScenes([...scenes, newS]); syncDoc('scenes', newS.id, newS); setActiveSceneId(newS.id); }} className="snap-center md:w-full text-center px-3.5 py-2.5 rounded-lg text-sm transition-all border border-dashed border-zinc-700 text-zinc-500 hover:text-white shrink-0 font-medium">+ Добавить сцену</button>
                      </div>

                      {activeSceneId && scenes.find(s => s.id === activeSceneId) && (() => {
                        const s = scenes.find(sc => sc.id === activeSceneId);
                        const frames = storyboard.filter(f => f.sceneId === s.id);

                                      <button onClick={() => { setActiveDocId(d.id); setActiveSchemeId(null); setCurrentView('docs'); }}

                                      <textarea value={st.text} onChange={(e) => { const up = stickies.map(x => x.id === st.id ? { ...x, text: e.target.value } : x); setStickies(up); syncDoc('stickies', st.id, up.find(x => x.id === st.id)); }}

                                          <button key={c} onClick={() => paintStickies(st.id, c)} title="Цвет заметки"
                                                  style={{ background: c, width: 14, height: 14 }}
                                                  className={`cf-edit-only rounded-full border ${st.color === c ? 'border-black/50' : 'border-black/10 hover:border-black/30'} transition-colors`} />
                                        ))}
                                      </div>
                                    </div>
                                  ))}
                                </div>
                              )}
                            </div>
                          </div>
                        );
                      })()}
                    </div>
                  </div>

                  {/* ГАЛЕРЕЯ РЕФЕРЕНСОВ */}
                  <div className={`h-full w-full ${currentView === 'gallery' ? 'flex' : 'hidden'}`}>

                      <div className="hidden md:flex flex-col shrink-0" style={{ width: 212, background: 'var(--panel-3)', borderRight: '1px solid var(--border)' }}>
                        <div className="flex items-center justify-between px-4 shrink-0" style={{ minHeight: 44, borderBottom: '1px solid var(--border)' }}>
                          <span className="cf-eyebrow">Теги</span>
                          <div className="flex items-center gap-2">
                            {tagSearch && <button onClick={() => setTagSearch('')} style={{ color: 'var(--accent)', fontSize: 11.5 }}>Сбросить</button>}
                            <button onClick={() => setGalleryTagsOpen(false)} title="Свернуть"
                                    className="flex items-center justify-center rounded shrink-0"
                                    style={{ width: 22, height: 22, border: '1px solid var(--border)', color: 'var(--muted-2)', fontSize: 12 }}>‹</button>
                          </div>
                        </div>
                        <div className="flex-1 overflow-y-auto">
                          {/* ПАПКИ */}
                          <div style={{ borderBottom: '1px solid var(--border)' }}>
                            <div className="flex items-center justify-between px-4 pt-3 pb-1">

                              <button onClick={() => {
                                        const name = prompt('Название папки');
                                        if (name && name.trim()) setActiveFolder(name.trim());

                                      style={{ color: 'var(--muted-2)', fontSize: 14, lineHeight: 1 }}>+</button>
                            </div>
                            {[['', 'Все', references.length], ...folderCounts.map(([f, n]) => [f, f, n]), ...(noFolderCount ? [['__none__', 'Без папки', noFolderCount]] : [])]
                              .map(([key, label, count]) => {
                                const on = activeFolder === key;
                                return (
                                  <button key={key || 'all'} onClick={() => setActiveFolder(key)}
                                          className="w-full flex items-center justify-between gap-2 px-4 text-left transition-colors"
                                          style={{ minHeight: 38, background: on ? 'var(--accent)' : 'transparent', color: on ? 'var(--bg)' : 'var(--text-2)' }}>
                                    <span className="truncate flex items-center gap-1.5" style={{ fontSize: 12.5 }}>
                                      <Icons.Folder /> {label}
                                    </span>
                                    <span className="cf-meta shrink-0" style={on ? { color: 'var(--bg)' } : undefined}>{count}</span>
                                  </button>
                                );
                              })}
                            {activeFolder && activeFolder !== '__none__' && !folderCounts.some(([f]) => f === activeFolder) && (
                              <p className="px-4 pb-3" style={{ fontSize: 11.5, color: 'var(--muted-2)', lineHeight: 1.5 }}>

                              </p>

                          </div>

                          <div className="px-4 pt-3 pb-1"><span className="cf-eyebrow">Теги</span></div>
                          {tagCounts.map(([tag, count]) => {

                            return (
                              <button key={tag} onClick={() => setTagSearch(on ? '' : tag)}
                                      className="w-full flex items-center justify-between gap-2 px-4 text-left transition-colors"
                                      style={{ minHeight: 44, borderBottom: '1px solid var(--border-soft)', background: on ? 'var(--accent)' : 'transparent', color: on ? 'var(--bg)' : 'var(--text-2)' }}>
                                <span className="truncate" style={{ fontSize: 13 }}>{tag}</span>
                                <span className="cf-meta shrink-0" style={on ? { color: 'var(--bg)' } : undefined}>{count}</span>
                              </button>
                            );
                          })}
                          {tagCounts.length === 0 && (
                            <p className="px-4 py-4" style={{ fontSize: 12, color: 'var(--muted-2)', lineHeight: 1.5 }}>
                              Тегов пока нет. Добавьте их на карточке референса — поле «+ тег».
                            </p>
                          )}
                        </div>
                        <div className="p-3 shrink-0 cf-edit-only" style={{ borderTop: '1px solid var(--border)' }}>
                          <label className="w-full flex items-center justify-center gap-2 cursor-pointer rounded-lg transition-colors hover:bg-white/5"
                                 style={{ minHeight: 44, background: 'var(--panel)', border: '1px solid var(--border)', fontSize: 12, color: 'var(--text-2)' }}>
                            <Icons.Gallery /> Загрузить референсы
                            <input type="file" multiple accept="image/*" className="hidden" onChange={(e) => handleMultiFileUpload(e.target.files, null)} />
                          </label>
                        </div>
                      </div>
                    ) : (
                      <div className="hidden md:flex cf-strip shrink-0" onClick={() => setGalleryTagsOpen(true)} title="Развернуть теги">
                        <span style={{ writingMode: 'horizontal-tb', color: 'var(--muted-2)', fontSize: 12 }}>›</span>
                        <span>Теги</span>
                      </div>
                    )}

                    {/* СЕТКА РЕФЕРЕНСОВ */}
                    <div className="flex-1 min-w-0 overflow-y-auto">
                     <div className="p-4 md:p-6 pb-24 space-y-5">
                        <div className="flex flex-wrap items-center justify-between gap-3">
                            <div className="flex items-baseline gap-3 min-w-0">
                              <span className="cf-eyebrow truncate">{[activeFolder === '' ? null : (activeFolder === '__none__' ? 'Без папки' : activeFolder), tagSearch ? `тег: ${tagSearch}` : null].filter(Boolean).join(' · ') || 'Все референсы'}</span>
                              <span className="cf-meta shrink-0">{visibleRefs.length} из {references.length}</span>
                            </div>
                            <div className="flex items-center gap-2 shrink-0 cf-edit-only">
                              {visibleRefs.length > 0 && (
                                <button onClick={() => setSelectedRefIds(allVisibleSelected ? [] : visibleRefs.map(r => r.id))}
                                        className="cf-chip shrink-0">{allVisibleSelected ? 'Снять выделение' : 'Выделить все'}</button>
                              )}
                              <label className="md:hidden flex items-center gap-2 cursor-pointer rounded-lg px-4 shrink-0"
                                     style={{ minHeight: 44, background: 'var(--panel)', border: '1px solid var(--border)', fontSize: 12, color: 'var(--text-2)' }}>
                                  + Загрузить
                                  <input type="file" multiple accept="image/*" className="hidden" onChange={(e) => handleMultiFileUpload(e.target.files, null)} />
                              </label>
                            </div>
                        </div>

                        {/* панель массовых действий — появляется, когда что-то выделено */}
                        {selectedRefIds.length > 0 && !READ_ONLY && (
                          <div className="rounded-lg p-3 flex flex-col lg:flex-row lg:items-center gap-3 sticky top-0 z-30"
                               style={{ background: 'var(--panel)', border: '1px solid var(--accent-line)' }}>
                            <span className="flex items-center gap-2 shrink-0" style={{ fontSize: 12.5, color: 'var(--text)' }}>
                              <span className="rounded-md px-2 py-0.5 font-mono font-bold" style={{ background: 'var(--accent)', color: 'var(--bg)', fontSize: 11.5 }}>{selectedRefIds.length}</span>
                              выбрано
                            </span>
                            <div className="flex flex-1 flex-col sm:flex-row gap-2 flex-wrap">
                              <div className="flex gap-2 flex-1 min-w-[200px]">
                                <div className="relative flex-1 min-w-0">
                                  <input type="text" value={bulkTagInput} onChange={e => setBulkTagInput(e.target.value)}
                                         onKeyDown={e => { if (e.key === 'Enter') bulkAddTag(); }}
                                         placeholder="Общий тег для всех..." className="glass-input rounded-md px-3 w-full"
                                         style={{ minHeight: 38, fontSize: 12 }} />
                                  {/* Подсказки из уже использованных: набирать тег
                                      заново каждый раз незачем, а разнобой
                                      («ночь» и «Ночь») ломает поиск по тегу. */}
                                  {(() => {
                                    const hints = tagHints(bulkTagInput, []);
                                    if (!hints.length) return null;
                                    return (
                                      <div className="flex gap-1 mt-1.5 overflow-x-auto hide-scrollbar">
                                        {hints.slice(0, 4).map(t => (
                                          <button key={t} onClick={() => setBulkTagInput(t)} className="cf-chip shrink-0" style={{ fontSize: 11 }}>{t}</button>
                                        ))}
                                      </div>
                                    );
                                  })()}
                                </div>
                                <button onClick={bulkAddTag} className="cf-chip shrink-0 self-start" style={{ minHeight: 38 }}>+ тег</button>
                              </div>
                              <select value="" onChange={(e) => {
                                        if (e.target.value === '__new__') { const name = prompt('Новая папка'); if (name && name.trim()) bulkMoveToFolder(name.trim()); }
                                        else if (e.target.value === '__none__') bulkMoveToFolder('');
                                        else if (e.target.value) bulkMoveToFolder(e.target.value);
                                      }}
                                      className="rounded-md px-2 min-w-[170px]"
                                      style={{ minHeight: 38, fontSize: 12, background: 'var(--bg)', border: '1px solid var(--border)', color: 'var(--text-2)' }}>
                                <option value="">Переместить в папку...</option>
                                {folderCounts.map(([f]) => <option key={f} value={f}>{f}</option>)}
                                <option value="__new__">+ новая папка…</option>
                                <option value="__none__">— Без папки —</option>
                              </select>
                              <button onClick={bulkPutOnBoard} className="cf-chip shrink-0 flex items-center gap-1.5"><Icons.Board /> На доску</button>
                            </div>
                            <div className="flex gap-2 shrink-0">
                              <button onClick={bulkDeleteRefs} className="cf-chip shrink-0 flex items-center gap-1.5" style={{ color: '#f87171', borderColor: 'rgba(248,113,113,.35)' }}><Icons.Trash /> Удалить</button>
                              <button onClick={() => setSelectedRefIds([])} className="cf-chip shrink-0">Отменить</button>
                            </div>
                          </div>
                        )}

                        {/* папки на телефоне — горизонтальной лентой (боковая колонка скрыта на узких экранах) */}
                        <div className="md:hidden flex gap-2 overflow-x-auto hide-scrollbar pb-1">
                          {[['', 'Все', references.length], ...folderCounts.map(([f, n]) => [f, f, n]), ...(noFolderCount ? [['__none__', 'Без папки', noFolderCount]] : [])]
                            .map(([key, label, count]) => {
                              const on = activeFolder === key;
                              return (
                                <button key={key || 'all'} onClick={() => setActiveFolder(key)}
                                        className={`cf-chip shrink-0 flex items-center gap-1.5 ${on ? 'cf-chip-accent' : ''}`}>
                                  <Icons.Folder /> {label} · {count}
                                </button>
                              );
                            })}
                          <button onClick={() => { const name = prompt('Название папки'); if (name && name.trim()) setActiveFolder(name.trim()); }}
                                  className="cf-chip shrink-0 cf-edit-only" style={{ color: 'var(--muted-2)' }}>+ папка</button>
                        </div>

                        {/* теги на телефоне — горизонтальной лентой */}
                        {tagCounts.length > 0 && (
                          <div className="md:hidden flex gap-2 overflow-x-auto hide-scrollbar pb-1">
                            {tagSearch && <button onClick={() => setTagSearch('')} className="cf-chip shrink-0" style={{ color: 'var(--accent)', borderColor: 'var(--accent-line)' }}>Сбросить</button>}
                            {tagCounts.map(([tag, count]) => {
                              const on = tagSearch.toLowerCase() === tag;
                              return (
                                <button key={tag} onClick={() => setTagSearch(on ? '' : tag)} className={`cf-chip shrink-0 ${on ? 'cf-chip-accent' : ''}`}>
                                  {tag} · {count}
                                </button>
                              );
                            })}
                          </div>
                        )}

                        {/* Сетка собирается, только пока галерея открыта: держать
                            сотню картинок в памяти круглосуточно на планшете дорого.
                            Прокрутка при уходе теряется, фильтры и выделение — нет. */}
                        <div className="grid gap-4" style={{ gridTemplateColumns: 'repeat(auto-fill, minmax(212px, 1fr))' }}>
                            {currentView === 'gallery' && visibleRefs.map(ref => {
                              const isSel = selectedRefIds.includes(ref.id);
                              return (
                                <div key={ref.id} className={`cf-ref-card glass-panel rounded-lg overflow-hidden flex flex-col group border-t transition-all ${isSel ? 'ring-2' : 'border-white/10'}`} style={isSel ? { borderColor: 'var(--accent)', boxShadow: '0 0 0 2px var(--accent)' } : undefined}>
                                    <div className="aspect-square bg-black/60 relative cursor-pointer flex items-center justify-center overflow-hidden" onClick={() => { if (selectedRefIds.length > 0) { toggleRefSelection(ref.id); } else { setLightboxData({ scope: visibleRefs.map(x => x.id), scopeLabel: [activeFolder === '' ? null : (activeFolder === '__none__' ? 'Без папки' : activeFolder), tagSearch ? `тег: ${tagSearch}` : null].filter(Boolean).join(' · ') || 'Вся галерея', currentId: ref.id }); } }}>
                                        <div className="absolute inset-0 bg-cover bg-center blur-md opacity-30" style={bgStyle(ref.id, ref.url)}></div>
                                        <button onClick={(e) => { e.stopPropagation(); toggleRefSelection(ref.id); }}
                                                title={isSel ? 'Снять выделение' : 'Выделить'}
                                                className={`cf-edit-only absolute bottom-2 left-2 w-7 h-7 rounded-lg z-20 flex items-center justify-center transition-all ${isSel ? '' : 'opacity-0 group-hover:opacity-100'}`}
                                                style={isSel ? { background: 'var(--accent)', color: 'var(--bg)' } : { background: 'rgba(0,0,0,.8)', color: 'var(--muted)', border: '1px solid var(--border)' }}>
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                                        </button>
                                        <button onClick={(e) => { e.stopPropagation(); setConfirmAction({
                                                    title: 'Удалить референс?',
                                                    message: (ref.label ? `«${ref.label}» удалится` : 'Референс удалится') + ' из проекта. Сразу после удаления его можно будет вернуть кнопкой.',
                                                    onConfirm: () => deleteRefs([ref]) }); }}
                                                title="Удалить референс"
                                                className="cf-edit-only absolute top-2 right-2 bg-black/80 backdrop-blur text-zinc-400 hover:text-red-400 w-7 h-7 rounded-lg opacity-0 group-hover:opacity-100 transition-all text-xs z-20 flex items-center justify-center"><Icons.Trash/></button>
                                        {!READ_ONLY && (() => {
                                          const onBoard = !!ref.boardId;
                                          const boardName = onBoard ? ((sortedBoards.find(b => b.id === ref.boardId) || {}).title || 'доске') : '';
                                          return (
                                            <button onClick={(e) => {
                                                      e.stopPropagation();
                                                      const nextBoard = onBoard ? '' : activeBoardId;
                                                      const placed = { ...ref, boardId: nextBoard,
                                                        x: (260 - canvasOffset.x) / zoom + Math.random() * 60,
                                                        y: (240 - canvasOffset.y) / zoom + Math.random() * 60 };
                                                      setReferences(references.map(r => r.id === ref.id ? placed : r));
                                                      syncDoc('references', ref.id, placed);
                                                      showToast(onBoard ? 'Убрано с доски · осталось в галерее' : 'Добавлено на доску');
                                                    }}
                                                    title={onBoard ? `Уже на доске «${boardName}» — убрать` : 'Положить на текущую доску'}
                                                    className="absolute top-2 left-2 backdrop-blur w-7 h-7 rounded-lg transition-all text-xs z-20 flex items-center justify-center opacity-0 group-hover:opacity-100"
                                                    style={onBoard
                                                      ? { background: 'var(--accent)', color: 'var(--bg)', opacity: 1 }
                                                      : { background: 'rgba(0,0,0,.8)', color: 'var(--muted)' }}>
                                              <Icons.Board/>
                                            </button>
                                          );
                                        })()}
                                        <img src={ref.url} className="w-full h-full object-contain relative z-10" draggable="false" />
                                        {/* Панораму надо отличать от обычного кадра на общем
                                            листе: плоская развёртка сама по себе выглядит
                                            просто странно снятой фотографией. */}
                                        {ref.pano && (
                                          <span className="absolute bottom-2 right-2 z-20 rounded-md pointer-events-none"
                                                style={{ background: 'rgba(0,0,0,.75)', color: 'var(--accent)',
                                                         fontSize: 10, fontWeight: 700, letterSpacing: '.04em', padding: '2px 5px' }}>360°</span>
                                        )}
                                    </div>
                                    <div className="p-3 space-y-2 bg-black/30">
                                        <input type="text" value={ref.label} onChange={(e) => { const up = references.map(r=>r.id===ref.id?{...r,label:e.target.value}:r); setReferences(up); syncDoc('references', ref.id, up.find(r=>r.id===ref.id)); }} className="bg-transparent w-full text-sm font-bold text-zinc-200 focus:outline-none placeholder-zinc-600" placeholder="Название референса..." />
                                        <select value={(ref.folder || '')}
                                                onChange={(e) => {
                                                  if (e.target.value === '__new__') {
                                                    const name = prompt('Новая папка');
                                                    if (name && name.trim()) moveToFolder(ref, name.trim());
                                                  } else moveToFolder(ref, e.target.value);
                                                }}
                                                className="w-full rounded-md px-2 py-1"
                                                style={{ fontSize: 11, background: 'var(--bg)', border: '1px solid var(--border)', color: (ref.folder ? 'var(--text-2)' : 'var(--muted-2)') }}>
                                          <option value="">Без папки</option>
                                          {folderCounts.map(([f]) => <option key={f} value={f}>{f}</option>)}
                                          {activeFolder && activeFolder !== '__none__' && !folderCounts.some(([f]) => f === activeFolder) && <option value={activeFolder}>{activeFolder}</option>}
                                          <option value="__new__">+ новая папка…</option>
                                        </select>
                                        {/* Теги видны ВСЕ — в этом весь смысл общего листа:
                                            пробегаешь глазами и сразу понимаешь, что чем
                                            размечено. Прятать их в одну строку с прокруткой
                                            ПРОБОВАЛИ и откатили. Экономим иначе: чипы
                                            плотнее, поле ввода узкое и расширяется при наборе. */}
                                        <div className="flex flex-wrap items-center gap-1">
                                            {(ref.tags || []).map((tag, idx) => (
                                                <span key={idx} className="bg-indigo-900/40 text-indigo-200 rounded flex items-center gap-0.5 whitespace-nowrap"
                                                      style={{ fontSize: 10.5, padding: '1px 5px', lineHeight: 1.45 }}>
                                                    {tag} <button onClick={() => removeTagFrom(ref, tag)} className="hover:text-white cf-edit-only" style={{ fontSize: 9, opacity: .75 }}>✕</button>
                                                </span>
                                            ))}
                                            <span className="cf-edit-only"><TagInput ref_={ref} hints={tagHints} onAdd={addTagTo} narrow /></span>
                                        </div>
                                    </div>
                                </div>
                              );
                            })}
                        </div>
                     </div>
                    </div>
                  </div>

                  {/* ОБЪЕКТЫ — места съёмки со скаутинга.
                      Собирается только когда открыт: у объекта могут быть
                      десятки фотографий, и держать их в памяти круглосуточно
                      незачем — ровно как у мастер-дока и галереи. */}
                  <div className={`h-full w-full ${currentView === 'locations' ? 'block' : 'hidden'}`}>
                    {currentView === 'locations' && (
                    <div className="flex flex-col md:flex-row h-full max-w-7xl mx-auto p-2 md:p-6 gap-3 md:gap-6 overflow-hidden">
                      <div className="w-full md:w-64 glass-panel p-2 md:p-4 rounded-lg flex flex-row md:flex-col space-x-2 md:space-x-0 md:space-y-1.5 overflow-x-auto md:overflow-y-auto shrink-0 hide-scrollbar snap-x">
                        {sortedLocations.map(l => {
                          const cnt = locationPhotos(l.id).length;
                          return (
                            <button key={l.id} onClick={() => setActiveLocationId(l.id)}
                                    className={`snap-center whitespace-nowrap md:whitespace-normal shrink-0 md:w-full text-left px-3.5 py-2.5 rounded-lg text-sm transition-all border ${activeLocationId === l.id ? 'bg-indigo-600/30 text-white border-indigo-500/40 font-bold' : 'bg-transparent text-zinc-400 border-transparent hover:bg-white/5'}`}>
                              {l.name || 'Без названия'}
                              <span className="font-mono text-indigo-400 ml-2 text-[11px]">{cnt ? `${cnt} фото` : '—'}</span>
                            </button>
                          );
                        })}
                        <button onClick={addLocation}
                                className="cf-edit-only snap-center md:w-full text-center px-3.5 py-2.5 rounded-lg text-sm transition-all border border-dashed border-zinc-700 text-zinc-500 hover:text-white shrink-0 font-medium">+ Добавить объект</button>
                        {sortedLocations.length > 0 && (
                          <button onClick={() => requestPrint('locations')}
                                  title="Отчёт со скаутинга: адреса, заметки и фотографии по всем объектам"
                                  className="snap-center md:w-full text-center px-3.5 py-2.5 rounded-lg text-xs transition-all border border-white/10 text-zinc-400 hover:text-white hover:bg-white/5 shrink-0 font-semibold md:mt-2">
                            Отчёт по объектам (PDF)
                          </button>
                        )}
                      </div>

                      {!sortedLocations.length ? (
                        <div className="flex-1 glass-panel rounded-lg flex items-center justify-center p-8">
                          <div className="text-center max-w-md">
                            <p className="text-zinc-300 text-sm font-semibold mb-2">Объектов пока нет</p>
                            <p className="text-zinc-500 text-[13px] leading-relaxed">
                              Объект — это место съёмки: квартира, двор, лестница. Сюда складывают
                              фотографии со скаутинга, заметки и список сцен, которые там снимаются.
                            </p>
                          </div>
                        </div>
                      ) : activeLocationId && locations.find(l => l.id === activeLocationId) && (() => {
                        const l = locations.find(x => x.id === activeLocationId);
                        const photos = locationPhotos(l.id);
                        const linked = l.sceneIds || [];
                        return (
                          <div className="flex-1 glass-panel p-5 md:p-8 rounded-lg overflow-y-auto space-y-6 border-t border-white/10">
                            <div className="flex flex-col sm:flex-row sm:justify-between sm:items-start border-b border-white/10 pb-4 gap-3">
                              <input type="text" value={l.name || ''} onChange={(e) => updateLocation(l.id, 'name', e.target.value)}
                                     placeholder="Название объекта"
                                     className="bg-transparent text-xl md:text-2xl font-bold text-white focus:outline-none w-full border-b border-transparent focus:border-indigo-400/50 transition-colors placeholder-zinc-600"
                                     style={{ fontFamily: "'Lora', Georgia, serif" }} />
                              <button onClick={() => deleteLocation(l.id)}
                                      className="cf-edit-only text-xs text-red-400 hover:text-white hover:bg-red-500/20 px-3 py-1.5 rounded-lg transition-colors border border-transparent font-semibold flex items-center gap-1 self-end sm:self-auto shrink-0">
                                <Icons.Trash /> Удалить объект
                              </button>
                            </div>

                            <div className="space-y-1.5">
                              <label className="text-xs font-bold text-zinc-400 uppercase tracking-widest block ml-1">Адрес</label>
                              <input type="text" value={l.address || ''} onChange={(e) => updateLocation(l.id, 'address', e.target.value)}
                                     placeholder="Улица, дом, как заезжать"
                                     className="glass-input w-full px-3 py-2.5 rounded-lg text-sm text-zinc-200" />
                            </div>

                            {/* Координаты. Отдельной строкой, потому что нужны
                                двум разным вещам: показать точку на карте
                                и посчитать солнце. Можно найти по адресу,
                                можно вставить из карт руками. */}
                            <div className="space-y-1.5">
                              <label className="text-xs font-bold text-zinc-400 uppercase tracking-widest block ml-1">Координаты</label>
                              <div className="flex flex-col sm:flex-row gap-2">
                                <input type="text" value={l.coords || ''} onChange={(e) => updateLocation(l.id, 'coords', e.target.value)}
                                       placeholder="55.75583, 37.61730"
                                       className="glass-input flex-1 px-3 py-2.5 rounded-lg text-sm text-zinc-200 font-mono" />
                                <div className="flex gap-2 shrink-0">
                                  <button onClick={() => findCoords(l)} disabled={geoBusy === l.id || !(l.address || '').trim()}
                                          title={(l.address || '').trim() ? 'Найти координаты по адресу' : 'Сначала впишите адрес'}
                                          className="cf-edit-only px-3 py-2.5 rounded-lg text-xs font-bold transition-colors border border-white/10 text-zinc-300 hover:bg-white/10 disabled:opacity-40 whitespace-nowrap">
                                    {geoBusy === l.id ? 'Ищу...' : 'Найти по адресу'}
                                  </button>
                                  {parseCoords(l.coords) && (
                                    <a href={`https://www.openstreetmap.org/?mlat=${parseCoords(l.coords).lat}&mlon=${parseCoords(l.coords).lon}#map=17/${parseCoords(l.coords).lat}/${parseCoords(l.coords).lon}`}
                                       target="_blank" rel="noopener"
                                       className="px-3 py-2.5 rounded-lg text-xs font-bold transition-colors border border-white/10 text-zinc-300 hover:bg-white/10 whitespace-nowrap flex items-center">
                                      На карте
                                    </a>
                                  )}
                                </div>
                              </div>
                              {geoError && geoError.id === l.id && (
                                <p className="text-[11px] text-amber-300 ml-1">{geoError.text}</p>
                              )}
                              {!parseCoords(l.coords) && (l.coords || '').trim() && (
                                <p className="text-[11px] text-amber-300 ml-1">Не разобрал координаты. Нужны два числа: широта, долгота.</p>
                              )}
                            </div>

                            {/* Солнце. Дату берём у сцен, которые здесь снимают:
                                отдельного поля даты у объекта нет намеренно —
                                смена назначается сцене, и две копии даты
                                разъехались бы. */}
                            {(() => {
                              const c = parseCoords(l.coords);
                              const dates = [...new Set(sortedScenes
                                .filter(s => (l.sceneIds || []).includes(s.id) && s.date)
                                .map(s => s.date))].sort();
                              if (!c && !dates.length) return null;
                              return (
                                <div className="bg-black/30 p-4 rounded-lg border border-white/10 space-y-2">
                                  <label className="text-xs font-bold text-zinc-400 uppercase tracking-widest block">Солнце</label>
                                  {!c ? (
                                    <p className="text-[13px] text-zinc-500">Впишите координаты — и здесь появится, во сколько встаёт и садится солнце в дни съёмки.</p>
                                  ) : !dates.length ? (
                                    <p className="text-[13px] text-zinc-500">Поставьте смену у сцены, которую здесь снимают, — и появится время восхода и заката на этот день.</p>
                                  ) : (
                                    <div className="space-y-1.5">
                                      {dates.map(dt => {
                                        const t = sunTimes(c.lat, c.lon, dt);
                                        if (!t) return null;
                                        const nums = sortedScenes.filter(s => (l.sceneIds || []).includes(s.id) && s.date === dt).map(s => '#' + s.number).join(', ');
                                        return (
                                          <div key={dt} className="flex flex-wrap items-baseline gap-x-3 gap-y-1 text-[13px]">
                                            <span className="font-mono text-zinc-400 w-[86px] shrink-0">{formatDateDisplay(dt)}</span>
                                            {t.sun.polar === 'day' ? <span className="text-amber-200">солнце не садится — полярный день</span>
                                             : t.sun.polar === 'night' ? <span className="text-indigo-200">солнце не встаёт — полярная ночь</span>
                                             : (
                                              <React.Fragment>
                                                <span className="text-zinc-200">восход <b className="font-mono">{hhmm(t.sun.rise)}</b></span>
                                                <span className="text-zinc-200">закат <b className="font-mono">{hhmm(t.sun.set)}</b></span>
                                                {t.golden.rise && (
                                                  <span className="text-amber-200/90">золотой час <b className="font-mono">{hhmm(t.sun.rise)}–{hhmm(t.golden.rise)}</b> и <b className="font-mono">{hhmm(t.golden.set)}–{hhmm(t.sun.set)}</b></span>
                                                )}
                                              </React.Fragment>
                                             )}
                                            <span className="cf-meta">сцены {nums}</span>
                                          </div>
                                        );
                                      })}
                                      <p className="text-[11px] text-zinc-500 pt-1">Время по часам этого устройства. Считается на месте, интернет не нужен.</p>
                                    </div>
                                  )}
                                </div>
                              );
                            })()}

                            {/* Схема света. Та же самая запись, что в разделе
                                «Экспликации» — не копия: у объекта своё
                                постоянное освещение, и рисовать его заново
                                для каждой сцены незачем. */}
                            <div className="space-y-1.5">
                              <label className="text-xs font-bold text-zinc-400 uppercase tracking-widest block ml-1">Схема света объекта</label>
                              {!lightSchemes.length ? (
                                <p className="text-[13px] text-zinc-500 ml-1">Схем света в проекте пока нет. Их заводят в разделе «Экспликации».</p>
                              ) : (
                                <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
                                  <select value={l.lightSchemeId || ''} onChange={(e) => updateLocation(l.id, 'lightSchemeId', e.target.value)}
                                          className="glass-input rounded-lg px-3 py-2.5 text-sm flex-1 bg-zinc-900">
                                    <option value="">— схема не выбрана —</option>
                                    {lightSchemes.map(sch => (<option key={sch.id} value={sch.id}>{sch.title}</option>))}
                                  </select>
                                  {l.lightSchemeId && lightSchemes.some(s => s.id === l.lightSchemeId) && (
                                    <button onClick={() => { setActiveSchemeId(l.lightSchemeId); setActiveDocId(null); setCurrentView('docs'); }}
                                            className="bg-amber-600/30 hover:bg-amber-600/50 text-amber-200 px-4 py-2.5 rounded-lg text-xs font-bold transition-colors shrink-0">
                                      Открыть схему
                                    </button>
                                  )}
                                </div>
                              )}
                            </div>

                            <div className="space-y-1.5">
                              <label className="text-xs font-bold text-zinc-400 uppercase tracking-widest block ml-1">Заметки со скаутинга</label>
                              <textarea value={l.description || ''} onChange={(e) => updateLocation(l.id, 'description', e.target.value)}
                                        placeholder="Свет, окна, розетки, шум, что мешает, во сколько солнце уходит..."
                                        className="glass-input w-full px-3 py-2.5 rounded-lg text-sm text-zinc-200 leading-relaxed resize-y"
                                        style={{ minHeight: 130 }} />
                            </div>

                            {/* Связь со сценами. Список живёт у объекта: одна
                                квартира снимается в пяти сценах, и держать эту
                                связь у каждой сцены значило бы чинить её
                                в пяти местах при каждом переносе. */}
                            <div className="space-y-2">
                              <div className="flex justify-between items-center">
                                <label className="text-xs font-bold text-zinc-400 uppercase tracking-widest block ml-1">Снимаем здесь сцены</label>
                                <span className="cf-meta">{linked.length ? `выбрано ${linked.length}` : 'ничего не выбрано'}</span>
                              </div>
                              {!sortedScenes.length ? (
                                <p className="text-[13px] text-zinc-500 ml-1">Сцен в проекте ещё нет.</p>
                              ) : (
                                <div className="flex flex-wrap gap-1.5 max-h-48 overflow-y-auto p-1">
                                  {sortedScenes.map(s => {
                                    const on = linked.includes(s.id);
                                    // В режиме просмотра кнопки не нажимаются, но
                                    // ОСТАЮТСЯ на месте: какие сцены здесь снимают —
                                    // это как раз то, ради чего ссылку и открывают.
                                    return (
                                      <button key={s.id} onClick={() => toggleLocationScene(l.id, s.id)}
                                              disabled={READ_ONLY} title={s.title || 'Без названия'}
                                              className={`rounded-lg text-xs font-semibold transition-colors border px-2.5 py-1.5 text-left ${on ? 'bg-indigo-600/30 text-white border-indigo-500/40' : 'bg-transparent text-zinc-400 border-white/10 hover:bg-white/5'}`}>
                                        <span className="font-mono text-[11px] mr-1.5" style={{ color: on ? 'var(--accent)' : 'var(--muted-2)' }}>#{s.number}</span>
                                        <span className="truncate inline-block align-bottom" style={{ maxWidth: 150 }}>{s.title || 'Без названия'}</span>
                                      </button>
                                    );
                                  })}
                                </div>
                              )}
                            </div>

                            <div className="space-y-3">
                              <div className="flex justify-between items-center">
                                <label className="text-xs font-bold text-zinc-400 uppercase tracking-widest block ml-1">Фотографии со скаута</label>
                                <label className="cf-edit-only text-xs text-indigo-300 hover:text-white font-bold cursor-pointer bg-indigo-600/30 hover:bg-indigo-600/50 px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1">
                                  <span><Icons.Gallery /></span> Загрузить фото
                                  <input type="file" multiple accept="image/*" className="hidden"
                                         onChange={(e) => handleMultiFileUpload(e.target.files, null, null, l.id)} />
                                </label>
                              </div>
                              {!photos.length ? (
                                <p className="text-[13px] text-zinc-500 ml-1">Фотографий пока нет. Их видно и здесь, и в общей галерее.</p>
                              ) : (
                                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                                  {photos.map(ref => (
                                    <div key={ref.id} className="glass-panel rounded-lg overflow-hidden aspect-square relative group cursor-pointer flex items-center justify-center"
                                         onClick={() => setLightboxData({ scope: photos.map(p => p.id), scopeLabel: `Объект · ${l.name || 'без названия'}`, currentId: ref.id })}>
                                      <div className="absolute inset-0 bg-cover bg-center blur-md opacity-40" style={bgStyle(ref.id, ref.url)}></div>
                                      {/* Отвязываем от объекта, а НЕ удаляем из проекта —
                                          это правило всего приложения */}
                                      <button onClick={(e) => { e.stopPropagation(); setRefLocation(ref.id, ''); showToast('Фото отвязано · осталось в галерее'); }}
                                              title="Убрать из объекта — фото останется в галерее"
                                              className="cf-edit-only absolute top-2 right-2 bg-black/80 backdrop-blur text-zinc-400 hover:text-white w-7 h-7 rounded-lg opacity-0 group-hover:opacity-100 transition-all text-xs z-20 flex items-center justify-center">✕</button>
                                      <img src={ref.url} className="w-full h-full object-contain pointer-events-none relative z-10" draggable="false" loading="lazy" />
                                      <div className="absolute bottom-0 left-0 right-0 bg-black/90 backdrop-blur-md p-1.5 border-t border-white/10 z-20" onClick={e => e.stopPropagation()}>
                                        <input type="text" value={ref.label || ''}
                                               onChange={(e) => { const up = references.map(r => r.id === ref.id ? { ...r, label: e.target.value } : r); setReferences(up); syncDoc('references', ref.id, up.find(r => r.id === ref.id)); }}
                                               className="bg-transparent w-full text-[11px] font-bold text-center text-zinc-300 truncate focus:outline-none placeholder-zinc-600" placeholder="Подпись..." />
                                      </div>
                                    </div>
                                  ))}
                                </div>
                              )}
                            </div>
                          </div>
                        );
                      })()}
                    </div>
                    )}
                  </div>

                  {/* МАСТЕР-ДОК. Собирается только когда открыт: он показывает
                      разом ВСЕ сцены со всеми кадрами, и держать это в памяти
                      постоянно незачем — своего состояния у него нет. */}
                  <div className={`h-full w-full overflow-y-auto ${currentView === 'master' ? 'block' : 'hidden'}`}>
                    <div className="max-w-4xl mx-auto p-4 md:p-8 space-y-6 pb-24">
                      {currentView === 'master' && sortedScenes.map(s => {
                        const sceneFrames = storyboard.filter(f => f.sceneId === s.id);
                        return (
                          <div key={s.id} className="glass-panel p-6 md:p-8 rounded-lg space-y-5">
                            <div className="flex justify-between items-center border-b border-white/10 pb-4 relative z-10">
                              <span className="font-mono text-white font-extrabold text-sm md:text-lg">СЦЕНА #{s.number} | {s.title}</span>
                              <span className="text-[11px] md:text-xs text-zinc-400 font-mono bg-black/50 px-3 py-1 rounded-lg border border-white/10 font-semibold">{s.date ? formatDateDisplay(s.date) : 'Дата не назначена'}</span>
                            </div>
                            <p className="text-sm text-zinc-300 bg-black/30 p-4 rounded-lg border border-white/5 leading-relaxed relative z-10 font-medium">{s.content || 'Описание отсутствует'}</p>
                            
                            {sceneFrames.length > 0 && (
                              <div className="space-y-3 pt-3 relative z-10">
                                <span className="text-[11px] md:text-xs font-bold text-zinc-500 uppercase tracking-widest block ml-1">Раскадровка / План смены:</span>
                                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-4">
                                  {sceneFrames.map(frame => (
                                    <div key={frame.id} className="bg-black/40 rounded-lg border border-white/10 p-2.5 flex flex-col space-y-2">
                                      {frame.image && (<div className="aspect-video bg-black/60 rounded-lg overflow-hidden border border-white/5"><img src={frame.image} className="w-full h-full object-cover pointer-events-none" draggable="false" /></div>)}
                                      <div className="text-[11px] md:text-xs leading-tight flex flex-col space-y-1.5 p-1">
                                        <span className="font-mono text-indigo-400 font-bold bg-indigo-500/10 self-start px-2 py-0.5 rounded-md">{frame.frameNum}</span>
                                        <span className="text-zinc-400 font-medium line-clamp-4">{frame.description || '...'}</span>
                                      </div>
                                    </div>
                                  ))}
                                </div>
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {/* ИНТЕРАКТИВНАЯ ДОСКА (WHITEBOARD) */}
                  <div className={`h-full w-full relative ${currentView === 'whiteboard' ? 'flex flex-col' : 'hidden'}`}>

                    {/* ВКЛАДКИ ДОСОК */}
                    <div className="flex items-end gap-1 px-3 shrink-0 overflow-x-auto hide-scrollbar"
                         style={{ background: 'var(--panel-2)', borderBottom: '1px solid var(--border)' }}>
                      {sortedBoards.map(b => {
                        const on = b.id === activeBoardId;
                        return (
                          <button key={b.id} onClick={() => setActiveBoardId(b.id)}
                                  onDoubleClick={() => {
                                    const t = prompt('Название доски', b.title);
                                    if (t && t.trim()) { const up = boards.map(x => x.id === b.id ? { ...x, title: t.trim() } : x); setBoards(up); syncDoc('boards', b.id, up.find(x => x.id === b.id)); }
                                  }}
                                  title={on ? 'Двойной клик — переименовать' : b.title}
                                  className="shrink-0 flex items-center gap-2 transition-colors"
                                  style={{ padding: '9px 15px', borderRadius: '8px 8px 0 0', minHeight: 40,
                                           background: on ? 'var(--bg)' : 'transparent',
                                           borderBottom: on ? '2px solid var(--accent)' : '2px solid transparent',
                                           color: on ? 'var(--text)' : 'var(--muted-2)', fontSize: 12.5 }}>
                            {b.title}
                            {on && sortedBoards.length > 1 && (
                              <span onClick={(e) => {
                                      e.stopPropagation();
                                      setConfirmAction({ title: 'Удалить доску?', message: `«${b.title}» и всё, что на ней нарисовано и разложено.`, onConfirm: () => {
                                        const rest = boards.filter(x => x.id !== b.id);
                                        setBoards(rest); deleteNetDoc('boards', b.id);
                                        stickies.filter(st => belongsToBoard(st, b.id)).forEach(st => deleteNetDoc('stickies', st.id));
                                        setStickies(stickies.filter(st => !belongsToBoard(st, b.id)));
                                        setReferences(references.map(r => r.boardId === b.id ? { ...r, boardId: '' } : r));
                                        references.filter(r => r.boardId === b.id).forEach(r => syncDoc('references', r.id, { ...r, boardId: '' }));
                                        // Сцены с удалённой доски просто снимаем — сами сцены остаются в проекте
                                        setScenes(scenes.map(s => s.boardId === b.id ? { ...s, boardId: '' } : s));
                                        scenes.filter(s => s.boardId === b.id).forEach(s => syncDoc('scenes', s.id, { ...s, boardId: '' }));
                                        try { localStorage.removeItem('cf_canvas_draw_' + b.id); localStorage.removeItem('cf_ink_' + b.id); localStorage.removeItem('cf_shapes_' + b.id); } catch (err) {}
                                        deleteNetDoc('canvas', canvasDocId(b.id));
                                        deleteNetDoc('canvas', strokesDocId(b.id));
                                        deleteNetDoc('canvas', shapesDocId(b.id));
                                        setActiveBoardId((rest[0] || DEFAULT_BOARD).id);
                                        showToast('Доска удалена · референсы остались в галерее');
                                      }});
                                    }}
                                    title="Удалить доску"
                                    style={{ color: 'var(--muted-2)', fontSize: 13, lineHeight: 1 }}>✕</span>
                            )}
                          </button>
                        );
                      })}
                      <button onClick={() => {
