                      </div>

                      <div className="absolute glass-panel p-2 rounded-lg flex gap-2 z-30 max-w-[calc(100vw-1rem)] overflow-x-auto hide-scrollbar flex-row md:flex-col top-2 md:top-6 left-2 md:left-6">
                        <button onClick={() => setWbMode('select')} className={`p-2.5 rounded-lg text-sm md:text-base shrink-0 transition-colors ${wbMode === 'select' ? 'bg-indigo-500 text-[#1a1918]' : 'text-zinc-400 hover:bg-white/10'}`} title="Выбор элементов · тяните за уголки, Ctrl во время движения выключает притяжку"><Icons.Pointer/></button>
                        <button onClick={() => setWbMode('draw')} className={`cf-edit-only p-2.5 rounded-lg text-sm md:text-base shrink-0 transition-colors ${wbMode === 'draw' ? 'bg-indigo-500 text-[#1a1918]' : 'text-zinc-400 hover:bg-white/10'}`} title="Кисть"><Icons.Pen/></button>
                        <button onClick={() => setWbMode('shape')} className={`cf-edit-only p-2.5 rounded-lg text-sm md:text-base shrink-0 transition-colors ${wbMode === 'shape' ? 'bg-indigo-500 text-[#1a1918]' : 'text-zinc-400 hover:bg-white/10'}`} title="Фигуры: прямоугольник, овал, ромб, стрелка, линия"><Icons.Shapes/></button>
                        <button onClick={() => setWbMode('erase')} className={`cf-edit-only p-2.5 rounded-lg text-sm md:text-base shrink-0 transition-colors ${wbMode === 'erase' ? 'bg-indigo-500 text-[#1a1918]' : 'text-zinc-400 hover:bg-white/10'}`} title="Ластик"><Icons.Eraser/></button>
                        <button onClick={() => { setWbMode('link'); linkPick.current = null; bindCand.current = null; requestLive(); showToast('Нажмите на первый объект, потом на второй'); }}
                                className={`cf-edit-only p-2.5 rounded-lg text-sm md:text-base shrink-0 transition-colors ${wbMode === 'link' ? 'bg-indigo-500 text-[#1a1918]' : 'text-zinc-400 hover:bg-white/10'}`}
                                title="Связь: нажмите на один объект, потом на другой"><Icons.Link/></button>
                        <button onClick={() => setWbMode('pan')} className={`p-2.5 rounded-lg text-sm md:text-base shrink-0 transition-colors ${wbMode === 'pan' ? 'bg-indigo-500 text-[#1a1918]' : 'text-zinc-400 hover:bg-white/10'}`} title="Панорамирование"><Icons.Move/></button>
                        {/* Появляется только после первого касания стилусом:
                            на устройстве без пера этой кнопке нечего делать. */}
                        {penSeen && <button onClick={toggleFingerPans} className={`p-2.5 rounded-lg text-sm md:text-base shrink-0 transition-colors ${fingerPans ? 'bg-indigo-500 text-[#1a1918]' : 'text-zinc-400 hover:bg-white/10'}`}
                          title={fingerPans ? 'Рисует только стилус, палец двигает доску. Нажмите, чтобы палец тоже рисовал' : 'Палец тоже рисует. Нажмите, чтобы рисовал только стилус'}><Icons.Hand/></button>}
                        <button onClick={undoStroke} disabled={!canUndo} title="Отменить штрих (Ctrl+Z)"
                                className={`cf-edit-only p-2.5 rounded-lg text-sm md:text-base shrink-0 transition-colors ${canUndo ? 'text-zinc-400 hover:bg-white/10' : 'text-zinc-700 cursor-not-allowed'}`}>
                          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
                        </button>
                        {/* Штрихи векторные, поэтому шаг назад стоит копейки —
                            и шаг вперёд можно наконец дать тоже. */}
                        <button onClick={redoStroke} disabled={!canRedo} title="Вернуть штрих (Ctrl+Shift+Z)"
                                className={`cf-edit-only p-2.5 rounded-lg text-sm md:text-base shrink-0 transition-colors ${canRedo ? 'text-zinc-400 hover:bg-white/10' : 'text-zinc-700 cursor-not-allowed'}`}>
                          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
                        </button>
                        <div className="w-[1px] h-full md:w-full md:h-[1px] bg-white/10 my-0 md:my-1 cf-edit-only"></div>
                        {/* Единственный путь к уже загруженным референсам с самой
                            доски. */}
                        <button onClick={() => setScenePickerOpen(v => !v)} title="Положить на доску: референсы, документы, сцены"
                                className={`cf-edit-only rounded-lg text-sm md:text-base shrink-0 transition-colors flex items-center justify-center p-2.5 ${scenePickerOpen ? 'bg-indigo-500 text-[#1a1918]' : 'text-zinc-400 hover:bg-white/10'}`}>
                          <Icons.Scene/>
                        </button>
                        <button onClick={() => { const ns = { id: `st-${Date.now()}`, boardId: activeBoardId, text: '', x: (300 - canvasOffset.x) / zoom, y: (300 - canvasOffset.y) / zoom, w: STICKY_W, h: STICKY_H, color: '#fef08a' }; setStickies([...stickies, ns]); syncDoc('stickies', ns.id, ns); setWbMode('select'); setSelectedWbItems([ns.id]); setEditCard({ id: ns.id, key: 'text' }); }} className="cf-edit-only p-2.5 text-xs text-amber-300 hover:bg-white/10 rounded-lg shrink-0 font-bold flex items-center justify-center gap-1" title="Стикер"><Icons.Sticky/></button>
                        <button onClick={() => { const nr = { id: `ref-${Date.now()}`, boardId: activeBoardId, sceneId: '', url: '', x: (250 - canvasOffset.x) / zoom, y: (250 - canvasOffset.y) / zoom, label: 'Референс', tags: [] }; setReferences([...references, nr]); syncDoc('references', nr.id, nr); setWbMode('select'); setSelectedWbItems([nr.id]); }} className="cf-edit-only p-2.5 text-xs text-blue-400 hover:bg-white/10 rounded-lg shrink-0 font-bold flex items-center justify-center gap-1" title="Новый референс"><Icons.Gallery/></button>
                        {/* Выгрузка доски картинкой: то, что отправляют группе.
                            PNG для мессенджера, SVG для печати и правки в
                            векторном редакторе. */}
                        <button onClick={() => exportBoard('png')} disabled={exportBusy}
                                className="p-2.5 text-xs text-zinc-400 hover:bg-white/10 rounded-lg shrink-0 font-bold flex items-center justify-center gap-1"
                                title="Выгрузить доску картинкой (PNG)">
                          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
                        </button>
                        <button onClick={() => exportBoard('svg')} disabled={exportBusy}
                                className="p-2.5 text-[10px] text-zinc-400 hover:bg-white/10 rounded-lg shrink-0 font-bold flex items-center justify-center"
                                title="Выгрузить доску в SVG — вектор для печати и правки">SVG</button>
                        <button onClick={() => setConfirmAction({title: 'Очистить рисунок на доске?', message: 'Все линии и фигуры на этой доске будут стёрты. Карточки, референсы и заметки останутся. Другие доски не тронем.', onConfirm:()=>{ pushUndo(!!legacyCv.current); strokesRef.current = []; shapesRef.current = []; setSelShapes([]); loadLegacy(null); legacyDirty.current = false; saveCanvas(activeBoardId, ''); saveStrokes(activeBoardId, []); saveShapes(activeBoardId, []); bumpInk(); showToast("Холст очищен"); }})} className="cf-edit-only p-2.5 text-xs text-red-400 hover:bg-white/10 rounded-lg shrink-0 font-bold flex items-center justify-center gap-1" title="Очистить рисунок: линии и фигуры"><Icons.Trash/></button>
                      </div>

                      {/* Какие сцены можно положить на эту доску. Доска — текущая
                          работа, поэтому список, а не «все сразу». */}
                      {scenePickerOpen && (
                        <div className="absolute glass-panel rounded-lg z-30 w-72 max-w-[calc(100vw-2rem)] border-t border-white/10 flex flex-col top-16 md:top-6 left-2 md:left-24" style={{ maxHeight: '60vh' }}>
                          <div className="flex items-center justify-between px-3 shrink-0" style={{ minHeight: 40, borderBottom: '1px solid var(--border)' }}>
                            <span className="cf-eyebrow">Положить на доску</span>
                            <button onClick={() => setScenePickerOpen(false)} className="w-6 h-6 flex items-center justify-center rounded text-zinc-500 hover:text-white hover:bg-white/10 text-[11px]">✕</button>
                          </div>
                          <div className="overflow-y-auto p-1.5">
                            {/* Три раздела, у каждого свой заголовок и своё поведение.
                                Референсы тут есть всегда: это единственный путь
                                к уже загруженным картинкам с самой доски. */}
                            {(() => {
                              const pool = references.filter(r => r.url && r.boardId !== activeBoardId);
                              return (
                                <React.Fragment>
                                  <div className="px-2 pt-1 pb-1.5">
                                    <span className="cf-eyebrow">Референсы</span>
                                  </div>
                                  {pool.length === 0 ? (
                                    <p className="px-2 pb-2" style={{ fontSize: 11.5, color: 'var(--muted-2)' }}>
                                      {references.length ? 'Все референсы уже на этой доске.' : 'Референсов пока нет — загрузите их в «Галерее».'}
                                    </p>
                                  ) : pool.slice(0, 60).map(r => (
                                    <button key={r.id} onClick={() => { putRefOnBoard(r); setScenePickerOpen(false); }}
                                            className="w-full text-left px-2 rounded-md hover:bg-white/5 flex items-center gap-2 transition-colors"
                                            style={{ minHeight: 40 }}>
                                      <img src={r.url} alt="" className="shrink-0 rounded" style={{ width: 28, height: 28, objectFit: 'cover' }} />
                                      <span className="truncate flex-1" style={{ fontSize: 12.5, color: 'var(--text-2)' }}>{r.label || 'Без названия'}</span>
                                      {r.boardId && <span className="cf-meta shrink-0">на другой</span>}
                                    </button>
                                  ))}
                                </React.Fragment>
                              );
                            })()}

                            <div className="px-2 pt-3 pb-1.5" style={{ borderTop: '1px solid var(--border-soft)' }}><span className="cf-eyebrow">Документы</span></div>
                            {offBoardDocs.length === 0 ? (
                              <p className="px-2 pb-2" style={{ fontSize: 11.5, color: 'var(--muted-2)' }}>
                                {docs.length ? 'Все документы уже на этой доске.' : 'Документов пока нет.'}
                              </p>
                            ) : offBoardDocs.map(d => (
                              <button key={d.id} onClick={() => { putDocOnBoard(d.id); setScenePickerOpen(false); }}
                                      className="w-full text-left px-2 rounded-md hover:bg-white/5 flex items-center gap-2 transition-colors"
                                      style={{ minHeight: 40 }}>
                                <span className="shrink-0" style={{ color: 'var(--muted-2)' }}><Icons.Docs /></span>
                                <span className="truncate flex-1" style={{ fontSize: 12.5, color: 'var(--text-2)' }}>{d.title || 'Без названия'}</span>
                                {d.boardId && <span className="cf-meta shrink-0">на другой</span>}
                              </button>
                            ))}

                            <div className="px-2 pt-3 pb-1.5" style={{ borderTop: '1px solid var(--border-soft)' }}><span className="cf-eyebrow">Сцены</span></div>
                            {offBoardScenes.length === 0 ? (
                              <p className="px-2 pb-2" style={{ fontSize: 11.5, color: 'var(--muted-2)' }}>
                                {sortedScenes.length ? 'Все сцены уже на этой доске.' : 'В проекте пока нет сцен.'}
                              </p>
                            ) : offBoardScenes.map(s => {
                              const where = s.boardId ? (sortedBoards.find(b => b.id === s.boardId) || {}).title : null;
                              return (
                                <button key={s.id} onClick={() => { putSceneOnBoard(s.id); setScenePickerOpen(false); }}
                                        className="w-full text-left px-2 rounded-md hover:bg-white/5 flex items-center gap-2 transition-colors"
                                        style={{ minHeight: 40 }}>
                                  <span className="font-mono text-[11px] font-bold shrink-0" style={{ color: 'var(--accent)' }}>#{s.number || '—'}</span>
                                  <span className="truncate flex-1" style={{ fontSize: 12.5, color: 'var(--text-2)' }}>{s.title || 'Без названия'}</span>
                                  {where && <span className="cf-meta shrink-0">на «{where}»</span>}
                                </button>
                              );
                            })}
                          </div>
                        </div>
                      )}

                      {/* ПАНЕЛЬ СВОЙСТВ. Контекстная: в режиме фигур задаёт,
                          чем рисовать дальше, а если что-то выделено — правит
                          выделенное. Показываем только то, что применимо:
                          у линии нет заливки, у овала нет наконечников.
                          Палитра НАМЕРЕННО короткая — из шести цветов доска
                          всегда выглядит прилично, из шестнадцати миллионов
                          нет. Свой цвет спрятан за отдельной кнопкой. */}
                      {(wbMode === 'shape' || (wbMode === 'select' && selShapes.length > 0)) && (() => {
                        const selNow = wbMode === 'select' ? selShapes.map(id => shapesRef.current.find(s => s.id === id)).filter(Boolean) : [];
                        // Чем правим: выделенным или заготовкой на будущее
                        const cur = selNow.length ? selNow[0] : shapeStyle;
                        const kinds = selNow.length ? selNow.map(s => s.k) : [shapeKind];
                        const anyText = kinds.some(k => k === 'text');
                        const onlyText = kinds.every(k => k === 'text');
                        const anyClosed = kinds.some(k => !isLineKind(k) && k !== 'text');
                        const anyLine = kinds.some(k => isLineKind(k));
                        const anyArrow = kinds.some(k => k === 'arrow');
                        const anyRect = kinds.some(k => k === 'rect');
                        const row = "flex bg-black/50 p-1 rounded-lg border border-white/5 gap-1";
                        const cell = (on) => `flex-1 py-1 rounded-md text-[11px] font-bold transition-all ${on ? 'bg-indigo-500 text-[#1a1918]' : 'text-zinc-500 hover:text-white'}`;
                        const cap = "text-[10.5px] text-zinc-500 font-bold uppercase tracking-wider block";
                        return (
                        <div className="absolute top-16 md:top-6 left-2 md:left-24 glass-panel p-3 rounded-lg flex flex-col space-y-2 z-30 w-52 border-t border-white/10 max-h-[calc(100%-3rem)] overflow-y-auto hide-scrollbar">
                          {wbMode === 'shape' && (
                            <div className={row}>
                              {[['rect', Icons.ShRect, 'Прямоугольник'], ['ellipse', Icons.ShEllipse, 'Овал'], ['diamond', Icons.ShDiamond, 'Ромб'], ['arrow', Icons.ShArrow, 'Стрелка'], ['line', Icons.ShLine, 'Линия'], ['text', Icons.ShText, 'Текст']].map(([k, Ic, t]) => (
                                <button key={k} title={t} onClick={() => setShapeKind(k)}
                                        className={`flex-1 py-1.5 rounded-md flex items-center justify-center transition-all ${shapeKind === k ? 'bg-indigo-500 text-[#1a1918]' : 'text-zinc-500 hover:text-white'}`}><Ic/></button>
                              ))}
                            </div>
                          )}
                          {selNow.length > 0 && (
                            <div className="flex items-center justify-between">
                              <span className={cap}>Выбрано: {selNow.length}</span>
                              <button onClick={() => deleteShapes()} title="Удалить (Delete)"
                                      className="px-2 py-1 rounded-md text-[11px] font-bold text-red-400 hover:bg-white/10">Удалить</button>
                            </div>
                          )}

                          <div className="space-y-1">
                            <span className={cap}>{onlyText ? 'Цвет' : 'Линия'}</span>
                            <div className="grid grid-cols-7 gap-1.5 items-center">
                              {SHAPE_COLORS.map(c => (
                                <button key={c} onClick={() => patchShapes({ sc: c })} style={{ backgroundColor: c }}
                                        className={`w-5 h-5 rounded-full border-2 ${cur.sc === c ? 'border-white scale-110' : 'border-transparent'} transition-transform`} />
                              ))}
                              <input type="color" value={cur.sc} onChange={(e) => patchShapes({ sc: e.target.value })} title="Свой цвет"
                                     className="wb-color-well w-5 h-5 rounded-full border-2 border-white/30 cursor-pointer bg-transparent" />
                            </div>
                          </div>

                          {anyClosed && (
                            <div className="space-y-1">
                              <span className={cap}>Заливка</span>
                              <div className="grid grid-cols-7 gap-1.5 items-center">
                                {SHAPE_FILLS.map(c => (
                                  <button key={c} onClick={() => patchShapes({ bg: c })} title={c === 'transparent' ? 'Без заливки' : ''}
                                          style={c === 'transparent' ? {} : { backgroundColor: c, opacity: 0.55 }}
                                          className={`w-5 h-5 rounded-full border-2 flex items-center justify-center ${cur.bg === c ? 'border-white scale-110' : 'border-transparent'} transition-transform ${c === 'transparent' ? 'bg-black/40' : ''}`}>
                                    {c === 'transparent' && <span className="block w-3.5 h-[1.5px] bg-zinc-500 rotate-45" />}
                                  </button>
                                ))}
                              </div>
                              {cur.bg !== 'transparent' && (
                                <div className={row}>
                                  {[['solid', 'Сплошь'], ['hachure', 'Штрих'], ['cross', 'Сетка']].map(([v, t]) => (
                                    <button key={v} onClick={() => patchShapes({ fs: v })} className={cell(cur.fs === v)}>{t}</button>
                                  ))}
                                </div>
                              )}
                            </div>
                          )}

                          {anyText && (
                            <div className="space-y-1">
                              <div className="flex justify-between"><span className={cap}>Кегль</span><span className="text-[11px] text-zinc-400 font-mono">{cur.fz || 20}</span></div>
                              <input type="range" min="10" max="72" step="1" value={cur.fz || 20}
                                     onChange={(e) => patchShapes({ fz: Number(e.target.value) })}
                                     className="w-full accent-indigo-500 h-1.5 rounded-full appearance-none outline-none bg-white/10" />
                              <div className={row}>
                                {[['left', 'Слева'], ['center', 'Центр'], ['right', 'Справа']].map(([v, t]) => (
                                  <button key={v} onClick={() => patchShapes({ ta: v })} className={cell((cur.ta || 'left') === v)}>{t}</button>
                                ))}
                              </div>
                            </div>
                          )}

                          {!onlyText && <div className="space-y-1">
                            <span className={cap}>Толщина</span>
                            <div className={row}>
                              {[[1, 'Тонко'], [2, 'Средне'], [4, 'Жирно']].map(([v, t]) => (
                                <button key={v} onClick={() => patchShapes({ sw: v })} className={cell(cur.sw === v)}>{t}</button>
                              ))}
                            </div>
                          </div>}

                          {!onlyText && <div className="space-y-1">
                            <span className={cap}>Штрих</span>
                            <div className={row}>
                              {[['solid', 'Сплошь'], ['dashed', 'Пунктир'], ['dotted', 'Точки']].map(([v, t]) => (
                                <button key={v} onClick={() => patchShapes({ sd: v })} className={cell(cur.sd === v)}>{t}</button>
                              ))}
                            </div>
                          </div>}

                          {!onlyText && <div className="space-y-1">
                            <span className={cap}>Начертание</span>
                            <div className={row}>
                              {[[0, 'Ровно'], [1, 'От руки'], [2, 'Эскиз']].map(([v, t]) => (
                                <button key={v} onClick={() => patchShapes({ ro: v })} className={cell(cur.ro === v)}>{t}</button>
                              ))}
                            </div>
                          </div>}

                          {anyRect && (
                            <div className={row}>
                              {[[1, 'Скруглить'], [0, 'Острые углы']].map(([v, t]) => (
                                <button key={v} onClick={() => patchShapes({ rd: v })} className={cell(cur.rd === v)}>{t}</button>
                              ))}
                            </div>
                          )}

                          {anyLine && (
                            <div className="space-y-1">
                              <span className={cap}>Маршрут</span>
                              <div className={row}>
                                {[['straight', 'Прямо'], ['curved', 'Дугой'], ['ortho', 'Углом']].map(([v, t]) => (
                                  <button key={v} onClick={() => patchShapes({ rt: v })} className={cell((cur.rt || 'straight') === v)}>{t}</button>
                                ))}
                              </div>
                            </div>
                          )}

                          {anyArrow && anyLine && (
                            <div className="space-y-1">
                              <span className={cap}>Наконечники</span>
                              <div className={row}>
                                <button onClick={() => patchShapes({ a1: cur.a1 === 'arrow' ? 'none' : 'arrow' })} className={cell(cur.a1 === 'arrow')}>В начале</button>
                                <button onClick={() => patchShapes({ a2: cur.a2 === 'arrow' ? 'none' : 'arrow' })} className={cell(cur.a2 === 'arrow')}>В конце</button>
                              </div>
                            </div>
                          )}

                          <div className="space-y-1">
                            <div className="flex justify-between"><span className={cap}>Прозрачность</span><span className="text-[11px] text-zinc-400 font-mono">{Math.round((cur.op === undefined ? 1 : cur.op) * 100)}%</span></div>
                            <input type="range" min="10" max="100" step="5" value={Math.round((cur.op === undefined ? 1 : cur.op) * 100)}
                                   onChange={(e) => patchShapes({ op: Number(e.target.value) / 100 })}
                                   className="w-full accent-indigo-500 h-1.5 rounded-full appearance-none outline-none bg-white/10" />
                          </div>

                          {selNow.length > 1 && (
                            <div className={row}>
                              <button onClick={groupShapes} className={cell(false)}>Сгруппировать</button>
                              {selNow.some(s => s.g) && <button onClick={ungroupShapes} className={cell(false)}>Разбить</button>}
                            </div>
                          )}
                          {selNow.length === 1 && selNow[0].g && (
                            <div className={row}><button onClick={ungroupShapes} className={cell(false)}>Разбить группу</button></div>
                          )}

                          {selNow.length > 0 && (
                            <div className="space-y-1">
                              <span className={cap}>Порядок</span>
                              <div className={row}>
                                <button onClick={() => orderShapes(1)} className={cell(false)}>Вперёд</button>
                                <button onClick={() => orderShapes(-1)} className={cell(false)}>Назад</button>
                              </div>
                            </div>
                          )}
                          {wbMode === 'shape' && (
                            <p style={{ fontSize: 10.5, lineHeight: 1.4, color: 'var(--muted-2)' }}>
                              {shapeKind === 'text'
                                ? 'Щёлкните по доске — появится поле. Двойной клик по фигуре кладёт подпись внутрь неё.'
                                : 'Ведите по доске. Shift — ровный квадрат и угол кратно 15°, Ctrl — без притяжки.'}
                            </p>
                          )}
                        </div>
                        );
                      })()}

                      {/* У ластика своя панель. Раньше его размер был спрятан
                          в коде («кисть × 2,5»), увидеть и задать его было
                          нечем — человек стирал вслепую. */}
                      {wbMode === 'erase' && (
                        <div className="absolute top-16 md:top-6 left-2 md:left-24 glass-panel p-4 rounded-lg flex flex-col space-y-3 z-30 w-52 border-t border-white/10">
                          <div className="flex justify-between text-[11px] text-zinc-400 font-bold uppercase tracking-wider"><span>Ластик</span><span>{eraserSize}px</span></div>
                          <input type="range" min="8" max="200" step="4" value={eraserSize} onChange={(e) => changeEraser(Number(e.target.value))} className="w-full accent-indigo-500 h-1.5 rounded-full appearance-none outline-none bg-white/10" />
                          <p style={{ fontSize: 10.5, lineHeight: 1.4, color: 'var(--muted-2)' }}>
                            Круг показывает, что заденет. Линии режет, фигуры убирает целиком — стёртое вернёт Ctrl+Z.
                          </p>
                        </div>
                      )}

                      {wbMode === 'draw' && (
                        <div className="absolute top-16 md:top-6 left-2 md:left-24 glass-panel p-4 rounded-lg flex flex-col space-y-4 z-30 w-52 border-t border-white/10">
                          <div className="flex bg-black/50 p-1.5 rounded-lg border border-white/5">
                              <button onClick={() => setBrushType('pen')} className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition-all ${brushType === 'pen' ? 'bg-indigo-500 text-[#1a1918]' : 'text-zinc-500 hover:text-white'}`}>Перо</button>
                              <button onClick={() => setBrushType('soft')} className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition-all ${brushType === 'soft' ? 'bg-indigo-500 text-[#1a1918]' : 'text-zinc-500 hover:text-white'}`}>Мягкая</button>
                              <button onClick={() => setBrushType('marker')} className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition-all ${brushType === 'marker' ? 'bg-indigo-500 text-[#1a1918]' : 'text-zinc-500 hover:text-white'}`}>Маркер</button>
                          </div>
                          <div className="space-y-2">
                            <div className="flex justify-between text-[11px] text-zinc-400 font-bold uppercase tracking-wider"><span>Размер</span><span>{brushSize}px</span></div>
                            <input type="range" min="2" max="32" value={brushSize} onChange={(e) => setBrushSize(Number(e.target.value))} className="w-full accent-indigo-500 h-1.5 rounded-full appearance-none outline-none bg-white/10" />
                          </div>
                          <div className="space-y-2">
                            <span className="text-[11px] text-zinc-400 font-bold uppercase tracking-wider block">Цвет</span>
                            <div className="grid grid-cols-6 gap-2 items-center">
                              {['#d97757', '#fbbf24', '#fb7185', '#34d399', '#38bdf8', '#f4f4f5'].map(color => (<button key={color} onClick={() => setBrushColor(color)} style={{ backgroundColor: color }} className={`w-6 h-6 rounded-full border-2 ${brushColor === color ? 'border-white scale-110' : 'border-transparent hover:scale-110'} transition-transform`} />))}
                              <input type="color" value={brushColor} onChange={(e) => setBrushColor(e.target.value)} title="Свой цвет" className="wb-color-well w-6 h-6 rounded-full border-2 border-white/30 cursor-pointer bg-transparent" />
                            </div>
                          </div>
                        </div>
                      )}

                      <div className="absolute bottom-6 left-6 glass-panel p-2 rounded-lg flex items-center space-x-3 z-30 border-t border-white/10">
                        <button onClick={() => setZoom(prev => Math.max(0.3, prev - 0.1))} className="w-10 h-10 md:w-8 md:h-8 flex items-center justify-center hover:bg-white/10 rounded-lg text-lg font-bold transition-colors">-</button>
                        <span className="text-xs font-bold font-mono w-10 text-center">{Math.round(zoom * 100)}%</span>
                        <button onClick={() => setZoom(prev => Math.min(2.0, prev + 0.1))} className="w-10 h-10 md:w-8 md:h-8 flex items-center justify-center hover:bg-white/10 rounded-lg text-lg font-bold transition-colors">+</button>
                      </div>
                    </div>
                  </div>

                  {/* ТАБЛИЦА СМЕН И КПП */}
                  <div className={`h-full w-full overflow-y-auto ${currentView === 'table' ? 'block' : 'hidden'}`}>
                    <div className="p-4 md:p-8 max-w-7xl mx-auto space-y-6 pb-24">
                      <div className="flex flex-col sm:flex-row justify-between sm:items-center border-b border-white/10 pb-5 gap-4">
                        <h2 className="text-xl font-bold text-white flex items-center gap-2"><Icons.Table/> Таблица Планирования и Смен</h2>
                        <div className="flex glass-panel p-1.5 rounded-lg border border-white/5">
                          <button onClick={() => setTableSubView('list')} className={`px-5 py-2 rounded-lg text-xs font-bold transition-all ${tableSubView === 'list' ? 'bg-indigo-600/60 text-white' : 'text-zinc-400 hover:text-white'}`}>Общий список</button>
                          <button onClick={() => setTableSubView('grouped')} className={`px-5 py-2 rounded-lg text-xs font-bold transition-all ${tableSubView === 'grouped' ? 'bg-indigo-600/60 text-white' : 'text-zinc-400 hover:text-white'}`}>Группировка по сменам</button>
                        </div>
                      </div>

                      {tableSubView === 'list' ? (
                        <div className="glass-panel rounded-lg overflow-x-auto border border-white/10">
                          <table className="w-full min-w-[700px] text-left border-collapse text-sm">
                            <thead><tr className="bg-white/5 border-b border-white/10 text-zinc-400 uppercase tracking-widest text-[11px] font-bold"><th className="p-5 w-20 text-center">Сцена</th><th className="p-5 w-44">Дата съемки</th><th className="p-5 w-1/3">Объект / Заголовок</th><th className="p-5">Камерный сетап</th></tr></thead>
                            <tbody className="divide-y divide-white/5 text-zinc-200">
                              {sortedScenes.map(s => (
                                <tr key={s.id} className="hover:bg-white/5 transition-colors">
                                  <td className="p-5 font-mono text-center bg-black/30">
                                    {/* Номер правится и отсюда: удобнее перенумеровать
                                        всю смену подряд, чем ходить по карточкам */}
                                    <input type="text" value={s.number || ''} onChange={(e) => updateSceneNumber(s.id, e.target.value)}
                                           placeholder="—" maxLength="12" title="Номер сцены"
                                           className={`bg-transparent w-16 text-center font-mono font-extrabold focus:outline-none border-b transition-colors placeholder-zinc-600 ${duplicateNumbers[String(s.number || '').trim()] ? 'text-amber-300 border-amber-500/50' : 'text-indigo-400 border-transparent hover:border-white/20 focus:border-indigo-400'}`} />
                                  </td>
                                  <td className="p-5"><input type="date" value={s.date || ''} onChange={(e) => updateScene(s.id, 'date', e.target.value)} className="glass-input rounded-lg px-3 py-1.5 font-mono transition-colors text-xs" /></td>
                                  <td className="p-5 font-bold">{s.title}</td>
                                  <td className="p-5">
                                    <div className="flex flex-wrap gap-2">
                                      {Object.entries(gearTypes || DEFAULT_GEAR).map(([key, item]) => {
                                        const count = (s.gear && s.gear[key]) || 0;
                                        if (count === 0) return null;
                                        return (
                                          <div key={key} className="flex items-center space-x-2 bg-black/50 px-2.5 py-1.5 rounded-lg border border-white/5">
                                            <span className="text-[11px] text-indigo-400"><Icons.Video/></span>
                                            <span className="text-xs text-zinc-300 font-medium">{item.label}:</span>
                                            <span className="font-mono text-xs font-bold text-white">{count}</span>
                                          </div>
                                        );
                                      })}
                                    </div>
                                  </td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      ) : (() => {
                        const grouped = {}; sortedScenes.forEach(s => { const dk = s.date || ''; if (!grouped[dk]) grouped[dk] = []; grouped[dk].push(s); });
                        const sortedDates = Object.keys(grouped).sort((a, b) => { if (!a) return 1; if (!b) return -1; return new Date(a) - new Date(b); });
                        return (
                          <div className="space-y-8">
                            {sortedDates.map(dateKey => {
                              const dayScenes = grouped[dateKey]; const summary = {}; Object.keys(gearTypes || DEFAULT_GEAR).forEach(k => { summary[k] = 0; });
                              dayScenes.forEach(s => { const gear = s.gear || {}; Object.keys(gear).forEach(k => { if (summary[k] !== undefined) summary[k] += (gear[k] || 0); else summary[k] = (gear[k] || 0); }); });
                              const hasSummary = Object.values(summary).some(v => v > 0);
                              return (
                                <div key={dateKey || 'unassigned'} className="glass-panel rounded-lg overflow-hidden border-t border-white/10">
                                  <div className="bg-white/5 px-6 py-4 border-b border-white/10 flex flex-col md:flex-row md:items-center justify-between gap-4">
                                    <div className="flex items-center space-x-4">
                                      <span className="text-sm font-black text-indigo-300 font-mono tracking-wide">{dateKey ? `СМЕНА: ${formatDateDisplay(dateKey)}` : 'СЦЕНЫ ВНЕ СМЕН'}</span>
                                      <span className="text-zinc-600">|</span>
                                      <span className="text-xs font-bold text-zinc-300 bg-black/50 px-3 py-1 rounded-full border border-white/10">{dayScenes.length} сцен</span>
                                    </div>
                                    {hasSummary && (<div className="flex flex-wrap items-center gap-2"><span className="text-[11px] text-zinc-400 uppercase font-bold tracking-wider mr-2">Итого техника:</span>{Object.entries(summary).map(([key, totalQty]) => { if (totalQty === 0) return null; const item = (gearTypes || DEFAULT_GEAR)[key] || { label: key }; return (<span key={key} className="bg-indigo-950/60 text-indigo-200 text-xs px-3 py-1 rounded-lg font-mono font-semibold flex items-center space-x-2"><span className="text-indigo-400"><Icons.Video/></span><span>{item.label}</span><span className="font-extrabold text-white bg-indigo-600 px-1.5 py-0.5 rounded-md">{totalQty}</span></span>); })}</div>)}
                                  </div>
                                  <div className="divide-y divide-white/5">
                                    {dayScenes.map(s => (
                                      <div key={s.id} className="p-5 flex flex-col md:flex-row md:items-center justify-between gap-4 hover:bg-white/5 transition-colors">
                                        <div className="flex items-start space-x-4 flex-1">
                                          <span className="font-mono text-indigo-400 font-black text-sm shrink-0 bg-white/5 border border-white/10 px-3 py-1.5 rounded-lg mt-0.5">#{s.number}</span>
                                          <div className="space-y-1.5">
                                            <h4 className="text-sm font-bold text-white tracking-wide">{s.title || 'Без названия'}</h4>
                                            <p className="text-xs text-zinc-400 font-medium line-clamp-2 leading-relaxed max-w-3xl">{s.content || '...'}</p>
                                          </div>
                                        </div>
                                      </div>
                                    ))}
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        );
                      })()}
                    </div>
                  </div>

                  {/* ЭКСПЛИКАЦИИ И ДОКУМЕНТЫ */}
                  <div className={`h-full w-full ${currentView === 'docs' ? 'block' : 'hidden'}`}>
                    <div className="flex flex-col lg:flex-row h-full max-w-7xl mx-auto p-4 md:p-6 gap-6 overflow-y-auto lg:overflow-hidden">
                      <div className="w-full lg:w-72 glass-panel p-5 rounded-lg flex flex-col shrink-0 relative border-t border-white/10 overflow-hidden">
                        <div className="space-y-4 overflow-y-auto hide-scrollbar pb-4 flex-1">
                          <div>
                              <span className="text-[11px] font-bold text-zinc-500 uppercase tracking-widest block mb-3 ml-2">Операторские Гайды</span>
                              {docs.map(doc => (
                                <div key={doc.id} className="group relative mb-2">
                                  <button onClick={() => {setActiveDocId(doc.id); setActiveSchemeId(null);}} className={`w-full text-left pl-4 pr-16 py-3 rounded-lg text-sm font-bold transition-all border ${activeDocId === doc.id && !activeSchemeId ? 'bg-indigo-600/30 text-white border-indigo-500/40' : 'text-zinc-400 border-transparent hover:bg-white/5'}`}>{doc.title}</button>
                                  {/* Документ можно вынести на доску и связать со сценой */}
                                  <button onClick={(e) => { e.stopPropagation(); if (doc.boardId === activeBoardId) removeDocFromBoard(doc.id); else putDocOnBoard(doc.id); }}
                                          title={doc.boardId === activeBoardId ? 'Убрать с доски — документ останется здесь' : 'Положить на текущую доску'}
                                          className="cf-edit-only absolute right-11 top-3 w-7 h-7 flex items-center justify-center rounded-lg transition-all"
                                          style={doc.boardId === activeBoardId
                                            ? { background: 'var(--accent)', color: 'var(--bg)' }
                                            : { color: 'var(--muted-2)' }}>
                                    <Icons.Board />
                                  </button>
                                  {docs.length > 1 && (<button onClick={(e) => { e.stopPropagation(); setConfirmAction({title:'Удалить документ?', message:'', onConfirm:()=> { const rem = docs.filter(d=>d.id !== doc.id); setDocs(rem); setActiveDocId(rem[0].id); deleteNetDoc('docs', doc.id); }})}} className="absolute right-3 top-3 opacity-0 group-hover:opacity-100 hover:bg-red-500/20 text-zinc-500 hover:text-red-400 transition-all w-7 h-7 flex items-center justify-center rounded-lg text-xs"><Icons.Trash/></button>)}
                                </div>
                              ))}
                              <button onClick={() => { const nD = { id: `doc-${Date.now()}`, title: `Новый гайд`, content: '' }; setDocs([...docs, nD]); setActiveDocId(nD.id); setActiveSchemeId(null); syncDoc('docs', nD.id, nD); }} className="w-full mt-2 py-3 glass-panel hover:bg-white/10 text-white rounded-lg text-xs font-bold transition-colors flex items-center justify-center gap-2"><span>+</span><span>Создать гайд</span></button>
                          </div>
                          <div className="pt-4 border-t border-white/10">
                              <span className="text-[11px] font-bold text-zinc-500 uppercase tracking-widest block mb-3 ml-2">Схемы Света</span>
                              {lightSchemes.map(sch => (
                                <div key={sch.id} className="group relative mb-2">
                                  <button onClick={() => {setActiveSchemeId(sch.id); setActiveDocId(null);}} className={`w-full text-left px-4 py-3 rounded-lg text-sm font-bold transition-all border flex items-center gap-2 ${activeSchemeId === sch.id ? 'bg-amber-600/30 text-amber-200 border-amber-500/40' : 'text-zinc-400 border-transparent hover:bg-white/5'}`}><Icons.Lightbulb/> <span className="truncate">{sch.title}</span></button>
                                  <button onClick={(e) => { e.stopPropagation(); setConfirmAction({title:'Удалить схему?', message:'Схема отвяжется от всех связанных сцен.', onConfirm:()=> { const rem = lightSchemes.filter(d=>d.id !== sch.id); setLightSchemes(rem); setActiveSchemeId(null); setActiveDocId(docs[0].id); deleteNetDoc('lightSchemes', sch.id); }})}} className="absolute right-3 top-3 opacity-0 group-hover:opacity-100 hover:bg-red-500/20 text-zinc-500 hover:text-red-400 transition-all w-7 h-7 flex items-center justify-center rounded-lg text-xs"><Icons.Trash/></button>
                                </div>
                              ))}
                              <button onClick={() => { const nS = { id: `lsch-${Date.now()}`, title: `Схема света`, elements: [], drawData: '' }; setLightSchemes([...lightSchemes, nS]); setActiveSchemeId(nS.id); setActiveDocId(null); syncDoc('lightSchemes', nS.id, nS); }} className="w-full mt-2 py-3 glass-panel hover:bg-white/10 text-amber-300 rounded-lg text-xs font-bold transition-colors flex items-center justify-center gap-2"><span>+</span><span>Новая схема</span></button>
                          </div>
                        </div>
                      </div>

                      {/* Текстовый документ */}
                      {activeDocId && !activeSchemeId && docs.find(d => d.id === activeDocId) && (() => {
                        const activeDoc = docs.find(d => d.id === activeDocId);
                        return (
                          <div className="flex-1 glass-panel p-6 md:p-8 rounded-lg flex flex-col space-y-6 lg:overflow-y-auto relative border-t border-white/10">
                            <input type="text" value={activeDoc.title} onChange={(e) => { const up = docs.map(d=>d.id===activeDoc.id?{...d,title:e.target.value}:d); setDocs(up); syncDoc('docs', activeDoc.id, up.find(d=>d.id===activeDoc.id)); }} className="font-serif bg-transparent text-2xl md:text-3xl font-bold w-full focus:outline-none text-white placeholder-zinc-600" placeholder="Заголовок гайда..." />
                            <textarea value={activeDoc.content} onChange={(e) => { const up = docs.map(d=>d.id===activeDoc.id?{...d,content:e.target.value}:d); setDocs(up); syncDoc('docs', activeDoc.id, up.find(d=>d.id===activeDoc.id)); }} className="w-full flex-1 glass-input rounded-lg p-6 text-sm md:text-base min-h-[300px] lg:min-h-0 transition-shadow leading-relaxed resize-none font-medium border border-white/10" placeholder="Содержание документа..." />
                            
                            <div className="space-y-4 border-t border-white/10 pt-6">
                              <div className="flex justify-between items-center px-1">
                                <span className="text-xs font-bold text-zinc-400 uppercase tracking-widest flex items-center gap-2"><Icons.User/> Состав съемочной группы</span>
                                <button onClick={() => { const nc = { id: `cr-${Date.now()}`, name: '', role: '', phone: '' }; setCrew([...crew, nc]); syncDoc('crew', nc.id, nc); }} className="text-xs font-bold text-indigo-300 hover:text-white bg-indigo-600/30 hover:bg-indigo-600/50 px-4 py-2 rounded-lg transition-colors">+ Добавить участника</button>
                              </div>
                              <div className="glass-panel rounded-lg overflow-x-auto border border-white/5">
                                <table className="w-full min-w-[500px] text-left text-sm border-collapse">
                                  <thead><tr className="bg-white/5 text-zinc-400 text-[11px] uppercase tracking-widest font-bold border-b border-white/10"><th className="p-4 w-1/3">Имя Фамилия</th><th className="p-4 w-1/3">Цех / Должность</th><th className="p-4">Телефон / Контакт</th><th className="p-4 w-14"></th></tr></thead>
                                  <tbody className="divide-y divide-white/5 text-zinc-200">
                                    {crew.map(c => (
                                      <tr key={c.id} className="hover:bg-white/5 transition-colors">
                                        <td className="p-2"><input type="text" value={c.name} onChange={e => { const up = crew.map(cr=>cr.id===c.id?{...cr,name:e.target.value}:cr); setCrew(up); syncDoc('crew', c.id, up.find(cr=>cr.id===c.id)); }} className="bg-transparent w-full px-3 py-2 text-white focus:outline-none font-bold placeholder-zinc-600" placeholder="ФИО" /></td>
                                        <td className="p-2"><input type="text" value={c.role} onChange={e => { const up = crew.map(cr=>cr.id===c.id?{...cr,role:e.target.value}:cr); setCrew(up); syncDoc('crew', c.id, up.find(cr=>cr.id===c.id)); }} className="bg-transparent w-full px-3 py-2 text-zinc-400 font-medium focus:outline-none placeholder-zinc-600" placeholder="Роль" /></td>
                                        <td className="p-2"><input type="text" value={c.phone} onChange={e => { const up = crew.map(cr=>cr.id===c.id?{...cr,phone:e.target.value}:cr); setCrew(up); syncDoc('crew', c.id, up.find(cr=>cr.id===c.id)); }} className="bg-transparent w-full px-3 py-2 font-mono font-medium focus:outline-none placeholder-zinc-600" placeholder="+7..." /></td>
                                        <td className="p-2 text-center"><button onClick={() => { setCrew(crew.filter(cr=>cr.id!==c.id)); deleteNetDoc('crew', c.id); }} className="w-8 h-8 flex items-center justify-center rounded-lg glass-panel hover:bg-white/10 text-zinc-400 hover:text-red-400 transition-colors mx-auto font-bold"><Icons.Trash/></button></td>
                                      </tr>
                                    ))}
                                  </tbody>
                                </table>
                              </div>
                            </div>
                          </div>
                        );
                      })()}
                      
                      {/* Схема света */}
                      {activeSchemeId && lightSchemes.find(s=>s.id === activeSchemeId) && (() => {
                          const sch = lightSchemes.find(s=>s.id === activeSchemeId);
                          return (
                            <div className="flex-1 glass-panel p-6 md:p-8 rounded-lg flex flex-col space-y-6 lg:overflow-y-auto relative">
                                <div className="flex justify-between items-center gap-4">
                                    <input type="text" value={sch.title} onChange={(e) => { const up = lightSchemes.map(s=>s.id===sch.id?{...s,title:e.target.value}:s); setLightSchemes(up); syncDoc('lightSchemes', sch.id, up.find(s=>s.id===sch.id)); }} className="font-serif bg-transparent text-2xl md:text-3xl font-bold w-full focus:outline-none text-white placeholder-zinc-600" placeholder="Название световой схемы..." />
                                    <button onClick={() => setDrawingSchemeId(sch.id)} className="bg-amber-600/30 hover:bg-amber-500/50 text-amber-200 px-6 py-3 rounded-lg font-bold transition-colors shrink-0">Открыть графический редактор</button>
                                </div>
                                <div className="w-full aspect-video bg-black/70 rounded-lg border border-white/10 flex items-center justify-center overflow-hidden">
                                    {(sch.preview || sch.drawData) ? <img src={sch.preview || sch.drawData} className="w-full h-full object-contain" /> : <div className="text-zinc-500 flex flex-col items-center"><Icons.Lightbulb/><span className="mt-2 text-xs">Нажмите «Открыть графический редактор» для моделирования схемы</span></div>}
                                </div>
                                <div className="pt-4 border-t border-white/10">
                                    <span className="text-xs text-zinc-400 font-bold block mb-2">Привязано к сценам:</span>
                                    <div className="flex gap-2 flex-wrap">
                                        {scenes.filter(s=>s.lightSchemeId===sch.id).length > 0 
                                            ? scenes.filter(s=>s.lightSchemeId===sch.id).map(s=>(<span key={s.id} className="bg-indigo-950/60 px-3 py-1 rounded-lg text-xs font-mono text-indigo-300">Сцена #{s.number}</span>))
                                            : <span className="text-xs text-zinc-600">Схема не привязана ни к одной сцене</span>
                                        }
                                    </div>
                                </div>
                            </div>
                          );
                      })()}

                      {/* Правая колонка: Файлы */}
                      <div className="w-full lg:w-80 glass-panel p-6 rounded-lg shrink-0 space-y-8 relative border-t border-white/10">
                        <div className="space-y-3">
                          <span className="text-[11px] font-bold text-zinc-500 uppercase tracking-widest block ml-1">Экспорт / Печать</span>
                          {(() => {
                            const openDoc = docs.find(d => d.id === activeDocId);
                            const openScheme = lightSchemes.find(s => s.id === activeSchemeId);
                            const btn = "w-full py-3 rounded-lg text-sm font-bold tracking-wide transition-all flex items-center justify-center gap-2 border";
                            return (
                              <div className="space-y-2">
                                <button onClick={() => requestPrint('full')} className={`${btn} bg-zinc-800 hover:bg-zinc-700 text-white border-white/10`}>
                                  <Icons.Print/> <span>Весь план</span>
                                </button>
                                <button onClick={() => requestPrint('doc')} disabled={!openDoc || !!activeSchemeId}

                      <div className="bg-black/40 p-4 rounded-lg border border-white/10">
                        <h4 className="text-sm font-bold text-indigo-300 mb-2">Загрузка файла таблицы (.xlsx / .csv)</h4>
                        <p className="text-xs text-zinc-400 mb-3">Загрузите файл КПП от Второго Режиссера, и ИИ распарсит матрицу смен и сцен.</p>
                        <label className="w-full bg-indigo-600/40 hover:bg-indigo-600/60 text-indigo-100 px-4 py-3 rounded-lg text-sm font-semibold transition-colors cursor-pointer flex items-center justify-center gap-2">
                          {isAILoading ? '⏳ Обработка нейросетью...' : '📁 Выбрать КПП (.xlsx / .csv)'}
                          <input type="file" accept=".xlsx,.xls,.csv,.txt" className="hidden" onChange={(e) => { handleAIAgentFile(e); setShowAgentModal(false); }} disabled={isAILoading} />
                        </label>
                      </div>

                      <div className="bg-black/40 p-4 rounded-lg border border-white/10">
                        <h4 className="text-sm font-bold text-amber-300 mb-2">Сценарий (.txt / .fountain / .fdx)</h4>
                        <p className="text-xs text-zinc-400 mb-3 leading-relaxed">
                          Разбирается по заголовкам сцен — «СЦЕНА 5. ИНТ. КАБИНЕТ — ДЕНЬ» или «5. НАТ. ДВОР — ДЕНЬ».
                          Номер берётся из заголовка: если сцена с таким номером уже есть, текст ляжет в неё,
                          а не создаст вторую. Текст каждой сцены попадёт в её вкладку «Текст сцены».
                          Перед записью покажу, что нашлось.
                        </p>
                        <label className="w-full bg-amber-600/30 hover:bg-amber-600/50 text-amber-100 px-4 py-3 rounded-lg text-sm font-semibold transition-colors cursor-pointer flex items-center justify-center gap-2">
                          {isAILoading ? '⏳ Читаю...' : '📄 Выбрать сценарий'}
                          <input type="file" accept=".txt,.fountain,.fdx,.md,.csv,.xml" className="hidden" onChange={(e) => { handleScriptFile(e); setShowAgentModal(false); }} disabled={isAILoading} />
                        </label>
                      </div>

                      <div className="bg-black/40 p-4 rounded-lg border border-white/10">
                        <h4 className="text-sm font-bold text-emerald-400 mb-2">Ручной импорт JSON</h4>
                        <p className="text-xs text-zinc-400 mb-3">Скопируйте массив сцен и вставьте в поле ниже:</p>
                        <textarea value={manualJsonInput} onChange={(e) => setManualJsonInput(e.target.value)} placeholder='[{"number":"1","title":"ИНТ. ОФИС - ДЕНЬ","date":"2026-06-29","content":"Описание..."}]' className="w-full h-24 glass-input rounded-lg p-3 text-xs resize-none mb-3 font-mono text-zinc-300" />
                        <button 
                          onClick={() => {
                            try {
                              let text = manualJsonInput.trim(); if (!text) return;
                              const match = text.match(/\[[\s\S]*\]/); if (match) text = match[0];
                              const parsed = JSON.parse(text);
                              if (Array.isArray(parsed) && parsed.length > 0) {
                                const newScenes = parsed.map((ps, idx) => ({ id: `scene-${Date.now()}-${idx}`, number: ps.number || String(scenes.length + idx + 1), title: ps.title || 'Сцена', content: ps.content || '', boardId: '', x: (150 - canvasOffset.x) / zoom + (idx * 40), y: (150 - canvasOffset.y) / zoom + (idx * 40), date: ps.date || '', gear: {}, lightGear: {}, lightSchemeId: null }));
                                setScenes([...scenes, ...newScenes]); newScenes.forEach(ns => syncDoc('scenes', ns.id, ns)); showToast(`✅ Импортировано ${newScenes.length} сцен!`); setShowAgentModal(false); setManualJsonInput('');
                              } else { showToast("❌ Массив сцен пуст."); }
                            } catch (e) { showToast("❌ Ошибка формата JSON."); }
                          }}
                          className="w-full bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2.5 rounded-lg text-sm font-semibold transition-colors"
                        >Импортировать сцены</button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {drawingFrameId && (
                  <DrawingModal onClose={() => setDrawingFrameId(null)} onSave={(dataUrl) => {
                        const up = storyboard.map(x=>x.id===drawingFrameId?{...x,image:dataUrl}:x); 
                        setStoryboard(up); syncDoc('storyboard', drawingFrameId, up.find(x=>x.id===drawingFrameId));
                        setDrawingFrameId(null);
                  }} />
              )}
              
              {drawingSchemeId && currentView === 'docs' && lightSchemes.find(s=>s.id === drawingSchemeId) && (
                  <LightSchemeEditor scheme={lightSchemes.find(s=>s.id === drawingSchemeId)} onClose={() => setDrawingSchemeId(null)} onSave={(id, els, draw, preview) => {
                      const up = lightSchemes.map(s=>s.id===id?{...s, elements: els, drawData: draw, preview: preview}:s);
                      setLightSchemes(up); syncDoc('lightSchemes', id, up.find(s=>s.id===id));
                      setDrawingSchemeId(null);
                  }} />
              )}

              {lightboxData && (() => {
                  // Листаем ровно тот набор, что открыт на экране (папка + тег),
                  // а не все референсы проекта.
                  const list = lightboxData.scope
                      ? lightboxData.scope.map(id => references.find(r => r.id === id)).filter(Boolean)
                      : references.filter(r => lightboxData.sceneId ? r.sceneId === lightboxData.sceneId : true);
                  return <Lightbox refs={list} scopeLabel={lightboxData.scopeLabel} initialId={lightboxData.currentId}
                                   onClose={() => setLightboxData(null)}
                                   hints={tagHints} onAddTag={addTagTo} onRemoveTag={removeTagFrom}
                                   onSetPano={setRefPano} />;
              })()}

              {/* Печатная версия. Содержимое зависит от выбранной кнопки
                  экспорта (printMode): весь план / гайд / схема / техника. */}
              {/* Собирается ТОЛЬКО перед печатью. Раньше висела в разметке
                  всегда: все сцены, вся раскадровка с картинками — десятки
                  изображений в памяти круглосуточно ради кнопки, которую
                  нажимают раз в неделю. На планшете это ощутимо. */}
              <div id="print-area">
              {printRequested && (<React.Fragment>
                {printMode === 'doc' && (() => {
                  const d = docs.find(x => x.id === activeDocId);
                  if (!d) return null;
                  return (
                    <div>
                      <h1 style={{fontSize: '22pt', fontWeight: 900, margin: '0 0 2pt'}}>{d.title || 'Гайд'}</h1>
                      <p style={{fontSize: '10pt', color: '#555', margin: '0 0 16pt'}}>Операторский гайд · CineFlow · {new Date().toLocaleDateString('ru-RU')}</p>
                      <p style={{fontSize: '12pt', lineHeight: 1.55, whiteSpace: 'pre-wrap', margin: 0}}>{d.content || 'Документ пуст.'}</p>
                    </div>
                  );
                })()}

                {printMode === 'scheme' && (() => {
                  const sch = lightSchemes.find(x => x.id === activeSchemeId);
                  if (!sch) return null;
                  const linked = scenes.filter(s => s.lightSchemeId === sch.id);
                  return (
                    <div>
                      <h1 style={{fontSize: '22pt', fontWeight: 900, margin: '0 0 2pt'}}>{sch.title || 'Схема света'}</h1>
                      <p style={{fontSize: '10pt', color: '#555', margin: '0 0 14pt'}}>Схема света · CineFlow · {new Date().toLocaleDateString('ru-RU')}</p>
                      {sch.preview
                        ? <img src={sch.preview} style={{width: '100%', border: '1px solid #ccc'}} />
                        : <p style={{fontSize: '11pt', color: '#777'}}>Схема ещё не сохранена в редакторе — нечего печатать.</p>}
                      {sch.elements && sch.elements.length > 0 && (
                        <div style={{marginTop: '14pt'}}>
                          <h2 style={{fontSize: '13pt', fontWeight: 800, margin: '0 0 6pt'}}>Приборы на схеме</h2>
                          <table style={{width: '100%', borderCollapse: 'collapse', fontSize: '10pt'}}>
                            <tbody>
                              {sch.elements.filter(el => el.label || el.text).map((el, i) => (
                                <tr key={el.id || i}>
                                  <td style={{border: '1px solid #ccc', padding: '4pt', width: '28pt', textAlign: 'center'}}>{i + 1}</td>
                                  <td style={{border: '1px solid #ccc', padding: '4pt'}}>{el.label || el.text}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      )}
                      {linked.length > 0 && (
                        <p style={{fontSize: '10pt', marginTop: '12pt'}}>
                          <b>Используется в сценах:</b> {linked.map(s => `#${s.number}`).join(', ')}
                        </p>
                      )}
                    </div>
                  );
                })()}

                {printMode === 'gear' && (
                  <div>
                    <h1 style={{fontSize: '22pt', fontWeight: 900, margin: '0 0 2pt'}}>Список техники</h1>
                    <p style={{fontSize: '10pt', color: '#555', margin: '0 0 6pt'}}>CineFlow · {new Date().toLocaleDateString('ru-RU')} · сцен в проекте: {scenes.length}</p>
                    <p style={{fontSize: '9pt', color: '#777', margin: '0 0 16pt'}}>
                      «Нужно» — максимум за одну сцену, то есть сколько единиц требуется одновременно.
                    </p>
                    {[{t: 'Камера и операторский грип', rows: gearSummary.camera}, {t: 'Осветительные приборы', rows: gearSummary.light}].map(block => (
                      <div key={block.t} style={{marginBottom: '16pt'}}>
                        <h2 style={{fontSize: '13pt', fontWeight: 800, margin: '0 0 6pt'}}>{block.t}</h2>
                        {block.rows.length === 0
                          ? <p style={{fontSize: '10pt', color: '#777', margin: 0}}>Ничего не отмечено.</p>
                          : (
                            <table style={{width: '100%', borderCollapse: 'collapse', fontSize: '10pt'}}>
                              <thead>
                                <tr>
                                  <th style={{border: '1px solid #ccc', padding: '4pt', textAlign: 'left'}}>Позиция</th>
                                  <th style={{border: '1px solid #ccc', padding: '4pt', width: '50pt', textAlign: 'center'}}>Нужно</th>
                                  <th style={{border: '1px solid #ccc', padding: '4pt', width: '60pt', textAlign: 'center'}}>Сцен</th>
                                  <th style={{border: '1px solid #ccc', padding: '4pt'}}>В каких сценах</th>
                                </tr>
                              </thead>
                              <tbody>
                                {block.rows.map(r => (
                                  <tr key={r.label}>
                                    <td style={{border: '1px solid #ccc', padding: '4pt'}}>{r.label}</td>
                                    <td style={{border: '1px solid #ccc', padding: '4pt', textAlign: 'center', fontWeight: 700}}>{r.peak}</td>
                                    <td style={{border: '1px solid #ccc', padding: '4pt', textAlign: 'center'}}>{r.scenes.length}</td>
                                    <td style={{border: '1px solid #ccc', padding: '4pt'}}>{r.scenes.map(n => `#${n}`).join(', ')}</td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          )}
                      </div>
                    ))}
                  </div>
                )}

                {/* Отчёт со скаутинга: то, что отправляют группе перед выездом.
                    Фотографии крупные — по ним и решают, годится ли объект. */}
                {printMode === 'locations' && (
                  <div>
                    <h1 style={{fontSize: '22pt', fontWeight: 900, margin: '0 0 2pt'}}>Объекты съёмки</h1>
                    <p style={{fontSize: '10pt', color: '#555', margin: '0 0 16pt'}}>
                      Отчёт со скаутинга · CineFlow · {new Date().toLocaleDateString('ru-RU')} · объектов: {sortedLocations.length}
                    </p>
                    {!sortedLocations.length && <p style={{fontSize: '11pt', color: '#777'}}>Объектов в проекте нет.</p>}
                    {sortedLocations.map(l => {
                      const photos = locationPhotos(l.id);
                      const linked = sortedScenes.filter(s => (l.sceneIds || []).includes(s.id));
                      return (
                        <div key={l.id} className="print-scene" style={{marginBottom: '18pt'}}>
                          <h2 style={{fontSize: '15pt', fontWeight: 800, margin: '0 0 4pt'}}>{l.name || 'Без названия'}</h2>
                          {l.address && <p style={{fontSize: '10.5pt', margin: '0 0 3pt'}}><b>Адрес:</b> {l.address}</p>}
                          {l.coords && <p style={{fontSize: '10.5pt', margin: '0 0 3pt'}}><b>Координаты:</b> {l.coords}</p>}
                          {linked.length > 0 && (
                            <p style={{fontSize: '10.5pt', margin: '0 0 3pt'}}>
                              <b>Сцены:</b> {linked.map(s => `#${s.number} ${s.title || ''}`.trim()).join(' · ')}
                            </p>
                          )}
                          {(() => {
                            // Восход и закат по дням съёмки — то, ради чего
                            // отчёт со скаута и возят с собой.
                            const c = parseCoords(l.coords);
                            if (!c) return null;
                            const dates = [...new Set(linked.filter(s => s.date).map(s => s.date))].sort();
                            if (!dates.length) return null;
                            return (
                              <p style={{fontSize: '10.5pt', margin: '0 0 3pt'}}>
                                <b>Солнце:</b>{' '}
                                {dates.map(dt => {
                                  const t = sunTimes(c.lat, c.lon, dt);
                                  if (!t) return null;
                                  const when = t.sun.polar === 'day' ? 'не садится'
                                    : t.sun.polar === 'night' ? 'не встаёт'
                                    : `${hhmm(t.sun.rise)} — ${hhmm(t.sun.set)}`;
                                  return `${formatDateDisplay(dt)}: ${when}`;
                                }).filter(Boolean).join(' · ')}
                              </p>
                            );
                          })()}
                          {(() => {
                            const sch = lightSchemes.find(s => s.id === l.lightSchemeId);
                            if (!sch) return null;
                            return <p style={{fontSize: '10.5pt', margin: '0 0 3pt'}}><b>Схема света:</b> {sch.title}</p>;
                          })()}
                          {l.description && <p style={{fontSize: '11pt', margin: '6pt 0 8pt', whiteSpace: 'pre-wrap', lineHeight: 1.5}}>{l.description}</p>}
                          {photos.length > 0 && (
                            <div style={{display: 'flex', flexWrap: 'wrap', gap: '8pt'}}>
                              {photos.map(p => (
                                <div key={p.id} style={{width: '31%', fontSize: '9pt'}}>
                                  <img src={p.url} style={{width: '100%', border: '1px solid #ccc'}} />
                                  {p.label && <div style={{marginTop: '2pt'}}>{p.label}</div>}
                                </div>
                              ))}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}

                {printMode === 'full' && (<>
                <h1 style={{fontSize: '22pt', fontWeight: 900, margin: '0 0 2pt'}}>CineFlow — План подготовки к съёмкам</h1>
                <p style={{fontSize: '10pt', color: '#555', margin: '0 0 14pt'}}>Сформировано: {new Date().toLocaleDateString('ru-RU')} · Сцен: {scenes.length}</p>
                {[...scenes].sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999') || String(a.number).localeCompare(String(b.number), undefined, {numeric: true})).map(s => {
                  const pFrames = storyboard.filter(f => f.sceneId === s.id);
                  const pLocs = locations.filter(l => (l.sceneIds || []).includes(s.id));
                  return (
                    <div key={s.id} className="print-scene">
                      <h2 style={{fontSize: '14pt', fontWeight: 800, margin: '0 0 4pt'}}>Сцена #{s.number} — {s.title || 'Без названия'}</h2>
                      <p style={{fontSize: '10pt', color: '#555', margin: '0 0 6pt'}}>Смена: {s.date ? formatDateDisplay(s.date) : 'не назначена'}</p>
                      {pLocs.length > 0 && (
                        <p style={{fontSize: '10pt', margin: '0 0 6pt'}}>
                          <b>Объект:</b> {pLocs.map(l => l.name + (l.address ? ` (${l.address})` : '')).join('; ')}
                        </p>
                      )}
                      {s.content && <p style={{fontSize: '11pt', margin: '0 0 8pt', whiteSpace: 'pre-wrap'}}>{s.content}</p>}
                      {Object.keys(s.gear || {}).length > 0 && <p style={{fontSize: '10pt', margin: '0 0 4pt'}}><b>Техника:</b> {Object.entries(s.gear).map(([k, v]) => `${((gearTypes || {})[k] || {label: k}).label} × ${v}`).join(', ')}</p>}
                      {Object.keys(s.lightGear || {}).length > 0 && <p style={{fontSize: '10pt', margin: '0 0 8pt'}}><b>Свет:</b> {Object.entries(s.lightGear).map(([k, v]) => `${((lightGearTypes || {})[k] || {label: k}).label} × ${v}`).join(', ')}</p>}
                      {pFrames.length > 0 && (
                        <div style={{display: 'flex', flexWrap: 'wrap', gap: '8pt'}}>
                          {pFrames.map(f => (
                            <div key={f.id} style={{width: '30%', fontSize: '9pt'}}>
                              {f.image && <img src={f.image} style={{width: '100%', border: '1px solid #ccc'}} />}
                              <div><b>{f.frameNum}</b> {f.description}</div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })}
                {crew.length > 0 && (
                  <div style={{marginTop: '16pt'}}>
                    <h2 style={{fontSize: '14pt', fontWeight: 800}}>Съёмочная группа</h2>
                    <table style={{width: '100%', borderCollapse: 'collapse', fontSize: '10pt'}}>
                      <tbody>
                        {crew.map(c => (<tr key={c.id}><td style={{border: '1px solid #ccc', padding: '4pt'}}>{c.name}</td><td style={{border: '1px solid #ccc', padding: '4pt'}}>{c.role}</td><td style={{border: '1px solid #ccc', padding: '4pt'}}>{c.phone}</td></tr>))}
                      </tbody>
                    </table>
                  </div>
                )}
                </>)}
              </React.Fragment>)}
              </div>

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><AppCore /></ErrorBoundary>);
    </script>
</body>
</html>
