                                    }}
                                    title="Удалить доску"
                                    style={{ color: 'var(--muted-2)', fontSize: 13, lineHeight: 1 }}>✕</span>
                            )}
                          </button>
                        );
                      })}
                      <button onClick={() => {
                                const nb = { id: `board-${Date.now()}`, title: `Доска ${sortedBoards.length + 1}`, order: sortedBoards.length };
                                setBoards([...boards, nb]); syncDoc('boards', nb.id, nb); setActiveBoardId(nb.id);
                              }}
                              title="Новая доска · двойной клик по вкладке — переименовать"
                              className="cf-edit-only shrink-0 flex items-center justify-center transition-colors hover:bg-white/5"
                              style={{ width: 40, minHeight: 40, marginBottom: 2, borderRadius: 8, border: '1px solid var(--border)', color: 'var(--muted)', fontSize: 16 }}>+</button>

                      {/* СХЕМЫ СВЕТА — здесь же, вкладками рядом с досками.
                          Схема — такой же холст, как доска, и держать один
                          холст в «Досках», а другой в «Экспликациях» значило
                          заставлять человека помнить, где что лежит.
                          Открываются они в своём редакторе поверх экрана;
                          закрыл — вернулся на доску. Записи те же самые:
                          схема, выбранная у сцены или у объекта, — вот эта. */}
                      <span className="shrink-0" style={{ width: 1, height: 22, background: 'var(--border)', margin: '0 6px 9px' }} />
                      {lightSchemes.map(sch => (
                        <button key={sch.id} onClick={() => setDrawingSchemeId(sch.id)}
                                onDoubleClick={() => {
                                  if (READ_ONLY) return;
                                  const t = prompt('Название схемы', sch.title);
                                  if (t && t.trim()) { const up = lightSchemes.map(x => x.id === sch.id ? { ...x, title: t.trim() } : x); setLightSchemes(up); syncDoc('lightSchemes', sch.id, up.find(x => x.id === sch.id)); }
                                }}
                                title={`${sch.title} · открыть редактор схемы. Двойной клик — переименовать`}
                                className="shrink-0 flex items-center gap-1.5 transition-colors hover:bg-white/5"
                                style={{ padding: '9px 12px', borderRadius: '8px 8px 0 0', minHeight: 40,
                                         color: 'var(--muted-2)', fontSize: 12.5 }}>
                          <span style={{ color: 'var(--warn)', display: 'flex' }}><Icons.Lightbulb /></span>
                          <span className="truncate" style={{ maxWidth: 160 }}>{sch.title}</span>
                          {/* Удаление здесь же: заводить схему в «Досках»,
                              а удалять уходить в «Экспликации» — ровно та
                              разбежка, из-за которой человек и не помнит,
                              где что лежит. Запись общая, поэтому исчезает
                              она везде, и об этом сказано прямо. */}
                          <span onClick={(e) => {
                                  e.stopPropagation();
                                  setConfirmAction({ title: 'Удалить схему света?',
                                    message: `«${sch.title}» исчезнет и отвяжется от всех сцен и объектов, где выбрана. Отменить нельзя.`,
                                    onConfirm: () => {
                                      setLightSchemes(lightSchemes.filter(x => x.id !== sch.id));
                                      deleteNetDoc('lightSchemes', sch.id);
                                      if (activeSchemeId === sch.id) setActiveSchemeId(null);
                                      if (drawingSchemeId === sch.id) setDrawingSchemeId(null);
                                      // Ссылки на удалённую схему чистим сами:
                                      // иначе у сцены осталась бы кнопка,
                                      // открывающая пустоту.
                                      scenes.filter(s => s.lightSchemeId === sch.id).forEach(s => {
                                        const up = { ...s, lightSchemeId: null }; syncDoc('scenes', s.id, up);
                                      });
                                      setScenes(prev => prev.map(s => s.lightSchemeId === sch.id ? { ...s, lightSchemeId: null } : s));
                                      locations.filter(l => l.lightSchemeId === sch.id).forEach(l => {
                                        const up = { ...l, lightSchemeId: '' }; syncDoc('locations', l.id, up);
                                      });
                                      setLocations(prev => prev.map(l => l.lightSchemeId === sch.id ? { ...l, lightSchemeId: '' } : l));
                                      showToast('Схема удалена');
                                    } });
                                }}
                                title="Удалить схему"
                                className="cf-edit-only shrink-0"
                                style={{ color: 'var(--muted-2)', fontSize: 13, lineHeight: 1, marginLeft: 2 }}>✕</span>
                        </button>
                      ))}

                                  if (isLineKind(d.k)) { const r = lockAngle(d.x, d.y, nx, ny); nx = r.x; ny = r.y; }
                                  else {
                                    const q = Math.max(Math.abs(nx - d.x), Math.abs(ny - d.y));
                                    nx = d.x + (nx < d.x ? -q : q); ny = d.y + (ny < d.y ? -q : q);
                                  }
                                }
                                d.w = nx - d.x; d.h = ny - d.y;
                                if (isLineKind(d.k)) {
                                  const over = bindAt(pt2.x, pt2.y);
                                  const ok = over && over.id !== d.b1;
                                  bindCand.current = ok ? over.id : null;
                                  d.b2 = ok ? over.id : null;
                                }
                                shapeDirty(d);
                                requestLive();
                                return;
                              }
                              if (!isPainting) { requestLive(); return; }
                              // Браузер копит промежуточные точки между кадрами.
                              // Без getCoalescedEvents они теряются, и быстрый
                              // штрих выходит углами.
                              const ne = e.nativeEvent;
                              const raw = (ne.getCoalescedEvents && ne.getCoalescedEvents().length) ? ne.getCoalescedEvents() : [ne];
                              if (penErase.current || wbMode === 'erase') {
                                for (const p of raw) {
                                  const b = inkPt(p.clientX, p.clientY);
                                  const a = erasePt.current || b;
                                  eraseSeg(a.x, a.y, b.x, b.y, eraserSize / 2);
                                  erasePt.current = b;
                                }
                                requestLive();
                                return;
                              }
                              const L = live.current;
                              if (!L) { requestLive(); return; }
                              for (const p of raw) {
                                const b = inkPt(p.clientX, p.clientY);
                                const last = L.pts[L.pts.length - 1];
                                const d = Math.hypot(b.x - last[0], b.y - last[1]);
                                if (d < 0.7) continue;          // отбрасываем дрожание
                                // «Поводок»: точка идёт не прямо в указатель, а
                                // тянется за ним. Это гасит и дрожь руки, и
                                // ступеньки от редких событий — без него линия
                                // остаётся гранёной, сколько её потом ни сглаживай.
                                const nx = last[0] + (b.x - last[0]) * INK_LEAD;
                                const ny = last[1] + (b.y - last[1]) * INK_LEAD;
                                const dev = (e.pointerType === 'pen' && p.pressure > 0) ? p.pressure : null;
                                L.press = inkPress(L.press, d, L.w, dev);
                                L.pts.push([nx, ny, L.press]);
                                if (L.pts.length >= INK_MAX) {
                                  // Набрали предел — ЗАКРЫВАЕМ кусок и тут же
                                  // продолжаем новым от той же точки. Раньше
                                  // точки просто переставали добавляться, и
                                  // конец линии начинал ездить за пером:
                                  // выглядело так, будто линия кончилась и её
                                  // утаскивает. Стыки не сужаем, поэтому шва
                                  // не видно.
                                  const cut = packStroke(L.t, L.c, L.w, L.pts, (L.jn || 0) | 2);
                                  strokesRef.current = strokesRef.current.concat([cut]);
                                  paintOnStatic(cut);
                                  scheduleInkSave();
                                  L.pts = [L.pts[L.pts.length - 1]];
                                  L.jn = 1;
                                }
                              }
                              requestLive();
                            }}
                            onPointerUp={(e) => {
                              if (e.currentTarget.hasPointerCapture && e.currentTarget.hasPointerCapture(e.pointerId)) {
                                e.currentTarget.releasePointerCapture(e.pointerId);
                              }
                              if (ocrDraft.current && ocrDraft.current.pointerId === e.pointerId) {
                                const o = ocrDraft.current; ocrDraft.current = null;
                                requestLive();
                                runOcr({ x: Math.min(o.x0, o.x1), y: Math.min(o.y0, o.y1),
                                         w: Math.abs(o.x1 - o.x0), h: Math.abs(o.y1 - o.y0) });
                                return;
                              }
                              if (wbMode === 'link' && linkDown.current) {
                                const d = linkDown.current; linkDown.current = null;
                                if (Math.hypot(e.clientX - d.x, e.clientY - d.y) < 8) pickLink(d.id);
                              }
                              if (wbMode === 'shape') {
                                const d = shapeDraft.current;
                                shapeDraft.current = null;
                                clearGuides();
                                // Случайный тычок фигурой не считаем: иначе на
                                // доске копились бы точки в один пиксель.
                                const b = d ? shapeBox(d) : null;
                                // Текст «нарисовать» нельзя — по нему просто
                                // щёлкают. Ведение задаёт ширину, короткий
                                // тычок берёт ширину по умолчанию.
                                if (d && isText(d)) {
                                  d.x = b.w >= 8 ? b.x : d.x;
                                  d.y = b.h >= 8 ? b.y : d.y;
                                  d.w = b.w >= 8 ? b.w : 260;
                                  d.h = measureText(d);
                                  pushUndo(false);
                                  shapesRef.current = shapesRef.current.concat([d]);
                                  scheduleInkSave('shapes');
                                  setIsPainting(false);
                                  setEditText({ id: d.id });
                                  requestStatic();
                                  return;
                                }
                                bindCand.current = null;
                                const drawn = isLineKind(d ? d.k : '') ? Math.hypot(d.w, d.h) >= 6 : (b && (b.w >= 3 || b.h >= 3));
                                if (d && drawn) {
                                  // Замкнутую нормализуем: габарит всегда
                                  // с положительными сторонами, и всё, что
                                  // считает рамку, может на это полагаться.
                                  if (!isLineKind(d.k)) { d.x = b.x; d.y = b.y; d.w = b.w; d.h = b.h; shapeDirty(d); }
                                  pushUndo(false);
                                  shapesRef.current = shapesRef.current.concat([d]);
                                  bumpInk();
                                  scheduleInkSave('shapes');
                                }
                                setIsPainting(false);
                                requestLive();
                                return;
                              }
                              const wipe = penErase.current || wbMode === 'erase';
                              const L = live.current;
                              if (isPainting && !wipe && L && L.pts.length) {
                                const s = packStroke(L.t, L.c, L.w, L.pts, L.jn);
                                strokesRef.current = strokesRef.current.concat([s]);
                                // Готовый штрих ДОПИСЫВАЕМ в нижний слой, а не
                                // перерисовываем доску целиком: обычный случай —
                                // «провёл линию», и платить за него полной
                                // перерисовкой незачем.
                                paintOnStatic(s);
                                scheduleInkSave();
                              }
                              if (isPainting && wipe) {
                                if (legacyDirty.current) saveLegacy();
                                scheduleInkSave();
                                scheduleInkSave('shapes');
                              }
                              live.current = null; erasePt.current = null; penErase.current = false;
                              setIsPainting(false); setIsPanning(false);
                              commitView();
                              requestLive();
                            }}
                            onPointerCancel={() => {
                              live.current = null; erasePt.current = null; penErase.current = false;
                              shapeDraft.current = null; ocrDraft.current = null; clearGuides();
                              setIsPainting(false); setIsPanning(false); commitView(); requestLive();
                            }} />
                      </React.Fragment>

                      {/* Правка текста — настоящее поле ввода ПОВЕРХ холста,
                          подогнанное под то же место, шрифт и масштаб.
                          Рисовать курсор и выделение на канве значило бы
                          писать свой текстовый редактор; на планшете вдобавок
                          только настоящее поле поднимает клавиатуру. */}
                      {editText && (() => {
                        const s = shapesRef.current.find(q => q.id === editText.id);
                        if (!s) return null;
                        const host = s.ct ? shapesRef.current.find(q => q.id === s.ct) : null;
                        const b = host ? shapeBox(host) : shapeBox(s);
                        const z = zoom, pad = host ? 10 : 0;
                        const fz = Math.max(8, s.fz || 20) * z;
                        return (
                          <textarea
                            ref={editRef}
                            autoFocus
                            defaultValue={s.tx || ''}
                            onBlur={(e) => commitText(e.target.value)}
                            onKeyDown={(e) => {
                              e.stopPropagation();
                              if (e.key === 'Escape') { e.preventDefault(); commitText(e.currentTarget.value); }
                              // Enter переводит строку, закрывает Ctrl+Enter:
                              // подпись в блоке часто в две строки.
                              if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); commitText(e.currentTarget.value); }
                            }}
                            style={{
                              position: 'absolute', zIndex: 28,
                              left: (b.x * z + canvasOffset.x + pad * z) + 'px',
                              top: (b.y * z + canvasOffset.y + (host ? 8 * z : 0)) + 'px',
                              width: Math.max(40, (b.w - pad * 2) * z) + 'px',
                              height: Math.max(fz * 1.4, (host ? b.h - 16 * z : Math.max(s.h, 20) * z)) + 'px',
                              font: `${fz}px ${FONT_UI}`,
                              lineHeight: (textLH(s) * z) + 'px',
                              color: s.sc, caretColor: s.sc,
                              textAlign: s.ta || (host ? 'center' : 'left'),
                              background: 'rgba(26,25,24,.72)',
                              border: '1px solid var(--accent)', borderRadius: 6,
                              outline: 'none', resize: 'none', padding: 0, margin: 0,
                              overflow: 'hidden', whiteSpace: 'pre-wrap'
                            }} />
                        );
                      })()}

                      <div id="wb-container" ref={canvasRef} style={{ transform: `translate(${viewRef.current.x}px, ${viewRef.current.y}px) scale(${viewRef.current.z})`, transformOrigin: '0 0', position: 'absolute', inset: 0, width: '4000px', height: '4000px', zIndex: 20 }}>
                        
                        {selectionBox && (
                            <div className="absolute border border-indigo-500 bg-indigo-500/20 z-50 pointer-events-none" style={{
                                left: Math.min(selectionBox.startX, selectionBox.currentX),
                                top: Math.min(selectionBox.startY, selectionBox.currentY),
                                width: Math.abs(selectionBox.currentX - selectionBox.startX),
                                height: Math.abs(selectionBox.currentY - selectionBox.startY)
                            }} />

                              связь при снятии карточки никуда не девается, но
                              линия к отсутствующей карточке уходила бы в пустоту. */}
                          {[
                            ...references.filter(r => r.boardId === activeBoardId).map(r => ({ item: r, type: 'ref' })),
                            ...stickies.filter(st => belongsToBoard(st, activeBoardId)).map(st => ({ item: st, type: 'sticky' })),
                            ...boardDocs.map(d => ({ item: d, type: 'doc' }))
                          ].map(({ item, type }) => {
                            if (!item.sceneId) return null;
                            const t = boardScenes.find(s => s.id === item.sceneId); if (!t) return null;
                            const a = linkAnchor(item, type); const ex = t.x; const ey = t.y + 50;
                            const on = selectedWbItems.includes(item.id) || selectedWbItems.includes(t.id);
                            return (<path key={`link-${item.id}`} d={`M ${a.x} ${a.y} C ${(a.x + ex) / 2} ${a.y}, ${(a.x + ex) / 2} ${ey}, ${ex} ${ey}`} fill="none" stroke={on ? "#d97757" : "rgba(217,119,87,0.6)"} strokeWidth={on ? "4" : "3"} strokeDasharray="6 6" />);
                          })}
                          {linkingFrom && (() => {
                             const src = linkingFrom.type === 'sticky' ? stickies.find(x => x.id === linkingFrom.id)
                                       : linkingFrom.type === 'doc' ? docs.find(x => x.id === linkingFrom.id)
                                       : linkingFrom.type === 'scene' ? scenes.find(x => x.id === linkingFrom.id)
                                       : references.find(x => x.id === linkingFrom.id);
                             if (!src) return null;
                             const a = linkAnchor(src, linkingFrom.type);
                             const ex = (mousePos.x - canvasRef.current?.getBoundingClientRect().left) / zoom;
                             const ey = (mousePos.y - canvasRef.current?.getBoundingClientRect().top) / zoom;
                             return <path d={`M ${a.x} ${a.y} C ${(a.x + ex) / 2} ${a.y}, ${(a.x + ex) / 2} ${ey}, ${ex} ${ey}`} fill="none" stroke="#d97757" strokeWidth="4" />;
                          })()}
                        </svg>


                        <div className="absolute inset-0 w-[4000px] h-[4000px] z-20 pointer-events-none">
                            {boardScenes.map(s => (
                            <div key={s.id} data-scene-id={s.id} data-card-id={s.id} onPointerDown={(e) => handleElementPointerDown(e, s.id, 'scene')} style={{ left: `${s.x}px`, top: `${s.y}px`, position: 'absolute' }} className={`w-72 glass-panel rounded-lg cursor-move pointer-events-auto hover:border-indigo-500/50 group ${isDragging(s.id) ? '' : 'transition-all'} ${selectedWbItems.includes(s.id) ? 'ring-2 ring-indigo-500 scale-[1.02]' : 'border-t border-white/10'} ${hoveredSceneId === s.id ? 'scene-drop-target' : ''}`}>
                                <div className="bg-white/5 px-4 py-2.5 border-b border-white/10 flex justify-between items-center" style={{ borderTopLeftRadius: 11, borderTopRightRadius: 11 }}>
                                  <span className="text-[11px] font-mono text-zinc-400 font-bold uppercase tracking-wider flex items-center gap-1"><Icons.Scene/> Сцена #{s.number}</span>
                                  {/* Убирает карточку с доски, а не сцену из проекта */}
                                  <button onClick={(e) => { e.stopPropagation(); removeSceneFromBoard(s.id); }}
                                          title="Убрать с доски — сцена и её связи останутся в проекте"
                                          className={`cf-edit-only w-6 h-6 flex items-center justify-center rounded-md text-zinc-500 hover:text-white hover:bg-white/10 transition-all text-[11px] ${selectedWbItems.includes(s.id) ? '' : 'opacity-0 group-hover:opacity-100'}`}>✕</button>
                                </div>
                                <div className="p-4 space-y-2">
                                {cardField(s.id, 'title', s.title, (v) => updateSceneTitle(s.id, v),
                                  { placeholder: 'Название сцены', className: 'w-full bg-transparent text-sm font-black text-white focus:outline-none' })}
                                {cardField(s.id, 'content', s.content, (v) => updateScene(s.id, 'content', v),
                                  { multiline: true, placeholder: 'Экспликация…', style: { minHeight: 46, maxHeight: 46 },
                                    className: 'w-full bg-black/50 border border-white/10 rounded-lg p-2.5 text-[11px] text-zinc-300 resize-none focus:outline-none font-medium' })}
                                </div>
                                {/* Тот же кружок, что у остальных карточек: со сцены
                                    тоже надо уметь протянуть связь */}
                                <div onPointerDown={(e) => { e.stopPropagation(); setLinkingFrom({ id: s.id, type: 'scene' }); }}
                                     title="Потяните к любой карточке — получится связь"
                                     className="node-handle cf-edit-only absolute right-[-8px] top-1/2 -translate-y-1/2 w-5 h-5 bg-indigo-500 rounded-full border-4 border-[#1a1918] cursor-crosshair hover:scale-125 z-30"
                                     style={{ pointerEvents: 'auto' }} />
                            </div>
                            ))}

                            {references.filter(r => r.boardId === activeBoardId).map(ref => (
                            <div key={ref.id} data-card-id={ref.id} onPointerDown={(e) => handleElementPointerDown(e, ref.id, 'ref')} style={{ left: `${ref.x}px`, top: `${ref.y}px`, width: `${refW(ref)}px`, position: 'absolute' }} className={`glass-panel p-2.5 rounded-lg cursor-move pointer-events-auto group hover:border-indigo-500/50 ${(resizingRef && resizingRef.id === ref.id) || isDragging(ref.id) ? '' : 'transition-all'} ${selectedWbItems.includes(ref.id) ? 'ring-2 ring-indigo-500' : 'border-t border-white/10'} ${hoveredSceneId === ref.id ? 'scene-drop-target' : ''}`}>
                                <div className="relative bg-black/60 rounded-lg overflow-hidden border border-white/10" style={{ aspectRatio: String(refAR(ref)) }}>
                                <button title="Удалить референс из проекта" onClick={() => setConfirmAction({title:'Удалить референс?', message: (ref.label ? `«${ref.label}» удалится` : 'Референс удалится') + ' из проекта целиком, не только с доски. Сразу после удаления его можно будет вернуть кнопкой.', onConfirm:()=> deleteRefs([ref])})} className={`cf-edit-only absolute top-1.5 right-1.5 bg-black/80 backdrop-blur border border-white/10 text-zinc-400 hover:text-red-400 w-8 h-8 rounded-lg transition-all text-xs z-20 flex items-center justify-center ${selectedWbItems.includes(ref.id) ? '' : 'opacity-0 group-hover:opacity-100'}`}><Icons.Trash/></button>
                                {/* Убрать с доски — не то же, что удалить: в галерее
                                    референс остаётся. У сцены и документа такая
                                    кнопка есть, у референса её не было вовсе, и
                                    пустую карточку убрать было нечем. */}
                                <button title="Убрать с доски — референс останется в галерее"
                                        onClick={(e) => { e.stopPropagation(); removeRefFromBoard(ref.id); }}
                                        className={`cf-edit-only absolute top-1.5 left-1.5 bg-black/80 backdrop-blur border border-white/10 text-zinc-400 hover:text-white w-8 h-8 rounded-lg transition-all text-[13px] z-20 flex items-center justify-center ${selectedWbItems.includes(ref.id) ? '' : 'opacity-0 group-hover:opacity-100'}`}>✕</button>
                                {ref.url ? (<React.Fragment>
                                    <div className="absolute inset-0 bg-cover bg-center blur-md opacity-25 pointer-events-none" style={bgStyle(ref.id, ref.url)}></div>
                                    <img src={ref.url} onLoad={(e) => noteRefRatio(ref, e.target)}
                                         className="w-full h-full object-contain pointer-events-none relative z-[1]" draggable="false" />
                                </React.Fragment>) : (
                                    /* Заполняем именно эту карточку, а не создаём рядом новую */
                                    <PhotoSourcePicker multiple={false} cardTap
                                        onFiles={(fs) => { const f = fs[0]; if (f) fillRefImage(ref.id, f); }}
                                        style={{pointerEvents: 'auto'}} className="text-xs font-bold text-zinc-500 hover:text-indigo-400 w-full h-full flex flex-col items-center justify-center transition-colors hover:bg-white/5">
                                    <span className="mb-1"><Icons.Gallery/></span><span>Загрузить</span>
                                    </PhotoSourcePicker>
                                )}
                                </div>
                                {cardField(ref.id, 'label', ref.label,
                                  (v) => { const up = references.map(r => r.id === ref.id ? { ...r, label: v } : r); setReferences(up); syncDoc('references', ref.id, up.find(r => r.id === ref.id)); },
                                  { placeholder: 'Подпись...', className: 'w-full bg-transparent text-[11px] text-center font-bold text-zinc-300 focus:outline-none mt-2 placeholder-zinc-600' })}
                                <div className="cf-edit-only" onPointerDown={(e) => { e.stopPropagation(); setLinkingFrom({ id: ref.id, type: 'ref' }); }} title="Потяните к любой карточке — получится связь. К сцене — референс привяжется к ней" className="node-handle cf-edit-only absolute right-[-8px] top-1/2 -translate-y-1/2 w-5 h-5 bg-indigo-500 rounded-full border-4 border-[#1a1918] cursor-crosshair hover:scale-125 z-30" style={{pointerEvents: 'auto'}} />
                                <div
                                    onPointerDown={(e) => { e.stopPropagation(); setResizingRef({ id: ref.id, pointerId: e.pointerId, startX: e.clientX, startW: refW(ref) }); e.currentTarget.setPointerCapture(e.pointerId); }}
                                    onDoubleClick={(e) => { e.stopPropagation(); const up = references.map(r => r.id === ref.id ? { ...r, w: REF_W } : r); setReferences(up); syncDoc('references', ref.id, up.find(r => r.id === ref.id)); }}
                                    title="Потяните, чтобы изменить размер. Двойной клик — вернуть исходный"
                                    className={`node-handle cf-edit-only absolute right-[-7px] bottom-[-7px] w-6 h-6 rounded-md bg-zinc-700 hover:bg-indigo-500 border-2 border-[#1a1918] cursor-nwse-resize z-30 flex items-center justify-center transition-colors ${(resizingRef && resizingRef.id === ref.id) || selectedWbItems.includes(ref.id) ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'}`}
                                    style={{pointerEvents: 'auto', touchAction: 'none'}}>
                                    <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#f0eee6" strokeWidth="1.6" strokeLinecap="round"><path d="M9 2 2 9"/><path d="M9 6.5 6.5 9"/></svg>
                                </div>
                                {resizingRef && resizingRef.id === ref.id && (
                                    <div className="absolute -top-7 left-1/2 -translate-x-1/2 bg-black/90 border border-white/20 text-[11px] font-mono font-bold text-white px-2 py-0.5 rounded-md z-40 pointer-events-none whitespace-nowrap">{refW(ref)} px</div>
                                )}
                            </div>
                            ))}

                            {/* Документы: заголовок и длинный текст, правятся прямо
                                здесь и открываются целиком в «Экспликациях» */}
                            {boardDocs.map(d => {
                            const dSel = selectedWbItems.includes(d.id);
                            const dRes = resizingDoc && resizingDoc.id === d.id;
                            const dScene = d.sceneId ? scenes.find(x => x.id === d.sceneId) : null;
                            return (
                            <div key={d.id} data-card-id={d.id} onPointerDown={(e) => handleElementPointerDown(e, d.id, 'doc')}
                                 style={{ left: `${d.x}px`, top: `${d.y}px`, width: `${docCardW(d)}px`, height: `${docCardH(d)}px`, position: 'absolute', zIndex: dSel ? 40 : 20 }}
                                 className={`glass-panel rounded-lg cursor-move pointer-events-auto flex flex-col overflow-hidden group ${dRes || isDragging(d.id) ? '' : 'transition-all'} ${dSel ? 'ring-2 ring-indigo-500' : 'border-t border-white/10'} ${hoveredSceneId === d.id ? 'scene-drop-target' : ''}`}>
                                <div className="flex items-center gap-1.5 px-3 shrink-0" style={{ minHeight: 32, background: 'rgba(255,255,255,.05)', borderBottom: '1px solid var(--border)' }}>
                                    <span style={{ color: 'var(--muted)' }}><Icons.Docs /></span>
                                    {cardField(d.id, 'title', d.title, (v) => patchDoc(d.id, { title: v }),
                                      { placeholder: 'Заголовок документа',
                                        className: 'flex-1 min-w-0 bg-transparent text-[12px] font-bold text-white focus:outline-none placeholder-zinc-600' })}
                                    <button onClick={(e) => { e.stopPropagation(); setActiveDocId(d.id); setActiveSchemeId(null); setCurrentView('docs'); }}

                                )}

                            {stickies.filter(st => belongsToBoard(st, activeBoardId)).map(st => {

                                <button onClick={(e) => { e.stopPropagation(); setConfirmAction({title:'Удалить заметку?', message:'', onConfirm:()=> { pushUndo(false, [{ coll: 'stickies', id: st.id }]); freezeArrowsForCards([st.id]); setStickies(stickies.filter(s => s.id !== st.id)); deleteNetDoc('stickies', st.id); }}); }} className={`cf-edit-only absolute top-2 right-2 w-6 h-6 flex items-center justify-center text-black/60 hover:bg-black/10 rounded-full text-[11px] transition-colors ${stSel ? '' : 'opacity-0 group-hover:opacity-100'}`}>✕</button>
                                {cardField(st.id, 'text', st.text,
                                  (v) => { const up = stickies.map(s => s.id === st.id ? { ...s, text: v } : s); setStickies(up); syncDoc('stickies', st.id, up.find(s => s.id === st.id)); },
                                  { multiline: true, style: { height: '100%' }, placeholder: 'Текст заметки...',
                                    className: 'w-full bg-transparent border-none text-[13px] focus:outline-none resize-none font-bold text-zinc-900 leading-tight placeholder-black/50' })}

                                {/* Ручка связи — та же, что у референса: тянем к сцене */}
                                <div onPointerDown={(e) => { e.stopPropagation(); setLinkingFrom({ id: st.id, type: 'sticky' }); }}
                                     title="Потяните к любой карточке — получится связь. К сцене — заметка привяжется к ней"
                                     className="node-handle cf-edit-only absolute right-[-8px] top-1/2 -translate-y-1/2 w-5 h-5 bg-indigo-500 rounded-full border-4 border-[#1a1918] cursor-crosshair hover:scale-125 z-30"
                                     style={{ pointerEvents: 'auto' }} />
                                {/* Привязанная сцена: видно с доски и можно отцепить */}
                                {st.sceneId && (() => {

                                              style={{ pointerEvents: 'auto', height: 18, fontSize: 9.5, background: 'var(--accent)', color: 'var(--bg)' }}>

                                     style={{ pointerEvents: 'auto', touchAction: 'none', zIndex: 30 }}
                                     onPointerDown={(e) => { e.stopPropagation(); setResizingSticky({ id: st.id, pointerId: e.pointerId, startX: e.clientX, startY: e.clientY, startW: stickyW(st), startH: stickyH(st) }); e.currentTarget.setPointerCapture(e.pointerId); }}
                                     onDoubleClick={(e) => { e.stopPropagation(); const up = stickies.map(s => s.id === st.id ? { ...s, w: STICKY_W, h: STICKY_H } : s); setStickies(up); syncDoc('stickies', st.id, up.find(s => s.id === st.id)); }}
                                     title="Потяните, чтобы изменить размер. Двойной клик — вернуть исходный">
                                    <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#f0eee6" strokeWidth="1.6" strokeLinecap="round"><path d="M9 2 2 9"/><path d="M9 6.5 6.5 9"/></svg>
                                </div>
                                {stResizing && (

                                    на мелком зуме кнопки иначе не попасть пальцем. */}
                                {paletteStickyId === st.id && !stResizing && (
                                    <div className="node-handle cf-edit-only absolute left-1/2 bottom-full flex items-center gap-1.5 px-2 py-1.5 rounded-lg"

                                                    className={`rounded-full border-2 transition-transform ${st.color === c ? 'border-white scale-110' : 'border-transparent hover:scale-110'}`} />
                                        ))}
                                        <input type="color" value={st.color || '#fef08a'} onChange={(e) => paintStickies(st.id, e.target.value)}
                                               title="Свой цвет" style={{ width: 22, height: 22 }}
                                               className="wb-color-well rounded-full border-2 border-white/30 cursor-pointer bg-transparent" />
                                    </div>
                                )}
                            </div>
                            );
                            })}
                        </div>
                      </div>

                      {/* ПАНЕЛЬ ИНСТРУМЕНТОВ — вертикальная полоса 44 точки
                          слева, со своим скроллом. Девятнадцать кнопок в одну
                          колонку в экран не влезали и молча срезались снизу:
                          «очистить» просто не существовало. Развели по смыслу —
                          здесь осталось РИСОВАНИЕ и навигация, а «положить
                          на доску / стикер / референс / PNG / SVG / очистить»
                          переехали вправо, в строку вкладок досок. */}
                      <div className="cf-tools absolute z-30 flex flex-col items-center gap-1"
                           style={{ left: 12, top: 12, width: 'var(--tool-rail)', maxHeight: 'calc(100% - 24px)',
                                    background: 'var(--card)', border: '1px solid var(--border)', borderRadius: 10,
                                    padding: 6, overflowY: 'auto', scrollbarWidth: 'none' }}>
                        <button onClick={() => setWbMode('select')} className={`cf-tool ${wbMode === 'select' ? 'on' : ''}`} title="Выбор элементов · тяните за уголки, Ctrl во время движения выключает притяжку"><Icons.Pointer/></button>
                        <button onClick={() => setWbMode('draw')} className={`cf-tool cf-edit-only ${wbMode === 'draw' ? 'on' : ''}`} title="Кисть"><Icons.Pen/></button>
                        <button onClick={() => setWbMode('shape')} className={`cf-tool cf-edit-only ${wbMode === 'shape' ? 'on' : ''}`} title="Фигуры: прямоугольник, овал, ромб, стрелка, линия"><Icons.Shapes/></button>
                        <button onClick={() => setWbMode('erase')} className={`cf-tool cf-edit-only ${wbMode === 'erase' ? 'on' : ''}`} title="Ластик"><Icons.Eraser/></button>
                        <button onClick={() => setWbMode('ocr')} disabled={ocrBusy}
                                className={`cf-tool cf-edit-only ${wbMode === 'ocr' ? 'on' : ''} ${ocrBusy ? 'opacity-50' : ''}`}
                                title="Рукопись в текст: обведите написанное пером, и оно станет печатным"><Icons.Ocr/></button>
                        <button onClick={() => { setWbMode('link'); linkPick.current = null; bindCand.current = null; requestLive(); showToast('Нажмите на первый объект, потом на второй'); }}
                                className={`cf-tool cf-edit-only ${wbMode === 'link' ? 'on' : ''}`}
                                title="Связь: нажмите на один объект, потом на другой"><Icons.Link/></button>
                        <button onClick={() => setWbMode('pan')} className={`cf-tool ${wbMode === 'pan' ? 'on' : ''}`} title="Панорамирование"><Icons.Move/></button>
                        {/* Появляется только после первого касания стилусом:
                            на устройстве без пера этой кнопке нечего делать. */}
                        {penSeen && <button onClick={toggleFingerPans} className={`cf-tool ${fingerPans ? 'on' : ''}`}
                          title={fingerPans ? 'Рисует только стилус, палец двигает доску. Нажмите, чтобы палец тоже рисовал' : 'Палец тоже рисует. Нажмите, чтобы рисовал только стилус'}><Icons.Hand/></button>}
                        <button onClick={undoStroke} disabled={!canUndo} title="Отменить штрих (Ctrl+Z)"
                                className={`cf-tool cf-edit-only ${canUndo ? '' : 'off'}`}>
                          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
                        </button>
                        {/* Штрихи векторные, поэтому шаг назад стоит копейки —
                            и шаг вперёд можно наконец дать тоже. */}
                        <button onClick={redoStroke} disabled={!canRedo} title="Вернуть штрих (Ctrl+Shift+Z)"
                                className={`cf-tool cf-edit-only ${canRedo ? '' : 'off'}`}>
                          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
                        </button>
                      </div>

                      {/* ПУСТАЯ ДОСКА — НЕ ПУСТОЙ ЭКРАН.
                          Чистый холст в точку не подсказывает, что с ним
                          делать, и доска годами оставалась «той вкладкой,
                          куда я не хожу». Три шаблона отвечают на три
                          настоящих вопроса: как поставить свет, как собрать
                          настроение и как разложить кадры сцены.
                          Уходит, как только взяли инструмент. */}
                      {wbMode === 'select' && !READ_ONLY && !boardInked
                        && boardScenes.length === 0 && boardDocs.length === 0
                        && !stickies.some(st => belongsToBoard(st, activeBoardId))
                        && !references.some(r => r.boardId === activeBoardId) && (
                        <div className="absolute inset-0 z-20 flex items-center justify-center pointer-events-none" style={{ paddingLeft: 70 }}>
                          {/* width:100% обязателен вместе с maxWidth: во flex
                              с центрированием ширина иначе считается по
                              содержимому, и сетка шаблонов схлопывалась
                              в одну колонку. */}
                          <div className="text-center pointer-events-auto" style={{ width: '100%', maxWidth: 640, padding: 24 }}>
                            <div style={{ fontSize: 20, fontWeight: 700, letterSpacing: '-.02em' }}>Пустой холст — начните с шаблона</div>
                            <div style={{ fontSize: 12.5, color: 'var(--muted)', marginTop: 6 }}>или перетащите сюда кадры из галереи — они лягут стопкой</div>
                            <div className="grid gap-3 mt-4" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(min(180px, 100%), 1fr))' }}>
                              <button onClick={newSchemeHere} className="cf-tpl text-left">
                                <svg width="100%" height="72" viewBox="0 0 160 72" fill="none">
                                  <rect x="60" y="26" width="40" height="20" rx="2" stroke="var(--muted-2)" strokeWidth="1.5" />
                                  <path d="M30 14 L52 30 M30 14 l14 2 M30 14 l2 13" stroke="var(--warn)" strokeWidth="1.5" />
                                  <circle cx="26" cy="12" r="6" stroke="var(--warn)" strokeWidth="1.5" />
                                  <path d="M128 58 L104 44 M128 58 l-4 -13 M128 58 l-13 -3" stroke="var(--accent)" strokeWidth="1.5" />
                                  <rect x="128" y="54" width="10" height="8" rx="1" stroke="var(--accent)" strokeWidth="1.5" />
                                </svg>
                                <div style={{ fontSize: 12.5, fontWeight: 600, marginTop: 8 }}>Схема света</div>
                                <div style={{ fontSize: 11, color: 'var(--muted-2)', marginTop: 3 }}>план площадки: приборы с конусами, камера с углом обзора</div>
                              </button>

                              <button onClick={() => setRefPicker({ mode: 'board' })} className="cf-tpl text-left">
                                <svg width="100%" height="72" viewBox="0 0 160 72" fill="none">
                                  <rect x="14" y="10" width="42" height="30" rx="2" stroke="var(--muted-2)" strokeWidth="1.5" />
                                  <rect x="62" y="18" width="36" height="46" rx="2" stroke="var(--muted-2)" strokeWidth="1.5" />
                                  <rect x="104" y="8" width="44" height="26" rx="2" stroke="var(--muted-2)" strokeWidth="1.5" />
                                  <rect x="30" y="46" width="26" height="18" rx="2" stroke="var(--accent)" strokeWidth="1.5" />
                                </svg>
                                <div style={{ fontSize: 12.5, fontWeight: 600, marginTop: 8 }}>Мудборд</div>
                                <div style={{ fontSize: 11, color: 'var(--muted-2)', marginTop: 3 }}>свободная сетка под референсы из галереи</div>
                              </button>

                              {/* Карточка кликается ЦЕЛИКОМ. Раньше обработчик
                                  висел только на строке с названием, и нажатие
                                  почти в любое место карточки не делало ничего:
                                  выглядело как сломанная кнопка. Чипы пропорции
                                  внутри — отдельные нажатия, они всплытие гасят. */}
                              <div className="cf-tpl text-left"
                                   onClick={() => { if (activeSceneId) spreadSceneOnBoard(activeSceneId, activeBoardId); else showToast('Сначала выберите сцену на экране «Сцены»'); }}>
                                <svg width="100%" height="72" viewBox="0 0 160 72" fill="none">
                                  <rect x="10" y="22" width="42" height="18" rx="2" stroke="var(--muted-2)" strokeWidth="1.5" />
                                  <rect x="59" y="22" width="42" height="18" rx="2" stroke="var(--muted-2)" strokeWidth="1.5" />
                                  <rect x="108" y="22" width="42" height="18" rx="2" stroke="var(--muted-2)" strokeWidth="1.5" />
                                  <path d="M52 31 h7 M101 31 h7" stroke="var(--accent)" strokeWidth="1.5" />
                                </svg>
                                <div style={{ fontSize: 12.5, fontWeight: 600, marginTop: 8 }}>
                                  Раскадровка{(() => { const sc = scenes.find(x => x.id === activeSceneId); return sc ? ` · сц ${sc.number}` : ''; })()}
                                </div>
                                <div style={{ fontSize: 11, color: 'var(--muted-2)', marginTop: 3 }}>кадры и референсы сцены лентой на эту доску · пропорция:</div>
                                {/* Пропорция кадра — общая для проекта: её же
                                    берут превью раскадровки на экране сцены,
                                    чтобы раскадровка обещала тот кадр, который
                                    в итоге снимут. */}
                                <div className="flex gap-1 mt-1.5">
                                  {SHOT_RATIOS.map(([label, val]) => (
                                    <button key={label} onClick={(e) => { e.stopPropagation(); setProjectRatio(val); }}
                                            title={`Пропорция кадра ${label} для всего проекта`}
                                            style={{ fontFamily: 'var(--font-mono)', fontSize: 9.5, padding: '3px 7px', borderRadius: 5, fontWeight: 600,
                                                     background: projectRatio === val ? 'var(--accent)' : 'transparent',
                                                     color: projectRatio === val ? 'var(--bg)' : 'var(--muted)',
                                                     border: projectRatio === val ? 'none' : '1px solid var(--border)' }}>{label}</button>
                                  ))}
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      )}

                      {/* Какие сцены можно положить на эту доску. Доска — текущая
                          работа, поэтому список, а не «все сразу». */}
                      {scenePickerOpen && (
                        <div className="absolute glass-panel rounded-lg z-30 w-72 max-w-[calc(100vw-2rem)] border-t border-white/10 flex flex-col top-16 md:top-6 left-2 md:left-24" style={{ maxHeight: '60vh' }}>
                          <div className="flex items-center justify-between px-3 shrink-0" style={{ minHeight: 40, borderBottom: '1px solid var(--border)' }}>
                            <span className="cf-eyebrow">Положить на доску</span>
                            <button onClick={() => setScenePickerOpen(false)} className="w-6 h-6 flex items-center justify-center rounded text-zinc-500 hover:text-white hover:bg-white/10 text-[11px]">✕</button>
                          </div>
                          <div className="overflow-y-auto p-1.5">
                            {/* Три раздела, у каждого свой заголовок и своё поведение.
                                Референсы тут есть всегда: это единственный путь
                                к уже загруженным картинкам с самой доски. */}
                            {(() => {
                              // ВАЖНО: этот узкий список — только «последние
                              // несколько», а не вся галерея. Раньше он молча
                              // показывал первые ШЕСТЬДЕСЯТ, и на проекте
                              // в триста референсов выглядело так, будто
                              // часть картинок пропала: их просто нечем было
                              // ни найти, ни долистать. Полный список с поиском
                              // и папками — за кнопкой «Выбрать из галереи».
                              const pool = references.filter(r => r.url && r.boardId !== activeBoardId);
                              const SHOW = 8;
                              const head = pool.slice(-SHOW).reverse();   // последние загруженные — сверху
                              const rest = pool.length - head.length;
                              return (
                                <React.Fragment>
                                  <div className="px-2 pt-1 pb-1.5 flex items-center justify-between gap-2">
                                    <span className="cf-eyebrow">Референсы</span>
                                    {pool.length > 0 && <span className="cf-meta">{pool.length} свободных</span>}
                                  </div>
                                  {pool.length === 0 ? (
                                    <p className="px-2 pb-2" style={{ fontSize: 11.5, color: 'var(--muted-2)' }}>
                                      {references.length ? 'Все референсы уже на этой доске.' : 'Референсов пока нет — загрузите их в «Галерее».'}
                                    </p>
                                  ) : (
                                    <React.Fragment>
                                      <button onClick={() => { setRefPicker({ mode: 'board' }); setScenePickerOpen(false); }}
                                              className="w-full text-left px-2 rounded-md hover:bg-white/5 flex items-center gap-2 transition-colors"
                                              style={{ minHeight: 40, border: '1px dashed var(--border)', color: 'var(--accent)', marginBottom: 4 }}>
                                        <span className="shrink-0"><Icons.Gallery /></span>
                                        <span className="truncate flex-1" style={{ fontSize: 12.5 }}>Выбрать из галереи…</span>
                                      </button>
                                      {head.map(r => (
                                        <button key={r.id} onClick={() => { putRefOnBoard(r); setScenePickerOpen(false); }}
                                                className="w-full text-left px-2 rounded-md hover:bg-white/5 flex items-center gap-2 transition-colors"
                                                style={{ minHeight: 40 }}>
                                          <img src={r.url} alt="" className="shrink-0 rounded" style={{ width: 28, height: 28, objectFit: 'cover' }} />
                                          <span className="truncate flex-1" style={{ fontSize: 12.5, color: 'var(--text-2)' }}>{r.label || 'Без названия'}</span>
                                          {r.boardId && <span className="cf-meta shrink-0">на другой</span>}
                                        </button>
                                      ))}
                                      {/* Никаких молчаливых обрезаний: сколько
                                          не показано — сказано прямо. */}
                                      {rest > 0 && (
                                        <button onClick={() => { setRefPicker({ mode: 'board' }); setScenePickerOpen(false); }}
                                                className="w-full text-left px-2 py-1.5 rounded-md hover:bg-white/5 transition-colors"
                                                style={{ fontSize: 11.5, color: 'var(--muted-2)' }}>
                                          …и ещё {rest} — открыть галерею с поиском
                                        </button>
                                      )}
                                    </React.Fragment>
                                  )}
                                </React.Fragment>
                              );
                            })()}

                            <div className="px-2 pt-3 pb-1.5" style={{ borderTop: '1px solid var(--border-soft)' }}><span className="cf-eyebrow">Документы</span></div>
                            {offBoardDocs.length === 0 ? (
                              <p className="px-2 pb-2" style={{ fontSize: 11.5, color: 'var(--muted-2)' }}>
                                {docs.length ? 'Все документы уже на этой доске.' : 'Документов пока нет.'}
                              </p>
                            ) : offBoardDocs.map(d => (
                              <button key={d.id} onClick={() => { putDocOnBoard(d.id); setScenePickerOpen(false); }}
                                      className="w-full text-left px-2 rounded-md hover:bg-white/5 flex items-center gap-2 transition-colors"
                                      style={{ minHeight: 40 }}>
                                <span className="shrink-0" style={{ color: 'var(--muted-2)' }}><Icons.Docs /></span>
                                <span className="truncate flex-1" style={{ fontSize: 12.5, color: 'var(--text-2)' }}>{d.title || 'Без названия'}</span>
                                {d.boardId && <span className="cf-meta shrink-0">на другой</span>}
                              </button>
                            ))}

                            <div className="px-2 pt-3 pb-1.5" style={{ borderTop: '1px solid var(--border-soft)' }}><span className="cf-eyebrow">Сцены</span></div>
                            {offBoardScenes.length === 0 ? (
                              <p className="px-2 pb-2" style={{ fontSize: 11.5, color: 'var(--muted-2)' }}>
                                {sortedScenes.length ? 'Все сцены уже на этой доске.' : 'В проекте пока нет сцен.'}
                              </p>
                            ) : offBoardScenes.map(s => {
                              const where = s.boardId ? (sortedBoards.find(b => b.id === s.boardId) || {}).title : null;
                              return (
                                <button key={s.id} onClick={() => { putSceneOnBoard(s.id); setScenePickerOpen(false); }}
                                        className="w-full text-left px-2 rounded-md hover:bg-white/5 flex items-center gap-2 transition-colors"
                                        style={{ minHeight: 40 }}>
                                  <span className="font-mono text-[11px] font-bold shrink-0" style={{ color: 'var(--accent)' }}>#{s.number || '—'}</span>
                                  <span className="truncate flex-1" style={{ fontSize: 12.5, color: 'var(--text-2)' }}>{s.title || 'Без названия'}</span>
                                  {where && <span className="cf-meta shrink-0">на «{where}»</span>}
                                </button>
                              );
                            })}
                          </div>
                        </div>
                      )}

                      {/* ПАНЕЛЬ СВОЙСТВ. Контекстная: в режиме фигур задаёт,
                          чем рисовать дальше, а если что-то выделено — правит
                          выделенное. Показываем только то, что применимо:
                          у линии нет заливки, у овала нет наконечников.
                          Палитра НАМЕРЕННО короткая — из шести цветов доска
                          всегда выглядит прилично, из шестнадцати миллионов
                          нет. Свой цвет спрятан за отдельной кнопкой. */}
                      {(wbMode === 'shape' || (wbMode === 'select' && selShapes.length > 0)) && (() => {
                        const selNow = wbMode === 'select' ? selShapes.map(id => shapesRef.current.find(s => s.id === id)).filter(Boolean) : [];
                        // Чем правим: выделенным или заготовкой на будущее
                        const cur = selNow.length ? selNow[0] : shapeStyle;
                        const kinds = selNow.length ? selNow.map(s => s.k) : [shapeKind];
                        const anyText = kinds.some(k => k === 'text');
                        const onlyText = kinds.every(k => k === 'text');
                        const anyClosed = kinds.some(k => !isLineKind(k) && k !== 'text');
                        const anyLine = kinds.some(k => isLineKind(k));
                        const anyArrow = kinds.some(k => k === 'arrow');
                        const anyRect = kinds.some(k => k === 'rect');
                        const row = "flex bg-black/50 p-1 rounded-lg border border-white/5 gap-1";
                        const cell = (on) => `flex-1 py-1 rounded-md text-[11px] font-bold transition-all ${on ? 'bg-indigo-500 text-[#1a1918]' : 'text-zinc-500 hover:text-white'}`;
                        const cap = "text-[10.5px] text-zinc-500 font-bold uppercase tracking-wider block";
                        return (
                        <div className="absolute top-16 md:top-6 left-2 md:left-24 glass-panel p-3 rounded-lg flex flex-col space-y-2 z-30 w-52 border-t border-white/10 max-h-[calc(100%-3rem)] overflow-y-auto hide-scrollbar">
                          {wbMode === 'shape' && (
                            <div className={row}>
                              {[['rect', Icons.ShRect, 'Прямоугольник'], ['ellipse', Icons.ShEllipse, 'Овал'], ['diamond', Icons.ShDiamond, 'Ромб'], ['arrow', Icons.ShArrow, 'Стрелка'], ['line', Icons.ShLine, 'Линия'], ['text', Icons.ShText, 'Текст']].map(([k, Ic, t]) => (
                                <button key={k} title={t} onClick={() => setShapeKind(k)}
                                        className={`flex-1 py-1.5 rounded-md flex items-center justify-center transition-all ${shapeKind === k ? 'bg-indigo-500 text-[#1a1918]' : 'text-zinc-500 hover:text-white'}`}><Ic/></button>
                              ))}
                            </div>
                          )}
                          {selNow.length > 0 && (
                            <div className="flex items-center justify-between">
                              <span className={cap}>Выбрано: {selNow.length}</span>
                              <button onClick={() => deleteShapes()} title="Удалить (Delete)"
                                      className="px-2 py-1 rounded-md text-[11px] font-bold text-red-400 hover:bg-white/10">Удалить</button>
                            </div>
                          )}

                          <div className="space-y-1">
                            <span className={cap}>{onlyText ? 'Цвет' : 'Линия'}</span>
                            <div className="grid grid-cols-7 gap-1.5 items-center">
                              {SHAPE_COLORS.map(c => (
                                <button key={c} onClick={() => patchShapes({ sc: c })} style={{ backgroundColor: c }}
                                        className={`w-5 h-5 rounded-full border-2 ${cur.sc === c ? 'border-white scale-110' : 'border-transparent'} transition-transform`} />
                              ))}
                              <input type="color" value={cur.sc} onChange={(e) => patchShapes({ sc: e.target.value })} title="Свой цвет"
                                     className="wb-color-well w-5 h-5 rounded-full border-2 border-white/30 cursor-pointer bg-transparent" />
                            </div>
                          </div>

                          {anyClosed && (
                            <div className="space-y-1">
                              <span className={cap}>Заливка</span>
                              <div className="grid grid-cols-7 gap-1.5 items-center">
                                {SHAPE_FILLS.map(c => (
                                  <button key={c} onClick={() => patchShapes({ bg: c })} title={c === 'transparent' ? 'Без заливки' : ''}
                                          style={c === 'transparent' ? {} : { backgroundColor: c, opacity: 0.55 }}
                                          className={`w-5 h-5 rounded-full border-2 flex items-center justify-center ${cur.bg === c ? 'border-white scale-110' : 'border-transparent'} transition-transform ${c === 'transparent' ? 'bg-black/40' : ''}`}>
                                    {c === 'transparent' && <span className="block w-3.5 h-[1.5px] bg-zinc-500 rotate-45" />}
                                  </button>
                                ))}
                              </div>
                              {cur.bg !== 'transparent' && (
                                <div className={row}>
                                  {[['solid', 'Сплошь'], ['hachure', 'Штрих'], ['cross', 'Сетка']].map(([v, t]) => (
                                    <button key={v} onClick={() => patchShapes({ fs: v })} className={cell(cur.fs === v)}>{t}</button>
                                  ))}
                                </div>
                              )}
                            </div>
                          )}

                          {anyText && (
                            <div className="space-y-1">
                              <div className="flex justify-between"><span className={cap}>Кегль</span><span className="text-[11px] text-zinc-400 font-mono">{cur.fz || 20}</span></div>
                              <input type="range" min="10" max="72" step="1" value={cur.fz || 20}
                                     onChange={(e) => patchShapes({ fz: Number(e.target.value) })}
                                     className="w-full accent-indigo-500 h-1.5 rounded-full appearance-none outline-none bg-white/10" />
                              <div className={row}>
                                {[['left', 'Слева'], ['center', 'Центр'], ['right', 'Справа']].map(([v, t]) => (
                                  <button key={v} onClick={() => patchShapes({ ta: v })} className={cell((cur.ta || 'left') === v)}>{t}</button>
                                ))}
                              </div>
                            </div>
                          )}

                          {!onlyText && <div className="space-y-1">
                            <span className={cap}>Толщина</span>
                            <div className={row}>
                              {[[1, 'Тонко'], [2, 'Средне'], [4, 'Жирно']].map(([v, t]) => (
                                <button key={v} onClick={() => patchShapes({ sw: v })} className={cell(cur.sw === v)}>{t}</button>
                              ))}
                            </div>
                          </div>}

                          {!onlyText && <div className="space-y-1">
                            <span className={cap}>Штрих</span>
                            <div className={row}>
                              {[['solid', 'Сплошь'], ['dashed', 'Пунктир'], ['dotted', 'Точки']].map(([v, t]) => (
                                <button key={v} onClick={() => patchShapes({ sd: v })} className={cell(cur.sd === v)}>{t}</button>
                              ))}
                            </div>
                          </div>}

                          {!onlyText && <div className="space-y-1">
                            <span className={cap}>Начертание</span>
                            <div className={row}>
                              {[[0, 'Ровно'], [1, 'От руки'], [2, 'Эскиз']].map(([v, t]) => (
                                <button key={v} onClick={() => patchShapes({ ro: v })} className={cell(cur.ro === v)}>{t}</button>
                              ))}
                            </div>
                          </div>}

                          {anyRect && (
                            <div className={row}>
                              {[[1, 'Скруглить'], [0, 'Острые углы']].map(([v, t]) => (
                                <button key={v} onClick={() => patchShapes({ rd: v })} className={cell(cur.rd === v)}>{t}</button>
                              ))}
                            </div>
                          )}

                          {anyLine && (
                            <div className="space-y-1">
                              <span className={cap}>Маршрут</span>
                              <div className={row}>
                                {[['straight', 'Прямо'], ['curved', 'Дугой'], ['ortho', 'Углом']].map(([v, t]) => (
                                  <button key={v} onClick={() => patchShapes({ rt: v })} className={cell((cur.rt || 'straight') === v)}>{t}</button>
                                ))}
                              </div>
                            </div>
                          )}

                          {anyArrow && anyLine && (
                            <div className="space-y-1">
                              <span className={cap}>Наконечники</span>
                              <div className={row}>
                                <button onClick={() => patchShapes({ a1: cur.a1 === 'arrow' ? 'none' : 'arrow' })} className={cell(cur.a1 === 'arrow')}>В начале</button>
                                <button onClick={() => patchShapes({ a2: cur.a2 === 'arrow' ? 'none' : 'arrow' })} className={cell(cur.a2 === 'arrow')}>В конце</button>
                              </div>
                            </div>
                          )}

                          <div className="space-y-1">
                            <div className="flex justify-between"><span className={cap}>Прозрачность</span><span className="text-[11px] text-zinc-400 font-mono">{Math.round((cur.op === undefined ? 1 : cur.op) * 100)}%</span></div>
                            <input type="range" min="10" max="100" step="5" value={Math.round((cur.op === undefined ? 1 : cur.op) * 100)}
                                   onChange={(e) => patchShapes({ op: Number(e.target.value) / 100 })}
                                   className="w-full accent-indigo-500 h-1.5 rounded-full appearance-none outline-none bg-white/10" />
                          </div>

                          {selNow.length > 1 && (
                            <div className={row}>
                              <button onClick={groupShapes} className={cell(false)}>Сгруппировать</button>
                              {selNow.some(s => s.g) && <button onClick={ungroupShapes} className={cell(false)}>Разбить</button>}
                            </div>
                          )}
                          {selNow.length === 1 && selNow[0].g && (
                            <div className={row}><button onClick={ungroupShapes} className={cell(false)}>Разбить группу</button></div>
                          )}

                          {selNow.length > 0 && (
                            <div className="space-y-1">
                              <span className={cap}>Порядок</span>
                              <div className={row}>
                                <button onClick={() => orderShapes(1)} className={cell(false)}>Вперёд</button>
                                <button onClick={() => orderShapes(-1)} className={cell(false)}>Назад</button>
                              </div>
                            </div>
                          )}
                          {wbMode === 'shape' && (
                            <p style={{ fontSize: 10.5, lineHeight: 1.4, color: 'var(--muted-2)' }}>
                              {shapeKind === 'text'
                                ? 'Щёлкните по доске — появится поле. Двойной клик по фигуре кладёт подпись внутрь неё.'
                                : 'Ведите по доске. Shift — ровный квадрат и угол кратно 15°, Ctrl — без притяжки.'}
                            </p>
                          )}
                        </div>
                        );
                      })()}

                      {/* У ластика своя панель. Раньше его размер был спрятан
                          в коде («кисть × 2,5»), увидеть и задать его было
                          нечем — человек стирал вслепую. */}
                      {wbMode === 'erase' && (
                        <div className="absolute top-16 md:top-6 left-2 md:left-24 glass-panel p-4 rounded-lg flex flex-col space-y-3 z-30 w-52 border-t border-white/10">
                          <div className="flex justify-between text-[11px] text-zinc-400 font-bold uppercase tracking-wider"><span>Ластик</span><span>{eraserSize}px</span></div>
                          <input type="range" min="8" max="200" step="4" value={eraserSize} onChange={(e) => changeEraser(Number(e.target.value))} className="w-full accent-indigo-500 h-1.5 rounded-full appearance-none outline-none bg-white/10" />
                          <p style={{ fontSize: 10.5, lineHeight: 1.4, color: 'var(--muted-2)' }}>
                            Круг показывает, что заденет. Линии режет, фигуры убирает целиком — стёртое вернёт Ctrl+Z.
                          </p>
                        </div>
                      )}

                      {wbMode === 'draw' && (
                        <div className="absolute top-16 md:top-6 left-2 md:left-24 glass-panel p-4 rounded-lg flex flex-col space-y-4 z-30 w-52 border-t border-white/10">
                          <div className="flex bg-black/50 p-1.5 rounded-lg border border-white/5">
                              <button onClick={() => setBrushType('pen')} className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition-all ${brushType === 'pen' ? 'bg-indigo-500 text-[#1a1918]' : 'text-zinc-500 hover:text-white'}`}>Перо</button>
                              <button onClick={() => setBrushType('soft')} className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition-all ${brushType === 'soft' ? 'bg-indigo-500 text-[#1a1918]' : 'text-zinc-500 hover:text-white'}`}>Мягкая</button>
                              <button onClick={() => setBrushType('marker')} className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition-all ${brushType === 'marker' ? 'bg-indigo-500 text-[#1a1918]' : 'text-zinc-500 hover:text-white'}`}>Маркер</button>
                          </div>
                          {/* Размер — точками, а не ползунком: каждая нарисована
                              своей толщиной, поэтому выбирают глазом, а не по
                              числу, и попадают пером с первого раза. */}
                          <div className="space-y-2">
                            <div className="flex justify-between text-[11px] text-zinc-400 font-bold uppercase tracking-wider"><span>Размер</span><span>{brushSize}px</span></div>
                            <div className="flex items-center justify-between gap-1">
                              {BRUSH_SIZES.map(sz => (
                                <button key={sz} onClick={() => setBrushSize(sz)} title={sz + " px"}
                                        className="flex items-center justify-center rounded-lg transition-colors"
                                        style={{ width: 30, height: 30, flexShrink: 0,
                                                 background: brushSize === sz ? "var(--accent)" : "transparent",
                                                 border: "1px solid " + (brushSize === sz ? "var(--accent)" : "var(--border)") }}>
                                  <span className="block rounded-full"
                                        style={{ width: Math.min(18, 3 + sz), height: Math.min(18, 3 + sz),
                                                 background: brushSize === sz ? "var(--bg)" : "var(--text-2)" }} />
                                </button>
                              ))}
                            </div>
                          </div>
                          <div className="space-y-2">
                            <span className="text-[11px] text-zinc-400 font-bold uppercase tracking-wider block">Цвет</span>
                            <div className="grid grid-cols-6 gap-2 items-center">
                              {['#d97757', '#fbbf24', '#fb7185', '#34d399', '#38bdf8', '#f4f4f5'].map(color => (<button key={color} onClick={() => setBrushColor(color)} style={{ backgroundColor: color }} className={`w-6 h-6 rounded-full border-2 ${brushColor === color ? 'border-white scale-110' : 'border-transparent hover:scale-110'} transition-transform`} />))}
                              <input type="color" value={brushColor} onChange={(e) => setBrushColor(e.target.value)} title="Свой цвет" className="wb-color-well w-6 h-6 rounded-full border-2 border-white/30 cursor-pointer bg-transparent" />
                            </div>
                          </div>
                        </div>
                      )}

                      {/* МИНИ-КАРТА — в свободном нижнем правом углу: слева
                          внизу масштаб, слева панель инструментов, сверху
                          справа действия с доской. Гостю по ссылке она нужна
                          не меньше, чем владельцу, поэтому `cf-edit-only`
                          на ней НЕТ: это чтение, а не правка. */}
                      <div className="cf-mini absolute z-30" style={{ right: 12, bottom: isPhone ? 62 : 12 }}>
                        {miniOpen ? (
                          <div className="rounded-lg overflow-hidden"
                               style={{ background: 'var(--card)', border: '1px solid var(--border)' }}>
                            <div className="flex items-center justify-between" style={{ padding: '2px 4px 2px 8px' }}>
                              <span className="cf-meta">карта доски</span>
                              <button onClick={() => setMiniOpen(false)} title="Свернуть карту"
                                      className="flex items-center justify-center"
                                      style={{ width: 22, height: 22, borderRadius: 6, color: 'var(--muted-2)', fontSize: 11 }}>✕</button>
                            </div>
                            {/* touchAction: none — иначе браузер на планшете
                                примет ведение по карте за прокрутку страницы. */}
                            <canvas ref={miniRef}
                                    style={{ width: isPhone ? 124 : MINI_W, height: isPhone ? 84 : MINI_H, display: 'block', cursor: 'pointer', touchAction: 'none' }}
                                    onPointerDown={(e) => { e.stopPropagation(); e.currentTarget.setPointerCapture(e.pointerId); miniDrag.current = true; miniGoto(e); }}
                                    onPointerMove={(e) => { if (miniDrag.current) { e.stopPropagation(); miniGoto(e); } }}
                                    onPointerUp={(e) => { e.stopPropagation(); miniDrag.current = false; commitView(); }}
                                    onPointerCancel={() => { miniDrag.current = false; commitView(); }} />
                          </div>
                        ) : (
                          <button onClick={() => setMiniOpen(true)} title="Карта доски — где что лежит"
                                  className="flex items-center justify-center transition-colors hover:bg-white/5"
                                  style={{ width: 40, height: 40, borderRadius: 10, background: 'var(--card)',
                                           border: '1px solid var(--border)', color: 'var(--muted)' }}>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14"/><path d="M15 6v14"/></svg>
                          </button>
                        )}
                      </div>

                      {/* Масштаб стоит ПРАВЕЕ панели инструментов (44 точки
                          плюс отступ): раньше он лежал ровно под ней и
                          закрывал нижние кнопки. */}
                      <div className="absolute z-30 flex items-center gap-2 rounded-lg p-1.5"
                           style={{ bottom: 12, left: 'calc(var(--tool-rail) + 20px)', background: 'var(--card)', border: '1px solid var(--border)' }}>
                        <button onClick={() => setZoom(prev => Math.max(0.3, prev - 0.1))} className="cf-tool" title="Мельче">−</button>
                        <span className="text-center" style={{ fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--muted)', width: 38 }}>{Math.round(zoom * 100)}%</span>
                        <button onClick={() => setZoom(prev => Math.min(2.0, prev + 0.1))} className="cf-tool" title="Крупнее">+</button>
                      </div>
                    </div>
                  </div>

                  {/* КПП — ОДИН документ, два вида.
                      Рядом жила вкладка «Документ» с теми же сценами, только
                      другим порядком: два экрана про одно и то же, и человек
                      каждый раз выбирал, в каком из них искать. Теперь это
                      два ВИДА одного КПП: «По сменам» — что снимаем в этот
                      день и чем, «Все сцены» — тот самый документ
                      с экспликацией, раскадровкой и текстом из сценария.
                      Прежний «Общий список» убран не потерей, а переносом:
                      номер и дата правятся прямо в строке смены — перенумеровать
                      смену подряд надо уметь, не заходя в каждую карточку.
                      Содержимое собирается ТОЛЬКО когда экран открыт: в виде
                      «Все сцены» лежат картинки всех кадров проекта, и держать
                      их в памяти круглосуточно незачем. */}
                  <div className={`h-full w-full overflow-y-auto ${currentView === 'table' ? 'block' : 'hidden'}`}>
                    <div className="p-4 md:p-8 max-w-7xl mx-auto space-y-6 pb-24">
