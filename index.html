    <script>
        // Service worker: кэширует оболочку приложения и библиотеки с CDN,
        // чтобы приложение открывалось без интернета. Данные офлайн
        // обеспечивает сам Firestore (enablePersistence ниже).
        if ('serviceWorker' in navigator) {
          // Как только новый service worker берёт управление, перезагружаем
          // страницу — иначе на телефоне (особенно у иконки с рабочего стола)
          // можно неделями сидеть на старой версии и не видеть правок.
          let cfReloading = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (cfReloading) return;
            cfReloading = true;
            window.location.reload();
          });
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').then(reg => {
              reg.update();
              // Проверяем обновление каждый раз, когда возвращаются во вкладку.
              document.addEventListener('visibilitychange', () => {
                if (!document.hidden) reg.update();
              });
            }).catch(err => {
              console.warn('Service worker не зарегистрирован:', err);
            });
          });
        }
    </script>

    <style>
        :root {
          /* поверхности: --canvas < --bg < --panel-3 < --panel-2 < --panel < изображения */
          --bg: #1a1918;
          --panel: #242322;       /* карточки, кнопки, выбранная строка, стикеры */
          --panel-2: #1e1d1c;     /* рельс, шапка, правые панели, чат */
          --panel-3: #1c1b1a;     /* боковые списки: сцены, теги, оглавление */
          --canvas: #14130f;      /* холст доски и превью схем света */

          --border: #363430;      /* границы панелей и кнопок */
          --border-soft: #2c2b28; /* разделители строк в списках */

          --text: #f0eee6;
          --text-2: #c9c5bb;      /* абзацы, описания */
          --muted: #a6a39a;       /* подписи, метки разделов */
          --muted-2: #6f6b63;     /* служебное, моно-метки */

          --accent: #d97757;
          --accent-hover: #e28a63;
          --accent-soft: rgba(217,119,87,.12);  /* фон своего сообщения в чате */
          --accent-line: rgba(217,119,87,.45);  /* рамка активного тега */

          --ink-yellow: #facc15;  /* приборы на схеме света, стикеры */
          --ink-blue: #60a5fa;

          --rail-w: 66px;
          --header-h: 42px;
          --panel-strip: 40px;
        }
        body {
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            touch-action: none;
            font-family: 'Archivo', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }
        ::selection { background: rgba(217,119,87,0.3); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #3d3a36; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .wb-color-well::-webkit-color-swatch-wrapper { padding: 0; }
        .wb-color-well::-webkit-color-swatch { border: none; border-radius: 9999px; }
        .wb-color-well::-moz-color-swatch { border: none; border-radius: 9999px; }
        @media (max-width: 767px) {
          .nav-scroll-hint { -webkit-mask-image: linear-gradient(to right, transparent 0, black 16px, black calc(100% - 24px), transparent 100%); mask-image: linear-gradient(to right, transparent 0, black 16px, black calc(100% - 24px), transparent 100%); }
        }
        .no-select { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }

        /* Кнопки, которые «появляются при наведении», на планшете НЕ появляются
           никогда: наведения мыши там не существует. То есть удалить кадр,
           выделить референс или положить его на доску пальцем было нельзя.
           Показываем их приглушённо — видно, но не кричит. */
        @media (hover: none) {
          .opacity-0.group-hover\:opacity-100 { opacity: .62 !important; }
        }
        h1, h2, h3 { font-family: 'Lora', Georgia, serif; letter-spacing: -0.01em; }
        .glass-panel {
            background: var(--panel);
            border: 1px solid var(--border);
        }
        .glass-input {
            background: var(--panel-2);
            border: 1px solid var(--border);
            color: var(--text);
        }
        .glass-input::placeholder { color: var(--muted-2); }
        .glass-input:focus, .glass-input:focus-within {
            border-color: var(--accent);
            outline: none;
        }
        .scene-drop-target { box-shadow: 0 0 0 2px var(--accent), 0 0 20px rgba(217,119,87,0.4); }

        /* ---------- утилиты редизайна ---------- */
        :focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }

        /* метка раздела над блоком */
        .cf-eyebrow { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

        /* служебная моно-подпись: слаглайн, дата, счётчики */
        .cf-meta { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: .04em; color: var(--muted-2); }

        /* Карточка галереи: браузер пропускает отрисовку того, что за
           экраном. При сотне референсов это главный рычаг для прокрутки.
           Где не поддерживается (старые Safari) — правило просто
           игнорируется, ничего не ломая. Высоту подсказываем заранее,
           иначе полоса прокрутки скачет. */
        .cf-ref-card { content-visibility: auto; contain-intrinsic-size: auto 300px; }
        /* чип параметра или тега */
        .cf-chip { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .04em; color: var(--muted); background: var(--panel); border: 1px solid var(--border); padding: 4px 7px; border-radius: 5px; }
        .cf-chip-accent { color: var(--accent); background: transparent; border-color: var(--accent-line); }

        /* строка списка: граница есть всегда, меняется только цвет — текст не сдвигается при выборе */
        .cf-row { border-left: 2px solid transparent; border-bottom: 1px solid var(--border-soft); cursor: pointer; }
        .cf-row-on { background: var(--panel); border-left-color: var(--accent); }

        /* свёрнутая боковая панель */
        .cf-strip { width: var(--panel-strip); background: var(--panel-3); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px 0; cursor: pointer; }
        .cf-strip span { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted-2); writing-mode: vertical-rl; }

        /* холст доски */
        /* точки намеренно еле заметны: сетка нужна как ориентир при
           перетаскивании, но не должна спорить с референсами на доске */
        .cf-canvas { background: var(--canvas); background-image: radial-gradient(rgba(240,238,230,.05) 1.2px, transparent 1.2px); background-size: 26px 26px; }

        /* Доска на движке Excalidraw. Пока рисуем, наши карточки не должны
           перехватывать касания — иначе до холста они просто не доходят.
           Правило жёсткое (!important и *), потому что у карточек внутри
           свои pointer-events:auto, и мягкой отменой их не выключить. */
        .cf-exc-draw #wb-container,
        .cf-exc-draw #wb-container * { pointer-events: none !important; }
        /* Панель инструментов Excalidraw в наших цветах */
        .excalidraw { --color-primary: #d97757; --color-primary-darker: #c65d3d; --color-primary-darkest: #a54a30; }

        /* Режим «только просмотр». Ничего не уходит в облако (см. syncDoc),
           а здесь дополнительно гасим саму возможность что-то печатать,
           чтобы человек не решил, будто его правки сохранятся. */
        body.cf-readonly input,
        body.cf-readonly textarea,
        body.cf-readonly select { pointer-events: none !important; user-select: none; }
        body.cf-readonly .cf-edit-only { display: none !important; }
        .cf-ro-badge { position: fixed; top: 8px; right: 8px; z-index: 300; font-size: 11px;
                       letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px;
                       border-radius: 999px; background: var(--panel); color: var(--muted);
                       border: 1px solid var(--border); pointer-events: none; }

        /* метка поверх превью кадра */
        .cf-overlay { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--text); background: rgba(26,25,24,.72); padding: 3px 6px; border-radius: 3px; }

        /* рельс навигации */
        .cf-rail { width: var(--rail-w); background: var(--panel-2); border-right: 1px solid var(--border); padding: 10px 0; }
        .cf-rail-item { width: 56px; padding: 8px 0 6px; gap: 5px; border-radius: 8px; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .cf-rail-item span { font-size: 9.5px; }
        .cf-rail-item:hover { color: var(--text-2); }
        .cf-rail-on { background: #2b2a28; color: var(--accent); }
        .cf-rail-on:hover { color: var(--accent); }
        #print-area { display: none; }
        @media print {
            body { background: white !important; color: black !important; overflow: auto; touch-action: auto; }
            body * { visibility: hidden; }
            #print-area { display: block !important; position: absolute; left: 0; top: 0; width: 100%; padding: 24px; background: white !important; color: black !important; }
            #print-area, #print-area * { visibility: visible !important; }
            #print-area img { max-width: 100%; }
            .print-scene { page-break-inside: avoid; border-bottom: 1px solid #ccc; padding: 12px 0; }
        }
    </style>
</head>

            const getPos = (e) => {
                const canvas = canvasRef.current; const rect = canvas.getBoundingClientRect();

                const ctx = canvasRef.current.getContext('2d'); ctx.beginPath();

            useEffect(() => {
                const onKey = (e) => {
                    // Пока набираем тег, стрелки должны двигать курсор в поле,
                    // а не листать кадры. Escape в поле — выход из поля;
                    // второй Escape закроет просмотр, как и раньше.
                    const t = e.target;
                    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) {
                        if (e.key === 'Escape') t.blur();
                        return;
                    }
                    if (e.key === 'Escape') { onClose(); return; }
                    if (e.key === 'ArrowLeft' && currentIndex > 0) setCurrentId(refs[currentIndex - 1].id);
                    if (e.key === 'ArrowRight' && currentIndex < refs.length - 1) setCurrentId(refs[currentIndex + 1].id);
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [currentIndex, refs, onClose]);

            if (!currentRef) return null;

            return (
                <div className="fixed inset-0 z-[350] bg-[#1a1918]/95 backdrop-blur-md flex flex-col justify-center items-center p-4">
                    <button onClick={onClose} className="absolute top-6 right-6 text-white bg-white/10 hover:bg-white/20 w-10 h-10 rounded-full flex items-center justify-center text-lg z-10 transition-colors border border-white/10">✕</button>
                    <div className="relative w-full h-full flex justify-center items-center max-w-[95vw] max-h-[95vh]">
                        {currentIndex > 0 && ( <button onClick={(e) => { e.stopPropagation(); setCurrentId(refs[currentIndex - 1].id); }} className="absolute left-2 md:left-8 p-4 bg-black/50 rounded-full text-white hover:bg-indigo-600 z-10 transition-colors"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m15 18-6-6 6-6"/></svg></button> )}
                        <img src={currentRef.url} className="max-w-full max-h-full object-contain rounded-lg" onClick={(e) => e.stopPropagation()} />
                        {currentIndex < refs.length - 1 && ( <button onClick={(e) => { e.stopPropagation(); setCurrentId(refs[currentIndex + 1].id); }} className="absolute right-2 md:right-8 p-4 bg-black/50 rounded-full text-white hover:bg-indigo-600 z-10 transition-colors"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m9 18 6-6-6-6"/></svg></button> )}
                    </div>
                    {/* Теги кадра — окошком в левом нижнем углу. Поднято над
                        нижней полосой со счётчиком, чтобы не налезать на неё. */}
                    {onAddTag && (tagsOpen ? (
                        <div className="cf-lb-tags absolute glass-panel rounded-lg z-20 border-t border-white/10"
                             style={{ left: 16, bottom: 76, padding: 8, width: 'max-content',
                                      minWidth: 150, maxWidth: 'min(320px, calc(100vw - 32px))' }}>
                            {/* Поле ввода СВЕРХУ, теги под ним. Окошко стоит внизу
                                экрана, поэтому список подсказок разворачивается
                                вверх — и, стой поле последним, он закрывал бы
                                собой сами теги. Заголовка нет намеренно: в
                                полноэкранном режиме место дороже подписи. */}
                            <button onClick={() => toggleTags(false)} title="Спрятать теги"
                                    className="absolute w-5 h-5 flex items-center justify-center rounded text-zinc-600 hover:text-white hover:bg-white/10"
                                    style={{ top: 4, right: 4, fontSize: 10 }}>✕</button>
                            <div className="cf-edit-only" style={{ paddingRight: 22 }}>
                                <TagInput key={currentRef.id} ref_={currentRef} hints={hints} onAdd={onAddTag} narrow />
                            </div>
                            <div className="flex flex-wrap gap-1 items-center mt-1.5">
                                {(currentRef.tags || []).length === 0 && (
                                    <span className="cf-meta">Без тегов</span>
                                )}
                                {(currentRef.tags || []).map(t => (
                                    <span key={t} className="bg-indigo-900/40 text-indigo-200 rounded flex items-center gap-0.5 whitespace-nowrap"
                                          style={{ fontSize: 10.5, padding: '1px 5px', lineHeight: 1.45 }}>
                                        {t}
                                        <button onClick={() => onRemoveTag(currentRef, t)} title="Убрать тег"
                                                className="cf-edit-only hover:text-white" style={{ fontSize: 9, opacity: .75 }}>✕</button>
                                    </span>
                                ))}
                            </div>
                        </div>
                    ) : (
                        <button onClick={() => toggleTags(true)} title="Показать теги кадра"
                                className="absolute glass-panel rounded-full px-3 py-1.5 z-20 flex items-center gap-1.5 text-zinc-400 hover:text-white transition-colors"
                                style={{ left: 16, bottom: 76 }}>
                            <Icons.Tag/>
                            <span style={{ fontSize: 11, fontWeight: 600 }}>
                                {(currentRef.tags || []).length || ''}
                            </span>
                        </button>
                    ))}

                    <div className="absolute bottom-6 flex items-center gap-2 max-w-[92vw]">
                        <span className="glass-panel rounded-full px-4 py-2 text-xs font-mono font-bold text-zinc-300 shrink-0">{currentIndex + 1} / {refs.length}</span>
                        {scopeLabel && <span className="glass-panel rounded-full px-4 py-2 text-xs font-semibold shrink-0 hidden sm:block" style={{ color: 'var(--accent)' }}>{scopeLabel}</span>}
                        {currentRef.label && <span className="px-5 py-2 glass-panel rounded-full text-sm font-medium text-white text-center truncate">{currentRef.label}</span>}
                    </div>
                </div>
            );
        };

        const LightSchemeEditor = ({ scheme, onSave, onClose }) => {
            const [elements, setElements] = useState(scheme?.elements || []);
            const [mode, setMode] = useState('select'); 
            const [selectedId, setSelectedId] = useState(null);
            const [drawData, setDrawData] = useState(scheme?.drawData || null);
            const canvasRef = useRef(null);
            const containerRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [brushColor, setBrushColor] = useState('#facc15');
            const [brushSize, setBrushSize] = useState(10);
            const lastPt = useRef({x:0, y:0});
            
            const [draggingEl, setDraggingEl] = useState(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if(canvas) {
                    canvas.width = 1600; canvas.height = 900;
                    const ctx = canvas.getContext('2d');
                    if (drawData) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0); img.src = drawData; }
                }
            }, []);

            const SHAPE_MODES = ['rect', 'circle', 'triangle', 'diamond', 'star', 'arrow', 'text'];
            const handlePointerDown = (e) => {
                if (mode === 'select' || SHAPE_MODES.includes(mode)) {
                    if (e.target.closest('.scheme-el')) return;
                    if (SHAPE_MODES.includes(mode)) {
                        const rect = containerRef.current.getBoundingClientRect();
                        const x = (e.clientX - rect.left) * (1600 / rect.width);
                        const y = (e.clientY - rect.top) * (900 / rect.height);
                        const newEl = { id: `el-${Date.now()}`, type: mode, x, y, w: 100, h: 100, color: brushColor, text: mode === 'text' ? 'Текст' : '', label: '' };
                        if(mode === 'text') { newEl.w = 200; newEl.h = 50; }
                        setElements([...elements, newEl]);
                        setMode('select'); setSelectedId(newEl.id);
                    } else { setSelectedId(null); }
                    return;
                }
                e.currentTarget.setPointerCapture(e.pointerId);
                setIsDrawing(true);
                const rect = canvasRef.current.getBoundingClientRect();
                lastPt.current = { x: (e.clientX - rect.left) * (1600 / rect.width), y: (e.clientY - rect.top) * (900 / rect.height) };
                const ctx = canvasRef.current.getContext('2d'); ctx.beginPath(); ctx.arc(lastPt.current.x, lastPt.current.y, brushSize/2, 0, Math.PI*2); ctx.fillStyle = mode==='erase' ? 'rgba(0,0,0,1)' : brushColor;
                if(mode==='erase') ctx.globalCompositeOperation = 'destination-out'; else { ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = 0.5; }
                ctx.fill(); ctx.globalAlpha = 1.0; ctx.globalCompositeOperation = 'source-over';
            };

            const handlePointerMove = (e) => {
                if (draggingEl) {
                    const rect = containerRef.current.getBoundingClientRect();
                    const nx = (e.clientX - rect.left) * (1600 / rect.width) - draggingEl.ox;
                    const ny = (e.clientY - rect.top) * (900 / rect.height) - draggingEl.oy;
                    setElements(elements.map(el => el.id === draggingEl.id ? {...el, x: nx, y: ny} : el));
                    return;
                }
                if (!isDrawing) return;
                const rect = canvasRef.current.getBoundingClientRect();
                const pos = { x: (e.clientX - rect.left) * (1600 / rect.width), y: (e.clientY - rect.top) * (900 / rect.height) };
                const ctx = canvasRef.current.getContext('2d');
                ctx.save();
                if (mode === 'erase') { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = brushSize*2; ctx.strokeStyle = 'rgba(0,0,0,1)'; }
                else { ctx.strokeStyle = brushColor; ctx.lineWidth = brushSize; ctx.globalAlpha = 0.5; ctx.globalCompositeOperation = 'screen'; }
                ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(lastPt.current.x, lastPt.current.y); ctx.lineTo(pos.x, pos.y); ctx.stroke(); ctx.restore();
                lastPt.current = pos;
            };

            const handlePointerUp = (e) => { 
                if (e.target.hasPointerCapture && e.target.hasPointerCapture(e.pointerId)) {
                    e.target.releasePointerCapture(e.pointerId);
                }
                setIsDrawing(false); setDraggingEl(null); 
            };

            const updateSelected = (updates) => { setElements(elements.map(el => el.id === selectedId ? {...el, ...updates} : el)); };

            return (
                <div className="fixed inset-0 z-[300] bg-[#1a1918]/95 backdrop-blur-xl flex flex-col">
                    <div className="flex flex-col lg:flex-row lg:justify-between lg:items-center gap-3 p-4 glass-panel border-b-0 shrink-0">
                        <div className="flex flex-wrap items-center gap-y-2 gap-x-4">
                            <span className="text-amber-400 font-bold text-sm flex items-center gap-2 shrink-0"><Icons.Lightbulb /> Интерактивная Схема Света</span>
                            <div className="flex flex-wrap gap-1 bg-black/50 p-1 rounded-lg">
                                <button onClick={() => setMode('select')} className={`px-2 py-1 text-xs rounded ${mode==='select'?'bg-indigo-500 text-[#1a1918]':'text-zinc-400'}`}><Icons.Pointer/></button>
                                <button onClick={() => setMode('draw')} className={`px-2 py-1 text-xs rounded ${mode==='draw'?'bg-indigo-500 text-[#1a1918]':'text-zinc-400'}`}><Icons.Pen/></button>
                                <button onClick={() => setMode('erase')} className={`px-2 py-1 text-xs rounded ${mode==='erase'?'bg-zinc-700 text-white':'text-zinc-400'}`}><Icons.Eraser/></button>
                                <div className="w-[1px] h-4 bg-white/20 my-auto mx-1"></div>
                                <button onClick={() => setMode('rect')} title="Прямоугольник" className={`px-2 py-1 text-xs rounded ${mode==='rect'?'bg-indigo-500 text-[#1a1918]':'text-zinc-400'}`}><Icons.Square/></button>
                                <button onClick={() => setMode('circle')} title="Круг" className={`px-2 py-1 text-xs rounded ${mode==='circle'?'bg-indigo-500 text-[#1a1918]':'text-zinc-400'}`}><Icons.Circle/></button>
                                <button onClick={() => setMode('triangle')} title="Треугольник" className={`px-2 py-1 text-xs rounded ${mode==='triangle'?'bg-indigo-500 text-[#1a1918]':'text-zinc-400'}`}><Icons.Triangle/></button>
                                <button onClick={() => setMode('diamond')} title="Ромб" className={`px-2 py-1 text-xs rounded ${mode==='diamond'?'bg-indigo-500 text-[#1a1918]':'text-zinc-400'}`}><Icons.Diamond/></button>
                                <button onClick={() => setMode('star')} title="Звезда" className={`px-2 py-1 text-xs rounded ${mode==='star'?'bg-indigo-500 text-[#1a1918]':'text-zinc-400'}`}><Icons.Star/></button>
                                <button onClick={() => setMode('arrow')} title="Стрелка (направление луча)" className={`px-2 py-1 text-xs rounded ${mode==='arrow'?'bg-indigo-500 text-[#1a1918]':'text-zinc-400'}`}><Icons.BeamArrow/></button>
                                <button onClick={() => setMode('text')} title="Текст" className={`px-2 py-1 text-xs rounded ${mode==='text'?'bg-indigo-500 text-[#1a1918]':'text-zinc-400'}`}><Icons.TextIcon/></button>
                            </div>
                            <div className="flex gap-1">
                                {['#facc15', '#60a5fa', '#f87171', '#34d399', '#ffffff'].map(c => (
                                    <button key={c} onClick={() => {setBrushColor(c); if(selectedId) updateSelected({color: c});}} style={{background: c}} className={`w-5 h-5 rounded-full border-2 ${brushColor === c ? 'border-white scale-110' : 'border-transparent hover:scale-110'} transition-transform`} />
                                ))}
                            </div>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => {
                                const pc = document.createElement('canvas'); pc.width = 1600; pc.height = 900;
                                const pctx = pc.getContext('2d');
                                pctx.fillStyle = '#262624'; pctx.fillRect(0, 0, 1600, 900);
                                pctx.globalAlpha = 0.85; pctx.drawImage(canvasRef.current, 0, 0); pctx.globalAlpha = 1;
                                elements.forEach(el => {
                                    pctx.fillStyle = el.color || '#facc15';
                                    if (el.type === 'rect') { pctx.fillRect(el.x, el.y, el.w, el.h); }
                                    else if (el.type === 'circle') { pctx.beginPath(); pctx.ellipse(el.x + el.w/2, el.y + el.h/2, el.w/2, el.h/2, 0, 0, Math.PI*2); pctx.fill(); }
                                    else if (el.type === 'triangle') { pctx.beginPath(); pctx.moveTo(el.x + el.w/2, el.y); pctx.lineTo(el.x, el.y + el.h); pctx.lineTo(el.x + el.w, el.y + el.h); pctx.closePath(); pctx.fill(); }
                                    else if (el.type === 'diamond') { pctx.beginPath(); pctx.moveTo(el.x + el.w/2, el.y); pctx.lineTo(el.x + el.w, el.y + el.h/2); pctx.lineTo(el.x + el.w/2, el.y + el.h); pctx.lineTo(el.x, el.y + el.h/2); pctx.closePath(); pctx.fill(); }
                                    else if (el.type === 'star') {
                                        const cx = el.x + el.w/2, cy = el.y + el.h/2, oR = Math.min(el.w, el.h)/2, iR = oR * 0.45;
                                        pctx.beginPath();
                                        for (let i = 0; i < 10; i++) { const r = i % 2 === 0 ? oR : iR; const ang = (Math.PI/5)*i - Math.PI/2; const px = cx + r*Math.cos(ang), py = cy + r*Math.sin(ang); if (i===0) pctx.moveTo(px,py); else pctx.lineTo(px,py); }
                                        pctx.closePath(); pctx.fill();
                                    }
                                    else if (el.type === 'arrow') {
                                        const x1 = el.x, y1 = el.y + el.h, x2 = el.x + el.w, y2 = el.y;
                                        pctx.strokeStyle = el.color || '#facc15'; pctx.lineWidth = Math.max(3, Math.min(el.w, el.h) * 0.06); pctx.lineCap = 'round';
                                        pctx.beginPath(); pctx.moveTo(x1, y1); pctx.lineTo(x2, y2); pctx.stroke();
                                        const ang = Math.atan2(y2-y1, x2-x1); const headLen = Math.min(el.w, el.h) * 0.25;
                                        pctx.beginPath(); pctx.moveTo(x2, y2);
                                        pctx.lineTo(x2 - headLen*Math.cos(ang - Math.PI/6), y2 - headLen*Math.sin(ang - Math.PI/6));
                                        pctx.lineTo(x2 - headLen*Math.cos(ang + Math.PI/6), y2 - headLen*Math.sin(ang + Math.PI/6));
                                        pctx.closePath(); pctx.fill();
                                    }
                                    else if (el.type === 'text') { pctx.font = 'bold 30px Archivo, sans-serif'; pctx.fillText(el.text || '', el.x + 8, el.y + 36); }
                                    if (el.label) { pctx.font = '22px Archivo, sans-serif'; pctx.fillStyle = '#f0eee6'; pctx.textAlign = 'center'; pctx.fillText(el.label, el.x + el.w/2, el.y + el.h + 30); pctx.textAlign = 'left'; }
                                });
                                onSave(scheme.id, elements, canvasRef.current.toDataURL('image/png'), pc.toDataURL('image/jpeg', 0.85));
                            }} className="px-4 py-2 bg-indigo-500 text-[#1a1918] text-xs rounded-lg hover:bg-indigo-400 font-bold">Сохранить схему</button>
                            <button onClick={onClose} className="px-4 py-2 bg-white/10 text-white text-xs rounded-lg hover:bg-white/20">Закрыть</button>
                        </div>
                    </div>

                    <div className="flex-1 flex overflow-hidden">
                        <div className="flex-1 relative p-4 flex justify-center items-center" onPointerMove={handlePointerMove} onPointerUp={handlePointerUp} onPointerCancel={handlePointerUp}>
                            <div ref={containerRef} onPointerDown={handlePointerDown} className="relative w-full max-w-5xl aspect-video bg-zinc-950 rounded-lg overflow-hidden border border-white/10 cursor-crosshair">
                                <canvas ref={canvasRef} className="absolute inset-0 w-full h-full pointer-events-none opacity-80" />
                                {elements.map(el => (
                                    <div key={el.id} className={`scheme-el absolute pointer-events-auto ${selectedId === el.id ? 'ring-2 ring-indigo-400' : ''}`} 
                                        style={{ left: `${(el.x/1600)*100}%`, top: `${(el.y/900)*100}%`, width: `${(el.w/1600)*100}%`, height: `${(el.h/900)*100}%` }}
                                        onPointerDown={(e) => { e.stopPropagation(); setSelectedId(el.id); setMode('select'); setDraggingEl({id: el.id, ox: (e.clientX - e.currentTarget.getBoundingClientRect().left)*(1600/containerRef.current.getBoundingClientRect().width), oy: (e.clientY - e.currentTarget.getBoundingClientRect().top)*(900/containerRef.current.getBoundingClientRect().height)}); }}>
                                        {el.type === 'rect' && <div className="w-full h-full rounded-md border-2 border-white/20" style={{backgroundColor: el.color}}/>}
                                        {el.type === 'circle' && <div className="w-full h-full rounded-full border-2 border-white/20" style={{backgroundColor: el.color}}/>}
                                        {el.type === 'triangle' && <div className="w-full h-full border-2 border-transparent" style={{backgroundColor: el.color, clipPath: 'polygon(50% 0%, 0% 100%, 100% 100%)'}}/>}
                                        {el.type === 'diamond' && <div className="w-full h-full border-2 border-transparent" style={{backgroundColor: el.color, clipPath: 'polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)'}}/>}
                                        {el.type === 'star' && <div className="w-full h-full border-2 border-transparent" style={{backgroundColor: el.color, clipPath: 'polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%)'}}/>}
                                        {el.type === 'arrow' && <svg className="w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="5" y1="95" x2="90" y2="10" stroke={el.color} strokeWidth="6" strokeLinecap="round"/><polygon points="90,10 72,18 82,28" fill={el.color}/></svg>}
                                        {el.type === 'text' && <textarea value={el.text} onChange={e => {setElements(elements.map(x=>x.id===el.id?{...x, text:e.target.value}:x))}} className="w-full h-full bg-black/60 border border-white/20 text-white font-bold p-1 resize-none focus:outline-none rounded-md text-xs" style={{color: el.color}} />}
                                        {el.label && (
                                            <div className="absolute top-full mt-2 left-1/2 -translate-x-1/2 bg-black/90 text-white font-medium text-[11px] px-2 py-1 rounded border border-white/20 whitespace-nowrap z-50 pointer-events-none">
                                                {el.label}
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>
                        {selectedId && elements.find(e=>e.id===selectedId) && (
                            <div className="w-64 glass-panel border-l border-white/10 p-4 space-y-4 shrink-0 flex flex-col">
                                <span className="text-xs font-bold text-zinc-400 uppercase">Свойства прибора / формы</span>
                                <div className="space-y-2">
                                    <label className="text-[11px] text-zinc-400">Маркировка (Модель/Прибор)</label>
                                    <input type="text" value={elements.find(e=>e.id===selectedId).label || ''} onChange={e=>updateSelected({label: e.target.value})} className="w-full glass-input rounded px-2 py-1.5 text-xs" placeholder="Напр: ARRI SkyPanel S60" />
                                </div>
                                <div className="space-y-2">
                                    <label className="text-[11px] text-zinc-400">Ширина</label>
                                    <input type="range" min="20" max="400" value={elements.find(e=>e.id===selectedId).w} onChange={e=>updateSelected({w: Number(e.target.value)})} className="w-full accent-indigo-500" />
                                </div>
                                <div className="space-y-2">
                                    <label className="text-[11px] text-zinc-400">Высота</label>
                                    <input type="range" min="20" max="400" value={elements.find(e=>e.id===selectedId).h} onChange={e=>updateSelected({h: Number(e.target.value)})} className="w-full accent-indigo-500" />
                                </div>
                                <button onClick={() => {setElements(elements.filter(e=>e.id!==selectedId)); setSelectedId(null);}} className="mt-auto bg-red-600/20 text-red-400 border border-red-500/30 py-2 rounded-lg text-xs font-bold hover:bg-red-600/40">Удалить объект</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- Доска на движке Excalidraw (пробный режим) ---
        // Берём версию 0.17.1: она единственная собрана так, что работает
        // простым <script> рядом с нашим React, без сборщика. Свежая 0.18
        // только модульная — её без сборки не подключить.
        // Грузим ПО ТРЕБОВАНИЮ: библиотека весит около 4 МБ, и платить за неё
        // должны только те доски, где её включили. Service worker подберёт
        // её в кэш сам, при первом же обращении, — офлайн заработает потом.
        const EXC_BASE = 'https://unpkg.com/@excalidraw/excalidraw@0.17.1/dist/';
        let excLoading = null;
        const loadExcalidraw = () => {
          if (window.ExcalidrawLib) return Promise.resolve(window.ExcalidrawLib);
          if (excLoading) return excLoading;
          excLoading = new Promise((resolve, reject) => {
            window.EXCALIDRAW_ASSET_PATH = EXC_BASE;
            const s = document.createElement('script');
            s.src = EXC_BASE + 'excalidraw.production.min.js';
            s.onload = () => window.ExcalidrawLib ? resolve(window.ExcalidrawLib) : reject(new Error('пустая библиотека'));
            s.onerror = () => { excLoading = null; reject(new Error('не удалось скачать')); };
            document.head.appendChild(s);
          });
          return excLoading;
        };

        // memo обязателен: без него любая перерисовка приложения — набранная
        // буква в карточке, пришедшее сообщение — заставляла Excalidraw
        // перерисоваться целиком. Все входящие свойства держим неизменными.
        // Поле тега с подсказками из УЖЕ ИСПОЛЬЗОВАННЫХ в проекте.
        // Отдельным компонентом намеренно: набранные буквы живут в его
        // собственном состоянии и не заставляют перерисовываться всю
        // галерею — при сотне референсов это заметно на планшете.
        const TagInput = ({ ref_, hints, onAdd, narrow }) => {
          const [typed, setTyped] = useState('');
          const [open, setOpen] = useState(false);
          const [at, setAt] = useState(null);
          const inputRef = useRef(null);
          const list = open ? hints(typed, ref_.tags) : [];

          // Список подсказок рисуем ОТДЕЛЬНЫМ слоем поверх страницы, а не
          // внутри карточки: у карточки обрезка по краю (overflow-hidden плюс
          // пропуск отрисовки за экраном), и список в ней просто не было
          // видно. Отсюда position: fixed и портал в body.
          const place = () => {
            const el = inputRef.current; if (!el) return;
            const r = el.getBoundingClientRect();
            const w = Math.min(240, window.innerWidth - 16);
            const left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8));
            // У нижнего края экрана разворачиваем список вверх, иначе он
            // уедет за пределы окна и снова окажется невидим.
            const вверх = r.bottom > window.innerHeight - 160;
            setAt({ left, width: w,
                    top: вверх ? null : Math.round(r.bottom + 4),
                    bottom: вверх ? Math.round(window.innerHeight - r.top + 4) : null });
          };
          useEffect(() => {
            if (!open) return;
            place();
            // Пока список открыт, страница может уехать под ним — держим его
            // у поля. scroll слушаем с перехватом: прокручивается не окно,
            // а внутренняя область галереи.
            const on = () => place();
            window.addEventListener('scroll', on, true);
            window.addEventListener('resize', on);
            return () => { window.removeEventListener('scroll', on, true); window.removeEventListener('resize', on); };
          }, [open, typed]);

          const put = (v) => { onAdd(ref_, v); setTyped(''); setOpen(false); };
          return (
            <span className="inline-block">
              <input ref={inputRef} type="text" placeholder="+ тег" value={typed}
                onChange={e => { setTyped(e.target.value); setOpen(true); }}
                onFocus={() => setOpen(true)}
                onKeyDown={e => {
                  if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); put(typed); }
                  if (e.key === 'Escape') setOpen(false);
                }}
                // Закрываем с задержкой: без неё палец не успевает нажать
                // подсказку — поле теряет фокус раньше, чем срабатывает выбор.
                onBlur={() => setTimeout(() => { setOpen(false); if (typed.trim()) put(typed); }, 180)}
                className={`bg-transparent text-[11px] text-zinc-400 border-b border-white/10 focus:border-indigo-500 focus:outline-none min-w-0 ${narrow ? 'w-14 focus:w-24 transition-all' : 'w-24'}`} />
              {list.length > 0 && at && ReactDOM.createPortal(
                <div className="flex flex-wrap gap-1 p-1.5 rounded-lg cf-tag-hints"
                     style={{ position: 'fixed', left: at.left, width: at.width,
                              top: at.top === null ? undefined : at.top,
                              bottom: at.bottom === null ? undefined : at.bottom,
                              zIndex: 500, background: 'var(--panel-2)',
                              border: '1px solid var(--border)', boxShadow: '0 8px 24px rgba(0,0,0,.45)' }}>
                  {list.map(t => (
                    <button key={t} type="button" onMouseDown={e => e.preventDefault()} onClick={() => put(t)}
                            className="cf-chip shrink-0" style={{ fontSize: 11 }}>{t}</button>
                  ))}
                </div>, document.body)}
            </span>
          );
        };

        const ExcalidrawBoard = React.memo(({ elements, files, onSave, onView, onTool, readOnly, apiRef, boardId }) => {
          const [lib, setLib] = useState(window.ExcalidrawLib || null);
          const [err, setErr] = useState('');
          const saveTimer = useRef(null);
          // Готовое к записи, но ещё не записанное. При уходе с доски это
          // НАДО дописать, а не выбросить: иначе последний штрих, сделанный
          // перед переключением, пропадал.
          const pending = useRef(null);
          const lastSent = useRef('');
          const elsRef = useRef(null);
          const lastTool = useRef('selection');
          const filesRef = useRef(null);
          const lastFiles = useRef('{}');

          useEffect(() => {
            let alive = true;
            loadExcalidraw().then(l => { if (alive) setLib(l); })
                            .catch(e => { if (alive) setErr(e.message); });
            // Отложенное сохранение ОБЯЗАНО умереть вместе с доской. Пока
            // этого не было, рисунок, уехавший в очередь на «Основной»,
            // догонял человека уже на другой доске и записывался в неё —
            // и выглядело это как «Excalidraw появился сразу везде».
            return () => {
              alive = false;
              clearTimeout(saveTimer.current);
              if (pending.current) pending.current();
            };
          }, []);

          if (err) return (
            <div className="absolute inset-0 flex items-center justify-center p-6 text-center">
              <div style={{ fontSize: 12.5, color: 'var(--muted)', maxWidth: 320, lineHeight: 1.6 }}>
                Не удалось загрузить Excalidraw ({err}).<br />Нужен интернет — при первом включении библиотека скачивается.
              </div>
            </div>
          );
          if (!lib) return (
            <div className="absolute inset-0 flex items-center justify-center">
              <span className="cf-meta">Загружаю Excalidraw… это примерно 4 МБ, только в первый раз</span>
            </div>
          );

          const Exc = lib.Excalidraw;
          return (
            <Exc
              excalidrawAPI={(api) => { if (apiRef) apiRef.current = api; }}
              initialData={{ elements: elements || [], files: files || {}, scrollToContent: false,
                             appState: { viewBackgroundColor: 'transparent' } }}
              theme="dark"
              langCode="ru-RU"
              viewModeEnabled={!!readOnly}
              UIOptions={{ canvasActions: { loadScene: false, changeViewBackgroundColor: false, toggleTheme: false } }}
              onChange={(els, st, sceneFiles) => {
                // Панораму и зум ведёт Excalidraw — наши карточки просто
                // повторяют за ним, иначе разъедутся два масштаба.
                if (onView) onView(st.scrollX, st.scrollY, st.zoom.value);
                // Взяли инструмент в панели Excalidraw — значит собираются
                // работать с холстом. Сообщаем наружу: иначе инструмент
                // загорается, а холст касаний не получает, и человек видит,
                // что «рука не работает».
                const tool = st.activeTool && st.activeTool.type;
                if (tool && tool !== lastTool.current) { lastTool.current = tool; if (onTool) onTool(tool); }
                if (readOnly) return;
                // onChange зовётся на КАЖДОЕ движение указателя. Раньше здесь
                // же собиралась JSON-строка всей сцены — то есть десятки раз
                // в секунду прогонялся весь рисунок. Теперь тут только
                // запоминание ссылки, а сборка строки уехала в отложенный вызов.
                elsRef.current = els;
                filesRef.current = sceneFiles;
                clearTimeout(saveTimer.current);
                const flush = () => {
                  pending.current = null;
                  const live = (elsRef.current || []).filter(e => !e.isDeleted);
                  const json = JSON.stringify(live);
                  // Картинки Excalidraw лежат ОТДЕЛЬНО от фигур. Без них
                  // вставленное изображение исчезало после перезагрузки:
                  // фигура-картинка сохранялась, а сам файл — нет.
                  // Кладём только те файлы, что реально используются, иначе
                  // удалённые картинки продолжали бы весить.
                  const used = {};
                  const all = filesRef.current || {};
                  live.forEach(e => { if (e.fileId && all[e.fileId]) used[e.fileId] = all[e.fileId]; });
                  const filesJson = JSON.stringify(used);
                  if (json === lastSent.current && filesJson === lastFiles.current) return;
                  lastSent.current = json; lastFiles.current = filesJson;
                  // Доску называем ЯВНО, а не берём «текущую» на момент
                  // записи: между рисованием и записью её могли переключить.
                  onSave(json, filesJson, boardId);
                };
                pending.current = flush;
                saveTimer.current = setTimeout(flush, 900);
              }}
            />
          );
        });

        function AppCore() {
          const [user, setUser] = useState(null);
          const [userName, setUserName] = useState('');
          const [userRole, setUserRole] = useState('');
          const [showWelcome, setShowWelcome] = useState(false);
          const clientId = useMemo(() => { let cid = localStorage.getItem('cf_client_id'); if (!cid) { cid = 'u-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); localStorage.setItem('cf_client_id', cid); } return cid; }, []);
          const [isOnline, setIsOnline] = useState(navigator.onLine);
          // Сколько правок ещё не подтверждено облаком. Офлайн запись в
          // Firestore не отклоняется, а ждёт связи — по этому счётчику видно,
          // всё ли уже уехало на сервер (можно ли закрывать ноутбук).
          const [pendingWrites, setPendingWrites] = useState(0);
          const trackWrite = (p) => {
            setPendingWrites(n => n + 1);
            p.finally(() => setPendingWrites(n => Math.max(0, n - 1)));
            return p;
          };
          
          const safeLoad = (key, fallback, isArray = true) => {
            // В файле-снимке данные лежат прямо внутри страницы, а не
            // в localStorage: снимок должен открываться на чужом устройстве.
            if (CF_SNAPSHOT && CF_SNAPSHOT.data && CF_SNAPSHOT.data[key] !== undefined) return CF_SNAPSHOT.data[key];
            try {
              const saved = localStorage.getItem(key); if (!saved) return fallback;
              const parsed = JSON.parse(saved); 
              if (isArray) return Array.isArray(parsed) ? parsed : fallback;
              return (parsed !== null && typeof parsed === 'object') ? parsed : fallback;
            } catch (e) { return fallback; }
          };

          const [scenes, setScenes] = useState(() => safeLoad('cf_scenes', initialScenes, true));
          const sortedScenes = useMemo(() => [...scenes].sort((a, b) => String(a.number).localeCompare(String(b.number), undefined, {numeric: true})), [scenes]);
          const [storyboard, setStoryboard] = useState(() => safeLoad('cf_storyboard', [], true));
          const [references, setReferences] = useState(() => safeLoad('cf_references', [], true));
          const [stickies, setStickies] = useState(() => safeLoad('cf_stickies', [], true));
          const [docs, setDocs] = useState(() => safeLoad('cf_docs', initialDocs, true));
          const [crew, setCrew] = useState(() => safeLoad('cf_crew', [], true));
          const [projectFiles, setProjectFiles] = useState(() => safeLoad('cf_files', [], true));
          
          const [gearTypes, setGearTypes] = useState(() => safeLoad('cf_geartypes', DEFAULT_GEAR, false));
          const [lightGearTypes, setLightGearTypes] = useState(() => safeLoad('cf_lightgeartypes', DEFAULT_LIGHT_GEAR, false));
          const [lightSchemes, setLightSchemes] = useState(() => safeLoad('cf_lightschemes', [], true));

          // --- ДОСКИ ---
          // Раньше доска была одна: все стикеры, референсы и один общий
          // рисунок. Теперь досок несколько — у каждой свои стикеры,
          // свои референсы и свой холст.
          const DEFAULT_BOARD = { id: 'board-main', title: 'Основная', order: 0 };
          const [boards, setBoards] = useState(() => safeLoad('cf_boards', [DEFAULT_BOARD], true));
          const [activeBoardId, setActiveBoardId] = useState(() => localStorage.getItem('cf_active_board') || DEFAULT_BOARD.id);
          const sortedBoards = useMemo(() => {
            const list = (boards && boards.length) ? [...boards] : [DEFAULT_BOARD];
            return list.sort((a, b) => (a.order || 0) - (b.order || 0));
          }, [boards]);
          // Если выбранной доски больше нет (удалили на другом устройстве) —
          // возвращаемся на первую, иначе доска покажется пустой без причины.
          useEffect(() => {
            if (!sortedBoards.some(b => b.id === activeBoardId) && sortedBoards.length) {
              setActiveBoardId(sortedBoards[0].id);
            }
          }, [sortedBoards, activeBoardId]);
          useEffect(() => { localStorage.setItem('cf_active_board', activeBoardId); }, [activeBoardId]);
          // Старые стикеры/референсы созданы без boardId — считаем их
          // принадлежащими первой доске, чтобы ничего не пропало.
          const belongsToBoard = (item, boardId) => (item.boardId || DEFAULT_BOARD.id) === boardId;

          // --- Сцены на доске ---
          // Доска — это текущая работа, поэтому карточку сцены с неё можно
          // снять, не трогая саму сцену. У сцены три состояния boardId:
          // поля нет вовсе — старая сцена, живёт на основной доске;
          // пустая строка — сняли руками, не показываем нигде;
          // id доски — лежит на ней. Пустую строку от отсутствия поля
          // отличаем намеренно: у стикеров (belongsToBoard) правило другое,
          // там пусто = основная доска, и смешивать их нельзя.
          const sceneOnBoard = (s, boardId) =>
            (s.boardId === undefined || s.boardId === null ? DEFAULT_BOARD.id : s.boardId) === boardId;
          const boardScenes = useMemo(() => sortedScenes.filter(s => sceneOnBoard(s, activeBoardId)), [sortedScenes, activeBoardId]);
          const offBoardScenes = useMemo(() => sortedScenes.filter(s => !sceneOnBoard(s, activeBoardId)), [sortedScenes, activeBoardId]);

          // Снять с доски. Связи с референсами (`sceneId` у референса) НЕ трогаем:
          // вернёте сцену на доску — пунктир нарисуется снова.
          const removeSceneFromBoard = (id) => {
            const up = scenes.map(s => s.id === id ? { ...s, boardId: '' } : s);
            setScenes(up);
            syncDoc('scenes', id, up.find(s => s.id === id));
            setSelectedWbItems(prev => prev.filter(x => x !== id));
            showToast('Убрано с доски · сцена осталась в проекте, вернуть — кнопкой «Сцена» слева');
          };

          // Положить на текущую доску, в видимую часть холста.
          const putSceneOnBoard = (id) => {
            const up = scenes.map(s => s.id === id ? { ...s, boardId: activeBoardId,
              x: (260 - canvasOffset.x) / zoom + Math.random() * 60,
              y: (240 - canvasOffset.y) / zoom + Math.random() * 60 } : s);
            setScenes(up);
            syncDoc('scenes', id, up.find(s => s.id === id));
            showToast('Сцена на доске');
          };

          const [messages, setMessages] = useState([]); 
          // Сколько раз облако присылало список сообщений (см. уведомления)
          const msgBatch = useRef(0);

          const [currentView, setCurrentView] = useState(
            CF_VIEW_SCOPE === 'gallery' ? 'gallery' : (CF_VIEW_SCOPE === 'board' ? 'whiteboard' : 'notion')
          ); 
          const [activeSceneId, setActiveSceneId] = useState('scene-1');
          const [activeDocId, setActiveDocId] = useState('doc-1');
          // Что открыто в карточке сцены: экспликация оператора или текст
          // сцены из сценария. Это разные тексты и живут в разных полях.
          const [sceneTab, setSceneTab] = useState('exp');
          const [showImages, setShowImages] = useState(true);
          const [showProjectModal, setShowProjectModal] = useState(false);
          const [showShareModal, setShowShareModal] = useState(false);
          const [showChat, setShowChat] = useState(false); 
          const [chatInput, setChatInput] = useState('');
          const [tableSubView, setTableSubView] = useState('grouped');
          const [toast, setToast] = useState(null);
          const [isAILoading, setIsAILoading] = useState(false);
          
          const [confirmAction, setConfirmAction] = useState(null); 
          const [drawingFrameId, setDrawingFrameId] = useState(null);
          const [lightboxData, setLightboxData] = useState(null);
          const [showAgentModal, setShowAgentModal] = useState(false);
          const [manualJsonInput, setManualJsonInput] = useState('');
          const [tagSearch, setTagSearch] = useState('');
          // Панель тегов в галерее: сворачивается в полоску 40px.
          const [galleryTagsOpen, setGalleryTagsOpen] = useState(true);
          // Папки референсов. Папка — просто поле folder у референса,
          // отдельной сущности нет: так ничего не рассинхронизируется,
          // и папка исчезает сама, когда из неё убрали последний файл.
          const [activeFolder, setActiveFolder] = useState('');
          // Мультивыбор в галерее. Объявлено здесь, до visibleRefs:
          // ниже по коду эти значения читаются прямо во время отрисовки.
          const [selectedRefIds, setSelectedRefIds] = useState([]);
          const [bulkTagInput, setBulkTagInput] = useState('');
          // Предупреждение о повторной загрузке картинок с теми же именами
          const [dupPrompt, setDupPrompt] = useState(null);
          const folderCounts = useMemo(() => {
            const m = {};
            references.forEach(r => { const f = (r.folder || '').trim(); if (f) m[f] = (m[f] || 0) + 1; });
            return Object.entries(m).sort((a, b) => a[0].localeCompare(b[0], 'ru'));
          }, [references]);
          const noFolderCount = useMemo(() => references.filter(r => !(r.folder || '').trim()).length, [references]);
          const moveToFolder = (ref, folder) => {
            const up = references.map(r => r.id === ref.id ? { ...r, folder } : r);
            setReferences(up);
            syncDoc('references', ref.id, up.find(r => r.id === ref.id));
          };

          // --- Массовые операции над выделенными референсами ---
          const toggleRefSelection = (id) => {
            setSelectedRefIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
          };
          const bulkPatchRefs = (patchFn, message) => {
            const up = references.map(r => selectedRefIds.includes(r.id) ? patchFn(r) : r);
            setReferences(up);
            selectedRefIds.forEach(id => { const f = up.find(r => r.id === id); if (f) syncDoc('references', id, f); });
            if (message) showToast(message);
          };
          const bulkAddTag = () => {
            const t = bulkTagInput.trim().toLowerCase(); if (!t) return;
            bulkPatchRefs(r => ({ ...r, tags: (r.tags || []).includes(t) ? r.tags : [...(r.tags || []), t] }),
                          `Тег «${t}» добавлен · ${selectedRefIds.length} шт.`);
            setBulkTagInput('');
          };
          const bulkMoveToFolder = (folder) => {
            bulkPatchRefs(r => ({ ...r, folder }), folder ? `Перемещено в «${folder}» · ${selectedRefIds.length} шт.` : `Убрано из папки · ${selectedRefIds.length} шт.`);
          };
          const bulkPutOnBoard = () => {
            let i = 0;
            bulkPatchRefs(r => ({ ...r, boardId: activeBoardId,
                                  x: (260 - canvasOffset.x) / zoom + (i % 5) * 210,
                                  y: (240 - canvasOffset.y) / zoom + Math.floor(i++ / 5) * 190 }),
                          `На доску добавлено ${selectedRefIds.length} шт.`);
          };
          // Удаление референсов — ТОЛЬКО через эту дверь: она же кладёт
          // удалённое в корзину, откуда его можно вернуть. Потерять чужую
          // подборку из-за одного промаха по крестику слишком дорого.
          const undoTimer = useRef(null);
          const [undoBin, setUndoBin] = useState(null);
          const deleteRefs = (list) => {
            const items = (list || []).filter(Boolean);
            if (!items.length) return;
            const ids = items.map(r => r.id);
            setReferences(references.filter(r => !ids.includes(r.id)));
            ids.forEach(id => deleteNetDoc('references', id));
            setSelectedRefIds(sel => sel.filter(id => !ids.includes(id)));
            setUndoBin({ items });
            clearTimeout(undoTimer.current);
            undoTimer.current = setTimeout(() => setUndoBin(null), 15000);
          };
          const restoreRefs = () => {
            if (!undoBin) return;
            const items = undoBin.items;
            setReferences(prev => {
              const есть = new Set(prev.map(r => r.id));
              return [...prev, ...items.filter(r => !есть.has(r.id))];
            });
            items.forEach(r => syncDoc('references', r.id, r));
            clearTimeout(undoTimer.current);
            setUndoBin(null);
            showToast(items.length === 1 ? 'Референс возвращён' : `Возвращено ${items.length} шт.`);
          };
          const bulkDeleteRefs = () => {
            const ids = [...selectedRefIds];
            setConfirmAction({
              title: `Удалить ${ids.length} изображений?`,
              message: 'Выделенные референсы удалятся из проекта. Сразу после удаления их можно будет вернуть кнопкой.',
              onConfirm: () => deleteRefs(references.filter(r => ids.includes(r.id)))
            });
          };
          // Список тегов с количеством референсов у каждого.
          const tagCounts = useMemo(() => {
            const m = {};
            references.forEach(r => (r.tags || []).forEach(t => { m[t] = (m[t] || 0) + 1; }));
            return Object.entries(m).sort((a, b) => a[0].localeCompare(b[0], 'ru'));
          }, [references]);
          // Теги по ЧАСТОТЕ — для подсказок нужен именно такой порядок:
          // сверху то, чем реально размечают проект.
          const popularTags = useMemo(
            () => [...tagCounts].sort((a, b) => b[1] - a[1]).map(t => t[0]), [tagCounts]);
          // Что подсказать под полем ввода тега: совпадения по началу слова
          // впереди, уже проставленные у этого референса — прочь.
          const tagHints = (typed, already) => {
            const q = String(typed || '').trim().toLowerCase();
            const have = new Set((already || []).map(t => String(t).toLowerCase()));
            const list = popularTags.filter(t => !have.has(t));
            if (!q) return list.slice(0, 8);
            const starts = list.filter(t => t.startsWith(q));
            const inside = list.filter(t => !t.startsWith(q) && t.includes(q));
            return [...starts, ...inside].slice(0, 8);
          };
          const visibleRefs = useMemo(() => references.filter(r => {
            const byTag = !tagSearch || (r.tags && r.tags.some(t => t.toLowerCase().includes(tagSearch.toLowerCase())));
            const f = (r.folder || '').trim();
            const byFolder = activeFolder === '' ? true : (activeFolder === '__none__' ? !f : f === activeFolder);
            return byTag && byFolder;
          }), [references, tagSearch, activeFolder]);
          const allVisibleSelected = visibleRefs.length > 0 && visibleRefs.every(r => selectedRefIds.includes(r.id));
          
          const [activeSchemeId, setActiveSchemeId] = useState(null);
          const [drawingSchemeId, setDrawingSchemeId] = useState(null);
          const [expandedLightSceneId, setExpandedLightSceneId] = useState(null);
          const [expandedGearSceneId, setExpandedGearSceneId] = useState(null);

          // --- Экспорт в PDF: что именно печатаем ---
          // 'full' — весь план, 'doc' — открытый гайд, 'scheme' — открытая
          // схема света, 'gear' — сводный список техники.
          const [printMode, setPrintMode] = useState('full');
          const [printRequested, setPrintRequested] = useState(false);
          // Приложение, установленное на домашний экран. Это НЕ мелочь для
          // печати: там window.print() не делает ВООБЩЕ ничего — печать живёт
          // в оболочке Safari, а оболочки в таком режиме нет. Кнопка нажимается,
          // и не происходит ничего, без единой ошибки.
          const isStandalone = () => {
            try {
              return window.navigator.standalone === true ||
                     (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
            } catch (e) { return false; }
          };
          // Окно под печать открываем ПРЯМО в обработчике нажатия и держим
          // здесь: всё, что открыто позже (после таймера), браузер считает
          // всплывающим окном и блокирует.
          const printWin = useRef(null);
          const PRINT_PAGE_CSS = `@page { margin: 14mm; }
            body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
                   color: #111; background: #fff; margin: 0; padding: 18px; }
            img { max-width: 100%; }
            .print-scene { page-break-inside: avoid; border-bottom: 1px solid #ccc; padding: 12px 0; }
            .cf-hint { background: #fff4e5; border: 1px solid #f0c992; color: #6b4a12;
                       border-radius: 8px; padding: 10px 12px; margin: 0 0 16px;
                       font-size: 13px; line-height: 1.5; }
            @media print { .cf-hint { display: none !important; } body { padding: 0; } }`;

          // Собрать из #print-area отдельную готовую страницу. Оттуда печать
          // работает где угодно: в Safari это «Поделиться» → «Напечатать»,
          // там же «Сохранить в Файлы» даёт PDF.
          const openPrintPage = () => {
            const area = document.getElementById('print-area');
            const body = area ? area.innerHTML : '';
            if (!body.trim()) { showToast('Нечего печатать'); return; }
            const html = '<!doctype html><html lang="ru"><head><meta charset="utf-8">'
              + '<meta name="viewport" content="width=device-width, initial-scale=1">'
              + '<title>CineFlow — план</title><style>' + PRINT_PAGE_CSS + '</style></head><body>'
              + '<div class="cf-hint">Готовая страница для печати. Кнопка «Поделиться» → «Напечатать»; '
              + 'чтобы получить PDF — «Поделиться» → «Сохранить в Файлы».</div>'
              + body + '</body></html>';
            const w = printWin.current;
            printWin.current = null;
            if (w && !w.closed) {
              try {
                w.document.open(); w.document.write(html); w.document.close();
                showToast('Открыл готовую страницу · «Поделиться» → «Напечатать»');
                return;
              } catch (e) { /* ниже сохраним файлом */ }
            }
            // Окно не дали открыть — отдаём файлом. Открывается из «Файлов»
            // и печатается оттуда же.
            try {
              const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
              const a = document.createElement('a');
              a.href = url; a.download = 'CineFlow-план.html';
              document.body.appendChild(a); a.click(); a.remove();
              setTimeout(() => URL.revokeObjectURL(url), 4000);
              showToast('Сохранил страницу файлом — откройте её и напечатайте');
            } catch (e) { showToast('Не удалось подготовить печать'); }
          };

          // Печать запускаем только после того, как React перерисует
          // #print-area под выбранный режим, иначе уйдёт старое содержимое.
          useEffect(() => {
            if (!printRequested) return;
            const t = setTimeout(() => {
              if (isStandalone()) openPrintPage(); else window.print();
              setPrintRequested(false);
            }, 120);
            return () => clearTimeout(t);
          }, [printRequested, printMode]);
          const requestPrint = (mode) => {
            if (isStandalone()) {
              try { printWin.current = window.open('', '_blank'); } catch (e) { printWin.current = null; }
            }
            setPrintMode(mode); setPrintRequested(true);
          };

          // Сводка техники по всему проекту. Считаем максимум за одну сцену:
          // именно столько нужно взять в аренду (сумма по сценам завысила бы
          // — один и тот же стедикам работает в разных сценах).
          const gearSummary = useMemo(() => {
            const build = (field, types) => {
              const acc = {};
              scenes.forEach(s => {
                Object.entries(s[field] || {}).forEach(([k, v]) => {
                  if (!v) return;
                  if (!acc[k]) acc[k] = { label: ((types || {})[k] || { label: k }).label, peak: 0, scenes: [] };
                  acc[k].peak = Math.max(acc[k].peak, v);
                  acc[k].scenes.push(s.number);
                });
              });
              return Object.values(acc).sort((a, b) => a.label.localeCompare(b.label, 'ru'));
            };
            return { camera: build('gear', gearTypes), light: build('lightGear', lightGearTypes) };
          }, [scenes, gearTypes, lightGearTypes]);

          // Добавление тега к референсу. Раньше срабатывало только по Enter:
          // напечатал тег, кликнул мимо — тег молча пропадал, и поэтому
          // казалось, что «теги не сохраняются и поиск не работает».
          // Теперь тег принимается и по Enter, и по запятой, и при уходе фокуса.
          const addTagTo = (ref, value) => {
            const raw = String(value || '').trim().toLowerCase().replace(/,+$/, '').trim();
            if (!raw) return;
            const current = ref.tags || [];
            if (current.includes(raw)) return;
            const up = references.map(r => r.id === ref.id ? { ...r, tags: [...current, raw] } : r);
            setReferences(up);
            syncDoc('references', ref.id, up.find(r => r.id === ref.id));
          };
          const removeTagFrom = (ref, tag) => {
            const up = references.map(r => r.id === ref.id
              ? { ...r, tags: (r.tags || []).filter(t => t !== tag) } : r);
            setReferences(up);
            syncDoc('references', ref.id, up.find(r => r.id === ref.id));
          };
          const commitTag = (ref, inputEl) => {
            const v = inputEl.value; inputEl.value = '';
            addTagTo(ref, v);
          };

          const [lastReadChat, setLastReadChat] = useState(() => Number(localStorage.getItem('cf_last_read')) || Date.now());
          const [newGearName, setNewGearName] = useState('');
          const [newLightGearName, setNewLightGearName] = useState('');

          const [wbMode, setWbMode] = useState('select'); 
          const [brushColor, setBrushColor] = useState('#d97757'); 
          const [brushType, setBrushType] = useState('pen'); 
          const [brushSize, setBrushSize] = useState(4); 
          const [canvasOffset, setCanvasOffset] = useState({ x: 0, y: 0 }); 
          const [zoom, setZoom] = useState(1.0);
          const [isPainting, setIsPainting] = useState(false);
          const [isPanning, setIsPanning] = useState(false);
          const [panStart, setPanStart] = useState({ x: 0, y: 0 });

          const lastPoint = useRef({ x: 0, y: 0, pressure: 0.5, time: 0 });
          // Идёт ли сейчас штрих обратным концом стилуса
          const penErase = useRef(false);
          // Стилус на планшете. Как только человек хоть раз коснулся доски
          // пером, палец перестаёт рисовать и начинает двигать доску —
          // так устроены все рисовалки на iPad, и так ладонь не оставляет
          // клякс. Пока пера не видели, ничего не меняется: палец рисует,
          // как рисовал, иначе на устройстве без стилуса рисовать стало бы
          // нечем. Замеченный стилус помним между запусками — на iPad
          // приложение выгружается из памяти постоянно.
          const [penSeen, setPenSeen] = useState(() => { try { return localStorage.getItem('cf_pen_seen') === '1'; } catch (e) { return false; } });
          const [fingerPans, setFingerPans] = useState(() => { try { return localStorage.getItem('cf_pen_pan') !== '0'; } catch (e) { return true; } });
          const notePen = (e) => {
            if (e.pointerType !== 'pen' || penSeen) return;
            setPenSeen(true);
            try { localStorage.setItem('cf_pen_seen', '1'); } catch (err) {}
          };
          const toggleFingerPans = () => setFingerPans(v => {
            const next = !v;
            try { localStorage.setItem('cf_pen_pan', next ? '1' : '0'); } catch (e) {}
            return next;
          });
          // Обратный конец стилуса: браузер сообщает о нём отдельной кнопкой
          // (button 5 при касании, бит 32 в buttons — в том числе на весу).
          const isPenEraser = (e) => e.pointerType === 'pen' && (e.button === 5 || (e.buttons & 32) === 32);

          // --- ДВИЖОК КИСТИ ---
          // stroke хранит состояние текущего штриха: предыдущая точка,
          // предыдущая середина отрезка и сглаженный нажим.
          const stroke = useRef({ prev: null, prevMid: null, press: 0.5 });
          // Последний сохранённый снимок холста. Он же — состояние «до»
          // для отмены, поэтому отмена не требует лишней перекодировки.
          const lastSaved = useRef(null);
          const undoStack = useRef([]);
          const [canUndo, setCanUndo] = useState(false);

          const brushAlpha = (type) => type === 'marker' ? 0.3 : (type === 'soft' ? 0.45 : 1.0);
          const brushWidthK = (type) => type === 'soft' ? 1.6 : 1;

          const applyBrush = (ctx, mode, type, color, width) => {
            if (mode === 'erase') {
              ctx.globalCompositeOperation = 'destination-out';
              ctx.strokeStyle = 'rgba(0,0,0,1)'; ctx.fillStyle = 'rgba(0,0,0,1)';
              ctx.lineWidth = width * 2.5;
            } else {
              ctx.globalCompositeOperation = type === 'marker' ? 'screen' : 'source-over';
              ctx.strokeStyle = color; ctx.fillStyle = color;
              ctx.globalAlpha = brushAlpha(type);
              ctx.lineWidth = width * brushWidthK(type);
            }
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
          };

          const pushUndo = () => {
            if (!lastSaved.current) return;
            undoStack.current.push(lastSaved.current);
            if (undoStack.current.length > 12) undoStack.current.shift();
            setCanUndo(true);
          };

          const restoreCanvas = (dataUrl) => {
            const c = paintCanvasRef.current; if (!c) return;
            const ctx = c.getContext('2d');
            ctx.clearRect(0, 0, c.width, c.height);
            if (!dataUrl) return;
            const img = new Image();
            img.onload = () => { ctx.clearRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0); };
            img.src = dataUrl;
          };

          // Единственная дверь для записи рисунка доски: локальная копия
          // плюс облако. Раньше три места писали в Firestore напрямую —
          // без проверки на режим просмотра и без обработки ошибки, поэтому
          // слишком тяжёлый холст (предел документа — 1 МБ) не сохранялся молча.
          const saveCanvas = (boardId, dataUrl) => {
            if (READ_ONLY) return;
            try {
              if (dataUrl) localStorage.setItem('cf_canvas_draw_' + boardId, dataUrl);
              else localStorage.removeItem('cf_canvas_draw_' + boardId);
            } catch (err) {}
            if (!db || !user) return;
            trackWrite(
              dataRef().collection('canvas').doc(canvasDocId(boardId))
                .set({ dataUrl, lastDrawBy: user.uid })
                .catch(err => {
                  console.warn('saveCanvas', err);
                  showToast('⚠️ Рисунок не сохранился в облако — возможно, он слишком тяжёлый');
                })
            );
          };

          const persistCanvas = () => {
            const c = paintCanvasRef.current; if (!c) return;
            const dU = c.toDataURL();
            lastSaved.current = dU;
            saveCanvas(activeBoardId, dU);
          };

          const undoStroke = () => {
            if (!undoStack.current.length) return;
            const prev = undoStack.current.pop();
            setCanUndo(undoStack.current.length > 0);
            restoreCanvas(prev);
            lastSaved.current = prev;
            saveCanvas(activeBoardId, prev);
          };

          // Ctrl+Z / Cmd+Z для отмены штриха на доске
          useEffect(() => {
            const onKey = (e) => {
              if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && currentView === 'whiteboard') {
                const t = e.target.tagName;
                if (t === 'INPUT' || t === 'TEXTAREA') return;
                e.preventDefault(); undoStroke();
              }
            };
            window.addEventListener('keydown', onKey);
            return () => window.removeEventListener('keydown', onKey);
          }, [currentView, activeBoardId, user]);

          // Кого сейчас тянем к сцене: {id, type: 'ref' | 'sticky'}.
          // К сценам цепляются и референсы, и заметки — механика одна.
          const [linkingFrom, setLinkingFrom] = useState(null);
          const [mousePos, setMousePos] = useState({ x: 0, y: 0 });
          const [hoveredSceneId, setHoveredSceneId] = useState(null);
          
          const [selectedWbItems, setSelectedWbItems] = useState([]);
          const [selectionBox, setSelectionBox] = useState(null);
          const [draggingWbItems, setDraggingWbItems] = useState(null);
          const [resizingRef, setResizingRef] = useState(null);
          const [resizingSticky, setResizingSticky] = useState(null);

          const [scenePickerOpen, setScenePickerOpen] = useState(false);

          // --- Пробный движок доски ---
          // У доски может стоять engine:'exc' — тогда вместо нашей кисти
          // работает Excalidraw, а карточки живут слоем поверх. Флаг лежит
          // у самой доски, чтобы у всей группы доска выглядела одинаково.
          const activeBoard = sortedBoards.find(b => b.id === activeBoardId) || DEFAULT_BOARD;
          const excOn = activeBoard.engine === 'exc';
          const excApi = useRef(null);
          const [excElements, setExcElements] = useState(null);
          const [excFiles, setExcFiles] = useState({});
          // Какой доске принадлежит загруженная сцена. Без этого при
          // переключении досок Excalidraw успевал смонтироваться со СТАРЫМИ
          // элементами (состояние приезжает на кадр позже смены доски),
          // считал их содержимым новой доски и записывал их поверх нужного —
          // рисунок соседней доски обнулялся.
          const [excBoardOf, setExcBoardOf] = useState(null);
          const excDocId = (boardId) => 'exc-' + boardId;

          // Обратный конец стилуса в режиме Excalidraw. У него смена
          // инструмента идёт через состояние React, то есть вступает в силу
          // на СЛЕДУЮЩЕМ событии — если ловить только момент касания, первый
          // штрих успел бы нарисовать. Поэтому ловим ещё и на весу: перо
          // сообщает о перевёрнутом конце, пока висит над экраном, и ластик
          // включается до касания. Инструмент возвращаем, когда перо
          // оторвали или повернули обратно.
          const excPrevTool = useRef(null);
          const excPenTool = (e) => {
            notePen(e);
            if (e.pointerType !== 'pen' || !excApi.current) return;
            if (!isPenEraser(e)) { excPenRestore(); return; }
            if (excPrevTool.current) return;
            const st = excApi.current.getAppState && excApi.current.getAppState();
            const cur = (st && st.activeTool && st.activeTool.type) || 'freedraw';
            if (cur === 'eraser') return;
            excPrevTool.current = cur;
            excApi.current.setActiveTool({ type: 'eraser' });
          };
          const excPenRestore = () => {
            if (!excPrevTool.current || !excApi.current) return;
            const back = excPrevTool.current;
            excPrevTool.current = null;
            excApi.current.setActiveTool({ type: back });
          };

          const toggleExcalidraw = () => {
            const next = excOn ? '' : 'exc';
            const up = boards.map(b => b.id === activeBoardId ? { ...b, engine: next } : b);
            setBoards(up);
            syncDoc('boards', activeBoardId, up.find(b => b.id === activeBoardId));
            setWbMode('select'); setSelectedWbItems([]);
            excViewRef.current = null;
            // Про сохранность говорим ОБА раза: выключение прячет рисунок
            // Excalidraw целиком, и без этих слов это читается как потеря.
            showToast(next
              ? 'Доска переведена на Excalidraw · рисунок кистью сохранён и виден снизу'
              : 'Вернул обычную кисть · рисунок Excalidraw сохранён, вернётся при включении');
          };

          const saveExcScene = (json, filesJson, ofBoard) => {
            if (READ_ONLY) return;
            // Пишем в ТУ доску, на которой рисовали, а не в открытую сейчас.
            const target = ofBoard || activeBoardId;
            try {
              localStorage.setItem('cf_exc_' + target, json);
              localStorage.setItem('cf_excf_' + target, filesJson || '{}');
            } catch (e) {}
            if (!db || !user) return;
            // Предел документа Firestore — 1 МБ, а картинки лежат в сцене
            // целиком. Предупреждаем ДО отказа, иначе человек узнает
            // о потере, только не найдя свою работу после перезагрузки.
            const weight = json.length + (filesJson || '').length;
            if (weight > 900 * 1024) {
              showToast('⚠️ Доска переполнена (' + Math.round(weight / 1024) + ' КБ из 1000). Уберите часть картинок, иначе перестанет сохраняться');
            }
            trackWrite(
              dataRef().collection('canvas').doc(excDocId(target))
                .set({ elements: json, files: filesJson || '{}', lastBy: clientId })
                .catch(err => { console.warn('saveExc', err); showToast('⚠️ Доска не сохранилась в облако — скорее всего, слишком тяжёлая из-за картинок'); })
            );
          };

          // Панораму и зум ведёт Excalidraw, наши карточки повторяют за ним.
          // Точка сцены (sx,sy) у него оказывается в (sx+scrollX)*zoom,
          // а у нас — offset + x*zoom. Отсюда offset = scroll * zoom.
          //
          // Трансформацию пишем ПРЯМО В УЗЕЛ, минуя состояние React: гонять её
          // через setState значило перерисовывать всё приложение на каждый
          // кадр панорамы — со всеми сценами, галереей и печатной версией.
          // Заодно уходит отставание карточек на кадр.
