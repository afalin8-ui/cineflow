                                setBoards([...boards, nb]); syncDoc('boards', nb.id, nb); setActiveBoardId(nb.id);
                              }}
                              title="Новая доска"
                              className="shrink-0 flex items-center justify-center transition-colors hover:bg-white/5"
                              style={{ width: 40, minHeight: 40, marginBottom: 2, borderRadius: 8, border: '1px solid var(--border)', color: 'var(--muted)', fontSize: 16 }}>+</button>
                    </div>

                    <div id="whiteboard-canvas" className="w-full flex-1 min-h-0 cf-canvas relative overflow-hidden"
                    onWheel={(e) => {
                        const rect = e.currentTarget.getBoundingClientRect();
                        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
                        const nz = Math.min(2.0, Math.max(0.3, zoom * (e.deltaY > 0 ? 0.9 : 1.1)));
                        const k = nz / zoom;
                        setCanvasOffset({ x: mx - (mx - canvasOffset.x) * k, y: my - (my - canvasOffset.y) * k });
                        setZoom(nz);
                    }}
                    onDragOver={(e) => e.preventDefault()}
                    onDrop={(e) => {
                        e.preventDefault();
                        // Кладём туда, куда бросили, и на открытую доску. Раньше
                        // картинка молча уезжала в галерею, а на доске ничего
                        // не появлялось — выглядело как «перетаскивание не работает».
                        const rect = canvasRef.current.getBoundingClientRect();
                        handleMultiFileUpload(e.dataTransfer.files, null, {
                            boardId: activeBoardId,
                            x: (e.clientX - rect.left) / zoom,
                            y: (e.clientY - rect.top) / zoom
                        });
                    }}
                    onDoubleClick={(e) => {
                        // Двойной клик по фигуре — подпись внутри неё, по
                        // пустому месту — новый текст. Это тот же жест, что
                        // и в Freeform, и им пользуются не глядя.
                        //
                        // Цель проверяем ТРЕМЯ вариантами, и это не перестраховка:
                        // первое нажатие захватывает указатель на области доски,
                        // и второй щелчок прилетает уже НЕ туда, куда попал
                        // первый. Достаточно, что это не карточка.
                        if (wbMode !== 'select' || READ_ONLY) return;
                        const tid = e.target.id;
                        if (tid !== 'wb-container' && tid !== 'whiteboard-canvas' && e.target.tagName !== 'CANVAS') return;
                        const rect = canvasRef.current.getBoundingClientRect();
                        const x = (e.clientX - rect.left) / zoom, y = (e.clientY - rect.top) / zoom;
                        const hit = shapeAt(x, y, true);
                        if (hit) { openText(hit); return; }
                        pushUndo(false);
                        const t = { ...makeShape('text', x, y - 12), w: 260, tx: '' };
                        t.h = measureText(t);
                        shapesRef.current = shapesRef.current.concat([t]);
                        scheduleInkSave('shapes');
                        setSelShapes([]);
                        setEditText({ id: t.id });
                        requestStatic();
                    }}
                    onPointerDown={(e) => {
                        if (wbMode === 'select' && e.target.id === 'wb-container') {
                            const rect = canvasRef.current.getBoundingClientRect();
                            const x = (e.clientX - rect.left) / zoom;
                            const y = (e.clientY - rect.top) / zoom;
                            noSnap.current = e.ctrlKey || e.metaKey;
                            // Фигуры живут на холсте, а не карточками в разметке,
                            // поэтому их попадание проверяем ЗДЕСЬ — там, куда
                            // событие доходит, миновав карточки. Порядок важен:
                            // сначала ручка, потом сама фигура, и только если
                            // не попали ни во что — рамка выделения.
                            const hh = handleAt(x, y);
                            if (hh) {
                                e.currentTarget.setPointerCapture(e.pointerId);
                                shapeStartAct('size', [hh.s.id], { x, y }, { h: hh.h, pointerId: e.pointerId });
                                return;
                            }
                            const hit = shapeAt(x, y);
                            if (hit) {
                                e.currentTarget.setPointerCapture(e.pointerId);
                                let sel = selShapes, cards = selectedWbItems;
                                if (!sel.includes(hit.id)) {
                                    sel = expandGroups(e.shiftKey ? sel.concat([hit.id]) : [hit.id]);
                                    setSelShapes(sel);
                                    if (!e.shiftKey) { cards = []; setSelectedWbItems([]); }
                                }
                                beginBoardDrag(e, cards, sel);
                                return;
                            }
                            setSelShapes([]);
                            setSelectionBox({ startX: x, startY: y, currentX: x, currentY: y, pointerId: e.pointerId });
                            e.currentTarget.setPointerCapture(e.pointerId);
                        }
                    }}
                    onPointerMove={(e) => {
                        if (shapeAct.current && shapeAct.current.pointerId === e.pointerId) {
                            const rect = canvasRef.current.getBoundingClientRect();
                            noSnap.current = e.ctrlKey || e.metaKey;
                            shapeMoveAct({ x: (e.clientX - rect.left) / zoom, y: (e.clientY - rect.top) / zoom }, e.shiftKey);
                            return;
                        }
                        if (selectionBox && selectionBox.pointerId === e.pointerId) {
                            const rect = canvasRef.current.getBoundingClientRect();
                            const x = (e.clientX - rect.left) / zoom;
                            const y = (e.clientY - rect.top) / zoom;
                            setSelectionBox({ ...selectionBox, currentX: x, currentY: y });
                        }
                        handleDragMove(e);
                        handleResizeMove(e);
                        handleStickyResizeMove(e);
                        handleDocResizeMove(e);
                    }}
                    onPointerUp={(e) => {
                        if (shapeAct.current && shapeAct.current.pointerId === e.pointerId) {
                            if (e.currentTarget.hasPointerCapture && e.currentTarget.hasPointerCapture(e.pointerId)) {
                                e.currentTarget.releasePointerCapture(e.pointerId);
                            }
                            shapeEndAct();
                            return;
                        }
                        if (selectionBox && selectionBox.pointerId === e.pointerId) {
                            if (e.currentTarget.hasPointerCapture && e.currentTarget.hasPointerCapture(e.pointerId)) {
                                e.currentTarget.releasePointerCapture(e.pointerId);
                            }
                            if (Math.abs(selectionBox.startX - selectionBox.currentX) < 5 && Math.abs(selectionBox.startY - selectionBox.currentY) < 5) {
                                setSelectedWbItems([]); setSelShapes([]);
                            } else {
                                const minX = Math.min(selectionBox.startX, selectionBox.currentX);
                                const maxX = Math.max(selectionBox.startX, selectionBox.currentX);
                                const minY = Math.min(selectionBox.startY, selectionBox.currentY);
                                const maxY = Math.max(selectionBox.startY, selectionBox.currentY);
                                
                                const newSelected = [];
                                const checkInt = (item, w, h) => {
                                    if (item.x < maxX && item.x + w > minX && item.y < maxY && item.y + h > minY) newSelected.push(item.id);
                                };
                                // Рамка берёт только то, что видно на этой доске:
                                // иначе в выделение попадали невидимые элементы соседних.
                                boardScenes.forEach(s => checkInt(s, 288, 150));
                                references.filter(r => r.boardId === activeBoardId).forEach(r => checkInt(r, refW(r), refH(r)));
                                stickies.filter(st => belongsToBoard(st, activeBoardId)).forEach(st => checkInt(st, stickyW(st), stickyH(st)));
                                boardDocs.forEach(d => checkInt(d, docCardW(d), docCardH(d)));
                                setSelectedWbItems(newSelected);
                                setSelShapes(expandGroups(shapesRef.current.filter(s => {
                                    if (s.ct) return false;
                                    const b = shapeBox(s);
                                    return b.x < maxX && b.x + b.w > minX && b.y < maxY && b.y + b.h > minY;
                                }).map(s => s.id)));
                            }
                            setSelectionBox(null);
                        }
                        // Нажали и отпустили, не сдвинув, по тексту УЖЕ выбранной
                        // карточки — это просьба писать, а не двигать. Проверка
                        // стоит здесь, а не в handleDragUp: тот выходит сразу,
                        // если состояние перетаскивания ещё не применилось,
                        // и на быстром касании правка не открывалась бы.
                        if (tapToEdit.current) {
                            const t = tapToEdit.current; tapToEdit.current = null;
                            if (!dragMoved.current) { setSelectedWbItems([t.id]); setEditCard({ id: t.id, key: t.key }); }
                        }
                        handleDragUp(e);
                        handleResizeUp(e);
                        handleStickyResizeUp(e);
                        handleDocResizeUp(e);
                        if (linkingFrom) {
                            if (hoveredSceneId) dropLink(linkingFrom, hoveredSceneId);
                            else if (bindCand.current) addConnector(linkingFrom.id, bindCand.current);
                            bindCand.current = null; requestLive();
                            setLinkingFrom(null); setHoveredSceneId(null);
                        }
                    }}>
                      {/* РИСУНОК КИСТЬЮ. Холста два, и оба размером с ОКНО,
                          а не с доску: на нижнем лежат готовые штрихи, на
                          верхнем — тот, что ведут прямо сейчас, и кольцо,
                          показывающее площадь кисти или ластика. Пока идёт
                          штрих, нижний слой не трогается вовсе — в этом вся
                          плавность. Оба лежат ВНЕ трансформации карточек и
                          применяют панораму с масштабом сами: только так
                          штрих пересчитывается под текущее увеличение и
                          остаётся резким. Слой всё так же ПОВЕРХ карточек —
                          по референсу нужно уметь чертить. */}
                      <React.Fragment>
                          <canvas ref={inkCanvasRef} className="absolute inset-0 w-full h-full pointer-events-none" style={{ zIndex: 26 }} />
                          <canvas ref={liveCanvasRef}
                            className={`absolute inset-0 w-full h-full ${wbMode === 'select' ? 'pointer-events-none' : 'pointer-events-auto'}`}
                            style={{ zIndex: 27, cursor: wbMode === 'pan' ? 'grab' : (wbMode === 'shape' || wbMode === 'link' ? 'crosshair' : (wbMode === 'select' ? 'default' : 'none')) }}
                            onPointerEnter={(e) => { hoverPt.current = inkPt(e.clientX, e.clientY); requestLive(); }}
                            onPointerLeave={() => { hoverPt.current = null; requestLive(); }}
                            onPointerDown={(e) => {
                              if (wbMode === 'select') return;
                              notePen(e);
                              const pt = inkPt(e.clientX, e.clientY);
                              hoverPt.current = pt;
                              // Есть стилус — палец двигает доску, а не рисует.
                              if (wbMode === 'pan' || (penSeen && fingerPans && e.pointerType === 'touch')) {
                                  e.currentTarget.setPointerCapture(e.pointerId);
                                  setIsPanning(true);
                                  setPanStart({ x: e.clientX - canvasOffset.x, y: e.clientY - canvasOffset.y });
                                  return;
                              }
                              // Связь в два нажатия. Тут нет ни точного ведения,
                              // ни маленьких ручек: ткнул в один объект, ткнул
                              // в другой. Цель ищется по ГЕОМЕТРИИ (bindAt),
                              // поэтому одинаково берутся и карточки, и фигуры,
                              // и надписи — кружок на карточке умеет только
                              // карточки, потому что ищет их в разметке.
                              if (wbMode === 'link') { const t = bindAt(pt.x, pt.y); pickLink(t ? t.id : null); return; }
                              if (wbMode === 'shape') {
                                e.currentTarget.setPointerCapture(e.pointerId);
                                noSnap.current = e.ctrlKey || e.metaKey;
                                buildSnapPool([]);
                                guides.current = [];
                                shapeDraft.current = makeShape(shapeKind,
                                  snapEdge(pt.x, true, pt.y, pt.y), snapEdge(pt.y, false, pt.x, pt.x));
                                // Начали вести от фигуры — стрелка цепляется
                                // за неё сразу, ещё до того как отпустили.
                                if (isLineKind(shapeKind)) {
                                  const from = bindAt(pt.x, pt.y);
                                  if (from) shapeDraft.current.b1 = from.id;
                                }
                                setIsPainting(true);
                                requestLive();
                                return;
                              }
                              e.currentTarget.setPointerCapture(e.pointerId);
                              // Обратный конец стилуса стирает — но только этим
                              // штрихом, выбранный инструмент не меняем.
                              penErase.current = isPenEraser(e);
                              const wipe = penErase.current || wbMode === 'erase';
                              legacyShot.current = false;
                              pushUndo(false);
                              setIsPainting(true);
                              if (wipe) {
                                erasePt.current = pt;
                                eraseSeg(pt.x, pt.y, pt.x, pt.y, eraserSize / 2);
                                requestLive();
                                return;
                              }
                              const press = (e.pointerType === 'pen' && e.pressure > 0) ? e.pressure : 0.5;
                              live.current = { pts: [[pt.x, pt.y, press]], press, t: brushType, c: brushColor, w: brushSize };
                              requestLive();
                            }}
                            onPointerMove={(e) => {
                              hoverPt.current = inkPt(e.clientX, e.clientY);
                              if (isPanning) { setCanvasOffset({ x: e.clientX - panStart.x, y: e.clientY - panStart.y }); return; }
                              if (wbMode === 'shape') {
                                const d = shapeDraft.current;
                                if (!d) { requestLive(); return; }
                                noSnap.current = e.ctrlKey || e.metaKey;
                                guides.current = [];
                                const pt2 = hoverPt.current;
                                let nx = snapEdge(pt2.x, true, d.y, d.y), ny = snapEdge(pt2.y, false, d.x, d.x);
                                if (e.shiftKey) {
                                  if (isLineKind(d.k)) { const r = lockAngle(d.x, d.y, nx, ny); nx = r.x; ny = r.y; }
                                  else {
                                    const q = Math.max(Math.abs(nx - d.x), Math.abs(ny - d.y));
                                    nx = d.x + (nx < d.x ? -q : q); ny = d.y + (ny < d.y ? -q : q);
                                  }
                                }
                                d.w = nx - d.x; d.h = ny - d.y;
                                if (isLineKind(d.k)) {
                                  const over = bindAt(pt2.x, pt2.y);
                                  const ok = over && over.id !== d.b1;
                                  bindCand.current = ok ? over.id : null;
                                  d.b2 = ok ? over.id : null;
                                }
                                shapeDirty(d);
                                requestLive();
                                return;
                              }
                              if (!isPainting) { requestLive(); return; }
                              // Браузер копит промежуточные точки между кадрами.
                              // Без getCoalescedEvents они теряются, и быстрый
                              // штрих выходит углами.
                              const ne = e.nativeEvent;
                              const raw = (ne.getCoalescedEvents && ne.getCoalescedEvents().length) ? ne.getCoalescedEvents() : [ne];
                              if (penErase.current || wbMode === 'erase') {
                                for (const p of raw) {
                                  const b = inkPt(p.clientX, p.clientY);
                                  const a = erasePt.current || b;
                                  eraseSeg(a.x, a.y, b.x, b.y, eraserSize / 2);
                                  erasePt.current = b;
                                }
                                requestLive();
                                return;
                              }
                              const L = live.current;
                              if (!L) { requestLive(); return; }
                              for (const p of raw) {
                                const b = inkPt(p.clientX, p.clientY);
                                const last = L.pts[L.pts.length - 1];
                                const d = Math.hypot(b.x - last[0], b.y - last[1]);
                                if (d < 0.7) continue;          // отбрасываем дрожание
                                // «Поводок»: точка идёт не прямо в указатель, а
                                // тянется за ним. Это гасит и дрожь руки, и
                                // ступеньки от редких событий — без него линия
                                // остаётся гранёной, сколько её потом ни сглаживай.
                                const nx = last[0] + (b.x - last[0]) * INK_LEAD;
                                const ny = last[1] + (b.y - last[1]) * INK_LEAD;
                                const dev = (e.pointerType === 'pen' && p.pressure > 0) ? p.pressure : null;
                                L.press = inkPress(L.press, d, L.w, dev);
                                L.pts.push([nx, ny, L.press]);
                                if (L.pts.length >= INK_MAX) {
                                  // Набрали предел — ЗАКРЫВАЕМ кусок и тут же
                                  // продолжаем новым от той же точки. Раньше
                                  // точки просто переставали добавляться, и
                                  // конец линии начинал ездить за пером:
                                  // выглядело так, будто линия кончилась и её
                                  // утаскивает. Стыки не сужаем, поэтому шва
                                  // не видно.
                                  const cut = packStroke(L.t, L.c, L.w, L.pts, (L.jn || 0) | 2);
                                  strokesRef.current = strokesRef.current.concat([cut]);
                                  paintOnStatic(cut);
                                  scheduleInkSave();
                                  L.pts = [L.pts[L.pts.length - 1]];
                                  L.jn = 1;
                                }
                              }
                              requestLive();
                            }}
                            onPointerUp={(e) => {
                              if (e.currentTarget.hasPointerCapture && e.currentTarget.hasPointerCapture(e.pointerId)) {
                                e.currentTarget.releasePointerCapture(e.pointerId);
                              }
                              if (wbMode === 'shape') {
                                const d = shapeDraft.current;
                                shapeDraft.current = null;
                                clearGuides();
                                // Случайный тычок фигурой не считаем: иначе на
                                // доске копились бы точки в один пиксель.
                                const b = d ? shapeBox(d) : null;
                                // Текст «нарисовать» нельзя — по нему просто
                                // щёлкают. Ведение задаёт ширину, короткий
                                // тычок берёт ширину по умолчанию.
                                if (d && isText(d)) {
                                  d.x = b.w >= 8 ? b.x : d.x;
                                  d.y = b.h >= 8 ? b.y : d.y;
                                  d.w = b.w >= 8 ? b.w : 260;
                                  d.h = measureText(d);
                                  pushUndo(false);
                                  shapesRef.current = shapesRef.current.concat([d]);
                                  scheduleInkSave('shapes');
                                  setIsPainting(false);
                                  setEditText({ id: d.id });
                                  requestStatic();
                                  return;
                                }
                                bindCand.current = null;
                                const drawn = isLineKind(d ? d.k : '') ? Math.hypot(d.w, d.h) >= 6 : (b && (b.w >= 3 || b.h >= 3));
                                if (d && drawn) {
                                  // Замкнутую нормализуем: габарит всегда
                                  // с положительными сторонами, и всё, что
                                  // считает рамку, может на это полагаться.
                                  if (!isLineKind(d.k)) { d.x = b.x; d.y = b.y; d.w = b.w; d.h = b.h; shapeDirty(d); }
                                  pushUndo(false);
                                  shapesRef.current = shapesRef.current.concat([d]);
                                  bumpInk();
                                  scheduleInkSave('shapes');
                                }
                                setIsPainting(false);
                                requestLive();
                                return;
                              }
                              const wipe = penErase.current || wbMode === 'erase';
                              const L = live.current;
                              if (isPainting && !wipe && L && L.pts.length) {
                                const s = packStroke(L.t, L.c, L.w, L.pts, L.jn);
                                strokesRef.current = strokesRef.current.concat([s]);
                                // Готовый штрих ДОПИСЫВАЕМ в нижний слой, а не
                                // перерисовываем доску целиком: обычный случай —
                                // «провёл линию», и платить за него полной
                                // перерисовкой незачем.
                                paintOnStatic(s);
                                scheduleInkSave();
                              }
                              if (isPainting && wipe) {
                                if (legacyDirty.current) saveLegacy();
                                scheduleInkSave();
                                scheduleInkSave('shapes');
                              }
                              live.current = null; erasePt.current = null; penErase.current = false;
                              setIsPainting(false); setIsPanning(false);
                              requestLive();
                            }}
                            onPointerCancel={() => {
                              live.current = null; erasePt.current = null; penErase.current = false;
                              shapeDraft.current = null; clearGuides();
                              setIsPainting(false); setIsPanning(false); requestLive();
                            }} />
                      </React.Fragment>

                      {/* Правка текста — настоящее поле ввода ПОВЕРХ холста,
                          подогнанное под то же место, шрифт и масштаб.
                          Рисовать курсор и выделение на канве значило бы
                          писать свой текстовый редактор; на планшете вдобавок
                          только настоящее поле поднимает клавиатуру. */}
                      {editText && (() => {
                        const s = shapesRef.current.find(q => q.id === editText.id);
                        if (!s) return null;
                        const host = s.ct ? shapesRef.current.find(q => q.id === s.ct) : null;
                        const b = host ? shapeBox(host) : shapeBox(s);
                        const z = zoom, pad = host ? 10 : 0;
                        const fz = Math.max(8, s.fz || 20) * z;
                        return (
                          <textarea
                            ref={editRef}
                            autoFocus
                            defaultValue={s.tx || ''}
                            onBlur={(e) => commitText(e.target.value)}
                            onKeyDown={(e) => {
                              e.stopPropagation();
                              if (e.key === 'Escape') { e.preventDefault(); commitText(e.currentTarget.value); }
                              // Enter переводит строку, закрывает Ctrl+Enter:
                              // подпись в блоке часто в две строки.
                              if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); commitText(e.currentTarget.value); }
                            }}
                            style={{
                              position: 'absolute', zIndex: 28,
                              left: (b.x * z + canvasOffset.x + pad * z) + 'px',
                              top: (b.y * z + canvasOffset.y + (host ? 8 * z : 0)) + 'px',
                              width: Math.max(40, (b.w - pad * 2) * z) + 'px',
                              height: Math.max(fz * 1.4, (host ? b.h - 16 * z : Math.max(s.h, 20) * z)) + 'px',
                              font: `${fz}px ${FONT_UI}`,
                              lineHeight: (textLH(s) * z) + 'px',
                              color: s.sc, caretColor: s.sc,
                              textAlign: s.ta || (host ? 'center' : 'left'),
                              background: 'rgba(26,25,24,.72)',
                              border: '1px solid var(--accent)', borderRadius: 6,
                              outline: 'none', resize: 'none', padding: 0, margin: 0,
                              overflow: 'hidden', whiteSpace: 'pre-wrap'
                            }} />
                        );
                      })()}

                      <div id="wb-container" ref={canvasRef} style={{ transform: `translate(${canvasOffset.x}px, ${canvasOffset.y}px) scale(${zoom})`, transformOrigin: '0 0', position: 'absolute', inset: 0, width: '4000px', height: '4000px', zIndex: 20 }}>
                        
                        {selectionBox && (
