                        </label>
                      </div>

                      <div className="bg-black/40 p-4 rounded-lg border border-white/10">
                        <h4 className="text-sm font-bold text-amber-300 mb-2">Сценарий (.txt / .fountain / .fdx)</h4>
                        <p className="text-xs text-zinc-400 mb-3 leading-relaxed">
                          Разбирается по заголовкам сцен — «СЦЕНА 5. ИНТ. КАБИНЕТ — ДЕНЬ» или «5. НАТ. ДВОР — ДЕНЬ».
                          Номер берётся из заголовка: если сцена с таким номером уже есть, текст ляжет в неё,
                          а не создаст вторую. Текст каждой сцены попадёт в её вкладку «Текст сцены».
                          Перед записью покажу, что нашлось.
                        </p>
                        <label className="w-full bg-amber-600/30 hover:bg-amber-600/50 text-amber-100 px-4 py-3 rounded-lg text-sm font-semibold transition-colors cursor-pointer flex items-center justify-center gap-2">

                          <input type="file" accept=".txt,.fountain,.fdx,.md,.csv,.xml" className="hidden" onChange={(e) => { handleScriptFile(e); setShowAgentModal(false); }} disabled={isAILoading} />
                        </label>
                      </div>

                      <div className="bg-black/40 p-4 rounded-lg border border-white/10">
                        <h4 className="text-sm font-bold text-emerald-400 mb-2">Ручной импорт JSON</h4>
                        <p className="text-xs text-zinc-400 mb-3">Скопируйте массив сцен и вставьте в поле ниже:</p>
                        <textarea value={manualJsonInput} onChange={(e) => setManualJsonInput(e.target.value)} placeholder='[{"number":"1","title":"ИНТ. ОФИС - ДЕНЬ","date":"2026-06-29","content":"Описание..."}]' className="w-full h-24 glass-input rounded-lg p-3 text-xs resize-none mb-3 font-mono text-zinc-300" />
                        <button 
                          onClick={() => {
                            try {
                              let text = manualJsonInput.trim(); if (!text) return;
                              const match = text.match(/\[[\s\S]*\]/); if (match) text = match[0];
                              const parsed = JSON.parse(text);
                              if (Array.isArray(parsed) && parsed.length > 0) {
                                const newScenes = parsed.map((ps, idx) => ({ id: `scene-${Date.now()}-${idx}`, number: ps.number || String(scenes.length + idx + 1), title: ps.title || 'Сцена', content: ps.content || '', boardId: '', x: (150 - canvasOffset.x) / zoom + (idx * 40), y: (150 - canvasOffset.y) / zoom + (idx * 40), date: ps.date || '', gear: {}, lightGear: {}, lightSchemeId: null }));
                                setScenes([...scenes, ...newScenes]); newScenes.forEach(ns => syncDoc('scenes', ns.id, ns)); showToast(`✅ Импортировано ${newScenes.length} сцен!`); setShowAgentModal(false); setManualJsonInput('');
                              } else { showToast("❌ Массив сцен пуст."); }
                            } catch (e) { showToast("❌ Ошибка формата JSON."); }
                          }}
                          className="w-full bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2.5 rounded-lg text-sm font-semibold transition-colors"
                        >Импортировать сцены</button>
                      </div>

                      {/* РАЗГОВОР С АГЕНТОМ — внизу этого же окна, а не на
                          главном экране: главный экран занят работой, а сюда
                          заходят именно за тем, чтобы дать задание словами.
                          Агент ОТВЕЧАЕТ и ПРЕДЛАГАЕТ правки, но не применяет
                          их сам: ошибку ИИ иначе увидели бы уже после того,
                          как она разошлась по всей группе через облако. */}
                      <div className="bg-black/40 p-4 rounded-lg border border-white/10">
                        <div className="flex items-center justify-between mb-2 gap-2">
                          <h4 className="text-sm font-bold text-white flex items-center gap-2"><Icons.Chat/> Задание словами</h4>
                          {agentChat.length > 0 && (
                            <button onClick={() => { setAgentChat([]); setAgentPlan(null); }}
                                    className="cf-chip shrink-0">Очистить</button>
                          )}
                        </div>
                        <p className="text-xs text-zinc-400 mb-3 leading-relaxed">
                          Агент видит ваши сцены — номера, названия, даты смен, объекты и технику.
                          Спросите «что снимаем 29-го» или дайте задание: «перенеси сцены 4–7 на 3 июля».
                          Правки он ПРЕДЛОЖИТ, а применять будете вы.
                        </p>

                        {agentChat.length > 0 && (
                          <div className="space-y-2 mb-3 overflow-y-auto" style={{ maxHeight: 260 }}>
                            {agentChat.map((m, i) => (
                              <div key={i} className={m.role === 'me' ? 'text-right' : ''}>
                                <span className="inline-block text-left rounded-lg px-3 py-2 text-xs leading-relaxed"
                                      style={{ whiteSpace: 'pre-wrap', maxWidth: '92%',
                                               background: m.role === 'me' ? 'var(--raised)' : 'rgba(217,119,87,.12)',
                                               color: m.role === 'me' ? 'var(--text-2)' : 'var(--text)',
                                               border: '1px solid ' + (m.role === 'me' ? 'var(--border)' : 'var(--accent-line)') }}>
                                  {m.text}
                                </span>
                              </div>
                            ))}
                            {agentBusy && <div className="cf-meta">агент думает…</div>}
                          </div>
                        )}

                        {/* Предпросмотр правок: человек обязан видеть, ЧТО
                            именно поменяется, до того как это случится. */}
                        {agentPlan && (
                          <div className="mb-3 rounded-lg p-3" style={{ background: 'var(--card)', border: '1px solid var(--accent-line)' }}>
                            <span className="cf-meta block mb-2">Агент предлагает изменить:</span>
                            <ul className="space-y-1 mb-3">
                              {agentPlan.map((c, i) => (
                                <li key={i} className="text-xs" style={{ color: 'var(--text-2)' }}>· {describeChange(c)}</li>
                              ))}
                            </ul>
                            <div className="flex gap-2">
                              <button onClick={applyAgentPlan}
                                      className="bg-indigo-500 hover:bg-indigo-400 text-[#1a1918] text-xs font-bold px-4 py-2 rounded-lg transition-colors">
                                Применить
                              </button>
                              <button onClick={() => setAgentPlan(null)} className="cf-chip">Не надо</button>
                            </div>
                          </div>
                        )}

                        <div className="flex gap-2">
                          {/* Enter отправляет, Shift+Enter — новая строка:
                              задание обычно в одну строку, и лишнее нажатие
                              по кнопке на планшете стоит дороже. */}
                          <textarea value={agentInput} onChange={(e) => setAgentInput(e.target.value)}
                                    onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); askAgent(agentInput); } }}
                                    placeholder="Что снимаем 29-го? · Перенеси сцены 4–7 на 3 июля"
                                    rows={2}
                                    className="flex-1 glass-input rounded-lg px-3 py-2 text-sm resize-none" />
                          <button onClick={() => askAgent(agentInput)} disabled={agentBusy || !agentInput.trim()}
                                  className={`shrink-0 px-4 rounded-lg text-sm font-bold transition-colors ${agentBusy || !agentInput.trim() ? 'bg-zinc-800 text-zinc-600' : 'bg-indigo-500 hover:bg-indigo-400 text-[#1a1918]'}`}
                                  style={{ minHeight: 44 }}>
                            {agentBusy ? '…' : 'Спросить'}
                          </button>
                        </div>
                        {!geminiKey.trim() && (
                          <p className="text-[11px] mt-2" style={{ color: 'var(--warn)' }}>
                            Нужен ключ Gemini — впишите его в «···» → «Проект».
                          </p>
                        )}
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {drawingFrameId && (
                  <DrawingModal onClose={() => setDrawingFrameId(null)} onSave={(dataUrl) => {
                        const up = storyboard.map(x=>x.id===drawingFrameId?{...x,image:dataUrl}:x); 
                        setStoryboard(up); syncDoc('storyboard', drawingFrameId, up.find(x=>x.id===drawingFrameId));
                        setDrawingFrameId(null);
                  }} />
              )}
              
              {/* Редактор схемы больше НЕ привязан к разделу «Экспликации».
                  Он и так открывается поверх всего экрана, а привязка
                  означала ровно одно: с «Досок» схему было не открыть. */}
              {drawingSchemeId && lightSchemes.find(s=>s.id === drawingSchemeId) && (
                  <LightSchemeEditor scheme={lightSchemes.find(s=>s.id === drawingSchemeId)} onClose={() => setDrawingSchemeId(null)} onSave={(id, els, draw, preview) => {
                      const up = lightSchemes.map(s=>s.id===id?{...s, elements: els, drawData: draw, preview: preview}:s);
                      setLightSchemes(up); syncDoc('lightSchemes', id, up.find(s=>s.id===id));
                      setDrawingSchemeId(null);
                  }} />
              )}

              {lightboxData && (() => {
                  // Листаем ровно тот набор, что открыт на экране (папка + тег),
                  // а не все референсы проекта.
                  const list = lightboxData.scope
                      ? lightboxData.scope.map(id => references.find(r => r.id === id)).filter(Boolean)
                      : references.filter(r => lightboxData.sceneId ? r.sceneId === lightboxData.sceneId : true);
                  return <Lightbox refs={list} scopeLabel={lightboxData.scopeLabel} initialId={lightboxData.currentId}
                                   onClose={() => setLightboxData(null)}
                                   hints={tagHints} onAddTag={addTagTo} onRemoveTag={removeTagFrom}
                                   onSetPano={setRefPano} />;
              })()}

                  экспорта (printMode): весь план / гайд / схема / техника. */}
              {/* Собирается ТОЛЬКО перед печатью. Раньше висела в разметке
                  всегда: все сцены, вся раскадровка с картинками — десятки
                  изображений в памяти круглосуточно ради кнопки, которую

              <div id="print-area">
              {printRequested && (<React.Fragment>
                {printMode === 'doc' && (() => {
                  const d = docs.find(x => x.id === activeDocId);
                  if (!d) return null;
                  return (
                    <div>
                      <h1 style={{fontSize: '22pt', fontWeight: 900, margin: '0 0 2pt'}}>{d.title || 'Гайд'}</h1>
                      <p style={{fontSize: '10pt', color: '#555', margin: '0 0 16pt'}}>Операторский гайд · CineFlow · {new Date().toLocaleDateString('ru-RU')}</p>
                      <p style={{fontSize: '12pt', lineHeight: 1.55, whiteSpace: 'pre-wrap', margin: 0}}>{d.content || 'Документ пуст.'}</p>
                    </div>
                  );
                })()}

                {printMode === 'scheme' && (() => {
                  const sch = lightSchemes.find(x => x.id === activeSchemeId);
                  if (!sch) return null;
                  const linked = scenes.filter(s => s.lightSchemeId === sch.id);
                  return (
                    <div>
                      <h1 style={{fontSize: '22pt', fontWeight: 900, margin: '0 0 2pt'}}>{sch.title || 'Схема света'}</h1>
                      <p style={{fontSize: '10pt', color: '#555', margin: '0 0 14pt'}}>Схема света · CineFlow · {new Date().toLocaleDateString('ru-RU')}</p>
                      {sch.preview
                        ? <img src={sch.preview} style={{width: '100%', border: '1px solid #ccc'}} />
                        : <p style={{fontSize: '11pt', color: '#777'}}>Схема ещё не сохранена в редакторе — нечего печатать.</p>}
                      {sch.elements && sch.elements.length > 0 && (
                        <div style={{marginTop: '14pt'}}>
                          <h2 style={{fontSize: '13pt', fontWeight: 800, margin: '0 0 6pt'}}>Приборы на схеме</h2>
                          <table style={{width: '100%', borderCollapse: 'collapse', fontSize: '10pt'}}>
                            <tbody>
                              {sch.elements.filter(el => el.label || el.text).map((el, i) => (
                                <tr key={el.id || i}>
                                  <td style={{border: '1px solid #ccc', padding: '4pt', width: '28pt', textAlign: 'center'}}>{i + 1}</td>
                                  <td style={{border: '1px solid #ccc', padding: '4pt'}}>{el.label || el.text}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      )}
                      {linked.length > 0 && (
                        <p style={{fontSize: '10pt', marginTop: '12pt'}}>
                          <b>Используется в сценах:</b> {linked.map(s => `#${s.number}`).join(', ')}
                        </p>
                      )}
                    </div>
                  );
                })()}

                {printMode === 'gear' && (
                  <div>
                    <h1 style={{fontSize: '22pt', fontWeight: 900, margin: '0 0 2pt'}}>Список техники</h1>
                    <p style={{fontSize: '10pt', color: '#555', margin: '0 0 6pt'}}>CineFlow · {new Date().toLocaleDateString('ru-RU')} · сцен в проекте: {scenes.length}</p>
                    <p style={{fontSize: '9pt', color: '#777', margin: '0 0 16pt'}}>
                      «Нужно» — максимум за одну сцену, то есть сколько единиц требуется одновременно.
                    </p>
                    {[{t: 'Камера и операторский грип', rows: gearSummary.camera}, {t: 'Осветительные приборы', rows: gearSummary.light}].map(block => (
                      <div key={block.t} style={{marginBottom: '16pt'}}>
                        <h2 style={{fontSize: '13pt', fontWeight: 800, margin: '0 0 6pt'}}>{block.t}</h2>
                        {block.rows.length === 0
                          ? <p style={{fontSize: '10pt', color: '#777', margin: 0}}>Ничего не отмечено.</p>
                          : (
                            <table style={{width: '100%', borderCollapse: 'collapse', fontSize: '10pt'}}>
                              <thead>
                                <tr>
                                  <th style={{border: '1px solid #ccc', padding: '4pt', textAlign: 'left'}}>Позиция</th>
                                  <th style={{border: '1px solid #ccc', padding: '4pt', width: '50pt', textAlign: 'center'}}>Нужно</th>
                                  <th style={{border: '1px solid #ccc', padding: '4pt', width: '60pt', textAlign: 'center'}}>Сцен</th>
                                  <th style={{border: '1px solid #ccc', padding: '4pt'}}>В каких сценах</th>
                                </tr>
                              </thead>
                              <tbody>
                                {block.rows.map(r => (
                                  <tr key={r.label}>
                                    <td style={{border: '1px solid #ccc', padding: '4pt'}}>{r.label}</td>
                                    <td style={{border: '1px solid #ccc', padding: '4pt', textAlign: 'center', fontWeight: 700}}>{r.peak}</td>
                                    <td style={{border: '1px solid #ccc', padding: '4pt', textAlign: 'center'}}>{r.scenes.length}</td>
                                    <td style={{border: '1px solid #ccc', padding: '4pt'}}>{r.scenes.map(n => `#${n}`).join(', ')}</td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          )}
                      </div>
                    ))}
                  </div>
                )}

                {/* Отчёт со скаутинга: то, что отправляют группе перед выездом.
                    Фотографии крупные — по ним и решают, годится ли объект. */}
                {printMode === 'locations' && (
                  <div>
                    <h1 style={{fontSize: '22pt', fontWeight: 900, margin: '0 0 2pt'}}>Объекты съёмки</h1>
                    <p style={{fontSize: '10pt', color: '#555', margin: '0 0 16pt'}}>
                      Отчёт со скаутинга · CineFlow · {new Date().toLocaleDateString('ru-RU')} · объектов: {sortedLocations.length}
                    </p>
                    {!sortedLocations.length && <p style={{fontSize: '11pt', color: '#777'}}>Объектов в проекте нет.</p>}
                    {sortedLocations.map(l => (
                      <React.Fragment key={l.id}>{locationPrintBlock(l, false)}</React.Fragment>
                    ))}
                  </div>
                )}

                {/* ОДИН ОБЪЕКТ В PDF — по «···» на его карточке. Раньше и
                    оттуда печатался отчёт по ВСЕМ объектам: чтобы отдать
                    локейшн-менеджеру один двор, приходилось выгружать весь
                    скаут. Та же мысль, что у «Экспорта сцены в PDF». */}
                {printMode === 'location' && (() => {
                  const l = locations.find(x => x.id === printLocation);
                  if (!l) return null;
                  const num = sortedLocations.findIndex(x => x.id === l.id) + 1;
                  return (
                    <div>
                      <h1 style={{fontSize: '22pt', fontWeight: 900, margin: '0 0 2pt'}}>{l.name || 'Без названия'}</h1>
                      <p style={{fontSize: '10pt', color: '#555', margin: '0 0 16pt'}}>
                        ОБ {String(num).padStart(2, '0')} · отчёт со скаутинга · CineFlow · {new Date().toLocaleDateString('ru-RU')}
                        {locationPhotos(l.id).length ? ` · фото: ${locationPhotos(l.id).length}` : ''}
                      </p>
                      {locationPrintBlock(l, true)}
                    </div>
                  );
                })()}

                {/* ОДНА СЦЕНА В PDF — по «···» на карточке сцены.
                    Раньше печатался только весь проект целиком: чтобы отдать
                    режиссёру одну сцену, приходилось печатать сто и выкидывать
                    девяносто девять. */}
                {printMode === 'scene' && (() => {
                  const s = scenes.find(x => x.id === printScene);
                  if (!s) return null;
                  const pFrames = storyboard.filter(f => f.sceneId === s.id);
                  const pRefs = references.filter(r => r.sceneId === s.id);
                  const pLocs = locations.filter(l => (l.sceneIds || []).includes(s.id));
                  return (
                    <div>
                      <h1 style={{fontSize: '20pt', fontWeight: 900, margin: '0 0 2pt'}}>Сцена #{s.number} — {s.title || 'Без названия'}</h1>
                      <p style={{fontSize: '10pt', color: '#555', margin: '0 0 10pt'}}>
                        Смена: {s.date ? formatDateDisplay(s.date) : 'не назначена'}
                        {pLocs.length ? ' · Объект: ' + pLocs.map(l => l.name).join(', ') : ''}
                      </p>
                      {s.content && <p style={{fontSize: '11pt', margin: '0 0 8pt', whiteSpace: 'pre-wrap'}}>{s.content}</p>}
                      {Object.keys(s.gear || {}).length > 0 && <p style={{fontSize: '10pt', margin: '0 0 4pt'}}><b>Техника:</b> {gearLine(s.gear, gearTypes)}</p>}
                      {Object.keys(s.lightGear || {}).length > 0 && <p style={{fontSize: '10pt', margin: '0 0 8pt'}}><b>Свет:</b> {gearLine(s.lightGear, lightGearTypes)}</p>}
                      {pFrames.length > 0 && (
                        <div style={{display: 'flex', flexWrap: 'wrap', gap: '8pt', margin: '0 0 10pt'}}>
                          {pFrames.map(f => (
                            <div key={f.id} style={{width: '30%', fontSize: '9pt'}}>
                              {f.image && <img src={f.image} style={{width: '100%', border: '1px solid #ccc'}} />}
                              <div><b>{f.frameNum}</b>{f.lens ? ' · ' + f.lens : ''} {f.description}</div>
                            </div>
                          ))}
                        </div>
                      )}
                      {pRefs.length > 0 && (
                        <div style={{display: 'flex', flexWrap: 'wrap', gap: '8pt'}}>
                          {pRefs.map(r => (
                            <div key={r.id} style={{width: '30%', fontSize: '9pt'}}>
                              <img src={r.url} style={{width: '100%', border: '1px solid #ccc'}} />
                              <div>{r.label}</div>
                            </div>
                          ))}
                        </div>
                      )}
                      {s.script && <p style={{fontSize: '10pt', whiteSpace: 'pre-wrap', marginTop: '10pt'}}>{s.script}</p>}
                    </div>
                  );
                })()}
                {printMode === 'full' && (<>
                <h1 style={{fontSize: '22pt', fontWeight: 900, margin: '0 0 2pt'}}>CineFlow — План подготовки к съёмкам</h1>
                <p style={{fontSize: '10pt', color: '#555', margin: '0 0 14pt'}}>Сформировано: {new Date().toLocaleDateString('ru-RU')} · Сцен: {scenes.length}</p>
                {[...scenes].sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999') || String(a.number).localeCompare(String(b.number), undefined, {numeric: true})).map(s => {
                  const pFrames = storyboard.filter(f => f.sceneId === s.id);
                  const pLocs = locations.filter(l => (l.sceneIds || []).includes(s.id));
                  return (
                    <div key={s.id} className="print-scene">
                      <h2 style={{fontSize: '14pt', fontWeight: 800, margin: '0 0 4pt'}}>Сцена #{s.number} — {s.title || 'Без названия'}</h2>
                      <p style={{fontSize: '10pt', color: '#555', margin: '0 0 6pt'}}>Смена: {s.date ? formatDateDisplay(s.date) : 'не назначена'}</p>
                      {pLocs.length > 0 && (
                        <p style={{fontSize: '10pt', margin: '0 0 6pt'}}>
                          <b>Объект:</b> {pLocs.map(l => l.name + (l.address ? ` (${l.address})` : '')).join('; ')}
                        </p>
                      )}
                      {s.content && <p style={{fontSize: '11pt', margin: '0 0 8pt', whiteSpace: 'pre-wrap'}}>{s.content}</p>}
                      {Object.keys(s.gear || {}).length > 0 && <p style={{fontSize: '10pt', margin: '0 0 4pt'}}><b>Техника:</b> {Object.entries(s.gear).map(([k, v]) => `${((gearTypes || {})[k] || {label: k}).label} × ${v}`).join(', ')}</p>}
                      {Object.keys(s.lightGear || {}).length > 0 && <p style={{fontSize: '10pt', margin: '0 0 8pt'}}><b>Свет:</b> {Object.entries(s.lightGear).map(([k, v]) => `${((lightGearTypes || {})[k] || {label: k}).label} × ${v}`).join(', ')}</p>}
                      {pFrames.length > 0 && (
                        <div style={{display: 'flex', flexWrap: 'wrap', gap: '8pt'}}>
                          {pFrames.map(f => (
                            <div key={f.id} style={{width: '30%', fontSize: '9pt'}}>
                              {f.image && <img src={f.image} style={{width: '100%', border: '1px solid #ccc'}} />}
                              <div><b>{f.frameNum}</b> {f.description}</div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })}
                {crew.length > 0 && (
                  <div style={{marginTop: '16pt'}}>
                    <h2 style={{fontSize: '14pt', fontWeight: 800}}>Съёмочная группа</h2>
                    <table style={{width: '100%', borderCollapse: 'collapse', fontSize: '10pt'}}>
                      <tbody>
                        {crew.map(c => (<tr key={c.id}><td style={{border: '1px solid #ccc', padding: '4pt'}}>{c.name}</td><td style={{border: '1px solid #ccc', padding: '4pt'}}>{c.role}</td><td style={{border: '1px solid #ccc', padding: '4pt'}}>{c.phone}</td></tr>))}
                      </tbody>
                    </table>
                  </div>
                )}
                </>)}
              </React.Fragment>)}
              </div>

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><AppCore /></ErrorBoundary>);
    </script>

    <script>
    /* ЗАПУСК ПРИЛОЖЕНИЯ.
       Код в файле написан на JSX, и его надо перевести в обычный JavaScript.
       Делает это Babel прямо в браузере — на том и держится правило «без
       сборщиков»: сборка живёт внутри страницы. Но перевод десяти тысяч
       строк занимает СЕКУНДЫ, и раньше он делался заново при КАЖДОМ
       открытии, вместе с загрузкой самого Babel на 2,4 МБ. Замер: на
       пустом проекте и на проекте с тремя сотнями фотографий время
       открытия одинаковое — значит, платим мы не за данные, а вот за это.
       Теперь готовый перевод кладётся в Cache Storage. Именно туда, а не
       в localStorage: у того свой предел около 5 МБ, и у большого проекта
       он и так переполнен. Ключ — длина и хэш исходника: правим
       приложение — ключ другой, и перевод делается заново сам.
       Babel грузится ТОЛЬКО когда переводить действительно надо. */
    (function () {
      var el = document.getElementById('cf-app');
      var src = el.textContent;
      var CACHE = 'cf-app-build';
      var h = 5381;
      for (var i = 0; i < src.length; i++) h = ((h * 33) ^ src.charCodeAt(i)) >>> 0;
      var key = '/cf-build/' + src.length + '-' + h.toString(36);
      var МЕТКА = '\n;window.__CF_APP_OK=1;';

      function run(code) {
        var s = document.createElement('script');
        s.textContent = code;
        document.body.appendChild(s);
      }
      function loadBabel() {
        return new Promise(function (res, rej) {
          if (window.Babel) return res();
          var s = document.createElement('script');
          s.src = 'https://unpkg.com/@babel/standalone/babel.min.js';
          s.onload = function () { res(); }; s.onerror = rej;
          document.head.appendChild(s);
        });
      }
      function compileAndRun() {
        return loadBabel().then(function () {
          // runtime classic ОБЯЗАТЕЛЕН: по умолчанию Babel собирает код
          // под модули и вставляет import из react/jsx-runtime, а у нас
          // React лежит глобально, обычным тегом, и модулей нет вовсе.
          // Без этого браузер отвечает «Cannot use import statement».
          var out = Babel.transform(src, {
            presets: [['react', { runtime: 'classic' }]], filename: 'app.jsx'
          }).code + МЕТКА;
          run(out);
          if (!window.caches) return;
          caches.open(CACHE).then(function (c) {
            // Старые сборки убираем: иначе кэш растёт с каждой правкой файла.
            c.keys().then(function (ks) {
              ks.forEach(function (k) { if (k.url.indexOf(key) === -1) c.delete(k); });
            });
            c.put(key, new Response(out, { headers: { 'Content-Type': 'text/javascript' } }));
          }).catch(function () {});
        });
      }
      function fail(e) {
        console.error('Не удалось собрать приложение', e);
        var r = document.getElementById('root');
        if (r) r.innerHTML = '<div style="padding:24px;font:15px/1.6 -apple-system,sans-serif;color:#f0eee6">' +
          'Не удалось запустить приложение. Проверьте интернет и обновите страницу.</div>';
      }
      var ПОВТОР = 'cf_build_retry';
      function былПовтор() { try { return sessionStorage.getItem(ПОВТОР) === '1'; } catch (e) { return false; } }
      function пометить(v) { try { v ? sessionStorage.setItem(ПОВТОР, '1') : sessionStorage.removeItem(ПОВТОР); } catch (e) {} }

      if (!window.caches) { compileAndRun().catch(fail); return; }
      caches.open(CACHE)
        .then(function (c) { return c.match(key); })
        .then(function (r) { return r ? r.text() : null; })
        .then(function (code) {
          if (!code) return compileAndRun();
          run(code);
          if (window.__CF_APP_OK) { пометить(false); return; }
          // Сохранённая сборка не запустилась. Доигрывать поверх наполовину
          // выполненного кода нельзя — стираем её и начинаем страницу заново.
          // Второй раз не перезагружаемся: если и свежая сборка падает,
          // дело не в кэше, и вечный круг перезагрузок хуже честного текста.
          if (былПовтор()) { пометить(false); fail(new Error('сборка не запускается')); return; }
          пометить(true);
          return caches.delete(CACHE).then(function () { location.reload(); });
        })
        .catch(function () { return compileAndRun().catch(fail); });
    })();
    </script>
</body>
</html>
