          const aiSplitScript = async (text, onProgress) => {
            const lines = String(text).replace(/\r\n?/g, '\n').split('\n');
            const parts = chunkByLines(lines, AI_SCRIPT_CHUNK).slice(0, AI_SCRIPT_MAX_PARTS);
            const norm = (s) => String(s).trim().replace(/\s+/g, ' ').toLowerCase();
            const heads = new Set();
            for (let i = 0; i < parts.length; i++) {
              if (onProgress) onProgress(i + 1, parts.length);
              const res = await callGeminiAI(
                'Ниже часть текста сценария. Выпиши ТОЛЬКО строки-заголовки сцен, каждую с новой строки, ДОСЛОВНО как в тексте. '
                + 'Ничего не добавляй, не нумеруй от себя, не пиши пояснений.\n\n' + parts[i].join('\n'), false);
              // Оборвалась связь или кончилась квота — не теряем то, что уже
              // нашли: разберём по найденному, а сколько прочли, скажем честно.
              if (res === null) return { scenes: [], done: i, total: parts.length, failed: true };
              String(res).split('\n').map(norm).filter(Boolean).forEach(h => heads.add(h));
            }
            const found = collectScenes(lines, (line) => {
              if (!heads.has(norm(line))) return null;
              return headFromLine(line);
            });
            return { scenes: found, done: parts.length, total: parts.length, failed: false };
          };

          const normNum = (v) => String(v || '').replace(/\s/g, '').toLowerCase();

          // Раскладываем разобранное по сценам: совпал номер — текст ложится
          // в существующую сцену, нет — заводим новую. Именно ради этого
          // из сценария и берутся номера.
          const applyScript = (parsed, source) => {
            const byNum = {};
            scenes.forEach(s => { const n = normNum(s.number); if (n) byNum[n] = s; });
            const matched = [], created = [];
            let willOverwrite = 0;
            parsed.forEach(p => {
              const hit = normNum(p.number) && byNum[normNum(p.number)];
              if (hit) { matched.push({ id: hit.id, p }); if ((hit.script || '').trim()) willOverwrite++; }
              else created.push(p);
            });
            setConfirmAction({
              title: 'Загрузить текст сценария?',
              message: `${source}\n\nНайдено сцен: ${parsed.length}\nЛягут в существующие по номеру: ${matched.length}`
                       + (willOverwrite ? ` (перезапишут текст у ${willOverwrite})` : '')
                       + `\nБудут созданы новые: ${created.length}`,
              onConfirm: () => {
                let up = scenes.map(s => {
                  const hit = matched.find(m => m.id === s.id);
                  return hit ? { ...s, script: hit.p.script, title: s.title || hit.p.title } : s;
                });
                matched.forEach(m => { const t = up.find(s => s.id === m.id); if (t) syncDoc('scenes', t.id, t); });
                // Свободный номер считаем на месте: nextSceneNumber смотрит
                // в состояние, и все новые сцены получили бы один и тот же.
                let maxNum = 0;
                const учесть = (v) => { const m = String(v || '').match(/\d+/); if (m && +m[0] > maxNum) maxNum = +m[0]; };
                up.forEach(s => учесть(s.number));
                // И те номера, что придут В ЭТОЙ ЖЕ партии: иначе сцена без
                // номера получала «1», хотя сцена №1 приезжала рядом с ней.
                created.forEach(p => учесть(p.number));
                const stamp = Date.now();
                const fresh = created.map((p, i) => ({
                  id: `sc-${stamp}-${i}`,
                  number: p.number || String(++maxNum),
                  title: p.title || 'Сцена', content: '', script: p.script,
                  // На доску не сыплем: доска — текущая работа, а сценарий
                  // может принести сотню сцен разом.
                  boardId: '',
                  x: (150 - canvasOffset.x) / zoom + (i % 6) * 40,
                  y: (150 - canvasOffset.y) / zoom + Math.floor(i / 6) * 40,
                  date: '', gear: {}, lightGear: {}, lightSchemeId: null
                }));
                up = [...up, ...fresh];
                setScenes(up);
                fresh.forEach(ns => syncDoc('scenes', ns.id, ns));
                setSceneTab('script');
                showToast(`Текст сценария загружен · сцен: ${parsed.length}`);
              }
            });
          };

          const handleScriptFile = async (e) => {
            const file = e.target.files[0]; if (!file) return;
            e.target.value = '';
            setIsAILoading(true);
            showToast('Читаю сценарий...');
            try {
              const text = decodeText(await file.arrayBuffer());
              let parsed = splitScript(text);
              let source = 'Разобрано по заголовкам сцен.';
              if (parsed.length < 2) {
                if (!geminiKey.trim()) {
                  setIsAILoading(false);
                  showToast('Не нашёл сцен. Нужны заголовки вида «СЦЕНА 5. ИНТ. КАБИНЕТ — ДЕНЬ», либо укажите ключ ИИ в меню «Проект»');
                  return;
                }
                showToast('Формат непривычный — зову ИИ...');
                const got = await aiSplitScript(text, (n, all) => {
                  if (all > 1) showToast(`Разбираю сценарий с ИИ · часть ${n} из ${all}`);
                });
                parsed = got.scenes;
                const знаков = text.length.toLocaleString('ru-RU');
                if (got.failed) {
                  setIsAILoading(false);
                  showToast(`ИИ ответил не до конца — разобрано ${got.done} из ${got.total} частей. Попробуйте ещё раз`);
                  return;
                }
                source = got.total > 1
                  ? `Разобрано с помощью ИИ целиком: ${знаков} знаков, ${got.total} частей.`
                  : `Разобрано с помощью ИИ: ${знаков} знаков.`;
              }
              setIsAILoading(false);
              if (!parsed.length) { showToast('Сцен в файле не нашлось'); return; }
              applyScript(parsed, source);
            } catch (err) {
              console.error(err);
              setIsAILoading(false);
              showToast('Не удалось прочитать файл сценария');
            }
          };

          const enhanceSceneWithAI = async (sceneId, currentContent, title, script) => {
            setIsAILoading(true); showToast("✨ ИИ расширяет экспликацию...");
            // Текст сцены, если он загружен, — лучший контекст для экспликации.
            const prompt = `Разверни и профессионально улучши операторское описание этой сцены. Название: ${title}. Исходный набросок: ${currentContent || 'Пусто'}`
              + ((script || '').trim() ? `\n\nТекст сцены из сценария (опирайся на него):\n${String(script).substring(0, 6000)}` : '');
            const aiText = await callGeminiAI(prompt, false);
            if (aiText) { updateScene(sceneId, 'content', aiText); showToast("✨ Экспликация обновлена!"); }
            setIsAILoading(false);
          };

          const seededRef = useRef({});
          useEffect(() => {
            if (!db || !user) return;
            const baseRef = db.collection('artifacts').doc(appId).collection('public').doc('data');
            // ОТВЕТ, В КОТОРОМ НИЧЕГО НЕ ИЗМЕНИЛОСЬ, — не событие.
            // Раньше на каждый ответ облака мы отдавали НОВЫЙ массив, даже
            // когда в нём лежало ровно то же самое. Дальше по цепочке это
            // значило: перерисовку всего приложения (а это и доска со всеми
            // карточками) и — через 700 мс — повторную упаковку всего
            // проекта с картинками в строку для местной копии, потому что
            // она сравнивает коллекции ПО ССЫЛКЕ на массив.
            // На хорошей связи такие ответы редки. На плохой библиотека
            // переподключается снова и снова, и каждое переподключение
            // приносит содержимое комнаты заново — вот отчего доска
            // «криво зумится и таскается» именно на плохом интернете,
            // а в онлайне всё ровно.
            // `docChanges()` — это и есть «что изменилось с прошлого раза»;
            // пусто и уже что-то приезжало — значит показывать нечего.
            const fresh = {};
            // ЗАСЕВАТЬ МОЖНО ТОЛЬКО ПЕРВЫЙ ОТВЕТ ОБЛАКА. Пустая коллекция
            // на первом ответе — это новая комната, её заполняем тем, что
            // лежит на устройстве. Пустая ПОТОМ — это удаление, которое
            // человек только что сделал руками.
            // Разницы не делали, и оттого не удалялась ПОСЛЕДНЯЯ запись:
            // стёр единственную схему света — облако прислало пустой список,
            // приложение сочло комнату новой и залило схему обратно из
            // памяти (`seed` замкнут на значение при подписке, зависимость
            // у эффекта одна — `user`). Со стороны это выглядит как
            // «удаление не работает»: окно подтвердили, схема мигнула
            // и вернулась. То же самое было с последней сценой, доской,
            // объектом, документом и референсом.
            const subList = (coll, setter, seed) => baseRef.collection(coll).onSnapshot(snap => {
              if (fresh[coll] && snap.docChanges().length === 0) return;
              const first = !fresh[coll];
              fresh[coll] = true;
              const list = []; snap.forEach(d => list.push(d.data()));
              if (snap.empty && first && !seededRef.current[coll]) {
                seededRef.current[coll] = true;
                if (seed && seed.length) { seed.forEach(item => syncDoc(coll, item.id, item)); return; }
              }
              setter(list);
            }, err => console.warn('sync ' + coll, err));
            const subMap = (coll, setter, seed) => baseRef.collection(coll).onSnapshot(snap => {
              if (fresh[coll] && snap.docChanges().length === 0) return;
              const first = !fresh[coll];
              fresh[coll] = true;
              const obj = {}; snap.forEach(d => { obj[d.id] = d.data(); });
              if (snap.empty && first && !seededRef.current[coll]) {
                seededRef.current[coll] = true;
                if (seed && Object.keys(seed).length) { Object.entries(seed).forEach(([k, v]) => syncDoc(coll, k, v)); return; }
              }
              // Пустой каталог после первого ответа — это тоже удаление:
              // раньше сюда не доходили, и последнюю позицию было не убрать.
              if (!first || Object.keys(obj).length) setter(obj);
            }, err => console.warn('sync ' + coll, err));
            const unsubs = [
              subList('scenes', setScenes, scenes),
              subList('storyboard', setStoryboard, storyboard),
              subList('references', setReferences, references),
              subList('stickies', setStickies, stickies),
              subList('docs', setDocs, docs),
              subList('crew', setCrew, crew),
              subList('locations', setLocations, locations),
              subList('projectFiles', setProjectFiles, projectFiles),
              subList('lightSchemes', setLightSchemes, lightSchemes),
              subMap('gearTypes', setGearTypes, gearTypes),
              subMap('lightGearTypes', setLightGearTypes, lightGearTypes),
              subList('boards', setBoards, [DEFAULT_BOARD]),
              // msgBatch считает ОТВЕТЫ облака: первый — это загрузка чата,
              // а не новые сообщения. Пустотой списка это мерить нельзя —
              // в новой комнате самое первое сообщение пришло бы молча.
              baseRef.collection('messages').onSnapshot(snap => {
                if (fresh.messages && snap.docChanges().length === 0) return;
                fresh.messages = true;
                const list = []; snap.forEach(d => list.push(d.data())); msgBatch.current++; setMessages(list.sort((a,b)=>a.timestamp-b.timestamp));
              }, err => console.warn('sync messages', err))
            ]; return () => unsubs.forEach(u => u());
          }, [user]);

          // Рисунок активной доски. Отдельная подписка: при переключении
          // доски нужно отцепиться от старого документа и подцепиться к
          // новому, иначе на новую доску прилетят чужие штрихи.
          const canvasDocId = (boardId) => boardId === DEFAULT_BOARD.id ? 'globalDraw' : `draw-${boardId}`;
          useEffect(() => {
            // История отмены своя у каждой доски — иначе Ctrl+Z вернул бы
            // на эту доску рисунок с соседней.
            undoStack.current = []; redoStack.current = [];
            setCanUndo(false); setCanRedo(false);
            strokesRef.current = [];
            shapesRef.current = []; setSelShapes([]);
            shapeDraft.current = null; shapeAct.current = null; clearGuides();
            legacyCv.current = null; legacyUrl.current = null; legacyDirty.current = false;
            // Сначала местная копия — она есть и без сети.
            // В файле-снимке рисунок лежит внутри страницы, а не в
            // localStorage: иначе на чужом устройстве поверх присланной доски
            // проступил бы СВОЙ рисунок с доски с тем же именем.
            let localLegacy = null, localInk = null, localFigs = null;
            if (CF_SNAPSHOT) {
              const d = CF_SNAPSHOT.data || {};
              localInk = d['cf_ink_' + activeBoardId] || null;
              localFigs = d['cf_shapes_' + activeBoardId] || null;
            } else {
              try {
                localLegacy = localStorage.getItem('cf_canvas_draw_' + activeBoardId);
                localInk = localStorage.getItem('cf_ink_' + activeBoardId);
                localFigs = localStorage.getItem('cf_shapes_' + activeBoardId);
              } catch (err) {}
            }
            if (localInk) { try { strokesRef.current = JSON.parse(localInk) || []; } catch (err) {} }
            if (localFigs) { try { shapesRef.current = JSON.parse(localFigs) || []; } catch (err) {} }
            loadLegacy(localLegacy);
            bumpInk();
            if (!db || !user) return () => flushInk();
            const col = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('canvas');
            // Два документа: старый растровый рисунок и векторные штрихи.
            const unRaster = col.doc(canvasDocId(activeBoardId)).onSnapshot(doc => {
              if (!doc.exists) return;
              if (doc.data().lastDrawBy === user.uid) return;
              loadLegacy(doc.data().dataUrl || null);
              bumpInk();
            }, err => console.warn('sync canvas', err));
            const unInk = col.doc(strokesDocId(activeBoardId)).onSnapshot(doc => {
              if (!doc.exists) return;
              if (doc.data().lastDrawBy === user.uid) return;
              try { strokesRef.current = JSON.parse(doc.data().strokes || '[]') || []; } catch (err) { strokesRef.current = []; }
              bumpInk();
            }, err => console.warn('sync ink', err));
            const unFig = col.doc(shapesDocId(activeBoardId)).onSnapshot(doc => {
              if (!doc.exists) return;
              if (doc.data().lastDrawBy === user.uid) return;
              try { shapesRef.current = JSON.parse(doc.data().shapes || '[]') || []; } catch (err) { shapesRef.current = []; }
              setSelShapes(sel => sel.filter(id => shapesRef.current.some(s => s.id === id)));
              bumpInk();
            }, err => console.warn('sync shapes', err));
            // Уходя с доски, дописываем отложенное: иначе последний штрих
            // уехал бы в облако уже под именем СЛЕДУЮЩЕЙ доски.
            return () => { unRaster(); unInk(); unFig(); flushInk(); };
          }, [user, activeBoardId]);

          // Перерисовка при панораме, зуме и смене размера окна. Штрихи
          // векторные, поэтому каждый раз они пересчитываются заново — этим
          // и держится резкость при любом увеличении.
          useEffect(() => {
            requestStatic();
            const onResize = () => requestStatic();
            window.addEventListener('resize', onResize);
            return () => window.removeEventListener('resize', onResize);
            // Список штрихов и фигур в зависимостях НЕ нужен: тот, кто их
            // менял, сам зовёт requestStatic (или дописывает штрих в слой
            // без полной перерисовки). Свяжешь с состоянием — и каждая
            // проведённая линия будет перерисовывать всю доску заново.
          }, [canvasOffset, zoom, currentView]);

          // Выделение и смена инструмента живут в состоянии React, а рисует
          // их верхний слой — значит, его надо трогать руками.
          useEffect(() => { requestLive(); }, [selShapes, wbMode, shapeKind]);


          // Автосохранение в localStorage — всегда (локальная копия на случай сбоя облака).
          // Кроме режима просмотра: иначе открытый снимок затрёт на чужом
          // устройстве его собственный проект.
          // Раньше это делалось СРАЗУ и ЦЕЛИКОМ: на каждую набранную букву
          // весь проект — вместе с картинками референсов и раскадровки —
          // заново упаковывался в строку и писался на диск. На проекте
          // в 3 МБ это давало 9 кадров в секунду при обычной печати.
          // Теперь, во-первых, с задержкой (пока печатают — не пишем),
          // во-вторых, только то, что реально изменилось: ссылка на массив
          // у нетронутых коллекций та же, сравнение по ней и отсекает.
          const savedSnap = useRef({});
          const storageWarned = useRef(false);   // о переполнении говорим один раз за сеанс
          // Коллекции, которые в этот сеанс уже не влезли целиком. Повторять
          // попытку на каждую правку нельзя: у большого проекта одна только
          // упаковка в строку — это десятки мегабайт, и телефон честно
          // «задумывается» на каждую набранную букву. Один отказ за сеанс,
          // дальше сразу кладём урезанное. Перезагрузка пробует заново.
          const lightOnly = useRef({});
          const flushLocal = useRef(() => {});
          useEffect(() => {
            if (READ_ONLY) return;
            const doSave = () => {
              // Картинки лежат в base64 прямо внутри записей, и на большом
              // проекте местная копия перестаёт помещаться в localStorage.
              // Раньше тогда не сохранялось НИЧЕГО: вместе с картинками
              // терялись подписи, теги, папки и расстановка — то, что
              // руками не восстановишь. Теперь при переполнении кладём
              // то же самое БЕЗ тяжёлых полей: фотографии есть и в облаке,
              // и в кэше Firestore, а разметка больше нигде.
              const HEAVY = { cf_references: ['url', 'panoUrl'], cf_storyboard: ['image'], cf_files: ['data'] };
              const lighten = (v, fields) => Array.isArray(v)
                ? v.map(o => { const c = { ...o }; fields.forEach(f => { if (c[f]) c[f] = ''; }); return c; })
                : v;
              const save = (k, v) => {
                if (savedSnap.current[k] === v) return;
                if (!lightOnly.current[k]) {
                  try { localStorage.setItem(k, JSON.stringify(v)); savedSnap.current[k] = v; return; }
                  catch (e) { console.warn('localStorage переполнен:', k); lightOnly.current[k] = true; }
                }
                const heavy = HEAVY[k];
                if (heavy) {
                  try {
                    localStorage.setItem(k, JSON.stringify(lighten(v, heavy)));
                    // Помечаем как сохранённое ОБЯЗАТЕЛЬНО: иначе на каждую
                    // следующую правку в любой другой части проекта мы бы
                    // заново упаковывали десятки мегабайт только затем,
                    // чтобы снова упереться в предел. На телефоне это
                    // ощущается как «приложение думает».
                    savedSnap.current[k] = v;
                    if (!storageWarned.current) {
                      storageWarned.current = true;
                      showToast('Проект перерос память устройства: местная копия теперь без фотографий. Сам проект цел в облаке. Чтобы он стал легче, подключите хранилище фото в меню «Проект»');
                    }
                    return;
                  } catch (e2) { console.warn('localStorage переполнен даже без картинок:', k); }
                }
                savedSnap.current[k] = v;   // не долбимся в закрытую дверь на каждую правку
                if (!storageWarned.current) {
                  storageWarned.current = true;
                  showToast('⚠️ На устройстве кончилось место — местная копия больше не обновляется. Проект сохраняется в облако');
                }
              };
              save('cf_scenes', scenes); save('cf_storyboard', storyboard);
              save('cf_references', references); save('cf_stickies', stickies);
              save('cf_docs', docs); save('cf_crew', crew);
              save('cf_files', projectFiles); save('cf_geartypes', gearTypes);
              save('cf_lightgeartypes', lightGearTypes); save('cf_lightschemes', lightSchemes);
              save('cf_boards', boards); save('cf_locations', locations);
            };
            flushLocal.current = doSave;
            // Упаковка проекта в строку — это десятки мегабайт на проекте
            // с фотографиями и сотни миллисекунд занятого главного потока.
            // Посреди жеста на доске такая пауза читается как рывок, причём
            // ровно в тот момент, когда человек ведёт пальцем. Ждём, пока
            // палец оторвут: правка никуда не денется, а уход со страницы
            // всё равно дописывает немедленно (эффект ниже).
            const later = () => {
              if (boardBusy.current) { t = setTimeout(later, 400); return; }
              doSave();
            };
            let t = setTimeout(later, 700);
            return () => clearTimeout(t);
          }, [scenes, storyboard, references, stickies, docs, crew, projectFiles, gearTypes, lightGearTypes, lightSchemes, boards, locations]);

          // Задержка экономит силы при печати, но приложение могут свернуть
          // раньше, чем она истечёт, — на iPad это происходит постоянно.
          // Поэтому при уходе со страницы дописываем немедленно.
          useEffect(() => {
            if (READ_ONLY) return;
            const flush = () => { try { flushLocal.current(); } catch (e) {} };
            const onVis = () => { if (document.visibilityState === 'hidden') flush(); };
            document.addEventListener('visibilitychange', onVis);
            window.addEventListener('pagehide', flush);
            return () => { document.removeEventListener('visibilitychange', onVis); window.removeEventListener('pagehide', flush); };
          }, []);

          // Выделение в галерее не должно ссылаться на удалённые изображения
          useEffect(() => {
            setSelectedRefIds(prev => {
              const next = prev.filter(id => references.some(r => r.id === id));
              return next.length === prev.length ? prev : next;
            });
          }, [references]);

          const syncTimers = useRef({});
          const dataRef = () => db.collection('artifacts').doc(appId).collection('public').doc('data');
          const syncDoc = (coll, id, data) => {
            // В режиме просмотра наружу не уходит ничего — это главная
            // защита ссылки-просмотра, а не спрятанные кнопки.
            if (READ_ONLY || !db || !user) return;
            const key = coll + '/' + id;
            clearTimeout(syncTimers.current[key]);
            syncTimers.current[key] = setTimeout(() => {
              delete syncTimers.current[key];
              trackWrite(
                dataRef().collection(coll).doc(id).set(data, { merge: true })
                  .catch(err => { console.warn('syncDoc', err); showToast('⚠️ Не удалось сохранить в облако'); })
              );
            }, 400);
          };
          const deleteNetDoc = (coll, id) => {
            if (READ_ONLY || !db || !user) return;
            const key = coll + '/' + id;
            clearTimeout(syncTimers.current[key]); delete syncTimers.current[key];
            trackWrite(dataRef().collection(coll).doc(id).delete().catch(err => console.warn('deleteNetDoc', err)));
          };

          const updateScene = (id, field, val) => {
            if (READ_ONLY) return;
            const up = scenesRef.current.map(s => s.id === id ? { ...s, [field]: val } : s);
            scenesRef.current = up; setScenes(up);
            const t = up.find(s => s.id === id); if (t) syncDoc('scenes', id, t);
          };

          // --- Номер сцены ---
          // Номер — строка, а не счётчик: в съёмочных планах живут и «12А»,
          // и «5-2», и КПП от второго режиссёра приходит именно такой.
          // Пробелы срезаем: невидимый хвост ломал бы и сортировку,
          // и проверку на повтор.
          const updateSceneNumber = (id, raw) => {
            if (READ_ONLY) return;
            const scene = scenesRef.current.find(s => s.id === id);
            if (!scene) return;
            const oldNum = String(scene.number || '');
            const next = String(raw).replace(/\s/g, '');
            // Раньше номер вписывался ещё и внутрь названия («СЦЕНА 2. НОВАЯ»),
            // и после смены номера в списке стояло «#12А СЦЕНА 2. НОВАЯ» —
            // два разных номера у одной сцены. Новые названия номер больше
            // не несут, а у старых приводим его к текущему — в том числе если
            // он разошёлся раньше. Правило узкое: только начало строки, только
            // приставка «СЦЕНА <номер>», и номер обязан начинаться с цифры.
            // Иначе «СЦЕНА У ОКНА» превратилась бы в «СЦЕНА 9 ОКНА».
            let title = scene.title;
            if (next && title) {
              title = title.replace(/^(\s*СЦЕНА\s+)(\d[^\s.,:;]*)(?=[\s.,:;—–-]|$)/i, '$1' + next);
            }
            const up = scenesRef.current.map(s => s.id === id ? { ...s, number: next, title } : s);
            scenesRef.current = up; setScenes(up);
            syncDoc('scenes', id, up.find(s => s.id === id));
            // Кадры раскадровки нумеруются от сцены («5.1», «5.2»), поэтому
            // переезжают вместе с ней — иначе в распечатке номера разойдутся.
            if (!oldNum || oldNum === next) return;
            const moved = [];
            const upFrames = storyboardRef.current.map(f => {
              if (f.sceneId !== id || !String(f.frameNum || '').startsWith(oldNum + '.')) return f;
              const nf = { ...f, frameNum: next + String(f.frameNum).slice(oldNum.length) };
              moved.push(nf); return nf;
            });
            if (moved.length) { storyboardRef.current = upFrames; setStoryboard(upFrames); moved.forEach(f => syncDoc('storyboard', f.id, f)); }
          };

          // Название вида «СЦЕНА 12А. КОРИДОР» несёт номер — забираем его в поле
          // номера. Список отсортирован по номеру, поэтому переименовал сцену —
          // она сама встала на своё место. Связь двусторонняя: смена номера
          // правит приставку в названии (см. updateSceneNumber), смена названия —
          // номер. Разбираем ТОЛЬКО начало строки и только цифровой токен,
          // чтобы «СЦЕНА У ОКНА» не трогалась.
          const updateSceneTitle = (id, raw) => {
            // Правка проекта в режиме просмотра запрещена НА ВХОДЕ,
            // а не только спрятанной кнопкой: пометить кнопку
            // `cf-edit-only` забывают, и тогда гость по ссылке менял
            // проект у себя на экране — в облако не уходило ничего,
            // но выглядело это как «я сломал чужой проект».
            if (READ_ONLY) return;
            const scene = scenesRef.current.find(s => s.id === id);
            if (!scene) return;
            const title = String(raw);
            const m = title.match(/^\s*СЦЕНА\s+(\d[^\s.,:;]*)(?=[\s.,:;—–-]|$)/i);
            const number = m ? m[1] : scene.number;
            const up = scenesRef.current.map(s => s.id === id ? { ...s, title, number } : s);
            scenesRef.current = up; setScenes(up);
            syncDoc('scenes', id, up.find(s => s.id === id));
          };

          // Короткая сводка выбранной техники — видна, когда блок свёрнут.
          const gearLine = (map, types) => Object.entries(map || {})
            .filter(([, v]) => v > 0)
            .map(([k, v]) => `${((types || {})[k] || { label: k }).label} × ${v}`)
            .join(' · ');

          // Следующий свободный номер: берём наибольшее число среди уже
          // существующих и прибавляем единицу. Считать по количеству сцен
          // нельзя — после удаления или своей нумерации номер бы повторился.
          const nextSceneNumber = () => {
            let max = 0;
            scenes.forEach(s => { const m = String(s.number || '').match(/\d+/); if (m && +m[0] > max) max = +m[0]; });
            return String(max + 1);
          };

          // Открытая сцена и открытый гайд должны существовать. Изначально сюда
          // подставлены id первого запуска ('scene-1', 'doc-1'), а в реальном
          // проекте id другие — и правая панель встречала пустотой, пока не
          // ткнёшь в список. То же после «нового проекта»: там id свежие.
          useEffect(() => {
            if (sortedScenes.length && !sortedScenes.some(s => s.id === activeSceneId)) setActiveSceneId(sortedScenes[0].id);
          }, [sortedScenes, activeSceneId]);
          useEffect(() => {
            // При открытой схеме света документ намеренно не выбран — не мешаем.
            if (activeSchemeId || !docs.length) return;
            if (!docs.some(d => d.id === activeDocId)) setActiveDocId(docs[0].id);
          }, [docs, activeDocId, activeSchemeId]);
          // Объект мог быть удалён на другом устройстве — тогда возвращаемся
          // к первому, иначе правая половина вкладки встречает пустотой.
          useEffect(() => {
            if (!sortedLocations.length) { if (activeLocationId) setActiveLocationId(null); return; }
            if (!sortedLocations.some(l => l.id === activeLocationId)) setActiveLocationId(sortedLocations[0].id);
          }, [sortedLocations, activeLocationId]);

          // Номера, которые встречаются больше одного раза, — их подсвечиваем.
          // Не запрещаем: посреди перенумерации совпадение неизбежно.
          const duplicateNumbers = useMemo(() => {
            const seen = {}, dup = {};
            scenes.forEach(s => { const n = String(s.number || '').trim(); if (!n) return; if (seen[n]) dup[n] = true; seen[n] = true; });
            return dup;
          }, [scenes]);
          
          const deleteScene = (id) => {
             freezeArrowsForCards([id]);
             const up = scenes.filter(s => s.id !== id);
             setScenes(up); deleteNetDoc('scenes', id);
             if (activeSceneId === id) setActiveSceneId(up.length > 0 ? up[0].id : null);
             showToast("Сцена удалена");
          };

          const updateSceneNested = (id, parentField, childKey, inc) => {
            if (READ_ONLY) return;
            const up = scenes.map(s => {
              if (s.id === id) {
                const g = s[parentField] || {}; const v = Math.max(0, (g[childKey] || 0) + inc);
                const nextGear = { ...g, [childKey]: v }; if (v === 0) delete nextGear[childKey];
                return { ...s, [parentField]: nextGear };
              } return s;
            });
            setScenes(up); const t = up.find(s => s.id === id); if (t) syncDoc('scenes', id, t);
          };

          // Загрузка с проверкой на повтор по имени файла. Имя референса —
          // это и есть имя файла, поэтому сравниваем с ним; регистр и
          // пробелы не считаем, «IMG_01.jpg» и «img_01.JPG» — одно и то же.
          // place — куда класть: {boardId, x, y}. Задаётся, когда картинку
          // бросили прямо на доску; без него референс уходит только в галерею.
          const normName = (s) => String(s || '').trim().toLowerCase();
          const handleMultiFileUpload = async (files, sceneId = null, place = null, locationId = null, folder = '') => {
            // Загрузка фотографий — самая заметная правка проекта:
            // бросок файла на доску идёт сюда мимо кнопок.
            if (READ_ONLY) return;
              const picked = Array.from(files);
              const imageFiles = picked.filter(f => f.type.startsWith('image/'));
              // Через «Файлы» браузер показывает и то, что картинкой не
              // является (расширения Safari толком не фильтрует). Молча
              // ничего не делать нельзя: человек выбрал файл и ждёт его.
              if (imageFiles.length === 0) {
                if (picked.length) showToast('Это не картинка — выберите фотографию');
                return;
              }

              const existing = new Set(references.map(r => normName(r.label)));
              const dups = imageFiles.filter(f => existing.has(normName(f.name)));
              if (dups.length > 0) {
                const decision = await new Promise(resolve => {
                  setDupPrompt({
                    names: dups.map(f => f.name),
                    total: imageFiles.length,
                    onResolve: resolve
                  });
                });
                setDupPrompt(null);
                if (decision === 'cancel') return;
                if (decision === 'skip') {
                  const dupSet = new Set(dups.map(f => normName(f.name)));
                  const kept = imageFiles.filter(f => !dupSet.has(normName(f.name)));
                  if (kept.length === 0) { showToast('Все выбранные картинки уже есть — ничего не загружено'); return; }
                  return uploadFiles(kept, sceneId, place, locationId, folder);
                }
              }
              return uploadFiles(imageFiles, sceneId, place, locationId, folder);
          };

          // Сжать файл к нужному размеру. Отдельно от uploadFiles, потому
          // что то же самое нужно и при откате, когда облако не ответило.
          const compressFile = (file, w, h, q) => new Promise(resolve => {
            const r = new FileReader();
            r.onerror = () => resolve('');
            r.onloadend = () => compressImage(r.result, w, h, resolve, q);
            r.readAsDataURL(file);
          });
          // Размер превью в базе. Было 640 — этого хватало экрану, но на
          // пол-листа A4 выходило около 190 dpi, и в отчёте со скаута было
          // видно, что фотография мягкая. 1280 даёт на том же месте ~370 dpi
          // и весит около 150 КБ вместо 40 — за печать платим местом в базе.
          // Подействует только на НОВЫЕ фотографии: у уже загруженных превью
          // остаётся прежним, для них печать тянет копию из облака.
          const CLOUD_THUMB = 1280;
          // Фотографии со скаута сами раскладываются: папка с именем
          // объекта и общий тег. Иначе после трёх выездов в галерее
          // лежит триста картинок без разбора, и найти в них нужный
          // двор нельзя ничем. Тег строчный — так их хранит всё
          // приложение (см. addTagTo).
          const SCOUT_TAG = 'скаут';

          const uploadFiles = async (imageFiles, sceneId, place = null, locationId = null, folder = '') => {
              const cfg = loadCloudCfg();
              const useCloud = !!cfg.provider;
              // Загруженное в объект сразу ложится в папку с его именем
              // и метится тегом «скаут» — искать потом всё равно придётся,
              // а разложить проще один раз при загрузке.
              const loc = locationId ? locations.find(l => l.id === locationId) : null;
              // Папка: у объекта — его имя, в галерее — та, что сейчас открыта.
              // Бросить картинку в открытую папку и найти её потом «где-то
              // среди всех» — разные вещи; человек ждёт первого.
              const locFolder = loc ? String(loc.name || '').trim() : String(folder || '').trim();
              showToast(`Оптимизация ${imageFiles.length} изображений...`);
              // В облачном режиме в базу кладём только превью, а оригинал
              // уезжает в облако файлом как есть — незачем портить фотографию
              // со скаута пересжатием, если она всё равно хранится снаружи.
              const stamp = Date.now();
              const flatOf = (file) => compressFile(file, useCloud ? CLOUD_THUMB : 1440, useCloud ? CLOUD_THUMB : 1080,
                                                   useCloud ? 0.72 : 0.8);
              // Кто тут панорама — выясняем ДО распаковки, по заголовку файла:
              // это дёшево и памяти не стоит ничего.
              const panoFlags = await Promise.all(imageFiles.map(f => detectPano(f).catch(() => false)));
              const prepared = new Array(imageFiles.length);
              // Обычные фотографии — разом, как и раньше.
              await Promise.all(imageFiles.map(async (file, idx) => {
                if (panoFlags[idx]) return;
                prepared[idx] = { file, idx, thumb: await flatOf(file) };
              }));
              // Панорамы — строго ПО ОДНОЙ: распаковывать несколько кадров
              // по 72 мегапикселя разом планшет не станет, он просто отдаст
              // пустые картинки, и это никак не проявится в виде ошибки.
              for (let idx = 0; idx < imageFiles.length; idx++) {
                if (!panoFlags[idx]) continue;
                const file = imageFiles[idx];
                if (imageFiles.length > 1) showToast(`Панорама ${idx + 1} из ${imageFiles.length}...`);
                const a = await makePanoAssets(file);
                prepared[idx] = a.url
                  ? { file, idx, thumb: a.url, pano: true, panoUrl: a.panoUrl }
                  // Не вышло — пусть ляжет обычной фотографией: это лучше,
                  // чем не лечь вовсе.
                  : { file, idx, thumb: await flatOf(file) };
              }
              const newRefs = prepared.map(({ file, thumb, idx, pano, panoUrl }) => ({
                    id: `ref-${stamp}-${idx}`,
                    sceneId: sceneId || '',
                    locationId: locationId || '',
                    boardId: place ? place.boardId : '',
                    url: thumb,
                    // Поля панорамы заводим только у панорам: у остальных
                    // они были бы лишним весом в каждом документе
                    ...(pano ? { pano: true, panoUrl: panoUrl || '' } : {}),
                    // Брошенные на доску раскладываем лесенкой от точки броска,
                    // остальные — как раньше, от левого верхнего угла экрана.
                    x: place ? place.x + (idx % 4) * 26 : (250 - canvasOffset.x) / zoom + (idx*20),
                    y: place ? place.y + Math.floor(idx / 4) * 26 : (250 - canvasOffset.y) / zoom + (idx*20),
                    label: file.name,
                    folder: locFolder,
                    tags: locationId ? [SCOUT_TAG] : []
              }));
              // Показываем сразу, не дожидаясь облака: на площадке связь
              // медленная, и стоять над кружком загрузки никто не будет.
              setReferences(prev => { const up = [...prev, ...newRefs]; newRefs.forEach(nr => syncDoc('references', nr.id, nr)); return up; });
              if (place) showToast(`На доску добавлено ${newRefs.length} шт.`);
              else if (locationId) showToast(`К объекту добавлено ${newRefs.length} фото`);
              if (useCloud) sendOriginals(newRefs, prepared.map(p => p.file), cfg);
          };

          // Отправка оригиналов в облако. Идёт ПОСЛЕ того, как картинки
          // уже показаны, и по одной: пачка параллельных загрузок с телефона
          // только мешает друг другу, а порядок здесь не важен.
          const sendOriginals = async (refs, files, cfg) => {
            let ok = 0; const bad = [];
            for (let i = 0; i < refs.length; i++) {
              const ref = refs[i], file = files[i];
              if (refs.length > 1) showToast(`${CLOUD_NAMES[cfg.provider] || 'Облако'}: отправляю ${i + 1} из ${refs.length}...`);
              try {
                const { full, path } = await cloudUpload(cfg, file, cloudFileName(ref.id, file.name));
                setReferences(prev => {
                  const up = prev.map(r => r.id === ref.id ? { ...r, full, cloud: { provider: cfg.provider, path } } : r);
                  const t = up.find(r => r.id === ref.id);
                  if (t) syncDoc('references', ref.id, t);
                  return up;
                });
                ok++;
              } catch (err) {
                console.warn('Облако не приняло файл:', err);
                bad.push(err && err.message ? err.message : String(err));
                // Оригинал никуда не уехал, а в базе лежит только мелкое
                // превью — то есть фотография пропала бы. Возвращаем ей
                // обычный полный размер прямо в базу, как было до облака.
                // У панорамы возвращать нечего: её панорамное превью
                // 2048×1024 и так лежит в проекте, а плоская полоса на
                // 1440 точек только съела бы место в документе.
                const fallback = ref.pano ? '' : await compressFile(file, 1440, 1080, 0.8);
                if (fallback) setReferences(prev => {
                  const up = prev.map(r => r.id === ref.id ? { ...r, url: fallback } : r);
                  const t = up.find(r => r.id === ref.id);
                  if (t) syncDoc('references', ref.id, t);
                  return up;
                });
              }
            }
            if (!bad.length) showToast(`${CLOUD_NAMES[cfg.provider]}: отправлено ${ok} шт.`);
            else {
              setCloudError(bad[0]);
              showToast(`⚠️ ${CLOUD_NAMES[cfg.provider]} не принял ${bad.length} из ${refs.length} — фото сохранены в проекте`);
            }
          };

          // --- Картинку можно БРОСИТЬ и ВСТАВИТЬ, а не только выбирать файлом ---
          // Раньше путь был один: кнопка, окно выбора файла, поиск в папках.
          // Увиденное в браузере приходилось сперва скачивать к себе, а потом
          // искать в загрузках. Все три двери ниже ведут в тот же
          // handleMultiFileUpload — вторая ветка загрузки разъехалась бы
          // с первой при первой же правке.

          // Своё имя для картинки из буфера. Браузер отдаёт их ВСЕ под одним
          // именем «image.png», а имя файла у нас — и подпись референса, и то,
          // по чему ищутся повторы: вторая вставка подряд упиралась бы
          // в вопрос «такая картинка уже есть». Счётчик рядом — потому что
          // имя считается до СЕКУНДЫ, а вставить две картинки подряд — дело
          // как раз одной секунды.
          const pasteSeq = useRef({ base: '', n: 0 });
          const pasteName = (type) => {
            let ext = String(type || '').split('/')[1] || 'png';
            ext = ext.replace(/[^a-z0-9]/gi, '').slice(0, 4).toLowerCase() || 'png';
            const d = new Date(), p2 = (n) => String(n).padStart(2, '0');
            const base = `Вставлено ${p2(d.getDate())}.${p2(d.getMonth() + 1)} ${p2(d.getHours())}-${p2(d.getMinutes())}-${p2(d.getSeconds())}`;
            if (pasteSeq.current.base === base) pasteSeq.current.n++;
            else pasteSeq.current = { base, n: 0 };
            const n = pasteSeq.current.n;
            return `${base}${n ? ` (${n + 1})` : ''}.${ext}`;
          };
          const renamedFile = (blob, name) => {
            try { return new File([blob], name, { type: blob.type }); } catch (e) { return blob; }
          };

          // Картинки из брошенного или вставленного. Лежат они в двух местах
          // и не всегда в обоих: у перетаскивания это `files`, у буфера
          // обмена — `items`, откуда файл надо ещё попросить. Читать оба
          // списка надо СИНХРОННО, прямо в обработчике события: после
          // первого await браузер их уже опустошил.
          const imagesFrom = (dt) => {
            if (!dt) return [];
            const out = [], seen = new Set();
            const push = (f) => {
              if (!f || !f.type || !f.type.startsWith('image/')) return;
              const key = `${f.name}|${f.size}|${f.lastModified || 0}`;
              if (seen.has(key)) return;
              seen.add(key);
              out.push(!f.name || /^image\.\w+$/i.test(f.name) ? renamedFile(f, pasteName(f.type)) : f);
            };
            Array.from(dt.files || []).forEach(push);
            Array.from(dt.items || []).forEach(it => { if (it.kind === 'file') push(it.getAsFile()); });
            return out;
          };

          // Картинку, притащенную ПРЯМО ИЗ ДРУГОЙ ВКЛАДКИ, браузер отдаёт
          // не файлом, а ссылкой: он её не скачивал, файла у него нет.
          const urlFrom = (dt) => {
            if (!dt || !dt.getData) return '';
            const uri = dt.getData('text/uri-list') || '';
            const first = uri.split('\n').map(x => x.trim()).find(x => x && x[0] !== '#');
            if (first) return first;
            const m = /<img[^>]+src\s*=\s*["']([^"']+)["']/i.exec(dt.getData('text/html') || '');
            if (m) return m[1];
            const txt = (dt.getData('text/plain') || '').trim();
            return /^(https?:|data:image\/)/i.test(txt) ? txt : '';
          };
          const fileFromUrl = async (url) => {
            const res = await fetch(url, { mode: 'cors', credentials: 'omit' });
            if (!res.ok) throw new Error(`сервер ответил ${res.status}`);
            const blob = await res.blob();
            if (!blob.type.startsWith('image/')) throw new Error('это не картинка');
            let name = '';
            try {
              const tail = new URL(url, location.href).pathname.split('/').pop() || '';
              if (/\.(jpe?g|png|gif|webp|avif|bmp)$/i.test(tail)) name = decodeURIComponent(tail);
            } catch (e) {}
            return renamedFile(blob, name || pasteName(blob.type));
          };

          // Общий приём брошенного. opts — те же координаты, что и у выбора
          // файлом: {sceneId, place, locationId}.
          const acceptDropped = async (dt, opts = {}) => {
            if (READ_ONLY) return;
            // Оба чтения — ДО первого await, пока списки ещё живы.
            const files = imagesFrom(dt);
            const url = files.length ? '' : urlFrom(dt);
            const go = (list) => handleMultiFileUpload(list, opts.sceneId || null, opts.place || null, opts.locationId || null, opts.folder || '');
            if (files.length) return go(files);
            if (!url) { showToast('В брошенном картинки нет'); return; }
            showToast('Забираю картинку по ссылке...');
            try { return go([await fileFromUrl(url)]); }
            catch (e) {
              // Чужой сайт почти всегда запрещает читать свои картинки
              // посторонним страницам, и обойти это нечем. Но путь через
              // буфер работает ВСЕГДА: там лежат сами точки, а не адрес.
              console.warn('Картинка по ссылке не забралась:', e);
              showToast('Сайт не отдал картинку. Скопируйте её (правая кнопка → «Копировать изображение») и вставьте сюда');
            }
          };

          // Кнопка «Вставить» — для планшета: Ctrl+V там нет вовсе, а
          // картинку из браузера копируют долгим нажатием. Спрашивать буфер
          // можно ТОЛЬКО из обработчика нажатия: без жеста человека браузер
          // отказывает, причём молча.
          const pasteFromClipboard = async (opts = {}) => {
            if (READ_ONLY) return;
            if (!navigator.clipboard || !navigator.clipboard.read) {
              showToast('Этот браузер не даёт читать буфер — нажмите Ctrl+V или перетащите файл'); return;
            }
            let items;
            try { items = await navigator.clipboard.read(); }
            catch (e) { showToast('Буфер прочитать не дали. Нажмите Ctrl+V или перетащите файл'); return; }
            const files = [];
            for (const it of items) {
              const type = (it.types || []).find(t => t.startsWith('image/'));
              if (!type) continue;
              try { files.push(renamedFile(await it.getType(type), pasteName(type))); } catch (e) {}
            }
            if (!files.length) { showToast('В буфере нет картинки — скопируйте её в браузере и попробуйте снова'); return; }
            return handleMultiFileUpload(files, opts.sceneId || null, opts.place || null, opts.locationId || null, opts.folder || '');
          };

          // Что несёт перетаскивание. Проверяем ДО preventDefault: перехватив
          // всё подряд, мы отняли бы у полей ввода обычный перенос текста.
          // Выделенный текст несёт text/plain и text/html, но НЕ uri-list,
          // поэтому список короткий и набору не мешает.
          const dropHasImage = (dt) => {
            const types = Array.from((dt && dt.types) || []);
            return types.indexOf('Files') >= 0 || types.indexOf('text/uri-list') >= 0;
          };

          // Ctrl+V в ГАЛЕРЕЕ. Та же механика, что во вкладке «Объекты»,
          // и намеренно тот же handleMultiFileUpload: вторая ветка
          // загрузки разъехалась бы с первой при первой же правке.
          // Картинка ложится в ОТКРЫТУЮ папку — «вставил в папку, а
          // нашлось где-то среди всех» человек воспринимает как потерю.
          useEffect(() => {
            if (READ_ONLY || currentView !== 'gallery') return;
            const onPaste = (e) => {
              const files = imagesFrom(e.clipboardData);
              if (!files.length) return;
              // В поле ввода не мешаем вставлять ТЕКСТ. Но картинку
              // забираем себе даже оттуда: положить её в <input>
              // некуда, и она бы просто пропала.
              const t = e.target;
              const inField = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
              if (inField && (e.clipboardData.getData('text/plain') || '').trim()) return;
              e.preventDefault();
              handleMultiFileUpload(files, null, null, null, galleryDropFolder());
            };
            document.addEventListener('paste', onPaste);
            return () => document.removeEventListener('paste', onPaste);
          }, [currentView, activeFolder, references]);

          // Куда кладём брошенное и вставленное в галерее. «Все» и
          // «Без папки» — это не папки, а фильтры: класть в них нечего.
          const galleryDropFolder = () => (activeFolder && activeFolder !== '__none__') ? activeFolder : '';

          // Ctrl+V на вкладке «Объекты» кладёт картинку в ОТКРЫТЫЙ объект.
          // Слушаем на документе: своего поля у вставки нет, и требовать
          // сперва «выбрать, куда именно» значило бы вернуть лишний шаг.
          useEffect(() => {
            if (READ_ONLY || currentView !== 'locations' || !activeLocationId) return;
            const onPaste = (e) => {
              const files = imagesFrom(e.clipboardData);
              if (!files.length) return;
              // В поле ввода не мешаем, когда вставляют текст. Но если
              // в буфере ОДНА картинка, класть в поле нечего — она бы
              // просто пропала, поэтому забираем себе.
              const t = e.target;
              const inField = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
              if (inField && (e.clipboardData.getData('text/plain') || '').trim()) return;
              e.preventDefault();
              handleMultiFileUpload(files, null, null, activeLocationId);
            };
            document.addEventListener('paste', onPaste);
            return () => document.removeEventListener('paste', onPaste);
          }, [currentView, activeLocationId, references, locations]);

          // --- Файлы проекта: КПП, сценарий в PDF, доки ---
          // Файл лежит в документе базы строкой base64, а предел документа
          // Firestore — 1 МБ, то есть около 650 КБ настоящего файла. Раньше
          // на этом всё и кончалось: КПП на 750 КБ оставался только на своём
          // устройстве, а группа его не видела. Если облако подключено, файл
          // уезжает ТУДА — тем же путём, что и оригиналы фотографий, — а в
          // комнате остаётся ссылка на пару сотен байт.
          const FILE_DOC_MAX = 900 * 1024;          // столько base64 влезает в документ
          const FILE_LOCAL_MAX = 4 * 1024 * 1024;   // без облака — как было
          const FILE_CLOUD_MAX = 100 * 1024 * 1024; // с облаком — предел одной отправки
          const readDataUrl = (f) => new Promise((res) => {
            const r = new FileReader();
            r.onloadend = () => res(r.result || '');
            r.onerror = () => res('');
            r.readAsDataURL(f);
          });

          const addProjectFile = async (f) => {
            if (READ_ONLY) return;
            const cfg = loadCloudCfg();
            const useCloud = !!cfg.provider;
            if (f.size > (useCloud ? FILE_CLOUD_MAX : FILE_LOCAL_MAX)) {
              showToast(useCloud ? '❌ Файл больше 100 МБ'
                                 : '❌ Файл больше 4 МБ — подключите облако в меню «Проект»');
              return;
            }
            const id = `file-${Date.now()}`;
            const rec = { id, name: f.name, size: `${(f.size / 1024).toFixed(1)} KB`, data: '' };
            // base64 читаем, только если он поместится в документ: гонять
            // в память полсотни мегабайт ради строки, которую всё равно
            // некуда записать, незачем.
            if (f.size < 700 * 1024) {
              const d = await readDataUrl(f);
              if (d.length < FILE_DOC_MAX) rec.data = d;
            }
            if (useCloud) {
              showToast(`${CLOUD_NAMES[cfg.provider]}: отправляю ${f.name}...`);
              try {
                const { full, path } = await cloudUpload(cfg, f, cloudDocName(id, f.name));
                const item = { ...rec, full, cloud: { provider: cfg.provider, path } };
                setProjectFiles(prev => [...prev, item]);
                syncDoc('projectFiles', id, item);
                showToast(`${CLOUD_NAMES[cfg.provider]}: ${f.name} — готово`);
                return;
              } catch (err) {
                console.warn('Облако не приняло файл проекта:', err);
                setCloudError(err && err.message ? err.message : String(err));
                showToast(`⚠️ ${CLOUD_NAMES[cfg.provider]} не принял файл — подробности в меню «Проект» → «Хранилище фото»`);
              }
            }
            // Без облака (или облако отказало) — как раньше: файл целиком
            // в базе, если влезает; иначе только на этом устройстве.
            if (rec.data) {
              setProjectFiles(prev => [...prev, rec]);
              syncDoc('projectFiles', id, rec);
              if (!useCloud) showToast(`Загружен: ${f.name}`);
              return;
            }
            const local = f.size <= FILE_LOCAL_MAX ? await readDataUrl(f) : '';
            if (local) {
              // Такой файл виден только здесь и только до следующего ответа
              // облака: подписка отдаёт список комнаты целиком, а его в этом
              // списке нет. Говорим об этом прямо — «сохранён» без оговорок
              // было бы обещанием, которого приложение не держит.
              setProjectFiles(prev => [...prev, { ...rec, data: local }]);
              showToast(`📁 ${f.name} остался только на этом устройстве — великоват для базы. Подключите хранилище в меню «Проект», и файл увидит вся группа`);
            } else {
              showToast(`❌ ${f.name} не загрузился: для базы велик, а облако его не приняло`);
            }
          };

          // Отправить в облако то, что уже лежит в проекте. Файлы,
          // загруженные до подключения облака, иначе пришлось бы удалять
          // и заводить заново.
          const sendFileToCloud = async (file) => {
            const cfg = loadCloudCfg();
            if (!cfg.provider) { showToast('Сначала подключите облако в меню «Проект»'); return; }
            if (!file.data || file.data === '#') return;
            showToast(`${CLOUD_NAMES[cfg.provider]}: отправляю ${file.name}...`);
            try {
              const { full, path } = await cloudUpload(cfg, dataUrlToBlob(file.data), cloudDocName(file.id, file.name));
              // Что в документ не влезало, в нём и не окажется: файл теперь
              // целиком лежит в облаке, и вторая копия только мешала бы.
              const item = { ...file, data: file.data.length < FILE_DOC_MAX ? file.data : '',
                             full, cloud: { provider: cfg.provider, path } };
              setProjectFiles(prev => prev.map(x => x.id === file.id ? item : x));
              syncDoc('projectFiles', file.id, item);
              showToast(`${CLOUD_NAMES[cfg.provider]}: ${file.name} — готово`);
            } catch (err) {
              console.warn('Облако не приняло файл проекта:', err);
              setCloudError(err && err.message ? err.message : String(err));
              showToast(`⚠️ ${CLOUD_NAMES[cfg.provider]} не принял файл — подробности в меню «Проект» → «Хранилище фото»`);
            }
          };

          // Пустая карточка референса на доске: заполняем именно её,
          // а не создаём рядом ещё одну картинку в галерее.
          const fillRefImage = (refId, file) => {
              const r = new FileReader();
              r.onloadend = () => compressImage(r.result, 1440, 1080, (c) => {
                setReferences(prev => {
                  const up = prev.map(x => x.id === refId
                    ? { ...x, url: c, label: (x.label && x.label !== 'Референс') ? x.label : file.name }
                    : x);
                  syncDoc('references', refId, up.find(x => x.id === refId));
                  return up;
                });
              });
              r.readAsDataURL(file);
          };

          // --- Объекты: завести, править, связать ---
          const addLocation = () => {
            const loc = {
              id: `loc-${Date.now()}`, name: 'НОВЫЙ ОБЪЕКТ', address: '', coords: '',
              description: '', sceneIds: [], lightSchemeId: '', order: Date.now()
            };
            setLocations(prev => [...prev, loc]);
            syncDoc('locations', loc.id, loc);
            setActiveLocationId(loc.id);
          };
          const updateLocation = (id, field, val) => {
            if (READ_ONLY) return;
            // Переименовали объект — папка его фотографий едет следом.
            // Иначе они остались бы лежать под старым именем, и человек
            // искал бы их там, где их уже нет по смыслу.
            if (field === 'name') {
              const oldName = String((locations.find(l => l.id === id) || {}).name || '').trim();
              const newName = String(val || '').trim();
              if (oldName !== newName) {
                setReferences(prev => {
                  const moved = [];
                  const up = prev.map(r => {
                    // Только фотографии ЭТОГО объекта и только те, что лежат
                    // в папке со старым именем: если картинку унесли в другую
                    // папку руками, тащить её обратно нельзя.
                    if (r.locationId !== id) return r;
                    if (String(r.folder || '').trim() !== oldName) return r;
                    const nr = { ...r, folder: newName };
                    moved.push(nr);
                    return nr;
                  });
                  moved.forEach(r => syncDoc('references', r.id, r));
                  return moved.length ? up : prev;
                });
              }
            }
            setLocations(prev => {
              const up = prev.map(l => l.id === id ? { ...l, [field]: val } : l);
              const t = up.find(l => l.id === id);
              if (t) syncDoc('locations', id, t);
              return up;
            });
          };
          // Объект снимается со сцены и обратно одной кнопкой. Список
          // хранится у объекта: одна квартира живёт в пяти сценах, и
          // держать эту связь у каждой сцены значило бы чинить её в пяти
          // местах при каждом переносе.
          const toggleLocationScene = (locId, sceneId) => {
            const loc = locations.find(l => l.id === locId);
            if (!loc) return;
            const has = (loc.sceneIds || []).includes(sceneId);
            updateLocation(locId, 'sceneIds',
              has ? (loc.sceneIds || []).filter(s => s !== sceneId) : [...(loc.sceneIds || []), sceneId]);
          };
          // Фотографии объекта — референсы с его меткой.
          const locationPhotos = (locId) => references.filter(r => r.locationId === locId);
          // Отвязать — не то же, что удалить: это правило всего приложения.
          // Крестик у фотографии в объекте снимает метку, а сама картинка
          // остаётся в галерее.
          const setRefLocation = (refId, locId) => {
            setReferences(prev => {
              const up = prev.map(r => r.id === refId ? { ...r, locationId: locId } : r);
              syncDoc('references', refId, up.find(r => r.id === refId));
              return up;
            });
          };
          // Поиск координат по адресу. Отдельная кнопка, а не «само при
          // наборе»: на каждую набранную букву дёргать чужую службу нельзя,
          // да и адрес человек дописывает не сразу.
          const [geoBusy, setGeoBusy] = useState('');
          const [geoError, setGeoError] = useState(null);
          const findCoords = async (loc) => {
            const q = String(loc.address || '').trim();
            if (!q) return;
            setGeoBusy(loc.id); setGeoError(null);
            try {
              const { coords, name } = await geocodeAddress(q);
              updateLocation(loc.id, 'coords', coords);
              showToast('Нашёл: ' + (name.split(',').slice(0, 3).join(',') || coords));
            } catch (err) {
              setGeoError({ id: loc.id, text: (err && err.message ? err.message : String(err))
                + '. Можно вписать координаты руками — скопировать из карт.' });
            }
            setGeoBusy('');
          };

          const deleteLocation = (id) => {
            if (READ_ONLY) return;
            const loc = locations.find(l => l.id === id);
            if (!loc) return;
            const photos = locationPhotos(id);
            setConfirmAction({
              title: `Удалить объект «${loc.name || 'без названия'}»?`,
              message: photos.length
                ? `Фотографии (${photos.length} шт.) НЕ удаляются — они останутся в галерее, просто перестанут числиться за этим объектом.`
                : 'Объект удалится из проекта.',
              onConfirm: () => {
                photos.forEach(p => setRefLocation(p.id, ''));
                setLocations(prev => prev.filter(l => l.id !== id));
                deleteNetDoc('locations', id);
                showToast('Объект удалён');
              }
            });
          };

          const addCustomGear = (isLight) => {
              const name = isLight ? newLightGearName : newGearName;
              if (!name.trim()) return;
              const key = name.toLowerCase().replace(/\s+/g, '_');
              const payload = { label: name };
              if (isLight) { setLightGearTypes(prev => { const up = {...prev, [key]: payload}; syncDoc('lightGearTypes', key, payload); return up; }); setNewLightGearName(''); }
              else { setGearTypes(prev => { const up = {...prev, [key]: payload}; syncDoc('gearTypes', key, payload); return up; }); setNewGearName(''); }
          };

          // --- Файл-снимок для отправки «наружу» ---
          // Берём исходник самой страницы и вшиваем в него данные.
          // Открывается офлайн, к облаку не подключается, править нечего.
          const [snapshotBusy, setSnapshotBusy] = useState(false);
          const exportSnapshot = async (scope) => {
            setSnapshotBusy(true);
            try {
              showToast('Собираю файл — это займёт несколько секунд...');
              const res = await fetch(location.pathname, { cache: 'reload' });
              let html = await res.text();

              // Кладём только то, чем делимся: лишние картинки сильно весят.
              const data = {};
              if (scope === 'gallery' || scope === 'all') data.cf_references = references;
              if (scope === 'board' || scope === 'all') {
                data.cf_references = references;
                data.cf_stickies = stickies;
                data.cf_boards = boards;
                // Рисунок кистью раньше в снимок не попадал вовсе: доска
                // уезжала заказчику без единой линии. Векторные штрихи весят
                // килобайты, поэтому теперь кладём их по всем доскам.
                // Старую растровую подложку НЕ берём — она весит сотни
                // килобайт на доску и раздула бы файл до неотправляемого.
                sortedBoards.forEach(b => {
                  const kk = b.id === activeBoardId ? packInk(strokesRef.current) : localStorage.getItem('cf_ink_' + b.id);
                  if (kk && kk !== '[]') data['cf_ink_' + b.id] = kk;
                  const ff = b.id === activeBoardId ? packShapes(shapesRef.current) : localStorage.getItem('cf_shapes_' + b.id);
                  if (ff && ff !== '[]') data['cf_shapes_' + b.id] = ff;
                });
              }
              if (scope === 'all') {
                data.cf_scenes = scenes; data.cf_storyboard = storyboard;
                data.cf_docs = docs; data.cf_crew = crew; data.cf_locations = locations;
                data.cf_geartypes = gearTypes; data.cf_lightgeartypes = lightGearTypes;
                data.cf_lightschemes = lightSchemes;
              }
              if (scope === 'locations') {
                data.cf_locations = locations;
                // Фотографии объекта — обычные референсы с locationId. Берём
                // ТОЛЬКО их: вся галерея утяжелила бы файл в разы, а на экране
                // объекта её всё равно не видно.
                data.cf_references = references.filter(r => r.locationId);
                // Сцены нужны не ради них самих: на карточке объекта стоят
                // чипы сцен, а солнце считается по датам их смен.
                data.cf_scenes = scenes;
                data.cf_lightschemes = lightSchemes;
                data.cf_stickies = [];
              }
              if (scope === 'gallery') { data.cf_scenes = []; data.cf_stickies = []; }

              const payload = { scope, room: appId, madeAt: new Date().toISOString(), data };
              // Закрывающий тег скрипта внутри данных разорвал бы разметку — экранируем.
              const json = JSON.stringify(payload).replace(/<\//g, '<\\/');
              const inject = '<script>window.__CF_SNAPSHOT__ = ' + json + ';<\/script>\n</head>';
              if (!html.includes('</head>')) throw new Error('не нашёл </head>');
              html = html.replace('</head>', inject);

              const blob = new Blob([html], { type: 'text/html' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              const names = { gallery: 'референсы', board: 'доска', all: 'проект' };
              a.download = `CineFlow_${names[scope] || scope}_${new Date().toISOString().split('T')[0]}.html`;
              document.body.appendChild(a); a.click(); document.body.removeChild(a);
              URL.revokeObjectURL(url);
              showToast(`Готово · ${(blob.size / 1048576).toFixed(1)} МБ`);
            } catch (err) {
              console.error(err);
              showToast('Не удалось собрать файл: ' + err.message);
            }
            setSnapshotBusy(false);
          };

          // --- Новый чистый проект ---
          // Раньше кнопка чистила только память устройства, а комнату в облаке
          // не трогала — и после перезагрузки весь проект приезжал обратно.
          // Теперь стираем комнату целиком и кладём в неё пустую заготовку.
          const resetProject = () => {
            // Подписка считает пустую комнату новой и заливает в неё то, что
            // осталось в памяти. Помечаем коллекции засеянными, иначе всё
            // удалённое немедленно вернётся обратно.
            ['scenes', 'storyboard', 'references', 'stickies', 'docs', 'crew', 'projectFiles',
             'lightSchemes', 'gearTypes', 'lightGearTypes', 'boards', 'locations'].forEach(c => { seededRef.current[c] = true; });

            const wipe = (coll, list) => list.forEach(x => deleteNetDoc(coll, x.id));
            wipe('scenes', scenes);         wipe('storyboard', storyboard);
            wipe('references', references); wipe('stickies', stickies);
            wipe('docs', docs);             wipe('crew', crew);
            wipe('projectFiles', projectFiles); wipe('lightSchemes', lightSchemes);
            wipe('locations', locations);
            wipe('messages', messages);
            Object.keys(gearTypes || {}).forEach(k => deleteNetDoc('gearTypes', k));
            Object.keys(lightGearTypes || {}).forEach(k => deleteNetDoc('lightGearTypes', k));
            // Рисунок обнуляем записью, а не удалением: пустой документ гасит
            // холст и у тех, у кого доска сейчас открыта на другом устройстве.
            sortedBoards.forEach(b => { saveCanvas(b.id, ''); saveStrokes(b.id, []); saveShapes(b.id, []); deleteNetDoc('boards', b.id); });

            // Заготовка: одна сцена, один гайд, одна доска, каталоги по умолчанию.
            // Идентификаторы новые — чтобы свежие документы не встретились
            // в очереди с только что удалёнными.
            const stamp = Date.now();
            const freshScene = { ...initialScenes[0], id: `sc-${stamp}` };
            const freshDoc = { ...initialDocs[0], id: `doc-${stamp}` };
            setScenes([freshScene]); syncDoc('scenes', freshScene.id, freshScene);
            setDocs([freshDoc]);     syncDoc('docs', freshDoc.id, freshDoc);
            setBoards([DEFAULT_BOARD]); syncDoc('boards', DEFAULT_BOARD.id, DEFAULT_BOARD);
            setGearTypes({ ...DEFAULT_GEAR });
            Object.entries(DEFAULT_GEAR).forEach(([k, v]) => syncDoc('gearTypes', k, v));
            setLightGearTypes({ ...DEFAULT_LIGHT_GEAR });
            Object.entries(DEFAULT_LIGHT_GEAR).forEach(([k, v]) => syncDoc('lightGearTypes', k, v));

            setStoryboard([]); setReferences([]); setStickies([]); setCrew([]);
            setProjectFiles([]); setLightSchemes([]); setMessages([]);
            setLocations([]); setActiveLocationId(null);

            // Куда приложение смотрит после сброса
            setActiveSceneId(freshScene.id); setActiveDocId(freshDoc.id);
            setActiveSchemeId(null); setActiveBoardId(DEFAULT_BOARD.id);
            setSelectedWbItems([]); setSelectedRefIds([]);
            setTagSearch(''); setActiveFolder('');
            const now = Date.now();
            setLastReadChat(now);
            try { localStorage.setItem('cf_last_read', now); } catch (err) {}

            strokesRef.current = []; shapesRef.current = []; setSelShapes([]);
            legacyCv.current = null; legacyUrl.current = null; legacyMap.current = null;
            legacyDirty.current = false;
            undoStack.current = []; redoStack.current = [];
            setCanUndo(false); setCanRedo(false);
            bumpInk();

            setShowProjectModal(false);
            showToast('Создан чистый проект');
          };

          // Склонение существительного после числа: plur(2, 'сцена', 'сцены',
          // 'сцен') → «сцены». «1 сцен» и «4 сцен» в шапке смены читаются
          // опечаткой, а КПП показывают всей группе.
          const plur = (n, one, few, many) => {
            const a = Math.abs(n) % 100, b = a % 10;
            if (a > 10 && a < 20) return many;
            if (b > 1 && b < 5) return few;
            if (b === 1) return one;
            return many;
          };
          const formatDateDisplay = (dateStr) => { if (!dateStr) return '—'; const [y, m, d] = dateStr.split('-'); return `${d}.${m}.${y}`; };

          // --- Групповое перетаскивание на Whiteboard ---


          // Дросселировать перетаскивание по кадрам ПРОБОВАЛИ и откатили:
          // всплески оно сглаживает, но добавляет кадр задержки — замер
          // настоящей мышью дал отставание карточки от курсора 17 точек
          // против 12. На планшете выигрыш недоказуем, а проигрыш измерен.
          const dragPos = useRef(null);
          // Сдвиг всей группы за один расчёт: направляющие ищутся по общей
          // рамке, и относительные расстояния внутри группы не плывут.
          // Раньше каждая карточка независимо округлялась к сетке в 24 точки —
          // выровнять её по СОСЕДНЕЙ было нельзя, если та стояла не по сетке.
          const dragMoved = useRef(false);
          const dragDelta = () => {
              const p = dragPos.current, d = draggingWbItems;
              if (!p || !d) return { dx: 0, dy: 0, idle: true };
              const z = zoom || 1;
              if (!dragMoved.current) {
                  if (Math.hypot(p.x - d.startX, p.y - d.startY) < DRAG_START_PX) return { dx: 0, dy: 0, idle: true };
                  dragMoved.current = true;
                  // Шаг отмены пишем в момент первого настоящего движения,
                  // а не при нажатии: иначе каждый выбор съедал бы шаг.
                  // Один шаг на весь жест — и карточки, и фигуры разом.
                  pushUndo(false, d.items.filter(i => i.type !== 'shape').map(i => ({ coll: cardColl[i.type], id: i.id })));
                  const liveIds = new Set(d.items.filter(i => i.type === 'shape').map(i => i.id));
                  // Стрелки, привязанные к перетаскиваемым карточкам, тоже
                  // переносим на верхний слой: иначе связь висела бы на
                  // старом месте до конца жеста, а карточка уже уехала.
                  arrowsBoundTo(d.items.map(i => i.id)).forEach(q => liveIds.add(q.id));
                  if (liveIds.size) {
                      shapeAct.current = { kind: 'drag', ids: liveIds, pointerId: -1, moved: true };
                      requestStatic();
                  }
              }
              let dx = (p.x - d.startX) / z, dy = (p.y - d.startY) / z;
              guides.current = [];
              if (d.items.length) {
                  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
                  d.items.forEach(i => {
                      x0 = Math.min(x0, i.bx); y0 = Math.min(y0, i.by);
                      x1 = Math.max(x1, i.bx + i.w); y1 = Math.max(y1, i.by + i.h);
                  });
                  const adj = snapMove({ x0: x0 + dx, y0: y0 + dy, x1: x1 + dx, y1: y1 + dy });
                  dx += adj.dx; dy += adj.dy;
              }
              return { dx, dy };
          };
          const applyDrag = () => {
              const d = draggingWbItems;
              if (!dragPos.current || !d) return;
              const { dx, dy, idle } = dragDelta();
              if (idle) return;
              // При медленном ведении притяжка чаще всего не меняет положение
              // вообще — такие обновления просто не запускаем.
              const apply = (setter, type) => {
                  const items = d.items.filter(i => i.type === type);
                  if (!items.length) return;
                  setter(prev => {
                      let out = prev, changed = false;
                      items.forEach(item => {
                          const nx = item.ox + dx, ny = item.oy + dy;
                          const cur = out.find(o => o.id === item.id);
                          if (!cur || (cur.x === nx && cur.y === ny)) return;
                          out = out.map(o => o.id === item.id ? { ...o, x: nx, y: ny } : o);
                          changed = true;
                      });
                      return changed ? out : prev;
                  });
              };
              apply(setScenes, 'scene');
              apply(setReferences, 'ref');
              apply(setStickies, 'sticky');
              apply(setDocs, 'doc');
              d.items.filter(i => i.type === 'shape').forEach(item => {
                  const s = shapesRef.current.find(q => q.id === item.id);
                  if (s) { s.x = item.ox + dx; s.y = item.oy + dy; shapeDirty(s); }
              });
              requestLive();     // направляющие и едущие фигуры рисует верхний слой
          };

          // Одна дверь для начала перетаскивания — и для карточек, и для
          // фигур. Иначе после выделения рамкой «половина уезжает, половина
          // стоит»: карточки живут в разметке, фигуры на холсте, но для
          // человека это одно выделение и тянуться должно вместе.
          const beginBoardDrag = (e, cardIds, shapeIds) => {
              // Доска в просмотре — картинка, а не рабочее место.
              // Инструменты у гостя спрятаны, но фигуры лежат на ХОЛСТЕ,
              // и до них жест доходит мимо кнопок: стрелку схемы можно
              // было утащить в сторону и решить, что сломал чужую доску.
              if (READ_ONLY) return;
              const items = [];
              cardIds.forEach(sId => {
                  const sc = scenes.find(x => x.id === sId); if (sc) return items.push({ id: sId, type: 'scene', ox: sc.x, oy: sc.y, bx: sc.x, by: sc.y, w: 288, h: 150 });
                  const r = references.find(x => x.id === sId); if (r) return items.push({ id: sId, type: 'ref', ox: r.x, oy: r.y, bx: r.x, by: r.y, w: refW(r), h: refH(r) });
                  const st = stickies.find(x => x.id === sId); if (st) return items.push({ id: sId, type: 'sticky', ox: st.x, oy: st.y, bx: st.x, by: st.y, w: stickyW(st), h: stickyH(st) });
                  const dc = docs.find(x => x.id === sId); if (dc) return items.push({ id: sId, type: 'doc', ox: dc.x, oy: dc.y, bx: dc.x, by: dc.y, w: docCardW(dc), h: docCardH(dc) });
              });
              (shapeIds || []).forEach(id => {
                  const s = shapesRef.current.find(q => q.id === id); if (!s) return;
                  const b = shapeBox(s);
                  items.push({ id, type: 'shape', ox: s.x, oy: s.y, bx: b.x, by: b.y, w: b.w, h: b.h });
              });
              if (!items.length) return;
              buildSnapPool(items.map(i => i.id));
              boardBusy.current = true;
              dragMoved.current = false;
              dragPos.current = { x: e.clientX, y: e.clientY };
              setDraggingWbItems({ pointerId: e.pointerId, startX: e.clientX, startY: e.clientY, items });
              e.currentTarget.setPointerCapture(e.pointerId);
          };
          const handleDragMove = (e) => {
              if (!draggingWbItems || draggingWbItems.pointerId !== e.pointerId) return;
              dragPos.current = { x: e.clientX, y: e.clientY };
              applyDrag();
          };

          const handleDragUp = (e) => {
              if (!draggingWbItems || draggingWbItems.pointerId !== e.pointerId) return;
              applyDrag();
              if (e.currentTarget.hasPointerCapture && e.currentTarget.hasPointerCapture(e.pointerId)) {
                  e.currentTarget.releasePointerCapture(e.pointerId);
              }
              // В облако пишем ПОСЧИТАННОЕ положение, а не взятое из состояния:
              // состояние применяется не сразу, и последний сдвиг ушёл бы
              // в облако старым — карточка после перезагрузки прыгала бы назад.
