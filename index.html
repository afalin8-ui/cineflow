            if (this.state.hasError) {
              const msg = this.state.msg || 'Причина неизвестна';
              // Переполненное хранилище объясняем словами: от строки
              // QuotaExceededError человеку на площадке толку нет.
              const full = /quota|exceed/i.test(msg);
              // Код комнаты и имя переживают сброс НАМЕРЕННО: комната —
              // единственный ключ к проекту в облаке. Стёрший её попадал
              // в НОВУЮ пустую комнату и видел пустой проект — то есть
              // кнопка «Сбросить» на аварийном экране выглядела как
              // потеря всего проекта целиком.
              const reset = () => {
                if (!confirm('Удалить местную копию проекта на этом устройстве? Проект в облаке останется, приложение заберёт его заново.')) return;
                try {
                  const keep = ['cf_room', 'cf_user_name', 'cf_user_role', 'cf_client_id', 'cf_gemini_key', CLOUD_KEY];
                  const saved = keep.map(k => [k, localStorage.getItem(k)]);
                  localStorage.clear();
                  saved.forEach(([k, v]) => { if (v !== null) { try { localStorage.setItem(k, v); } catch (e) {} } });
                } catch (e) {}
                window.location.reload();
              };
              const copy = () => {
                try {
                  if (navigator.clipboard) navigator.clipboard.writeText(msg);
                  else { const t = document.createElement('textarea'); t.value = msg; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
                } catch (e) {}
              };
              return (
                <div className="flex flex-col items-center justify-center h-screen bg-[#1a1918] text-zinc-200 p-6">
                  <div className="cf-modal-box glass-panel p-8 rounded-lg max-w-md text-center border-t border-red-500/30">
                    <h1 className="text-xl font-bold text-red-400 mb-4">Что-то пошло не так</h1>
                    <p className="text-sm text-zinc-400 mb-4">{full
                      ? 'На устройстве кончилось место для местной копии проекта. Сам проект в облаке цел — перезагрузите приложение, оно заберёт его оттуда.'
                      : 'Произошла ошибка интерфейса. Перезагрузите приложение — ваши данные сохранены.'}</p>
                    <div className="flex items-center justify-between mb-1">
                      <span className="text-[11px] text-zinc-500">Что случилось:</span>
                      <button onClick={copy} className="text-[11px] text-zinc-500 hover:text-zinc-300 underline underline-offset-2">Скопировать</button>
                    </div>
                    <div className="text-[11px] font-mono text-zinc-400 bg-black/40 border border-white/10 rounded-lg p-3 mb-5 text-left break-words" style={{ maxHeight: 110, overflowY: 'auto' }}>{msg}</div>
                    <button onClick={() => window.location.reload()} className="bg-indigo-500 hover:bg-indigo-400 text-[#1a1918] px-6 py-3 rounded-lg text-sm font-medium w-full transition-colors">Перезагрузить приложение</button>
                    <button onClick={reset} className="mt-3 bg-transparent border border-red-500/40 text-red-400 hover:bg-red-500/10 px-6 py-3 rounded-lg text-sm font-medium w-full transition-colors">Очистить местную копию и перезагрузить</button>
                    <p className="text-[11px] text-zinc-500 mt-2">Код комнаты и имя сохранятся — проект вернётся из облака.</p>
                  </div>
                </div>
              );
            }
            return this.props.children;
          }
        }

        // Сколько занято в «ящике» этого сайта на устройстве и влезает ли
        // туда ещё что-нибудь. Цифра нужна ЧЕЛОВЕКУ: свободные гигабайты
        // на диске к делу не относятся — браузер выдаёт сайту всего
        // несколько мегабайт, и переполнение этого ящика видно только
        // по цифре. Раньше оно не было видно вообще ничем.
        // Считаем ОДИН раз, при открытии окна: перебор всех ключей на
        // каждую перерисовку — это мегабайты работы впустую.
        const StorageInfo = () => {
          const info = React.useMemo(() => {
            let used = 0;
            try {
              for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                used += (k.length + (localStorage.getItem(k) || '').length) * 2;
              }
            } catch (e) { return null; }
            // Проба куском размером с обычную правку: «влезет ли ещё».
            // Просто сравнить с пятью мегабайтами нельзя — предел
            // у браузеров разный.
            let room = true;
            try { localStorage.setItem('cf_probe', 'x'.repeat(50 * 1024)); }
            catch (e) { room = false; }
            try { localStorage.removeItem('cf_probe'); } catch (e) {}
            // Меньше мегабайта показываем в КБ: «0,0 МБ» не говорит ничего.
            const mb = used / 1048576;
            const size = mb >= 1 ? mb.toFixed(1).replace('.', ',') + ' МБ' : Math.round(used / 1024) + ' КБ';
            return { size, room };
          }, []);
          if (!info) return null;
          return (
            <div className="rounded-lg px-4 py-3 mb-2"
                 style={{ background: 'var(--panel-2)', border: '1px solid ' + (info.room ? 'var(--border)' : 'rgba(248,113,113,0.5)') }}>
              <span className="block text-sm font-semibold text-zinc-200">Местная копия на устройстве: {info.size}</span>
              <span className="block text-[11px] leading-relaxed mt-0.5" style={{ color: info.room ? 'var(--muted-2)' : '#f87171' }}>
                {info.room
                  ? 'Место ещё есть. Эта копия — запасная, на случай сбоя облака; браузер отводит под неё несколько мегабайт, и от свободного места на диске это не зависит.'
                  : 'Место кончилось — копия на устройстве больше не обновляется. Сам проект при этом сохраняется в облако. Помогает: перенести фотографии во внешнее хранилище (кнопка «Где хранить фотографии» выше).'}
              </span>
            </div>
          );
        };

        const ConfirmModal = ({ action, onCancel }) => {
            if (!action) return null;
            return (
                <div className="fixed inset-0 z-[400] bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
                    <div className="cf-modal-box glass-panel p-6 rounded-lg max-w-sm w-full text-center border-t border-red-500/50">
                        <div className="w-12 h-12 rounded-full bg-red-500/20 text-red-400 flex items-center justify-center mx-auto mb-4"><Icons.Trash /></div>
                        <h3 className="text-lg font-bold text-white mb-2">{action.title}</h3>
                        {/* pre-line — чтобы в длинных предупреждениях работал абзац */}
                        <p className="text-sm text-zinc-400 mb-6" style={{ whiteSpace: 'pre-line' }}>{action.message}</p>
                        <div className="flex gap-3">
                            <button onClick={onCancel} className="flex-1 py-3 glass-panel hover:bg-white/10 text-zinc-300 rounded-lg text-sm font-bold transition-colors">Отмена</button>
                            <button onClick={() => { action.onConfirm(); onCancel(); }} className="flex-1 py-3 bg-red-600 hover:bg-red-500 text-white rounded-lg text-sm font-bold transition-colors">Подтвердить</button>
                        </div>
                    </div>
                </div>
            );
        };

        const hashPin = async (value) => {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(value));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        };

        const waitForAuthUser = async (timeoutMs = 4000) => {
            const start = Date.now();
            while (Date.now() - start < timeoutMs) {
                if (auth && auth.currentUser) return auth.currentUser;
                await new Promise(r => setTimeout(r, 100));
            }
            return null;
        };

        const WelcomeModal = ({ onComplete }) => {
            const [name, setName] = useState('');
            const [role, setRole] = useState('Оператор-постановщик');
            const [step, setStep] = useState('name');
            const [pin, setPin] = useState('');
            const [showPin, setShowPin] = useState(false);
            const [error, setError] = useState('');
            const [busy, setBusy] = useState(false);

            const pinsRef = () => db.collection('artifacts').doc(appId).collection('public').doc('data').collection('userPins').doc(name.trim().toLowerCase());

            const finish = () => {
                // Не помнить имя неприятно, но не пустить человека
                // в приложение из-за переполненного хранилища — хуже.
                try {
                    localStorage.setItem('cf_user_name', name.trim());
                    localStorage.setItem('cf_user_role', role);
                } catch (e) {}
                onComplete(name.trim(), role);
            };

            const handleNameSubmit = async (e) => {
                e.preventDefault();
                if (!name.trim()) return;
                if (!db || !auth) { finish(); return; }
                setError(''); setBusy(true);
                const authUser = await waitForAuthUser();
                if (!authUser) { finish(); return; }
                try {
                    const doc = await pinsRef().get();
                    setStep(doc.exists ? 'pin-existing' : 'pin-new');
                } catch (err) { finish(); }
                setBusy(false);
            };

            const handlePinSubmit = async (e) => {
                e.preventDefault();
                if (pin.trim().length < 4) { setError('Минимум 4 символа'); return; }
                setError(''); setBusy(true);
                try {
                    const hash = await hashPin(pin.trim());
                    if (step === 'pin-new') {
                        await pinsRef().set({ pinHash: hash, createdAt: Date.now() });
                        finish();
                    } else {
                        const doc = await pinsRef().get();
                        const stored = doc.data();
                        if (stored && stored.pinHash === hash) { finish(); }
                        else { setBusy(false); setError('Неверный PIN. Попробуйте ещё раз или вернитесь и выберите другое имя.'); }
                    }
                } catch (err) { setBusy(false); setError('Ошибка сети, попробуйте ещё раз.'); }
            };

            const backToName = () => { setStep('name'); setPin(''); setError(''); };

            return (
                <div className="fixed inset-0 bg-black/85 backdrop-blur-lg flex items-center justify-center z-[500] p-4">
                    <div className="cf-modal-box glass-panel p-8 rounded-lg w-full max-w-sm">
                        <div className="flex justify-center mb-4 text-indigo-400"><Icons.User /></div>
                        <h2 className="text-2xl font-extrabold text-white mb-2 text-center">Профиль Оператора</h2>
                        {step === 'name' && (
                          <>
                            <p className="text-zinc-400 text-xs text-center mb-6">Введите имя и роль в департаменте для чата команды.</p>
                            <form onSubmit={handleNameSubmit} className="space-y-4">
                                <div>
                                    <label className="text-xs text-zinc-400 mb-1 block ml-1">Имя и Фамилия</label>
                                    <input autoFocus type="text" value={name} onChange={e => setName(e.target.value)} placeholder="Иван Иванов" className="w-full glass-input rounded-lg px-4 py-3 text-sm transition-colors" required />
                                </div>
                                <div>
                                    <label className="text-xs text-zinc-400 mb-1 block ml-1">Роль в съемочной группе</label>
                                    <select value={role} onChange={e => setRole(e.target.value)} className="w-full glass-input rounded-lg px-4 py-3 text-sm transition-colors appearance-none bg-zinc-900">
                                        <option value="Оператор-постановщик">Оператор-постановщик (DoP)</option>
                                        <option value="Гаффер">Гаффер (Gaffer)</option>
                                        <option value="Режиссер">Режиссер-постановщик</option>
                                        <option value="Продюсер">Продюсер</option>
                                        <option value="Художник-постановщик">Художник-постановщик</option>
                                        <option value="Второй режиссер">Второй режиссер (1st AD)</option>
                                        <option value="Специалист">Механик / Стедикамист</option>
                                    </select>
                                </div>
                                <button type="submit" disabled={busy} className="w-full bg-indigo-500 hover:bg-indigo-400 disabled:opacity-60 text-[#1a1918] font-semibold py-3 rounded-lg mt-4 transition-all">{busy ? 'Проверка…' : 'Продолжить'}</button>
                            </form>
                          </>
                        )}
                        {(step === 'pin-new' || step === 'pin-existing') && (
                          <>
                            <p className="text-zinc-400 text-xs text-center mb-6">
                              {step === 'pin-new'
                                ? <>Имя «{name.trim()}» свободно. Придумайте PIN — он защитит имя от входа посторонних.</>
                                : <>Имя «{name.trim()}» уже используется. Введите PIN, чтобы продолжить под этим именем.</>}
                            </p>
                            <form onSubmit={handlePinSubmit} className="space-y-4">
                                <div>
                                    <label className="text-xs text-zinc-400 mb-1 block ml-1">PIN (мин. 4 символа)</label>
                                    <div className="relative">
                                        <input autoFocus type={showPin ? "text" : "password"} value={pin} onChange={e => setPin(e.target.value)} autoComplete="off" data-lpignore="true" data-1p-ignore="true" name="cf-profile-pin" className="w-full glass-input rounded-lg px-4 py-3 pr-12 text-sm font-mono" required />
                                        <button type="button" onClick={() => setShowPin(v => !v)} className="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-zinc-200 text-xs font-semibold px-2 py-1 rounded-md hover:bg-white/5 transition-colors">{showPin ? "Скрыть" : "Показать"}</button>
                                    </div>
                                </div>
                                {error && <p className="text-xs text-red-400">{error}</p>}
                                <button type="submit" disabled={busy} className="w-full bg-indigo-500 hover:bg-indigo-400 disabled:opacity-60 text-[#1a1918] font-semibold py-3 rounded-lg transition-all">{busy ? 'Проверка…' : (step === 'pin-new' ? 'Создать и продолжить' : 'Войти')}</button>
                                <button type="button" onClick={backToName} className="w-full text-zinc-500 hover:text-zinc-300 text-xs font-semibold py-1 transition-colors">← Изменить имя</button>
                            </form>
                          </>
                        )}
                    </div>
                </div>
            );
        };

        const DrawingModal = ({ onSave, onClose }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [color, setColor] = useState('#ffffff');
            const [brushSize, setBrushSize] = useState(4);
            const [tool, setTool] = useState('brush'); 
            const lastPoint = useRef({ x: 0, y: 0, pressure: 0.5, time: 0 });
          // Идёт ли сейчас штрих обратным концом стилуса
          const penErase = useRef(false);

            useEffect(() => {
                const canvas = canvasRef.current;
                if(canvas) {
                    canvas.width = 1920; canvas.height = 1080;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#242322'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                }
            }, []);

            const getPos = (e) => {
                const canvas = canvasRef.current; const rect = canvas.getBoundingClientRect();
                return { x: (e.clientX - rect.left) * (canvas.width / rect.width), y: (e.clientY - rect.top) * (canvas.height / rect.height), pressure: e.pressure !== undefined && e.pressure !== 0 ? e.pressure : 0.5 };
            };

            const startDrawing = (e) => {
                e.target.setPointerCapture(e.pointerId);
                // Обратный конец стилуса = ластик на один штрих. Браузер
                // сообщает о нём отдельной кнопкой (button 5 / бит 32).
                penErase.current = e.pointerType === 'pen' && (e.button === 5 || (e.buttons & 32) === 32);
                setIsDrawing(true); const pos = getPos(e); lastPoint.current = { ...pos, time: Date.now() };
                const ctx = canvasRef.current.getContext('2d'); ctx.beginPath();
                const baseBrush = brushSize * (canvasRef.current.width / 800);
                ctx.arc(pos.x, pos.y, (baseBrush * (0.5 + pos.pressure)) / 2, 0, Math.PI * 2);
                ctx.fillStyle = (tool === 'eraser' || penErase.current) ? '#242322' : color; ctx.fill();
            };

            const draw = (e) => {
                if (!isDrawing) return; const pos = getPos(e); const ctx = canvasRef.current.getContext('2d');
                const cT = Date.now(); const dist = Math.hypot(pos.x - lastPoint.current.x, pos.y - lastPoint.current.y);
                let press = pos.pressure;
                if (e.pointerType === 'touch' || e.pointerType === 'mouse') { press = Math.max(0.1, 1 - (dist / (cT - lastPoint.current.time || 1)) * 0.15); }

                ctx.beginPath(); ctx.moveTo(lastPoint.current.x, lastPoint.current.y);
                ctx.quadraticCurveTo(lastPoint.current.x, lastPoint.current.y, (lastPoint.current.x + pos.x) / 2, (lastPoint.current.y + pos.y) / 2);
                ctx.lineTo(pos.x, pos.y);
                
                ctx.strokeStyle = (tool === 'eraser' || penErase.current) ? '#242322' : color;
                const baseBrush = brushSize * (canvasRef.current.width / 800);
                ctx.lineWidth = baseBrush * (0.5 + press * 1.5); ctx.stroke();
                lastPoint.current = { ...pos, time: cT };
            };

            const stopDrawing = (e) => {
                if (e.target.hasPointerCapture && e.target.hasPointerCapture(e.pointerId)) {
                    e.target.releasePointerCapture(e.pointerId);
                }
                penErase.current = false;
                setIsDrawing(false);
            };

            return (
                <div className="fixed inset-0 z-[300] bg-[#1a1918]/95 backdrop-blur-xl flex flex-col">
                    <div className="flex justify-between items-center p-4 glass-panel border-b-0 shrink-0">
                        <div className="flex items-center gap-4">
                            <span className="text-white font-bold text-sm flex items-center gap-2"><Icons.Pen /> Модуль быстрого скетча</span>
                            <div className="flex gap-1 bg-black/50 p-1 rounded-lg">
                                <button onClick={() => setTool('brush')} className={`px-3 py-1 text-xs rounded flex items-center gap-1 ${tool === 'brush' ? 'bg-indigo-500 text-[#1a1918]' : 'text-zinc-400'}`}><Icons.Pen /> Кисть</button>
                                <button onClick={() => setTool('eraser')} className={`px-3 py-1 text-xs rounded flex items-center gap-1 ${tool === 'eraser' ? 'bg-zinc-700 text-white' : 'text-zinc-400'}`}><Icons.Eraser /> Ластик</button>
                            </div>
                            <input type="range" min="1" max="20" value={brushSize} onChange={e => setBrushSize(Number(e.target.value))} className="w-24 accent-indigo-500" />
                            <div className="gap-1 ml-4 hidden sm:flex">
                                {['#ffffff', '#f87171', '#60a5fa', '#34d399', '#facc15'].map(c => (
                                    <button key={c} onClick={() => {setColor(c); setTool('brush');}} style={{background: c}} className={`w-6 h-6 rounded-full border-2 ${color === c && tool === 'brush' ? 'border-white scale-110' : 'border-transparent hover:scale-110'} transition-transform`} />
                                ))}
                            </div>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => { const ctx = canvasRef.current.getContext('2d'); ctx.fillStyle = '#242322'; ctx.fillRect(0, 0, canvasRef.current.width, canvasRef.current.height); }} className="px-4 py-2 bg-zinc-800 text-zinc-300 text-xs rounded-lg hover:bg-zinc-700 flex items-center gap-1"><Icons.Trash /> Очистить</button>
                            <button onClick={() => onSave(canvasRef.current.toDataURL('image/jpeg', 0.8))} className="px-4 py-2 bg-indigo-500 text-[#1a1918] text-xs rounded-lg hover:bg-indigo-400 font-bold">Сохранить</button>
                            <button onClick={onClose} className="px-4 py-2 bg-white/10 text-white text-xs rounded-lg hover:bg-white/20">Отмена</button>
                        </div>
                    </div>
                    <div className="flex-1 p-4 md:p-12 flex justify-center items-center overflow-hidden">
                        <div className="w-full max-w-5xl aspect-video relative rounded-lg overflow-hidden border border-zinc-800">
                            <canvas ref={canvasRef} onPointerDown={startDrawing} onPointerMove={draw} onPointerUp={stopDrawing} onPointerCancel={stopDrawing} className="absolute inset-0 w-full h-full cursor-crosshair touch-none" />
                        </div>
                    </div>
                </div>
            );
        };

        // Показ панорамы: кадр натягивается обратно на сферу.
        // Сделано на «голом» WebGL, а не на готовой библиотеке, НАМЕРЕННО.
        // three.js в репозитории есть — им пользуется игра, — но лежит он
        // в папке game, которую service worker не кэширует, то есть без
        // интернета панорама просто не открылась бы. А ради площадки без
        // связи всё и затевалось.
        //
        // Геометрии здесь нет вовсе: рисуется один прямоугольник на весь
        // экран, и для каждой точки считается, куда смотрит луч. Это и
        // проще сферы из треугольников, и точнее — у сферы на полюсах
        // видны грани, а тут их взяться неоткуда.
        const PANO_VS = 'attribute vec2 p;varying vec2 v;void main(){v=p;gl_Position=vec4(p,0.0,1.0);}';
        const PANO_FS = [
          'precision highp float;',
          'varying vec2 v;',
          'uniform sampler2D tex;',
          'uniform float aspect;',   // ширина холста к высоте
          'uniform float tanHalf;',  // тангенс половины угла обзора
          'uniform mat3 rot;',
          'void main(){',
          '  vec3 dir = normalize(vec3(v.x*aspect*tanHalf, v.y*tanHalf, -1.0));',
          '  vec3 d = rot*dir;',
          '  float lon = atan(d.x, -d.z);',
          '  float lat = asin(clamp(d.y,-1.0,1.0));',
          // 0.15915494 = 1/2π, 0.31830989 = 1/π
          '  gl_FragColor = texture2D(tex, vec2(lon*0.15915494+0.5, 0.5-lat*0.31830989));',
          '}'
        ].join('\n');

        const PANO_FOV_MIN = 28, PANO_FOV_MAX = 100;

        const PanoView = ({ src, maxW, onFail, onTap }) => {
          const canvasRef = useRef(null);
          const glRef = useRef(null);
          const locRef = useRef(null);
          const viewRef = useRef({ yaw: 0, pitch: 0, fov: 78, vy: 0, vp: 0 });
          const ptrRef = useRef(new Map());
          const pinchRef = useRef(0);
          const tapRef = useRef({ x: 0, y: 0, moved: true });
          const rafRef = useRef(0);
          const dirtyRef = useRef(true);
          const [broken, setBroken] = useState(false);
          const [loading, setLoading] = useState(true);

          // Рисуем ПО НАДОБНОСТИ, а не каждый кадр: панорама висит на экране
          // подолгу, и крутить пустой цикл шестьдесят раз в секунду — это
          // просто съеденная батарея на площадке.
          const draw = () => {
            const gl = glRef.current, cv = canvasRef.current, loc = locRef.current;
            if (!gl || !cv || !loc) return;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const w = Math.max(1, Math.round(cv.clientWidth * dpr));
            const h = Math.max(1, Math.round(cv.clientHeight * dpr));
            if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
            gl.viewport(0, 0, w, h);
            const v = viewRef.current;
            const cy = Math.cos(v.yaw), sy = Math.sin(v.yaw);
            const cp = Math.cos(v.pitch), sp = Math.sin(v.pitch);
            // Поворот «рыскание, затем тангаж», по столбцам — так его ждёт WebGL
            gl.uniformMatrix3fv(loc.rot, false, new Float32Array([
              cy, 0, -sy,
              sy * sp, cp, cy * sp,
              sy * cp, -sp, cy * cp
            ]));
            gl.uniform1f(loc.aspect, w / h);
            gl.uniform1f(loc.tanHalf, Math.tan(v.fov * Math.PI / 360));
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          };

          const tick = () => {
            rafRef.current = 0;
            const v = viewRef.current;
            let moving = false;
            // Лёгкий выбег после отпускания: без него панорама
            // останавливается как вкопанная и кажется тяжёлой.
            if (ptrRef.current.size === 0 && (Math.abs(v.vy) > 2e-5 || Math.abs(v.vp) > 2e-5)) {
              v.yaw += v.vy;
              v.pitch = Math.max(-1.55, Math.min(1.55, v.pitch + v.vp));
              v.vy *= 0.9; v.vp *= 0.9;
              moving = true;
            }
            if (dirtyRef.current || moving) { dirtyRef.current = false; draw(); }
            if (moving) kick();
          };
          const kick = () => {
            dirtyRef.current = true;
            if (!rafRef.current) rafRef.current = requestAnimationFrame(tick);
          };

          // Заводим WebGL один раз на всё время показа
          useEffect(() => {
            const cv = canvasRef.current;
            if (!cv) return;
            const gl = cv.getContext('webgl', { alpha: false, antialias: false, preserveDrawingBuffer: false })
                    || cv.getContext('experimental-webgl');
            if (!gl) { setBroken(true); if (onFail) onFail(); return; }
            const mk = (type, code) => {
              const s = gl.createShader(type);
              gl.shaderSource(s, code); gl.compileShader(s);
              if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
                console.warn('Панорама, шейдер:', gl.getShaderInfoLog(s)); return null;
              }
              return s;
            };
            const vs = mk(gl.VERTEX_SHADER, PANO_VS), fs = mk(gl.FRAGMENT_SHADER, PANO_FS);
            if (!vs || !fs) { setBroken(true); if (onFail) onFail(); return; }
            const prog = gl.createProgram();
            gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
            if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { setBroken(true); if (onFail) onFail(); return; }
            gl.useProgram(prog);
            const buf = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buf);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
            const ap = gl.getAttribLocation(prog, 'p');
            gl.enableVertexAttribArray(ap);
            gl.vertexAttribPointer(ap, 2, gl.FLOAT, false, 0, 0);
            const tex = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, tex);
            // По горизонтали текстура заворачивается — иначе на стыке
            // панорамы стоит щель. По вертикали, наоборот, зажимаем:
            // над головой и под ногами заворачивать нечего.
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            gl.uniform1i(gl.getUniformLocation(prog, 'tex'), 0);
            glRef.current = gl;
            locRef.current = {
              rot: gl.getUniformLocation(prog, 'rot'),
              aspect: gl.getUniformLocation(prog, 'aspect'),
              tanHalf: gl.getUniformLocation(prog, 'tanHalf')
            };
            const onResize = () => kick();
            window.addEventListener('resize', onResize);
            kick();
            return () => {
              window.removeEventListener('resize', onResize);
              if (rafRef.current) cancelAnimationFrame(rafRef.current);
              rafRef.current = 0;
              try {
                gl.deleteTexture(tex); gl.deleteBuffer(buf); gl.deleteProgram(prog);
                const lose = gl.getExtension('WEBGL_lose_context');
                if (lose) lose.loseContext();
              } catch (e) {}
              glRef.current = null; locRef.current = null;
            };
          }, []);

          // Картинка приезжает и подменяется прямо на ходу: сначала
          // панорамное превью из проекта, следом — полный размер из облака.
          useEffect(() => {
            const gl = glRef.current;
            if (!gl || !src) return;
            let alive = true;
            setLoading(true);
            (async () => {
              try {
                const cap = Math.min(potCeil(maxW || PANO_VIEW_W), gl.getParameter(gl.MAX_TEXTURE_SIZE), PANO_VIEW_W);
                const bmp = await decodeScaled(src, cap, cap / 2);
                if (!alive) { if (bmp.close) bmp.close(); return; }
                gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, bmp);
                if (bmp.close) bmp.close();
                setLoading(false);
                kick();
              } catch (e) {
                console.warn('Панорама: не удалось показать кадр', e);
                if (alive) { setLoading(false); setBroken(true); if (onFail) onFail(); }
              }
            })();
            return () => { alive = false; };
          }, [src, maxW]);

          const angPerPx = () => (viewRef.current.fov * Math.PI / 180) / Math.max(1, canvasRef.current ? canvasRef.current.clientHeight : 1);

          const onDown = (e) => {
            e.currentTarget.setPointerCapture(e.pointerId);
            ptrRef.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
            const v = viewRef.current; v.vy = 0; v.vp = 0;
            pinchRef.current = 0;
            // Второй палец не может быть «касанием»: иначе конец щипка
            // переключал бы подписи, хотя человек просто приближал кадр.
            tapRef.current = { x: e.clientX, y: e.clientY, moved: ptrRef.current.size > 1 };
          };
          const onMove = (e) => {
            const pts = ptrRef.current;
            if (!pts.has(e.pointerId)) return;
            const prev = pts.get(e.pointerId);
            pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
            const t = tapRef.current;
            if (Math.hypot(e.clientX - t.x, e.clientY - t.y) > 8) t.moved = true;
            const v = viewRef.current;
            if (pts.size >= 2) {
              // Щипок двумя пальцами приближает — на планшете это
              // единственный привычный способ, колеса там нет.
              const [a, b] = [...pts.values()];
              const d = Math.hypot(a.x - b.x, a.y - b.y);
              if (pinchRef.current) {
                v.fov = Math.max(PANO_FOV_MIN, Math.min(PANO_FOV_MAX, v.fov * (pinchRef.current / Math.max(1, d))));
              }
              pinchRef.current = d;
              kick();
              return;
            }
            const k = angPerPx();
            const dx = (e.clientX - prev.x) * k, dy = (e.clientY - prev.y) * k;
            // Кадр держится за палец: ведём вправо — картинка едет вправо,
            // то есть смотрим левее. Знак тут ровно тот, при котором
            // панорама ощущается взятой рукой, а не проматываемой мимо.
            v.yaw += dx; v.pitch = Math.max(-1.55, Math.min(1.55, v.pitch + dy));
            v.vy = dx; v.vp = dy;
            kick();
          };
          const onUp = (e) => {
            try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (err) {}
            const было = ptrRef.current.size;
            ptrRef.current.delete(e.pointerId);
            if (ptrRef.current.size < 2) pinchRef.current = 0;
            // Касание без ведения — это «покажи/спрячь подписи», то же
            // самое, что и на обычной фотографии. Без этого спрятанную
            // полосу на панораме было бы нечем вернуть.
            if (было === 1 && !tapRef.current.moved && onTap) onTap();
            kick();
          };
          const onWheel = (e) => {
            const v = viewRef.current;
            v.fov = Math.max(PANO_FOV_MIN, Math.min(PANO_FOV_MAX, v.fov * (e.deltaY > 0 ? 1.1 : 1 / 1.1)));
            kick();
          };

          if (broken) {
            return (
              <img src={src} className="max-w-full max-h-full object-contain rounded-lg"
                   onClick={(e) => e.stopPropagation()} />
            );
          }
          return (
            <div className="relative w-full h-full" onClick={(e) => e.stopPropagation()}>
              <canvas ref={canvasRef}
                      onPointerDown={onDown} onPointerMove={onMove}
                      onPointerUp={onUp} onPointerCancel={onUp} onWheel={onWheel}
                      className="w-full h-full rounded-lg touch-none cursor-grab active:cursor-grabbing"
                      style={{ display: 'block' }} />
              {loading && (
                <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                  <span className="glass-panel rounded-full px-4 py-2 text-xs font-semibold text-zinc-300">Разворачиваю панораму...</span>
                </div>
              )}
            </div>
          );
        };

        // Приближение обычной фотографии в полноэкранном просмотре.
        // Панорама умела это с самого начала (щипок меняет угол обзора),
        // а обычный кадр открывался «как есть»: рассмотреть на телефоне
        // фактуру стены или номер прибора в углу было нечем.
        //
        // Двигаем НЕ через состояние React, а прямо стилем узла: за один
        // щипок прилетают десятки событий, и перерисовывать на каждое
        // весь просмотр вместе со списком тегов незачем.
        const ZOOM_MAX = 6;
        const ZOOM_TAP_MS = 300;

        const ZoomImage = ({ src, onTap, onError }) => {
          const boxRef = useRef(null);
          const imgRef = useRef(null);
          const stRef = useRef({ s: 1, x: 0, y: 0 });
          const ptrRef = useRef(new Map());
          const pinchRef = useRef(null);
          const tapRef = useRef({ t: 0, x: 0, y: 0, moved: false, timer: 0 });
          const [zoomed, setZoomed] = useState(false);

          const apply = () => {
            const im = imgRef.current;
            if (!im) return;
            const st = stRef.current;
            im.style.transform = 'translate(' + st.x + 'px,' + st.y + 'px) scale(' + st.s + ')';
          };
          // Не даём утащить кадр за собственные края: иначе фотография
          // уезжает с экрана, и человек не понимает, куда она делась
          // и как её вернуть.
          const clamp = () => {
            const im = imgRef.current, box = boxRef.current;
            if (!im || !box) return;
            const st = stRef.current;
            const mx = Math.max(0, (im.offsetWidth * st.s - box.clientWidth) / 2);
            const my = Math.max(0, (im.offsetHeight * st.s - box.clientHeight) / 2);
            st.x = Math.max(-mx, Math.min(mx, st.x));
            st.y = Math.max(-my, Math.min(my, st.y));
          };
          // Приближаем ВОКРУГ ТОЧКИ ПОД ПАЛЬЦАМИ, а не вокруг середины
          // кадра: иначе то, что рассматриваешь, уезжает из-под пальца.
          const setScale = (ns, cx, cy) => {
            const box = boxRef.current;
            if (!box) return;
            const st = stRef.current;
            ns = Math.max(1, Math.min(ZOOM_MAX, ns));
            const r = box.getBoundingClientRect();
            const ox = cx - (r.left + r.width / 2), oy = cy - (r.top + r.height / 2);
            const k = ns / st.s;
            st.x = ox - (ox - st.x) * k;
            st.y = oy - (oy - st.y) * k;
            st.s = ns;
            if (ns <= 1.001) { st.x = 0; st.y = 0; }
            clamp(); apply();
            setZoomed(ns > 1.01);
          };

          useEffect(() => {
            const onResize = () => { clamp(); apply(); };
            window.addEventListener('resize', onResize);
            return () => { window.removeEventListener('resize', onResize); clearTimeout(tapRef.current.timer); };
          }, []);

          const handleTap = (x, y) => {
            const t = tapRef.current, now = Date.now();
            if (now - t.t < ZOOM_TAP_MS) {
              // Двойное касание приближает и возвращает обратно — так это
              // работает в любой смотрелке, и палец тянется туда сам.
              clearTimeout(t.timer); t.t = 0;
              setScale(stRef.current.s > 1.01 ? 1 : 2.5, x, y);
              return;
            }
            t.t = now;
            // Одиночное касание ждёт: вдруг это первое из двойного.
            t.timer = setTimeout(() => { t.t = 0; if (onTap) onTap(); }, ZOOM_TAP_MS);
          };

          const onDown = (e) => {
            e.currentTarget.setPointerCapture(e.pointerId);
            ptrRef.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (ptrRef.current.size === 2) {
              const [a, b] = [...ptrRef.current.values()];
              pinchRef.current = { d: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)), s: stRef.current.s };
            }
            const t = tapRef.current;
            // Второй палец — это щипок, а не касание (см. PanoView)
            t.moved = ptrRef.current.size > 1; t.x = e.clientX; t.y = e.clientY;
          };
          const onMove = (e) => {
            const pts = ptrRef.current;
            if (!pts.has(e.pointerId)) return;
            const prev = pts.get(e.pointerId);
            pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
            const t = tapRef.current;
            if (Math.hypot(e.clientX - t.x, e.clientY - t.y) > 8) t.moved = true;
            if (pts.size >= 2 && pinchRef.current) {
              const [a, b] = [...pts.values()];
              const d = Math.hypot(a.x - b.x, a.y - b.y);
              setScale(pinchRef.current.s * (d / pinchRef.current.d), (a.x + b.x) / 2, (a.y + b.y) / 2);
              return;
            }
            // Пока кадр не приближен, тянуть нечего: он и так виден целиком.
            if (stRef.current.s > 1.01) {
              stRef.current.x += e.clientX - prev.x;
              stRef.current.y += e.clientY - prev.y;
              clamp(); apply();
            }
          };
          const onUp = (e) => {
            try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (err) {}
            const было = ptrRef.current.size;
            ptrRef.current.delete(e.pointerId);
            if (ptrRef.current.size < 2) pinchRef.current = null;
            if (было === 1 && !tapRef.current.moved) handleTap(e.clientX, e.clientY);
          };
          const onWheel = (e) => setScale(stRef.current.s * (e.deltaY > 0 ? 1 / 1.15 : 1.15), e.clientX, e.clientY);

          return (
            <div ref={boxRef}
                 className="relative w-full h-full flex items-center justify-center overflow-hidden"
                 onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp}
                 onWheel={onWheel}
                 style={{ touchAction: 'none', cursor: zoomed ? 'grab' : 'zoom-in' }}>
              <img ref={imgRef} src={src} draggable="false" onError={onError}
                   className="max-w-full max-h-full object-contain rounded-lg select-none"
                   style={{ transformOrigin: 'center center', willChange: 'transform' }} />
            </div>
          );
        };

        const Lightbox = ({ refs, initialId, onClose, scopeLabel, hints, onAddTag, onRemoveTag, onSetPano }) => {
            const [currentId, setCurrentId] = useState(initialId);
            const currentIndex = refs.findIndex(r => r.id === currentId);
            const currentRef = refs[currentIndex];
            // Окошко тегов: размечать удобнее всего именно здесь, где кадр
            // виден целиком. Показано оно или нет — помним, чтобы не включать
            // заново на каждом кадре.
            const [tagsOpen, setTagsOpen] = useState(() => {
                try { return localStorage.getItem('cf_lb_tags') === '1'; } catch (e) { return false; }
            });
            const toggleTags = (v) => {
                setTagsOpen(v);
                try { localStorage.setItem('cf_lb_tags', v ? '1' : '0'); } catch (e) {}
            };

            // Стрелки листают, Esc закрывает — на компьютере так удобнее мыши.
            useEffect(() => {
                const onKey = (e) => {
                    // Пока набираем тег, стрелки должны двигать курсор в поле,
                    // а не листать кадры. Escape в поле — выход из поля;
                    // второй Escape закроет просмотр, как и раньше.
                    const t = e.target;
                    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) {
                        if (e.key === 'Escape') t.blur();
                        return;
                    }
                    if (e.key === 'Escape') { onClose(); return; }
                    if (e.key === 'ArrowLeft' && currentIndex > 0) setCurrentId(refs[currentIndex - 1].id);
                    if (e.key === 'ArrowRight' && currentIndex < refs.length - 1) setCurrentId(refs[currentIndex + 1].id);
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [currentIndex, refs, onClose]);

            // Полный размер лежит в облаке, а в проекте — только превью.
            // Показываем сразу превью (оно уже на устройстве), а следом
            // подменяем оригиналом, когда тот доедет: пустой экран в
            // ожидании сети хуже, чем мягковатая картинка на секунду.
            //
            // «Когда доедет» надо понимать буквально. Раньше адрес облака
            // подставлялся в картинку СРАЗУ, как только становился известен,
            // — а браузер рисует загружаемый кадр сверху вниз по мере
            // прихода байтов. На телефоне по мобильной связи это и давало
            // ту самую полосу: узкая лента кадра, а под ней пустота, и
            // так на много секунд. Причём превью, которое уже лежит на
            // устройстве, в этот момент было отброшено.
            // Поэтому оригинал сначала загружаем В СТОРОНЕ (`new Image`)
            // и показываем только целиком загруженный.
            // У Яндекс.Диска публичная ссылка ведёт на страницу, а не на
            // файл, поэтому настоящий адрес спрашивается отдельно — этим
            // и занимается cloudDirectUrl.
            const [bigUrl, setBigUrl] = useState('');
            useEffect(() => {
                setBigUrl('');
                if (!currentRef || !currentRef.full) return;
                let alive = true;
                cloudDirectUrl(currentRef).then(u => { if (alive && u) setBigUrl(u); });
                return () => { alive = false; };
            }, [currentRef && currentRef.id, currentRef && currentRef.full]);

            // Загруженный ЦЕЛИКОМ оригинал. Пока его нет, на экране остаётся
            // превью из проекта — целая картинка, пусть и помягче.
            const [bigReady, setBigReady] = useState('');
            useEffect(() => {
                setBigReady('');
                if (!bigUrl) return;
                let alive = true;
                const pre = new Image();
                pre.onload = () => { if (alive) setBigReady(bigUrl); };
                // Не дало — молча остаёмся на превью, оно и так на экране.
                pre.onerror = () => { if (alive) setBigUrl(''); };
                pre.src = bigUrl;
                return () => { alive = false; pre.onload = null; pre.onerror = null; };
            }, [bigUrl]);

            // Полный размер панорамы приходится сначала СКАЧАТЬ файлом,
            // а не отдать адресом прямо в картинку. Причина: кадр уходит
            // в видеокарту, а туда чужие изображения пускают только с
            // разрешения самого облака. Скачанный файл считается своим —
            // и вопрос снимается. Не дало скачать (облако не разрешает
            // читать файлы чужому сайту) — не беда: остаётся панорамное
            // превью из проекта, ради него оно и лежит рядом.
            const [panoFull, setPanoFull] = useState('');
            useEffect(() => {
                setPanoFull('');
                if (!currentRef || !currentRef.pano || !bigUrl) return;
                let alive = true, made = '';
                (async () => {
                    try {
                        const res = await fetch(bigUrl);
                        if (!res.ok) return;
                        const blob = await res.blob();
                        if (!alive) return;
                        made = URL.createObjectURL(blob);
                        setPanoFull(made);
                    } catch (e) {
                        console.warn('Панорама: полный размер не забрать, показываю превью', e);
                    }
                })();
                return () => {
                    alive = false;
                    // С запасом: показ мог ещё не дочитать файл
                    if (made) setTimeout(() => URL.revokeObjectURL(made), 10000);
                };
            }, [currentRef && currentRef.id, currentRef && currentRef.pano, bigUrl]);

            // Подписи и стрелки лежат ПОВЕРХ кадра и на телефоне закрывают
            // его низ. Убрать их совсем нельзя — по счётчику понимают, какой
            // это кадр из скольких, а по стрелкам листают. Поэтому они
            // уходят сами через пару секунд и возвращаются по касанию:
            // так устроена любая смотрелка фотографий, палец уже знает.
            // На компьютере не прячем вовсе — там мышь и большой экран,
            // прятать не от чего, а исчезающие кнопки только путают.
            // Крестик закрытия НЕ прячется никогда: «нечем закрыть» —
            // ровно та беда, которую мы только что чинили в окнах.
            const [chromeOn, setChromeOn] = useState(true);
            const chromeTimer = useRef(0);
            const touchUI = useRef(typeof matchMedia === 'function' && matchMedia('(hover: none)').matches);
            const showChrome = () => {
                clearTimeout(chromeTimer.current);
                setChromeOn(true);
                // Пока открыто окошко тегов, прятать нечего: человек размечает кадр
                if (touchUI.current && !tagsOpen) chromeTimer.current = setTimeout(() => setChromeOn(false), 2800);
            };
            const toggleChrome = () => {
                if (!touchUI.current) return;
                if (chromeOn) { clearTimeout(chromeTimer.current); setChromeOn(false); }
                else showChrome();
            };
            useEffect(() => {
                showChrome();
                return () => clearTimeout(chromeTimer.current);
            }, [currentId, tagsOpen]);

            if (!currentRef) return null;

            const isPano = !!currentRef.pano;
            // Скрытое не должно ловить нажатия, иначе невидимая стрелка
            // листает кадр под пальцем.
            const chromeCls = 'transition-opacity duration-200 ' + (chromeOn ? 'opacity-100' : 'opacity-0 pointer-events-none');
            const panoSrc = panoFull || currentRef.panoUrl || currentRef.url;
            const panoMax = panoFull ? PANO_VIEW_W : PANO_THUMB_W;

            return (
                <div className="fixed inset-0 z-[350] bg-[#1a1918]/95 backdrop-blur-md flex flex-col justify-center items-center p-4">
                    <button onClick={onClose} className="absolute top-6 right-6 text-white bg-white/10 hover:bg-white/20 w-10 h-10 rounded-full flex items-center justify-center text-lg z-10 transition-colors border border-white/10">✕</button>
                    {/* Метка «это панорама» — она же переключатель.
                        Распознавание ошибается в обе стороны, и починить
                        это должно быть можно прямо здесь, где кадр виден. */}
                    {onSetPano && (
                        <button onClick={() => onSetPano(currentRef, !isPano)}
                                title={isPano ? 'Показывать обычным плоским кадром' : 'Это панорама 360° — развернуть на сферу'}
                                className={'cf-edit-only absolute top-6 left-6 z-20 rounded-full px-3 py-1.5 ' + chromeCls}
                                style={isPano
                                  ? { background: 'var(--accent)', color: 'var(--bg)', fontSize: 11.5, fontWeight: 700 }
                                  : { background: 'rgba(255,255,255,.08)', color: 'var(--muted-2)', border: '1px solid var(--border)', fontSize: 11.5, fontWeight: 700 }}>
                            360°
                        </button>
                    )}
                    <div className="relative w-full h-full flex justify-center items-center max-w-[95vw] max-h-[95vh]">
                        {currentIndex > 0 && ( <button onClick={(e) => { e.stopPropagation(); setCurrentId(refs[currentIndex - 1].id); }} className={'absolute left-2 md:left-8 p-4 bg-black/50 rounded-full text-white hover:bg-indigo-600 z-10 ' + chromeCls}><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m15 18-6-6 6-6"/></svg></button> )}
                        {isPano ? (
                            <PanoView key={currentRef.id} src={panoSrc} maxW={panoMax} onTap={toggleChrome} />
                        ) : (
                            <ZoomImage key={currentRef.id} src={bigReady || currentRef.url} onTap={toggleChrome}
                                       onError={() => { if (bigReady) { setBigReady(''); setBigUrl(''); } }} />
                        )}
                        {currentIndex < refs.length - 1 && ( <button onClick={(e) => { e.stopPropagation(); setCurrentId(refs[currentIndex + 1].id); }} className={'absolute right-2 md:right-8 p-4 bg-black/50 rounded-full text-white hover:bg-indigo-600 z-10 ' + chromeCls}><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m9 18 6-6-6-6"/></svg></button> )}
                    </div>
                    {/* Теги кадра — окошком в левом нижнем углу. Поднято над
                        нижней полосой со счётчиком, чтобы не налезать на неё. */}
                    {onAddTag && (tagsOpen ? (
                        <div className={'cf-lb-tags absolute glass-panel rounded-lg z-20 border-t border-white/10 ' + chromeCls}
                             style={{ left: 16, bottom: 76, padding: 8, width: 'max-content',
                                      minWidth: 150, maxWidth: 'min(320px, calc(100vw - 32px))' }}>
                            {/* Поле ввода СВЕРХУ, теги под ним. Окошко стоит внизу
                                экрана, поэтому список подсказок разворачивается
                                вверх — и, стой поле последним, он закрывал бы
                                собой сами теги. Заголовка нет намеренно: в
                                полноэкранном режиме место дороже подписи. */}
                            <button onClick={() => toggleTags(false)} title="Спрятать теги"
                                    className="absolute w-5 h-5 flex items-center justify-center rounded text-zinc-600 hover:text-white hover:bg-white/10"
                                    style={{ top: 4, right: 4, fontSize: 10 }}>✕</button>
                            <div className="cf-edit-only" style={{ paddingRight: 22 }}>
                                <TagInput key={currentRef.id} ref_={currentRef} hints={hints} onAdd={onAddTag} narrow />
                            </div>
                            <div className="flex flex-wrap gap-1 items-center mt-1.5">
                                {(currentRef.tags || []).length === 0 && (
                                    <span className="cf-meta">Без тегов</span>
                                )}
                                {(currentRef.tags || []).map(t => (
                                    <span key={t} className="bg-indigo-900/40 text-indigo-200 rounded flex items-center gap-0.5 whitespace-nowrap"
                                          style={{ fontSize: 10.5, padding: '1px 5px', lineHeight: 1.45 }}>
                                        {t}
                                        <button onClick={() => onRemoveTag(currentRef, t)} title="Убрать тег"
                                                className="cf-edit-only hover:text-white" style={{ fontSize: 9, opacity: .75 }}>✕</button>
                                    </span>
                                ))}
                            </div>
                        </div>
                    ) : (
                        <button onClick={() => toggleTags(true)} title="Показать теги кадра"
                                className={'absolute glass-panel rounded-full px-3 py-1.5 z-20 flex items-center gap-1.5 text-zinc-400 hover:text-white ' + chromeCls}
                                style={{ left: 16, bottom: 76 }}>
                            <Icons.Tag/>
                            <span style={{ fontSize: 11, fontWeight: 600 }}>
                                {(currentRef.tags || []).length || ''}
                            </span>
                        </button>
                    ))}

                    <div className={'absolute bottom-4 md:bottom-6 flex items-center gap-1.5 md:gap-2 max-w-[94vw] ' + chromeCls}>
                        <span className="glass-panel rounded-full px-3 md:px-4 py-1.5 md:py-2 text-xs font-mono font-bold text-zinc-300 shrink-0">{currentIndex + 1} / {refs.length}</span>
                        {/* Подсказка нужна и в режиме просмотра: человеку,
                            которому прислали ссылку, иначе неоткуда узнать,
                            что кадр можно крутить. */}
                        {/* Молчаливое ожидание выглядит как «зависло»: на площадке
                            оригинал едет долго, и человек должен видеть, что идёт
                            работа, а не поломка. */}
                        {!!bigUrl && !bigReady && (
                            <span className="glass-panel rounded-full px-3 md:px-4 py-1.5 md:py-2 text-xs font-semibold shrink-0 whitespace-nowrap"
                                  style={{ color: 'var(--muted)' }}>
                                полный размер...
                            </span>
                        )}
                        {isPano && (
                            <span className="glass-panel rounded-full px-3 md:px-4 py-1.5 md:py-2 text-xs font-semibold shrink-0 whitespace-nowrap"
                                  style={{ color: 'var(--accent)' }}>
                                360° <span className="hidden sm:inline" style={{ color: 'var(--muted-2)' }}>· ведите пальцем, щипок приближает</span>
                            </span>
                        )}
                        {scopeLabel && <span className="glass-panel rounded-full px-4 py-2 text-xs font-semibold shrink-0 hidden sm:block" style={{ color: 'var(--accent)' }}>{scopeLabel}</span>}
                        {currentRef.label && <span className="px-3 md:px-5 py-1.5 md:py-2 glass-panel rounded-full text-xs md:text-sm font-medium text-white text-center truncate">{currentRef.label}</span>}
                    </div>
                </div>
            );
        };

        const LightSchemeEditor = ({ scheme, onSave, onClose }) => {
            const [elements, setElements] = useState(scheme?.elements || []);
            const [mode, setMode] = useState('select'); 
            const [selectedId, setSelectedId] = useState(null);
            const [drawData, setDrawData] = useState(scheme?.drawData || null);
            const canvasRef = useRef(null);
            const containerRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [brushColor, setBrushColor] = useState('#facc15');
            const [brushSize, setBrushSize] = useState(10);
            const lastPt = useRef({x:0, y:0});
            
            const [draggingEl, setDraggingEl] = useState(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if(canvas) {
                    canvas.width = 1600; canvas.height = 900;
                    const ctx = canvas.getContext('2d');
                    if (drawData) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0); img.src = drawData; }
                }
            }, []);

            const SHAPE_MODES = ['rect', 'circle', 'triangle', 'diamond', 'star', 'arrow', 'text'];
            const handlePointerDown = (e) => {
                // Инструменты у гостя спрятаны, но холст остаётся под пальцем:
                // без этой проверки по нему можно было бы рисовать и таскать
                // приборы. Смотреть схему — да, перекладывать — нет.
                if (READ_ONLY) return;
                if (mode === 'select' || SHAPE_MODES.includes(mode)) {
                    if (e.target.closest('.scheme-el')) return;
                    if (SHAPE_MODES.includes(mode)) {
                        const rect = containerRef.current.getBoundingClientRect();
                        const x = (e.clientX - rect.left) * (1600 / rect.width);
                        const y = (e.clientY - rect.top) * (900 / rect.height);
                        const newEl = { id: `el-${Date.now()}`, type: mode, x, y, w: 100, h: 100, color: brushColor, text: mode === 'text' ? 'Текст' : '', label: '' };
                        if(mode === 'text') { newEl.w = 200; newEl.h = 50; }
                        setElements([...elements, newEl]);
                        setMode('select'); setSelectedId(newEl.id);
                    } else { setSelectedId(null); }
                    return;
                }
                e.currentTarget.setPointerCapture(e.pointerId);
                setIsDrawing(true);
                const rect = canvasRef.current.getBoundingClientRect();
                lastPt.current = { x: (e.clientX - rect.left) * (1600 / rect.width), y: (e.clientY - rect.top) * (900 / rect.height) };
                const ctx = canvasRef.current.getContext('2d'); ctx.beginPath(); ctx.arc(lastPt.current.x, lastPt.current.y, brushSize/2, 0, Math.PI*2); ctx.fillStyle = mode==='erase' ? 'rgba(0,0,0,1)' : brushColor;
                if(mode==='erase') ctx.globalCompositeOperation = 'destination-out'; else { ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = 0.5; }
                ctx.fill(); ctx.globalAlpha = 1.0; ctx.globalCompositeOperation = 'source-over';
            };

            const handlePointerMove = (e) => {
                if (draggingEl) {
                    const rect = containerRef.current.getBoundingClientRect();
                    const nx = (e.clientX - rect.left) * (1600 / rect.width) - draggingEl.ox;
                    const ny = (e.clientY - rect.top) * (900 / rect.height) - draggingEl.oy;
                    setElements(elements.map(el => el.id === draggingEl.id ? {...el, x: nx, y: ny} : el));
                    return;
                }
                if (!isDrawing) return;
                const rect = canvasRef.current.getBoundingClientRect();
                const pos = { x: (e.clientX - rect.left) * (1600 / rect.width), y: (e.clientY - rect.top) * (900 / rect.height) };
                const ctx = canvasRef.current.getContext('2d');
                ctx.save();
                if (mode === 'erase') { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = brushSize*2; ctx.strokeStyle = 'rgba(0,0,0,1)'; }
                else { ctx.strokeStyle = brushColor; ctx.lineWidth = brushSize; ctx.globalAlpha = 0.5; ctx.globalCompositeOperation = 'screen'; }
                ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(lastPt.current.x, lastPt.current.y); ctx.lineTo(pos.x, pos.y); ctx.stroke(); ctx.restore();
                lastPt.current = pos;
            };

            const handlePointerUp = (e) => { 
                if (e.target.hasPointerCapture && e.target.hasPointerCapture(e.pointerId)) {
                    e.target.releasePointerCapture(e.pointerId);
                }
                setIsDrawing(false); setDraggingEl(null); 
            };

            const updateSelected = (updates) => { setElements(elements.map(el => el.id === selectedId ? {...el, ...updates} : el)); };

            return (
                <div className="fixed inset-0 z-[300] bg-[#1a1918]/95 backdrop-blur-xl flex flex-col">
                    <div className="flex flex-col lg:flex-row lg:justify-between lg:items-center gap-3 p-4 glass-panel border-b-0 shrink-0">
                        <div className="flex flex-wrap items-center gap-y-2 gap-x-4">
                            <span className="text-amber-400 font-bold text-sm flex items-center gap-2 shrink-0"><Icons.Lightbulb /> Интерактивная Схема Света</span>
                            <div className="cf-edit-only flex flex-wrap gap-1 bg-black/50 p-1 rounded-lg">
                                <button onClick={() => setMode('select')} className={`px-2 py-1 text-xs rounded ${mode==='select'?'bg-indigo-500 text-[#1a1918]':'text-zinc-400'}`}><Icons.Pointer/></button>
                                <button onClick={() => setMode('draw')} className={`px-2 py-1 text-xs rounded ${mode==='draw'?'bg-indigo-500 text-[#1a1918]':'text-zinc-400'}`}><Icons.Pen/></button>
                                <button onClick={() => setMode('erase')} className={`px-2 py-1 text-xs rounded ${mode==='erase'?'bg-zinc-700 text-white':'text-zinc-400'}`}><Icons.Eraser/></button>
                                <div className="w-[1px] h-4 bg-white/20 my-auto mx-1"></div>
                                <button onClick={() => setMode('rect')} title="Прямоугольник" className={`px-2 py-1 text-xs rounded ${mode==='rect'?'bg-indigo-500 text-[#1a1918]':'text-zinc-400'}`}><Icons.Square/></button>
                                <button onClick={() => setMode('circle')} title="Круг" className={`px-2 py-1 text-xs rounded ${mode==='circle'?'bg-indigo-500 text-[#1a1918]':'text-zinc-400'}`}><Icons.Circle/></button>
                                <button onClick={() => setMode('triangle')} title="Треугольник" className={`px-2 py-1 text-xs rounded ${mode==='triangle'?'bg-indigo-500 text-[#1a1918]':'text-zinc-400'}`}><Icons.Triangle/></button>
                                <button onClick={() => setMode('diamond')} title="Ромб" className={`px-2 py-1 text-xs rounded ${mode==='diamond'?'bg-indigo-500 text-[#1a1918]':'text-zinc-400'}`}><Icons.Diamond/></button>
                                <button onClick={() => setMode('star')} title="Звезда" className={`px-2 py-1 text-xs rounded ${mode==='star'?'bg-indigo-500 text-[#1a1918]':'text-zinc-400'}`}><Icons.Star/></button>
                                <button onClick={() => setMode('arrow')} title="Стрелка (направление луча)" className={`px-2 py-1 text-xs rounded ${mode==='arrow'?'bg-indigo-500 text-[#1a1918]':'text-zinc-400'}`}><Icons.BeamArrow/></button>
                                <button onClick={() => setMode('text')} title="Текст" className={`px-2 py-1 text-xs rounded ${mode==='text'?'bg-indigo-500 text-[#1a1918]':'text-zinc-400'}`}><Icons.TextIcon/></button>
                            </div>
                            <div className="cf-edit-only flex gap-1">
                                {['#facc15', '#60a5fa', '#f87171', '#34d399', '#ffffff'].map(c => (
                                    <button key={c} onClick={() => {setBrushColor(c); if(selectedId) updateSelected({color: c});}} style={{background: c}} className={`w-5 h-5 rounded-full border-2 ${brushColor === c ? 'border-white scale-110' : 'border-transparent hover:scale-110'} transition-transform`} />
                                ))}
                            </div>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => {
                                const pc = document.createElement('canvas'); pc.width = 1600; pc.height = 900;
                                const pctx = pc.getContext('2d');
                                pctx.fillStyle = '#242322'; pctx.fillRect(0, 0, 1600, 900);
                                pctx.globalAlpha = 0.85; pctx.drawImage(canvasRef.current, 0, 0); pctx.globalAlpha = 1;
                                elements.forEach(el => {
                                    pctx.fillStyle = el.color || '#facc15';
                                    if (el.type === 'rect') { pctx.fillRect(el.x, el.y, el.w, el.h); }
                                    else if (el.type === 'circle') { pctx.beginPath(); pctx.ellipse(el.x + el.w/2, el.y + el.h/2, el.w/2, el.h/2, 0, 0, Math.PI*2); pctx.fill(); }
                                    else if (el.type === 'triangle') { pctx.beginPath(); pctx.moveTo(el.x + el.w/2, el.y); pctx.lineTo(el.x, el.y + el.h); pctx.lineTo(el.x + el.w, el.y + el.h); pctx.closePath(); pctx.fill(); }
                                    else if (el.type === 'diamond') { pctx.beginPath(); pctx.moveTo(el.x + el.w/2, el.y); pctx.lineTo(el.x + el.w, el.y + el.h/2); pctx.lineTo(el.x + el.w/2, el.y + el.h); pctx.lineTo(el.x, el.y + el.h/2); pctx.closePath(); pctx.fill(); }
                                    else if (el.type === 'star') {
                                        const cx = el.x + el.w/2, cy = el.y + el.h/2, oR = Math.min(el.w, el.h)/2, iR = oR * 0.45;
                                        pctx.beginPath();
                                        for (let i = 0; i < 10; i++) { const r = i % 2 === 0 ? oR : iR; const ang = (Math.PI/5)*i - Math.PI/2; const px = cx + r*Math.cos(ang), py = cy + r*Math.sin(ang); if (i===0) pctx.moveTo(px,py); else pctx.lineTo(px,py); }
                                        pctx.closePath(); pctx.fill();
                                    }
                                    else if (el.type === 'arrow') {
                                        const x1 = el.x, y1 = el.y + el.h, x2 = el.x + el.w, y2 = el.y;
                                        pctx.strokeStyle = el.color || '#facc15'; pctx.lineWidth = Math.max(3, Math.min(el.w, el.h) * 0.06); pctx.lineCap = 'round';
                                        pctx.beginPath(); pctx.moveTo(x1, y1); pctx.lineTo(x2, y2); pctx.stroke();
                                        const ang = Math.atan2(y2-y1, x2-x1); const headLen = Math.min(el.w, el.h) * 0.25;
                                        pctx.beginPath(); pctx.moveTo(x2, y2);
                                        pctx.lineTo(x2 - headLen*Math.cos(ang - Math.PI/6), y2 - headLen*Math.sin(ang - Math.PI/6));
                                        pctx.lineTo(x2 - headLen*Math.cos(ang + Math.PI/6), y2 - headLen*Math.sin(ang + Math.PI/6));
                                        pctx.closePath(); pctx.fill();
                                    }
                                    else if (el.type === 'text') { pctx.font = 'bold 30px -apple-system, "SF Pro Text", Helvetica, Arial, sans-serif'; pctx.fillText(el.text || '', el.x + 8, el.y + 36); }
                                    if (el.label) { pctx.font = '22px -apple-system, "SF Pro Text", Helvetica, Arial, sans-serif'; pctx.fillStyle = '#f0eee6'; pctx.textAlign = 'center'; pctx.fillText(el.label, el.x + el.w/2, el.y + el.h + 30); pctx.textAlign = 'left'; }
                                });
                                onSave(scheme.id, elements, canvasRef.current.toDataURL('image/png'), pc.toDataURL('image/jpeg', 0.85));
                            }} className="cf-edit-only px-4 py-2 bg-indigo-500 text-[#1a1918] text-xs rounded-lg hover:bg-indigo-400 font-bold">Сохранить схему</button>
                            <button onClick={onClose} className="px-4 py-2 bg-white/10 text-white text-xs rounded-lg hover:bg-white/20">Закрыть</button>
                        </div>
                    </div>

                    <div className="flex-1 flex overflow-hidden">
                        <div className="flex-1 relative p-4 flex justify-center items-center" onPointerMove={handlePointerMove} onPointerUp={handlePointerUp} onPointerCancel={handlePointerUp}>
                            {/* Та же беда, что и на доске: долгое ведение пером
                                браузер отдаёт как «правый щелчок», и на
                                отпускании поверх схемы выскакивало меню. */}
                            <div ref={containerRef} onPointerDown={handlePointerDown}
                                 onContextMenu={(e) => e.preventDefault()}
                                 style={{ touchAction: 'none' }}
                                 className="no-select relative w-full max-w-5xl aspect-video bg-zinc-950 rounded-lg overflow-hidden border border-white/10 cursor-crosshair">
                                <canvas ref={canvasRef} className="absolute inset-0 w-full h-full pointer-events-none opacity-80" />
                                {elements.map(el => (
                                    <div key={el.id} className={`scheme-el absolute pointer-events-auto ${selectedId === el.id ? 'ring-2 ring-indigo-400' : ''}`} 
                                        style={{ left: `${(el.x/1600)*100}%`, top: `${(el.y/900)*100}%`, width: `${(el.w/1600)*100}%`, height: `${(el.h/900)*100}%` }}
                                        onPointerDown={(e) => { e.stopPropagation(); setSelectedId(el.id); setMode('select'); setDraggingEl({id: el.id, ox: (e.clientX - e.currentTarget.getBoundingClientRect().left)*(1600/containerRef.current.getBoundingClientRect().width), oy: (e.clientY - e.currentTarget.getBoundingClientRect().top)*(900/containerRef.current.getBoundingClientRect().height)}); }}>
                                        {el.type === 'rect' && <div className="w-full h-full rounded-md border-2 border-white/20" style={{backgroundColor: el.color}}/>}
                                        {el.type === 'circle' && <div className="w-full h-full rounded-full border-2 border-white/20" style={{backgroundColor: el.color}}/>}
                                        {el.type === 'triangle' && <div className="w-full h-full border-2 border-transparent" style={{backgroundColor: el.color, clipPath: 'polygon(50% 0%, 0% 100%, 100% 100%)'}}/>}
                                        {el.type === 'diamond' && <div className="w-full h-full border-2 border-transparent" style={{backgroundColor: el.color, clipPath: 'polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)'}}/>}
                                        {el.type === 'star' && <div className="w-full h-full border-2 border-transparent" style={{backgroundColor: el.color, clipPath: 'polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%)'}}/>}
                                        {el.type === 'arrow' && <svg className="w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="5" y1="95" x2="90" y2="10" stroke={el.color} strokeWidth="6" strokeLinecap="round"/><polygon points="90,10 72,18 82,28" fill={el.color}/></svg>}
                                        {el.type === 'text' && <textarea value={el.text} onChange={e => {setElements(elements.map(x=>x.id===el.id?{...x, text:e.target.value}:x))}} className="w-full h-full bg-black/60 border border-white/20 text-white font-bold p-1 resize-none focus:outline-none rounded-md text-xs" style={{color: el.color}} />}
                                        {el.label && (
                                            <div className="absolute top-full mt-2 left-1/2 -translate-x-1/2 bg-black/90 text-white font-medium text-[11px] px-2 py-1 rounded border border-white/20 whitespace-nowrap z-50 pointer-events-none">
                                                {el.label}
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>
                        {selectedId && elements.find(e=>e.id===selectedId) && (
                            <div className="w-64 glass-panel border-l border-white/10 p-4 space-y-4 shrink-0 flex flex-col">
                                <span className="text-xs font-bold text-zinc-400 uppercase">Свойства прибора / формы</span>
                                <div className="space-y-2">
                                    <label className="text-[11px] text-zinc-400">Маркировка (Модель/Прибор)</label>
                                    <input type="text" value={elements.find(e=>e.id===selectedId).label || ''} onChange={e=>updateSelected({label: e.target.value})} className="w-full glass-input rounded px-2 py-1.5 text-xs" placeholder="Напр: ARRI SkyPanel S60" />
                                </div>
                                <div className="space-y-2">
                                    <label className="text-[11px] text-zinc-400">Ширина</label>
                                    <input type="range" min="20" max="400" value={elements.find(e=>e.id===selectedId).w} onChange={e=>updateSelected({w: Number(e.target.value)})} className="w-full accent-indigo-500" />
                                </div>
                                <div className="space-y-2">
                                    <label className="text-[11px] text-zinc-400">Высота</label>
                                    <input type="range" min="20" max="400" value={elements.find(e=>e.id===selectedId).h} onChange={e=>updateSelected({h: Number(e.target.value)})} className="w-full accent-indigo-500" />
                                </div>
                                <button onClick={() => {setElements(elements.filter(e=>e.id!==selectedId)); setSelectedId(null);}} className="cf-edit-only mt-auto bg-red-600/20 text-red-400 border border-red-500/30 py-2 rounded-lg text-xs font-bold hover:bg-red-600/40">Удалить объект</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // Поле тега с подсказками из УЖЕ ИСПОЛЬЗОВАННЫХ в проекте.
        // Отдельным компонентом намеренно: набранные буквы живут в его
        // собственном состоянии и не заставляют перерисовываться всю
        // галерею — при сотне референсов это заметно на планшете.
        // --- Выбор референсов ИЗ УЖЕ ЗАГРУЖЕННЫХ ---
        // Один компонент на все места, где нужно «взять картинку из
        // галереи»: в карточке сцены и на доске. Ветку не копируем —
        // две таких разъехались бы при первой же правке, и человек
        // получил бы поиск в одном месте и список из шестидесяти штук
        // в другом.
        //
        // Поиск и папки тут обязательны, а не «удобство»: на проекте
        // в триста референсов простой список — это стена картинок,
        // в которой нужную не найти. Раньше на доску предлагались
        // ПЕРВЫЕ ШЕСТЬДЕСЯТ и молча — отчего и выглядело так, будто
        // часть референсов пропала.
        //
        // Своё состояние (набранные буквы, выбранное) живёт ВНУТРИ —
        // как у TagInput: иначе каждая буква перерисовывала бы всё
        // приложение вместе с доской.
        const RefPicker = ({ refs, title, hint, actionLabel, onClose, onPick, bgStyle }) => {
          const [q, setQ] = useState('');
          const [folder, setFolder] = useState('');
          const [sel, setSel] = useState([]);

          // Папки считаем по тому, что реально предлагается выбрать,
          // а не по всей галерее: пустая папка в списке — обещание,
          // за которым ничего нет.
          const folders = useMemo(() => {
            const m = new Map();
            refs.forEach(r => { const f = String(r.folder || '').trim(); if (f) m.set(f, (m.get(f) || 0) + 1); });
            return [...m.entries()].sort((a, b) => a[0].localeCompare(b[0], 'ru'));
          }, [refs]);

          const shown = useMemo(() => {
            const needle = q.trim().toLowerCase();
            return refs.filter(r => {
              if (folder && String(r.folder || '').trim() !== folder) return false;
              if (!needle) return true;
              // Ищем и по подписи, и по тегам: «ночь» человек ставил
              // тегом, а «двор школы» писал в названии файла.
              return String(r.label || '').toLowerCase().includes(needle)
                  || (r.tags || []).some(t => String(t).toLowerCase().includes(needle));
            });
          }, [refs, q, folder]);

          const toggle = (id) => setSel(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
          const done = () => { if (sel.length) onPick(sel.map(id => refs.find(r => r.id === id)).filter(Boolean)); onClose(); };

          return ReactDOM.createPortal(
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[240] p-4"
                 onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
              {/* cf-modal-box и cf-modal-x обязательны: на телефоне окно выше
                  экрана, и без них крестик уезжает выше видимой части. */}
              <div className="cf-modal-box glass-panel rounded-lg w-full max-w-3xl relative flex flex-col" style={{ padding: 0 }}>
                <div className="p-5 pb-3 shrink-0" style={{ borderBottom: '1px solid var(--border)' }}>
                  <button onClick={onClose} className="cf-modal-x w-8 h-8 flex items-center justify-center hover:bg-red-500/20 hover:text-red-400 rounded-full text-zinc-400 font-bold transition-colors">✕</button>
                  <h3 className="text-lg font-extrabold text-white mb-1 flex items-center gap-2"><Icons.Gallery /> {title}</h3>
                  {hint && <p className="text-[12px] text-zinc-500 leading-relaxed mb-3">{hint}</p>}
                  <input data-ro-ok type="text" value={q} onChange={e => setQ(e.target.value)}
                         placeholder="Поиск по подписи и тегам..."
