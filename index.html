            if (bx) guides.current.push({ vertical: true, at: bx.v, a: Math.min(box.y0 + bx.d * 0, bx.t.y0, box.y0), b: Math.max(bx.t.y1, box.y1) });
            if (by) guides.current.push({ vertical: false, at: by.v, a: Math.min(by.t.x0, box.x0), b: Math.max(by.t.x1, box.x1) });
            return { dx: bx ? bx.d : 0, dy: by ? by.d : 0 };
          };
          // Итоговое положение: сначала направляющие, по осям где их нет —
          // сетка. Сетку не выбрасываем: она гасит дрожание при медленном
          // ведении, и без неё каждое движение указателя двигало бы карточку.
          const snapMove = (box) => {
            const a = snapAdjust(box);
            const gx = a.dx !== 0 ? a.dx : (noSnap.current ? 0 : Math.round(box.x0 / GRID) * GRID - box.x0);
            const gy = a.dy !== 0 ? a.dy : (noSnap.current ? 0 : Math.round(box.y0 / GRID) * GRID - box.y0);
            return { dx: gx, dy: gy };
          };
          const clearGuides = () => { guides.current = []; snapPool.current = null; };
          // Притяжка ОДНОГО значения — для изменения размера: там едет один
          // край, и двигать вместе с ним противоположный нельзя.
          const snapEdge = (v, vertical, a, b) => {
            if (noSnap.current) return v;
            const pool = snapPool.current || [];
            const tol = SNAP_PX / Math.max(0.05, zoom);
            let best = null;
            for (const t of pool) {
              const cand = vertical ? [t.x0, (t.x0 + t.x1) / 2, t.x1] : [t.y0, (t.y0 + t.y1) / 2, t.y1];
              for (const c of cand) { const d = c - v; if (Math.abs(d) <= tol && (!best || Math.abs(d) < Math.abs(best.d))) best = { d, c, t }; }
            }
            if (!best) return Math.round(v / GRID) * GRID;
            guides.current.push(vertical
              ? { vertical: true, at: best.c, a: Math.min(best.t.y0, a), b: Math.max(best.t.y1, b) }
              : { vertical: false, at: best.c, a: Math.min(best.t.x0, a), b: Math.max(best.t.x1, b) });
            return best.c;
          };

          // --- ЖИЗНЬ ФИГУРЫ: создать, выбрать, подвинуть, растянуть ---
          const makeShape = (k, x, y) => ({
            id: `sh-${Date.now().toString(36)}${Math.random().toString(36).slice(2, 5)}`,
            k, x, y, w: 0, h: 0,
            tx: k === 'text' ? '' : undefined,
            fz: shapeStyle.fz || 20,
            ta: k === 'text' ? 'left' : 'center',
            sc: shapeStyle.sc,
            bg: isLineKind(k) ? 'transparent' : shapeStyle.bg,
            sw: shapeStyle.sw, sd: shapeStyle.sd, fs: shapeStyle.fs,
            rd: shapeStyle.rd, ro: shapeStyle.ro, op: shapeStyle.op,
            a1: k === 'arrow' ? shapeStyle.a1 : 'none',
            a2: k === 'arrow' ? shapeStyle.a2 : 'none',
            sd8: (Math.random() * 2000000000) | 0
          });
          // Ищем сверху вниз: выше лежит то, что нарисовано позже.
          const shapeAt = (x, y, inside) => {
            const pad = 8 / Math.max(0.05, zoom);
            for (let i = shapesRef.current.length - 1; i >= 0; i--) {
              const s = shapesRef.current[i];
              // Подпись внутри фигуры сама не выбирается: нажимают по
              // хозяину, иначе рамка выделения появлялась бы дважды.
              if (s.ct) continue;
              if (shapeHit(s, x, y, pad, inside)) return s;
            }
            return null;
          };
          // Ручку ловим с запасом под палец: 9 точек на экране — это меньше
          // трети подушечки, и попасть в них мышью можно, а пальцем нет.
          const handleAt = (x, y) => {
            const tol = 13 / Math.max(0.05, zoom);
            for (const id of selShapes) {
              const s = shapesRef.current.find(q => q.id === id);
              if (!s) continue;
              for (const hd of shapeHandles(s)) {
                if (Math.abs(hd.x - x) <= tol && Math.abs(hd.y - y) <= tol) return { s, h: hd.n };
              }
            }
            return null;
          };
          // Пока указатель не сдвинулся хоть немного, жест НЕ считается
          // движением. Без этого простое нажатие «чтобы выбрать» само
          // подтягивало фигуру к сетке и вдобавок писало пустой шаг отмены:
          // человек ткнул в фигуру, а она уехала.
          const DRAG_START_PX = 3;
          // Открыть правку текста. Для фигуры без подписи заводим её здесь же:
          // человек делает один жест «двойной клик по блоку», а не два —
          // «создай текст» и «положи внутрь».
          const openText = (s) => {
            if (READ_ONLY) return;
            let target = s;
            if (!isText(s)) {
              const has = shapesRef.current.find(q => q.ct === s.id);
              if (has) target = has;
              else {
                pushUndo(false);
                target = { ...makeShape('text', 0, 0), ct: s.id, tx: '', ta: 'center', sc: s.sc };
                shapesRef.current = shapesRef.current.concat([target]);
                scheduleInkSave('shapes');
              }
            }
            setSelShapes([]);
            setEditText({ id: target.id });
            requestStatic();
          };
          // Фокус ставим руками, а не через autoFocus: поле появляется после
          // жеста, во время которого фокус мог уехать на кнопку панели, —
          // и тогда набранное просто не попадало в текст. Заодно ставим
          // курсор в конец, чтобы дописывать, а не перезаписывать.
          useEffect(() => {
            if (!editText) return;
            const el = editRef.current;
            if (!el) return;
            el.focus();
            try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {}
          }, [editText]);

          const commitText = (value) => {
            const cur = editText;
            setEditText(null);
            if (!cur) return;
            const s = shapesRef.current.find(q => q.id === cur.id);
            if (!s) { requestStatic(); return; }
            const txt = String(value == null ? s.tx : value);
            if (txt === (s.tx || '')) { requestStatic(); return; }
            pushUndo(false);
            // Пустой текст не оставляем: он невидим, но продолжает ловить
            // нажатия и мешаться под рукой.
            if (!txt.trim()) shapesRef.current = shapesRef.current.filter(q => q.id !== s.id);
            else shapesRef.current = shapesRef.current.map(q => q.id === s.id
              ? shapeDirty({ ...q, tx: txt, h: isText(q) && !q.ct ? measureText({ ...q, tx: txt }) : q.h })
              : q);
            bumpInk();
            scheduleInkSave('shapes');
          };

          // Взяли привязанный конец руками — привязка снимается, а туда,
          // где он был нарисован, кладутся настоящие координаты. Иначе конец
          // прыгал бы обратно к фигуре на каждое движение.
          const freezeArrow = (s, which) => {
            const { p1, p2 } = arrowEnds(s);
            s.x = p1.x; s.y = p1.y; s.w = p2.x - p1.x; s.h = p2.y - p1.y;
            if (which === 'p1') s.b1 = null; else if (which === 'p2') s.b2 = null;
            shapeDirty(s);
          };
          // Карточка уходит с доски или из проекта — привязанные к ней стрелки
          // замирают там, где нарисованы, а не исчезают следом. Удалил одну
          // заметку, а половина схемы пропала — это выглядит как поломка.
          // Звать ДО того, как карточка убрана из состояния: пока она есть,
          // маршрут стрелки ещё можно посчитать.
          const freezeArrowsForCards = (ids) => {
            const set = ids instanceof Set ? ids : new Set(ids);
            const list = arrowsBoundTo(set);
            if (!list.length) return;
            list.forEach(q => {
              if (q.b1 && set.has(q.b1)) freezeArrow(q, 'p1');
              if (q.b2 && set.has(q.b2)) freezeArrow(q, 'p2');
            });
            bumpInk(); scheduleInkSave('shapes');
          };
          const shapeStartAct = (kind, ids, pt, extra) => {
            if (kind === 'size' && extra && (extra.h === 'p1' || extra.h === 'p2')) {
              const s = shapesRef.current.find(q => q.id === ids[0]);
              if (s && isLineKind(s.k) && (s.b1 || s.b2)) freezeArrow(s, extra.h);
            }
            shapeAct.current = { kind, ids: new Set(ids), sx: pt.x, sy: pt.y, moved: false,
                                orig: shapesRef.current.filter(s => ids.includes(s.id)).map(s => ({ ...s })), ...extra };
            buildSnapPool(ids);
          };
          const shapeMoveAct = (pt, shift) => {
            const a = shapeAct.current; if (!a) return;
            let dx = pt.x - a.sx, dy = pt.y - a.sy;
            if (!a.moved) {
              if (Math.hypot(dx, dy) * zoom < DRAG_START_PX) return;
              a.moved = true;
              pushUndo(false);
              requestStatic();        // снимаем их с нижнего слоя — дальше ведёт верхний
            }
            guides.current = [];
            if (a.kind === 'move') {
              // Рамку считаем по ВСЕМ выбранным разом: выравнивать надо
              // группу целиком, а не каждую фигуру по отдельности.
              let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
              a.orig.forEach(o => { const b = shapeBox(o); x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h); });
              const adj = snapMove({ x0: x0 + dx, y0: y0 + dy, x1: x1 + dx, y1: y1 + dy });
              dx += adj.dx; dy += adj.dy;
              a.orig.forEach(o => {
                const s = shapesRef.current.find(q => q.id === o.id); if (!s) return;
                s.x = o.x + dx; s.y = o.y + dy; shapeDirty(s);
              });
            } else {
              const o = a.orig[0];
              const s = shapesRef.current.find(q => q.id === o.id); if (!s) return;
              if (isLineKind(o.k) && a.h === 'mid') {
                // Изгиб — это перпендикулярное отклонение от прямой между
                // концами. Знак важен: он определяет, в какую сторону гнуть.
                const { p1, p2 } = arrowEnds(s);
                const vx = p2.x - p1.x, vy = p2.y - p1.y, l = Math.hypot(vx, vy) || 1;
                const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
                s.bw = ((pt.x - mx) * (-vy / l) + (pt.y - my) * (vx / l)) * 2;
                shapeDirty(s);
              } else if (isLineKind(o.k)) {
                const bx = shapeBox(o);
                // Ведём конец над фигурой — она подсветится и конец к ней
                // прицепится: это и есть весь жест «связать два блока».
                const over = bindAt(pt.x, pt.y);
                bindCand.current = (over && over.id !== s.id) ? over.id : null;
                if (a.h === 'p1') {
                  let nx = snapEdge(o.x + dx, true, bx.y, bx.y + bx.h), ny = snapEdge(o.y + dy, false, bx.x, bx.x + bx.w);
                  if (shift) { const r = lockAngle(o.x + o.w, o.y + o.h, nx, ny); nx = r.x; ny = r.y; }
                  s.x = nx; s.y = ny; s.w = o.x + o.w - nx; s.h = o.y + o.h - ny;
                } else {
                  let nx = snapEdge(o.x + o.w + dx, true, bx.y, bx.y + bx.h), ny = snapEdge(o.y + o.h + dy, false, bx.x, bx.x + bx.w);
                  if (shift) { const r = lockAngle(o.x, o.y, nx, ny); nx = r.x; ny = r.y; }
                  s.w = nx - o.x; s.h = ny - o.y;
                }
              } else {
                const b = shapeBox(o);
                let L = b.x, T = b.y, R = b.x + b.w, B = b.y + b.h;
                if (a.h.includes('w')) L = snapEdge(L + dx, true, T, B);
                if (a.h.includes('e')) R = snapEdge(R + dx, true, T, B);
                if (a.h.includes('n')) T = snapEdge(T + dy, false, L, R);
                if (a.h.includes('s')) B = snapEdge(B + dy, false, L, R);
                if (R - L < 4) R = L + 4;
                if (B - T < 4) B = T + 4;
                s.x = L; s.y = T; s.w = R - L; s.h = B - T;
                // У текста высоту задаёт содержимое: тянут ширину, а сколько
                // вышло строк — знает только перенос.
                if (isText(s)) s.h = measureText(s);
              }
              shapeDirty(s);
            }
            requestLive();
          };
          const shapeEndAct = () => {
            const a = shapeAct.current;
            if (!a) return;
            // Отпустили конец над фигурой — цепляем.
            if (a.moved && bindCand.current && (a.h === 'p1' || a.h === 'p2')) {
              const s = shapesRef.current.find(q => a.ids.has(q.id));
              if (s && isLineKind(s.k)) { s[a.h === 'p1' ? 'b1' : 'b2'] = bindCand.current; shapeDirty(s); }
            }
            bindCand.current = null;
            shapeAct.current = null;
            clearGuides();
            if (!a.moved) { requestLive(); return; }
            bumpInk();
            scheduleInkSave('shapes');
          };
          // Shift держит угол кратным 15°: без этого ровную горизонталь
          // рукой не проведёшь, а именно её чаще всего и рисуют.
          const lockAngle = (x0, y0, x, y) => {
            const dx = x - x0, dy = y - y0;
            const l = Math.hypot(dx, dy);
            const step = Math.PI / 12;
            const a = Math.round(Math.atan2(dy, dx) / step) * step;
            return { x: x0 + Math.cos(a) * l, y: y0 + Math.sin(a) * l };
          };
          const deleteShapes = (ids) => {
            const kill = new Set(ids && ids.length ? ids : selShapes);
            if (!kill.size) return;
            pushUndo(false);
            // Подпись живёт только вместе с хозяином: осиротев, она осталась
            // бы висеть в пустоте и ловить нажатия.
            shapesRef.current.forEach(s => { if (s.ct && kill.has(s.ct)) kill.add(s.id); });
            // Стрелку, потерявшую хозяина, НЕ удаляем — замораживаем там, где
            // она была нарисована. Удалили блок, а половина схемы исчезла
            // следом — это выглядит как поломка, а не как удаление блока.
            shapesRef.current.forEach(s => {
              if (!isLineKind(s.k) || kill.has(s.id)) return;
              if (kill.has(s.b1)) freezeArrow(s, 'p1');
              if (kill.has(s.b2)) freezeArrow(s, 'p2');
            });
            shapesRef.current = shapesRef.current.filter(s => !kill.has(s.id));
            setSelShapes([]);
            bumpInk();
            scheduleInkSave('shapes');
          };
          // Порядок слоёв — это просто порядок в списке: мы пишем весь список
          // одной строкой, поэтому дробные индексы из ТЗ здесь решали бы
          // задачу, которой у нас нет.
          const orderShapes = (dir) => {
            if (!selShapes.length) return;
            pushUndo(false);
            const sel = new Set(selShapes);
            const keep = shapesRef.current.filter(s => !sel.has(s.id));
            const move = shapesRef.current.filter(s => sel.has(s.id));
            shapesRef.current = dir > 0 ? keep.concat(move) : move.concat(keep);
            bumpInk();
            scheduleInkSave('shapes');
          };
          // --- ВЫГРУЗКА ДОСКИ ---
          // PNG и SVG рисуются из ОДНОГО описания: тот же список карточек,
          // те же команды пути у фигур и штрихов. Иначе выгрузка со временем
          // расходится с тем, что человек видит на экране, — и заметно это
          // становится ровно в тот момент, когда доску уже отправили группе.
          const [exportBusy, setExportBusy] = useState(false);
          const esc = (t) => String(t == null ? '' : t)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
          // Что вообще лежит на доске: карточки в том же порядке, в каком
          // они нарисованы на экране, а под ними — размеры.
          const boardCards = () => {
            const out = [];
            boardScenes.forEach(s => out.push({ t: 'scene', o: s, x: s.x, y: s.y, w: 288, h: 150 }));
            references.filter(r => r.boardId === activeBoardId).forEach(r => out.push({ t: 'ref', o: r, x: r.x, y: r.y, w: refW(r), h: refH(r) }));
            boardDocs.forEach(d => out.push({ t: 'doc', o: d, x: d.x, y: d.y, w: docCardW(d), h: docCardH(d) }));
            stickies.filter(s => belongsToBoard(s, activeBoardId)).forEach(s => out.push({ t: 'sticky', o: s, x: s.x, y: s.y, w: stickyW(s), h: stickyH(s) }));
            return out;
          };
          const boardBounds = () => {
            let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
            const eat = (x, y, w, h) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x + w); y1 = Math.max(y1, y + h); };
            boardCards().forEach(c => eat(c.x, c.y, c.w, c.h));
            shapesRef.current.forEach(s => { if (s.ct) return; const b = shapeBox(s); eat(b.x - s.sw, b.y - s.sw, b.w + s.sw * 2, b.h + s.sw * 2); });
            strokesRef.current.forEach(s => { const b = strokeBox(s); eat(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0); });
            // Старую растровую подложку меряем по грубой карте, а не по всему
            // холсту 4000×4000 — иначе выгрузка всегда была бы во всю доску.
            const m = legacyMap.current;
            if (m) for (let j = 0; j < 100; j++) for (let i = 0; i < 100; i++) if (m[j * 100 + i]) eat(i * 40, j * 40, 40, 40);
            if (!isFinite(x0)) return null;
            const pad = 48;
            return { x: x0 - pad, y: y0 - pad, w: (x1 - x0) + pad * 2, h: (y1 - y0) + pad * 2 };
          };
          const cssVar = (n, dflt) => {
            try { const v = getComputedStyle(document.documentElement).getPropertyValue(n).trim(); return v || dflt; }
            catch (e) { return dflt; }
          };
          // Картинки референсов надо дождаться: рисовать их на холст можно
          // только загруженными, иначе в выгрузке будут дыры.
          const loadImages = (urls) => Promise.all(urls.map(u => new Promise(res => {
            if (!u) return res(null);
            const im = new Image();
            im.onload = () => res(im); im.onerror = () => res(null);
            im.src = u;
          })));

          const paintCardOn = (ctx, c, imgs) => {
            const bg = cssVar('--panel', '#242322'), line = 'rgba(255,255,255,0.10)';
            const round = (x, y, w, h, r) => { ctx.beginPath();
              if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); };
            if (c.t === 'sticky') {
              ctx.fillStyle = c.o.color || '#fef08a';
              round(c.x, c.y, c.w, c.h, 8); ctx.fill();
              ctx.fillStyle = '#1a1918'; ctx.font = `13px ${FONT_UI}`; ctx.textBaseline = 'top';
              wrapText(ctx, c.o.text, c.w - 20).slice(0, 12).forEach((ln, i) => ctx.fillText(ln, c.x + 10, c.y + 10 + i * 17));
              return;
            }
            ctx.fillStyle = bg; round(c.x, c.y, c.w, c.h, 10); ctx.fill();
            ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.stroke();
            ctx.textBaseline = 'top';
            if (c.t === 'scene') {
              ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fillRect(c.x, c.y, c.w, 34);
              ctx.strokeStyle = line; ctx.beginPath(); ctx.moveTo(c.x, c.y + 34); ctx.lineTo(c.x + c.w, c.y + 34); ctx.stroke();
              ctx.fillStyle = cssVar('--muted', '#8b8681'); ctx.font = `bold 11px ${FONT_UI}`;
              ctx.fillText('СЦЕНА #' + (c.o.number || '—'), c.x + 12, c.y + 11);
              ctx.fillStyle = '#ffffff'; ctx.font = `bold 14px ${FONT_UI}`;
              wrapText(ctx, c.o.title, c.w - 24).slice(0, 2).forEach((ln, i) => ctx.fillText(ln, c.x + 12, c.y + 46 + i * 19));
              ctx.fillStyle = cssVar('--text-2', '#cfc9c0'); ctx.font = `12px ${FONT_UI}`;
              wrapText(ctx, c.o.content, c.w - 24).slice(0, 3).forEach((ln, i) => ctx.fillText(ln, c.x + 12, c.y + 92 + i * 16));
              return;
            }
            if (c.t === 'doc') {
              ctx.fillStyle = '#ffffff'; ctx.font = `bold 13px ${FONT_UI}`;
              ctx.fillText(String(c.o.title || 'Документ').slice(0, 40), c.x + 12, c.y + 12);
              ctx.fillStyle = cssVar('--text-2', '#cfc9c0'); ctx.font = `12px ${FONT_UI}`;
              wrapText(ctx, c.o.content, c.w - 24).slice(0, Math.max(1, Math.floor((c.h - 44) / 16))).forEach((ln, i) => ctx.fillText(ln, c.x + 12, c.y + 36 + i * 16));
              return;
            }
            const im = imgs[c.o.id];
            const ih = c.h - 24;
            if (im) {
              // Вписываем как на доске: по ширине, с сохранением пропорций.
              const k = Math.min(c.w - 12 / 1, im.width) / im.width;
              const dw = c.w - 12, dh = Math.min(ih - 4, im.height * (dw / im.width));
              ctx.save(); round(c.x + 6, c.y + 6, dw, dh, 6); ctx.clip();
              ctx.drawImage(im, c.x + 6, c.y + 6, dw, dh); ctx.restore();
            }
            ctx.fillStyle = cssVar('--text-2', '#cfc9c0'); ctx.font = `11px ${FONT_UI}`;
            ctx.fillText(String(c.o.label || '').slice(0, 46), c.x + 8, c.y + c.h - 16);
          };

          const exportBoard = async (fmt) => {
            const box = boardBounds();
            if (!box) { showToast('На доске пока нечего выгружать'); return; }
            setExportBusy(true);
            try {
              const cards = boardCards();
              const list = await loadImages(cards.filter(c => c.t === 'ref').map(c => c.o.url));
              const imgs = {};
              cards.filter(c => c.t === 'ref').forEach((c, i) => { if (list[i]) imgs[c.o.id] = list[i]; });
              const bgCol = cssVar('--canvas', '#1a1918');
              const name = `CineFlow_доска_${new Date().toISOString().split('T')[0]}`;
              const save = (blob, ext) => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `${name}.${ext}`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                URL.revokeObjectURL(url);
              };
              if (fmt === 'png') {
                // Множитель ограничиваем по числу точек: доска бывает
                // огромной, и холст на 100 мегапикселей браузер просто
                // не создаст — вернёт пустую картинку без единой ошибки.
                const maxPix = 26e6;
                const k = Math.min(2, Math.sqrt(maxPix / Math.max(1, box.w * box.h)));
                const cv = document.createElement('canvas');
                cv.width = Math.max(1, Math.round(box.w * k));
                cv.height = Math.max(1, Math.round(box.h * k));
                const ctx = cv.getContext('2d');
                ctx.fillStyle = bgCol; ctx.fillRect(0, 0, cv.width, cv.height);
                ctx.setTransform(k, 0, 0, k, -box.x * k, -box.y * k);
                if (legacyCv.current) ctx.drawImage(legacyCv.current, 0, 0);
                cards.forEach(c => paintCardOn(ctx, c, imgs));
                shapesRef.current.forEach(s => paintShape(ctx, s));
                strokesRef.current.forEach(s => paintStroke(ctx, s));
                await new Promise(res => cv.toBlob(b => { if (b) save(b, 'png'); res(); }, 'image/png'));
                showToast(`Доска выгружена · ${cv.width}×${cv.height}`);
              } else {
                const parts = [];
                parts.push(`<svg xmlns="http://www.w3.org/2000/svg" width="${rn(box.w)}" height="${rn(box.h)}" viewBox="${rn(box.x)} ${rn(box.y)} ${rn(box.w)} ${rn(box.h)}">`);
                parts.push(`<rect x="${rn(box.x)}" y="${rn(box.y)}" width="${rn(box.w)}" height="${rn(box.h)}" fill="${bgCol}"/>`);
                if (legacyUrl.current) parts.push(`<image x="0" y="0" width="4000" height="4000" href="${esc(legacyUrl.current)}"/>`);
                const txt = (s, x, y, size, color, weight, anchor) =>
                  `<text x="${rn(x)}" y="${rn(y)}" font-family="Inter, sans-serif" font-size="${size}" fill="${color}"${weight ? ' font-weight="' + weight + '"' : ''}${anchor ? ' text-anchor="' + anchor + '"' : ''}>${esc(s)}</text>`;
                const mc = hitCtx.current || (hitCtx.current = document.createElement('canvas').getContext('2d'));
                cards.forEach(c => {
                  if (c.t === 'sticky') {
                    parts.push(`<rect x="${rn(c.x)}" y="${rn(c.y)}" width="${rn(c.w)}" height="${rn(c.h)}" rx="8" fill="${c.o.color || '#fef08a'}"/>`);
                    mc.font = `13px ${FONT_UI}`;
                    wrapText(mc, c.o.text, c.w - 20).slice(0, 12).forEach((ln, i) => parts.push(txt(ln, c.x + 10, c.y + 22 + i * 17, 13, '#1a1918')));
                    return;
                  }
                  parts.push(`<rect x="${rn(c.x)}" y="${rn(c.y)}" width="${rn(c.w)}" height="${rn(c.h)}" rx="10" fill="${cssVar('--panel', '#242322')}" stroke="rgba(255,255,255,.10)"/>`);
                  if (c.t === 'scene') {
                    parts.push(txt('СЦЕНА #' + (c.o.number || '—'), c.x + 12, c.y + 22, 11, cssVar('--muted', '#8b8681'), 'bold'));
                    mc.font = `bold 14px ${FONT_UI}`;
                    wrapText(mc, c.o.title, c.w - 24).slice(0, 2).forEach((ln, i) => parts.push(txt(ln, c.x + 12, c.y + 58 + i * 19, 14, '#ffffff', 'bold')));
                    mc.font = `12px ${FONT_UI}`;
                    wrapText(mc, c.o.content, c.w - 24).slice(0, 3).forEach((ln, i) => parts.push(txt(ln, c.x + 12, c.y + 103 + i * 16, 12, cssVar('--text-2', '#cfc9c0'))));
                  } else if (c.t === 'doc') {
                    parts.push(txt(String(c.o.title || 'Документ').slice(0, 40), c.x + 12, c.y + 24, 13, '#ffffff', 'bold'));
                    mc.font = `12px ${FONT_UI}`;
                    wrapText(mc, c.o.content, c.w - 24).slice(0, Math.max(1, Math.floor((c.h - 44) / 16))).forEach((ln, i) => parts.push(txt(ln, c.x + 12, c.y + 48 + i * 16, 12, cssVar('--text-2', '#cfc9c0'))));
                  } else if (c.o.url) {
                    parts.push(`<image x="${rn(c.x + 6)}" y="${rn(c.y + 6)}" width="${rn(c.w - 12)}" height="${rn(c.h - 28)}" preserveAspectRatio="xMidYMid slice" href="${esc(c.o.url)}"/>`);
                    parts.push(txt(String(c.o.label || '').slice(0, 46), c.x + 8, c.y + c.h - 6, 11, cssVar('--text-2', '#cfc9c0')));
                  }
                });
                shapesRef.current.forEach(s => {
                  if (isText(s)) {
                    const host = s.ct ? findShape(s.ct) : null;
                    const b = host ? shapeBox(host) : shapeBox(s);
                    const pad = host ? 10 : 0;
                    mc.font = textFont(s);
                    const lines = wrapText(mc, s.tx, Math.max(10, b.w - pad * 2));
                    const lh = textLH(s), ta = s.ta || (host ? 'center' : 'left');
                    const anchor = ta === 'center' ? 'middle' : (ta === 'right' ? 'end' : 'start');
                    const x = ta === 'center' ? b.x + b.w / 2 : (ta === 'right' ? b.x + b.w - pad : b.x + pad);
                    let y = (host ? b.y + (b.h - lines.length * lh) / 2 : b.y) + (s.fz || 20) * 0.95;
                    lines.forEach(ln => { parts.push(txt(ln, x, y, s.fz || 20, s.sc, null, anchor)); y += lh; });
                    return;
                  }
                  const closed = !isLineKind(s.k);
                  const d0 = cmdsD(shapeCmds(s, 0));
                  const dash = s.sd === 'dashed' ? ` stroke-dasharray="${s.sw * 4} ${s.sw * 3.2}"`
                            : s.sd === 'dotted' ? ` stroke-dasharray="0.1 ${s.sw * 2.6}"` : '';
                  const op = s.op === undefined ? 1 : s.op;
                  if (closed && s.bg && s.bg !== 'transparent') {
                    parts.push(`<path d="${d0}" fill="${s.bg}" fill-opacity="${rn(op * (s.fs === 'solid' ? 0.22 : 0.14))}" stroke="none"/>`);
                  }
                  parts.push(`<path d="${d0}" fill="none" stroke="${s.sc}" stroke-width="${s.sw}" stroke-opacity="${rn(op)}" stroke-linecap="round" stroke-linejoin="round"${dash}/>`);
                  if (s.ro) parts.push(`<path d="${cmdsD(shapeCmds(s, 1))}" fill="none" stroke="${s.sc}" stroke-width="${s.sw}" stroke-opacity="${rn(op * 0.75)}" stroke-linecap="round" stroke-linejoin="round"${dash}/>`);
                  if (isLineKind(s.k)) {
                    const q = arrowRoute(s).pts, n = q.length, hs = Math.max(9, s.sw * 4.5);
                    const head = (x, y, fx, fy) => {
                      const a = Math.atan2(y - fy, x - fx), w = 0.42;
                      return `<path d="M${rn(x - Math.cos(a - w) * hs)} ${rn(y - Math.sin(a - w) * hs)}L${rn(x)} ${rn(y)}L${rn(x - Math.cos(a + w) * hs)} ${rn(y - Math.sin(a + w) * hs)}" fill="none" stroke="${s.sc}" stroke-width="${s.sw}" stroke-linecap="round" stroke-linejoin="round"/>`;
                    };
                    if (s.a2 === 'arrow') parts.push(head(q[n - 1][0], q[n - 1][1], q[n - 2][0], q[n - 2][1]));
                    if (s.a1 === 'arrow') parts.push(head(q[0][0], q[0][1], q[1][0], q[1][1]));
                  }
                });
                strokesRef.current.forEach(s => {
                  parts.push(`<path d="${cmdsD(strokeCmds(s))}" fill="${s.c}" fill-opacity="${rn(brushAlpha(s.t))}" fill-rule="nonzero"/>`);
                });
                parts.push('</svg>');
                save(new Blob([parts.join('\n')], { type: 'image/svg+xml' }), 'svg');
                showToast('Доска выгружена в SVG');
              }
            } catch (err) {
              console.warn('exportBoard', err);
              showToast('Не удалось собрать файл: ' + err.message);
            }
            setExportBusy(false);
          };

          // --- ГРУППЫ ---
          // Группа — это просто общая метка `g` у нескольких фигур, без
          // вложенных структур: так её переживают и копирование, и запись
          // одной строкой, и отмена. Нажали по одной — берём всю метку.
          const expandGroups = (ids) => {
            const set = new Set(ids);
            const marks = new Set();
            ids.forEach(id => { const s = findShape(id); if (s && s.g) marks.add(s.g); });
            if (marks.size) shapesRef.current.forEach(s => { if (s.g && marks.has(s.g)) set.add(s.id); });
            return Array.from(set);
          };
          const groupShapes = () => {
            const ids = expandGroups(selShapes).filter(id => { const s = findShape(id); return s && !s.ct; });
            if (ids.length < 2) return;
            pushUndo(false);
            const mark = `g${Date.now().toString(36)}${Math.random().toString(36).slice(2, 5)}`;
            const set = new Set(ids);
            shapesRef.current = shapesRef.current.map(s => set.has(s.id) ? { ...s, g: mark } : s);
            setSelShapes(ids);
            bumpInk(); scheduleInkSave('shapes');
          };
          const ungroupShapes = () => {
            const ids = expandGroups(selShapes);
            if (!ids.some(id => { const s = findShape(id); return s && s.g; })) return;
            pushUndo(false);
            const set = new Set(ids);
            shapesRef.current = shapesRef.current.map(s => set.has(s.id) && s.g ? { ...s, g: undefined } : s);
            bumpInk(); scheduleInkSave('shapes');
          };

          const patchShapes = (patch) => {
            setShapeStyle(st => {
              const next = { ...st, ...patch };
              try { localStorage.setItem('cf_shape_style', JSON.stringify(next)); } catch (e) {}
              return next;
            });
            if (!selShapes.length) return;
            pushUndo(false);
            const sel = new Set(selShapes);
            shapesRef.current = shapesRef.current.map(s => sel.has(s.id) ? shapeDirty({ ...s, ...patch }) : s);
            bumpInk();
            scheduleInkSave('shapes');
          };

          const drawInkStatic = () => {
            const c = inkCanvasRef.current; if (!c) return;
            const { w, h, ctx } = fitInk(c);
            ctx.clearRect(0, 0, w, h);
            const ox = canvasOffset.x, oy = canvasOffset.y, z = zoom;
            ctx.save();
            ctx.translate(ox, oy); ctx.scale(z, z);
            if (legacyCv.current) ctx.drawImage(legacyCv.current, 0, 0);
            // Отсекаем то, чего не видно: доску перерисовываем на каждый шаг
            // зума и панорамы, и платить за штрихи за краем экрана незачем.
            const x0 = -ox / z, y0 = -oy / z, x1 = x0 + w / z, y1 = y0 + h / z;
            // Фигуры ПОД штрихами: фигура — это разметка, штрих — пометка
            // поверх неё. Та, которую сейчас тянут, здесь пропускается —
            // её ведёт верхний слой, чтобы не перерисовывать доску на
            // каждое движение указателя.
            const busy = shapeAct.current ? shapeAct.current.ids : null;
            const typing = editText ? editText.id : null;
            for (const s of shapesRef.current) {
              if (busy && busy.has(s.id)) continue;
              if (s.id === typing) continue;
              const b = shapeBox(s), m = s.sw + 12;
              if (b.x + b.w + m < x0 || b.x - m > x1 || b.y + b.h + m < y0 || b.y - m > y1) continue;
              paintShape(ctx, s);
            }
            for (const s of strokesRef.current) {
              const b = strokeBox(s);
              if (b.x1 < x0 || b.x0 > x1 || b.y1 < y0 || b.y0 > y1) continue;
              paintStroke(ctx, s);
            }
            ctx.restore();
          };

          const drawInkLive = () => {
            const c = liveCanvasRef.current; if (!c) return;
            const { w, h, ctx } = fitInk(c);
            ctx.clearRect(0, 0, w, h);
            const z = zoom;
            const L = live.current;
            if (L && L.pts.length) {
              ctx.save();
              ctx.translate(canvasOffset.x, canvasOffset.y); ctx.scale(z, z);
              if (L.t === 'marker') ctx.globalCompositeOperation = 'screen';
              ctx.globalAlpha = brushAlpha(L.t);
              ctx.fillStyle = L.c;
              ctx.fill(cmdsPath(inkCmds(inkOutline(L.pts, L.w * brushWidthK(L.t), brushThin(L.t), L.jn))));
              ctx.restore();
            }
            // Фигуры, которые сейчас ведут или тянут, живут здесь: нижний
            // слой в это время не трогается вовсе.
            if (shapeDraft.current || shapeAct.current) {
              ctx.save();
              ctx.translate(canvasOffset.x, canvasOffset.y); ctx.scale(z, z);
              if (shapeDraft.current) paintShape(ctx, shapeDraft.current);
              if (shapeAct.current) shapeAct.current.ids.forEach(id => {
                const s = shapesRef.current.find(q => q.id === id);
                if (s) paintShape(ctx, s);
              });
              ctx.restore();
            }
            // Фигура, к которой сейчас притянется конец стрелки. Без
            // подсветки непонятно, привяжется оно или просто ляжет рядом.
            if (bindCand.current) {
              const h = findBind(bindCand.current);
              if (h) {
                const b = shapeBox(h);
                ctx.save();
                ctx.strokeStyle = 'rgba(217,119,87,0.95)'; ctx.lineWidth = 2;
                ctx.strokeRect(b.x * z + canvasOffset.x - 3, b.y * z + canvasOffset.y - 3, b.w * z + 6, b.h * z + 6);
                ctx.restore();
              }
            }
            // Выделение и ручки — в ЭКРАННЫХ координатах: рамка и уголки
            // обязаны быть одного размера при любом масштабе, иначе на
            // мелком зуме в них не попасть пальцем.
            if (wbMode === 'select' && selShapes.length) {
              const toScr = (x, y) => [x * z + canvasOffset.x, y * z + canvasOffset.y];
              ctx.save();
              selShapes.forEach(id => {
                const s = shapesRef.current.find(q => q.id === id);
                if (!s) return;
                const b = shapeBox(s);
                const [px, py] = toScr(b.x, b.y);
                const pw = b.w * z, ph = b.h * z;
                ctx.strokeStyle = 'rgba(217,119,87,0.9)'; ctx.lineWidth = 1;
                ctx.setLineDash([4, 3]);
                ctx.strokeRect(px - 4, py - 4, pw + 8, ph + 8);
                ctx.setLineDash([]);
                shapeHandles(s).forEach(hd => {
                  const [hx, hy] = toScr(hd.x, hd.y);
                  ctx.fillStyle = '#1a1918';
                  ctx.strokeStyle = 'rgba(217,119,87,1)'; ctx.lineWidth = 1.5;
                  ctx.beginPath(); ctx.rect(hx - 4.5, hy - 4.5, 9, 9); ctx.fill(); ctx.stroke();
                });
              });
              ctx.restore();
            }
            // Направляющие: видно, ПО ЧЕМУ встало. Без них притяжка
            // выглядит как «оно само куда-то прыгнуло».
            if (guides.current.length) {
              ctx.save();
              ctx.strokeStyle = 'rgba(217,119,87,0.95)'; ctx.lineWidth = 1;
              ctx.setLineDash([5, 4]);
              guides.current.forEach(g => {
                ctx.beginPath();
                if (g.vertical) {
                  const x = g.at * z + canvasOffset.x;
                  ctx.moveTo(x, g.a * z + canvasOffset.y - 20); ctx.lineTo(x, g.b * z + canvasOffset.y + 20);
                } else {
                  const y = g.at * z + canvasOffset.y;
                  ctx.moveTo(g.a * z + canvasOffset.x - 20, y); ctx.lineTo(g.b * z + canvasOffset.x + 20, y);
                }
                ctx.stroke();
              });
              ctx.restore();
            }
            // Кольцо: сколько именно возьмёт кисть или ластик. У ластика
            // площадь не показывалась вовсе — человек стирал вслепую и не
            // понимал, почему задело соседнюю линию. Радиус растёт вместе
            // с масштабом доски, иначе кольцо врёт.
            const hp = hoverPt.current;
            const er = wbMode === 'erase' || penErase.current;
            if (hp && !isPanning && (wbMode === 'draw' || wbMode === 'erase')) {
              const r = Math.max(2.5, (er ? eraserSize : brushSize * brushWidthK(brushType)) / 2 * z);
              ctx.save();
              // Кольцо рисуется БЕЗ преобразования доски, значит и точку
              // надо брать ЭКРАННУЮ (sx/sy), а не координату на доске.
              // Пока доску не двигали, они совпадают — и ошибка не видна;
              // стоит панорамировать или изменить масштаб, и кольцо уезжает
              // от пера ровно на величину сдвига, хотя стирает по перу.
              // Тёмная подложка — чтобы кольцо читалось и поверх светлого референса
              ctx.beginPath(); ctx.arc(hp.sx, hp.sy, r + 1, 0, Math.PI * 2);
              ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 2.5; ctx.stroke();
              ctx.beginPath(); ctx.arc(hp.sx, hp.sy, r, 0, Math.PI * 2);
              if (er) { ctx.fillStyle = 'rgba(255,255,255,0.10)'; ctx.fill(); }
              ctx.strokeStyle = er ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.6)';
              ctx.lineWidth = 1.25; ctx.stroke();
              ctx.restore();
            }
          };

          // Перерисовку копим до кадра: за один сдвиг пальца прилетает
          // десяток событий, а нарисовать надо один раз.
          const inkRaf = useRef(0);
          const inkNeed = useRef(0);            // 1 — живой слой, 2 — оба
          // Рисовать обязана САМАЯ СВЕЖАЯ пара функций: между заявкой и
          // кадром приложение успевает перерисоваться, и отложенный вызов
          // взял бы устаревшие панораму и масштаб — доска замирала бы
          // на кадр позади пальца.
          const inkDraw = useRef({});
          inkDraw.current = { s: drawInkStatic, l: drawInkLive };
          const requestInk = (both) => {
            inkNeed.current = Math.max(inkNeed.current, both ? 2 : 1);
            if (inkRaf.current) return;
            inkRaf.current = requestAnimationFrame(() => {
              inkRaf.current = 0;
              const need = inkNeed.current; inkNeed.current = 0;
              if (need >= 2) inkDraw.current.s();
              inkDraw.current.l();
            });
          };
          const requestStatic = () => requestInk(true);
          const requestLive = () => requestInk(false);
          const bumpInk = () => requestStatic();

          // Готовый штрих дописываем в нижний слой поверх нарисованного,
          // без полной перерисовки: обычный случай — «провёл линию».
          const paintOnStatic = (s) => {
            const c = inkCanvasRef.current; if (!c) { requestStatic(); return; }
            const ctx = c.getContext('2d');
            ctx.save();
            ctx.translate(canvasOffset.x, canvasOffset.y); ctx.scale(zoom, zoom);
            paintStroke(ctx, s);
            ctx.restore();
          };

          // Ластик режет ЛИНИИ, а не пиксели: точки, попавшие под него,
          // выбрасываются, а штрих распадается на куски. Поэтому стёртое
          // возвращается отменой и не оставляет дыр в подложке.
          const eraseSeg = (x0, y0, x1, y1, r) => {
            const dx = x1 - x0, dy = y1 - y0, l2 = dx * dx + dy * dy;
            const near = (px, py) => {
              let t = l2 > 0 ? ((px - x0) * dx + (py - y0) * dy) / l2 : 0;
              t = Math.max(0, Math.min(1, t));
              return Math.hypot(px - (x0 + dx * t), py - (y0 + dy * t));
            };
            const bx0 = Math.min(x0, x1) - r, bx1 = Math.max(x0, x1) + r;
            const by0 = Math.min(y0, y1) - r, by1 = Math.max(y0, y1) + r;
            const next = []; let hit = false;
            for (const s of strokesRef.current) {
              const b = strokeBox(s);
              if (b.x1 < bx0 || b.x0 > bx1 || b.y1 < by0 || b.y0 > by1) { next.push(s); continue; }
              const pts = strokePts(s);
              const runs = []; let cur = [];
              for (const p of pts) {
                if (near(p[0], p[1]) <= r) { if (cur.length > 1) runs.push(cur); cur = []; }
                else cur.push(p);
              }
              if (cur.length > 1) runs.push(cur);
              if (runs.length === 1 && runs[0].length === pts.length) { next.push(s); continue; }
              hit = true;
              runs.forEach(run => next.push(packStroke(s.t, s.c, s.w, run)));
            }
            if (hit) { strokesRef.current = next; requestStatic(); }
            // Фигуру ластик убирает ЦЕЛИКОМ: половина прямоугольника — это
            // не фигура, а мусор. Возвращается по Ctrl+Z, как и всё стёртое.
            const gone = shapesRef.current.filter(s => !s.ct &&
              (shapeHit(s, x0, y0, r) || shapeHit(s, x1, y1, r) || shapeHit(s, (x0 + x1) / 2, (y0 + y1) / 2, r)));
            if (gone.length) {
              const kill = new Set(gone.map(s => s.id));
              shapesRef.current.forEach(s => { if (s.ct && kill.has(s.ct)) kill.add(s.id); });
              shapesRef.current.forEach(s => {
                if (!isLineKind(s.k) || kill.has(s.id)) return;
                if (kill.has(s.b1)) freezeArrow(s, 'p1');
                if (kill.has(s.b2)) freezeArrow(s, 'p2');
              });
              shapesRef.current = shapesRef.current.filter(s => !kill.has(s.id));
              setSelShapes(sel => sel.filter(id => !kill.has(id)));
              requestStatic();
            }
            // Старую растровую подложку ластик берёт по-прежнему пикселями —
            // иначе на досках, нарисованных до перехода на вектор, он бы
            // просто перестал работать.
            if (legacyHit(x0, y0, x1, y1, r)) {
              holdLegacy();
              const lc = legacyCv.current.getContext('2d');
              lc.save();
              lc.globalCompositeOperation = 'destination-out';
              lc.lineCap = 'round'; lc.lineJoin = 'round';
              lc.lineWidth = r * 2; lc.strokeStyle = 'rgba(0,0,0,1)';
              lc.beginPath(); lc.moveTo(x0, y0); lc.lineTo(x1, y1); lc.stroke();
              lc.restore();
              legacyDirty.current = true;
              requestStatic();
            }
          };

          // Единственная дверь для записи рисунка доски: локальная копия
          // плюс облако. Раньше три места писали в Firestore напрямую —
          // без проверки на режим просмотра и без обработки ошибки, поэтому
          // слишком тяжёлый холст (предел документа — 1 МБ) не сохранялся молча.
          const saveCanvas = (boardId, dataUrl) => {
            if (READ_ONLY) return;
            try {
              if (dataUrl) localStorage.setItem('cf_canvas_draw_' + boardId, dataUrl);
              else localStorage.removeItem('cf_canvas_draw_' + boardId);
            } catch (err) {}
            if (!db || !user) return;
            trackWrite(
              dataRef().collection('canvas').doc(canvasDocId(boardId))
                .set({ dataUrl, lastDrawBy: user.uid })
                .catch(err => {
                  console.warn('saveCanvas', err);
                  showToast('⚠️ Рисунок не сохранился в облако — возможно, он слишком тяжёлый');
                })
            );
          };

          // Векторные штрихи лежат ОТДЕЛЬНЫМ документом от старого растрового
          // рисунка: у каждого свой предел в 1 МБ, и доски, нарисованные до
          // перехода на вектор, открываются ровно как открывались.
          const strokesDocId = (boardId) => `ink-${boardId}`;
          const shapesDocId = (boardId) => `shape-${boardId}`;
          const saveShapes = (boardId, list) => {
            if (READ_ONLY) return;
            const json = packShapes(list);
            try {
              if (list.length) localStorage.setItem('cf_shapes_' + boardId, json);
              else localStorage.removeItem('cf_shapes_' + boardId);
            } catch (err) {}
            if (!db || !user) return;
            trackWrite(
              dataRef().collection('canvas').doc(shapesDocId(boardId))
                .set({ shapes: json, lastDrawBy: user.uid })
                .catch(err => {
                  console.warn('saveShapes', err);
                  showToast('⚠️ Фигуры не сохранились в облако — возможно, их слишком много');
                })
            );
          };
          // Поля перечислены ЯВНО, чтобы в облако не уезжали кэши пути.
          // Добавляя штриху новое поле, впиши его и сюда: `jn` (стыки
          // разрезанной линии) один раз уже терялся при записи, и после
          // перезагрузки длинная линия схлопывалась на каждом стыке.
          const packInk = (list) => JSON.stringify(list.map(s => {
            const o = { id: s.id, t: s.t, c: s.c, w: s.w, p: s.p };
            if (s.jn) o.jn = s.jn;
            return o;
          }));
          const saveStrokes = (boardId, list) => {
            if (READ_ONLY) return;
            const json = packInk(list);
            try {
              if (list.length) localStorage.setItem('cf_ink_' + boardId, json);
              else localStorage.removeItem('cf_ink_' + boardId);
            } catch (err) {}
            if (!db || !user) return;
            trackWrite(
              dataRef().collection('canvas').doc(strokesDocId(boardId))
                .set({ strokes: json, lastDrawBy: user.uid })
                .catch(err => {
                  console.warn('saveStrokes', err);
                  showToast('⚠️ Рисунок не сохранился в облако — слишком много линий');
                })
            );
          };

          // Запись откладываем и, уходя с доски, ДОПИСЫВАЕМ — иначе последний
          // штрих уехал бы в облако уже под именем следующей доски.
          // Дописываем, а не выбрасываем таймер, ради последнего штриха
          // сцены на холсте. Просто снять таймер значило бы потерять
          // последний штрих.
          const inkTimer = useRef(null);
          const inkPending = useRef(null);
          const scheduleInkSave = (what) => {
            const bid = activeBoardId, list = strokesRef.current, figs = shapesRef.current;
            if (inkTimer.current) clearTimeout(inkTimer.current);
            const prev = inkPending.current;
            // Копим, ЧТО именно поменялось: за 400 мс можно успеть и штрих
            // провести, и фигуру подвинуть, а лишняя запись всего списка
            // фигур на каждый штрих — это мегабайты трафика на ровном месте.
            const need = { ink: (prev && prev.ink) || what !== 'shapes', shapes: (prev && prev.shapes) || what === 'shapes' };
            const run = () => { if (need.ink) saveStrokes(bid, list); if (need.shapes) saveShapes(bid, figs); };
            run.ink = need.ink; run.shapes = need.shapes;
            inkPending.current = run;
            inkTimer.current = setTimeout(() => {
              inkTimer.current = null;
              const f = inkPending.current; inkPending.current = null;
              if (f) f();
            }, 400);
          };
          const flushInk = () => {
            if (inkTimer.current) { clearTimeout(inkTimer.current); inkTimer.current = null; }
            const f = inkPending.current; inkPending.current = null;
            if (f) f();
          };

          // Старый растровый рисунок держим отдельным холстом ПОД штрихами.
          // Он создаётся, только если у доски он вообще есть: новые доски
          // за него не платят ничем.
          const loadLegacy = (dataUrl) => {
            legacyUrl.current = dataUrl || null;
            if (!dataUrl) { legacyCv.current = null; legacyMap.current = null; requestStatic(); return; }
            const img = new Image();
            img.onload = () => {
              const cv = document.createElement('canvas');
              cv.width = 4000; cv.height = 4000;
              cv.getContext('2d').drawImage(img, 0, 0);
              legacyCv.current = cv;
              buildLegacyMap(img);
              requestStatic();
            };
            img.src = dataUrl;
          };
          const saveLegacy = () => {
            if (!legacyCv.current) return;
            legacyDirty.current = false;
            const dU = legacyCv.current.toDataURL();
            legacyUrl.current = dU;
            saveCanvas(activeBoardId, dU);
          };

          // Отмена теперь хранит СПИСОК ШТРИХОВ, а не снимок холста
          // 4000×4000: и памяти в сотни раз меньше, и шагов можно держать
          // больше. Растровую подложку снимаем только когда ластик её задел —
          // иначе за каждый штрих платили бы перекодировкой картинки.
          // Шаг отмены ОДИН на весь холст, и любой его кусок может
          // отсутствовать: штрихи, фигуры, растровая подложка, карточки.
          // Иначе одно движение — перетащили карточку вместе с фигурой —
          // распадалось бы на два шага, и Ctrl+Z возвращал бы половину.
          const cardColl = { scene: 'scenes', ref: 'references', sticky: 'stickies', doc: 'docs' };
          // Списки карточек берём через ссылку, а не из замыкания: отмена
          // висит на слушателе клавиатуры, который переустанавливается не на
          // каждую правку, — и «как есть» снималось бы устаревшее. Именно
          // из-за этого шаг вперёд возвращал карточку туда же, откуда её
          // только что вернул шаг назад.
          const cardsRef = useRef({});
          cardsRef.current = { scenes, references, stickies, docs };
          const cardListOf = (coll) => cardsRef.current[coll] || [];
          const cardSetterOf = (coll) => ({ scenes: setScenes, references: setReferences, stickies: setStickies, docs: setDocs })[coll];
          // Снимаем «как есть» по названным записям. `before: null` значит
          // «этой записи не было» — отмена её удалит.
          const grabCards = (items) => (items || []).map(({ coll, id }) => {
            const cur = cardListOf(coll).find(x => x.id === id);
            return { coll, id, before: cur ? { ...cur } : null };
          });
          const pushUndo = (withLegacy, cardItems) => {
            undoStack.current.push({
              list: strokesRef.current,
              figs: shapesRef.current,
              legacy: withLegacy && legacyCv.current ? legacyCv.current.toDataURL() : undefined,
              cards: cardItems && cardItems.length ? grabCards(cardItems) : undefined
            });
            if (undoStack.current.length > 40) undoStack.current.shift();
            redoStack.current = [];
            setCanUndo(true); setCanRedo(false);
          };
          const applyInkSnap = (snap) => {
            const figsChanged = snap.figs !== shapesRef.current;
            strokesRef.current = snap.list;
            shapesRef.current = snap.figs || [];
            // Выделение чистим: вернувшаяся фигура могла быть удалённой,
            // и панель свойств осталась бы висеть над пустотой.
            setSelShapes(sel => sel.filter(id => shapesRef.current.some(s => s.id === id)));
            if (snap.legacy !== undefined) {
              loadLegacy(snap.legacy);
              saveCanvas(activeBoardId, snap.legacy);
            }
            (snap.cards || []).forEach(({ coll, id, before }) => {
              const set = cardSetterOf(coll); if (!set) return;
              if (before) {
                set(prev => prev.some(x => x.id === id) ? prev.map(x => x.id === id ? before : x) : prev.concat([before]));
                syncDoc(coll, id, before);
              } else {
                set(prev => prev.filter(x => x.id !== id));
                deleteNetDoc(coll, id);
              }
            });
            bumpInk();
            saveStrokes(activeBoardId, snap.list);
            if (figsChanged) saveShapes(activeBoardId, shapesRef.current);
          };
          const snapNow = (like) => ({
            list: strokesRef.current,
            figs: shapesRef.current,
            legacy: like.legacy !== undefined ? (legacyCv.current ? legacyCv.current.toDataURL() : null) : undefined,
            cards: like.cards ? grabCards(like.cards) : undefined
          });
          const undoStroke = () => {
            if (!undoStack.current.length) return;
            const snap = undoStack.current.pop();
            redoStack.current.push(snapNow(snap));
            setCanUndo(undoStack.current.length > 0); setCanRedo(true);
            applyInkSnap(snap);
          };
          const redoStroke = () => {
            if (!redoStack.current.length) return;
            const snap = redoStack.current.pop();
            undoStack.current.push(snapNow(snap));
            setCanRedo(redoStack.current.length > 0); setCanUndo(true);
            applyInkSnap(snap);
          };

          // Ctrl+Z — отменить, Ctrl+Shift+Z и Ctrl+Y — вернуть,
          // Delete — удалить выбранные фигуры, Ctrl+] / Ctrl+[ — порядок слоёв
          useEffect(() => {
            const onKey = (e) => {
              if (currentView !== 'whiteboard') return;
              const t = e.target.tagName;
              if (t === 'INPUT' || t === 'TEXTAREA' || e.target.isContentEditable) return;
              const k = e.key.toLowerCase();
              if (e.ctrlKey || e.metaKey) {
                if (k === 'z' || k === 'y') { e.preventDefault(); if (k === 'y' || e.shiftKey) redoStroke(); else undoStroke(); return; }
                if (e.key === ']' || e.key === '[') { e.preventDefault(); orderShapes(e.key === ']' ? 1 : -1); return; }
                if (k === 'g') { e.preventDefault(); if (e.shiftKey) ungroupShapes(); else groupShapes(); return; }
                return;
              }
              if ((e.key === 'Delete' || e.key === 'Backspace') && selShapes.length) { e.preventDefault(); deleteShapes(); return; }
              if (e.key === 'Escape' && selShapes.length) { setSelShapes([]); return; }
            };
            window.addEventListener('keydown', onKey);
            return () => window.removeEventListener('keydown', onKey);
          }, [currentView, activeBoardId, user, selShapes]);

          // Кого сейчас тянем к сцене: {id, type: 'ref' | 'sticky'}.
          // К сценам цепляются и референсы, и заметки — механика одна.
          const [linkingFrom, setLinkingFrom] = useState(null);
          const [mousePos, setMousePos] = useState({ x: 0, y: 0 });
          const [hoveredSceneId, setHoveredSceneId] = useState(null);
          
          const [selectedWbItems, setSelectedWbItems] = useState([]);
          const [selectionBox, setSelectionBox] = useState(null);
          const [draggingWbItems, setDraggingWbItems] = useState(null);
          const [resizingRef, setResizingRef] = useState(null);
          const [resizingSticky, setResizingSticky] = useState(null);

          const [scenePickerOpen, setScenePickerOpen] = useState(false);

          // Положить уже загруженный референс на обычную доску карточкой.
          const putRefOnBoard = (ref) => {
            const placed = { ...ref, boardId: activeBoardId,
              x: (260 - canvasOffset.x) / zoom + Math.random() * 60,
              y: (240 - canvasOffset.y) / zoom + Math.random() * 60 };
            setReferences(references.map(r => r.id === ref.id ? placed : r));
            syncDoc('references', ref.id, placed);
            showToast('Референс на доске');
          };


          // Выделение живёт в пределах одной доски: переключились — сбросили.
          // Иначе на новой доске можно было потащить невидимые чужие элементы.
          useEffect(() => { setSelectedWbItems([]); setScenePickerOpen(false); }, [activeBoardId]);
          // Список сцен и настройки кисти встают в одно и то же место — не даём им наложиться.
          useEffect(() => { if (wbMode === 'draw' || wbMode === 'shape') setScenePickerOpen(false); }, [wbMode]);

          const canvasRef = useRef(null);

          const showToast = (message) => { setToast(message); setTimeout(() => setToast(null), 3500); };
          // Копирование с запасным путём: на старых планшетах и по
          // незащищённому адресу navigator.clipboard недоступен.
          const copyText = (text, message) => {
            const done = () => showToast(message);
            const fallback = () => {
              const t = document.createElement('input');
              t.value = text; document.body.appendChild(t); t.select();
              try { document.execCommand('copy'); done(); } catch (e) { showToast('Не удалось скопировать'); }
              document.body.removeChild(t);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(text).then(done).catch(fallback);
            } else fallback();
          };

          // Авторизация Firebase
          useEffect(() => {
            if (auth) {
              auth.signInAnonymously().catch(err => console.warn("Firebase auth warning:", err));
              const unsub = auth.onAuthStateChanged(u => setUser(u));
              return () => unsub();
            }
          }, []);

          useEffect(() => {
            const handleOnline = () => setIsOnline(true);
            const handleOffline = () => setIsOnline(false);
            window.addEventListener('online', handleOnline);
            window.addEventListener('offline', handleOffline);
            // Положение указателя нужно ТОЛЬКО пока тянут связь — им рисуется
            // линия за пальцем. Раньше оно писалось в состояние на каждое
            // движение указателя где угодно, то есть всё приложение
            // перерисовывалось десятки раз в секунду просто от движения мыши.
            // На доске это ещё и ломало панораму: перерисовка возвращала
            // карточкам старое положение поверх только что выставленного.
            const handleMouseMove = (e) => {
                if (!linkingFrom) return;
                setMousePos({ x: e.clientX, y: e.clientY });
                const el = document.elementFromPoint(e.clientX, e.clientY);
                // Цель — ЛЮБАЯ карточка, а не только сцена: кружок на краю
                // карточки и есть тот жест, которым связывают. Раньше он
                // принимал одну лишь сцену, и потянув от заметки к заметке
                // человек не получал ничего — связь просто не возникала.
                const t = el && el.closest ? el.closest('[data-card-id]') : null;
                const id = t ? t.getAttribute('data-card-id') : null;
                if (id) { setHoveredSceneId(id !== linkingFrom.id ? id : null); bindCand.current = null; }
                else {
                  // Под пальцем не карточка — может быть надпись или фигура.
                  // Они нарисованы на холсте, в разметке их нет вовсе,
                  // поэтому ищем по геометрии и подсвечиваем на холсте.
                  const p = inkPt(e.clientX, e.clientY);
                  const sh = bindAt(p.x, p.y);
                  bindCand.current = (sh && sh.id !== linkingFrom.id) ? sh.id : null;
                  setHoveredSceneId(null);
                }
                requestLive();
            };
            window.addEventListener('pointermove', handleMouseMove);
            return () => { window.removeEventListener('online', handleOnline); window.removeEventListener('offline', handleOffline); window.removeEventListener('pointermove', handleMouseMove); };
          }, [linkingFrom]);

          useEffect(() => {
              const savedName = localStorage.getItem('cf_user_name');
              const savedRole = localStorage.getItem('cf_user_role');
              if (!savedName) { setShowWelcome(true); } else { setUserName(savedName); setUserRole(savedRole || 'Оператор-постановщик'); }
          }, []);

          useEffect(() => { if (showChat) { const now = Date.now(); setLastReadChat(now); localStorage.setItem('cf_last_read', now); } }, [showChat, messages]);

          const unreadCount = useMemo(() => messages.filter(m => m.timestamp > lastReadChat && (m.senderId ? m.senderId !== clientId : m.senderName !== userName)).length, [messages, lastReadChat, userName, clientId]);

          // Счётчик непрочитанных в заголовке вкладки
          useEffect(() => { document.title = (unreadCount > 0 ? '(' + unreadCount + ') ' : '') + 'CineFlow Prep'; }, [unreadCount]);

          // Браузерные уведомления о новых сообщениях (когда вкладка в фоне или чат закрыт).
          //
          // Считать «новое» по КОЛИЧЕСТВУ сообщений было нельзя. При запуске
          // список пуст, и когда из облака приезжали все 50 старых сообщений,
          // это выглядело как «пришло 50 новых» — выскакивало уведомление
          // о давно прочитанном. На iPad установленное приложение выгружается
          // из памяти постоянно, поэтому оно повторялось раз за разом.
          //
          // Теперь считаем по ВРЕМЕНИ и помним рубеж между запусками. Заодно
          // учитываем момент последнего чтения чата: о прочитанном не напоминаем.
          const notifiedUpTo = useRef(Math.max(
            Number(localStorage.getItem('cf_notified_upto')) || 0,
            Number(localStorage.getItem('cf_last_read')) || 0));
          const rememberNotified = (ts) => {
            notifiedUpTo.current = Math.max(notifiedUpTo.current, ts);
            try { localStorage.setItem('cf_notified_upto', String(notifiedUpTo.current)); } catch (e) {}
          };
          useEffect(() => {
            const maxTs = messages.reduce((m, x) => Math.max(m, Number(x.timestamp) || 0), 0);
            // Первый ответ облака — загрузка чата, о нём не уведомляем.
            if (msgBatch.current <= 1) { if (maxTs) rememberNotified(maxTs); return; }
            if (!messages.length) return;
            const fresh = messages.filter(m => (Number(m.timestamp) || 0) > notifiedUpTo.current && m.senderId !== clientId);
            rememberNotified(maxTs);
            if (!fresh.length) return;
            if ((document.hidden || !showChat) && 'Notification' in window && Notification.permission === 'granted') {
              const m = fresh[fresh.length - 1];
              try { new Notification(m.senderName + ' — ' + (m.senderRole || ''), { body: m.text, tag: 'cineflow-chat' }); } catch (e) {}
            }
          }, [messages, showChat, clientId]);

          const [geminiKey, setGeminiKeyRaw] = useState(() => localStorage.getItem('cf_gemini_key') || '');
          const saveGeminiKey = (v) => { setGeminiKeyRaw(v); localStorage.setItem('cf_gemini_key', v.trim()); };
          const [showGeminiKey, setShowGeminiKey] = useState(true);

          // --- Внешнее хранилище фотографий ---
          // Настройки лежат в localStorage (см. CLOUD_KEY): это ключи от
          // ЛИЧНОГО облака, и в общей комнате им не место.
          const [cloudCfg, setCloudCfgRaw] = useState(() => loadCloudCfg());
          const patchCloud = (patch) => setCloudCfgRaw(prev => saveCloudCfg({ ...prev, ...patch }));
          const [showCloudModal, setShowCloudModal] = useState(false);
          // Объяснение режима просмотра. Живёт даже когда READ_ONLY —
          // это единственное окно, которое там вообще открывается.
          const [showViewInfo, setShowViewInfo] = useState(false);
          // Последняя ошибка облака показывается целиком: без неё человек
          // видит «не получилось» и не может ничего сделать, а в ответе
          // сервера обычно прямо написано, чего не хватает.
          const [cloudError, setCloudError] = useState('');
          const [cloudBusy, setCloudBusy] = useState('');

          // Возврат из окна разрешения. Dropbox приводит обратно с ?code=,
          // Яндекс — с #access_token= в самом адресе (на сервер эта часть
          // не уходит вовсе, поэтому так и сделано). Разбираем оба и
          // сразу чистим адресную строку: ключ не должен остаться
          // в истории браузера и в закладках.
          useEffect(() => {
            const qs = new URLSearchParams(location.search);
            const code = qs.get('code');
            const hash = new URLSearchParams(String(location.hash || '').replace(/^#/, ''));
            const ytok = hash.get('access_token');
            if (!code && !ytok) return;
            const clean = () => { try { history.replaceState(null, '', cloudRedirect()); } catch (e) {} };
            if (ytok) {
              const life = parseInt(hash.get('expires_in') || '0', 10);
              patchCloud({ provider: 'yandex', token: ytok, expires: life ? Date.now() + life * 1000 : 0 });
              clean(); setShowCloudModal(true);
              showToast('Яндекс.Диск подключён');
              return;
            }
            const cfg = loadCloudCfg();
            const verifier = localStorage.getItem('cf_cloud_pkce') || '';
            clean();
            if (!verifier || !cfg.appKey) { showToast('Не удалось завершить подключение Dropbox'); return; }
            (async () => {
              try {
                const res = await fetch('https://api.dropboxapi.com/oauth2/token', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                  body: new URLSearchParams({
                    code, grant_type: 'authorization_code', client_id: cfg.appKey,
                    code_verifier: verifier, redirect_uri: cloudRedirect()
                  })
                });
                if (!res.ok) await cloudErr(res, 'Dropbox не выдал ключ');
                const j = await res.json();
                patchCloud({
                  provider: 'dropbox', token: j.access_token, refresh: j.refresh_token || '',
                  expires: Date.now() + (j.expires_in || 14400) * 1000
                });
                showToast('Dropbox подключён');
              } catch (err) {
                setCloudError(err.message || String(err));
                showToast('⚠️ Не удалось подключить Dropbox');
              } finally {
                localStorage.removeItem('cf_cloud_pkce');
                setShowCloudModal(true);
              }
            })();
          }, []);

          const connectDropbox = async () => {
            const cfg = loadCloudCfg();
            if (!cfg.appKey) { setCloudError('Сначала впишите ключ приложения (App key)'); return; }
            // Подпись запроса умеет только защищённое соединение. По адресу
            // на https (а приложение живёт на нём) всё в порядке; сообщение
            // нужно тем, кто открыл файл с диска — иначе они увидели бы
            // невнятную ошибку про undefined.
            if (!window.crypto || !crypto.subtle) {
              setCloudError('Подключить Dropbox можно только с сайта по адресу https://, а не из файла, открытого с диска.');
              return;
            }
            try {
              const verifier = randomVerifier();
              localStorage.setItem('cf_cloud_pkce', verifier);
              const u = new URL('https://www.dropbox.com/oauth2/authorize');
              u.searchParams.set('client_id', cfg.appKey);
              u.searchParams.set('response_type', 'code');
              u.searchParams.set('code_challenge', await pkceChallenge(verifier));
              u.searchParams.set('code_challenge_method', 'S256');
              // offline — чтобы вместе с ключом приехал долгий refresh_token:
              // без него связь отваливалась бы каждые четыре часа.
              u.searchParams.set('token_access_type', 'offline');
              u.searchParams.set('redirect_uri', cloudRedirect());
              location.href = u.toString();
            } catch (err) { setCloudError(err.message || String(err)); }
          };
          const connectYandex = () => {
            const cfg = loadCloudCfg();
            if (!cfg.clientId) { setCloudError('Сначала впишите ClientID приложения'); return; }
            const u = new URL('https://oauth.yandex.ru/authorize');
            u.searchParams.set('response_type', 'token');
            u.searchParams.set('client_id', cfg.clientId);
            u.searchParams.set('redirect_uri', cloudRedirect());
            location.href = u.toString();
          };
          const checkCloud = async () => {
            setCloudBusy('check'); setCloudError('');
            try {
              const who = await cloudCheck(loadCloudCfg());
              showToast(`${CLOUD_NAMES[loadCloudCfg().provider]}: связь есть · ${who}`);
            } catch (err) {
              setCloudError(err.message || String(err));
              showToast('⚠️ Связи с облаком нет');
            }
            setCloudBusy('');
          };
          // --- Проверка всей цепочки целиком ---
          // «Проверить связь» отвечает только на вопрос «приняли ли ключ».
          // А ломается обычно дальше: не отмечены разрешения, облако не
          // даёт публичную ссылку, ссылка есть — но картинка по ней не
          // открывается, и группа фотографий не увидит. Поэтому здесь
          // проходим весь путь настоящей фотографии и показываем, на
          // каком шаге всё встало.
          const [cloudTest, setCloudTest] = useState(null);
          const makeTestImage = () => new Promise(resolve => {
            const c = document.createElement('canvas');
            c.width = c.height = 64;
            const x = c.getContext('2d');
            x.fillStyle = '#d97757'; x.fillRect(0, 0, 64, 64);
            x.fillStyle = '#1a1918'; x.font = 'bold 22px sans-serif'; x.fillText('CF', 12, 40);
            c.toBlob(b => resolve(b), 'image/jpeg', 0.85);
          });
          const runCloudTest = async () => {
            const cfg = loadCloudCfg();
            if (!cfg.provider) return;
            setCloudBusy('test'); setCloudError('');
            const steps = [];
            const step = (name, ok, note) => { steps.push({ name, ok, note }); setCloudTest([...steps]); };
            let full = '';
            try {
              const blob = await makeTestImage();
              const res = await cloudUpload(cfg, blob, 'cineflow-test.jpg');
              full = res.full;
              step('Облако приняло файл', true, res.path);
              step('Публичная ссылка получена', true, full);
            } catch (err) {
              const msg = err && err.message ? err.message : String(err);
              step('Облако приняло файл', false, msg);
              setCloudError(msg); setCloudBusy('');
              return;
            }
            try {
              // У Яндекса прямой адрес живёт недолго и лежит в памяти —
              // для честной проверки берём свежий.
              ydCache.delete(full);
              const direct = await cloudDirectUrl({ full, url: '', cloud: { provider: cfg.provider } });
              const shown = await new Promise(resolve => {
                const im = new Image();
                const t = setTimeout(() => resolve(false), 20000);
                im.onload = () => { clearTimeout(t); resolve(true); };
                im.onerror = () => { clearTimeout(t); resolve(false); };
                im.src = direct;
              });
              step('Фотография открывается по ссылке', shown,
                   shown ? 'её увидит вся группа, даже без настройки'
                         : 'ссылка есть, но картинка по ней не открывается — группа фотографий не увидит');
              if (!shown) setCloudError('Публичная ссылка получена, но изображение по ней не загрузилось: ' + full);
            } catch (err) {
              const msg = err && err.message ? err.message : String(err);
              step('Фотография открывается по ссылке', false, msg);
              setCloudError(msg);
            }
            setCloudBusy('');
          };

          const disconnectCloud = () => {
            setCloudCfgRaw(saveCloudCfg({ provider: '' }));
            setCloudError('');
            showToast('Облако отключено · новые фото снова хранятся в проекте');
          };

          // --- Перенос уже загруженных фотографий ---
          // Идёт по одной и не трогает то, что уже в облаке. Прерывается
          // кнопкой: на сотне фотографий с телефона это долго, и запирать
          // человека в этом окне нельзя.
          const migrateStop = useRef(false);
          const [migrate, setMigrate] = useState(null); // {done, total, failed}
          const localRefs = useMemo(
            () => references.filter(r => !r.full && String(r.url || '').startsWith('data:')),
            [references]);
          const migrateToCloud = async () => {
            const cfg = loadCloudCfg();
            if (!cfg.provider) { setCloudError('Сначала подключите облако'); return; }
            const list = references.filter(r => !r.full && String(r.url || '').startsWith('data:'));
            if (!list.length) { showToast('Переносить нечего — всё уже в облаке'); return; }
            migrateStop.current = false;
            setMigrate({ done: 0, total: list.length, failed: 0 });
            let done = 0, failed = 0;
            for (const ref of list) {
              if (migrateStop.current) break;
              try {
                const blob = dataUrlToBlob(ref.url);
                const { full, path } = await cloudUpload(cfg, blob, cloudFileName(ref.id, ref.label || 'photo.jpg'));
                // Превью пересобираем из того же изображения: в базе
                // должно остаться лёгкое, ради этого перенос и затевался.
                const thumb = await new Promise(res => compressImage(ref.url, CLOUD_THUMB, CLOUD_THUMB, res, 0.72));
                setReferences(prev => {
                  const up = prev.map(r => r.id === ref.id
                    ? { ...r, full, url: thumb || r.url, cloud: { provider: cfg.provider, path } } : r);
                  const t = up.find(r => r.id === ref.id);
                  if (t) syncDoc('references', ref.id, t);
                  return up;
                });
                done++;
              } catch (err) {
                failed++;
                console.warn('Перенос в облако:', err);
                setCloudError(err.message || String(err));
              }
              setMigrate({ done, total: list.length, failed });
            }
            setMigrate(null);
            showToast(failed
              ? `Перенесено ${done}, не вышло ${failed} — эти остались в проекте`
              : `Перенесено в облако: ${done} шт.`);
          };

          const callGeminiAI = async (promptText, isAgent = false) => {
            if (!geminiKey.trim()) { showToast("🔑 Укажите ключ Gemini API в меню «Проект»."); return null; }
            try {
              const systemInstruction = isAgent 
                ? "Ты ИИ-агент Второго Режиссера. Твоя задача — распарсить текст КПП и выдать ТОЛЬКО чистый массив JSON. Ищи дату съемки и переводи в формат YYYY-MM-DD. Дата применяется ко всем сценам ниже. Ищи номер сцены. Объект и время суток ставь в title. Описание ставь в content. Никакого текста кроме JSON массива [{}]." 
                : "Ты голливудский сценарист и оператор-постановщик. Помогай описывать сцены и световой сетап.";

              const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent`, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': geminiKey.trim() }, body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }], systemInstruction: { parts: [{ text: systemInstruction }] } })
              });
              const result = await response.json();
              if (!response.ok) { console.error(result); showToast("❌ Ошибка ИИ: " + (result?.error?.message || response.status)); return null; }
              return result.candidates?.[0]?.content?.parts?.[0]?.text || '';
            } catch (err) { console.error(err); showToast("Ошибка сети при вызове ИИ."); return null; }
          };

          const handleAIAgentFile = async (e) => {
            const file = e.target.files[0]; if (!file) return;
            setIsAILoading(true); showToast("🤖 Агент читает документ КПП...");
            const reader = new FileReader();
            reader.onload = async (event) => {
              let textContent = "";
              try {
                if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls') || file.name.endsWith('.csv')) {
                  const data = new Uint8Array(event.target.result); const workbook = XLSX.read(data, {type: 'array'});
                  const rawArray = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], {header: 1, defval: ""});
                  const cleanArray = rawArray.filter(row => row.some(cell => String(cell).trim() !== ""));
                  textContent = JSON.stringify(cleanArray);
                } else { textContent = new TextDecoder("utf-8").decode(event.target.result); }
                if (!textContent.trim() || textContent === "[]") throw new Error("Empty file");
                showToast("✨ Агент структурирует сцены...");
                const promptText = `Распарси этот 2D-массив (строки таблицы Excel). \nФормат нужного JSON:\n[ { "number": "2-1", "title": "ИНТ. ОФИС - ДЕНЬ", "date": "2026-06-29", "content": "Описание" } ]\n\nДанные:\n${textContent.substring(0, 15000)}`;
                const aiResponse = await callGeminiAI(promptText, true);
                if (aiResponse) {
                  const match = aiResponse.match(/\[[\s\S]*\]/); 
                  if (match) {
                    const parsed = JSON.parse(match[0]);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                      const newScenes = parsed.map((ps, idx) => ({ id: `scene-${Date.now()}-${idx}`, number: ps.number || String(scenes.length + idx + 1), title: ps.title || 'Сцена', content: ps.content || '', boardId: '', x: (150 - canvasOffset.x) / zoom + (idx * 40), y: (150 - canvasOffset.y) / zoom + (idx * 40), date: ps.date || '', gear: {}, lightGear: {}, lightSchemeId: null }));
                      setScenes([...scenes, ...newScenes]); newScenes.forEach(ns => syncDoc('scenes', ns.id, ns)); showToast(`✅ Агент успешно импортировал ${newScenes.length} сцен!`);
                    } else { showToast("❌ Агент не обнаружил сцен."); }
                  } else { showToast("❌ Ошибка ответа ИИ."); }
                }
