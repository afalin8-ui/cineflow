                    <h3 className="text-xl font-extrabold text-white mb-6 flex items-center gap-2"><Icons.Folder/> Управление проектом</h3>
                    <div className="space-y-3">
                      <div className="mb-2">
                        <label className="text-xs text-zinc-400 font-semibold block mb-1.5 ml-1">Ключ Gemini API (для ИИ-функций)</label>
                        <div className="relative">
                          <input type={showGeminiKey ? "text" : "password"} value={geminiKey} onChange={e => saveGeminiKey(e.target.value)} placeholder="AIza..." autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck="false" data-lpignore="true" data-1p-ignore="true" name="cf-gemini-api-key" className="w-full glass-input rounded-xl px-4 py-3 pr-12 text-sm font-mono" />
                          <button type="button" onClick={() => setShowGeminiKey(v => !v)} className="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-zinc-200 text-xs font-semibold px-2 py-1 rounded-md hover:bg-white/5 transition-colors">{showGeminiKey ? "Скрыть" : "Показать"}</button>
                        </div>
                        <p className="text-[11px] text-zinc-500 mt-1.5 ml-1">Получить бесплатно: <a href="https://aistudio.google.com/apikey" target="_blank" className="text-indigo-400 hover:underline">aistudio.google.com/apikey</a></p>
                      </div>
                      <button onClick={() => {
                        const d = { scenes, storyboard, references, stickies, docs, crew, gearTypes, lightGearTypes, lightSchemes, projectFiles, canvasData: localStorage.getItem('cf_canvas_draw') || '' };
                        const url = URL.createObjectURL(new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' })); const a = document.createElement('a'); a.href = url; a.download = `CineFlow_Backup_${new Date().toISOString().split('T')[0]}.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
                        showToast("Резервная копия проекта сохранена!");
                      }} className="w-full py-4 bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-200 rounded-xl text-sm font-extrabold transition-all">💾 Экспортировать бэкап (JSON)</button>
                      
                      <label className="w-full py-4 glass-panel hover:bg-white/10 text-zinc-300 rounded-xl text-sm font-extrabold transition-colors cursor-pointer text-center block border border-white/10">
                        <span>📂 Импортировать из JSON</span>
                        <input type="file" accept=".json" onChange={(e) => {
                          const f = e.target.files[0]; if (!f) return; const r = new FileReader();
                          r.onload = (ev) => {
                            try { const d = JSON.parse(ev.target.result); if (d.scenes) setScenes(d.scenes); if (d.storyboard) setStoryboard(d.storyboard); if (d.references) setReferences(d.references); if (d.stickies) setStickies(d.stickies); if (d.docs) setDocs(d.docs); if (d.crew) setCrew(d.crew); if (d.gearTypes) setGearTypes(d.gearTypes); if(d.lightGearTypes) setLightGearTypes(d.lightGearTypes); if(d.lightSchemes) setLightSchemes(d.lightSchemes); if (d.projectFiles) setProjectFiles(d.projectFiles); if (d.canvasData) { localStorage.setItem('cf_canvas_draw', d.canvasData); const c = paintCanvasRef.current; if (c) { const ctx = c.getContext('2d'); ctx.clearRect(0, 0, c.width, c.height); const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0); img.src = d.canvasData; } } setShowProjectModal(false); showToast("Проект успешно восстановлен!"); } catch (err) { showToast("Ошибка структуры файла JSON!"); }
                          }; r.readAsText(f);
                        }} className="hidden" />
                      </label>
                      
                      <button onClick={() => setConfirmAction({title:'Сбросить все данные?', message:'Создать абсолютно новый чистый проект?', onConfirm:()=>{
                        setScenes(initialScenes); setStoryboard([]); setReferences([]); setStickies([]); setDocs(initialDocs); setCrew([]); setGearTypes({ steadicam: { label: 'Стедикам' }, crane: { label: 'Кран' }, drone: { label: 'Коптер' } }); setLightGearTypes({ arri600: { label: 'ARRI Skypanel 600' }, astera: { label: 'Astera Titan Tube' }, aputure: { label: 'Aputure 300d' } }); setLightSchemes([]); setProjectFiles([]); const c = paintCanvasRef.current; if (c) { c.getContext('2d').clearRect(0, 0, c.width, c.height); localStorage.removeItem('cf_canvas_draw'); } setShowProjectModal(false); showToast("Создан чистый проект");
                      }})} className="w-full mt-4 py-4 bg-red-900/30 hover:bg-red-900/50 text-red-300 border border-red-500/30 rounded-xl text-sm font-extrabold transition-colors">Сбросить всё (Новый проект)</button>
                    </div>
                  </div>
                </div>
              )}

              {showAgentModal && (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[200] p-4">
                  <div className="glass-panel rounded-xl p-8 max-w-lg w-full relative max-h-[90vh] overflow-y-auto">
                    <button onClick={() => setShowAgentModal(false)} className="absolute top-5 right-5 w-8 h-8 flex items-center justify-center bg-white/5 hover:bg-red-500/20 hover:text-red-400 rounded-full text-zinc-400 font-bold transition-colors">✕</button>
                    <h3 className="text-xl font-extrabold text-white mb-4 flex items-center gap-2"><Icons.Bot/> ИИ-Агент импорта КПП</h3>
                    
                    <div className="space-y-6">
                      <div className="bg-black/40 p-4 rounded-xl border border-white/10">
                        <h4 className="text-sm font-bold text-indigo-300 mb-2">Загрузка файла таблицы (.xlsx / .csv)</h4>
                        <p className="text-xs text-zinc-400 mb-3">Загрузите файл КПП от Второго Режиссера, и ИИ распарсит матрицу смен и сцен.</p>
                        <label className="w-full bg-indigo-600/40 hover:bg-indigo-600/60 text-indigo-100 px-4 py-3 rounded-xl text-sm font-semibold transition-colors cursor-pointer flex items-center justify-center gap-2">
                          {isAILoading ? '⏳ Обработка нейросетью...' : '📁 Выбрать КПП (.xlsx / .csv)'}
                          <input type="file" accept=".xlsx,.xls,.csv,.txt" className="hidden" onChange={(e) => { handleAIAgentFile(e); setShowAgentModal(false); }} disabled={isAILoading} />
                        </label>
                      </div>

                      <div className="bg-black/40 p-4 rounded-xl border border-white/10">
                        <h4 className="text-sm font-bold text-emerald-400 mb-2">Ручной импорт JSON</h4>
                        <p className="text-xs text-zinc-400 mb-3">Скопируйте массив сцен и вставьте в поле ниже:</p>
                        <textarea value={manualJsonInput} onChange={(e) => setManualJsonInput(e.target.value)} placeholder='[{"number":"1","title":"ИНТ. ОФИС - ДЕНЬ","date":"2026-06-29","content":"Описание..."}]' className="w-full h-24 glass-input rounded-xl p-3 text-xs resize-none mb-3 font-mono text-zinc-300" />
                        <button 
                          onClick={() => {
                            try {
                              let text = manualJsonInput.trim(); if (!text) return;
                              const match = text.match(/\[[\s\S]*\]/); if (match) text = match[0];
                              const parsed = JSON.parse(text);
                              if (Array.isArray(parsed) && parsed.length > 0) {
                                const newScenes = parsed.map((ps, idx) => ({ id: `scene-${Date.now()}-${idx}`, number: ps.number || String(scenes.length + idx + 1), title: ps.title || 'Сцена', content: ps.content || '', x: (150 - canvasOffset.x) / zoom + (idx * 40), y: (150 - canvasOffset.y) / zoom + (idx * 40), date: ps.date || '', gear: {}, lightGear: {}, lightSchemeId: null }));
                                setScenes([...scenes, ...newScenes]); newScenes.forEach(ns => syncDoc('scenes', ns.id, ns)); showToast(`✅ Импортировано ${newScenes.length} сцен!`); setShowAgentModal(false); setManualJsonInput('');
                              } else { showToast("❌ Массив сцен пуст."); }
                            } catch (e) { showToast("❌ Ошибка формата JSON."); }
                          }}
                          className="w-full bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2.5 rounded-xl text-sm font-semibold transition-colors"
                        >Импортировать сцены</button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {drawingFrameId && (
                  <DrawingModal onClose={() => setDrawingFrameId(null)} onSave={(dataUrl) => {
                        const up = storyboard.map(x=>x.id===drawingFrameId?{...x,image:dataUrl}:x); 
                        setStoryboard(up); syncDoc('storyboard', drawingFrameId, up.find(x=>x.id===drawingFrameId));
                        setDrawingFrameId(null);
                  }} />
              )}
              
              {drawingSchemeId && currentView === 'docs' && lightSchemes.find(s=>s.id === drawingSchemeId) && (
                  <LightSchemeEditor scheme={lightSchemes.find(s=>s.id === drawingSchemeId)} onClose={() => setDrawingSchemeId(null)} onSave={(id, els, draw, preview) => {
                      const up = lightSchemes.map(s=>s.id===id?{...s, elements: els, drawData: draw, preview: preview}:s);
                      setLightSchemes(up); syncDoc('lightSchemes', id, up.find(s=>s.id===id));
                      setDrawingSchemeId(null);
                  }} />
              )}

              {lightboxData && (
                  <Lightbox refs={references.filter(r => lightboxData.sceneId ? r.sceneId === lightboxData.sceneId : true)} initialId={lightboxData.currentId} onClose={() => setLightboxData(null)} />
              )}

              {/* Печатная версия (кнопка «Сформировать PDF») */}
              <div id="print-area">
                <h1 style={{fontSize: '22pt', fontWeight: 900, margin: '0 0 2pt'}}>CineFlow — План подготовки к съёмкам</h1>
                <p style={{fontSize: '10pt', color: '#555', margin: '0 0 14pt'}}>Сформировано: {new Date().toLocaleDateString('ru-RU')} · Сцен: {scenes.length}</p>
                {[...scenes].sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999') || String(a.number).localeCompare(String(b.number), undefined, {numeric: true})).map(s => {
                  const pFrames = storyboard.filter(f => f.sceneId === s.id);
                  return (
                    <div key={s.id} className="print-scene">
                      <h2 style={{fontSize: '14pt', fontWeight: 800, margin: '0 0 4pt'}}>Сцена #{s.number} — {s.title || 'Без названия'}</h2>
                      <p style={{fontSize: '10pt', color: '#555', margin: '0 0 6pt'}}>Смена: {s.date ? formatDateDisplay(s.date) : 'не назначена'}</p>
                      {s.content && <p style={{fontSize: '11pt', margin: '0 0 8pt', whiteSpace: 'pre-wrap'}}>{s.content}</p>}
                      {Object.keys(s.gear || {}).length > 0 && <p style={{fontSize: '10pt', margin: '0 0 4pt'}}><b>Техника:</b> {Object.entries(s.gear).map(([k, v]) => `${((gearTypes || {})[k] || {label: k}).label} × ${v}`).join(', ')}</p>}
                      {Object.keys(s.lightGear || {}).length > 0 && <p style={{fontSize: '10pt', margin: '0 0 8pt'}}><b>Свет:</b> {Object.entries(s.lightGear).map(([k, v]) => `${((lightGearTypes || {})[k] || {label: k}).label} × ${v}`).join(', ')}</p>}
                      {pFrames.length > 0 && (
                        <div style={{display: 'flex', flexWrap: 'wrap', gap: '8pt'}}>
                          {pFrames.map(f => (
                            <div key={f.id} style={{width: '30%', fontSize: '9pt'}}>
                              {f.image && <img src={f.image} style={{width: '100%', border: '1px solid #ccc'}} />}
                              <div><b>{f.frameNum}</b> {f.description}</div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })}
                {crew.length > 0 && (
                  <div style={{marginTop: '16pt'}}>
                    <h2 style={{fontSize: '14pt', fontWeight: 800}}>Съёмочная группа</h2>
                    <table style={{width: '100%', borderCollapse: 'collapse', fontSize: '10pt'}}>
                      <tbody>
                        {crew.map(c => (<tr key={c.id}><td style={{border: '1px solid #ccc', padding: '4pt'}}>{c.name}</td><td style={{border: '1px solid #ccc', padding: '4pt'}}>{c.role}</td><td style={{border: '1px solid #ccc', padding: '4pt'}}>{c.phone}</td></tr>))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><AppCore /></ErrorBoundary>);
    </script>
</body>
</html>
