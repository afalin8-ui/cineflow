                                           borderBottom: on ? '2px solid var(--accent)' : '2px solid transparent',
                                           color: on ? 'var(--text)' : 'var(--muted-2)', fontSize: 12.5 }}>
                            {b.title}
                            {on && sortedBoards.length > 1 && (
                              <span onClick={(e) => {
                                      e.stopPropagation();
                                      setConfirmAction({ title: 'Удалить доску?', message: `«${b.title}» и всё, что на ней нарисовано и разложено.`, onConfirm: () => {
                                        const rest = boards.filter(x => x.id !== b.id);
                                        setBoards(rest); deleteNetDoc('boards', b.id);
                                        stickies.filter(st => belongsToBoard(st, b.id)).forEach(st => deleteNetDoc('stickies', st.id));
                                        setStickies(stickies.filter(st => !belongsToBoard(st, b.id)));
                                        setReferences(references.map(r => r.boardId === b.id ? { ...r, boardId: '' } : r));
                                        references.filter(r => r.boardId === b.id).forEach(r => syncDoc('references', r.id, { ...r, boardId: '' }));
                                        // Сцены с удалённой доски просто снимаем — сами сцены остаются в проекте
                                        setScenes(scenes.map(s => s.boardId === b.id ? { ...s, boardId: '' } : s));
                                        scenes.filter(s => s.boardId === b.id).forEach(s => syncDoc('scenes', s.id, { ...s, boardId: '' }));
                                        try { localStorage.removeItem('cf_canvas_draw_' + b.id); } catch (err) {}
                                        deleteNetDoc('canvas', canvasDocId(b.id));
                                        setActiveBoardId((rest[0] || DEFAULT_BOARD).id);
                                        showToast('Доска удалена · референсы остались в галерее');
                                      }});
                                    }}
                                    title="Удалить доску"
                                    style={{ color: 'var(--muted-2)', fontSize: 13, lineHeight: 1 }}>✕</span>
                            )}
                          </button>
                        );
                      })}
                      <button onClick={() => {
                                const nb = { id: `board-${Date.now()}`, title: `Доска ${sortedBoards.length + 1}`, order: sortedBoards.length };
                                setBoards([...boards, nb]); syncDoc('boards', nb.id, nb); setActiveBoardId(nb.id);
                              }}
                              title="Новая доска"
                              className="shrink-0 flex items-center justify-center transition-colors hover:bg-white/5"
                              style={{ width: 40, minHeight: 40, marginBottom: 2, borderRadius: 8, border: '1px solid var(--border)', color: 'var(--muted)', fontSize: 16 }}>+</button>

                      {/* Пробный движок: включается у каждой доски отдельно.
                          Старый рисунок остаётся на месте и вернётся, если выключить. */}
                      <button onClick={toggleExcalidraw}
                              title={excOn
                                ? 'Вернуть обычную кисть. Нарисованное в Excalidraw останется и вернётся при повторном включении'
                                : 'Пробный режим: рисование инструментами Excalidraw — фигуры, стрелки, текст. Библиотека скачается один раз, около 4 МБ'}
                              className="cf-edit-only shrink-0 flex items-center gap-1.5 transition-colors ml-auto"
                              style={{ padding: '0 12px', minHeight: 34, marginBottom: 3, borderRadius: 8, fontSize: 11,
                                       border: '1px solid ' + (excOn ? 'var(--accent)' : 'var(--border)'),
                                       background: excOn ? 'var(--accent)' : 'transparent',
                                       color: excOn ? 'var(--bg)' : 'var(--muted-2)' }}>
                        <Icons.Pen /> Excalidraw
                      </button>
                    </div>

                    <div id="whiteboard-canvas" className={`w-full flex-1 min-h-0 cf-canvas relative overflow-hidden ${excOn && wbMode !== 'select' ? 'cf-exc-draw' : ''}`}
                    onWheel={(e) => {
                        // В режиме Excalidraw масштабом заведует он сам —
                        // два независимых зума разъехались бы.
                        if (excOn) return;
                        const rect = e.currentTarget.getBoundingClientRect();
                        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
                        const nz = Math.min(2.0, Math.max(0.3, zoom * (e.deltaY > 0 ? 0.9 : 1.1)));
                        const k = nz / zoom;
                        setCanvasOffset({ x: mx - (mx - canvasOffset.x) * k, y: my - (my - canvasOffset.y) * k });
                        setZoom(nz);
                    }}
                    onDragOver={(e) => e.preventDefault()}
                    onDrop={(e) => {
                        e.preventDefault();
                        // Кладём туда, куда бросили, и на открытую доску. Раньше
                        // картинка молча уезжала в галерею, а на доске ничего
                        // не появлялось — выглядело как «перетаскивание не работает».
                        const rect = canvasRef.current.getBoundingClientRect();
                        handleMultiFileUpload(e.dataTransfer.files, null, {
                            boardId: activeBoardId,
                            x: (e.clientX - rect.left) / zoom,
                            y: (e.clientY - rect.top) / zoom
                        });
                    }}
                    onPointerDown={(e) => {
                        if (wbMode === 'select' && e.target.id === 'wb-container') {
                            const rect = canvasRef.current.getBoundingClientRect();
                            const x = (e.clientX - rect.left) / zoom;
                            const y = (e.clientY - rect.top) / zoom;
                            setSelectionBox({ startX: x, startY: y, currentX: x, currentY: y, pointerId: e.pointerId });
                            e.currentTarget.setPointerCapture(e.pointerId);
                        }
                    }}
                    onPointerMove={(e) => {
                        if (selectionBox && selectionBox.pointerId === e.pointerId) {
                            const rect = canvasRef.current.getBoundingClientRect();
                            const x = (e.clientX - rect.left) / zoom;
                            const y = (e.clientY - rect.top) / zoom;
                            setSelectionBox({ ...selectionBox, currentX: x, currentY: y });
                        }
                        handleDragMove(e);
                        handleResizeMove(e);
                        handleStickyResizeMove(e);
                        handleDocResizeMove(e);
                    }}
                    onPointerUp={(e) => {
                        if (selectionBox && selectionBox.pointerId === e.pointerId) {
                            if (e.currentTarget.hasPointerCapture && e.currentTarget.hasPointerCapture(e.pointerId)) {
                                e.currentTarget.releasePointerCapture(e.pointerId);
                            }
                            if (Math.abs(selectionBox.startX - selectionBox.currentX) < 5 && Math.abs(selectionBox.startY - selectionBox.currentY) < 5) {
                                setSelectedWbItems([]);
                            } else {
                                const minX = Math.min(selectionBox.startX, selectionBox.currentX);
                                const maxX = Math.max(selectionBox.startX, selectionBox.currentX);
                                const minY = Math.min(selectionBox.startY, selectionBox.currentY);
                                const maxY = Math.max(selectionBox.startY, selectionBox.currentY);
                                
                                const newSelected = [];
                                const checkInt = (item, w, h) => {
                                    if (item.x < maxX && item.x + w > minX && item.y < maxY && item.y + h > minY) newSelected.push(item.id);
                                };
                                // Рамка берёт только то, что видно на этой доске:
                                // иначе в выделение попадали невидимые элементы соседних.
                                boardScenes.forEach(s => checkInt(s, 288, 150));
                                references.filter(r => r.boardId === activeBoardId).forEach(r => checkInt(r, refW(r), refH(r)));
                                stickies.filter(st => belongsToBoard(st, activeBoardId)).forEach(st => checkInt(st, stickyW(st), stickyH(st)));
                                boardDocs.forEach(d => checkInt(d, docCardW(d), docCardH(d)));
                                setSelectedWbItems(newSelected);
                            }
                            setSelectionBox(null);
                        }
                        handleDragUp(e);
                        handleResizeUp(e);
                        handleStickyResizeUp(e);
                        handleDocResizeUp(e);
                        if (linkingFrom) {
                            if (hoveredSceneId) setItemScene(linkingFrom.id, linkingFrom.type, hoveredSceneId);
                            setLinkingFrom(null);
                        }
                    }}>
                      {/* Слой Excalidraw — ПОД карточками и вне их трансформации:
                          он ведёт свою панораму сам. В режиме работы с карточками
                          касания до него не доходят, и наоборот. */}
                      {/* Слой рисования идёт ПОВЕРХ карточек: по референсу нужно
                          уметь чертить — разметить кадр, показать движение.
                          Холст прозрачный, поэтому карточки видно насквозь. */}
                      {excOn && (
                        <div className="absolute inset-0" style={{ zIndex: 25, pointerEvents: wbMode === 'select' ? 'none' : 'auto' }}
                             onPointerMoveCapture={excPenTool} onPointerDownCapture={excPenTool} onPointerUpCapture={excPenRestore}>
                          {excElements !== null && excBoardOf === activeBoardId && (
                            <ExcalidrawBoard key={activeBoardId} boardId={activeBoardId} elements={excElements} files={excFiles} apiRef={excApi}
                                             readOnly={READ_ONLY} onSave={excSave} onView={excView} onTool={excTool} />
                          )}
                        </div>
                      )}

                      <div id="wb-container" ref={canvasRef} style={{ transform: (() => { const v = excOn && excViewRef.current ? excViewRef.current : { x: canvasOffset.x, y: canvasOffset.y, z: zoom }; return `translate(${v.x}px, ${v.y}px) scale(${v.z})`; })(), transformOrigin: '0 0', position: 'absolute', inset: 0, width: '4000px', height: '4000px', zIndex: 20 }}>
                        
                        {selectionBox && (
                            <div className="absolute border border-indigo-500 bg-indigo-500/20 z-50 pointer-events-none" style={{
                                left: Math.min(selectionBox.startX, selectionBox.currentX),
                                top: Math.min(selectionBox.startY, selectionBox.currentY),
                                width: Math.abs(selectionBox.currentX - selectionBox.startX),
                                height: Math.abs(selectionBox.currentY - selectionBox.startY)
                            }} />
                        )}

                        <svg className="absolute inset-0 pointer-events-none w-[4000px] h-[4000px] z-0">
                          {/* Связи со сценой — и у референсов, и у заметок.
                              Рисуем, только когда ОБА конца на этой доске: сама
                              связь при снятии карточки никуда не девается, но
                              линия к отсутствующей карточке уходила бы в пустоту. */}
                          {[
                            ...references.filter(r => r.boardId === activeBoardId).map(r => ({ item: r, type: 'ref' })),
                            ...stickies.filter(st => belongsToBoard(st, activeBoardId)).map(st => ({ item: st, type: 'sticky' })),
                            ...boardDocs.map(d => ({ item: d, type: 'doc' }))
                          ].map(({ item, type }) => {
                            if (!item.sceneId) return null;
                            const t = boardScenes.find(s => s.id === item.sceneId); if (!t) return null;
                            const a = linkAnchor(item, type); const ex = t.x; const ey = t.y + 50;
                            const on = selectedWbItems.includes(item.id) || selectedWbItems.includes(t.id);
                            return (<path key={`link-${item.id}`} d={`M ${a.x} ${a.y} C ${(a.x + ex) / 2} ${a.y}, ${(a.x + ex) / 2} ${ey}, ${ex} ${ey}`} fill="none" stroke={on ? "#d97757" : "rgba(217,119,87,0.6)"} strokeWidth={on ? "4" : "3"} strokeDasharray="6 6" />);
                          })}
                          {linkingFrom && (() => {
                             const src = linkingFrom.type === 'sticky' ? stickies.find(x => x.id === linkingFrom.id)
                                       : linkingFrom.type === 'doc' ? docs.find(x => x.id === linkingFrom.id)
                                       : references.find(x => x.id === linkingFrom.id);
                             if (!src) return null;
                             const a = linkAnchor(src, linkingFrom.type);
                             const ex = (mousePos.x - canvasRef.current?.getBoundingClientRect().left) / zoom;
                             const ey = (mousePos.y - canvasRef.current?.getBoundingClientRect().top) / zoom;
                             return <path d={`M ${a.x} ${a.y} C ${(a.x + ex) / 2} ${a.y}, ${(a.x + ex) / 2} ${ey}, ${ex} ${ey}`} fill="none" stroke="#d97757" strokeWidth="4" />;
                          })()}
                        </svg>

                        {/* Старый рисунок кистью виден и в режиме Excalidraw —
                            иначе включение выглядело как «всё стёрлось». Но
                            ЖИВОЙ холст 4000×4000 туда пускать нельзя: он
                            масштабируется вместе с доской и пересчитывается на
                            каждый шаг зума. Замер: живой холст 50 мс на шаг,
                            снимок картинкой 40, без него 33 (потолок самого
                            Excalidraw). Поэтому здесь показываем снимок. */}
                        {excOn && inkShot && (
                          <img src={inkShot} alt="" draggable={false}
                               style={{ position: 'absolute', left: 0, top: 0, width: '4000px', height: '4000px',
                                        pointerEvents: 'none', zIndex: 30 }} />
                        )}
                        {!excOn && <canvas ref={paintCanvasRef} width={4000} height={4000} onPointerDown={(e) => {
                          if (excOn) return;
                          if (wbMode === 'select') return;
                          notePen(e);
                          // Есть стилус — палец двигает доску, а не рисует.
                          if (wbMode === 'pan' || (penSeen && fingerPans && e.pointerType === 'touch')) {
                              e.currentTarget.setPointerCapture(e.pointerId);
                              setIsPanning(true);
                              setPanStart({ x: e.clientX - canvasOffset.x, y: e.clientY - canvasOffset.y });
                              return;
                          }
                          e.currentTarget.setPointerCapture(e.pointerId);
                          const rect = paintCanvasRef.current.getBoundingClientRect();
                          const coords = { x: (e.clientX - rect.left) / zoom, y: (e.clientY - rect.top) / zoom };
                          const press = (e.pressure !== undefined && e.pressure > 0 && e.pointerType === 'pen') ? e.pressure : 0.5;
                          // Обратный конец стилуса стирает — но только этим
                          // штрихом, выбранный инструмент не меняем.
                          penErase.current = isPenEraser(e);
                          pushUndo();
                          setIsPainting(true);
                          stroke.current = { prev: coords, prevMid: coords, press };
                          lastPoint.current = { x: coords.x, y: coords.y, pressure: press, time: Date.now() };
                          const ctx = paintCanvasRef.current.getContext('2d');
                          ctx.save();
                          applyBrush(ctx, penErase.current ? 'erase' : wbMode, brushType, brushColor, brushSize * (0.35 + press * 1.3));

                          // getCoalescedEvents они теряются, и быстрый штрих

                                    {dayScenes.map(s => (

                                        <div className="flex items-start space-x-4 flex-1">
                                          <span className="font-mono text-indigo-400 font-black text-sm shrink-0 bg-white/5 border border-white/10 px-3 py-1.5 rounded-lg mt-0.5">#{s.number}</span>
                                          <div className="space-y-1.5">
                                            <h4 className="text-sm font-bold text-white tracking-wide">{s.title || 'Без названия'}</h4>
                                            <p className="text-xs text-zinc-400 font-medium line-clamp-2 leading-relaxed max-w-3xl">{s.content || '...'}</p>
                                          </div>
                                        </div>
                                      </div>
                                    ))}
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        );
                      })()}
                    </div>
                  </div>

                  {/* ЭКСПЛИКАЦИИ И ДОКУМЕНТЫ */}
                  <div className={`h-full w-full ${currentView === 'docs' ? 'block' : 'hidden'}`}>
                    <div className="flex flex-col lg:flex-row h-full max-w-7xl mx-auto p-4 md:p-6 gap-6 overflow-y-auto lg:overflow-hidden">
                      <div className="w-full lg:w-72 glass-panel p-5 rounded-lg flex flex-col shrink-0 relative border-t border-white/10 overflow-hidden">
                        <div className="space-y-4 overflow-y-auto hide-scrollbar pb-4 flex-1">
                          <div>
                              <span className="text-[11px] font-bold text-zinc-500 uppercase tracking-widest block mb-3 ml-2">Операторские Гайды</span>
                              {docs.map(doc => (
                                <div key={doc.id} className="group relative mb-2">
                                  <button onClick={() => {setActiveDocId(doc.id); setActiveSchemeId(null);}} className={`w-full text-left pl-4 pr-16 py-3 rounded-lg text-sm font-bold transition-all border ${activeDocId === doc.id && !activeSchemeId ? 'bg-indigo-600/30 text-white border-indigo-500/40' : 'text-zinc-400 border-transparent hover:bg-white/5'}`}>{doc.title}</button>

                                            ? { background: 'var(--accent)', color: 'var(--bg)' }
                                            : { color: 'var(--muted-2)' }}>
                                    <Icons.Board />
                                  </button>
                                  {docs.length > 1 && (<button onClick={(e) => { e.stopPropagation(); setConfirmAction({title:'Удалить документ?', message:'', onConfirm:()=> { const rem = docs.filter(d=>d.id !== doc.id); setDocs(rem); setActiveDocId(rem[0].id); deleteNetDoc('docs', doc.id); }})}} className="absolute right-3 top-3 opacity-0 group-hover:opacity-100 hover:bg-red-500/20 text-zinc-500 hover:text-red-400 transition-all w-7 h-7 flex items-center justify-center rounded-lg text-xs"><Icons.Trash/></button>)}
                                </div>
                              ))}
                              <button onClick={() => { const nD = { id: `doc-${Date.now()}`, title: `Новый гайд`, content: '' }; setDocs([...docs, nD]); setActiveDocId(nD.id); setActiveSchemeId(null); syncDoc('docs', nD.id, nD); }} className="w-full mt-2 py-3 glass-panel hover:bg-white/10 text-white rounded-lg text-xs font-bold transition-colors flex items-center justify-center gap-2"><span>+</span><span>Создать гайд</span></button>
                          </div>
                          <div className="pt-4 border-t border-white/10">
                              <span className="text-[11px] font-bold text-zinc-500 uppercase tracking-widest block mb-3 ml-2">Схемы Света</span>
                              {lightSchemes.map(sch => (
                                <div key={sch.id} className="group relative mb-2">
                                  <button onClick={() => {setActiveSchemeId(sch.id); setActiveDocId(null);}} className={`w-full text-left px-4 py-3 rounded-lg text-sm font-bold transition-all border flex items-center gap-2 ${activeSchemeId === sch.id ? 'bg-amber-600/30 text-amber-200 border-amber-500/40' : 'text-zinc-400 border-transparent hover:bg-white/5'}`}><Icons.Lightbulb/> <span className="truncate">{sch.title}</span></button>
                                  <button onClick={(e) => { e.stopPropagation(); setConfirmAction({title:'Удалить схему?', message:'Схема отвяжется от всех связанных сцен.', onConfirm:()=> { const rem = lightSchemes.filter(d=>d.id !== sch.id); setLightSchemes(rem); setActiveSchemeId(null); setActiveDocId(docs[0].id); deleteNetDoc('lightSchemes', sch.id); }})}} className="absolute right-3 top-3 opacity-0 group-hover:opacity-100 hover:bg-red-500/20 text-zinc-500 hover:text-red-400 transition-all w-7 h-7 flex items-center justify-center rounded-lg text-xs"><Icons.Trash/></button>
                                </div>
                              ))}
                              <button onClick={() => { const nS = { id: `lsch-${Date.now()}`, title: `Схема света`, elements: [], drawData: '' }; setLightSchemes([...lightSchemes, nS]); setActiveSchemeId(nS.id); setActiveDocId(null); syncDoc('lightSchemes', nS.id, nS); }} className="w-full mt-2 py-3 glass-panel hover:bg-white/10 text-amber-300 rounded-lg text-xs font-bold transition-colors flex items-center justify-center gap-2"><span>+</span><span>Новая схема</span></button>
                          </div>
                        </div>
                      </div>

                      {/* Текстовый документ */}
                      {activeDocId && !activeSchemeId && docs.find(d => d.id === activeDocId) && (() => {
                        const activeDoc = docs.find(d => d.id === activeDocId);
                        return (
                          <div className="flex-1 glass-panel p-6 md:p-8 rounded-lg flex flex-col space-y-6 lg:overflow-y-auto relative border-t border-white/10">
                            <input type="text" value={activeDoc.title} onChange={(e) => { const up = docs.map(d=>d.id===activeDoc.id?{...d,title:e.target.value}:d); setDocs(up); syncDoc('docs', activeDoc.id, up.find(d=>d.id===activeDoc.id)); }} className="font-serif bg-transparent text-2xl md:text-3xl font-bold w-full focus:outline-none text-white placeholder-zinc-600" placeholder="Заголовок гайда..." />
                            <textarea value={activeDoc.content} onChange={(e) => { const up = docs.map(d=>d.id===activeDoc.id?{...d,content:e.target.value}:d); setDocs(up); syncDoc('docs', activeDoc.id, up.find(d=>d.id===activeDoc.id)); }} className="w-full flex-1 glass-input rounded-lg p-6 text-sm md:text-base min-h-[300px] lg:min-h-0 transition-shadow leading-relaxed resize-none font-medium border border-white/10" placeholder="Содержание документа..." />
                            
                            <div className="space-y-4 border-t border-white/10 pt-6">
                              <div className="flex justify-between items-center px-1">
                                <span className="text-xs font-bold text-zinc-400 uppercase tracking-widest flex items-center gap-2"><Icons.User/> Состав съемочной группы</span>
                                <button onClick={() => { const nc = { id: `cr-${Date.now()}`, name: '', role: '', phone: '' }; setCrew([...crew, nc]); syncDoc('crew', nc.id, nc); }} className="text-xs font-bold text-indigo-300 hover:text-white bg-indigo-600/30 hover:bg-indigo-600/50 px-4 py-2 rounded-lg transition-colors">+ Добавить участника</button>
                              </div>
                              <div className="glass-panel rounded-lg overflow-x-auto border border-white/5">
                                <table className="w-full min-w-[500px] text-left text-sm border-collapse">
                                  <thead><tr className="bg-white/5 text-zinc-400 text-[11px] uppercase tracking-widest font-bold border-b border-white/10"><th className="p-4 w-1/3">Имя Фамилия</th><th className="p-4 w-1/3">Цех / Должность</th><th className="p-4">Телефон / Контакт</th><th className="p-4 w-14"></th></tr></thead>
                                  <tbody className="divide-y divide-white/5 text-zinc-200">
                                    {crew.map(c => (
                                      <tr key={c.id} className="hover:bg-white/5 transition-colors">
                                        <td className="p-2"><input type="text" value={c.name} onChange={e => { const up = crew.map(cr=>cr.id===c.id?{...cr,name:e.target.value}:cr); setCrew(up); syncDoc('crew', c.id, up.find(cr=>cr.id===c.id)); }} className="bg-transparent w-full px-3 py-2 text-white focus:outline-none font-bold placeholder-zinc-600" placeholder="ФИО" /></td>
                                        <td className="p-2"><input type="text" value={c.role} onChange={e => { const up = crew.map(cr=>cr.id===c.id?{...cr,role:e.target.value}:cr); setCrew(up); syncDoc('crew', c.id, up.find(cr=>cr.id===c.id)); }} className="bg-transparent w-full px-3 py-2 text-zinc-400 font-medium focus:outline-none placeholder-zinc-600" placeholder="Роль" /></td>
                                        <td className="p-2"><input type="text" value={c.phone} onChange={e => { const up = crew.map(cr=>cr.id===c.id?{...cr,phone:e.target.value}:cr); setCrew(up); syncDoc('crew', c.id, up.find(cr=>cr.id===c.id)); }} className="bg-transparent w-full px-3 py-2 font-mono font-medium focus:outline-none placeholder-zinc-600" placeholder="+7..." /></td>
                                        <td className="p-2 text-center"><button onClick={() => { setCrew(crew.filter(cr=>cr.id!==c.id)); deleteNetDoc('crew', c.id); }} className="w-8 h-8 flex items-center justify-center rounded-lg glass-panel hover:bg-white/10 text-zinc-400 hover:text-red-400 transition-colors mx-auto font-bold"><Icons.Trash/></button></td>
                                      </tr>
                                    ))}
                                  </tbody>
                                </table>
                              </div>
                            </div>
                          </div>
                        );
                      })()}
                      
                      {/* Схема света */}
                      {activeSchemeId && lightSchemes.find(s=>s.id === activeSchemeId) && (() => {
                          const sch = lightSchemes.find(s=>s.id === activeSchemeId);
                          return (
                            <div className="flex-1 glass-panel p-6 md:p-8 rounded-lg flex flex-col space-y-6 lg:overflow-y-auto relative">
                                <div className="flex justify-between items-center gap-4">
                                    <input type="text" value={sch.title} onChange={(e) => { const up = lightSchemes.map(s=>s.id===sch.id?{...s,title:e.target.value}:s); setLightSchemes(up); syncDoc('lightSchemes', sch.id, up.find(s=>s.id===sch.id)); }} className="font-serif bg-transparent text-2xl md:text-3xl font-bold w-full focus:outline-none text-white placeholder-zinc-600" placeholder="Название световой схемы..." />
                                    <button onClick={() => setDrawingSchemeId(sch.id)} className="bg-amber-600/30 hover:bg-amber-500/50 text-amber-200 px-6 py-3 rounded-lg font-bold transition-colors shrink-0">Открыть графический редактор</button>
                                </div>
                                <div className="w-full aspect-video bg-black/70 rounded-lg border border-white/10 flex items-center justify-center overflow-hidden">
                                    {(sch.preview || sch.drawData) ? <img src={sch.preview || sch.drawData} className="w-full h-full object-contain" /> : <div className="text-zinc-500 flex flex-col items-center"><Icons.Lightbulb/><span className="mt-2 text-xs">Нажмите «Открыть графический редактор» для моделирования схемы</span></div>}
                                </div>
                                <div className="pt-4 border-t border-white/10">
                                    <span className="text-xs text-zinc-400 font-bold block mb-2">Привязано к сценам:</span>
                                    <div className="flex gap-2 flex-wrap">
                                        {scenes.filter(s=>s.lightSchemeId===sch.id).length > 0 
                                            ? scenes.filter(s=>s.lightSchemeId===sch.id).map(s=>(<span key={s.id} className="bg-indigo-950/60 px-3 py-1 rounded-lg text-xs font-mono text-indigo-300">Сцена #{s.number}</span>))
                                            : <span className="text-xs text-zinc-600">Схема не привязана ни к одной сцене</span>
                                        }
                                    </div>
                                </div>
                            </div>
                          );
                      })()}

                      {/* Правая колонка: Файлы */}
                      <div className="w-full lg:w-80 glass-panel p-6 rounded-lg shrink-0 space-y-8 relative border-t border-white/10">
                        <div className="space-y-3">
                          <span className="text-[11px] font-bold text-zinc-500 uppercase tracking-widest block ml-1">Экспорт / Печать</span>
                          {(() => {
                            const openDoc = docs.find(d => d.id === activeDocId);
                            const openScheme = lightSchemes.find(s => s.id === activeSchemeId);
                            const btn = "w-full py-3 rounded-lg text-sm font-bold tracking-wide transition-all flex items-center justify-center gap-2 border";
                            return (
                              <div className="space-y-2">
                                <button onClick={() => requestPrint('full')} className={`${btn} bg-zinc-800 hover:bg-zinc-700 text-white border-white/10`}>
                                  <Icons.Print/> <span>Весь план</span>
                                </button>
                                <button onClick={() => requestPrint('doc')} disabled={!openDoc || !!activeSchemeId}
                                        title={openDoc && !activeSchemeId ? `Печать: ${openDoc.title}` : 'Сначала откройте гайд слева'}
                                        className={`${btn} ${openDoc && !activeSchemeId ? 'bg-zinc-800 hover:bg-zinc-700 text-white border-white/10' : 'bg-zinc-900/60 text-zinc-600 border-white/5 cursor-not-allowed'}`}>
                                  <Icons.Docs/> <span className="truncate">Гайд{openDoc && !activeSchemeId ? `: ${openDoc.title}` : ''}</span>
                                </button>
                                <button onClick={() => requestPrint('scheme')} disabled={!openScheme}
                                        title={openScheme ? `Печать: ${openScheme.title}` : 'Сначала откройте схему света слева'}
                                        className={`${btn} ${openScheme ? 'bg-amber-900/40 hover:bg-amber-900/60 text-amber-100 border-amber-500/30' : 'bg-zinc-900/60 text-zinc-600 border-white/5 cursor-not-allowed'}`}>
                                  <Icons.Lightbulb/> <span className="truncate">Схема света{openScheme ? `: ${openScheme.title}` : ''}</span>
                                </button>
                                <button onClick={() => requestPrint('gear')} className={`${btn} bg-zinc-800 hover:bg-zinc-700 text-white border-white/10`}>
                                  <Icons.Video/> <span>Список техники</span>
                                </button>
                              </div>
                            );
                          })()}
                        </div>
                        <div className="space-y-4 pt-6 border-t border-white/10">
                          <span className="text-[11px] font-bold text-zinc-500 uppercase tracking-widest block ml-1">Файлы и документы проекта</span>
                          <div className="border border-dashed border-white/20 hover:border-indigo-500/50 rounded-lg p-6 text-center bg-black/30 hover:bg-indigo-500/10 transition-all group">
                            <label className="text-xs font-bold text-zinc-400 group-hover:text-indigo-300 cursor-pointer block w-full h-full flex flex-col items-center gap-2">
                              <span className="opacity-60 group-hover:opacity-100 transition-opacity"><Icons.Folder/></span>
                              <span>Загрузить КПП или доки</span>
                              <input type="file" onChange={(e) => { const f = e.target.files[0]; if (!f) return; if (f.size > 4 * 1024 * 1024) { showToast('❌ Файл больше 4 МБ'); e.target.value = ''; return; } const r = new FileReader(); r.onloadend = () => { const nF = { id: `file-${Date.now()}`, name: f.name, size: `${(f.size / 1024).toFixed(1)} KB`, data: r.result }; setProjectFiles([...projectFiles, nF]); if (r.result.length < 900 * 1024) { syncDoc('projectFiles', nF.id, nF); showToast(`Загружен: ${f.name}`); } else { showToast(`📁 Сохранён локально — слишком большой для облака: ${f.name}`); } }; r.readAsDataURL(f); }} accept=".pdf,.xlsx,.csv,.txt,.png,.jpg" className="hidden" />
                            </label>
                          </div>
                          <div className="space-y-3 max-h-[300px] overflow-y-auto pr-2 hide-scrollbar">
                            {projectFiles.map(file => (
                              <div key={file.id} className="glass-panel p-4 rounded-lg flex flex-col space-y-3 group hover:border-indigo-500/30 transition-colors border border-white/5">
                                <div className="truncate flex flex-col">
                                  <span className="text-sm text-zinc-200 truncate font-bold tracking-wide" title={file.name}>{file.name}</span>
                                  <span className="text-[11px] font-mono text-zinc-500 mt-0.5">{file.size}</span>
                                </div>
                                <div className="flex gap-2 justify-end">
                                  {file.data !== '#' && (<a href={file.data} download={file.name} className="flex-1 text-emerald-400 font-bold px-3 py-2 rounded-lg bg-emerald-500/10 hover:bg-emerald-500/20 transition-all text-center text-xs">Скачать</a>)}
                                  <button onClick={() => setConfirmAction({title:'Удалить файл?', message: '', onConfirm:()=>{ setProjectFiles(projectFiles.filter(f=>f.id!==file.id)); deleteNetDoc('projectFiles', file.id); }})} className="w-10 flex items-center justify-center text-zinc-500 hover:text-red-400 font-bold rounded-lg bg-black/50 hover:bg-white/10 transition-colors text-xs border border-white/5"><Icons.Trash/></button>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                </div>

                {/* ЧАТ КОМАНДЫ */}
                {showChat && <div className="fixed inset-0 bg-black/70 z-40 md:hidden backdrop-blur-sm" onClick={() => setShowChat(false)}></div>}
                <div className={`fixed inset-y-0 right-0 z-50 md:relative md:z-10 glass-panel flex flex-col h-full transition-transform duration-300 ease-out md:shadow-none md:border-l border-white/10 ${showChat ? 'translate-x-0 w-[85%] sm:w-80' : 'translate-x-full md:translate-x-0 w-0 border-none'}`}>
                  
                  <div className="p-5 border-b border-white/10 space-y-4 bg-white/5 relative">
                    <button onClick={() => setShowChat(false)} className="md:hidden absolute top-4 right-4 w-8 h-8 flex items-center justify-center glass-panel rounded-full text-zinc-400 font-bold">✕</button>
                    <span className="text-[11px] font-bold text-zinc-500 uppercase tracking-widest block">Профиль участника</span>
                    <div className="flex flex-col gap-3">
                      <div className="glass-panel rounded-lg px-4 py-3 flex items-center border border-white/10">
                        <span className="text-zinc-300 mr-3"><Icons.User/></span>
                        <div className="flex flex-col">
                            <span className="text-sm font-extrabold text-white">{userName}</span>
                            <span className="text-xs text-indigo-400 font-bold">{userRole}</span>
                        </div>
                      </div>
                      <button onClick={() => setShowWelcome(true)} className="text-xs font-semibold text-zinc-500 hover:text-indigo-400 transition-colors text-left pl-1 underline decoration-zinc-700 hover:decoration-indigo-500 underline-offset-4">Изменить имя/роль</button>
                    </div>
                  </div>

                  <div className="flex-1 p-5 overflow-y-auto space-y-4 hide-scrollbar flex flex-col relative bg-black/30">
                    {messages.map(msg => {
                        const isMe = msg.senderId ? msg.senderId === clientId : (msg.senderName === userName && msg.senderRole === userRole);
                        return (
                          <div key={msg.id} className={`flex flex-col max-w-[85%] ${isMe ? 'self-end items-end' : 'self-start items-start'}`}>
                            <div className={`flex items-baseline space-x-1.5 mb-1 ${isMe ? 'flex-row-reverse space-x-reverse' : ''}`}>
                              <span className="text-[11px] font-extrabold text-zinc-400">{msg.senderName}</span>
                              <span className="text-[10px] text-zinc-500 font-mono font-semibold">{msg.senderRole}</span>
                            </div>
                            <div className={`px-4 py-2.5 rounded-lg text-[13px] font-medium leading-relaxed border ${isMe ? 'bg-indigo-500 text-[#1a1918] border-indigo-500/50 rounded-tr-sm' : 'glass-panel text-zinc-200 rounded-tl-sm border-white/10'}`}>
                              {msg.text}
                            </div>
                          </div>
                        );
                    })}
                    {messages.length === 0 && (
                        <div className="absolute inset-0 flex flex-col items-center justify-center text-zinc-600">
                            <span className="mb-2"><Icons.Chat/></span>
                            <span className="text-xs font-bold uppercase tracking-widest">Чат цеха</span>
                        </div>
                    )}
                  </div>

                  <div className="p-4 border-t border-white/10 bg-black/50">
                    <div className="flex glass-input rounded-lg p-1.5 transition-all">
                        <input type="text" value={chatInput} onChange={(e) => setChatInput(e.target.value)} onKeyDown={(e) => { if(e.key === 'Enter' && chatInput.trim()){ const nm = { id: `msg-${Date.now()}`, text: chatInput.trim(), senderId: clientId, senderName: userName, senderRole: userRole, timestamp: Date.now() }; if(db && user){ syncDoc('messages', nm.id, nm); } else { setMessages([...messages, nm]); } setChatInput(''); } }} className="flex-1 bg-transparent px-3 text-sm font-medium text-white focus:outline-none placeholder-zinc-500" placeholder="Сообщение..." />
                        <button onClick={() => { if(!chatInput.trim()) return; const nm = { id: `msg-${Date.now()}`, text: chatInput.trim(), senderId: clientId, senderName: userName, senderRole: userRole, timestamp: Date.now() }; if(db && user){ syncDoc('messages', nm.id, nm); } else { setMessages([...messages, nm]); } setChatInput(''); }} className="bg-indigo-500 hover:bg-indigo-400 text-[#1a1918] w-10 h-10 rounded-lg flex items-center justify-center transition-colors font-bold">↑</button>
                    </div>
                  </div>
                </div>
              </div>
              </div>

              {/* ПОВТОРНАЯ ЗАГРУЗКА КАРТИНОК */}
              {dupPrompt && (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[420] p-4">
                  <div className="glass-panel rounded-lg p-6 max-w-md w-full relative">
                    <h3 className="text-lg font-bold text-white mb-2">Такие картинки уже есть</h3>
                    <p className="text-sm text-zinc-400 mb-3 leading-relaxed">
                      {dupPrompt.names.length === dupPrompt.total
                        ? `Все ${dupPrompt.total} выбранных файлов уже загружены в проект под теми же именами.`
                        : `${dupPrompt.names.length} из ${dupPrompt.total} файлов уже есть в проекте под теми же именами.`}
                    </p>
                    <div className="rounded-md p-3 mb-4 max-h-40 overflow-y-auto"
                         style={{ background: 'var(--bg)', border: '1px solid var(--border)' }}>
                      {dupPrompt.names.map((n, i) => (
                        <div key={i} className="truncate" style={{ fontSize: 11.5, color: 'var(--muted)', fontFamily: "'JetBrains Mono', monospace" }}>{n}</div>
                      ))}
                    </div>
                    <div className="flex flex-col gap-2">
                      <button onClick={() => dupPrompt.onResolve('skip')}
                              className="w-full py-3 rounded-lg text-sm font-bold transition-colors"
                              style={{ background: 'var(--accent)', color: 'var(--bg)' }}>
                        Пропустить повторы{dupPrompt.names.length < dupPrompt.total ? ` · загрузить ${dupPrompt.total - dupPrompt.names.length}` : ''}
                      </button>
                      <button onClick={() => dupPrompt.onResolve('all')}
                              className="w-full py-3 glass-panel hover:bg-white/10 text-zinc-300 rounded-lg text-sm font-bold transition-colors">
                        Загрузить всё равно
                      </button>
                      <button onClick={() => dupPrompt.onResolve('cancel')}
                              className="w-full py-2 text-zinc-500 hover:text-zinc-300 rounded-lg text-xs font-semibold transition-colors">
                        Отмена
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* МОДАЛЬНЫЕ ОКНА */}
              {showShareModal && (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[200] p-4">
                  <div className="glass-panel rounded-lg p-8 max-w-md w-full relative">
                    <button onClick={() => setShowShareModal(false)} className="absolute top-5 right-5 w-8 h-8 flex items-center justify-center bg-white/5 hover:bg-red-500/20 hover:text-red-400 rounded-full text-zinc-400 font-bold transition-colors">✕</button>
                    <h3 className="text-xl font-extrabold text-white mb-4 flex items-center gap-2"><Icons.Link/> Совместный доступ</h3>
                    <div className="text-sm font-medium text-zinc-300 leading-relaxed space-y-3 mb-6">
                      <p>Проект живёт в «комнате». Кто открыл ссылку с кодом комнаты — тот работает вместе с вами; кто открыл адрес без кода — получает свой пустой проект и ваших данных не видит.</p>
                      <p className="text-[12px] text-zinc-500">Значит, для бетатеста давайте людям адрес <span className="font-mono">без</span> кода — каждый начнёт с чистого листа. А своей группе присылайте ссылку-приглашение ниже.</p>
                    </div>
                    <div className="mb-4">
                      <label className="text-xs text-zinc-400 font-semibold block mb-1.5 ml-1">Код комнаты проекта</label>
                      <div className="flex gap-2">
                        <input type="text" defaultValue={appId} id="cf-room-input" className="flex-1 glass-input rounded-lg px-4 py-2.5 text-sm font-mono" />
                        <button onClick={() => { const v = document.getElementById('cf-room-input').value.trim(); if (v && v !== appId) { localStorage.setItem('cf_room', v); window.location.reload(); } }} className="bg-indigo-500 hover:bg-indigo-400 text-[#1a1918] text-xs font-bold px-4 rounded-lg transition-colors">Войти</button>
                      </div>
                      <p className="text-[11px] text-zinc-500 mt-1.5 ml-1">Код — это и есть замок: кто его знает, тот видит проект. Простой код вроде «cineflow-room-3» можно угадать — если делитесь приложением с посторонними, поменяйте его на что-то своё и разошлите группе новую ссылку.</p>

                <h1 style={{fontSize: '22pt', fontWeight: 900, margin: '0 0 2pt'}}>CineFlow — План подготовки к съёмкам</h1>
                <p style={{fontSize: '10pt', color: '#555', margin: '0 0 14pt'}}>Сформировано: {new Date().toLocaleDateString('ru-RU')} · Сцен: {scenes.length}</p>
                {[...scenes].sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999') || String(a.number).localeCompare(String(b.number), undefined, {numeric: true})).map(s => {
                  const pFrames = storyboard.filter(f => f.sceneId === s.id);
                  return (
                    <div key={s.id} className="print-scene">
                      <h2 style={{fontSize: '14pt', fontWeight: 800, margin: '0 0 4pt'}}>Сцена #{s.number} — {s.title || 'Без названия'}</h2>
                      <p style={{fontSize: '10pt', color: '#555', margin: '0 0 6pt'}}>Смена: {s.date ? formatDateDisplay(s.date) : 'не назначена'}</p>
                      {s.content && <p style={{fontSize: '11pt', margin: '0 0 8pt', whiteSpace: 'pre-wrap'}}>{s.content}</p>}
                      {Object.keys(s.gear || {}).length > 0 && <p style={{fontSize: '10pt', margin: '0 0 4pt'}}><b>Техника:</b> {Object.entries(s.gear).map(([k, v]) => `${((gearTypes || {})[k] || {label: k}).label} × ${v}`).join(', ')}</p>}
                      {Object.keys(s.lightGear || {}).length > 0 && <p style={{fontSize: '10pt', margin: '0 0 8pt'}}><b>Свет:</b> {Object.entries(s.lightGear).map(([k, v]) => `${((lightGearTypes || {})[k] || {label: k}).label} × ${v}`).join(', ')}</p>}
                      {pFrames.length > 0 && (
                        <div style={{display: 'flex', flexWrap: 'wrap', gap: '8pt'}}>
                          {pFrames.map(f => (
                            <div key={f.id} style={{width: '30%', fontSize: '9pt'}}>
                              {f.image && <img src={f.image} style={{width: '100%', border: '1px solid #ccc'}} />}
                              <div><b>{f.frameNum}</b> {f.description}</div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })}
                {crew.length > 0 && (
                  <div style={{marginTop: '16pt'}}>
                    <h2 style={{fontSize: '14pt', fontWeight: 800}}>Съёмочная группа</h2>
                    <table style={{width: '100%', borderCollapse: 'collapse', fontSize: '10pt'}}>
                      <tbody>
                        {crew.map(c => (<tr key={c.id}><td style={{border: '1px solid #ccc', padding: '4pt'}}>{c.name}</td><td style={{border: '1px solid #ccc', padding: '4pt'}}>{c.role}</td><td style={{border: '1px solid #ccc', padding: '4pt'}}>{c.phone}</td></tr>))}
                      </tbody>
                    </table>
                  </div>
                )}
                </>)}
              </React.Fragment>)}
              </div>

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><AppCore /></ErrorBoundary>);
    </script>
</body>
</html>
