              const { dx: ddx, dy: ddy, idle } = dragDelta();
              if (!idle) {
                  const where = { scene: ['scenes', scenes], ref: ['references', references],
                                  sticky: ['stickies', stickies], doc: ['docs', docs] };
                  let hadShapes = false;
                  draggingWbItems.items.forEach(item => {
                      if (item.type === 'shape') { hadShapes = true; return; }
                      const box = where[item.type]; if (!box) return;
                      const f = box[1].find(x => x.id === item.id); if (!f) return;
                      syncDoc(box[0], item.id, { ...f, x: item.ox + ddx, y: item.oy + ddy });
                  });
                  if (hadShapes) { shapeAct.current = null; bumpInk(); scheduleInkSave('shapes'); }
                  // Ехали только привязанные стрелки — данные не менялись,
                  // достаточно вернуть их с верхнего слоя на нижний.
                  else if (shapeAct.current) { shapeAct.current = null; bumpInk(); }
              }
              shapeAct.current = null;
              clearGuides();
              dragMoved.current = false;
              dragPos.current = null;
              setDraggingWbItems(null);
              requestLive();
          };

          // Второй палец ОТМЕНЯЕТ всё, что успел начать первый: штрих,
          // ластик, черновик фигуры, перенос карточек, рамку выделения.
          // Без этого «приблизить двумя пальцами» оставляет на доске
          // случайную линию или утаскивает карточку вместе с жестом.
          // Делает ровно то же, что onPointerCancel у холста, плюс то,
          // что живёт в режиме выбора.
          const abortBoardGesture = () => {
              live.current = null; erasePt.current = null; penErase.current = false;
              shapeDraft.current = null; shapeAct.current = null;
              ocrDraft.current = null; linkDown.current = null;
              bindCand.current = null;
              clearGuides();
              // Перенос, начатый первым пальцем, ОТКАТЫВАЕМ на исходные места.
              // Иначе «приблизить двумя пальцами» заодно сдвигает карточку,
              // причём заметно: к случайному сдвигу притяжка добавляет ещё
              // до половины клетки сетки. В облако на этом этапе ничего
              // не ушло — перенос пишется туда только на отпускании.
              const dd = draggingWbItems;
              if (dd) {
                  const back = (setter, type) => {
                      const items = dd.items.filter(i => i.type === type);
                      if (!items.length) return;
                      setter(prev => prev.map(o => {
                          const it = items.find(i => i.id === o.id);
                          return it && (o.x !== it.ox || o.y !== it.oy) ? { ...o, x: it.ox, y: it.oy } : o;
                      }));
                  };
                  back(setScenes, 'scene'); back(setReferences, 'ref');
                  back(setStickies, 'sticky'); back(setDocs, 'doc');
                  dd.items.filter(i => i.type === 'shape').forEach(it => {
                      const sh = shapesRef.current.find(q => q.id === it.id);
                      if (sh) { sh.x = it.ox; sh.y = it.oy; shapeDirty(sh); }
                  });
              }
              dragMoved.current = false; dragPos.current = null;
              boardBusy.current = false;
              setDraggingWbItems(null);
              setSelectionBox(null);
              setIsPainting(false); setIsPanning(false);
              commitView();
              requestStatic(); requestLive();
          };

          // Щипок: два пальца всегда двигают и приближают доску, в любом
          // режиме. Так устроены все доски (Freeform, Excalidraw, Miro),
          // и это единственный способ приблизиться, не бросая кисть.
          const boardPinchStart = (rect) => {
              const [a, b] = [...boardTouch.current.values()];
              const mx = (a.x + b.x) / 2 - rect.left, my = (a.y + b.y) / 2 - rect.top;
              const v = viewRef.current;
              pinchRef2.current = {
                  d: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)),
                  z: v.z, rect,
                  // Точка ДОСКИ под серединой между пальцами. Держим на месте
                  // её, а не середину экрана: иначе доска уползает из-под рук.
                  wx: (mx - v.x) / v.z,
                  wy: (my - v.y) / v.z
              };
          };
          const boardPinchMove = () => {
              const p = pinchRef2.current;
              if (!p || boardTouch.current.size < 2) return;
              const [a, b] = [...boardTouch.current.values()];
              const d = Math.hypot(a.x - b.x, a.y - b.y);
              const mx = (a.x + b.x) / 2 - p.rect.left, my = (a.y + b.y) / 2 - p.rect.top;
              // Пределы те же, что у колеса мыши, — иначе щипком можно
              // было бы уехать туда, откуда колесом не вернуться.
              const nz = Math.min(2.0, Math.max(0.3, p.z * (d / p.d)));
              applyView(mx - p.wx * nz, my - p.wy * nz, nz);
          };

          const handleElementPointerDown = (e, id, type) => {
              // Гость двигать карточки не должен: расстановка на доске —
              // это и есть та работа, которую ему показывают. Положения
              // в облако и так не уходят (syncDoc выходит по READ_ONLY),
              // но у себя на экране он растащил бы доску и решил, что
              // сломал её. Выходим БЕЗ stopPropagation: панорама доски
              // ловится ниже по всплытию и обязана работать и в просмотре.
              if (READ_ONLY) return;
              if (wbMode === 'link') { e.stopPropagation(); pickLink(id); return; }
              if (wbMode !== 'select') return;
              const wholeCardBtn = e.target.closest('[data-card-tap]');
              if ((['INPUT', 'TEXTAREA', 'BUTTON'].includes(e.target.tagName) && !wholeCardBtn)
                  || e.target.closest('.node-handle')) return;
              e.stopPropagation();
              tapToTrigger.current = wholeCardBtn || null;
              // Двойное нажатие по тексту карточки — правка. Считаем его сами,
              // а не полагаемся на dblclick: пальцем и пером браузер сообщает
              // о нём не всегда, а планшет у нас основное устройство.
              const fld = READ_ONLY ? null : e.target.closest('[data-card-field]');
              const fkey = fld ? fld.getAttribute('data-card-field') : null;
              const now = Date.now(), lt = lastCardTap.current;
              if (fkey && lt.id === id && lt.key === fkey && now - lt.t < 700) {
                  lastCardTap.current = { id: null, key: null, t: 0 };
                  setSelectedWbItems([id]); setEditCard({ id, key: fkey });
                  return;
              }
              lastCardTap.current = { id, key: fkey, t: now };
              if (editCard && editCard.id !== id) setEditCard(null);
              // Нажали по тексту УЖЕ выбранной карточки — если палец не
              // поедет, на отпускании откроем правку. Так писать можно
              // спокойным вторым нажатием, не попадая в 700 мс: ровно как
              // переименовывают файл — выбрал, нажал ещё раз.
              tapToEdit.current = (fkey && selectedWbItems.includes(id)) ? { id, key: fkey } : null;
              
              let currentSelected = selectedWbItems;
              if (!currentSelected.includes(id)) {
                  currentSelected = e.shiftKey ? [...currentSelected, id] : [id];
                  setSelectedWbItems(currentSelected);
              }
              
              noSnap.current = e.ctrlKey || e.metaKey;
              beginBoardDrag(e, currentSelected, selShapes);
          };

          // --- ТЕКСТ НА КАРТОЧКЕ: нажал — двигай, дважды — правишь ---
          // Раньше текст был живым полем ввода во всю площадь карточки.
          // Нажатие попадало в поле, а не в карточку, и подвинуть её пальцем
          // можно было только за узкую рамку по краю. На планшете это и есть
          // «непонятно, что нажать, а что подвинуть». Теперь текст показан
          // обычным текстом, поле появляется по двойному нажатию.
          const [editCard, setEditCard] = useState(null);      // {id, key}
          const editCardRef = useRef(null);
          const lastCardTap = useRef({ id: null, key: null, t: 0 });
          const tapToEdit = useRef(null);
          // То же самое, но для кнопки, которая ЗАНИМАЕТ ВСЮ карточку
          // (пустая карточка референса с «Загрузить»). Обычные кнопки
          // карточки — корзина, крестик — из жеста исключены, иначе
          // карточка ездила бы при попытке нажать. А эта кнопка и есть
          // вся карточка: исключив её, мы отняли бы у карточки
          // перетаскивание. Поэтому жест начинается как обычно, а
          // нажатие срабатывает на отпускании, если палец не поехал.
          const tapToTrigger = useRef(null);
          // Фокус ставим РУКАМИ, а не через autoFocus: поле появляется после
          // жеста, во время которого фокус успевает уехать на что-то другое.
          useEffect(() => {
            if (!editCard) return;
            const el = editCardRef.current; if (!el) return;
            el.focus();
            const n = (el.value || '').length;
            try { el.setSelectionRange(n, n); } catch (err) {}
          }, [editCard]);
          useEffect(() => { if (currentView !== 'whiteboard') setEditCard(null); }, [currentView]);

          const cardField = (id, key, value, onChange, o) => {
            o = o || {};
            // В режиме просмотра текст остаётся текстом: раньше правку
            // запрещал запрет нажатий на полях ввода, а у обычного текста
            // его нет — двойное нажатие открыло бы поле там, где менять
            // ничего нельзя.
            if (!READ_ONLY && editCard && editCard.id === id && editCard.key === key) {
              const stop = (e) => e.stopPropagation();
              const done = (e) => {
                if (e.key === 'Escape' || (e.key === 'Enter' && !o.multiline)) { e.preventDefault(); setEditCard(null); }
              };
              const common = { ref: editCardRef, value: value || '', className: o.className, style: o.style,
                               placeholder: o.placeholder, onPointerDown: stop, onDoubleClick: stop,
                               onChange: (e) => onChange(e.target.value), onBlur: () => setEditCard(null), onKeyDown: done };
              return o.multiline ? <textarea {...common} /> : <input type="text" {...common} />;
            }
            return (
              <div data-card-field={READ_ONLY ? null : key} style={o.style}
                   className={(o.className || '') + ' cf-card-text'}
                   onDoubleClick={READ_ONLY ? undefined : (e) => { e.stopPropagation(); setEditCard({ id, key }); }}>
                {value ? value : <span style={{ opacity: .45 }}>{o.placeholder || ''}</span>}
              </div>
            );
          };
          // Пока карточку тащат, переходы ей не нужны: они анимируют left/top
          // и карточка едет за пальцем с отставанием.
          const dragIds = draggingWbItems ? new Set(draggingWbItems.items.map(i => i.id)) : null;
          const isDragging = (id) => !!(dragIds && dragIds.has(id));

          // --- Размер карточки референса на доске ---
          // Ширина живёт в поле w у референса; высота считается по ней,
          // чтобы связи и рамка выделения знали габариты карточки.
          // Размытая подложка карточки — это `url(<картинка в 200 КБ>)`.
          // Строка пересобиралась на КАЖДУЮ перерисовку каждой карточки,
          // и React каждый раз сравнивал её посимвольно: восемнадцать
          // референсов давали мегабайты сравнения на кадр. Держим готовый
          // объект стиля по ссылке — сравнение становится мгновенным.
          const bgCache = useRef(new Map());
          const bgStyle = (id, url) => {
            const c = bgCache.current.get(id);
            if (c && c.url === url) return c.style;
            const style = { backgroundImage: `url(${url})` };
            // Каждая запись держит картинку целиком, поэтому не даём копиться:
            // за долгий сеанс с заменой референсов это стало бы утечкой.
            if (bgCache.current.size > 200) bgCache.current.clear();
            bgCache.current.set(id, { url, style });
            return style;
          };

          const REF_W = 192;
          const refW = (r) => Math.round(r.w || REF_W);
          // Пропорции у каждой картинки СВОИ. Раньше окно было жёстко 16:9,
          // и вертикальный кадр ложился в него с чёрными полями в пол-карточки.
          const refAR = (r) => (r.ar && r.ar > 0.05 && r.ar < 20) ? r.ar : 16 / 9;
          const refH = (r) => Math.round((refW(r) - 20) / refAR(r)) + 58;
          // Замеряем при первой же отрисовке: так подхватываются и старые
          // референсы, без всякого перевода данных.
          const noteRefRatio = (ref, img) => {
            if (!img || !img.naturalWidth || !img.naturalHeight) return;
            const ar = Math.round((img.naturalWidth / img.naturalHeight) * 1000) / 1000;
            if (!ar || (ref.ar && Math.abs(ref.ar - ar) < 0.01)) return;
            const up = references.map(r => r.id === ref.id ? { ...r, ar } : r);
            setReferences(up);
            syncDoc('references', ref.id, up.find(r => r.id === ref.id));
          };

          const handleResizeMove = (e) => {
              if (!resizingRef || resizingRef.pointerId !== e.pointerId) return;
              const dx = (e.clientX - resizingRef.startX) / zoom;
              const nw = Math.max(120, Math.min(960, Math.round((resizingRef.startW + dx) / 8) * 8));
              setReferences(prev => prev.map(r => r.id === resizingRef.id ? { ...r, w: nw } : r));
          };

          const handleResizeUp = (e) => {
              if (!resizingRef || resizingRef.pointerId !== e.pointerId) return;
              const f = references.find(r => r.id === resizingRef.id);
              if (f) syncDoc('references', resizingRef.id, f);
              setResizingRef(null);
          };

          // --- Размер и цвет заметки на доске ---
          // Заметка тянется за угол сразу в обе стороны, как в Excalidraw;
          // старые заметки без полей w/h остаются прежнего размера.
          const STICKY_W = 224, STICKY_H = 128;
          const stickyW = (s) => Math.round(s.w || STICKY_W);
          const stickyH = (s) => Math.round(s.h || STICKY_H);
          const STICKY_COLORS = ['#fef08a', '#ffc9c9', '#b2f2bb', '#a5d8ff', '#ffd8a8', '#e9ecef'];

          const handleStickyResizeMove = (e) => {
              if (!resizingSticky || resizingSticky.pointerId !== e.pointerId) return;
              const dx = (e.clientX - resizingSticky.startX) / zoom;
              const dy = (e.clientY - resizingSticky.startY) / zoom;
              const nw = Math.max(120, Math.min(800, Math.round((resizingSticky.startW + dx) / 8) * 8));
              const nh = Math.max(80,  Math.min(600, Math.round((resizingSticky.startH + dy) / 8) * 8));
              setStickies(prev => prev.map(s => s.id === resizingSticky.id ? { ...s, w: nw, h: nh } : s));
          };

          const handleStickyResizeUp = (e) => {
              if (!resizingSticky || resizingSticky.pointerId !== e.pointerId) return;
              const f = stickies.find(s => s.id === resizingSticky.id);
              if (f) syncDoc('stickies', resizingSticky.id, f);
              setResizingSticky(null);
          };

          // Откуда выходит пунктир связи: правая середина карточки.
          // --- Документ на доске ---
          // Стикер — быстрая цветная записка. Документ — то, что живёт
          // в «Экспликациях»: заголовок и длинный текст. На доске это
          // такая же карточка, её можно двигать, растягивать и связывать
          // со сценой. Как у референса, без `boardId` документ на доску
          // не выкладывается — иначе туда вывалились бы все гайды.
          const DOC_W = 280, DOC_H = 220;
          const docCardW = (d) => Math.round(d.w || DOC_W);
          const docCardH = (d) => Math.round(d.h || DOC_H);
          const boardDocs = useMemo(() => docs.filter(d => d.boardId === activeBoardId), [docs, activeBoardId]);
          const offBoardDocs = useMemo(() => docs.filter(d => d.boardId !== activeBoardId), [docs, activeBoardId]);

          const patchDoc = (id, patch) => {
            const up = docs.map(d => d.id === id ? { ...d, ...patch } : d);
            setDocs(up); syncDoc('docs', id, up.find(d => d.id === id));
          };
          const putDocOnBoard = (id) => {
            if (READ_ONLY) return;
            patchDoc(id, { boardId: activeBoardId,
              x: (300 - canvasOffset.x) / zoom + Math.random() * 60,
              y: (200 - canvasOffset.y) / zoom + Math.random() * 60 });
            showToast('Документ на доске');
          };
          const removeRefFromBoard = (id) => {
            pushUndo(false, [{ coll: 'references', id }]);
            freezeArrowsForCards([id]);
            const up = references.map(r => r.id === id ? { ...r, boardId: '' } : r);
            setReferences(up); syncDoc('references', id, up.find(r => r.id === id));
            setSelectedWbItems(prev => prev.filter(x => x !== id));
            showToast('Убрано с доски · референс остался в галерее');
          };
          const removeDocFromBoard = (id) => {
            pushUndo(false, [{ coll: 'docs', id }]);
            freezeArrowsForCards([id]);
            patchDoc(id, { boardId: '' });
            setSelectedWbItems(prev => prev.filter(x => x !== id));
            showToast('Убрано с доски · документ остался в «Экспликациях»');
          };

          const linkAnchor = (item, type) =>
              type === 'sticky' ? { x: item.x + stickyW(item), y: item.y + stickyH(item) / 2 }
            : type === 'doc'    ? { x: item.x + docCardW(item), y: item.y + docCardH(item) / 2 }
            : type === 'scene'  ? { x: item.x + 288, y: item.y + 75 }
            :                     { x: item.x + refW(item), y: item.y + refH(item) / 2 };

          // Связь стрелкой между двумя объектами доски. Это тот же коннектор,
          // что рисуется инструментом «Стрелка», просто заведённый жестом:
          // маршруты, отмена и выгрузка у него уже есть.
          const addConnector = (aId, bId) => {
            if (READ_ONLY || !aId || !bId || aId === bId) return;
            const dup = shapesRef.current.some(q => isLineKind(q.k)
              && ((q.b1 === aId && q.b2 === bId) || (q.b1 === bId && q.b2 === aId)));
            if (dup) { showToast('Такая связь уже есть'); return; }
            const A = findBind(aId), B = findBind(bId);
            if (!A || !B) return;
            const ac = shapeCenter(A), bc = shapeCenter(B);
            pushUndo(false);
            const sh = makeShape('arrow', ac.x, ac.y);
            sh.w = bc.x - ac.x; sh.h = bc.y - ac.y;
            sh.b1 = aId; sh.b2 = bId;
            shapesRef.current = [...shapesRef.current, sh];
            bumpInk(); scheduleInkSave('shapes');
            showToast('Связь создана · двигайте карточки, линия идёт следом');
          };
          // СХЕМЫ СВЕТА ЖИВУТ В «ДОСКАХ». Это тот же графический редактор,
          // что был в «Экспликациях», — со своими приборами, конусами
          // и камерой; никакой замены ему из обычных фигур не будет.
          // Переехал он потому, что схема света — это ровно такой же
          // холст, как доска: странно было держать один холст в одном
          // разделе, а другой в другом. Записи схем остались общими,
          // и то же самое видно у объекта и в списке экспликаций.
          const newSchemeHere = () => {
            if (READ_ONLY) return;
            const sc = scenes.find(x => x.id === activeSceneId);
            const nS = { id: `lsch-${Date.now()}`, title: sc ? `Схема света · сц ${sc.number}` : 'Схема света', elements: [], drawData: '' };
            setLightSchemes([...lightSchemes, nS]); syncDoc('lightSchemes', nS.id, nS);
            // Сразу привязываем к открытой сцене: за схемой почти всегда
            // приходят от сцены, и второй заход «выбрать её в списке»
            // человек просто не делает.
            if (sc) updateScene(sc.id, 'lightSchemeId', nS.id);
            setDrawingSchemeId(nS.id);
          };

          // Выбор объекта в режиме «Связь». Ходов ровно два: первый объект,
          // второй объект. Зовётся и с холста (фигуры, надписи), и прямо
          // с карточки: выделенная карточка лежит ВЫШЕ холста, и нажатие по
          // ней до холста не доходит вовсе.
          const pickLink = (id) => {
            if (!id) { linkPick.current = null; bindCand.current = null; requestLive(); return; }
            if (!linkPick.current) { linkPick.current = id; bindCand.current = id; showToast('Теперь нажмите на второй объект'); }
            else if (linkPick.current === id) { linkPick.current = null; bindCand.current = null; }
            else { addConnector(linkPick.current, id); linkPick.current = null; bindCand.current = null; }
            requestLive();
          };

          // Куда бросили кружок: на сцену — это привязка карточки к сцене
          // (та самая, что показывает #N и работает вне доски), на любую
          // другую карточку — обычная связь стрелкой.
          const dropLink = (from, toId) => {
            const toScene = (cardsRef.current.scenes || []).some(x => x.id === toId);
            if (toScene && from.type !== 'scene') { setItemScene(from.id, from.type, toId); return; }
            addConnector(from.id, toId);
          };

          // Привязать/отвязать от сцены. Одинаково для референса, заметки
          // и документа: сама карточка никуда не девается, меняется
          // только поле sceneId.
          const setItemScene = (id, type, sceneId) => {
            if (READ_ONLY) return;
            pushUndo(false, [{ coll: type === 'sticky' ? 'stickies' : (type === 'doc' ? 'docs' : 'references'), id }]);
            if (type === 'sticky') {
              const up = stickies.map(s => s.id === id ? { ...s, sceneId } : s);
              setStickies(up); syncDoc('stickies', id, up.find(s => s.id === id));
            } else if (type === 'doc') {
              patchDoc(id, { sceneId });
            } else {
              const up = references.map(r => r.id === id ? { ...r, sceneId } : r);
              setReferences(up); syncDoc('references', id, up.find(r => r.id === id));
            }
          };

          const [resizingDoc, setResizingDoc] = useState(null);

          // Стрелка, привязанная к карточке, нарисована на холсте, а сама
          // карточка живёт в разметке. Значит холст надо перерисовать и
          // тогда, когда карточка сдвинулась НЕ жестом: отменой, кнопкой
          // «положить на доску», приездом правки из облака.
          // Во время самого жеста этого делать нельзя: там связь едет на
          // верхнем слое, а полная перерисовка нижнего на каждый кадр
          // съела бы всю плавность. По окончании жеста состояние
          // обнуляется, эффект срабатывает и всё встаёт на место.
          const arrowSyncKey = useRef(null);
          useEffect(() => {
            if (currentView !== 'whiteboard') return;
            // Смена доски и вход на доску рисуют себя САМИ, и вмешиваться
            // сюда нельзя: наш кадр прилетает раньше, чем загрузились штрихи
            // новой доски, и на экране остаётся рисунок предыдущей. Ошибок
            // при этом нет — просто чужой рисунок поверх чистой доски,
            // и выглядит это как «сломалась кисть».
            const key = activeBoardId + '|' + currentView;
            if (arrowSyncKey.current !== key) { arrowSyncKey.current = key; return; }
            if (draggingWbItems || resizingSticky || resizingDoc || resizingRef) return;
            if (shapesRef.current.some(q => isLineKind(q.k) && (q.b1 || q.b2))) requestStatic();
          }, [scenes, references, stickies, docs, currentView, activeBoardId,
              draggingWbItems, resizingSticky, resizingDoc, resizingRef]);
          const handleDocResizeMove = (e) => {
              if (!resizingDoc || resizingDoc.pointerId !== e.pointerId) return;
              const dx = (e.clientX - resizingDoc.startX) / zoom;
              const dy = (e.clientY - resizingDoc.startY) / zoom;
              const nw = Math.max(200, Math.min(900, Math.round((resizingDoc.startW + dx) / 8) * 8));
              const nh = Math.max(140, Math.min(800, Math.round((resizingDoc.startH + dy) / 8) * 8));
              setDocs(prev => prev.map(d => d.id === resizingDoc.id ? { ...d, w: nw, h: nh } : d));
          };
          const handleDocResizeUp = (e) => {
              if (!resizingDoc || resizingDoc.pointerId !== e.pointerId) return;
              const f = docs.find(d => d.id === resizingDoc.id);
              if (f) syncDoc('docs', resizingDoc.id, f);
              setResizingDoc(null);
          };

          // Цвет ложится на все выделенные заметки разом — как в Excalidraw.
          const paintStickies = (id, color) => {
            if (READ_ONLY) return;
              const ids = selectedWbItems.includes(id) ? selectedWbItems : [id];
              const up = stickies.map(s => ids.includes(s.id) ? { ...s, color } : s);
              setStickies(up);
              ids.forEach(i => { const f = up.find(s => s.id === i); if (f) syncDoc('stickies', i, f); });
          };

          // Палитра всплывает только над первой из выделенных заметок:
          // при выделении рамкой их иначе было бы десяток разом.
          const paletteStickyId = (() => {
              const sel = stickies.filter(s => belongsToBoard(s, activeBoardId) && selectedWbItems.includes(s.id));
              return sel.length ? sel[0].id : null;
          })();
          

          // Пункты навигации — одна строка иконок в шапке (рельса больше нет).
          // В режиме просмотра остаётся только то, чем поделились.
          const navItems = [
            { id: 'notion',     label: 'Сцены',        icon: <Icons.Scene /> },
            { id: 'whiteboard', label: 'Доски',        icon: <Icons.Board /> },
            { id: 'gallery',    label: 'Галерея',      icon: <Icons.Gallery /> },
            { id: 'locations',  label: 'Объекты',      icon: <Icons.Place /> },
            { id: 'table',      label: 'КПП',          icon: <Icons.Table /> },
            { id: 'docs',       label: 'Экспликации',  icon: <Icons.Docs /> }
          ].filter(t => {
            return CF_VIEWS.indexOf(t.id) >= 0;
          });
          // Заметка сцены — это стикер на доске сцены, а не отдельная
          // сущность: одна и та же бумажка, видная и на экране сцены,
          // и на холсте. Два списка заметок разошлись бы за неделю.
          const addSceneNote = () => {
            if (READ_ONLY) return;
            if (!activeSceneId) return;
            const ns = { id: `st-${Date.now()}`, boardId: activeBoardId, sceneId: activeSceneId, text: '',
                         x: (300 - canvasOffset.x) / zoom, y: (300 - canvasOffset.y) / zoom,
                         w: STICKY_W, h: STICKY_H, color: '#fef08a' };
            setStickies([...stickies, ns]); syncDoc('stickies', ns.id, ns);
            showToast('Заметка добавлена · она же лежит на доске');
          };
          // Какую сцену печатать по «···» → «Экспорт сцены в PDF».
          const [printScene, setPrintScene] = useState(null);
          // Какой объект печатать по «···» → «Экспорт объекта в PDF».
          const [printLocation, setPrintLocation] = useState(null);
          // Крупные копии фотографий, вытянутые из облака под печать:
          // {id референса: dataURL}. Живут ровно до конца печати — держать
          // полсотни копий по 2048 px в памяти круглосуточно незачем.
          const [printPhotos, setPrintPhotos] = useState({});

          // Пропорция кадра проекта. Запись в localStorage — только в try:
          // место на устройстве кончается, и тогда setItem бросает исключение.
          const [projectRatio, setProjectRatio] = useState(() => {
            try { return parseFloat(localStorage.getItem('cf_ratio')) || 2.39; } catch (e) { return 2.39; }
          });
          useEffect(() => {
            try { localStorage.setItem('cf_ratio', String(projectRatio)); } catch (e) {}
          }, [projectRatio]);

          // --- Экран объекта ---
          const [locListOpen, setLocListOpen] = useState(
            () => typeof window === 'undefined' || window.innerWidth >= 768);
          // Список сцен для привязки открывается по требованию: сам по себе
          // он длинный, а привязывают сцены к объекту один раз.
          const [locScenePicker, setLocScenePicker] = useState(false);
          const [locMenu, setLocMenu] = useState(false);
          // Лента фотографий объекта разворачивается сеткой НА МЕСТЕ — как
          // референсы и раскадровка у сцены. У объекта их бывает шесть
          // десятков, и листать ленту вбок, чтобы увидеть все, — не то,
          // ради чего фотографии со скаута везли.
          const [locPhotosOpen, setLocPhotosOpen] = useState(false);
          const locMenuRef = useRef(null);
          useEffect(() => {
            if (!locMenu) return;
            const away = (e) => { if (locMenuRef.current && !locMenuRef.current.contains(e.target)) setLocMenu(false); };
            document.addEventListener('pointerdown', away);
            return () => document.removeEventListener('pointerdown', away);
          }, [locMenu]);
          // Заметка объекта — такая же бумажка, как заметка сцены, только
          // привязана к месту. Отдельной сущности не заводим по той же
          // причине, по которой фото объекта — обычные референсы: иначе
          // пришлось бы второй раз писать цвета, правку и синхронизацию.
          const addLocationNote = (locId) => {
            const ns = { id: `st-${Date.now()}`, boardId: activeBoardId, sceneId: '', locationId: locId, text: '',
                         x: (300 - canvasOffset.x) / zoom, y: (300 - canvasOffset.y) / zoom,
                         w: STICKY_W, h: STICKY_H, color: '#fef08a' };
            setStickies([...stickies, ns]); syncDoc('stickies', ns.id, ns);
          };

          // --- Экран сцены: панели, развороты, меню ---
          // Список сцен слева сворачивается в полоску 40 точек: на планшете
          // это разница между «текст сцены в одну колонку» и «в полторы».
          const [sceneListOpen, setSceneListOpen] = useState(
            () => typeof window === 'undefined' || window.innerWidth >= 768);
          // Правая панель — вкладками, как в Blender: узкая полоса иконок,
          // активная разворачивает панель ПОВЕРХ содержимого, а не сжимает
          // его. Сжатие означало бы, что текст сцены переливается при каждом
          // взгляде на технику. Повторный клик по иконке — свернуть.
          // По умолчанию панель открыта только там, где после неё остаётся
          // рабочее место. На планшете в 924 точки список сцен (212) плюс
          // полоса вкладок (40) плюс сама панель (300) не оставляют середине
          // ничего — там она открывается по нажатию и так же закрывается.
          const [scenePanel, setScenePanel] = useState(() =>
            (typeof window !== 'undefined' && window.innerWidth >= 1200) ? 'expl' : null);
          // Панель задумывалась плавающей — чтобы не переливать текст сцены
          // при каждом взгляде на технику. Но «поверх» на широком экране
          // означало, что правые 300 точек становятся недоступны: галочка
          // «снято» в режиме съёмки и всё, что прижато вправо, оказывалось
          // ПОД панелью и не нажималось вовсе. Поэтому пополам: на широком
          // экране панель стоит РЯДОМ (места хватает обоим и ничего не
          // прячется), на узком — по-прежнему поверх, там её открывают
          // на минуту и сразу закрывают.
          // --- ТЕЛЕФОН ---
          // Порог 700 точек. Ниже него это уже не «узкий планшет», а другой
          // прибор: навигация внизу, панели шторками, ленты до краёв.
          const [isPhone, setIsPhone] = useState(
            () => typeof window !== 'undefined' && window.innerWidth < 700);
          useEffect(() => {
            if (!window.matchMedia) return;
            const mq = window.matchMedia('(max-width: 699px)');
            const on = () => setIsPhone(mq.matches);
            on();
            if (mq.addEventListener) { mq.addEventListener('change', on); return () => mq.removeEventListener('change', on); }
            mq.addListener(on); return () => mq.removeListener(on);
          }, []);
          // На телефоне «Сцены» — это два экрана: список и карточка.
          // Одновременно они не помещаются, и притворяться, что помещаются,
          // значит сделать нечитаемым и то и другое.
          const [phoneSceneOpen, setPhoneSceneOpen] = useState(false);
          // Что открыто шторкой снизу: техника, свет, солнце, экспликация,
          // «Ещё» с остальными модулями.
          const [phoneSheet, setPhoneSheet] = useState(null);
          // Фильтр списка сцен пилюлями. По умолчанию — ближайшая смена:
          // на площадке спрашивают «что сегодня», а не «что вообще есть».
          const [phoneFilter, setPhoneFilter] = useState('shift');
          // Текст сцены на телефоне свёрнут до нескольких строк: иначе
          // он занимает весь экран и до раскадровки не долистать.
          const [phoneTextOpen, setPhoneTextOpen] = useState(false);
          useEffect(() => { setPhoneTextOpen(false); }, [activeSceneId]);
          // Смены — это уникальные даты сцен по порядку. Отдельного поля
          // «номер смены» нет и заводить его не будем: дата у сцены уже есть,
          // а две записи одного и того же разъезжаются.
          const shiftDates = useMemo(
            () => [...new Set(scenes.filter(s => s.date).map(s => s.date))].sort(), [scenes]);
          const nearestShift = useMemo(() => {
            if (!shiftDates.length) return null;
            const today = new Date().toISOString().slice(0, 10);
            return shiftDates.find(d => d >= today) || shiftDates[shiftDates.length - 1];
          }, [shiftDates]);

          const [panelSideBySide, setPanelSideBySide] = useState(
            () => typeof window !== 'undefined' && window.innerWidth >= 1200);
          useEffect(() => {
            if (!window.matchMedia) return;
            const mq = window.matchMedia('(min-width: 1200px)');
            const on = () => setPanelSideBySide(mq.matches);
            on();
            // Safari до 14 не знает addEventListener у MediaQueryList.
            if (mq.addEventListener) { mq.addEventListener('change', on); return () => mq.removeEventListener('change', on); }
            mq.addListener(on); return () => mq.removeListener(on);
          }, []);
          // «развернуть все» у референсов и раскадровки раскрывает сетку
          // НА МЕСТЕ, вдоль текста и вниз. Никаких всплывающих окон:
          // человек просил «чтобы шло смещение вниз, не появлялось новых окон».
          const [refsExpanded, setRefsExpanded] = useState(false);
          const [shotsExpanded, setShotsExpanded] = useState(false);
          useEffect(() => {
            // Esc сворачивает развороты, а заодно и правую панель — но ТОЛЬКО
            // когда она лежит поверх содержимого. Стоящую рядом панель
            // держат открытой намеренно, и закрывать её случайным Esc
            // значило бы отнимать то, что человек только что поставил.
            const esc = (e) => {
              if (e.key !== 'Escape') return;
              setRefsExpanded(false);
              setShotsExpanded(false);
              if (!panelSideBySide) setScenePanel(null);
            };
            window.addEventListener('keydown', esc);
            return () => window.removeEventListener('keydown', esc);
          }, [panelSideBySide]);
          // Меню сцены «···»: туда убраны «Удалить» и «PDF» — они занимали
          // место в шапке карточки, а нажимают их редко.
          const [sceneMenu, setSceneMenu] = useState(false);
          const sceneMenuRef = useRef(null);
          useEffect(() => {
            if (!sceneMenu) return;
            const away = (e) => { if (sceneMenuRef.current && !sceneMenuRef.current.contains(e.target)) setSceneMenu(false); };
            document.addEventListener('pointerdown', away);
            return () => document.removeEventListener('pointerdown', away);
          }, [sceneMenu]);
          // Показывать ли позиции каталога, которых в этой сцене нет.
          // Свёрнуто список короткий — только то, что реально едет на площадку.
          const [gearCatalogOpen, setGearCatalogOpen] = useState(false);
          const [lightCatalogOpen, setLightCatalogOpen] = useState(false);

          // ЕДИНЫЙ СПИСОК ТЕХНИКИ (и такой же — света).
          // Плитки с чипами ушли: на площадке нужен список
          // «что везём и сколько», а не сетка карточек, где
          // цифра теряется. Строка = позиция: название можно
          // править прямо здесь, −/+ меняют количество в ЭТОЙ
          // сцене, ✕ убирает её из сцены (в каталоге остаётся).
          // Ниже — «весь каталог»: оттуда позицию добавляют
          // в сцену и оттуда же удаляют из каталога совсем.
          const gearPanel = (s, isLight) => {
            const field = isLight ? 'lightGear' : 'gear';
            const types = (isLight ? lightGearTypes : gearTypes) || (isLight ? DEFAULT_LIGHT_GEAR : DEFAULT_GEAR);
            const setTypes = isLight ? setLightGearTypes : setGearTypes;
            const coll = isLight ? 'lightGearTypes' : 'gearTypes';
            const catOpen = isLight ? lightCatalogOpen : gearCatalogOpen;
            const setCatOpen = isLight ? setLightCatalogOpen : setGearCatalogOpen;
            const typed = isLight ? newLightGearName : newGearName;
            const setTyped = isLight ? setNewLightGearName : setNewGearName;
            const counts = (s && s[field]) || {};
            const all = Object.entries(types);
            const mine = all.filter(([k]) => (counts[k] || 0) > 0);
            const rest = all.filter(([k]) => !(counts[k] > 0));
            const rename = (k, label) => {
              const item = { ...(types[k] || {}), label };
              setTypes({ ...types, [k]: item }); syncDoc(coll, k, item);
            };
            const addPosition = () => {
              const name = String(typed || '').trim();
              if (!name) return;
              const key = name.toLowerCase().replace(/\s+/g, '_');
              if (!types[key]) { const item = { label: name }; setTypes({ ...types, [key]: item }); syncDoc(coll, key, item); }
              updateSceneNested(s.id, field, key, 1);
              setTyped('');
            };
            // На телефоне этот список открывается шторкой, и нажимают его
            // пальцем, а не мышью: 24 точки там — промах через раз.
            const sz = isPhone ? 38 : 24;
            const stepBtn = { width: sz, height: sz, border: '1px solid var(--border)', borderRadius: isPhone ? 8 : 5, color: 'var(--muted)', flexShrink: 0, fontSize: isPhone ? 17 : 13 };
            return (
              <div className="px-4 pb-4 pt-1">
                {mine.length === 0 && (
                  <p style={{ fontSize: 12, color: 'var(--muted-2)', lineHeight: 1.6 }}>
                    В этой сцене {isLight ? 'приборов' : 'техники'} пока нет. Впишите позицию ниже или возьмите из каталога.
                  </p>
                )}
                {mine.map(([k, item]) => (
                  <div key={k} className="flex items-center gap-1.5 mt-2" style={isPhone ? { minHeight: 44 } : null}>
                    <input value={item.label} onChange={(e) => rename(k, e.target.value)}
                           className="flex-1 min-w-0 bg-transparent focus:outline-none"
                           style={{ fontSize: isPhone ? 14 : 12.5, color: 'var(--text-2)', padding: 0 }} />
                    <button onClick={() => updateSceneNested(s.id, field, k, -1)} title="Меньше на одну"
                            className="cf-edit-only flex items-center justify-center" style={stepBtn}>−</button>
                    <span className="text-center shrink-0" style={{ fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--accent)', minWidth: 26 }}>×{counts[k]}</span>
                    <button onClick={() => updateSceneNested(s.id, field, k, 1)} title="Больше на одну"
                            className="cf-edit-only flex items-center justify-center" style={stepBtn}>+</button>
                    <button onClick={() => updateSceneNested(s.id, field, k, -(counts[k] || 0))}
                            title="Убрать позицию из сцены — в каталоге останется"
                            className="cf-edit-only flex items-center justify-center shrink-0"
                            style={{ width: sz, height: sz, borderRadius: isPhone ? 8 : 5, color: 'var(--muted-2)', fontSize: isPhone ? 14 : 11 }}>✕</button>
                  </div>
                ))}
                <div className="cf-edit-only flex gap-1.5 mt-3">
                  <input type="text" value={typed} onChange={(e) => setTyped(e.target.value)}
                         onKeyDown={(e) => { if (e.key === 'Enter') addPosition(); }}
                         placeholder={isLight ? 'Новый прибор…' : 'Новая позиция…'}
                         className="glass-input flex-1 min-w-0 rounded-lg px-2.5" style={{ minHeight: isPhone ? 44 : 32, fontSize: isPhone ? 14 : 12 }} />
                  <button onClick={addPosition} className="shrink-0 rounded-lg px-3 font-semibold"
                          style={{ minHeight: isPhone ? 44 : 32, fontSize: isPhone ? 14 : 12, background: 'var(--accent)', color: 'var(--bg)' }}>+ {isLight ? 'прибор' : 'техника'}</button>
                </div>
                <button onClick={() => setCatOpen(!catOpen)} className="cf-edit-only mt-3 cf-meta"
                        style={{ color: 'var(--accent)' }}>{catOpen ? 'скрыть каталог ⤡' : `весь каталог · ${rest.length} ⤢`}</button>
                {catOpen && (
                  <div className="mt-2" style={{ borderTop: '1px solid var(--line)', paddingTop: 8 }}>
                    {rest.length === 0 && <p className="cf-meta">Всё из каталога уже в сцене.</p>}
                    {rest.map(([k, item]) => (
                      <div key={k} className="flex items-center gap-1.5 mt-1.5">
                        <span className="flex-1 min-w-0 truncate" style={{ fontSize: 12.5, color: 'var(--muted)' }}>{item.label}</span>
                        <button onClick={() => updateSceneNested(s.id, field, k, 1)} title="Добавить в эту сцену"
                                className="flex items-center justify-center" style={stepBtn}>+</button>
                        <button onClick={() => setConfirmAction({
                                  title: isLight ? 'Удалить прибор из каталога?' : 'Удалить позицию из каталога?',
                                  message: 'Позиция исчезнет из каталога всего проекта. В сценах, где она уже стоит, останется.',
                                  onConfirm: () => { const up = { ...types }; delete up[k]; setTypes(up); deleteNetDoc(coll, k); } })}
                                title="Удалить из каталога совсем"
                                className="flex items-center justify-center shrink-0"
                                style={{ width: 24, height: 24, borderRadius: 5, color: 'var(--danger)', fontSize: 11 }}>✕</button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          };

          // Бейдж «ИНТ·Д» из заголовка сцены. Отдельного поля под это нет
          // и заводить его не будем: заголовок сцены и так пишется по
          // стандарту «ИНТ. КАБИНЕТ — ДЕНЬ», надо только прочитать.
          const sceneBadge = (s) => {
            const t = String(s.title || '').toUpperCase();
            const where = /(^|[\s.])НАТ/.test(t) ? 'НАТ' : (/(^|[\s.])ИНТ/.test(t) ? 'ИНТ' : '');
            const when = /НОЧ|ВЕЧЕР|ЗАКАТ|СУМЕРК/.test(t) ? 'Н' : (/ДЕНЬ|УТР|РАССВЕТ/.test(t) ? 'Д' : '');
            return [where, when].filter(Boolean).join('·');
          };

          // Содержимое шторок телефона. Собирается здесь, а не в экране
          // сцены: сама шторка висит поверх всего приложения, и тащить
          // её разметку через возврат экрана было бы куда запутаннее.
          // Списки техники и света — те же самые, что в правой панели
          // на планшете: одно место правки, никакого второго вида.
          const phoneSheetBody = (() => {
            if (!isPhone || !phoneSheet || phoneSheet === 'more') return null;
            const s = scenes.find(x => x.id === activeSceneId) || sortedScenes[0];
            if (!s) return null;
            const loc = locations.find(l => (l.sceneIds || []).includes(s.id));
            const c = loc ? parseCoords(loc.coords) : null;
            if (phoneSheet === 'gear') return gearPanel(s, false);
            if (phoneSheet === 'light') return gearPanel(s, true);
            if (phoneSheet === 'expl') return (
              <div className="px-4 pb-5 pt-1">
                <textarea value={s.content || ''} onChange={(e) => updateScene(s.id, 'content', e.target.value)}
                          className="w-full glass-input rounded-lg p-3"
                          style={{ fontSize: 14, lineHeight: 1.6, minHeight: 180, resize: 'vertical' }}
                          placeholder="Настроение, контраст, характер камеры, точка зрения — как эта сцена должна выглядеть." />
                <button onClick={() => enhanceSceneWithAI(s.id, s.content, s.title, s.script)} disabled={isAILoading}
                        className="cf-edit-only mt-2 flex items-center gap-1.5 rounded-lg px-4 font-semibold"
                        style={{ minHeight: 44, fontSize: 13, background: 'var(--raised)', color: 'var(--text-2)' }}>
                  <Icons.Bot /> {isAILoading ? 'Думаю…' : 'Расширить с ИИ'}
                </button>
              </div>
            );
            // Солнце и объект — одной шторкой: на площадке это один вопрос
            // «где мы и сколько осталось света».
            return (
              <div className="px-4 pb-5 pt-1">
                {!loc ? (
                  <p style={{ fontSize: 13, color: 'var(--muted-2)', lineHeight: 1.6 }}>
                    Сцена не привязана к объекту. Привязка живёт на экране «Объекты».
                  </p>
                ) : (
                  <React.Fragment>
                    <button onClick={() => { setPhoneSheet(null); setActiveLocationId(loc.id); setCurrentView('locations'); }}
                            className="w-full flex items-center gap-2.5 rounded-lg px-3 mb-3"
                            style={{ minHeight: 46, background: 'var(--raised)', fontSize: 14, color: 'var(--text)' }}>
                      <Icons.Place /> {loc.name || 'Без названия'}
                      <span className="ml-auto" style={{ color: 'var(--accent)', fontSize: 13 }}>открыть →</span>
                    </button>
                    {!c ? (
                      <p style={{ fontSize: 13, color: 'var(--muted-2)', lineHeight: 1.6 }}>
                        У объекта нет координат — впишите их там, и здесь появится солнце на день смены.
                      </p>
                    ) : (() => {
                      const now = new Date();
                      const p = sunPosition(c.lat, c.lon, now);
                      const t = sunTimes(c.lat, c.lon, s.date || now.toISOString().slice(0, 10));
                      const rad = p.az * Math.PI / 180, R = 40;
                      const sx = 60 + R * Math.sin(rad), sy = 60 - R * Math.cos(rad);
                      return (
                        <div className="flex gap-3.5 items-center">
                          <svg width="110" height="110" viewBox="0 0 120 120" className="shrink-0">
                            <circle cx="60" cy="60" r="52" fill="none" stroke="var(--border)" strokeWidth="1" />
                            <text x="60" y="16" textAnchor="middle" fontFamily="var(--font-mono)" fontSize="9" fill="var(--muted)">С</text>
                            <text x="60" y="112" textAnchor="middle" fontFamily="var(--font-mono)" fontSize="9" fill="var(--muted-2)">Ю</text>
                            <text x="10" y="63" textAnchor="middle" fontFamily="var(--font-mono)" fontSize="9" fill="var(--muted-2)">З</text>
                            <text x="110" y="63" textAnchor="middle" fontFamily="var(--font-mono)" fontSize="9" fill="var(--muted-2)">В</text>
                            {p.alt > 0 && <path d={`M60 60 L${sx.toFixed(1)} ${sy.toFixed(1)}`} stroke="var(--warn)" strokeWidth="2" />}
                            {p.alt > 0 && <circle cx={sx.toFixed(1)} cy={sy.toFixed(1)} r="5" fill="var(--warn)" />}
                            <circle cx="60" cy="60" r="3" fill="var(--accent)" />
                          </svg>
                          <div style={{ fontSize: 13, lineHeight: 1.55, color: 'var(--text-2)' }}>
                            {sunWords(p)}
                            {t && !t.sun.polar && t.sun.set && (
                              <React.Fragment><br />Закат <b style={{ fontFamily: 'var(--font-mono)' }}>{hhmm(t.sun.set)}</b>
                              {t.golden.set && <React.Fragment>, золотой час с <b style={{ fontFamily: 'var(--font-mono)' }}>{hhmm(t.golden.set)}</b></React.Fragment>}.</React.Fragment>
                            )}
                          </div>
                        </div>
                      );
                    })()}
                  </React.Fragment>
                )}
              </div>
            );
          })();

          // Режим экрана сцены. Запись в localStorage — только в try:
          // место на устройстве кончается, и тогда setItem бросает
          // исключение, а из отрисовки оно роняет всё приложение.
          const [sceneMode, setSceneMode] = useState(() => {
            try { return localStorage.getItem('cf_scene_mode') || 'creative'; } catch (e) { return 'creative'; }
          });
          useEffect(() => {
            try { localStorage.setItem('cf_scene_mode', sceneMode); } catch (e) {}
          }, [sceneMode]);

          // Меню «···» в шапке. Туда убраны «Проект» и «Доступ»: двумя
          // кнопками со словами они занимали треть шапки, а нажимают их
          // раз в смену. Кнопка ··· закрывается по нажатию мимо неё и по Esc.
          const [headMenu, setHeadMenu] = useState(false);
          const headMenuRef = useRef(null);
          useEffect(() => {
            if (!headMenu) return;
            const away = (e) => { if (headMenuRef.current && !headMenuRef.current.contains(e.target)) setHeadMenu(false); };
            const esc = (e) => { if (e.key === 'Escape') setHeadMenu(false); };
            document.addEventListener('pointerdown', away);
            window.addEventListener('keydown', esc);
            return () => { document.removeEventListener('pointerdown', away); window.removeEventListener('keydown', esc); };
          }, [headMenu]);

          // Поиск по всему проекту. Открывается ⌘K / Ctrl+K и нажатием
          // на поле в шапке. Ищет сцены, референсы (по подписи и тегам),
          // объекты, доски и документы — и ПЕРЕХОДИТ туда, а не только
          // показывает: смысл в том, чтобы не помнить, в каком модуле
          // лежит нужное.
          const [showSearch, setShowSearch] = useState(false);
          useEffect(() => {
            const onKey = (e) => {
              if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K' || e.key === 'л' || e.key === 'Л')) {
                e.preventDefault();
                setShowSearch(v => !v);
              }
            };
            window.addEventListener('keydown', onKey);
            return () => window.removeEventListener('keydown', onKey);
          }, []);

          // Приглашение в СВОЮ комнату; голый адрес даёт человеку пустой проект
          const inviteLink = location.origin + location.pathname + '?room=' + encodeURIComponent(appId);
          // Тот же адрес, но БЕЗ кода комнаты: им дают приложение,
          // а не свой проект.
          const plainLink = location.origin + location.pathname;
          // Счётчик кадров. Включается адресом ?fps=1 и по умолчанию не работает
          // вовсе. Нужен, чтобы мерить на НАСТОЯЩЕМ устройстве: на компьютере
          // разработчика цифры другие, и «медленно» без чисел не починить.
          const [fpsNow, setFpsNow] = useState(null);
          // Включается галочкой в меню «Проект» ИЛИ адресом ?fps=1.
          // Галочка обязательна: в установленном на iPad приложении нет
          // адресной строки, и параметр туда просто не набрать.
          const [fpsOn, setFpsOn] = useState(() =>
            localStorage.getItem('cf_fps') === '1' || new URLSearchParams(location.search).has('fps'));
          const toggleFps = () => setFpsOn(v => {
            const n = !v;
            try { localStorage.setItem('cf_fps', n ? '1' : '0'); } catch (e) {}
            if (!n) setFpsNow(null);
            return n;
          });
          useEffect(() => {
            if (!fpsOn) return;
            let frames = 0, last = performance.now(), raf = 0, low = 999;
            const tick = (t) => {
              frames++;
              if (t - last >= 500) {
                const v = Math.round(frames * 1000 / (t - last));
                low = Math.min(low, v);
                setFpsNow({ now: v, low });
                frames = 0; last = t;
              }
              raf = requestAnimationFrame(tick);
            };
            raf = requestAnimationFrame(tick);
            return () => cancelAnimationFrame(raf);
          }, [fpsOn]);
          const syncing = pendingWrites > 0;
          const syncTitle = !isOnline
            ? (syncing ? `Офлайн · ${pendingWrites} правок ждут связи` : 'Офлайн · правки сохраняются на устройстве')
            : (syncing ? `Отправка в облако · ${pendingWrites}` : 'Всё сохранено в облаке');
          const syncDot = !isOnline ? '#f59e0b' : (syncing ? '#fbbf24' : '#10b981');
          // Соединение поднимается заново и само, но ждать этого вслепую —
          // худшее, что можно предложить человеку на площадке. Нажатие на
          // точку связи делает то же самое немедленно.
          const [kicking, setKicking] = useState(false);
          const kickSyncNow = () => {
            if (kicking) return;
            setKicking(true); showToast('Обновляю связь с облаком...');
            Promise.resolve(cfKickSync(true))
              .then(() => showToast('Связь обновлена'))
              .catch(() => showToast('⚠️ Не удалось обновить связь'))
              .finally(() => setKicking(false));
          };
          // Чат открывается ДВУМЯ кнопками: в рельсе (компьютер) и в ленте
          // табов (телефон) — рельса на телефоне не показывается вовсе,
          // и другого пути к чату оттуда нет. Обработчик поэтому ОДИН:
          // разрешение на уведомления спрашивается ровно там, где человек
          // открывает чат, и только при ОТКРЫТИИ: на закрытии окно
          // браузера выглядит непрошеным.
          // Спрашивать можно ТОЛЬКО из обработчика нажатия: без жеста
          // человека браузер запрос молча отклоняет.
          const toggleChat = () => {
            const opening = !showChat;
            setShowChat(opening);
            if (opening && 'Notification' in window && Notification.permission === 'default') {
              try { Notification.requestPermission(); } catch (e) {}
            }
          };

          // В режиме просмотра имя не спрашиваем — человек просто смотрит.
          // Выход стоит ПОСЛЕ всех хуков и обязан там стоять: React считает
          // хуки по порядку, и ранний выход посреди списка означал, что при
          // появлении окна их становилось на три меньше. Первый же запуск
          // у нового человека валился в аварийный экран и перезапускал
          // приложение с нуля. Любую новую проверку «вместо всего» ставь
          // сюда же, ниже последнего useState/useEffect.
          if (showWelcome && !READ_ONLY) return <WelcomeModal onComplete={(name, role) => { setUserName(name); setUserRole(role); setShowWelcome(false); }} />;

          return (
            <div className="flex h-screen w-screen relative overflow-hidden bg-transparent">
              <ConfirmModal action={confirmAction} onCancel={() => setConfirmAction(null)} />
              {showSearch && (
                <SearchPalette
                  scenes={scenes} references={references} locations={locations}
                  boards={sortedBoards} docs={docs} storyboard={storyboard}
                  onClose={() => setShowSearch(false)}
                  onGo={(view, what) => {
                    // Сначала выбираем сущность, потом переключаем экран:
                    // иначе на кадр мгновения открывается прошлая сцена.
                    if (what.sceneId) setActiveSceneId(what.sceneId);
                    if (what.locationId) setActiveLocationId(what.locationId);
                    if (what.boardId) setActiveBoardId(what.boardId);
                    if (what.docId) { setActiveDocId(what.docId); setActiveSchemeId(null); }
                    if (what.refId) {
                      const r = references.find(x => x.id === what.refId);
                      if (r) setLightboxData({ scope: [r.id], scopeLabel: 'Найдено поиском', currentId: r.id });
                    }
                    setCurrentView(view);
                  }} />
              )}
              {fpsNow && (
                <div className="fixed pointer-events-none" style={{ left: '50%', transform: 'translateX(-50%)', bottom: 8, zIndex: 500, whiteSpace: 'nowrap', background: 'var(--panel)', border: '1px solid var(--border)', borderRadius: 8, padding: '5px 9px', fontFamily: 'var(--font-mono)', fontSize: 11.5, color: fpsNow.now >= 50 ? '#10b981' : (fpsNow.now >= 30 ? '#fbbf24' : '#f87171') }}>
                  {/* «кадры» в приложении — это раскадровка, поэтому здесь
                      пишем «плавность» и fps: иначе читается как счётчик кадров */}
                  плавность {fpsNow.now} fps <span style={{ color: 'var(--muted-2)' }}>· хуже всего {fpsNow.low}</span>
                </div>
              )}
              {/* СБОЙ ОБЛАКА. Полоска сверху, а не сообщение внизу: пока
                  страницу не перезагрузят, правки никуда не уезжают, и
                  узнать об этом человек обязан сразу, а не через три часа
                  съёмки. Данные при этом целы — так и написано. */}
              {cloudBroken && (
                <div className="fixed top-0 left-0 right-0 z-[500] px-4 py-2.5 flex flex-wrap items-center justify-center gap-x-3 gap-y-2 text-center"
                     style={{ background: '#7f1d1d', color: '#fee2e2' }}>
                  <span className="text-xs font-bold">
                    Связь с облаком оборвалась внутри Firebase. Правки сейчас НЕ уезжают — проект в облаке цел, но перезагрузите страницу.
                  </span>
                  <button onClick={() => location.reload()} disabled={repairing}
                          className="text-[11px] font-bold px-3 py-1.5 rounded-lg bg-white/15 hover:bg-white/25 transition-colors">
                    Перезагрузить
                  </button>
                  <button onClick={() => setConfirmAction({
                            allowRO: true,
                            title: 'Починить местную копию базы?',
                            message: 'Копия базы на этом устройстве будет стёрта, и всё перечитается из облака. Правки, которые не успели уехать в облако, пропадут. Обычной перезагрузки чаще всего достаточно — это на случай, если сбой повторяется.',
                            onConfirm: repairCloudCache })}
                          disabled={repairing}
                          className="text-[11px] font-bold px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 transition-colors">
                    {repairing ? 'Чиню...' : 'Сбой повторяется'}
                  </button>
                </div>
              )}

              {toast && (<div className="fixed bottom-6 left-1/2 -translate-x-1/2 glass-panel text-white px-6 py-3 rounded-full text-sm font-medium z-[400] flex items-center gap-2"><Icons.Bot /> {toast}</div>)}

              {/* Возврат только что удалённого. Держится 15 секунд — этого
                  хватает, чтобы заметить промах, и не мешает дальше работать.
                  Стоит ВЫШЕ обычных сообщений, чтобы они не перекрывались. */}
              {undoBin && (
                <div className="fixed left-1/2 -translate-x-1/2 glass-panel rounded-full z-[401] flex items-center gap-3 pl-5 pr-2 py-2 border-t border-white/10"
                     style={{ bottom: toast ? 76 : 24, maxWidth: 'calc(100vw - 32px)' }}>
                  <span className="text-sm text-zinc-300 truncate">
                    {undoBin.items.length === 1
                      ? `Удалён «${undoBin.items[0].label || 'без названия'}»`
                      : `Удалено ${undoBin.items.length} шт.`}
                  </span>
                  <button onClick={restoreRefs} className="shrink-0 px-4 py-1.5 rounded-full text-xs font-bold"
                          style={{ background: 'var(--accent)', color: 'var(--bg)' }}>Вернуть</button>
                  <button onClick={() => { clearTimeout(undoTimer.current); setUndoBin(null); }}
                          title="Скрыть" className="shrink-0 w-7 h-7 rounded-full text-zinc-500 hover:text-white hover:bg-white/10 flex items-center justify-center text-xs">✕</button>
                </div>
              )}

              <div className="flex flex-col flex-1 min-w-0">
                {/* ШАПКА ТЕЛЕФОНА — не навигация, а заголовок места.
                    Навигация уехала вниз, в таб-бар: строка иконок 14px
                    в шапке телефона нечитаема и не попадаема пальцем.
                    Здесь остаётся то, что отвечает на «где я»: название
                    модуля со счётчиком, точка связи и поиск. На карточке
                    сцены вместо этого — «‹ Сцены», режимы и «···». */}
                {isPhone ? (
                  <header className="flex items-center shrink-0 z-40 gap-2"
                          style={{ padding: '10px 16px 8px', background: 'var(--bg)' }}>
                    {currentView === 'notion' && phoneSceneOpen ? (
                      <React.Fragment>
                        <button onClick={() => setPhoneSceneOpen(false)}
                                style={{ color: 'var(--accent)', fontSize: 15, minHeight: 30, paddingRight: 6 }}>‹ Сцены</button>
                        <span className="cf-seg ml-auto">
                          {[['creative', 'Творч'], ['shoot', 'Съёмка'], ['present', 'Презент']].map(([id, label]) => (
                            <button key={id} onClick={() => setSceneMode(id)}
                                    className={sceneMode === id ? 'on' : ''}
                                    style={{ fontSize: 10.5, padding: '3px 8px' }}>{label}</button>
                          ))}
                        </span>
                        <button onClick={() => setPhoneSheet('more')} title="Ещё"
                                className="shrink-0 flex items-center justify-center"
                                style={{ width: 28, height: 24, border: '1px solid var(--border)', borderRadius: 7, color: 'var(--muted-2)', fontSize: 13, letterSpacing: 1 }}>···</button>
                      </React.Fragment>
                    ) : (
                      <React.Fragment>
                        <span style={{ fontSize: 20, fontWeight: 700, letterSpacing: '-.02em' }}>
                          {(navItems.find(t => t.id === currentView) || {}).label || 'CineFlow'}
                        </span>
                        <span className="cf-meta" style={{ marginTop: 3 }}>
                          {currentView === 'notion' ? scenes.length
                            : currentView === 'gallery' ? references.length
                            : currentView === 'locations' ? locations.length
                            : currentView === 'whiteboard' ? sortedBoards.length : ''}
                        </span>
                        {READ_ONLY && (
                          <button onClick={() => setShowViewInfo(true)} title="Почему нельзя ничего менять"
                                  className="cf-meta shrink-0 ml-auto flex items-center gap-1"
                                  style={{ color: 'var(--accent)', border: '1px solid var(--accent-line)',
                                           borderRadius: 8, padding: '3px 8px', minHeight: 26 }}>
                            Просмотр <span style={{ opacity: .7 }}>?</span>
                          </button>
                        )}
                        <button onClick={kickSyncNow} title={syncTitle + ' · нажмите, чтобы обновить связь'}
                                className={`shrink-0 flex items-center justify-center -m-2 p-2 ${READ_ONLY ? '' : 'ml-auto'}`}
                                style={{ opacity: kicking ? 0.4 : 1 }}>
                          <span className="rounded-full block" style={{ width: 7, height: 7, background: syncDot }}></span>
                        </button>
                        <button onClick={() => setShowSearch(true)} title="Поиск по всему проекту"
                                className="shrink-0 flex items-center justify-center"
                                style={{ width: 30, height: 30, border: '1px solid var(--border)', borderRadius: 8, color: 'var(--muted)' }}>
                          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                        </button>
                      </React.Fragment>
                    )}
                  </header>
                ) : (
                <React.Fragment>
                {/* ШАПКА — ЕДИНСТВЕННАЯ НАВИГАЦИЯ (планшет и компьютер).
                    Раньше их было две: рельс с модулями слева и список
                    сущностей рядом с ним. Теперь модули живут здесь строкой
                    иконок, а слева остаётся только список сцен / папок /
                    досок. Порядок слева направо: модули · поиск ⌘K ·
                    режимы экрана · точка связи · ···  */}
                <header className="flex items-center shrink-0 z-40 gap-2.5"
                        style={{ height: 'var(--header-h)', padding: '0 12px', background: 'var(--panel-2)', borderBottom: '1px solid var(--border)' }}>
                  <nav className="flex items-center gap-0.5 min-w-0 overflow-x-auto hide-scrollbar">
                    {navItems.map(t => (
                      currentView === t.id ? (
                        <span key={t.id} className="cf-navtab cf-navtab-on" title={t.label}>
                          <span className="cf-navtab-key">{t.label.charAt(0)}</span>{t.label.slice(1)}
                        </span>
                      ) : (
                        <button key={t.id} onClick={() => setCurrentView(t.id)} title={t.label}
                                className="cf-navtab transition-colors">{t.icon}</button>
                      )
                    ))}
                    {/* Чат — здесь же: раньше он жил только в рельсе, а на
                        телефоне рельса не было вовсе, и до чата (а вместе
                        с ним и до запроса разрешения на уведомления) было
                        не добраться. Одна строка — один путь для всех. */}
                    <button onClick={toggleChat} title="Чат группы"
                            className="cf-navtab relative transition-colors cf-edit-only"
                            style={showChat ? { color: 'var(--accent)' } : null}>
                      <Icons.Chat />
                      {unreadCount > 0 && (
                        <span className="absolute flex items-center justify-center font-bold rounded-full"
                              style={{ top: -1, right: 0, minWidth: 13, height: 13, padding: '0 3px', fontSize: 8.5, background: 'var(--accent)', color: 'var(--bg)' }}>{unreadCount}</span>
                      )}
                    </button>
                  </nav>

                  <button onClick={() => setShowSearch(true)} className="cf-search transition-colors"
                          title="Поиск по всему проекту — сцены, кадры, объекты, доски (⌘K)">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    <span className="flex-1 truncate text-left">Поиск…</span>
                    <span className="cf-kbd hidden sm:inline">⌘K</span>
                  </button>

                  {/* Режимы — четыре пресета экрана сцены под разный момент
                      работы: придумываем · едем смотреть место · снимаем ·
                      показываем режиссёру. На других экранах их нет. */}
                  {currentView === 'notion' && (
                    <div className="cf-seg cf-wide-only">
                      {SCENE_MODES.map(m => (
                        <button key={m.id} onClick={() => setSceneMode(m.id)} title={m.hint}
                                className={sceneMode === m.id ? 'on' : ''}>{m.label}</button>
                      ))}
                    </div>
                  )}

                  {/* Точка связи заодно и кнопка: нажать, если кажется,
                      что телефон показывает вчерашнее. Площадь нажатия
                      сделана пальцем, сама точка осталась мелкой. Слова
                      «Сохранено 15:42» ушли в подсказку — на 924 точках
                      строка из них не помещалась. */}
                  <button onClick={kickSyncNow} title={syncTitle + ' · нажмите, чтобы обновить связь'}
                          className="shrink-0 ml-auto flex items-center justify-center -m-2 p-2"
                          style={{ opacity: kicking ? 0.4 : 1 }}>
                    <span className="rounded-full block" style={{ width: 7, height: 7, background: syncDot }}></span>
                  </button>

                  {READ_ONLY ? (
                    // Надпись сделана КНОПКОЙ намеренно. Раньше человек,
                    // которому прислали ссылку для просмотра, видел пустой
                    // проект без «Проекта» и «Доступа» и не понимал, почему
                    // ничего не нажимается и куда делись кнопки. Выхода
                    // из этого режима не было вовсе.
                    <button onClick={() => setShowViewInfo(true)}
                            title="Почему нельзя ничего менять"
                            className="cf-meta shrink-0 flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg transition-colors hover:bg-white/5"
                            style={{ color: 'var(--accent)', border: '1px solid var(--accent-line)', minHeight: 28 }}>
                      Просмотр{CF_SNAPSHOT ? ' · снимок' : ''} <span style={{ opacity: .7 }}>?</span>
                    </button>
                  ) : (
                    <div className="relative shrink-0" ref={headMenuRef}>
                      <button onClick={() => setHeadMenu(v => !v)} title="Проект, доступ, агент КПП"
                              className="flex items-center justify-center rounded-lg transition-colors hover:bg-white/5"
                              style={{ width: 26, height: 26, border: '1px solid var(--border)', color: headMenu ? 'var(--text)' : 'var(--muted-2)', fontSize: 13, letterSpacing: 1 }}>···</button>
                      {headMenu && (
                        <div className="cf-menu">
                          <button onClick={() => { setHeadMenu(false); setShowProjectModal(true); }}><Icons.Folder /> Проект</button>
                          <button onClick={() => { setHeadMenu(false); setShowShareModal(true); }}><Icons.Link /> Доступ</button>
                          <hr />
                          <button onClick={() => { setHeadMenu(false); setShowAgentModal(true); }}><Icons.Bot /> Агент КПП</button>
                          {/* На телефоне режимы в шапку не помещаются — они
                              здесь. Прятать их совсем нельзя: «Съёмка» нужна
                              как раз с телефона, на площадке. */}
                          {currentView === 'notion' && (
                            <div className="md:hidden">
                              <hr />
                              <span className="cf-meta block px-2.5 pb-1">Режим экрана</span>
                              {SCENE_MODES.map(m => (
                                <button key={m.id} onClick={() => { setHeadMenu(false); setSceneMode(m.id); }}
                                        style={sceneMode === m.id ? { color: 'var(--accent)' } : null}>
                                  {sceneMode === m.id ? '● ' : '○ '}{m.label}
                                </button>
                              ))}
                            </div>
                          )}
                          <hr />
                          <span className="cf-meta block px-2.5 py-1.5">{scenes.length} сцен · {storyboard.length} кадров</span>
                        </div>
                      )}
                    </div>
                  )}
                </header>
                </React.Fragment>
                )}

              <div className="flex flex-1 overflow-hidden relative z-10">
                <div className="flex-1 overflow-hidden relative">

                  {/* ЭКРАН «СЦЕНА».
                      Три колонки: список сцен (сворачивается в полоску) ·
                      рабочая область · правая панель вкладками. Что именно
                      показано в середине, решает режим из шапки: за столом
                      придумывают, на выезде смотрят место, в смену снимают,
                      на показе показывают. Материал во всех четырёх один
                      и тот же — меняется только то, что вынесено вперёд. */}
                  <div className={`h-full w-full relative ${currentView === 'notion' ? 'flex' : 'hidden'}`}>
                    {(() => {
                      const s = scenes.find(sc => sc.id === activeSceneId) || sortedScenes[0] || null;
                      const lookbook = sceneMode === 'present';
                      const frames = s ? storyboard.filter(f => f.sceneId === s.id) : [];
                      const sceneRefs = s ? references.filter(r => r.sceneId === s.id) : [];
                      const sceneNotes = s ? stickies.filter(st => st.sceneId === s.id) : [];
                      const sceneDocs = s ? docs.filter(d => d.sceneId === s.id) : [];
                      const sceneLocs = s ? locations.filter(l => (l.sceneIds || []).includes(s.id)) : [];
                      const loc = sceneLocs[0] || null;
                      const locCoords = loc ? parseCoords(loc.coords) : null;
                      const locPhotos = loc ? references.filter(r => r.locationId === loc.id) : [];
                      const scheme = s && s.lightSchemeId ? lightSchemes.find(x => x.id === s.lightSchemeId) : null;
                      const eyebrow = { fontSize: 11, letterSpacing: '.1em', textTransform: 'uppercase', color: 'var(--muted)' };
                      const cardBox = { background: 'var(--card)', borderRadius: 10 };
                      const linkish = { fontSize: 11, color: 'var(--accent)', cursor: 'pointer' };

                      // Кадр в пропорции проекта. У Boords хвалят именно это:
                      // превью в той же рамке, в какой будет фильм, — иначе
                      // раскадровка обещает не тот кадр, который снимут.
                      // Пропорция выбирается один раз на проект (шаблон
                      // «Раскадровка» на пустой доске).
                      const SHOT_RATIO = projectRatio;

                      const frameThumb = (f, w) => (
                        f.image
                          ? <img src={f.image} style={{ width: '100%', aspectRatio: SHOT_RATIO, objectFit: 'cover', display: 'block' }} draggable="false" />
                          : <div className="flex items-center justify-center cf-meta"
                                 style={{ width: '100%', aspectRatio: SHOT_RATIO, border: '1px dashed var(--border)', borderRadius: 7, boxSizing: 'border-box', textTransform: 'uppercase' }}>
                               без картинки · текст
                             </div>
                      );

                      const addFrame = () => {
                        // Номер кадра — от наибольшего уже занятого, а не от их
                        // количества: после удаления кадра номер бы повторился.
                        let maxF = 0;
                        frames.forEach(f => { const m = String(f.frameNum || '').match(/(\d+)$/); if (m && +m[1] > maxF) maxF = +m[1]; });
                        const newF = { id: `sb-${Date.now()}`, sceneId: s.id, frameNum: `${s.number}.${maxF + 1}`, description: '', image: '' };
                        setStoryboard([...storyboard, newF]); syncDoc('storyboard', newF.id, newF);
                      };
                      const patchFrame = (id, patch) => {
                        const up = storyboard.map(x => x.id === id ? { ...x, ...patch } : x);
                        setStoryboard(up); syncDoc('storyboard', id, up.find(x => x.id === id));
                      };
                      const dropFrame = (id) => setConfirmAction({ title: 'Удалить кадр?', message: 'Отменить действие невозможно.',
                        onConfirm: () => { setStoryboard(storyboard.filter(f => f.id !== id)); deleteNetDoc('storyboard', id); } });

                      // ЧИПЫ СВЯЗЕЙ. Один и тот же чип сцены/объекта/доски
                      // ведёт в одно и то же место откуда угодно — это и была
                      // главная боль: связи между модулями существовали
                      // в голове, а не в интерфейсе.
                      const linkChips = (
                        <div className="flex flex-wrap gap-2 mt-4">
                          {sceneLocs.map(l => (
                            <button key={l.id} onClick={() => { setActiveLocationId(l.id); setCurrentView('locations'); }}
                                    className="cf-chip cf-chip-accent" title="Открыть объект: фото, карта, солнце">
                              Объект · {l.name || 'без названия'}
                            </button>
                          ))}
                          <button onClick={() => setSceneToBoard(s.id)} className="cf-chip"
                                  title="Выложить сцену и все её референсы на доску">
                            Доска сцены{sceneRefs.length ? ` · ${sceneRefs.length}` : ''}
                          </button>
                          {scheme && (
                            <button onClick={() => { setActiveSchemeId(scheme.id); setActiveDocId(null); setCurrentView('docs'); }}
                                    className="cf-chip" title="Открыть интерактивную схему света">
                              {scheme.title || 'Схема света'}
                            </button>
                          )}
                        </div>
                      );


                      // ================= ТЕЛЕФОН =================
                      // Отдельная раскладка, а не сжатая настольная. Телефон
