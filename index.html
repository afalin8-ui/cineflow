        const compressImage = (base64Str, maxWidth, maxHeight, callback) => {
          const img = new Image();
          img.onerror = () => callback(base64Str);
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width; let height = img.height;
            if (width > height) { if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; } } 
            else { if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; } }
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);
            callback(canvas.toDataURL('image/jpeg', 0.8)); 
          };
          img.src = base64Str;
        };

        const DrawingModal = ({ onSave, onClose }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [color, setColor] = useState('#ffffff');
            const [brushSize, setBrushSize] = useState(4);
            const [tool, setTool] = useState('brush'); 
            const lastPoint = useRef({ x: 0, y: 0, pressure: 0.5, time: 0 });

            useEffect(() => {
                const canvas = canvasRef.current;
                if(canvas) {
                    canvas.width = 1920; canvas.height = 1080;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#262624'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                }
            }, []);

            const getPos = (e) => {
                const canvas = canvasRef.current; const rect = canvas.getBoundingClientRect();
                return { x: (e.clientX - rect.left) * (canvas.width / rect.width), y: (e.clientY - rect.top) * (canvas.height / rect.height), pressure: e.pressure !== undefined && e.pressure !== 0 ? e.pressure : 0.5 };
            };

            const startDrawing = (e) => {
                e.target.setPointerCapture(e.pointerId);
                setIsDrawing(true); const pos = getPos(e); lastPoint.current = { ...pos, time: Date.now() };
                const ctx = canvasRef.current.getContext('2d'); ctx.beginPath();
                const baseBrush = brushSize * (canvasRef.current.width / 800);
                ctx.arc(pos.x, pos.y, (baseBrush * (0.5 + pos.pressure)) / 2, 0, Math.PI * 2);
                ctx.fillStyle = tool === 'eraser' ? '#262624' : color; ctx.fill();
            };

            const draw = (e) => {
                if (!isDrawing) return; const pos = getPos(e); const ctx = canvasRef.current.getContext('2d');
                const cT = Date.now(); const dist = Math.hypot(pos.x - lastPoint.current.x, pos.y - lastPoint.current.y);
                let press = pos.pressure;
                if (e.pointerType === 'touch' || e.pointerType === 'mouse') { press = Math.max(0.1, 1 - (dist / (cT - lastPoint.current.time || 1)) * 0.15); }

                ctx.beginPath(); ctx.moveTo(lastPoint.current.x, lastPoint.current.y);
                ctx.quadraticCurveTo(lastPoint.current.x, lastPoint.current.y, (lastPoint.current.x + pos.x) / 2, (lastPoint.current.y + pos.y) / 2);
                ctx.lineTo(pos.x, pos.y);
                
                ctx.strokeStyle = tool === 'eraser' ? '#262624' : color;
                const baseBrush = brushSize * (canvasRef.current.width / 800);
                ctx.lineWidth = baseBrush * (0.5 + press * 1.5); ctx.stroke();
                lastPoint.current = { ...pos, time: cT };
            };

            const stopDrawing = (e) => {
                if (e.target.hasPointerCapture && e.target.hasPointerCapture(e.pointerId)) {
                    e.target.releasePointerCapture(e.pointerId);
                }
                setIsDrawing(false);
            };

            return (
                <div className="fixed inset-0 z-[300] bg-[#1a1918]/95 backdrop-blur-xl flex flex-col">
                    <div className="flex justify-between items-center p-4 glass-panel border-b-0 shrink-0">
                        <div className="flex items-center gap-4">
                            <span className="text-white font-bold text-sm flex items-center gap-2"><Icons.Pen /> Модуль быстрого скетча</span>
                            <div className="flex gap-1 bg-black/50 p-1 rounded-lg">
                                <button onClick={() => setTool('brush')} className={`px-3 py-1 text-xs rounded flex items-center gap-1 ${tool === 'brush' ? 'bg-indigo-600 text-white' : 'text-zinc-400'}`}><Icons.Pen /> Кисть</button>
                                <button onClick={() => setTool('eraser')} className={`px-3 py-1 text-xs rounded flex items-center gap-1 ${tool === 'eraser' ? 'bg-zinc-700 text-white' : 'text-zinc-400'}`}><Icons.Eraser /> Ластик</button>
                            </div>
                            <input type="range" min="1" max="20" value={brushSize} onChange={e => setBrushSize(Number(e.target.value))} className="w-24 accent-indigo-500" />
                            <div className="gap-1 ml-4 hidden sm:flex">
                                {['#ffffff', '#f87171', '#60a5fa', '#34d399', '#facc15'].map(c => (
                                    <button key={c} onClick={() => {setColor(c); setTool('brush');}} style={{background: c}} className={`w-6 h-6 rounded-full border-2 ${color === c && tool === 'brush' ? 'border-white scale-110' : 'border-transparent hover:scale-110'} transition-transform`} />
                                ))}
                            </div>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => { const ctx = canvasRef.current.getContext('2d'); ctx.fillStyle = '#262624'; ctx.fillRect(0, 0, canvasRef.current.width, canvasRef.current.height); }} className="px-4 py-2 bg-zinc-800 text-zinc-300 text-xs rounded-lg hover:bg-zinc-700 flex items-center gap-1"><Icons.Trash /> Очистить</button>
                            <button onClick={() => onSave(canvasRef.current.toDataURL('image/jpeg', 0.8))} className="px-4 py-2 bg-indigo-600 text-white text-xs rounded-lg hover:bg-indigo-500 font-bold">Сохранить</button>
                            <button onClick={onClose} className="px-4 py-2 bg-white/10 text-white text-xs rounded-lg hover:bg-white/20">Отмена</button>
                        </div>
                    </div>
                    <div className="flex-1 p-4 md:p-12 flex justify-center items-center overflow-hidden">
                        <div className="w-full max-w-5xl aspect-video relative rounded-xl overflow-hidden border border-zinc-800">
                            <canvas ref={canvasRef} onPointerDown={startDrawing} onPointerMove={draw} onPointerUp={stopDrawing} onPointerCancel={stopDrawing} className="absolute inset-0 w-full h-full cursor-crosshair touch-none" />
                        </div>
                    </div>
                </div>
            );
        };

        const Lightbox = ({ refs, initialId, onClose }) => {
            const [currentId, setCurrentId] = useState(initialId);
            const currentIndex = refs.findIndex(r => r.id === currentId);
            const currentRef = refs[currentIndex];

            return (

                    <div className="relative w-full h-full flex justify-center items-center max-w-[95vw] max-h-[95vh]">
                        {currentIndex > 0 && ( <button onClick={(e) => { e.stopPropagation(); setCurrentId(refs[currentIndex - 1].id); }} className="absolute left-2 md:left-8 p-4 bg-black/50 rounded-full text-white hover:bg-indigo-600 z-10 transition-colors"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m15 18-6-6 6-6"/></svg></button> )}

                    </div>
                    {currentRef.label && <div className="absolute bottom-6 px-6 py-2 glass-panel rounded-full text-sm font-medium text-white max-w-md text-center truncate">{currentRef.label}</div>}
                </div>
            );
        };

        const LightSchemeEditor = ({ scheme, onSave, onClose }) => {
            const [elements, setElements] = useState(scheme?.elements || []);
            const [mode, setMode] = useState('select'); 
            const [selectedId, setSelectedId] = useState(null);
            const [drawData, setDrawData] = useState(scheme?.drawData || null);
            const canvasRef = useRef(null);
            const containerRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [brushColor, setBrushColor] = useState('#facc15');
            const [brushSize, setBrushSize] = useState(10);
            const lastPt = useRef({x:0, y:0});
            
            const [draggingEl, setDraggingEl] = useState(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if(canvas) {
                    canvas.width = 1600; canvas.height = 900;
                    const ctx = canvas.getContext('2d');
                    if (drawData) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0); img.src = drawData; }
                }
            }, []);

            const handlePointerDown = (e) => {
                if (mode === 'select' || mode === 'text' || mode === 'rect' || mode === 'circle' || mode === 'triangle') {
                    if (e.target.closest('.scheme-el')) return;
                    if (['rect', 'circle', 'text', 'triangle'].includes(mode)) {
                        const rect = containerRef.current.getBoundingClientRect();
                        const x = (e.clientX - rect.left) * (1600 / rect.width);
                        const y = (e.clientY - rect.top) * (900 / rect.height);
                        const newEl = { id: `el-${Date.now()}`, type: mode, x, y, w: 100, h: 100, color: brushColor, text: mode === 'text' ? 'Текст' : '', label: '' };
                        if(mode === 'text') { newEl.w = 200; newEl.h = 50; }
                        setElements([...elements, newEl]);
                        setMode('select'); setSelectedId(newEl.id);
                    } else { setSelectedId(null); }
                    return;
                }
                e.currentTarget.setPointerCapture(e.pointerId);
                setIsDrawing(true);
                const rect = canvasRef.current.getBoundingClientRect();
                lastPt.current = { x: (e.clientX - rect.left) * (1600 / rect.width), y: (e.clientY - rect.top) * (900 / rect.height) };
                const ctx = canvasRef.current.getContext('2d'); ctx.beginPath(); ctx.arc(lastPt.current.x, lastPt.current.y, brushSize/2, 0, Math.PI*2); ctx.fillStyle = mode==='erase' ? 'rgba(0,0,0,1)' : brushColor;
                if(mode==='erase') ctx.globalCompositeOperation = 'destination-out'; else { ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = 0.5; }
                ctx.fill(); ctx.globalAlpha = 1.0; ctx.globalCompositeOperation = 'source-over';
            };

            const handlePointerMove = (e) => {
                if (draggingEl) {
                    const rect = containerRef.current.getBoundingClientRect();
                    const nx = (e.clientX - rect.left) * (1600 / rect.width) - draggingEl.ox;
                    const ny = (e.clientY - rect.top) * (900 / rect.height) - draggingEl.oy;
                    setElements(elements.map(el => el.id === draggingEl.id ? {...el, x: nx, y: ny} : el));
                    return;
                }
                if (!isDrawing) return;
                const rect = canvasRef.current.getBoundingClientRect();
                const pos = { x: (e.clientX - rect.left) * (1600 / rect.width), y: (e.clientY - rect.top) * (900 / rect.height) };
                const ctx = canvasRef.current.getContext('2d');
                ctx.save();
                if (mode === 'erase') { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = brushSize*2; ctx.strokeStyle = 'rgba(0,0,0,1)'; }
                else { ctx.strokeStyle = brushColor; ctx.lineWidth = brushSize; ctx.globalAlpha = 0.5; ctx.globalCompositeOperation = 'screen'; }
                ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(lastPt.current.x, lastPt.current.y); ctx.lineTo(pos.x, pos.y); ctx.stroke(); ctx.restore();
                lastPt.current = pos;
            };

            const handlePointerUp = (e) => { 
                if (e.target.hasPointerCapture && e.target.hasPointerCapture(e.pointerId)) {
                    e.target.releasePointerCapture(e.pointerId);
                }
                setIsDrawing(false); setDraggingEl(null); 
            };

            const updateSelected = (updates) => { setElements(elements.map(el => el.id === selectedId ? {...el, ...updates} : el)); };

            return (
                <div className="fixed inset-0 z-[300] bg-[#1a1918]/95 backdrop-blur-xl flex flex-col">
                    <div className="flex justify-between items-center p-4 glass-panel border-b-0 shrink-0">
                        <div className="flex items-center gap-4">
                            <span className="text-amber-400 font-bold text-sm flex items-center gap-2"><Icons.Lightbulb /> Интерактивная Схема Света</span>
                            <div className="flex gap-1 bg-black/50 p-1 rounded-lg">
                                <button onClick={() => setMode('select')} className={`px-2 py-1 text-xs rounded ${mode==='select'?'bg-indigo-600 text-white':'text-zinc-400'}`}><Icons.Pointer/></button>
                                <button onClick={() => setMode('draw')} className={`px-2 py-1 text-xs rounded ${mode==='draw'?'bg-indigo-600 text-white':'text-zinc-400'}`}><Icons.Pen/></button>
                                <button onClick={() => setMode('erase')} className={`px-2 py-1 text-xs rounded ${mode==='erase'?'bg-zinc-700 text-white':'text-zinc-400'}`}><Icons.Eraser/></button>
                                <div className="w-[1px] h-4 bg-white/20 my-auto mx-1"></div>
                                <button onClick={() => setMode('rect')} className={`px-2 py-1 text-xs rounded ${mode==='rect'?'bg-indigo-600 text-white':'text-zinc-400'}`}><Icons.Square/></button>
                                <button onClick={() => setMode('circle')} className={`px-2 py-1 text-xs rounded ${mode==='circle'?'bg-indigo-600 text-white':'text-zinc-400'}`}><Icons.Circle/></button>
                                <button onClick={() => setMode('triangle')} className={`px-2 py-1 text-xs rounded ${mode==='triangle'?'bg-indigo-600 text-white':'text-zinc-400'}`}><Icons.Triangle/></button>
                                <button onClick={() => setMode('text')} className={`px-2 py-1 text-xs rounded ${mode==='text'?'bg-indigo-600 text-white':'text-zinc-400'}`}><Icons.TextIcon/></button>
                            </div>
                            <div className="flex gap-1 ml-2">
                                {['#facc15', '#60a5fa', '#f87171', '#34d399', '#ffffff'].map(c => (
                                    <button key={c} onClick={() => {setBrushColor(c); if(selectedId) updateSelected({color: c});}} style={{background: c}} className={`w-5 h-5 rounded-full border-2 ${brushColor === c ? 'border-white scale-110' : 'border-transparent hover:scale-110'} transition-transform`} />
                                ))}
                            </div>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => {
                                const pc = document.createElement('canvas'); pc.width = 1600; pc.height = 900;
                                const pctx = pc.getContext('2d');
                                pctx.fillStyle = '#262624'; pctx.fillRect(0, 0, 1600, 900);
                                pctx.globalAlpha = 0.85; pctx.drawImage(canvasRef.current, 0, 0); pctx.globalAlpha = 1;
                                elements.forEach(el => {
                                    pctx.fillStyle = el.color || '#facc15';
                                    if (el.type === 'rect') { pctx.fillRect(el.x, el.y, el.w, el.h); }
                                    else if (el.type === 'circle') { pctx.beginPath(); pctx.ellipse(el.x + el.w/2, el.y + el.h/2, el.w/2, el.h/2, 0, 0, Math.PI*2); pctx.fill(); }
                                    else if (el.type === 'triangle') { pctx.beginPath(); pctx.moveTo(el.x + el.w/2, el.y); pctx.lineTo(el.x, el.y + el.h); pctx.lineTo(el.x + el.w, el.y + el.h); pctx.closePath(); pctx.fill(); }
                                    else if (el.type === 'text') { pctx.font = 'bold 30px Inter, sans-serif'; pctx.fillText(el.text || '', el.x + 8, el.y + 36); }
                                    if (el.label) { pctx.font = '22px Inter, sans-serif'; pctx.fillStyle = '#f0eee6'; pctx.textAlign = 'center'; pctx.fillText(el.label, el.x + el.w/2, el.y + el.h + 30); pctx.textAlign = 'left'; }
                                });
                                onSave(scheme.id, elements, canvasRef.current.toDataURL('image/png'), pc.toDataURL('image/jpeg', 0.85));
                            }} className="px-4 py-2 bg-indigo-600 text-white text-xs rounded-lg hover:bg-indigo-500 font-bold">Сохранить схему</button>
                            <button onClick={onClose} className="px-4 py-2 bg-white/10 text-white text-xs rounded-lg hover:bg-white/20">Закрыть</button>
                        </div>
                    </div>

                    <div className="flex-1 flex overflow-hidden">
                        <div className="flex-1 relative p-4 flex justify-center items-center" onPointerMove={handlePointerMove} onPointerUp={handlePointerUp} onPointerCancel={handlePointerUp}>
                            <div ref={containerRef} onPointerDown={handlePointerDown} className="relative w-full max-w-5xl aspect-video bg-zinc-950 rounded-xl overflow-hidden border border-white/10 cursor-crosshair">
                                <canvas ref={canvasRef} className="absolute inset-0 w-full h-full pointer-events-none opacity-80" />
                                {elements.map(el => (
                                    <div key={el.id} className={`scheme-el absolute pointer-events-auto ${selectedId === el.id ? 'ring-2 ring-indigo-400' : ''}`} 
                                        style={{ left: `${(el.x/1600)*100}%`, top: `${(el.y/900)*100}%`, width: `${(el.w/1600)*100}%`, height: `${(el.h/900)*100}%` }}
                                        onPointerDown={(e) => { e.stopPropagation(); setSelectedId(el.id); setMode('select'); setDraggingEl({id: el.id, ox: (e.clientX - e.currentTarget.getBoundingClientRect().left)*(1600/containerRef.current.getBoundingClientRect().width), oy: (e.clientY - e.currentTarget.getBoundingClientRect().top)*(900/containerRef.current.getBoundingClientRect().height)}); }}>
                                        {el.type === 'rect' && <div className="w-full h-full rounded-md border-2 border-white/20" style={{backgroundColor: el.color}}/>}
                                        {el.type === 'circle' && <div className="w-full h-full rounded-full border-2 border-white/20" style={{backgroundColor: el.color}}/>}
                                        {el.type === 'triangle' && <div className="w-full h-full border-2 border-transparent" style={{backgroundColor: el.color, clipPath: 'polygon(50% 0%, 0% 100%, 100% 100%)'}}/>}
                                        {el.type === 'text' && <textarea value={el.text} onChange={e => {setElements(elements.map(x=>x.id===el.id?{...x, text:e.target.value}:x))}} className="w-full h-full bg-black/60 border border-white/20 text-white font-bold p-1 resize-none focus:outline-none rounded-md text-xs" style={{color: el.color}} />}
                                        {el.label && (
                                            <div className="absolute top-full mt-2 left-1/2 -translate-x-1/2 bg-black/90 text-white font-medium text-[11px] px-2 py-1 rounded border border-white/20 whitespace-nowrap z-50 pointer-events-none">
                                                {el.label}
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>
                        {selectedId && elements.find(e=>e.id===selectedId) && (
                            <div className="w-64 glass-panel border-l border-white/10 p-4 space-y-4 shrink-0 flex flex-col">
                                <span className="text-xs font-bold text-zinc-400 uppercase">Свойства прибора / формы</span>
                                <div className="space-y-2">
                                    <label className="text-[11px] text-zinc-400">Маркировка (Модель/Прибор)</label>
                                    <input type="text" value={elements.find(e=>e.id===selectedId).label || ''} onChange={e=>updateSelected({label: e.target.value})} className="w-full glass-input rounded px-2 py-1.5 text-xs" placeholder="Напр: ARRI SkyPanel S60" />
                                </div>
                                <div className="space-y-2">
                                    <label className="text-[11px] text-zinc-400">Ширина</label>
                                    <input type="range" min="20" max="400" value={elements.find(e=>e.id===selectedId).w} onChange={e=>updateSelected({w: Number(e.target.value)})} className="w-full accent-indigo-500" />
                                </div>
                                <div className="space-y-2">
                                    <label className="text-[11px] text-zinc-400">Высота</label>
                                    <input type="range" min="20" max="400" value={elements.find(e=>e.id===selectedId).h} onChange={e=>updateSelected({h: Number(e.target.value)})} className="w-full accent-indigo-500" />
                                </div>
                                <button onClick={() => {setElements(elements.filter(e=>e.id!==selectedId)); setSelectedId(null);}} className="mt-auto bg-red-600/20 text-red-400 border border-red-500/30 py-2 rounded-xl text-xs font-bold hover:bg-red-600/40">Удалить объект</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        function AppCore() {
          const [user, setUser] = useState(null);
          const [userName, setUserName] = useState('');
          const [userRole, setUserRole] = useState('');
          const [showWelcome, setShowWelcome] = useState(false);
          const clientId = useMemo(() => { let cid = localStorage.getItem('cf_client_id'); if (!cid) { cid = 'u-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); localStorage.setItem('cf_client_id', cid); } return cid; }, []);
          const [isOnline, setIsOnline] = useState(navigator.onLine);
          
          const safeLoad = (key, fallback, isArray = true) => {
            try { 
              const saved = localStorage.getItem(key); if (!saved) return fallback; 
              const parsed = JSON.parse(saved); 
              if (isArray) return Array.isArray(parsed) ? parsed : fallback;
              return (parsed !== null && typeof parsed === 'object') ? parsed : fallback;
            } catch (e) { return fallback; }
          };

          const [scenes, setScenes] = useState(() => safeLoad('cf_scenes', initialScenes, true));
          const [storyboard, setStoryboard] = useState(() => safeLoad('cf_storyboard', [], true));
          const [references, setReferences] = useState(() => safeLoad('cf_references', [], true));
          const [stickies, setStickies] = useState(() => safeLoad('cf_stickies', [], true));
          const [docs, setDocs] = useState(() => safeLoad('cf_docs', initialDocs, true));
          const [crew, setCrew] = useState(() => safeLoad('cf_crew', [], true));
          const [projectFiles, setProjectFiles] = useState(() => safeLoad('cf_files', [], true));
          
          const [gearTypes, setGearTypes] = useState(() => safeLoad('cf_geartypes', DEFAULT_GEAR, false));
          const [lightGearTypes, setLightGearTypes] = useState(() => safeLoad('cf_lightgeartypes', DEFAULT_LIGHT_GEAR, false));
          const [lightSchemes, setLightSchemes] = useState(() => safeLoad('cf_lightschemes', [], true));

          const [messages, setMessages] = useState([]); 

          const [currentView, setCurrentView] = useState('notion'); 
          const [activeSceneId, setActiveSceneId] = useState('scene-1');
          const [activeDocId, setActiveDocId] = useState('doc-1');
          const [showImages, setShowImages] = useState(true); 
          const [showProjectModal, setShowProjectModal] = useState(false);
          const [showShareModal, setShowShareModal] = useState(false);
          const [showChat, setShowChat] = useState(false); 
          const [chatInput, setChatInput] = useState('');
          const [tableSubView, setTableSubView] = useState('grouped');
          const [toast, setToast] = useState(null);
          const [isAILoading, setIsAILoading] = useState(false);
          
          const [confirmAction, setConfirmAction] = useState(null); 
          const [drawingFrameId, setDrawingFrameId] = useState(null);
          const [lightboxData, setLightboxData] = useState(null);
          const [showAgentModal, setShowAgentModal] = useState(false);
          const [manualJsonInput, setManualJsonInput] = useState('');
          const [tagSearch, setTagSearch] = useState('');
          
          const [activeSchemeId, setActiveSchemeId] = useState(null);
          const [drawingSchemeId, setDrawingSchemeId] = useState(null);
          const [expandedLightSceneId, setExpandedLightSceneId] = useState(null);

          const [lastReadChat, setLastReadChat] = useState(() => Number(localStorage.getItem('cf_last_read')) || Date.now());
          const [newGearName, setNewGearName] = useState('');
          const [newLightGearName, setNewLightGearName] = useState('');

          const [wbMode, setWbMode] = useState('select'); 
          const [brushColor, setBrushColor] = useState('#d97757'); 
          const [brushType, setBrushType] = useState('pen'); 
          const [brushSize, setBrushSize] = useState(4); 
          const [canvasOffset, setCanvasOffset] = useState({ x: 0, y: 0 }); 
          const [zoom, setZoom] = useState(1.0);
          const [isPainting, setIsPainting] = useState(false);
          const [isPanning, setIsPanning] = useState(false);
          const [panStart, setPanStart] = useState({ x: 0, y: 0 });

          const lastPoint = useRef({ x: 0, y: 0, pressure: 0.5, time: 0 });
          const [linkingFromRefId, setLinkingFromRefId] = useState(null);
          const [mousePos, setMousePos] = useState({ x: 0, y: 0 });
          const [hoveredSceneId, setHoveredSceneId] = useState(null);
          
          const [selectedWbItems, setSelectedWbItems] = useState([]);
          const [selectionBox, setSelectionBox] = useState(null);
          const [draggingWbItems, setDraggingWbItems] = useState(null);

          const canvasRef = useRef(null);
          const paintCanvasRef = useRef(null);

          const showToast = (message) => { setToast(message); setTimeout(() => setToast(null), 3500); };

          // Авторизация Firebase
          useEffect(() => {
            if (auth) {
              auth.signInAnonymously().catch(err => console.warn("Firebase auth warning:", err));
              const unsub = auth.onAuthStateChanged(u => setUser(u));
              return () => unsub();
            }
          }, []);

          useEffect(() => {
            const handleOnline = () => setIsOnline(true);
            const handleOffline = () => setIsOnline(false);
            window.addEventListener('online', handleOnline);
            window.addEventListener('offline', handleOffline);
            const handleMouseMove = (e) => {
                setMousePos({ x: e.clientX, y: e.clientY });
                if (linkingFromRefId) {
                    const el = document.elementFromPoint(e.clientX, e.clientY);
                    const targetScene = el?.closest('[data-scene-id]');
                    setHoveredSceneId(targetScene ? targetScene.getAttribute('data-scene-id') : null);
                }
            };
            window.addEventListener('pointermove', handleMouseMove);
            return () => { window.removeEventListener('online', handleOnline); window.removeEventListener('offline', handleOffline); window.removeEventListener('pointermove', handleMouseMove); };
          }, [linkingFromRefId]);

          useEffect(() => {
              const savedName = localStorage.getItem('cf_user_name');
              const savedRole = localStorage.getItem('cf_user_role');
              if (!savedName) { setShowWelcome(true); } else { setUserName(savedName); setUserRole(savedRole || 'Оператор-постановщик'); }
          }, []);

          useEffect(() => { if (showChat) { const now = Date.now(); setLastReadChat(now); localStorage.setItem('cf_last_read', now); } }, [showChat, messages]);

          const unreadCount = useMemo(() => messages.filter(m => m.timestamp > lastReadChat && (m.senderId ? m.senderId !== clientId : m.senderName !== userName)).length, [messages, lastReadChat, userName, clientId]);

          // Счётчик непрочитанных в заголовке вкладки
          useEffect(() => { document.title = (unreadCount > 0 ? '(' + unreadCount + ') ' : '') + 'CineFlow Prep'; }, [unreadCount]);

          // Браузерные уведомления о новых сообщениях (когда вкладка в фоне или чат закрыт)
          const prevMsgCount = useRef(null);
          useEffect(() => {
            if (prevMsgCount.current === null) { prevMsgCount.current = messages.length; return; }
            const fresh = messages.slice(prevMsgCount.current).filter(m => m.senderId !== clientId);
            prevMsgCount.current = messages.length;
            if (!fresh.length) return;
            if ((document.hidden || !showChat) && 'Notification' in window && Notification.permission === 'granted') {
              const m = fresh[fresh.length - 1];
              try { new Notification(m.senderName + ' — ' + (m.senderRole || ''), { body: m.text, tag: 'cineflow-chat' }); } catch (e) {}
            }
          }, [messages, showChat, clientId]);

          const [geminiKey, setGeminiKeyRaw] = useState(() => localStorage.getItem('cf_gemini_key') || '');
          const saveGeminiKey = (v) => { setGeminiKeyRaw(v); localStorage.setItem('cf_gemini_key', v.trim()); };
          const [showGeminiKey, setShowGeminiKey] = useState(true);
          
          const callGeminiAI = async (promptText, isAgent = false) => {
            if (!geminiKey.trim()) { showToast("🔑 Укажите ключ Gemini API в меню «Проект»."); return null; }
            try {
              const systemInstruction = isAgent 
                ? "Ты ИИ-агент Второго Режиссера. Твоя задача — распарсить текст КПП и выдать ТОЛЬКО чистый массив JSON. Ищи дату съемки и переводи в формат YYYY-MM-DD. Дата применяется ко всем сценам ниже. Ищи номер сцены. Объект и время суток ставь в title. Описание ставь в content. Никакого текста кроме JSON массива [{}]." 
                : "Ты голливудский сценарист и оператор-постановщик. Помогай описывать сцены и световой сетап.";

              const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${geminiKey.trim()}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }], systemInstruction: { parts: [{ text: systemInstruction }] } })
              });
              const result = await response.json();
              if (!response.ok) { console.error(result); showToast("❌ Ошибка ИИ: " + (result?.error?.message || response.status)); return null; }
              return result.candidates?.[0]?.content?.parts?.[0]?.text || '';
            } catch (err) { console.error(err); showToast("Ошибка сети при вызове ИИ."); return null; }
          };

          const handleAIAgentFile = async (e) => {
            const file = e.target.files[0]; if (!file) return;
            setIsAILoading(true); showToast("🤖 Агент читает документ КПП...");
            const reader = new FileReader();
            reader.onload = async (event) => {
              let textContent = "";
              try {
                if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls') || file.name.endsWith('.csv')) {
                  const data = new Uint8Array(event.target.result); const workbook = XLSX.read(data, {type: 'array'});
                  const rawArray = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], {header: 1, defval: ""});
                  const cleanArray = rawArray.filter(row => row.some(cell => String(cell).trim() !== ""));
                  textContent = JSON.stringify(cleanArray);
                } else { textContent = new TextDecoder("utf-8").decode(event.target.result); }
                if (!textContent.trim() || textContent === "[]") throw new Error("Empty file");
                showToast("✨ Агент структурирует сцены...");
                const promptText = `Распарси этот 2D-массив (строки таблицы Excel). \nФормат нужного JSON:\n[ { "number": "2-1", "title": "ИНТ. ОФИС - ДЕНЬ", "date": "2026-06-29", "content": "Описание" } ]\n\nДанные:\n${textContent.substring(0, 15000)}`;
                const aiResponse = await callGeminiAI(promptText, true);
                if (aiResponse) {
                  const match = aiResponse.match(/\[[\s\S]*\]/); 
                  if (match) {
                    const parsed = JSON.parse(match[0]);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                      const newScenes = parsed.map((ps, idx) => ({ id: `scene-${Date.now()}-${idx}`, number: ps.number || String(scenes.length + idx + 1), title: ps.title || 'Сцена', content: ps.content || '', x: (150 - canvasOffset.x) / zoom + (idx * 40), y: (150 - canvasOffset.y) / zoom + (idx * 40), date: ps.date || '', gear: {}, lightGear: {}, lightSchemeId: null }));
                      setScenes([...scenes, ...newScenes]); newScenes.forEach(ns => syncDoc('scenes', ns.id, ns)); showToast(`✅ Агент успешно импортировал ${newScenes.length} сцен!`);
                    } else { showToast("❌ Агент не обнаружил сцен."); }
                  } else { showToast("❌ Ошибка ответа ИИ."); }
                }
              } catch (err) { showToast("❌ Ошибка чтения файла."); }
              setIsAILoading(false); e.target.value = '';
            }; reader.readAsArrayBuffer(file);
          };

          const enhanceSceneWithAI = async (sceneId, currentContent, title) => {
            setIsAILoading(true); showToast("✨ ИИ расширяет экспликацию...");
            const prompt = `Разверни и профессионально улучши операторское описание этой сцены. Название: ${title}. Исходный набросок: ${currentContent || 'Пусто'}`;
            const aiText = await callGeminiAI(prompt, false);
            if (aiText) { updateScene(sceneId, 'content', aiText); showToast("✨ Экспликация обновлена!"); }
            setIsAILoading(false);
          };

          const seededRef = useRef({});
          useEffect(() => {
            if (!db || !user) return;
            const baseRef = db.collection('artifacts').doc(appId).collection('public').doc('data');
            const subList = (coll, setter, seed) => baseRef.collection(coll).onSnapshot(snap => {
              const list = []; snap.forEach(d => list.push(d.data()));
              if (snap.empty && !seededRef.current[coll]) {
                seededRef.current[coll] = true;
                if (seed && seed.length) { seed.forEach(item => syncDoc(coll, item.id, item)); return; }
              }
              setter(list);
            }, err => console.warn('sync ' + coll, err));
            const subMap = (coll, setter, seed) => baseRef.collection(coll).onSnapshot(snap => {
              const obj = {}; snap.forEach(d => { obj[d.id] = d.data(); });
              if (snap.empty && !seededRef.current[coll]) {
                seededRef.current[coll] = true;
                if (seed && Object.keys(seed).length) { Object.entries(seed).forEach(([k, v]) => syncDoc(coll, k, v)); return; }
              }
              if (Object.keys(obj).length) setter(obj);
            }, err => console.warn('sync ' + coll, err));
            const unsubs = [
              subList('scenes', setScenes, scenes),
              subList('storyboard', setStoryboard, storyboard),
              subList('references', setReferences, references),
              subList('stickies', setStickies, stickies),
              subList('docs', setDocs, docs),
              subList('crew', setCrew, crew),
              subList('projectFiles', setProjectFiles, projectFiles),
              subList('lightSchemes', setLightSchemes, lightSchemes),
              subMap('gearTypes', setGearTypes, gearTypes),
              subMap('lightGearTypes', setLightGearTypes, lightGearTypes),
              baseRef.collection('messages').onSnapshot(snap => { const list = []; snap.forEach(d => list.push(d.data())); setMessages(list.sort((a,b)=>a.timestamp-b.timestamp)); }, err => console.warn('sync messages', err)),
              baseRef.collection('canvas').doc('globalDraw').onSnapshot(doc => {
                if (doc.exists && doc.data().lastDrawBy !== user.uid && paintCanvasRef.current) {
                  const ctx = paintCanvasRef.current.getContext('2d'); const img = new Image();
                  img.onload = () => { ctx.clearRect(0, 0, 4000, 4000); ctx.drawImage(img, 0, 0); }; img.src = doc.data().dataUrl;
                }
              })
            ]; return () => unsubs.forEach(u => u());
          }, [user]);

          // Автосохранение в localStorage — всегда (локальная копия на случай сбоя облака)
          useEffect(() => {
            const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { console.warn('localStorage переполнен:', k); } };
            save('cf_scenes', scenes); save('cf_storyboard', storyboard);
            save('cf_references', references); save('cf_stickies', stickies);
            save('cf_docs', docs); save('cf_crew', crew);
            save('cf_files', projectFiles); save('cf_geartypes', gearTypes);
            save('cf_lightgeartypes', lightGearTypes); save('cf_lightschemes', lightSchemes);
          }, [scenes, storyboard, references, stickies, docs, crew, projectFiles, gearTypes, lightGearTypes, lightSchemes]);

          const syncTimers = useRef({});
          const dataRef = () => db.collection('artifacts').doc(appId).collection('public').doc('data');
          const syncDoc = (coll, id, data) => {
            if (!db || !user) return;
            const key = coll + '/' + id;
            clearTimeout(syncTimers.current[key]);
            syncTimers.current[key] = setTimeout(() => {
              delete syncTimers.current[key];
              dataRef().collection(coll).doc(id).set(data, { merge: true })
                .catch(err => { console.warn('syncDoc', err); showToast('⚠️ Не удалось сохранить в облако'); });
            }, 400);
          };
          const deleteNetDoc = (coll, id) => {
            if (!db || !user) return;
            const key = coll + '/' + id;
            clearTimeout(syncTimers.current[key]); delete syncTimers.current[key];
            dataRef().collection(coll).doc(id).delete().catch(err => console.warn('deleteNetDoc', err));
          };

          const updateScene = (id, field, val) => { const up = scenes.map(s => s.id === id ? { ...s, [field]: val } : s); setScenes(up); const t = up.find(s => s.id === id); if (t) syncDoc('scenes', id, t); };
          
          const deleteScene = (id) => {
             const up = scenes.filter(s => s.id !== id);
             setScenes(up); deleteNetDoc('scenes', id);
             if (activeSceneId === id) setActiveSceneId(up.length > 0 ? up[0].id : null);
             showToast("Сцена удалена");
          };

          const updateSceneNested = (id, parentField, childKey, inc) => {
            const up = scenes.map(s => {
              if (s.id === id) {
                const g = s[parentField] || {}; const v = Math.max(0, (g[childKey] || 0) + inc);
                const nextGear = { ...g, [childKey]: v }; if (v === 0) delete nextGear[childKey];
                return { ...s, [parentField]: nextGear };
              } return s;
            });
            setScenes(up); const t = up.find(s => s.id === id); if (t) syncDoc('scenes', id, t);
          };

          const handleMultiFileUpload = async (files, sceneId = null) => {
              const imageFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
              if(imageFiles.length === 0) return;
              showToast(`Оптимизация ${imageFiles.length} изображений...`);
              const newRefs = await Promise.all(imageFiles.map((file, idx) => new Promise(resolve => {
                  const r = new FileReader();
                  r.onloadend = () => compressImage(r.result, 1440, 1080, (c) => resolve({ id: `ref-${Date.now()}-${idx}`, sceneId: sceneId || '', url: c, x: (250 - canvasOffset.x) / zoom + (idx*20), y: (250 - canvasOffset.y) / zoom + (idx*20), label: file.name, tags: [] }));
                  r.readAsDataURL(file);
              })));
              setReferences(prev => { const up = [...prev, ...newRefs]; newRefs.forEach(nr => syncDoc('references', nr.id, nr)); return up; });
          };

          const addCustomGear = (isLight) => {
              const name = isLight ? newLightGearName : newGearName;
              if (!name.trim()) return;
              const key = name.toLowerCase().replace(/\s+/g, '_');
              const payload = { label: name };
              if (isLight) { setLightGearTypes(prev => { const up = {...prev, [key]: payload}; syncDoc('lightGearTypes', key, payload); return up; }); setNewLightGearName(''); }
              else { setGearTypes(prev => { const up = {...prev, [key]: payload}; syncDoc('gearTypes', key, payload); return up; }); setNewGearName(''); }
          };

          const formatDateDisplay = (dateStr) => { if (!dateStr) return '—'; const [y, m, d] = dateStr.split('-'); return `${d}.${m}.${y}`; };

          // --- Групповое перетаскивание на Whiteboard ---
          const handleDragMove = (e) => {
              if (!draggingWbItems || draggingWbItems.pointerId !== e.pointerId) return;
              const dx = (e.clientX - draggingWbItems.startX) / zoom;
              const dy = (e.clientY - draggingWbItems.startY) / zoom;
              
              let updatedScenes = [...scenes], changedS = false;
              let updatedRefs = [...references], changedR = false;
              let updatedStickies = [...stickies], changedSt = false;

              draggingWbItems.items.forEach(item => {
                  const nx = Math.round((item.ox + dx) / 24) * 24;
                  const ny = Math.round((item.oy + dy) / 24) * 24;
                  if (item.type === 'scene') { updatedScenes = updatedScenes.map(sc => sc.id === item.id ? {...sc, x: nx, y: ny} : sc); changedS = true; }
                  else if (item.type === 'ref') { updatedRefs = updatedRefs.map(r => r.id === item.id ? {...r, x: nx, y: ny} : r); changedR = true; }
                  else if (item.type === 'sticky') { updatedStickies = updatedStickies.map(st => st.id === item.id ? {...st, x: nx, y: ny} : st); changedSt = true; }
              });

              if (changedS) setScenes(updatedScenes);
              if (changedR) setReferences(updatedRefs);
              if (changedSt) setStickies(updatedStickies);
          };

          const handleDragUp = (e) => {
              if (!draggingWbItems || draggingWbItems.pointerId !== e.pointerId) return;
              if (e.currentTarget.hasPointerCapture && e.currentTarget.hasPointerCapture(e.pointerId)) {
                  e.currentTarget.releasePointerCapture(e.pointerId);
              }
              draggingWbItems.items.forEach(item => {
                  if (item.type === 'scene') { const f = scenes.find(x=>x.id===item.id); if(f) syncDoc('scenes', item.id, f); }
                  else if (item.type === 'ref') { const f = references.find(x=>x.id===item.id); if(f) syncDoc('references', item.id, f); }
                  else if (item.type === 'sticky') { const f = stickies.find(x=>x.id===item.id); if(f) syncDoc('stickies', item.id, f); }
              });
              setDraggingWbItems(null);
          };

          const handleElementPointerDown = (e, id, type) => {
              if (wbMode !== 'select') return;
              if (['INPUT', 'TEXTAREA', 'BUTTON'].includes(e.target.tagName) || e.target.closest('.node-handle')) return;
              e.stopPropagation();
              
              let currentSelected = selectedWbItems;
              if (!currentSelected.includes(id)) {
                  currentSelected = e.shiftKey ? [...currentSelected, id] : [id];
                  setSelectedWbItems(currentSelected);
              }
              
              const itemsToDrag = [];
              currentSelected.forEach(sId => {
                  const sc = scenes.find(x => x.id === sId); if (sc) itemsToDrag.push({id: sId, type: 'scene', ox: sc.x, oy: sc.y});
                  const r = references.find(x => x.id === sId); if (r) itemsToDrag.push({id: sId, type: 'ref', ox: r.x, oy: r.y});
                  const st = stickies.find(x => x.id === sId); if (st) itemsToDrag.push({id: sId, type: 'sticky', ox: st.x, oy: st.y});
              });

              setDraggingWbItems({ pointerId: e.pointerId, startX: e.clientX, startY: e.clientY, items: itemsToDrag });
              e.currentTarget.setPointerCapture(e.pointerId);
          };
          
          if (showWelcome) return <WelcomeModal onComplete={(name, role) => { setUserName(name); setUserRole(role); setShowWelcome(false); }} />;

          return (
            <div className="flex flex-col h-screen w-screen relative overflow-hidden bg-transparent">
              <ConfirmModal action={confirmAction} onCancel={() => setConfirmAction(null)} />
              {toast && (<div className="fixed bottom-6 left-1/2 -translate-x-1/2 glass-panel text-white px-6 py-3 rounded-full text-sm font-medium z-[400] flex items-center gap-2"><Icons.Bot /> {toast}</div>)}

              {/* ХЕДЕР ПРИЛОЖЕНИЯ */}
              <header className="flex flex-col md:flex-row items-center justify-between px-4 md:px-6 py-2.5 glass-panel border-b border-white/10 z-40 shrink-0 gap-3 md:gap-0">
                <div className="flex items-center justify-between w-full md:w-auto">
                  <div className="flex items-center space-x-3">
                    <span className="font-serif text-base font-bold tracking-[0.2em] text-white uppercase">CineFlow <span className="text-indigo-400 font-mono text-xs font-normal">PREP</span></span>
                    <div className="flex gap-2 items-center">
                      <div className={`w-2 h-2 rounded-full ${isOnline ? 'bg-emerald-500' : 'bg-zinc-500'}`} title={isOnline ? 'В сети' : 'Офлайн'}></div>
                      <button onClick={() => setShowProjectModal(true)} className="bg-black/40 hover:bg-black/60 border border-white/10 text-[11px] px-3 py-1.5 rounded-lg text-zinc-300 transition-colors flex items-center gap-1.5"><Icons.Folder /> Проект</button>
                    </div>
                  </div>
                  <button onClick={() => setShowShareModal(true)} className="md:hidden bg-indigo-600/30 text-[11px] px-3 py-1.5 rounded-lg text-indigo-200 font-semibold flex items-center gap-1"><Icons.Link /> Доступ</button>
                </div>
                
                <div className="flex bg-black/50 p-1 rounded-xl border border-white/10 w-full md:w-auto overflow-x-auto hide-scrollbar snap-x nav-scroll-hint">
                  {[{id: 'notion', label: 'Сцены', icon: <Icons.Scene />}, {id: 'gallery', label: 'Галерея', icon: <Icons.Gallery />}, {id: 'master', label: 'Мастер-док', icon: <Icons.Master />}, {id: 'whiteboard', label: 'Доска', icon: <Icons.Board />}, {id: 'table', label: 'КПП / Смены', icon: <Icons.Table />}, {id: 'docs', label: 'Экспликации', icon: <Icons.Docs />}]
                    .map(tab => (
                    <button key={tab.id} onClick={() => setCurrentView(tab.id)} className={`snap-center flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl text-xs font-semibold transition-all shrink-0 min-h-[34px] ${currentView === tab.id ? 'bg-indigo-600/80 text-white' : 'text-zinc-400 hover:text-zinc-200 hover:bg-white/5'}`}>
                      {tab.icon} {tab.label}
                    </button>
                  ))}
                </div>

                <div className="flex items-center space-x-3 w-full md:w-auto justify-between md:justify-end overflow-x-auto hide-scrollbar">
                  <button onClick={() => setShowAgentModal(true)} className="bg-emerald-900/30 hover:bg-emerald-800/40 text-emerald-300 px-3 py-1.5 rounded-xl text-xs font-semibold transition-colors flex items-center gap-1.5 shrink-0"><Icons.Bot /> Агент КПП</button>
                  <button onClick={() => { setShowChat(!showChat); if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); }} className={`relative px-3.5 py-1.5 rounded-xl text-xs font-semibold border transition-all shrink-0 flex items-center gap-1.5 ${showChat ? 'bg-indigo-600 border-indigo-500 text-white' : 'glass-panel text-zinc-300 hover:bg-white/5'}`}>
                    <Icons.Chat /> Чат
                    {unreadCount > 0 && <span className="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] w-4 h-4 flex items-center justify-center rounded-full font-bold">{unreadCount}</span>}
                  </button>
                  <button onClick={() => setShowShareModal(true)} className="hidden md:flex bg-indigo-600/30 hover:bg-indigo-600/50 text-[11px] px-3.5 py-1.5 rounded-xl text-indigo-200 font-semibold transition-colors items-center gap-1.5"><Icons.Link /> Поделиться</button>
                </div>
              </header>

              <div className="flex flex-1 overflow-hidden relative z-10">
                <div className="flex-1 overflow-hidden relative">
                  
                  {/* СЦЕНЫ И РАСКАДРОВКА */}
                  <div className={`h-full w-full ${currentView === 'notion' ? 'block' : 'hidden'}`}>
                    <div className="flex flex-col md:flex-row h-full max-w-7xl mx-auto p-2 md:p-6 gap-3 md:gap-6 overflow-hidden">
                      <div className="w-full md:w-64 glass-panel p-2 md:p-4 rounded-xl flex flex-row md:flex-col space-x-2 md:space-x-0 md:space-y-1.5 overflow-x-auto md:overflow-y-auto shrink-0 hide-scrollbar snap-x">
                        {scenes.map(s => (
                          <button key={s.id} onClick={() => setActiveSceneId(s.id)} className={`snap-center whitespace-nowrap md:whitespace-normal shrink-0 md:w-full text-left px-3.5 py-2.5 rounded-xl text-sm transition-all border ${activeSceneId === s.id ? 'bg-indigo-600/30 text-white border-indigo-500/40 font-bold' : 'bg-transparent text-zinc-400 border-transparent hover:bg-white/5'}`}>
                            <span className="font-mono text-indigo-400 mr-2 text-xs">#{s.number}</span> {s.title || 'Без названия'}
                          </button>
                        ))}
                        <button onClick={() => { const num = scenes.length + 1; const newS = { id: `sc-${Date.now()}`, number: String(num), title: `СЦЕНА ${num}. НОВАЯ`, content: '', x: (150 - canvasOffset.x) / zoom, y: (150 - canvasOffset.y) / zoom, date: '', gear: {}, lightGear: {}, lightSchemeId: null }; setScenes([...scenes, newS]); syncDoc('scenes', newS.id, newS); }} className="snap-center md:w-full text-center px-3.5 py-2.5 rounded-xl text-sm transition-all border border-dashed border-zinc-700 text-zinc-500 hover:text-white shrink-0 font-medium">+ Добавить сцену</button>
                      </div>

                      {activeSceneId && scenes.find(s => s.id === activeSceneId) && (() => {
                        const s = scenes.find(sc => sc.id === activeSceneId);
                        const frames = storyboard.filter(f => f.sceneId === s.id);
                        const sceneRefs = references.filter(r => r.sceneId === s.id);
                        return (
                          <div className="flex-1 glass-panel p-5 md:p-8 rounded-xl overflow-y-auto space-y-6 border-t border-white/10">
                            <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center border-b border-white/10 pb-4 gap-3">
                              <div className="flex items-center gap-3">
                                  <span className="text-xs font-mono font-bold text-indigo-300 bg-indigo-950/60 px-3 py-1.5 rounded-lg">СЦЕНА #{s.number}</span>
                                  <input type="date" value={s.date || ''} onChange={(e) => updateScene(s.id, 'date', e.target.value)} className="glass-input px-3 py-1.5 rounded-lg text-sm w-full sm:w-auto font-mono text-zinc-300" />
                              </div>

                          e.currentTarget.setPointerCapture(e.pointerId);
                          const rect = paintCanvasRef.current.getBoundingClientRect(); const coords = { x: (e.clientX - rect.left) / zoom, y: (e.clientY - rect.top) / zoom };
                          const press = e.pressure !== undefined && e.pressure > 0 ? e.pressure : 0.5;
                          setIsPainting(true); lastPoint.current = { x: coords.x, y: coords.y, pressure: press, time: Date.now() };
                          const ctx = paintCanvasRef.current.getContext('2d'); ctx.beginPath(); ctx.arc(coords.x, coords.y, (brushSize * (0.4 + press * 1.2)) / 2, 0, Math.PI * 2); if (wbMode !== 'erase') { ctx.fillStyle = brushColor; ctx.fill(); }

                          lastPoint.current = { x: coords.x, y: coords.y, pressure: press, time: cT };

                                        </div>
                                      </div>

                                  </div>
                                </div>

                      <div className="w-full lg:w-72 glass-panel p-5 rounded-xl flex flex-col shrink-0 relative border-t border-white/10 overflow-hidden">

                              ))}

                          <div className="pt-4 border-t border-white/10">
                              <span className="text-[11px] font-bold text-zinc-500 uppercase tracking-widest block mb-3 ml-2">Схемы Света</span>

                                </div>

                          </div>
                        </div>
                      </div>

                      {/* Текстовый документ */}
                      {activeDocId && !activeSchemeId && docs.find(d => d.id === activeDocId) && (() => {
                        const activeDoc = docs.find(d => d.id === activeDocId);
                        return (
                          <div className="flex-1 glass-panel p-6 md:p-8 rounded-xl flex flex-col space-y-6 lg:overflow-y-auto relative border-t border-white/10">
                            <input type="text" value={activeDoc.title} onChange={(e) => { const up = docs.map(d=>d.id===activeDoc.id?{...d,title:e.target.value}:d); setDocs(up); syncDoc('docs', activeDoc.id, up.find(d=>d.id===activeDoc.id)); }} className="font-serif bg-transparent text-2xl md:text-3xl font-bold w-full focus:outline-none text-white placeholder-zinc-600" placeholder="Заголовок гайда..." />

                            <div className="space-y-4 border-t border-white/10 pt-6">
                              <div className="flex justify-between items-center px-1">
                                <span className="text-xs font-bold text-zinc-400 uppercase tracking-widest flex items-center gap-2"><Icons.User/> Состав съемочной группы</span>
                                <button onClick={() => { const nc = { id: `cr-${Date.now()}`, name: '', role: '', phone: '' }; setCrew([...crew, nc]); syncDoc('crew', nc.id, nc); }} className="text-xs font-bold text-indigo-300 hover:text-white bg-indigo-600/30 hover:bg-indigo-600/50 px-4 py-2 rounded-lg transition-colors">+ Добавить участника</button>
                              </div>
                              <div className="glass-panel rounded-xl overflow-x-auto border border-white/5">
                                <table className="w-full min-w-[500px] text-left text-sm border-collapse">
                                  <thead><tr className="bg-white/5 text-zinc-400 text-[11px] uppercase tracking-widest font-bold border-b border-white/10"><th className="p-4 w-1/3">Имя Фамилия</th><th className="p-4 w-1/3">Цех / Должность</th><th className="p-4">Телефон / Контакт</th><th className="p-4 w-14"></th></tr></thead>
                                  <tbody className="divide-y divide-white/5 text-zinc-200">

                                        <td className="p-2"><input type="text" value={c.role} onChange={e => { const up = crew.map(cr=>cr.id===c.id?{...cr,role:e.target.value}:cr); setCrew(up); syncDoc('crew', c.id, up.find(cr=>cr.id===c.id)); }} className="bg-transparent w-full px-3 py-2 text-zinc-400 font-medium focus:outline-none placeholder-zinc-600" placeholder="Роль" /></td>
                                        <td className="p-2"><input type="text" value={c.phone} onChange={e => { const up = crew.map(cr=>cr.id===c.id?{...cr,phone:e.target.value}:cr); setCrew(up); syncDoc('crew', c.id, up.find(cr=>cr.id===c.id)); }} className="bg-transparent w-full px-3 py-2 font-mono font-medium focus:outline-none placeholder-zinc-600" placeholder="+7..." /></td>
                                        <td className="p-2 text-center"><button onClick={() => { setCrew(crew.filter(cr=>cr.id!==c.id)); deleteNetDoc('crew', c.id); }} className="w-8 h-8 flex items-center justify-center rounded-lg glass-panel hover:bg-white/10 text-zinc-400 hover:text-red-400 transition-colors mx-auto font-bold"><Icons.Trash/></button></td>

                                    ))}
                                  </tbody>
                                </table>
                              </div>
                            </div>
                          </div>
                        );
                      })()}
                      
                      {/* Схема света */}
                      {activeSchemeId && lightSchemes.find(s=>s.id === activeSchemeId) && (() => {
                          const sch = lightSchemes.find(s=>s.id === activeSchemeId);

                            <div className="flex-1 glass-panel p-6 md:p-8 rounded-xl flex flex-col space-y-6 lg:overflow-y-auto relative">
                                <div className="flex justify-between items-center gap-4">
                                    <input type="text" value={sch.title} onChange={(e) => { const up = lightSchemes.map(s=>s.id===sch.id?{...s,title:e.target.value}:s); setLightSchemes(up); syncDoc('lightSchemes', sch.id, up.find(s=>s.id===sch.id)); }} className="font-serif bg-transparent text-2xl md:text-3xl font-bold w-full focus:outline-none text-white placeholder-zinc-600" placeholder="Название световой схемы..." />

                                <div className="w-full aspect-video bg-black/70 rounded-xl border border-white/10 flex items-center justify-center overflow-hidden">

                                <div className="pt-4 border-t border-white/10">
                                    <span className="text-xs text-zinc-400 font-bold block mb-2">Привязано к сценам:</span>
                                    <div className="flex gap-2 flex-wrap">
                                        {scenes.filter(s=>s.lightSchemeId===sch.id).length > 0 
                                            ? scenes.filter(s=>s.lightSchemeId===sch.id).map(s=>(<span key={s.id} className="bg-indigo-950/60 px-3 py-1 rounded-lg text-xs font-mono text-indigo-300">Сцена #{s.number}</span>))
                                            : <span className="text-xs text-zinc-600">Схема не привязана ни к одной сцене</span>
                                        }
                                    </div>
                                </div>
                            </div>
                          );
                      })()}

                          </button>
                        </div>
                        <div className="space-y-4 pt-6 border-t border-white/10">
                          <span className="text-[11px] font-bold text-zinc-500 uppercase tracking-widest block ml-1">Файлы и документы проекта</span>
                          <div className="border border-dashed border-white/20 hover:border-indigo-500/50 rounded-xl p-6 text-center bg-black/30 hover:bg-indigo-500/10 transition-all group">

                              <span className="opacity-60 group-hover:opacity-100 transition-opacity"><Icons.Folder/></span>
                              <span>Загрузить КПП или доки</span>
                              <input type="file" onChange={(e) => { const f = e.target.files[0]; if (!f) return; if (f.size > 4 * 1024 * 1024) { showToast('❌ Файл больше 4 МБ'); e.target.value = ''; return; } const r = new FileReader(); r.onloadend = () => { const nF = { id: `file-${Date.now()}`, name: f.name, size: `${(f.size / 1024).toFixed(1)} KB`, data: r.result }; setProjectFiles([...projectFiles, nF]); if (r.result.length < 900 * 1024) { syncDoc('projectFiles', nF.id, nF); showToast(`Загружен: ${f.name}`); } else { showToast(`📁 Сохранён локально — слишком большой для облака: ${f.name}`); } }; r.readAsDataURL(f); }} accept=".pdf,.xlsx,.csv,.txt,.png,.jpg" className="hidden" />
                            </label>
                          </div>
                          <div className="space-y-3 max-h-[300px] overflow-y-auto pr-2 hide-scrollbar">
                            {projectFiles.map(file => (
                              <div key={file.id} className="glass-panel p-4 rounded-xl flex flex-col space-y-3 group hover:border-indigo-500/30 transition-colors border border-white/5">
                                <div className="truncate flex flex-col">
                                  <span className="text-sm text-zinc-200 truncate font-bold tracking-wide" title={file.name}>{file.name}</span>
                                  <span className="text-[11px] font-mono text-zinc-500 mt-0.5">{file.size}</span>
                                </div>
                                <div className="flex gap-2 justify-end">
                                  {file.data !== '#' && (<a href={file.data} download={file.name} className="flex-1 text-emerald-400 font-bold px-3 py-2 rounded-lg bg-emerald-500/10 hover:bg-emerald-500/20 transition-all text-center text-xs">Скачать</a>)}
                                  <button onClick={() => setConfirmAction({title:'Удалить файл?', message: '', onConfirm:()=>{ setProjectFiles(projectFiles.filter(f=>f.id!==file.id)); deleteNetDoc('projectFiles', file.id); }})} className="w-10 flex items-center justify-center text-zinc-500 hover:text-red-400 font-bold rounded-lg bg-black/50 hover:bg-white/10 transition-colors text-xs border border-white/5"><Icons.Trash/></button>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                </div>

                {/* ЧАТ КОМАНДЫ */}
                {showChat && <div className="fixed inset-0 bg-black/70 z-40 md:hidden backdrop-blur-sm" onClick={() => setShowChat(false)}></div>}
                <div className={`fixed inset-y-0 right-0 z-50 md:relative md:z-10 glass-panel flex flex-col h-full transition-transform duration-300 ease-out md:shadow-none md:border-l border-white/10 ${showChat ? 'translate-x-0 w-[85%] sm:w-80' : 'translate-x-full md:translate-x-0 w-0 border-none'}`}>
                  
                  <div className="p-5 border-b border-white/10 space-y-4 bg-white/5 relative">
                    <button onClick={() => setShowChat(false)} className="md:hidden absolute top-4 right-4 w-8 h-8 flex items-center justify-center glass-panel rounded-full text-zinc-400 font-bold">✕</button>
                    <span className="text-[11px] font-bold text-zinc-500 uppercase tracking-widest block">Профиль участника</span>

                        <span className="text-zinc-300 mr-3"><Icons.User/></span>
                        <div className="flex flex-col">
                            <span className="text-sm font-extrabold text-white">{userName}</span>
                            <span className="text-xs text-indigo-400 font-bold">{userRole}</span>

                      </div>
                      <button onClick={() => setShowWelcome(true)} className="text-xs font-semibold text-zinc-500 hover:text-indigo-400 transition-colors text-left pl-1 underline decoration-zinc-700 hover:decoration-indigo-500 underline-offset-4">Изменить имя/роль</button>
                    </div>
                  </div>

                  <div className="flex-1 p-5 overflow-y-auto space-y-4 hide-scrollbar flex flex-col relative bg-black/30">
                    {messages.map(msg => {
                        const isMe = msg.senderId ? msg.senderId === clientId : (msg.senderName === userName && msg.senderRole === userRole);
                        return (
                          <div key={msg.id} className={`flex flex-col max-w-[85%] ${isMe ? 'self-end items-end' : 'self-start items-start'}`}>
                            <div className={`flex items-baseline space-x-1.5 mb-1 ${isMe ? 'flex-row-reverse space-x-reverse' : ''}`}>
                              <span className="text-[11px] font-extrabold text-zinc-400">{msg.senderName}</span>
                              <span className="text-[10px] text-zinc-500 font-mono font-semibold">{msg.senderRole}</span>
                            </div>
                            <div className={`px-4 py-2.5 rounded-xl text-[13px] font-medium leading-relaxed border ${isMe ? 'bg-indigo-600 text-white border-indigo-500/50 rounded-tr-sm' : 'glass-panel text-zinc-200 rounded-tl-sm border-white/10'}`}>
                              {msg.text}
                            </div>
                          </div>
                        );
                    })}
                    {messages.length === 0 && (
                        <div className="absolute inset-0 flex flex-col items-center justify-center text-zinc-600">
                            <span className="mb-2"><Icons.Chat/></span>
                            <span className="text-xs font-bold uppercase tracking-widest">Чат цеха</span>
                        </div>
                    )}
                  </div>

                  <div className="p-4 border-t border-white/10 bg-black/50">
                    <div className="flex glass-input rounded-xl p-1.5 transition-all">
                        <input type="text" value={chatInput} onChange={(e) => setChatInput(e.target.value)} onKeyDown={(e) => { if(e.key === 'Enter' && chatInput.trim()){ const nm = { id: `msg-${Date.now()}`, text: chatInput.trim(), senderId: clientId, senderName: userName, senderRole: userRole, timestamp: Date.now() }; if(db && user){ syncDoc('messages', nm.id, nm); } else { setMessages([...messages, nm]); } setChatInput(''); } }} className="flex-1 bg-transparent px-3 text-sm font-medium text-white focus:outline-none placeholder-zinc-500" placeholder="Сообщение..." />
                        <button onClick={() => { if(!chatInput.trim()) return; const nm = { id: `msg-${Date.now()}`, text: chatInput.trim(), senderId: clientId, senderName: userName, senderRole: userRole, timestamp: Date.now() }; if(db && user){ syncDoc('messages', nm.id, nm); } else { setMessages([...messages, nm]); } setChatInput(''); }} className="bg-indigo-600 hover:bg-indigo-500 text-white w-10 h-10 rounded-xl flex items-center justify-center transition-colors font-bold">↑</button>
                    </div>
                  </div>
                </div>
              </div>

              {/* МОДАЛЬНЫЕ ОКНА */}
              {showShareModal && (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[200] p-4">
                  <div className="glass-panel rounded-xl p-8 max-w-md w-full relative">
                    <button onClick={() => setShowShareModal(false)} className="absolute top-5 right-5 w-8 h-8 flex items-center justify-center bg-white/5 hover:bg-red-500/20 hover:text-red-400 rounded-full text-zinc-400 font-bold transition-colors">✕</button>
                    <h3 className="text-xl font-extrabold text-white mb-4 flex items-center gap-2"><Icons.Link/> Совместный доступ</h3>
                    <div className="text-sm font-medium text-zinc-300 leading-relaxed space-y-4 mb-6">
                      <p>Проект уже опубликован — просто отправьте ссылку ниже участникам группы. У всех должен быть одинаковый код комнаты, чтобы видеть общие данные.</p>
                    </div>
                    <div className="mb-4">
                      <label className="text-xs text-zinc-400 font-semibold block mb-1.5 ml-1">Код комнаты проекта</label>
                      <div className="flex gap-2">
                        <input type="text" defaultValue={appId} id="cf-room-input" className="flex-1 glass-input rounded-xl px-4 py-2.5 text-sm font-mono" />
                        <button onClick={() => { const v = document.getElementById('cf-room-input').value.trim(); if (v && v !== appId) { localStorage.setItem('cf_room', v); window.location.reload(); } }} className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-4 rounded-xl transition-colors">Войти</button>
                      </div>
                      <p className="text-[11px] text-zinc-500 mt-1.5 ml-1">У всех участников проекта должен быть одинаковый код комнаты.</p>
                    </div>
                    <div className="bg-black/50 p-2 pl-4 rounded-xl border border-white/10 flex items-center justify-between gap-3">
                      <span className="text-[11px] text-zinc-400 font-mono font-semibold truncate select-all">{window.location.href}</span>
                      <button onClick={() => { navigator.clipboard.writeText(window.location.href).then(() => showToast('Ссылка скопирована!')).catch(() => { const t = document.createElement('input'); t.value = window.location.href; document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t); showToast('Ссылка скопирована!'); }); }} className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-4 py-2.5 rounded-lg shrink-0 transition-colors">Скопировать</button>
                    </div>
                  </div>
                </div>
              )}

              {showProjectModal && (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[200] p-4">
                  <div className="glass-panel rounded-xl p-8 max-w-md w-full relative">
