                                        {el.type === 'triangle' && <div className="w-full h-full border-2 border-transparent" style={{backgroundColor: el.color, clipPath: 'polygon(50% 0%, 0% 100%, 100% 100%)'}}/>}
                                        {el.type === 'diamond' && <div className="w-full h-full border-2 border-transparent" style={{backgroundColor: el.color, clipPath: 'polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)'}}/>}
                                        {el.type === 'star' && <div className="w-full h-full border-2 border-transparent" style={{backgroundColor: el.color, clipPath: 'polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%)'}}/>}
                                        {el.type === 'arrow' && <svg className="w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="5" y1="95" x2="90" y2="10" stroke={el.color} strokeWidth="6" strokeLinecap="round"/><polygon points="90,10 72,18 82,28" fill={el.color}/></svg>}
                                        {el.type === 'text' && <textarea value={el.text} onChange={e => {setElements(elements.map(x=>x.id===el.id?{...x, text:e.target.value}:x))}} className="w-full h-full bg-black/60 border border-white/20 text-white font-bold p-1 resize-none focus:outline-none rounded-md text-xs" style={{color: el.color}} />}
                                        {el.label && (
                                            <div className="absolute top-full mt-2 left-1/2 -translate-x-1/2 bg-black/90 text-white font-medium text-[11px] px-2 py-1 rounded border border-white/20 whitespace-nowrap z-50 pointer-events-none">
                                                {el.label}
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>
                        {selectedId && elements.find(e=>e.id===selectedId) && (
                            <div className="w-64 glass-panel border-l border-white/10 p-4 space-y-4 shrink-0 flex flex-col">
                                <span className="text-xs font-bold text-zinc-400 uppercase">Свойства прибора / формы</span>
                                <div className="space-y-2">

                                    <input type="range" min="20" max="400" value={elements.find(e=>e.id===selectedId).h} onChange={e=>updateSelected({h: Number(e.target.value)})} className="w-full accent-indigo-500" />
                                </div>
                                <button onClick={() => {setElements(elements.filter(e=>e.id!==selectedId)); setSelectedId(null);}} className="mt-auto bg-red-600/20 text-red-400 border border-red-500/30 py-2 rounded-lg text-xs font-bold hover:bg-red-600/40">Удалить объект</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // Поле тега с подсказками из УЖЕ ИСПОЛЬЗОВАННЫХ в проекте.
        // Отдельным компонентом намеренно: набранные буквы живут в его
        // собственном состоянии и не заставляют перерисовываться всю
        // галерею — при сотне референсов это заметно на планшете.
        const TagInput = ({ ref_, hints, onAdd, narrow }) => {
          const [typed, setTyped] = useState('');
          const [open, setOpen] = useState(false);
          const [at, setAt] = useState(null);
          const inputRef = useRef(null);
          const list = open ? hints(typed, ref_.tags) : [];

          // Список подсказок рисуем ОТДЕЛЬНЫМ слоем поверх страницы, а не
          // внутри карточки: у карточки обрезка по краю (overflow-hidden плюс
          // пропуск отрисовки за экраном), и список в ней просто не было
          // видно. Отсюда position: fixed и портал в body.
          const place = () => {
            const el = inputRef.current; if (!el) return;
            const r = el.getBoundingClientRect();
            const w = Math.min(240, window.innerWidth - 16);
            const left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8));
            // У нижнего края экрана разворачиваем список вверх, иначе он
            // уедет за пределы окна и снова окажется невидим.
            const вверх = r.bottom > window.innerHeight - 160;
            setAt({ left, width: w,
                    top: вверх ? null : Math.round(r.bottom + 4),
                    bottom: вверх ? Math.round(window.innerHeight - r.top + 4) : null });
          };
          useEffect(() => {
            if (!open) return;
            place();
            // Пока список открыт, страница может уехать под ним — держим его
            // у поля. scroll слушаем с перехватом: прокручивается не окно,
            // а внутренняя область галереи.
            const on = () => place();
            window.addEventListener('scroll', on, true);
            window.addEventListener('resize', on);
            return () => { window.removeEventListener('scroll', on, true); window.removeEventListener('resize', on); };
          }, [open, typed]);

          const put = (v) => { onAdd(ref_, v); setTyped(''); setOpen(false); };
          return (
            <span className="inline-block">
              <input ref={inputRef} type="text" placeholder="+ тег" value={typed}
                onChange={e => { setTyped(e.target.value); setOpen(true); }}
                onFocus={() => setOpen(true)}
                onKeyDown={e => {
                  if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); put(typed); }
                  if (e.key === 'Escape') setOpen(false);
                }}
                // Закрываем с задержкой: без неё палец не успевает нажать
                // подсказку — поле теряет фокус раньше, чем срабатывает выбор.
                onBlur={() => setTimeout(() => { setOpen(false); if (typed.trim()) put(typed); }, 180)}
                className={`bg-transparent text-[11px] text-zinc-400 border-b border-white/10 focus:border-indigo-500 focus:outline-none min-w-0 ${narrow ? 'w-14 focus:w-24 transition-all' : 'w-24'}`} />
              {list.length > 0 && at && ReactDOM.createPortal(
                <div className="flex flex-wrap gap-1 p-1.5 rounded-lg cf-tag-hints"
                     style={{ position: 'fixed', left: at.left, width: at.width,
                              top: at.top === null ? undefined : at.top,
                              bottom: at.bottom === null ? undefined : at.bottom,
                              zIndex: 500, background: 'var(--panel-2)',
                              border: '1px solid var(--border)', boxShadow: '0 8px 24px rgba(0,0,0,.45)' }}>
                  {list.map(t => (
                    <button key={t} type="button" onMouseDown={e => e.preventDefault()} onClick={() => put(t)}
                            className="cf-chip shrink-0" style={{ fontSize: 11 }}>{t}</button>
                  ))}
                </div>, document.body)}
            </span>
          );
        };

        function AppCore() {
          const [user, setUser] = useState(null);
          const [userName, setUserName] = useState('');
          const [userRole, setUserRole] = useState('');
          const [showWelcome, setShowWelcome] = useState(false);
          const clientId = useMemo(() => { let cid = localStorage.getItem('cf_client_id'); if (!cid) { cid = 'u-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); localStorage.setItem('cf_client_id', cid); } return cid; }, []);
          const [isOnline, setIsOnline] = useState(navigator.onLine);
          // Сколько правок ещё не подтверждено облаком. Офлайн запись в
          // Firestore не отклоняется, а ждёт связи — по этому счётчику видно,
          // всё ли уже уехало на сервер (можно ли закрывать ноутбук).
          const [pendingWrites, setPendingWrites] = useState(0);
          const trackWrite = (p) => {
            setPendingWrites(n => n + 1);
            p.finally(() => setPendingWrites(n => Math.max(0, n - 1)));
            return p;
          };
          
          const safeLoad = (key, fallback, isArray = true) => {
            // В файле-снимке данные лежат прямо внутри страницы, а не
            // в localStorage: снимок должен открываться на чужом устройстве.
            if (CF_SNAPSHOT && CF_SNAPSHOT.data && CF_SNAPSHOT.data[key] !== undefined) return CF_SNAPSHOT.data[key];
            try {
              const saved = localStorage.getItem(key); if (!saved) return fallback;
              const parsed = JSON.parse(saved); 
              if (isArray) return Array.isArray(parsed) ? parsed : fallback;
              return (parsed !== null && typeof parsed === 'object') ? parsed : fallback;
            } catch (e) { return fallback; }
          };

          const [scenes, setScenes] = useState(() => safeLoad('cf_scenes', initialScenes, true));
          const sortedScenes = useMemo(() => [...scenes].sort((a, b) => String(a.number).localeCompare(String(b.number), undefined, {numeric: true})), [scenes]);
          const [storyboard, setStoryboard] = useState(() => safeLoad('cf_storyboard', [], true));
          const [references, setReferences] = useState(() => safeLoad('cf_references', [], true));
          const [stickies, setStickies] = useState(() => safeLoad('cf_stickies', [], true));
          const [docs, setDocs] = useState(() => safeLoad('cf_docs', initialDocs, true));
          const [crew, setCrew] = useState(() => safeLoad('cf_crew', [], true));
          const [projectFiles, setProjectFiles] = useState(() => safeLoad('cf_files', [], true));

          // --- Объекты (места съёмки со скаутинга) ---
          // Объект — это МЕСТО, а не сцена: одна и та же квартира снимается
          // в пяти сценах, и договариваться о ней надо один раз. Поэтому
          // связь со сценами хранится списком у объекта (`sceneIds`),
          // а не полем у сцены.
          // Фотографии со скаута — обычные референсы с полем `locationId`.
          // Отдельного хранилища картинок объекту НАМЕРЕННО не заведено:
          // иначе пришлось бы второй раз писать сжатие, теги, загрузку
          // в облако и полноэкранный просмотр — и они разъехались бы
          // при первой же правке. Заодно фото со скаута попадают в общую
          // галерею, где и должны быть.
          const [locations, setLocations] = useState(() => safeLoad('cf_locations', [], true));
          const [activeLocationId, setActiveLocationId] = useState(null);
          // Порядок — как отсняли на скауте, а не по алфавиту: переименование
          // объекта не должно перекладывать список под руками.
          const sortedLocations = useMemo(
            () => [...locations].sort((a, b) => (a.order || 0) - (b.order || 0)), [locations]);

          const [gearTypes, setGearTypes] = useState(() => safeLoad('cf_geartypes', DEFAULT_GEAR, false));
          const [lightGearTypes, setLightGearTypes] = useState(() => safeLoad('cf_lightgeartypes', DEFAULT_LIGHT_GEAR, false));
          const [lightSchemes, setLightSchemes] = useState(() => safeLoad('cf_lightschemes', [], true));

          // --- ДОСКИ ---
          // Раньше доска была одна: все стикеры, референсы и один общий
          // рисунок. Теперь досок несколько — у каждой свои стикеры,
          // свои референсы и свой холст.
          const DEFAULT_BOARD = { id: 'board-main', title: 'Основная', order: 0 };
          const [boards, setBoards] = useState(() => safeLoad('cf_boards', [DEFAULT_BOARD], true));
          const [activeBoardId, setActiveBoardId] = useState(() => localStorage.getItem('cf_active_board') || DEFAULT_BOARD.id);
          const sortedBoards = useMemo(() => {
            const list = (boards && boards.length) ? [...boards] : [DEFAULT_BOARD];
            return list.sort((a, b) => (a.order || 0) - (b.order || 0));
          }, [boards]);
          // Если выбранной доски больше нет (удалили на другом устройстве) —
          // возвращаемся на первую, иначе доска покажется пустой без причины.
          useEffect(() => {
            if (!sortedBoards.some(b => b.id === activeBoardId) && sortedBoards.length) {
              setActiveBoardId(sortedBoards[0].id);
            }
          }, [sortedBoards, activeBoardId]);
          useEffect(() => { localStorage.setItem('cf_active_board', activeBoardId); }, [activeBoardId]);
          // Старые стикеры/референсы созданы без boardId — считаем их
          // принадлежащими первой доске, чтобы ничего не пропало.
          const belongsToBoard = (item, boardId) => (item.boardId || DEFAULT_BOARD.id) === boardId;

          // --- Сцены на доске ---
          // Доска — это текущая работа, поэтому карточку сцены с неё можно
          // снять, не трогая саму сцену. У сцены три состояния boardId:
          // поля нет вовсе — старая сцена, живёт на основной доске;
          // пустая строка — сняли руками, не показываем нигде;
          // id доски — лежит на ней. Пустую строку от отсутствия поля
          // отличаем намеренно: у стикеров (belongsToBoard) правило другое,
          // там пусто = основная доска, и смешивать их нельзя.
          const sceneOnBoard = (s, boardId) =>
            (s.boardId === undefined || s.boardId === null ? DEFAULT_BOARD.id : s.boardId) === boardId;
          const boardScenes = useMemo(() => sortedScenes.filter(s => sceneOnBoard(s, activeBoardId)), [sortedScenes, activeBoardId]);
          const offBoardScenes = useMemo(() => sortedScenes.filter(s => !sceneOnBoard(s, activeBoardId)), [sortedScenes, activeBoardId]);

          // Снять с доски. Связи с референсами (`sceneId` у референса) НЕ трогаем:
          // вернёте сцену на доску — пунктир нарисуется снова.
          const removeSceneFromBoard = (id) => {
            pushUndo(false, [{ coll: 'scenes', id }]);
            freezeArrowsForCards([id]);
            const up = scenes.map(s => s.id === id ? { ...s, boardId: '' } : s);
            setScenes(up);
            syncDoc('scenes', id, up.find(s => s.id === id));
            setSelectedWbItems(prev => prev.filter(x => x !== id));
            showToast('Убрано с доски · сцена осталась в проекте, вернуть — кнопкой «Сцена» слева');
          };

          // Положить на текущую доску, в видимую часть холста.
          const putSceneOnBoard = (id) => {
            const up = scenes.map(s => s.id === id ? { ...s, boardId: activeBoardId,
              x: (260 - canvasOffset.x) / zoom + Math.random() * 60,
              y: (240 - canvasOffset.y) / zoom + Math.random() * 60 } : s);
            setScenes(up);
            syncDoc('scenes', id, up.find(s => s.id === id));
            showToast('Сцена на доске');
          };

          const [messages, setMessages] = useState([]); 
          // Сколько раз облако присылало список сообщений (см. уведомления)
          const msgBatch = useRef(0);

          const [currentView, setCurrentView] = useState(
            CF_VIEW_SCOPE === 'gallery' ? 'gallery' : (CF_VIEW_SCOPE === 'board' ? 'whiteboard' : 'notion')
          ); 
          const [activeSceneId, setActiveSceneId] = useState('scene-1');
          const [activeDocId, setActiveDocId] = useState('doc-1');
          // Что открыто в карточке сцены: экспликация оператора или текст
          // сцены из сценария. Это разные тексты и живут в разных полях.
          const [sceneTab, setSceneTab] = useState('exp');
          const [showImages, setShowImages] = useState(true);
          const [showProjectModal, setShowProjectModal] = useState(false);
          const [showShareModal, setShowShareModal] = useState(false);
          const [showChat, setShowChat] = useState(false); 
          const [chatInput, setChatInput] = useState('');
          const [tableSubView, setTableSubView] = useState('grouped');
          const [toast, setToast] = useState(null);
          const [isAILoading, setIsAILoading] = useState(false);
          
          const [confirmAction, setConfirmAction] = useState(null); 
          const [drawingFrameId, setDrawingFrameId] = useState(null);
          const [lightboxData, setLightboxData] = useState(null);
          const [showAgentModal, setShowAgentModal] = useState(false);
          const [manualJsonInput, setManualJsonInput] = useState('');
          const [tagSearch, setTagSearch] = useState('');
          // Панель тегов в галерее: сворачивается в полоску 40px.
          const [galleryTagsOpen, setGalleryTagsOpen] = useState(true);
          // Папки референсов. Папка — просто поле folder у референса,
          // отдельной сущности нет: так ничего не рассинхронизируется,
          // и папка исчезает сама, когда из неё убрали последний файл.
          const [activeFolder, setActiveFolder] = useState('');
          // Мультивыбор в галерее. Объявлено здесь, до visibleRefs:
          // ниже по коду эти значения читаются прямо во время отрисовки.
          const [selectedRefIds, setSelectedRefIds] = useState([]);
          const [bulkTagInput, setBulkTagInput] = useState('');
          // Предупреждение о повторной загрузке картинок с теми же именами
          const [dupPrompt, setDupPrompt] = useState(null);
          const folderCounts = useMemo(() => {
            const m = {};
            references.forEach(r => { const f = (r.folder || '').trim(); if (f) m[f] = (m[f] || 0) + 1; });
            return Object.entries(m).sort((a, b) => a[0].localeCompare(b[0], 'ru'));
          }, [references]);
          const noFolderCount = useMemo(() => references.filter(r => !(r.folder || '').trim()).length, [references]);
          const moveToFolder = (ref, folder) => {
            const up = references.map(r => r.id === ref.id ? { ...r, folder } : r);
            setReferences(up);
            syncDoc('references', ref.id, up.find(r => r.id === ref.id));
          };

          // --- Массовые операции над выделенными референсами ---
          const toggleRefSelection = (id) => {
            setSelectedRefIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
          };
          const bulkPatchRefs = (patchFn, message) => {
            const up = references.map(r => selectedRefIds.includes(r.id) ? patchFn(r) : r);
            setReferences(up);
            selectedRefIds.forEach(id => { const f = up.find(r => r.id === id); if (f) syncDoc('references', id, f); });
            if (message) showToast(message);
          };
          const bulkAddTag = () => {
            const t = bulkTagInput.trim().toLowerCase(); if (!t) return;
            bulkPatchRefs(r => ({ ...r, tags: (r.tags || []).includes(t) ? r.tags : [...(r.tags || []), t] }),
                          `Тег «${t}» добавлен · ${selectedRefIds.length} шт.`);
            setBulkTagInput('');
          };
          const bulkMoveToFolder = (folder) => {
            bulkPatchRefs(r => ({ ...r, folder }), folder ? `Перемещено в «${folder}» · ${selectedRefIds.length} шт.` : `Убрано из папки · ${selectedRefIds.length} шт.`);
          };
          const bulkPutOnBoard = () => {
            let i = 0;
            bulkPatchRefs(r => ({ ...r, boardId: activeBoardId,
                                  x: (260 - canvasOffset.x) / zoom + (i % 5) * 210,
                                  y: (240 - canvasOffset.y) / zoom + Math.floor(i++ / 5) * 190 }),
                          `На доску добавлено ${selectedRefIds.length} шт.`);
          };
          // Удаление референсов — ТОЛЬКО через эту дверь: она же кладёт
          // удалённое в корзину, откуда его можно вернуть. Потерять чужую
          // подборку из-за одного промаха по крестику слишком дорого.
          const undoTimer = useRef(null);
          const [undoBin, setUndoBin] = useState(null);
          const deleteRefs = (list) => {
            const items = (list || []).filter(Boolean);
            if (!items.length) return;
            const ids = items.map(r => r.id);
            freezeArrowsForCards(ids);
            setReferences(references.filter(r => !ids.includes(r.id)));
            ids.forEach(id => deleteNetDoc('references', id));
            setSelectedRefIds(sel => sel.filter(id => !ids.includes(id)));
            setUndoBin({ items });
            clearTimeout(undoTimer.current);
            undoTimer.current = setTimeout(() => setUndoBin(null), 15000);
          };
          const restoreRefs = () => {
            if (!undoBin) return;
            const items = undoBin.items;
            setReferences(prev => {
              const есть = new Set(prev.map(r => r.id));
              return [...prev, ...items.filter(r => !есть.has(r.id))];
            });
            items.forEach(r => syncDoc('references', r.id, r));
            clearTimeout(undoTimer.current);
            setUndoBin(null);
            showToast(items.length === 1 ? 'Референс возвращён' : `Возвращено ${items.length} шт.`);
          };
          const bulkDeleteRefs = () => {
            const ids = [...selectedRefIds];
            setConfirmAction({
              title: `Удалить ${ids.length} изображений?`,
              message: 'Выделенные референсы удалятся из проекта. Сразу после удаления их можно будет вернуть кнопкой.',
              onConfirm: () => deleteRefs(references.filter(r => ids.includes(r.id)))
            });
          };
          // Список тегов с количеством референсов у каждого.
          const tagCounts = useMemo(() => {
            const m = {};
            references.forEach(r => (r.tags || []).forEach(t => { m[t] = (m[t] || 0) + 1; }));
            return Object.entries(m).sort((a, b) => a[0].localeCompare(b[0], 'ru'));
          }, [references]);
          // Теги по ЧАСТОТЕ — для подсказок нужен именно такой порядок:
          // сверху то, чем реально размечают проект.
          const popularTags = useMemo(
            () => [...tagCounts].sort((a, b) => b[1] - a[1]).map(t => t[0]), [tagCounts]);
          // Что подсказать под полем ввода тега: совпадения по началу слова
          // впереди, уже проставленные у этого референса — прочь.
          const tagHints = (typed, already) => {
            const q = String(typed || '').trim().toLowerCase();
            const have = new Set((already || []).map(t => String(t).toLowerCase()));
            const list = popularTags.filter(t => !have.has(t));
            if (!q) return list.slice(0, 8);
            const starts = list.filter(t => t.startsWith(q));
            const inside = list.filter(t => !t.startsWith(q) && t.includes(q));
            return [...starts, ...inside].slice(0, 8);
          };
          const visibleRefs = useMemo(() => references.filter(r => {
            const byTag = !tagSearch || (r.tags && r.tags.some(t => t.toLowerCase().includes(tagSearch.toLowerCase())));
            const f = (r.folder || '').trim();
            const byFolder = activeFolder === '' ? true : (activeFolder === '__none__' ? !f : f === activeFolder);
            return byTag && byFolder;
          }), [references, tagSearch, activeFolder]);
          const allVisibleSelected = visibleRefs.length > 0 && visibleRefs.every(r => selectedRefIds.includes(r.id));
          
          const [activeSchemeId, setActiveSchemeId] = useState(null);
          const [drawingSchemeId, setDrawingSchemeId] = useState(null);
          const [expandedLightSceneId, setExpandedLightSceneId] = useState(null);
          const [expandedGearSceneId, setExpandedGearSceneId] = useState(null);

          // --- Экспорт в PDF: что именно печатаем ---
          // 'full' — весь план, 'doc' — открытый гайд, 'scheme' — открытая
          // схема света, 'gear' — сводный список техники.
          const [printMode, setPrintMode] = useState('full');
          const [printRequested, setPrintRequested] = useState(false);
          // Приложение, установленное на домашний экран. Это НЕ мелочь для
          // печати: там window.print() не делает ВООБЩЕ ничего — печать живёт
          // в оболочке Safari, а оболочки в таком режиме нет. Кнопка нажимается,
          // и не происходит ничего, без единой ошибки.
          const isStandalone = () => {
            try {
              return window.navigator.standalone === true ||
                     (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
            } catch (e) { return false; }
          };
          // Окно под печать открываем ПРЯМО в обработчике нажатия и держим
          // здесь: всё, что открыто позже (после таймера), браузер считает
          // всплывающим окном и блокирует.
          const printWin = useRef(null);
          const PRINT_PAGE_CSS = `@page { margin: 14mm; }
            body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
                   color: #111; background: #fff; margin: 0; padding: 18px; }
            img { max-width: 100%; }
            .print-scene { page-break-inside: avoid; border-bottom: 1px solid #ccc; padding: 12px 0; }
            .cf-hint { background: #fff4e5; border: 1px solid #f0c992; color: #6b4a12;
                       border-radius: 8px; padding: 10px 12px; margin: 0 0 16px;
                       font-size: 13px; line-height: 1.5; }
            @media print { .cf-hint { display: none !important; } body { padding: 0; } }`;

          // Собрать из #print-area отдельную готовую страницу. Оттуда печать
          // работает где угодно: в Safari это «Поделиться» → «Напечатать»,
          // там же «Сохранить в Файлы» даёт PDF.
          const openPrintPage = () => {
            const area = document.getElementById('print-area');
            const body = area ? area.innerHTML : '';
            if (!body.trim()) { showToast('Нечего печатать'); return; }
            const html = '<!doctype html><html lang="ru"><head><meta charset="utf-8">'
              + '<meta name="viewport" content="width=device-width, initial-scale=1">'
              + '<title>CineFlow — план</title><style>' + PRINT_PAGE_CSS + '</style></head><body>'
              + '<div class="cf-hint">Готовая страница для печати. Кнопка «Поделиться» → «Напечатать»; '
              + 'чтобы получить PDF — «Поделиться» → «Сохранить в Файлы».</div>'
              + body + '</body></html>';
            const w = printWin.current;
            printWin.current = null;
            if (w && !w.closed) {
              try {
                w.document.open(); w.document.write(html); w.document.close();
                showToast('Открыл готовую страницу · «Поделиться» → «Напечатать»');
                return;
              } catch (e) { /* ниже сохраним файлом */ }
            }
            // Окно не дали открыть — отдаём файлом. Открывается из «Файлов»
            // и печатается оттуда же.
            try {
              const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
              const a = document.createElement('a');
              a.href = url; a.download = 'CineFlow-план.html';
              document.body.appendChild(a); a.click(); a.remove();
              setTimeout(() => URL.revokeObjectURL(url), 4000);
              showToast('Сохранил страницу файлом — откройте её и напечатайте');
            } catch (e) { showToast('Не удалось подготовить печать'); }
          };

          // Печать запускаем только после того, как React перерисует
          // #print-area под выбранный режим, иначе уйдёт старое содержимое.
          useEffect(() => {
            if (!printRequested) return;
            const t = setTimeout(() => {
              if (isStandalone()) openPrintPage(); else window.print();
              setPrintRequested(false);
            }, 120);
            return () => clearTimeout(t);
          }, [printRequested, printMode]);
          const requestPrint = (mode) => {
            if (isStandalone()) {
              try { printWin.current = window.open('', '_blank'); } catch (e) { printWin.current = null; }
            }
            setPrintMode(mode); setPrintRequested(true);
          };

          // Сводка техники по всему проекту. Считаем максимум за одну сцену:
          // именно столько нужно взять в аренду (сумма по сценам завысила бы
          // — один и тот же стедикам работает в разных сценах).
          const gearSummary = useMemo(() => {
            const build = (field, types) => {
              const acc = {};
              scenes.forEach(s => {
                Object.entries(s[field] || {}).forEach(([k, v]) => {
                  if (!v) return;
                  if (!acc[k]) acc[k] = { label: ((types || {})[k] || { label: k }).label, peak: 0, scenes: [] };
                  acc[k].peak = Math.max(acc[k].peak, v);
                  acc[k].scenes.push(s.number);
                });
              });
              return Object.values(acc).sort((a, b) => a.label.localeCompare(b.label, 'ru'));
            };
            return { camera: build('gear', gearTypes), light: build('lightGear', lightGearTypes) };
          }, [scenes, gearTypes, lightGearTypes]);

          // Добавление тега к референсу. Раньше срабатывало только по Enter:
          // напечатал тег, кликнул мимо — тег молча пропадал, и поэтому
          // казалось, что «теги не сохраняются и поиск не работает».
          // Теперь тег принимается и по Enter, и по запятой, и при уходе фокуса.
          const addTagTo = (ref, value) => {
            const raw = String(value || '').trim().toLowerCase().replace(/,+$/, '').trim();
            if (!raw) return;
            const current = ref.tags || [];
            if (current.includes(raw)) return;
            const up = references.map(r => r.id === ref.id ? { ...r, tags: [...current, raw] } : r);
            setReferences(up);
            syncDoc('references', ref.id, up.find(r => r.id === ref.id));
          };
          const removeTagFrom = (ref, tag) => {
            const up = references.map(r => r.id === ref.id
              ? { ...r, tags: (r.tags || []).filter(t => t !== tag) } : r);
            setReferences(up);
            syncDoc('references', ref.id, up.find(r => r.id === ref.id));
          };
          const commitTag = (ref, inputEl) => {
            const v = inputEl.value; inputEl.value = '';
            addTagTo(ref, v);
          };

          // Переключатель «это панорама» вручную — последнее слово всегда
          // за человеком: метку в файл Insta360 кладёт не всегда, а ровно
          // 2:1 бывает и у обычного кадрированного снимка.
          // У фотографии, приехавшей как обычная, панорамного превью нет,
          // и без интернета крутить было бы нечего. Поэтому, если оригинал
          // лежит в облаке, готовим превью прямо сейчас — один раз.
          const setRefPano = async (ref, value) => {
            const up = references.map(r => r.id === ref.id ? { ...r, pano: !!value } : r);
            setReferences(up);
            syncDoc('references', ref.id, up.find(r => r.id === ref.id));
            if (!value || ref.panoUrl || !ref.full) return;
            try {
              showToast('Готовлю панораму для работы без интернета...');
              const res = await fetch(await cloudDirectUrl(ref));
              if (!res.ok) throw new Error('облако не отдало файл');
              const { panoUrl } = await makePanoAssets(await res.blob());
              if (!panoUrl) throw new Error('превью не собралось');
              setReferences(prev => {
                const n = prev.map(r => r.id === ref.id ? { ...r, panoUrl } : r);
                const t = n.find(r => r.id === ref.id);
                if (t) syncDoc('references', ref.id, t);
                return n;
              });
              showToast('Панорама готова, теперь открывается и без связи');
            } catch (e) {
              console.warn('Панорама: превью для офлайна не сделать', e);
              showToast('Смотреть можно, но без связи эта панорама не откроется');
            }
          };

          const [lastReadChat, setLastReadChat] = useState(() => Number(localStorage.getItem('cf_last_read')) || Date.now());
          const [newGearName, setNewGearName] = useState('');
          const [newLightGearName, setNewLightGearName] = useState('');

          const [wbMode, setWbMode] = useState('select'); 
          const [brushColor, setBrushColor] = useState('#d97757'); 
          const [brushType, setBrushType] = useState('pen'); 
          const [brushSize, setBrushSize] = useState(4); 
          const [canvasOffset, setCanvasOffset] = useState({ x: 0, y: 0 }); 
          const [zoom, setZoom] = useState(1.0);
          const [isPainting, setIsPainting] = useState(false);
          const [isPanning, setIsPanning] = useState(false);
          const [panStart, setPanStart] = useState({ x: 0, y: 0 });

          // Идёт ли сейчас штрих обратным концом стилуса
          const penErase = useRef(false);
          // Стилус на планшете. Как только человек хоть раз коснулся доски
          // пером, палец перестаёт рисовать и начинает двигать доску —
          // так устроены все рисовалки на iPad, и так ладонь не оставляет
          // клякс. Пока пера не видели, ничего не меняется: палец рисует,
          // как рисовал, иначе на устройстве без стилуса рисовать стало бы
          // нечем. Замеченный стилус помним между запусками — на iPad
          // приложение выгружается из памяти постоянно.
          const [penSeen, setPenSeen] = useState(() => { try { return localStorage.getItem('cf_pen_seen') === '1'; } catch (e) { return false; } });
          const [fingerPans, setFingerPans] = useState(() => { try { return localStorage.getItem('cf_pen_pan') !== '0'; } catch (e) { return true; } });
          const notePen = (e) => {
            if (e.pointerType !== 'pen' || penSeen) return;
            setPenSeen(true);
            try { localStorage.setItem('cf_pen_seen', '1'); } catch (err) {}
          };
          const toggleFingerPans = () => setFingerPans(v => {
            const next = !v;
            try { localStorage.setItem('cf_pen_pan', next ? '1' : '0'); } catch (e) {}
            return next;
          });
          // Обратный конец стилуса: браузер сообщает о нём отдельной кнопкой
          // (button 5 при касании, бит 32 в buttons — в том числе на весу).
          const isPenEraser = (e) => e.pointerType === 'pen' && (e.button === 5 || (e.buttons & 32) === 32);

          // --- ДВИЖОК КИСТИ ---
          // Штрихи хранятся ВЕКТОРОМ — списком точек, а не картинкой.
          // Раньше линия писалась прямо в холст 4000×4000, растянутый на всю
          // доску: на планшете, где в одной точке CSS сидят две-три настоящие,
          // и тем более при увеличении браузеру нечего было показать, кроме
          // растянутого пикселя. Отсюда и мыло, и рваный край — сколько ни
          // улучшай форму штриха, растр остаётся растром. Теперь холст
          // размером с ОКНО, рисуем в него по-настоящему мелко
          // (devicePixelRatio) и заново на каждый шаг зума: линия резкая при
          // любом увеличении, как в Excalidraw. Побочно вектор даёт даром
          // три вещи: отсечение невидимого, дешёвую отмену и ластик, который
          // режет линии, а не выедает дырки в картинке.
          // Точек в одном штрихе. Это не предел длины линии: набрав их,
          // штрих ЗАКРЫВАЕТСЯ и тут же продолжается новым от той же точки —
          // для человека линия остаётся одной.
          const INK_MAX = 1200;
          const INK_LEAD = 0.575;             // «поводок» за указателем, см. ниже
          const brushAlpha = (type) => type === 'marker' ? 0.32 : (type === 'soft' ? 0.5 : 1.0);
          const brushWidthK = (type) => type === 'soft' ? 1.7 : 1;
          // Насколько нажим меняет толщину. У маркера почти не меняет —
          // у настоящего маркера ширина задана пером, а не рукой.
          const brushThin = (type) => type === 'marker' ? 0.12 : (type === 'soft' ? 0.34 : 0.62);

          // Нажим в точке. У пера настоящий, у мыши и пальца считаем по
          // скорости: ведут быстро — след тоньше. Сглаживание обязательно,
          // иначе толщина скачет от события к событию.
          const inkPress = (prev, dist, size, dev) => dev != null
            ? prev + (dev - prev) * 0.5
            : prev + (Math.min(1, 1 - Math.min(1, dist / Math.max(1, size))) - prev) * 0.275;

          // КОНТУР штриха. Главная мысль (она же у perfect-freehand, на
          // котором рисует Excalidraw): рисуем не «линию с толщиной», а
          // замкнутую ФИГУРУ, обведённую по обе стороны от пути, где у каждой
          // точки свой радиус. Только так получаются и живой нажим, и гладкие
          // изломы, и сход на нет у концов: линия с lineWidth так не умеет
          // в принципе — у неё одна толщина на весь отрезок.
          // jn — стыки: бит 1 «не сужать начало», бит 2 «не сужать конец».
          // Нужны там, где длинная линия разрезана на куски: без этого на
          // каждом стыке линия схлопывалась бы в ноль и снова расширялась.
          const inkOutline = (pts, size, thin, jn) => {
            const n = pts.length;
            if (!n) return [];
            const R = size / 2;
            const circle = (cx, cy, r) => {
              const out = [];
              for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2; out.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
              return out;
            };
            if (n === 1) return circle(pts[0][0], pts[0][1], Math.max(0.6, R * 0.7));

            // Шаги и пройденный путь — нужны для сужения у концов.
            const step = [0], run = [0];
            for (let i = 1; i < n; i++) {
              step[i] = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
              run[i] = run[i - 1] + step[i];
            }
            const total = run[n - 1] || 0;
            // Начало набирает ширину, конец её теряет. Именно сход на нет
            // отличает живую линию от сардельки. Хвост длиннее носа —
            // так ведёт себя перо, когда его отрывают от бумаги.
            const tS = ((jn || 0) & 1) ? 0 : Math.min(size * 1.2, total * 0.35);
            const tE = ((jn || 0) & 2) ? 0 : Math.min(size * 2.2, total * 0.45);
            const rad = [];
            for (let i = 0; i < n; i++) {
              const r = R * 2 * (0.5 - thin * (0.5 - pts[i][2]));
              const a = tS > 0 ? Math.min(1, run[i] / tS) : 1;
              const b = tE > 0 ? Math.min(1, (total - run[i]) / tE) : 1;
              const k = Math.min(a * (2 - a), 1 - Math.pow(1 - b, 3));
              rad[i] = Math.max(0.35, r * Math.max(0.06, k));
            }

            const L = [], Rt = [];
            const add = (p, dx, dy, r) => { L.push([p[0] - dy * r, p[1] + dx * r]); Rt.push([p[0] + dy * r, p[1] - dx * r]); };
            const dir = (a, b) => { const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy); return l < 1e-6 ? null : [dx / l, dy / l]; };
            let last = null, first = null;
            for (let i = 0; i < n; i++) {
              const din = i > 0 ? (dir(pts[i - 1], pts[i]) || last) : null;
              const dout = i < n - 1 ? dir(pts[i], pts[i + 1]) : null;
              const a = din || dout, b = dout || din;
              if (!a || !b) continue;
              if (!first) first = a;
              last = b;
              // Вынос кладём трижды: по входу, по биссектрисе и по выходу.
              // На изломе это скругляет угол снаружи, а самопересечение
              // внутри съедает заливка по правилу nonzero — поэтому шов
              // не расходится даже на резком развороте.
              add(pts[i], a[0], a[1], rad[i]);
              if (a !== b) {
                const bx = a[0] + b[0], by = a[1] + b[1], bl = Math.hypot(bx, by);
                if (bl > 1e-6) add(pts[i], bx / bl, by / bl, rad[i]);
                add(pts[i], b[0], b[1], rad[i]);
              }
            }
            if (!L.length || !first || !last) return circle(pts[0][0], pts[0][1], Math.max(0.6, rad[0]));

            // Круглые концы: полукруг от левого выноса к правому через
            // направление движения (в начале — через обратное).
            const cap = (c, r, d, back) => {
              const base = Math.atan2(d[0], -d[1]) - (back ? Math.PI : 0);
              const out = [];
              for (let k = 1; k < 9; k++) out.push([c[0] + Math.cos(base - Math.PI * k / 9) * r, c[1] + Math.sin(base - Math.PI * k / 9) * r]);
              return out;
            };
            return L
              .concat(cap(pts[n - 1], rad[n - 1], last, false))
              .concat(Rt.slice().reverse())
              .concat(cap(pts[0], rad[0], first, true));
          };

          // Геометрию описываем СПИСКОМ КОМАНД, а не сразу Path2D: тот же
          // список уходит и в холст, и в SVG при выгрузке. Держать две копии
          // всей геометрии нельзя — они разъедутся при первой же правке.
          const cmdsPath = (cmds) => {
            const p = new Path2D();
            for (const c of cmds) {
              if (c[0] === 'M') p.moveTo(c[1], c[2]);
              else if (c[0] === 'L') p.lineTo(c[1], c[2]);
              else if (c[0] === 'Q') p.quadraticCurveTo(c[1], c[2], c[3], c[4]);
              else if (c[0] === 'A') p.arcTo(c[1], c[2], c[3], c[4], c[5]);
              else if (c[0] === 'E') p.ellipse(c[1], c[2], c[3], c[4], 0, 0, Math.PI * 2);
              else if (c[0] === 'Z') p.closePath();
            }
            return p;
          };
          const rn = (v) => Math.round(v * 10) / 10;
          const cmdsD = (cmds) => cmds.map(c => {
            if (c[0] === 'M') return `M${rn(c[1])} ${rn(c[2])}`;
            if (c[0] === 'L') return `L${rn(c[1])} ${rn(c[2])}`;
            if (c[0] === 'Q') return `Q${rn(c[1])} ${rn(c[2])} ${rn(c[3])} ${rn(c[4])}`;
            // Скругление угла в SVG выражаем дугой того же радиуса
            if (c[0] === 'A') return `L${rn(c[1])} ${rn(c[2])}`;
            if (c[0] === 'E') return `M${rn(c[1] - c[3])} ${rn(c[2])}a${rn(c[3])} ${rn(c[4])} 0 1 0 ${rn(c[3] * 2)} 0a${rn(c[3])} ${rn(c[4])} 0 1 0 ${rn(-c[3] * 2)} 0`;
            return 'Z';
          }).join('');

          // Полигон обводим квадратичными кривыми через середины сторон:
          // углы полигона исчезают, остаётся гладкий контур.
          const inkCmds = (pl) => {
            const m = pl.length;
            if (m < 3) return [];
            const out = [];
            let a = pl[m - 1], b = pl[0];
            out.push(['M', (a[0] + b[0]) / 2, (a[1] + b[1]) / 2]);
            for (let i = 0; i < m; i++) {
              a = pl[i]; b = pl[(i + 1) % m];
              out.push(['Q', a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2]);
            }
            out.push(['Z']);
            return out;
          };

          // Точки лежат ПЛОСКИМ списком чисел: Firestore не умеет вложенные
          // массивы. Разворачиваем один раз и держим при штрихе — вместе
          // с готовой фигурой и габаритом. Фигура не зависит от масштаба,
          // поэтому переживает и панораму, и зум.
          const strokePts = (s) => {
            if (!s._pts) {
              const a = [];
              for (let i = 0; i + 2 < s.p.length; i += 3) a.push([s.p[i], s.p[i + 1], s.p[i + 2]]);
              s._pts = a;
            }
            return s._pts;
          };
          const strokeCmds = (s) => {
            if (!s._cmds) s._cmds = inkCmds(inkOutline(strokePts(s), s.w * brushWidthK(s.t), brushThin(s.t), s.jn));
            return s._cmds;
          };
          const strokePath = (s) => {
            if (!s._path) s._path = cmdsPath(strokeCmds(s));
            return s._path;
          };
          const strokeBox = (s) => {
            if (s._box) return s._box;
            let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
            for (const p of strokePts(s)) {
              if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0];
              if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
            }
            const m = s.w * brushWidthK(s.t) + 4;
            s._box = { x0: x0 - m, y0: y0 - m, x1: x1 + m, y1: y1 + m };
            return s._box;
          };
          const paintStroke = (ctx, s) => {
            ctx.save();
            if (s.t === 'marker') ctx.globalCompositeOperation = 'screen';
            ctx.globalAlpha = brushAlpha(s.t);
            ctx.fillStyle = s.c;
            ctx.fill(strokePath(s));
            ctx.restore();
          };
          // Координаты округляем: на доске 4000×4000 десятой доли точки
          // хватает с запасом, а документ в Firestore ограничен мегабайтом.
          const packStroke = (t, color, size, pts, jn) => {
            const p = [];
            for (const q of pts) p.push(Math.round(q[0] * 10) / 10, Math.round(q[1] * 10) / 10, Math.round(q[2] * 100) / 100);
            const s = { id: `k${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`, t, c: color, w: size, p };
            if (jn) s.jn = jn;
            return s;
          };

          // --- ФИГУРЫ ---
          // Пять примитивов, всё остальное — их настройки. Это осознанный
          // размен из ТЗ: компактный набор + богатая параметризация вместо
          // библиотеки на триста шейпов, из которой всё равно берут пять.
          // Фигура хранится ПЛОСКОЙ записью с короткими именами полей —
          // весь список доски уезжает в облако одной строкой JSON, и каждый
          // лишний символ умножается на число фигур.
          //   k  — вид: rect | ellipse | diamond | arrow | line
          //   x,y,w,h — рамка; у линии и стрелки w,h это СМЕЩЕНИЕ до второго
          //             конца и может быть отрицательным, у остальных нет
          //   sc — цвет обводки, bg — заливки ('transparent' — без неё)
          //   sw — толщина (1|2|4), sd — solid|dashed|dotted
          //   fs — заливка: solid | hachure | cross
          //   rd — скруглять углы, ro — «от руки» (0 ровно, 1 рука, 2 черновик)
          //   op — прозрачность, a1/a2 — наконечники у концов
          //   sd8 — зерно дрожания: одна и та же фигура обязана дрожать
          //         ОДИНАКОВО между перерисовками, иначе она кипит на экране
          const SHAPE_KINDS = ['rect', 'ellipse', 'diamond', 'arrow', 'line', 'text'];
          const SHAPE_COLORS = ['#d97757', '#fbbf24', '#fb7185', '#34d399', '#38bdf8', '#f0eee6'];
          const SHAPE_FILLS = ['transparent', '#d97757', '#fbbf24', '#fb7185', '#34d399', '#38bdf8'];
          const SHAPE_STYLE0 = { sc: '#d97757', bg: 'transparent', sw: 2, sd: 'solid', fs: 'solid', rd: 1, ro: 1, op: 1, a1: 'none', a2: 'arrow', fz: 20 };
          const isLineKind = (k) => k === 'line' || k === 'arrow';
          // Текст — такой же элемент списка, а не отдельная подсистема.
          // Живёт в двух видах: сам по себе (k:'text') и подписью ВНУТРИ
          // фигуры (поле `ct` — id хозяина). Второй не имеет своего
          // положения вовсе: он всегда по центру хозяина и едет с ним.
          const isText = (s) => s.k === 'text';
          const FONT_UI = '"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
          const textFont = (s) => `${Math.max(8, s.fz || 20)}px ${FONT_UI}`;
          // Перенос по словам с учётом собственных переводов строки.
          // Меряем настоящим шрифтом холста — на глаз ширину не угадать.
          const wrapText = (ctx, text, maxW) => {
            const out = [];
            String(text || '').split('\n').forEach(para => {
              if (!para) { out.push(''); return; }
              let line = '';
              para.split(/(\s+)/).forEach(part => {
                if (!part) return;
                const test = line + part;
                if (line && ctx.measureText(test).width > maxW) { out.push(line.trimEnd()); line = part.trimStart(); }
                else line = test;
              });
              out.push(line.trimEnd());
            });
            return out.length ? out : [''];
          };
          const textLH = (s) => Math.round((s.fz || 20) * 1.3);
          // Рамка всегда с положительными сторонами: у линии концы могут
          // идти справа налево, а габарит нужен всем — и выделению, и отсечению.
          const shapeBox = (s) => {
            // У подписи внутри фигуры своего положения нет вовсе — она
            // всегда по центру хозяина. Отсюда и рамка берётся его.
            if (s.ct) {
              const host = shapesRef.current.find(q => q.id === s.ct);
              if (host) return shapeBox(host);
            }
            // У привязанной стрелки собственные координаты уже ничего не
            // значат — габарит берём по настоящему маршруту, иначе рамка
            // выделения и отсечение врали бы.
            if (isLineKind(s.k) && (s.b1 || s.b2)) {
              const r = arrowRoute(s);
              let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
              r.pts.forEach(p => { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); });
              return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
            }
            return { x: Math.min(s.x, s.x + s.w), y: Math.min(s.y, s.y + s.h),
                     w: Math.abs(s.w), h: Math.abs(s.h) };
          };
          // --- КОННЕКТОРЫ ---
          // Стрелка цепляется концом за ФИГУРУ, а не за точку: при переносе
          // блока линия перестраивается сама, и схему можно перетасовывать,
          // не поправляя руками ни одной связи. Привязка — просто id хозяина
          // в полях `b1`/`b2`; куда именно упереться, считается каждый раз
          // заново от центров, поэтому хранить нечего.
          const shapeCenter = (s) => { const b = shapeBox(s); return { x: b.x + b.w / 2, y: b.y + b.h / 2 }; };
          // Точка на границе фигуры по лучу из её центра. У каждого вида
          // своя формула — иначе стрелка втыкалась бы в пустой угол рамки
          // овала или ромба.
          const edgePoint = (h, tx, ty, gap) => {
            const b = shapeBox(h);
            const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
            let dx = tx - cx, dy = ty - cy;
            const l = Math.hypot(dx, dy);
            if (l < 0.001) return { x: cx, y: cy };
            dx /= l; dy /= l;
            const hw = Math.max(1, b.w / 2), hh = Math.max(1, b.h / 2);
            let t;
            if (h.k === 'ellipse') t = 1 / Math.hypot(dx / hw, dy / hh);
            else if (h.k === 'diamond') t = 1 / (Math.abs(dx) / hw + Math.abs(dy) / hh);
            else t = Math.min(hw / Math.max(1e-6, Math.abs(dx)), hh / Math.max(1e-6, Math.abs(dy)));
            // Зазор между фигурой и концом линии — мелочь, которая делает
            // схему аккуратной: без него стрелка липнет к самой рамке.
            return { x: cx + dx * (t + (gap === undefined ? 7 : gap)), y: cy + dy * (t + (gap === undefined ? 7 : gap)) };
          };
          const findShape = (id) => id ? shapesRef.current.find(q => q.id === id) : null;
          // Стрелка цепляется не только за фигуру, но и за КАРТОЧКУ — сцену,
          // референс, заметку, документ. Для расчёта края карточка выглядит
          // прямоугольником, и формулы `edgePoint` подходят как есть. Так
          // «связать всё со всем» получается тем же жестом и тем же
          // коннектором, а не второй параллельной механикой связей.
          const cardBind = (id) => {
            const c = cardsRef.current || {};
            const sc = (c.scenes || []).find(x => x.id === id);
            if (sc && sceneOnBoard(sc, activeBoardId)) return { id, k: 'rect', x: sc.x, y: sc.y, w: 288, h: 150 };
            const r = (c.references || []).find(x => x.id === id);
            if (r && r.boardId === activeBoardId) return { id, k: 'rect', x: r.x, y: r.y, w: refW(r), h: refH(r) };
            const st = (c.stickies || []).find(x => x.id === id);
            if (st && belongsToBoard(st, activeBoardId)) return { id, k: 'rect', x: st.x, y: st.y, w: stickyW(st), h: stickyH(st) };
            const dc = (c.docs || []).find(x => x.id === id);
            if (dc && dc.boardId === activeBoardId) return { id, k: 'rect', x: dc.x, y: dc.y, w: docCardW(dc), h: docCardH(dc) };
            return null;
          };
          const findBind = (id) => id ? (findShape(id) || cardBind(id)) : null;
          // Что под точкой: сначала фигура, потом карточка. Карточка берётся
          // рамкой — у неё нет контура, за который можно было бы взяться.
          const cardAt = (x, y) => {
            const list = boardCards();
            for (let i = list.length - 1; i >= 0; i--) {
              const c = list[i];
              if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h)
                return { id: c.o.id, k: 'rect', x: c.x, y: c.y, w: c.w, h: c.h };
            }
            return null;
          };
          // Сама линия целью быть не может, но и загораживать собой то, что
          // под ней, не должна: связей на доске много, они пересекают всё
          // подряд, и нажатие по карточке попадало в чужую линию — связь
          // просто не начиналась. Поэтому линии пропускаем и смотрим ниже.
          const bindAt = (x, y) => {
            const pad = 8 / Math.max(0.05, zoom);
            for (let i = shapesRef.current.length - 1; i >= 0; i--) {
              const q = shapesRef.current[i];
              if (q.ct || isLineKind(q.k)) continue;
              if (shapeHit(q, x, y, pad, true)) return q;
            }
            return cardAt(x, y);
          };
          // Стрелки, привязанные к перечисленным объектам
          const arrowsBoundTo = (ids) => {
            const set = ids instanceof Set ? ids : new Set(ids);
            return shapesRef.current.filter(q => isLineKind(q.k) && ((q.b1 && set.has(q.b1)) || (q.b2 && set.has(q.b2))));
          };
          const arrowEnds = (s) => {
            const h1 = findBind(s.b1), h2 = findBind(s.b2);
            let p1 = { x: s.x, y: s.y }, p2 = { x: s.x + s.w, y: s.y + s.h };
            const c1 = h1 ? shapeCenter(h1) : p1;
            const c2 = h2 ? shapeCenter(h2) : p2;
            if (h1) p1 = edgePoint(h1, c2.x, c2.y, s.gp);
            if (h2) p2 = edgePoint(h2, c1.x, c1.y, s.gp);
            return { p1, p2 };
          };
          // Маршрут. Прямой — от края до края; кривой — одна дуга с изгибом,
          // которым рулит средняя ручка; ортогональный — колено из отрезков
          // по осям. Обхода препятствий тут намеренно нет: простая эвристика
          // покрывает почти все схемы, а полноценный поиск пути — отдельная
          // задача, которой у нас пока не стоит.
          const arrowRoute = (s) => {
            const { p1, p2 } = arrowEnds(s);
            const rt = s.rt || 'straight';
            if (rt === 'ortho') {
              const dx = p2.x - p1.x, dy = p2.y - p1.y;
              if (Math.abs(dx) >= Math.abs(dy)) {
                const mx = p1.x + dx / 2;
                return { pts: [[p1.x, p1.y], [mx, p1.y], [mx, p2.y], [p2.x, p2.y]], curved: false };
              }
              const my = p1.y + dy / 2;
              return { pts: [[p1.x, p1.y], [p1.x, my], [p2.x, my], [p2.x, p2.y]], curved: false };
            }
            if (rt === 'curved') {
              const dx = p2.x - p1.x, dy = p2.y - p1.y, l = Math.hypot(dx, dy) || 1;
              const bow = s.bw === undefined ? l * 0.2 : s.bw;
              return { pts: [[p1.x, p1.y], [(p1.x + p2.x) / 2 - dy / l * bow, (p1.y + p2.y) / 2 + dx / l * bow], [p2.x, p2.y]], curved: true };
            }
            return { pts: [[p1.x, p1.y], [p2.x, p2.y]], curved: false };
          };

          const shapeRnd = (seed) => { let v = (seed >>> 0) || 1; return () => { v = (v * 1664525 + 1013904223) >>> 0; return v / 4294967296; }; };


          // Опорные точки контура. Для «руки» этого достаточно: по ним кладём
          // выгнутые рёбра. Овал режем на 16 дуг — меньше видно грани.
          const shapeCorners = (s) => {
            const b = shapeBox(s);
            if (isLineKind(s.k)) {
              const r = arrowRoute(s);
              if (!r.curved) return r.pts;
              // Дугу для «от руки» РАЗБИВАЕМ на точки: контрольная точка
              // лежит в стороне от самой кривой, и ломаная через неё
              // читается изломом, а не дугой.
              const a = r.pts[0], cp = r.pts[1], z2 = r.pts[2], out = [];
              for (let i = 0; i <= 12; i++) {
                const t = i / 12, u = 1 - t;
                out.push([u * u * a[0] + 2 * u * t * cp[0] + t * t * z2[0],
                          u * u * a[1] + 2 * u * t * cp[1] + t * t * z2[1]]);
              }
              return out;
            }
            if (s.k === 'diamond') return [[b.x + b.w / 2, b.y], [b.x + b.w, b.y + b.h / 2], [b.x + b.w / 2, b.y + b.h], [b.x, b.y + b.h / 2]];
            if (s.k === 'ellipse') {
              // Точек берём по РАЗМЕРУ: на шестнадцати у крупного овала
              // видно грани — он читается многоугольником, а не овалом.
              const n = Math.max(22, Math.min(56, Math.round((b.w + b.h) / 11)));
              const out = [], cx = b.x + b.w / 2, cy = b.y + b.h / 2;
              for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; out.push([cx + Math.cos(a) * b.w / 2, cy + Math.sin(a) * b.h / 2]); }
              return out;
            }
            return [[b.x, b.y], [b.x + b.w, b.y], [b.x + b.w, b.y + b.h], [b.x, b.y + b.h]];
          };
          const shapeSmoothCmds = (s) => {
            const b = shapeBox(s), out = [];
            if (isLineKind(s.k)) {
              const r = arrowRoute(s), q = r.pts;
              out.push(['M', q[0][0], q[0][1]]);
              if (r.curved) out.push(['Q', q[1][0], q[1][1], q[2][0], q[2][1]]);
              else if (q.length > 2) {
                // Колени ортогонального маршрута скругляем: прямой угол
                // в тонкой линии читается как излом, а не как поворот.
                for (let i = 1; i < q.length - 1; i++) out.push(['A', q[i][0], q[i][1], q[i + 1][0], q[i + 1][1], 8]);
                out.push(['L', q[q.length - 1][0], q[q.length - 1][1]]);
              } else out.push(['L', q[1][0], q[1][1]]);
              return out;
            }
            if (s.k === 'ellipse') return [['E', b.x + b.w / 2, b.y + b.h / 2, Math.max(0.1, b.w / 2), Math.max(0.1, b.h / 2)]];
            if (s.k === 'diamond') {
              const c = shapeCorners(s);
              out.push(['M', c[0][0], c[0][1]]);
              for (let i = 1; i < c.length; i++) out.push(['L', c[i][0], c[i][1]]);
              out.push(['Z']);
              return out;
            }
            const r = s.rd ? Math.min(26, Math.min(b.w, b.h) * 0.22) : 0;
            if (r > 0) {
              const x0 = b.x, y0 = b.y, x1 = b.x + b.w, y1 = b.y + b.h;
              out.push(['M', x0 + r, y0]);
              out.push(['L', x1 - r, y0], ['Q', x1, y0, x1, y0 + r]);
              out.push(['L', x1, y1 - r], ['Q', x1, y1, x1 - r, y1]);
              out.push(['L', x0 + r, y1], ['Q', x0, y1, x0, y1 - r]);
              out.push(['L', x0, y0 + r], ['Q', x0, y0, x0 + r, y0], ['Z']);
              return out;
            }
            out.push(['M', b.x, b.y], ['L', b.x + b.w, b.y], ['L', b.x + b.w, b.y + b.h], ['L', b.x, b.y + b.h], ['Z']);
            return out;
          };
          // «От руки» в три шага. Каждый важен, и порядок тоже:
          // 1) длинные стороны ДРОБИМ — одна дуга на всю сторону читается
          //    как ровная линия, которую слегка повело, а рука так не ведёт;
          // 2) смещаем точки по ОДНОМУ разу и переиспользуем — если дёргать
          //    концы у каждого куска отдельно, куски расходятся и контур
          //    рвётся на стыках;
          // 3) между соседними точками кладём выгнутую дугу. Именно выгиб,
          //    а не дрожание по всей длине: от дрожания линия мохнатая.
          const shapeRoughCmds = (s, pass) => {
            const rnd = shapeRnd((s.sd8 || 1) + pass * 7919);
            const b = shapeBox(s);
            const amp = (s.ro === 2 ? 4.2 : 2.0) * (1 + Math.min(1.8, Math.max(b.w, b.h) / 260));
            const c = shapeCorners(s);
            const closed = !isLineKind(s.k);
            const raw = [];
            const n = closed ? c.length : c.length - 1;
            for (let i = 0; i < n; i++) {
              const a = c[i], d = c[(i + 1) % c.length];
              const len = Math.hypot(d[0] - a[0], d[1] - a[1]);
              const parts = Math.max(1, Math.min(5, Math.round(len / 85)));
              for (let q = 0; q < parts; q++) {
                const t = q / parts;
                raw.push([a[0] + (d[0] - a[0]) * t, a[1] + (d[1] - a[1]) * t]);
              }
            }
            if (!closed) raw.push(c[c.length - 1]);
            const j = raw.map(q => [q[0] + (rnd() - 0.5) * amp, q[1] + (rnd() - 0.5) * amp]);
            const out = [];
            if (!j.length) return out;
            out.push(['M', j[0][0], j[0][1]]);
            const m = closed ? j.length : j.length - 1;
            for (let i = 0; i < m; i++) {
              const a = j[i], d = j[(i + 1) % j.length];
              const dx = d[0] - a[0], dy = d[1] - a[1], l = Math.hypot(dx, dy) || 1;
              const bow = (rnd() - 0.5) * amp * 1.3;
              out.push(['Q', (a[0] + d[0]) / 2 - dy / l * bow, (a[1] + d[1]) / 2 + dx / l * bow, d[0], d[1]]);
            }
            if (closed) out.push(['Z']);
            return out;
          };
          // Фигура не зависит от масштаба, поэтому её путь считается один раз
          // и переживает и панораму, и зум. Правка фигуры сбрасывает кэш.
          const shapeCmds = (s, pass) => {
            // Привязанная стрелка зависит от того, где сейчас стоят её
            // фигуры, — кэшировать нечего: подвинули блок, и путь другой.
            const live = isLineKind(s.k) && (s.b1 || s.b2);
            const key = s.ro ? '_c' + pass : '_c';
            if (live) return s.ro ? shapeRoughCmds(s, pass) : shapeSmoothCmds(s);
            if (!s[key]) s[key] = s.ro ? shapeRoughCmds(s, pass) : shapeSmoothCmds(s);
            return s[key];
          };
          const shapePath = (s, pass) => {
            const live = isLineKind(s.k) && (s.b1 || s.b2);
            if (live) return cmdsPath(shapeCmds(s, pass));
            const key = s.ro ? '_p' + pass : '_p';
            if (!s[key]) s[key] = cmdsPath(shapeCmds(s, pass));
            return s[key];
          };
          const shapeDirty = (s) => {
            delete s._p; delete s._p0; delete s._p1;
            delete s._c; delete s._c0; delete s._c1;
            return s;
          };

          // Штриховка: рисуем наклонные линии, обрезав их формой. Заливка
          // сплошным на тёмном фоне читается пятном, поэтому она приглушена,
          // а штриховка наоборот ярче — иначе её просто не видно.
          const fillHatch = (ctx, s, path, cross) => {
            const b = shapeBox(s);
            const gap = Math.max(7, 5 + s.sw * 2.5);
            ctx.save();
            ctx.clip(path);
            ctx.globalAlpha = ctx.globalAlpha * 0.55;
            ctx.strokeStyle = s.bg;
            ctx.lineWidth = Math.max(1, s.sw * 0.7);
            ctx.setLineDash([]);
            const run = (back) => {
              for (let i = -b.h; i < b.w + b.h; i += gap) {
                ctx.beginPath();
                if (back) { ctx.moveTo(b.x + i, b.y); ctx.lineTo(b.x + i + b.h, b.y + b.h); }
                else { ctx.moveTo(b.x + i, b.y); ctx.lineTo(b.x + i - b.h, b.y + b.h); }
                ctx.stroke();
              }
            };
            run(false); if (cross) run(true);
            ctx.restore();
          };
          const arrowHead = (ctx, x, y, fromX, fromY, size) => {
            const a = Math.atan2(y - fromY, x - fromX), w = 0.42;
            ctx.beginPath();
            ctx.moveTo(x - Math.cos(a - w) * size, y - Math.sin(a - w) * size);
            ctx.lineTo(x, y);
            ctx.lineTo(x - Math.cos(a + w) * size, y - Math.sin(a + w) * size);
            ctx.stroke();
          };
          // Текст рисуем ОДНОЙ функцией и для своего элемента, и для подписи
          // внутри фигуры: разница только в том, откуда берётся рамка.
          const paintText = (ctx, s, box) => {
            const b = box || shapeBox(s);
            ctx.save();
            ctx.globalAlpha = s.op === undefined ? 1 : s.op;
            ctx.font = textFont(s);
            ctx.fillStyle = s.sc;
            ctx.textBaseline = 'top';
            const pad = box ? 10 : 0;
            const maxW = Math.max(10, b.w - pad * 2);
            const lines = wrapText(ctx, s.tx, maxW);
            const lh = textLH(s);
            const total = lines.length * lh;
            // Подпись внутри фигуры центрируется по обеим осям — так её
            // ставят и в Freeform, и это единственное, что читается,
            // когда хозяина растянули.
            let y = box ? b.y + (b.h - total) / 2 : b.y;
            const ta = s.ta || (box ? 'center' : 'left');
            ctx.textAlign = ta;
            const x = ta === 'center' ? b.x + b.w / 2 : (ta === 'right' ? b.x + b.w - pad : b.x + pad);
            lines.forEach(ln => { ctx.fillText(ln, x, y); y += lh; });
            ctx.restore();
          };
          // Высота текстового элемента считается по содержимому: рамку
          // задаёт ширина, а сколько строк получилось — знает только
          // перенос. Без пересчёта выделение и попадание врали бы.
          const measureText = (s) => {
            if (!hitCtx.current) hitCtx.current = document.createElement('canvas').getContext('2d');
            const c = hitCtx.current;
            c.font = textFont(s);
            const lines = wrapText(c, s.tx, Math.max(10, s.w));
            return Math.max(textLH(s), lines.length * textLH(s));
          };
          const paintShape = (ctx, s) => {
            if (isText(s)) {
              const host = s.ct ? shapesRef.current.find(q => q.id === s.ct) : null;
              paintText(ctx, s, host ? shapeBox(host) : null);
              return;
            }
            ctx.save();
            ctx.globalAlpha = s.op === undefined ? 1 : s.op;
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            const closed = !isLineKind(s.k);
            if (closed && s.bg && s.bg !== 'transparent') {
              const fp = shapePath(s, 0);
              if (s.fs === 'hachure' || s.fs === 'cross') fillHatch(ctx, s, fp, s.fs === 'cross');
              else { ctx.save(); ctx.globalAlpha = ctx.globalAlpha * 0.22; ctx.fillStyle = s.bg; ctx.fill(fp); ctx.restore(); }
            }
            ctx.strokeStyle = s.sc;
            ctx.lineWidth = s.sw;
            if (s.sd === 'dashed') ctx.setLineDash([s.sw * 4, s.sw * 3.2]);
            else if (s.sd === 'dotted') ctx.setLineDash([0.1, s.sw * 2.6]);
            else ctx.setLineDash([]);
            ctx.stroke(shapePath(s, 0));
            // «От руки» — это ДВА прохода: один контур с дрожанием выглядит
            // просто кривым, два наложенных читаются как нажим карандаша.
            if (s.ro) { ctx.save(); ctx.globalAlpha = ctx.globalAlpha * 0.75; ctx.stroke(shapePath(s, 1)); ctx.restore(); }
            if (isLineKind(s.k)) {
              ctx.setLineDash([]);
              const hs = Math.max(9, s.sw * 4.5);
              // Направление берём у последнего отрезка МАРШРУТА, а не
              // у прямой между концами: на колене и на дуге это разные вещи.
              const q = arrowRoute(s).pts, n = q.length;
              if (s.a2 === 'arrow') arrowHead(ctx, q[n - 1][0], q[n - 1][1], q[n - 2][0], q[n - 2][1], hs);
              if (s.a1 === 'arrow') arrowHead(ctx, q[0][0], q[0][1], q[1][0], q[1][1], hs);
            }
            ctx.restore();
          };

          // Попадание считаем настоящей проверкой по пути, а не «внутри
          // рамки»: у овала и ромба углы рамки пустые, и по ним ловилось
          // то, чего под пальцем нет. Незалитую фигуру берём только за контур.
          const hitCtx = useRef(null);
          // `inside` — считать попаданием и «внутри контура», даже если
          // фигура не залита. Обычному выбору так делать НЕЛЬЗЯ: фигуры
          // лежат поверх карточек, и большой прозрачный прямоугольник
          // накрыл бы собой всё, что под ним. А вот двойному клику
          // «подписать этот блок» именно так и надо.
          const shapeHit = (s, x, y, pad, inside) => {
            const b = shapeBox(s);
            const m = pad + s.sw;
            if (x < b.x - m || x > b.x + b.w + m || y < b.y - m || y > b.y + b.h + m) return false;
            // Текст берётся всей рамкой: ловить его по контуру букв —
            // издевательство, особенно пальцем.
            if (isText(s)) return true;
            if (!hitCtx.current) hitCtx.current = document.createElement('canvas').getContext('2d');
            const c = hitCtx.current;
            c.lineWidth = Math.max(s.sw, 1) + pad * 2;
            const p = shapePath(s, 0);
            if (c.isPointInStroke(p, x, y)) return true;
            if (!isLineKind(s.k) && (inside || (s.bg && s.bg !== 'transparent')) && c.isPointInPath(p, x, y)) return true;
            return false;
          };
          // Ручки. У линии и стрелки их ДВЕ — по концам: тянуть такую за
          // угол рамки бессмысленно, поворот у неё и есть перенос конца.
          // У остальных восемь: четыре угла и четыре середины сторон.
          const shapeHandles = (s) => {
            if (isLineKind(s.k)) {
              const { p1, p2 } = arrowEnds(s);
              const out = [{ n: 'p1', x: p1.x, y: p1.y }, { n: 'p2', x: p2.x, y: p2.y }];
              // Средняя точка рулит изгибом — как зелёная точка в Freeform.
              if ((s.rt || 'straight') === 'curved') {
                const q = arrowRoute(s).pts;
                out.push({ n: 'mid', x: (q[0][0] + 2 * q[1][0] + q[2][0]) / 4, y: (q[0][1] + 2 * q[1][1] + q[2][1]) / 4 });
              }
              return out;
            }
            const b = shapeBox(s), mx = b.x + b.w / 2, my = b.y + b.h / 2;
            // У текста тянется только ширина: высоту задаёт содержимое,
            // и вертикальная ручка обманывала бы — отпустил, а она вернулась.
            if (isText(s)) return [{ n: 'w', x: b.x, y: my }, { n: 'e', x: b.x + b.w, y: my }];
            return [
              { n: 'nw', x: b.x, y: b.y }, { n: 'n', x: mx, y: b.y }, { n: 'ne', x: b.x + b.w, y: b.y },
              { n: 'e', x: b.x + b.w, y: my }, { n: 'se', x: b.x + b.w, y: b.y + b.h },
              { n: 's', x: mx, y: b.y + b.h }, { n: 'sw', x: b.x, y: b.y + b.h }, { n: 'w', x: b.x, y: my }
            ];
          };
          const packShapes = (list) => JSON.stringify(list.map(s => {
            const o = {}; for (const k in s) if (k[0] !== '_') o[k] = s[k];
            return o;
          }));

          // --- СЛОИ РИСОВАНИЯ ---
          // Холстов два, и это главный рычаг плавности: на нижнем лежат
          // готовые штрихи, на верхнем — тот, что ведут прямо сейчас, и
          // кольцо-подсказка. Пока идёт штрих, нижний не трогаем вовсе.
          const inkCanvasRef = useRef(null);   // готовые штрихи + старый растр
          const liveCanvasRef = useRef(null);  // текущий штрих и кольцо кисти
          const strokesRef = useRef([]);       // векторные штрихи открытой доски
          const legacyCv = useRef(null);       // старый растровый рисунок, если он есть
          const legacyUrl = useRef(null);
          const legacyDirty = useRef(false);
          const live = useRef(null);           // штрих, который ведут сейчас
          const hoverPt = useRef(null);        // указатель в ЭКРАННЫХ координатах
          const undoStack = useRef([]);
          const redoStack = useRef([]);
          const [canUndo, setCanUndo] = useState(false);
          const [canRedo, setCanRedo] = useState(false);
          // Фигуры лежат в ref, а не в состоянии React: при ведении мышью
          // они меняются по десять раз в секунду, и каждая такая правка
          // перерисовывала бы всё приложение вместе со списком сцен.
          // Наружу торчит только выделение — оно нужно панели свойств.
          const shapesRef = useRef([]);
          const [selShapes, setSelShapes] = useState([]);
          const [shapeKind, setShapeKind] = useState('rect');
          const [shapeStyle, setShapeStyle] = useState(() => {
            try { return { ...SHAPE_STYLE0, ...(JSON.parse(localStorage.getItem('cf_shape_style')) || {}) }; }
            catch (e) { return { ...SHAPE_STYLE0 }; }
          });
          // Какой текст правят прямо сейчас. Пока правят — на холсте его
          // не рисуем, иначе он двоился бы с полем ввода.
          const [editText, setEditText] = useState(null);   // {id} | null
          const editRef = useRef(null);
          const shapeDraft = useRef(null);      // фигура, которую тянут прямо сейчас
          const shapeAct = useRef(null);        // идёт перемещение или изменение размера
          const bindCand = useRef(null);        // фигура, к которой сейчас притянется конец
          const linkPick = useRef(null);        // первый объект, выбранный в режиме «Связь»
          const guides = useRef([]);            // направляющие, показанные сейчас
          const snapPool = useRef(null);        // к чему притягиваемся в этом жесте
          // Ластик живёт своим размером, а не «кисть × 2,5», как раньше:
          // размер был спрятан в коде, увидеть и задать его было нечем.
          const [eraserSize, setEraserSize] = useState(() => { try { return Number(localStorage.getItem('cf_eraser')) || 40; } catch (e) { return 40; } });
          const changeEraser = (v) => { setEraserSize(v); try { localStorage.setItem('cf_eraser', v); } catch (e) {} };

          // Холст размером с окно и в НАСТОЯЩЕМ разрешении экрана. Множитель
          // ограничен двойкой: на телефонах он бывает 3, и втрое больший холст
          // стоит втрое дороже при разнице, которой не видно.
          const fitInk = (c) => {
            const dpr = Math.min(2, window.devicePixelRatio || 1);
            const w = c.clientWidth || 1, h = c.clientHeight || 1;
            const bw = Math.round(w * dpr), bh = Math.round(h * dpr);
            if (c.width !== bw || c.height !== bh) { c.width = bw; c.height = bh; }
            const ctx = c.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            return { w, h, ctx };
          };

          // Экран → доска. Холсты лежат ровно по размеру области доски,
          // поэтому её левый верхний угол и есть начало отсчёта.
          const inkPt = (cx, cy) => {
            const c = liveCanvasRef.current;
            const r = c ? c.getBoundingClientRect() : { left: 0, top: 0 };
            const sx = cx - r.left, sy = cy - r.top;
            return { sx, sy, x: (sx - canvasOffset.x) / zoom, y: (sy - canvasOffset.y) / zoom };
          };
          const erasePt = useRef(null);

          // Грубая карта старой растровой подложки: 100×100 клеток, в каждой
          // просто «есть тут что-нибудь или пусто». Считается ОДИН раз при
          // загрузке уменьшением картинки (это быстро, делает видеокарта).
          // Нужна ради одного: снимок подложки для отмены весит десятки
          // мегабайт и кодируется сотни миллисекунд, поэтому снимать его
          // надо, только если ластик реально что-то у неё забрал.
          const legacyMap = useRef(null);
          const legacyShot = useRef(false);
          const buildLegacyMap = (img) => {
            try {
              const s = document.createElement('canvas');
              s.width = 100; s.height = 100;
              const sc = s.getContext('2d');
              sc.drawImage(img, 0, 0, 100, 100);
              const d = sc.getImageData(0, 0, 100, 100).data;
              const m = new Uint8Array(100 * 100);
              for (let i = 0; i < m.length; i++) m[i] = d[i * 4 + 3] ? 1 : 0;
              legacyMap.current = m;
            } catch (err) { legacyMap.current = null; }
          };
          const legacyHit = (x0, y0, x1, y1, r) => {
            if (!legacyCv.current) return false;
            const m = legacyMap.current;
            if (!m) return true;
            const cell = 40;
            const a = Math.max(0, Math.floor((Math.min(x0, x1) - r) / cell));
            const b = Math.min(99, Math.floor((Math.max(x0, x1) + r) / cell));
            const c = Math.max(0, Math.floor((Math.min(y0, y1) - r) / cell));
            const d = Math.min(99, Math.floor((Math.max(y0, y1) + r) / cell));
            for (let j = c; j <= d; j++) for (let i = a; i <= b; i++) if (m[j * 100 + i]) return true;
            return false;
          };
          // Подложку для отмены снимаем один раз за штрих и только по факту.
          const holdLegacy = () => {
            if (legacyShot.current || !legacyCv.current) return;
            legacyShot.current = true;
            const top = undoStack.current[undoStack.current.length - 1];
            if (top && top.legacy === undefined) top.legacy = legacyCv.current.toDataURL();
          };

          // --- НАПРАВЛЯЮЩИЕ И ПРИТЯЖКА ---
          // Раньше всё жёстко липло к сетке в 24 точки: выровнять карточку
          // по СОСЕДНЕЙ было нельзя в принципе, если та стояла не по сетке.
          // Теперь сначала ищем совпадение с краями и серединами того, что
          // уже лежит на доске, и только если ничего не нашли — падаем
          // обратно на сетку. Порог берётся в ЭКРАННЫХ точках и делится
          // на масштаб, иначе на мелком зуме притягивало бы через пол-доски.
          const SNAP_PX = 7;
          const GRID = 24;
          // Ctrl (Cmd) во время жеста выключает притяжку целиком.
          const noSnap = useRef(false);
          // Собираем кандидатов ОДИН раз в начале жеста: то, что не движется,
          // за время жеста не изменится, а список может быть длинным.
          const buildSnapPool = (skipIds) => {
            const skip = new Set(skipIds || []);
            const out = [];
            const add = (o, w, h) => { if (!skip.has(o.id)) out.push({ x0: o.x, y0: o.y, x1: o.x + w, y1: o.y + h }); };
            boardScenes.forEach(s => add(s, 288, 150));
            references.filter(r => r.boardId === activeBoardId).forEach(r => add(r, refW(r), refH(r)));
            stickies.filter(st => belongsToBoard(st, activeBoardId)).forEach(st => add(st, stickyW(st), stickyH(st)));
            boardDocs.forEach(d => add(d, docCardW(d), docCardH(d)));
            shapesRef.current.forEach(s => { if (!skip.has(s.id)) { const b = shapeBox(s); out.push({ x0: b.x, y0: b.y, x1: b.x + b.w, y1: b.y + b.h }); } });
            snapPool.current = out;
            return out;
          };
          // Считаем поправку по каждой оси отдельно и запоминаем, какие линии
          // показать. Сравниваем три значения с трёх сторон: край, середина,
          // край — этого хватает и для выравнивания, и для «по центру».
          const snapAdjust = (box) => {
            guides.current = [];
            if (noSnap.current) return { dx: 0, dy: 0 };
            const pool = snapPool.current || [];
            const tol = SNAP_PX / Math.max(0.05, zoom);
            const mine = {
              x: [box.x0, (box.x0 + box.x1) / 2, box.x1],
              y: [box.y0, (box.y0 + box.y1) / 2, box.y1]
            };
            let bx = null, by = null;
            for (const t of pool) {
              const tx = [t.x0, (t.x0 + t.x1) / 2, t.x1];
              const ty = [t.y0, (t.y0 + t.y1) / 2, t.y1];
              for (const m of mine.x) for (const v of tx) {
                const d = v - m;
                if (Math.abs(d) <= tol && (!bx || Math.abs(d) < Math.abs(bx.d))) bx = { d, v, t };
              }
              for (const m of mine.y) for (const v of ty) {
                const d = v - m;
                if (Math.abs(d) <= tol && (!by || Math.abs(d) < Math.abs(by.d))) by = { d, v, t };
              }
            }
