# Капелла в Godot: тесты, выгрузка Linux и Windows, запуск обеих сборок, выпуск.
# Архитектура — godot/spec/00-architecture.md, раздел 9; заметки — godot/CLAUDE.md.
# Срабатывает ТОЛЬКО на ветки claude/capella-godot* и только на правки godot/**
# и этого файла: сайт CineFlow (master, GitHub Pages) этот файл не трогает.
name: capella-godot

on:
  push:
    branches: ['claude/capella-godot', 'claude/capella-godot-*']
    tags: ['capella-v*']            # метки — в on.push.tags (ключа push-tags нет)
    paths: ['godot/**', '.github/workflows/capella-godot.yml']
  workflow_dispatch:
    inputs:
      release:
        description: 'черновик выпуска под этим номером (capella-vX.Y); пусто — только тесты, без выпуска'
        default: ''
      publish:
        description: 'опубликовать для всех (пользователь согласился на публичные выпуски 10.10.2026); без галочки — черновик'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: capella-godot-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: '4.7.2'
  # SHA512 из SHA512-SUMS.txt выпуска 4.7.2-stable: скачанное сверяется до распаковки
  GODOT_ZIP_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
  GODOT_TPZ_SHA512: ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      release: ${{ steps.rel.outputs.tag }}
      publish: ${{ steps.rel.outputs.publish }}
      selftest: ${{ steps.linux.outputs.selftest }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Godot и шаблоны выгрузки — 1,28 ГБ; в кэше только нужное (~217 МБ)
      - name: Кэш Godot 4.7.2
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-4.7.2-stable-lin-win-v1

      - name: Скачать Godot 4.7.2 и шаблоны (с проверкой SHA512)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-dl && cd ~/godot-dl
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSfL --retry 3 -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSfL --retry 3 -o tpl.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          echo "$GODOT_ZIP_SHA512  godot.zip" | sha512sum -c -
          echo "$GODOT_TPZ_SHA512  tpl.tpz" | sha512sum -c -
          mkdir -p tpl
          unzip -q -j tpl.tpz templates/version.txt templates/linux_release.x86_64 \
            templates/windows_release_x86_64.exe templates/windows_release_x86_64_console.exe -d tpl
          rm tpl.tpz

      # Имя «godot» в корне репозитория занято папкой проекта — программа живёт в ~/godot-bin
      - name: Установить Godot
        run: |
          set -euo pipefail
          mkdir -p ~/godot-bin ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -o -q ~/godot-dl/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot-${GODOT_VERSION}
          cp ~/godot-dl/tpl/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          echo "GODOT=$HOME/godot-bin/godot-${GODOT_VERSION}" >> "$GITHUB_ENV"
          ~/godot-bin/godot-${GODOT_VERSION} --version

      # картинка — под xvfb в обоих отрисовщиках: Vulkan на lavapipe (mesa-vulkan-drivers)
      # и OpenGL на llvmpipe; видеокарты на машине CI нет
      - name: Программный Vulkan и xvfb для яруса картинки
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mesa-vulkan-drivers libgl1-mesa-dri xvfb xauth > /dev/null
          vulkaninfo --summary 2>/dev/null | grep -i -m2 -e deviceName -e driverName || true

      - name: Тесты — импорт, разбор, модель, ввод, картинка, данные
        run: LOGS="$RUNNER_TEMP/logs" godot/tools/run_tests.sh render

      # снимки «Стола» на 1920 и 1366 в обоих отрисовщиках — смотреть глазами
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capella-shots
          path: ${{ runner.temp }}/logs/shots
          retention-days: 7
          if-no-files-found: warn

      - name: Выгрузка Linux и Windows
        run: |
          set -euo pipefail
          # папку сборки — заранее (иначе «export path doesn't exist»); .gdignore — чтобы
          # Godot не принял выгруженное за ресурсы проекта
          mkdir -p godot/build/linux godot/build/windows && touch godot/build/.gdignore
          $GODOT --headless --path godot --export-release Linux build/linux/capella.x86_64 > "$RUNNER_TEMP/export_linux.log" 2>&1 || { tail -40 "$RUNNER_TEMP/export_linux.log"; exit 1; }
          $GODOT --headless --path godot --export-release Windows build/windows/capella.exe > "$RUNNER_TEMP/export_windows.log" 2>&1 || { tail -40 "$RUNNER_TEMP/export_windows.log"; exit 1; }
          ls -la godot/build/linux godot/build/windows
          test -x godot/build/linux/capella.x86_64
          test -f godot/build/windows/capella.console.exe

      - name: Запуск выгруженной Linux-сборки (-- --selftest)
        id: linux
        run: |
          set -uo pipefail
          timeout 120 godot/build/linux/capella.x86_64 --headless -- --selftest > "$RUNNER_TEMP/selftest.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/selftest.log"
          line=$(grep -m1 '^SELFTEST' "$RUNNER_TEMP/selftest.log" || true)
          echo "selftest=$line" >> "$GITHUB_OUTPUT"
          # выпускная сборка падает там, где редактор только ругается (вызов у null — код 139)
          if [ $code -ne 0 ] || ! grep -q '^SELFTEST ok' "$RUNNER_TEMP/selftest.log" || grep -q 'SCRIPT ERROR' "$RUNNER_TEMP/selftest.log"; then
            echo "::error::выгруженная Linux-сборка: код $code"; exit 1
          fi

      # --selftest выходит ДО вида и счётчика — путь, который увидит игрок, гоняем
      # отдельно: вызов родного метода у null в выпускной сборке — код 139, а в
      # --selftest его не видно (проверено откатом)
      - name: Запуск выгруженной Linux-сборки с окном (--quit-after 60)
        run: |
          set -uo pipefail
          timeout 120 godot/build/linux/capella.x86_64 --headless --quit-after 60 > "$RUNNER_TEMP/window.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/window.log"
          if [ $code -ne 0 ] || ! grep -q '^Капелла: отрисовщик' "$RUNNER_TEMP/window.log" || grep -q 'SCRIPT ERROR' "$RUNNER_TEMP/window.log"; then
            echo "::error::выгруженная Linux-сборка с окном: код $code"; exit 1
          fi

      # относительный путь — от папки, ИЗ КОТОРОЙ запустили (PWD): сборка сама уходит
      # в папку программы, и без launch_dirs «tune.json» искался бы там
      - name: Linux-сборка, --overrides=tune.json из чужой папки
        run: |
          set -uo pipefail
          exe="$GITHUB_WORKSPACE/godot/build/linux/capella.x86_64"
          mkdir -p "$RUNNER_TEMP/rel" && cd "$RUNNER_TEMP/rel"
          printf '{"main.dead_k": 0.43}\n' > tune.json
          timeout 120 "$exe" --headless -- --selftest --overrides=tune.json > rel.log 2>&1
          code=$?
          cat rel.log
          if [ $code -ne 0 ] || ! grep -q '^SELFTEST ok: .*правок 1,' rel.log; then
            echo "::error::--overrides с относительным путём: код $code"; exit 1
          fi

      # минута замера кадров (укороченная): файл ложится РЯДОМ С ПРОГРАММОЙ, номер
      # сборки в итоге — из godot/RELEASE (он едет в выгрузку, include_filter)
      - name: Linux-сборка, -- --bench-render (2 с), файл рядом с программой
        run: |
          set -uo pipefail
          num=$(head -n1 godot/RELEASE | tr -d '\r[:space:]')
          timeout 180 godot/build/linux/capella.x86_64 --headless -- --bench-render --bench-seconds=2 > "$RUNNER_TEMP/bench.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/bench.log"
          csv=$(ls godot/build/linux/capella_frames_*.csv 2>/dev/null | head -1)
          if [ $code -ne 0 ] || [ -z "$csv" ] || ! grep -q "^BENCH Капелла $num · замер кадров" "$RUNNER_TEMP/bench.log"; then
            echo "::error::замер кадров выгруженной сборки: код $code, файл «$csv»"; exit 1
          fi
          head -12 "$csv"
          rm -f godot/build/linux/capella_frames_*.csv

      # пропавшая модель — громкий отказ и в ВЫПУСКНОЙ сборке: замер не начинается,
      # код 1, беда называет корабль (раньше — пустое место молча и «83 корабля» в итоге)
      - name: Linux-сборка, пропавшая модель — замер и --selftest отказывают (код 1)
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/lost"
          python3 - godot/data/ship_models.json "$RUNNER_TEMP/lost/ship_models.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          d['ships']['plektor']['cruiser']['file'] = 'res://view/ships/plektor_cruiser_lost.glb'
          json.dump(d, open(sys.argv[2], 'w'))
          PY
          # шаг идёт под «bash -e»: команда, которая ОБЯЗАНА вернуть 1, без «|| code=$?»
          # уронила бы шаг раньше проверки, и молча — без вывода
          code=0
          timeout 120 godot/build/linux/capella.x86_64 --headless -- --bench-render --bench-seconds=2 --ship-models="$RUNNER_TEMP/lost/ship_models.json" > "$RUNNER_TEMP/lost/bench.log" 2>&1 || code=$?
          cat "$RUNNER_TEMP/lost/bench.log"
          if [ $code -ne 1 ] || ! grep -q 'МОДЕЛИ: .*plektor\.cruiser' "$RUNNER_TEMP/lost/bench.log" || ls godot/build/linux/capella_frames_*.csv >/dev/null 2>&1; then
            echo "::error::пропавшая модель: замер не отказал громко (код $code)"; exit 1
          fi
          code=0
          timeout 120 godot/build/linux/capella.x86_64 --headless -- --selftest --ship-models="$RUNNER_TEMP/lost/ship_models.json" > "$RUNNER_TEMP/lost/self.log" 2>&1 || code=$?
          cat "$RUNNER_TEMP/lost/self.log"
          if [ $code -ne 1 ] || ! grep -q '^SELFTEST ПРОВАЛ' "$RUNNER_TEMP/lost/self.log"; then
            echo "::error::пропавшая модель: --selftest не отказал (код $code)"; exit 1
          fi

      - name: Архивы
        run: |
          set -euo pipefail
          mkdir -p out
          (cd godot/build/linux && zip -9 -q ../../../out/capella-linux.zip capella.x86_64)
          (cd godot/build/windows && zip -9 -q ../../../out/capella-windows.zip capella.exe capella.console.exe)
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: capella-linux
          path: out/capella-linux.zip
          retention-days: 7
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: capella-windows
          path: out/capella-windows.zip
          retention-days: 7
          compression-level: 0

      # Новый номер в godot/RELEASE (дверь 3, основная), метка capella-v* или кнопка
      # с заполненным полем; кнопка с ПУСТЫМ полем — только тесты (godot/tools/release_tag.sh,
      # каждый случай проверяет run_tests.sh). Есть ли уже такой выпуск, здесь НЕ проверяем:
      # у этого задания права только на чтение, а черновики видны лишь с правом записи —
      # gh release list их не покажет, и каждый пуш плодил бы новый черновик.
      - name: Номер выпуска
        id: rel
        env:
          INPUT_RELEASE: ${{ github.event.inputs.release }}
          INPUT_PUBLISH: ${{ github.event.inputs.publish }}
        run: godot/tools/release_tag.sh godot/RELEASE >> "$GITHUB_OUTPUT"

  windows-run:
    needs: test-build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: capella-windows
      - name: Запуск выгруженной Windows-сборки (консольная обёртка, -- --selftest)
        shell: pwsh
        env:
          LINUX_SELFTEST: ${{ needs.test-build.outputs.selftest }}
        run: |
          $ErrorActionPreference = 'Continue'
          Expand-Archive capella-windows.zip -DestinationPath win
          Get-ChildItem win
          # консольная обёртка: у программы Windows без неё нет вывода в консоль
          cmd /c "win\capella.console.exe --headless -- --selftest > selftest.txt 2>&1"
          $code = $LASTEXITCODE
          $out = Get-Content selftest.txt -Raw
          Write-Host $out
          Write-Host "код выхода: $code"
          if ($code -ne 0 -or $out -notmatch 'SELFTEST ok' -or $out -match 'SCRIPT ERROR') { Write-Host "::error::выгруженная Windows-сборка не прошла --selftest"; exit 1 }
          # отпечаток данных Linux и Windows обязан совпасть (пока данные; бой — с G1)
          $fpW = [regex]::Match($out, 'SELFTEST ok: данные (\w+)').Groups[1].Value
          $fpL = [regex]::Match($env:LINUX_SELFTEST, 'данные (\w+)').Groups[1].Value
          Write-Host "отпечаток данных: Linux $fpL, Windows $fpW"
          if ($fpL -ne $fpW) { Write-Host "::warning::отпечаток данных Linux и Windows разный" }
          exit 0
      # путь, который увидит игрок: вид и счётчик (--selftest выходит раньше них)
      - name: Запуск выгруженной Windows-сборки с окном (--quit-after 60)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cmd /c "win\capella.console.exe --headless --quit-after 60 > window.txt 2>&1"
          $code = $LASTEXITCODE
          $out = Get-Content window.txt -Raw
          Write-Host $out
          Write-Host "код выхода: $code"
          if ($code -ne 0 -or $out -notmatch 'Капелла: отрисовщик' -or $out -match 'SCRIPT ERROR') { Write-Host "::error::выгруженная Windows-сборка с окном не прошла"; exit 1 }
          exit 0
      # замер кадров: файл — рядом с программой (папка распакованного архива)
      - name: Windows-сборка, -- --bench-render (2 с), файл рядом с программой
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cmd /c "win\capella.console.exe --headless -- --bench-render --bench-seconds=2 > bench.txt 2>&1"
          $code = $LASTEXITCODE
          $out = Get-Content bench.txt -Raw
          Write-Host $out
          $csv = Get-ChildItem win -Filter 'capella_frames_*.csv' | Select-Object -First 1
          if ($code -ne 0 -or $null -eq $csv -or $out -notmatch 'BENCH Кадров:') { Write-Host "::error::замер кадров на Windows: код $code"; exit 1 }
          Get-Content $csv.FullName -TotalCount 12
          exit 0
      # относительный путь в cmd и PowerShell (PWD у них нет) — от папки программы:
      # tune.json рядом с exe, запуск из другой папки
      - name: Windows-сборка, --overrides=tune.json рядом с программой
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Set-Content -Path win\tune.json -Value '{"main.dead_k": 0.43}' -Encoding ascii
          cmd /c "win\capella.console.exe --headless -- --selftest --overrides=tune.json > rel.txt 2>&1"
          $code = $LASTEXITCODE
          $out = Get-Content rel.txt -Raw
          Write-Host $out
          Write-Host "код выхода: $code"
          if ($code -ne 0 -or $out -notmatch 'SELFTEST ok: .*правок 1,') { Write-Host "::error::--overrides с относительным путём на Windows"; exit 1 }
          exit 0

  release:
    needs: [test-build, windows-run]
    if: needs.test-build.outputs.release != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
          merge-multiple: true
      # Пользователь САМ согласился на публичные выпуски 10.10.2026 (ответ в чате
      # «Да, публиковать» на вопрос о публичных сборках; godot/CLAUDE.md, 13).
      # Публиковать ли — решает godot/tools/release_tag.sh (каждый случай проверяет
      # run_tests.sh): пуш с новым номером в godot/RELEASE в САМУ ветку
      # claude/capella-godot и метка — публикуют; пробная claude/capella-godot-* —
      # только черновик; кнопка — как скажет галочка publish. Опубликованный выпуск
      # больше не трогается. Остальное — godot/tools/release_publish.sh.
      - name: Выпуск
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.test-build.outputs.release }}
          PUBLISH: ${{ needs.test-build.outputs.publish }}
        run: godot/tools/release_publish.sh "$TAG" dl
