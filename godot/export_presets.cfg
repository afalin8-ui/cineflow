; Выгрузка для игрока: Linux и Windows (архитектура, 9). Сборки в git не кладём.
; ПУТИ: папку сборки создавать заранее (иначе «export path doesn't exist»), и в ней
; лежит .gdignore — чтобы Godot не сканировал выгруженное как ресурсы проекта.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json, RELEASE"
exclude_filter="spec/*, tests/*, tools/vendor/*"
export_path="build/linux/capella.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"

[preset.1]

name="Windows"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json, RELEASE"
exclude_filter="spec/*, tests/*, tools/vendor/*"
export_path="build/windows/capella.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=2
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
application/modify_resources=true
application/icon="res://icon.svg"
application/file_description="Капелла: бой на орбите"
application/product_name="Капелла"
application/company_name=""
application/file_version="0.0.0.0"
application/product_version="0.0.0.0"
