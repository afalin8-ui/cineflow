                                    <span className="text-[10px] font-bold uppercase tracking-wider text-zinc-500 shrink-0 pr-1">Группы</span>
                                    {groups.map(g => (
                                        <Chip key={g.id} label={g.name} sub={g.ids.length + ' приб.'}
                                              active={g.ids.length > 0 && g.ids.every(id => selected.has(id))}
                                              onTap={() => applyGroup(g, false)}
                                              onHold={() => setModal({ type: 'groupMenu', id: g.id })} />
                                    ))}
                                    <button onClick={saveGroup}
                                            className="shrink-0 rounded-lg border border-dashed border-[var(--border)] px-2.5 py-2 text-zinc-500 flex items-center gap-1">
                                        <Icons.Plus /><span className="text-[10px] font-bold">из выбора</span>
                                    </button>
                                </div>
                                <div className="flex-1 min-h-0 overflow-y-auto px-3 pb-2">
                                    <div className="grid gap-2" style={{ gridTemplateColumns: 'repeat(auto-fill, minmax(96px, 1fr))' }}>
                                        {fixtures.map(f => {
                                            const P = outRef.current[f.id] || DEF_PARAMS;
                                            return <FixtureTile key={f.id} f={f} sel={selected.has(f.id)}
                                                    color={displayColor(f, P, mul)} dim={P.dim}
                                                    hasProg={progRef.current.has(f.id)}
                                                    pixels={P.px} mul={mul}
                                                    onTap={() => toggleSel(f.id)} />;
                                        })}
                                    </div>
                                    {fixtures.length === 0 && (
                                        <div className="text-center text-zinc-500 pt-14 text-sm">
                                            Сначала добавьте приборы на странице «Патч».
                                        </div>
                                    )}
                                </div>
                                {/* списки сцен */}
                                <div className="shrink-0 border-t border-[var(--border)] bg-[var(--panel-2)] flex items-center gap-1.5 px-3 py-2 overflow-x-auto hide-scrollbar">
                                    <span className="text-[10px] font-bold uppercase tracking-wider text-zinc-500 shrink-0 pr-1">Списки</span>
                                    {cuelists.map(cl => {
                                        const r = clRunRef.current[cl.id] || { on: false, step: -1 };
                                        const st = r.on && r.step >= 0 ? (cl.steps || [])[r.step] : null;
                                        const pb = st ? playbacks[st.slot] : null;
                                        return (
                                            <div key={cl.id} className={"shrink-0 flex items-stretch rounded-lg border overflow-hidden " +
                                                   (r.on ? 'border-[var(--accent)] bg-[rgba(217,119,87,0.1)]' : 'border-[var(--border)] bg-[var(--panel)]')}>
                                                <Chip label={cl.name}
                                                      sub={r.on ? 'шаг ' + (r.step + 1) + '/' + cl.steps.length + (pb ? ' · ' + pb.name : '') : (cl.steps.length + ' шаг.')}
                                                      onTap={() => goCuelist(cl, 1)}
                                                      onHold={() => setModal({ type: 'clMenu', id: cl.id })} />
                                                {r.on && (
                                                    <button onClick={() => stopCuelist(cl)}
                                                            className="px-2 text-[10px] font-bold text-zinc-400 border-l border-[var(--border)]">стоп</button>
                                                )}
                                            </div>
                                        );
                                    })}
                                    <button onClick={addCuelist}
                                            className="shrink-0 rounded-lg border border-dashed border-[var(--border)] px-2.5 py-2 text-zinc-500 flex items-center gap-1">
                                        <Icons.Plus /><span className="text-[10px] font-bold">новый</span>
                                    </button>
                                    {cuelists.length === 0 && (
                                        <span className="text-[10px] text-zinc-600 pl-1">Список — это порядок, в котором идут ваши сцены. Тап по списку = следующий шаг.</span>
                                    )}
                                </div>

                                {/* сцены (плейбеки) */}
                                <div className="shrink-0 border-t border-[var(--border)] bg-[var(--panel-2)]">
                                    {recMode && (
                                        <div className="px-3 pt-2 text-[11px] text-red-400 font-semibold">
                                            Режим записи: нажмите на слот, куда сохранить текущую картинку света.
                                            <button onClick={() => setRecMode(false)} className="ml-2 underline">Отмена</button>
                                        </div>
                                    )}
                                    <div className="flex items-stretch gap-2 px-3 py-2 overflow-x-auto hide-scrollbar">
                                        <button onClick={() => setRecMode(r => !r)}
                                                className={"shrink-0 w-[64px] rounded-xl border text-[11px] font-extrabold " +
                                                  (recMode ? 'border-red-500 bg-red-600/20 text-red-400 animate-pulse' : 'border-[var(--border)] bg-[var(--panel)] text-zinc-300')}>
                                            ● ЗАПИСЬ
                                        </button>
                                        {playbacks.map((pb, idx) => {
                                            const run = pb ? pbRunRef.current[pb.id] : null;
                                            return <PlaybackTile key={pb ? pb.id : 'empty' + idx} pb={pb} idx={idx}
                                                    level={run ? run.level : 0} active={run ? run.target > 0 : false} recMode={recMode}
                                                    onRecord={() => recordScene(idx)}
                                                    onToggle={() => togglePb(pb)}
                                                    onLevel={v => setPbLevel(pb, v)}
                                                    onMenu={() => setModal({ type: 'pbMenu', idx })} />;
                                        })}
                                    </div>
                                </div>
                            </div>

                            {controlPanel}
                        </div>
                    )}

                    {/* ── слепой режим: рамка, чтобы это нельзя было забыть ── */}
                    {blind && <div className="pointer-events-none fixed inset-0 z-40 border-2 border-sky-600"></div>}
                    {highlight && (
                        <div className="pointer-events-none fixed bottom-4 left-4 z-40 px-3 py-1.5 rounded-lg bg-yellow-500 text-black text-[10px] font-bold">
                            ПОИСК ПРИБОРА · остальные погашены
                        </div>
                    )}

                    {/* ── тост ── */}
                    {toastMsg && (
                        <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl glass-panel text-sm shadow-xl">
                            {toastMsg}
                        </div>
                    )}

                    {/* ── модалки ── */}
                    {modal && modal.type === 'settings' && (
                        <SettingsModal settings={settings} setSettings={setSettings} dmxStatus={dmxStatus} netStatus={netStatus}
                                       connectSerial={connectSerial} disconnectSerial={disconnectSerial}
                                       connectBridge={connectBridge} disconnectBridge={disconnectBridge}
                                       fixtures={fixtures} playbacks={playbacks} customSwatches={customSwatches} customProfiles={customProfiles} effects={effects} groups={groups} palettes={palettes} cuelists={cuelists}
                                       onImport={data => {
                                           setFixtures(data.fixtures || []);
                                           setPlaybacks(data.playbacks && data.playbacks.length === 10 ? data.playbacks : new Array(10).fill(null));
                                           setCustomSwatches(data.customSwatches || []);
                                           setCustomProfiles(data.customProfiles || []);
                                           setEffects(data.effects || []);
                                           setGroups(data.groups || []);
                                           setPalettes(data.palettes || []);
                                           setCuelists(data.cuelists || []);
                                           clRunRef.current = {};
                                           setSettings(data.settings || { serialUniverse: 1 });
                                           setSelected(new Set()); progRef.current.clear(); setProgDirty(false);
                                           toast('Проект загружен');
                                       }}
                                       onReset={() => {
                                           localStorage.removeItem('cl_project_v1');
                                           const p = seedProject();
                                           setFixtures(p.fixtures); setPlaybacks(p.playbacks);
                                           setCustomSwatches([]); setCustomProfiles([]); setEffects([]); setGroups([]); setPalettes([]); setCuelists([]); clRunRef.current = {}; setSettings(p.settings);
                                           setSelected(new Set()); progRef.current.clear(); setProgDirty(false);
                                           setModal(null); toast('Проект сброшен');
                                       }}
                                       onClose={() => setModal(null)} />
                    )}
                    {modal && modal.type === 'addFixture' && (
                        <AddFixtureModal fixtures={fixtures} customProfiles={customProfiles}
                                         onAdd={(list, newProfile) => {
                                             pushUndo('Добавление приборов');
                                             setFixtures(fx => [...fx, ...list]);
                                             if (newProfile) setCustomProfiles(ps => [...ps, newProfile]);
                                             setModal(null);
                                             toast(list.length > 1 ? 'Добавлено приборов: ' + list.length : 'Прибор добавлен');
                                         }}
                                         onClose={() => setModal(null)} />
                    )}
                    {modal && modal.type === 'editFixture' && (
                        <EditFixtureModal fixture={fixtures.find(f => f.id === modal.id)}
                                          onSave={upd => {
                                              pushUndo('Настройка прибора');
                                              setFixtures(fx => fx.map(f => f.id === modal.id ? { ...f, ...upd } : f));
                                              setModal(null);
                                          }}
                                          onDelete={() => {
                                              pushUndo('Удаление прибора');
                                              setFixtures(fx => fx.filter(f => f.id !== modal.id));
                                              setSelected(s => { const n = new Set(s); n.delete(modal.id); return n; });
                                              progRef.current.delete(modal.id);
                                              setModal(null); toast('Прибор удалён');
                                          }}
                                          onClose={() => setModal(null)} />
                    )}
                    {modal && modal.type === 'groupMenu' && groups.find(g => g.id === modal.id) && (
                        <GroupMenuModal group={groups.find(g => g.id === modal.id)} selCount={selected.size}
                                        onRename={nm => { pushUndo('Переименование группы'); setGroups(l => l.map(g => g.id === modal.id ? { ...g, name: nm } : g)); setModal(null); }}
                                        onAddTo={() => { applyGroup(groups.find(g => g.id === modal.id), true); setModal(null); }}
                                        onReplace={() => {
                                            pushUndo('Изменение группы');
                                            setGroups(l => l.map(g => g.id === modal.id ? { ...g, ids: Array.from(selected) } : g));
                                            setModal(null); toast('Группа перезаписана выбором');
                                        }}
                                        onDelete={() => { pushUndo('Удаление группы'); setGroups(l => l.filter(g => g.id !== modal.id)); setModal(null); toast('Группа удалена'); }}
                                        onClose={() => setModal(null)} />
                    )}
                    {modal && modal.type === 'palMenu' && palettes.find(p => p.id === modal.id) && (
                        <PaletteMenuModal pal={palettes.find(p => p.id === modal.id)} selCount={selected.size}
                                          usedIn={playbacks.filter(pb => pb && pb.scene && Object.values(pb.scene).some(s => s.palC === modal.id || s.palP === modal.id)).map(pb => pb.name)}
                                          onRename={nm => { pushUndo('Переименование палитры'); setPalettes(l => l.map(p => p.id === modal.id ? { ...p, name: nm } : p)); setModal(null); }}
                                          onUpdate={() => { updatePalette(palettes.find(p => p.id === modal.id)); setModal(null); }}
                                          onDelete={() => { pushUndo('Удаление палитры'); setPalettes(l => l.filter(p => p.id !== modal.id)); setModal(null); toast('Палитра удалена'); }}
                                          onClose={() => setModal(null)} />
                    )}
                    {modal && modal.type === 'clMenu' && cuelists.find(c => c.id === modal.id) && (
                        <CuelistModal cl={cuelists.find(c => c.id === modal.id)} playbacks={playbacks}
                                      onSave={upd => { pushUndo('Изменение списка'); setCuelists(l => l.map(c => c.id === modal.id ? { ...c, ...upd } : c)); setModal(null); }}
                                      onDelete={() => {
                                          const cl = cuelists.find(c => c.id === modal.id);
                                          stopCuelist(cl);
                                          pushUndo('Удаление списка');
                                          setCuelists(l => l.filter(c => c.id !== modal.id));
                                          setModal(null); toast('Список удалён');
                                      }}
                                      onClose={() => setModal(null)} />
                    )}
                    {modal && modal.type === 'pbMenu' && playbacks[modal.idx] && (
                        <PlaybackMenuModal pb={playbacks[modal.idx]}
                                           onSave={upd => {
                                               setPlaybacks(pbs => pbs.map((p, i) => i === modal.idx ? { ...p, ...upd } : p));
                                               setModal(null);
                                           }}
                                           onRerecord={() => { recordScene(modal.idx); setModal(null); }}
                                           onDelete={() => {
                                               pushUndo('Удаление сцены');
                                               const pb = playbacks[modal.idx];
                                               if (pb) delete pbRunRef.current[pb.id];
                                               setPlaybacks(pbs => pbs.map((p, i) => i === modal.idx ? null : p));
                                               setModal(null); toast('Сцена удалена');
                                           }}
                                           onClose={() => setModal(null)} />
                    )}
                </div>
            );
        }

        /* ═══════════ настройки ═══════════ */
        function SettingsModal({ settings, setSettings, dmxStatus, netStatus, connectSerial, disconnectSerial, connectBridge, disconnectBridge, fixtures, playbacks, customSwatches, customProfiles, effects, groups, palettes, cuelists, onImport, onReset, onClose }) {
            const fileRef = useRef(null);
            const doExport = () => {
                const data = JSON.stringify({ fixtures, playbacks, customSwatches, customProfiles, settings, effects, groups, palettes, cuelists }, null, 2);
                const blob = new Blob([data], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'cinelight-project.json';
                a.click();
                URL.revokeObjectURL(a.href);
            };
            const doImport = e => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const data = JSON.parse(reader.result);
                        if (!Array.isArray(data.fixtures)) throw new Error('bad');
                        onImport(data); onClose();
                    } catch (err) { alert('Не получилось прочитать файл проекта'); }
                };
                reader.readAsText(file);
                e.target.value = '';
            };
            return (
                <Modal title="Настройки" onClose={onClose}>
                    <div className="space-y-5">
                        <div>
                            <div className="text-[11px] font-bold uppercase tracking-wider text-zinc-500 mb-2">Выход DMX · USB (Windows, Chrome/Edge)</div>
                            <div className="flex items-center gap-2 mb-2">
                                {dmxStatus === 'on' ? (
                                    <button onClick={disconnectSerial} className="px-3 py-2 rounded-lg bg-[var(--panel-2)] border border-green-700 text-green-400 text-xs font-bold">Подключено · Отключить</button>
                                ) : (
                                    <button onClick={connectSerial} className="px-3 py-2 rounded-lg bg-[var(--accent)] text-white text-xs font-bold">Подключить USB-DMX</button>
                                )}
                                <select className="glass-input rounded-lg px-2 py-2 text-xs"
                                        value={settings.serialUniverse || 1}
                                        onChange={e => setSettings(s => ({ ...s, serialUniverse: parseInt(e.target.value) }))}>
                                    {[1, 2, 3, 4].map(u => <option key={u} value={u}>Юниверс {u}</option>)}
                                </select>
                            </div>
                            <p className="text-[11px] text-zinc-500 leading-relaxed">
                                Для USB-DMX интерфейсов с протоколом Enttec DMX USB Pro (Enttec Pro, DMXKing
                                и совместимые). Работает в Chrome и Edge на компьютере; на iPad USB недоступен —
                                используйте мост ниже.
                            </p>
                        </div>
                        <div>
                            <div className="text-[11px] font-bold uppercase tracking-wider text-zinc-500 mb-2">Выход DMX · Art-Net мост (iPad и Windows, по Wi-Fi)</div>
                            <div className="flex items-center gap-2 mb-2">
                                <input className="glass-input rounded-lg px-3 py-2 text-xs flex-1 font-mono" placeholder="адрес моста, напр. 192.168.1.50:9070"
                                       value={settings.bridgeAddr || ''}
                                       onChange={e => setSettings(s => ({ ...s, bridgeAddr: e.target.value }))} />
                                {netStatus === 'off' ? (
                                    <button onClick={connectBridge} className="px-3 py-2 rounded-lg bg-[var(--accent)] text-white text-xs font-bold whitespace-nowrap">Подключить мост</button>
                                ) : (
                                    <button onClick={disconnectBridge} className={"px-3 py-2 rounded-lg bg-[var(--panel-2)] border text-xs font-bold whitespace-nowrap " +
                                            (netStatus === 'on' ? 'border-green-700 text-green-400' : 'border-yellow-700 text-yellow-500')}>
                                        {netStatus === 'on' ? 'Подключено · Отключить' : 'Подключаюсь… Отмена'}
                                    </button>
                                )}
                            </div>
                            <div className="flex gap-1 mb-2">
                                {[['artnet', 'Art-Net'], ['sacn', 'sACN (E1.31)']].map(([id, nm]) => (
                                    <button key={id} onClick={() => setSettings(s => ({ ...s, netProto: id }))}
                                            className={"flex-1 py-2 rounded-lg text-xs font-bold " +
                                              ((settings.netProto || 'artnet') === id ? 'bg-[var(--accent)] text-white' : 'bg-[var(--panel-2)] text-zinc-400')}>{nm}</button>
                                ))}
                            </div>
                            {(settings.netProto || 'artnet') === 'artnet' ? (
                                <select className="glass-input rounded-lg px-2 py-2 text-xs mb-2 w-full"
                                        value={settings.artnetBase || 0}
                                        onChange={e => setSettings(s => ({ ...s, artnetBase: parseInt(e.target.value) }))}>
                                    <option value={0}>Юниверс 1 → Art-Net universe 0 (стандарт)</option>
                                    <option value={1}>Юниверс 1 → Art-Net universe 1</option>
                                </select>
                            ) : (
                                <div className="flex gap-2 mb-2">
                                    <select className="glass-input rounded-lg px-2 py-2 text-xs flex-1"
                                            value={settings.sacnBase === undefined ? 0 : settings.sacnBase}
                                            onChange={e => setSettings(s => ({ ...s, sacnBase: parseInt(e.target.value) }))}>
                                        <option value={0}>Юниверс 1 → sACN universe 1 (стандарт)</option>
                                        <option value={-1}>Юниверс 1 → sACN universe 1, со сдвигом</option>
                                    </select>
                                    <input type="number" min="1" max="200" className="glass-input rounded-lg px-2 py-2 text-xs w-24 font-mono"
                                           placeholder="приоритет"
                                           value={settings.sacnPriority === undefined ? 100 : settings.sacnPriority}
                                           onChange={e => setSettings(s => ({ ...s, sacnPriority: clamp(parseInt(e.target.value) || 100, 1, 200) }))} />
                                </div>
                            )}
                            <p className="text-[11px] text-zinc-500 leading-relaxed">
                                Мост — маленькая программа на компьютере в той же Wi-Fi сети (файлы
                                cinelight-bridge.js и cinelight-bridge.bat лежат рядом с пультом). Один раз
                                установите Node.js с nodejs.org, затем запускайте cinelight-bridge.bat —
                                окно покажет адрес вида http://192.168.1.50:9070. Откройте этот адрес на iPad —
                                пульт загрузится прямо с моста — и нажмите «Подключить мост». Дальше сигнал
                                уходит в сеть: Art-Net или sACN — что понимает ваше железо. Art-Net старше и
                                встречается чаще у радиопередатчиков (CRMX и похожие), sACN — современный
                                стандарт, его просят новые ноды и медиасерверы. Мост сам разбирается, что
                                куда слать, и передаёт все юниверсы, где есть приборы.
                            </p>
                        </div>
                        <div>
                            <div className="text-[11px] font-bold uppercase tracking-wider text-zinc-500 mb-2">Проект</div>
                            <div className="flex flex-wrap gap-2">
                                <button onClick={doExport} className="px-3 py-2 rounded-lg bg-[var(--panel-2)] border border-[var(--border)] text-xs font-bold text-zinc-300">Экспорт в файл</button>
                                <button onClick={() => fileRef.current.click()} className="px-3 py-2 rounded-lg bg-[var(--panel-2)] border border-[var(--border)] text-xs font-bold text-zinc-300">Импорт из файла</button>
                                <button onClick={() => { if (window.confirm('Удалить все приборы и сцены и начать заново?')) onReset(); }}
                                        className="px-3 py-2 rounded-lg bg-[var(--panel-2)] border border-red-900 text-xs font-bold text-red-400">Сбросить всё</button>
                                <input ref={fileRef} type="file" accept=".json" className="hidden" onChange={doImport} />
                            </div>
                            <p className="text-[11px] text-zinc-500 mt-2">
                                Проект сохраняется в этом браузере автоматически. Файл нужен, чтобы перенести
                                настройку на другой компьютер или планшет.
                            </p>
                        </div>
                        <div>
                            <div className="text-[11px] font-bold uppercase tracking-wider text-zinc-500 mb-2">Как пользоваться</div>
                            <ul className="text-[11px] text-zinc-400 leading-relaxed list-disc pl-4 space-y-1">
                                <li>«Патч» — выберите приборы из библиотеки (производитель → модель → режим DMX) и задайте адреса.</li>
                                <li>«План» — расставьте приборы пальцем так, как они стоят на площадке. По этой расстановке бегут эффекты.</li>
                                <li>На пульте выберите приборы и задайте цвет: круг, температура (CCT), тон G/M, ползунки RGB.</li>
                                <li>Энкодеры внизу крутятся пальцем по кругу; кнопка «Точно» — медленный ход.</li>
                                <li>«● ЗАПИСЬ» и затем слот — сохранить текущую картинку как сцену. Тап по сцене — включить с фейдом, вертикальное движение — уровень, долгое нажатие — настройки сцены.</li>
                                <li>«Очистить» — убрать ручные правки и вернуться к сценам. BLACKOUT — мгновенно всё в ноль.</li>
                                <li>Вкладка «Эффекты» — движение света: радуга, волна, бегущий огонёк, пламя. У пиксельных трубок эффект идёт по каждому пикселю.</li>
                                <li>Цвет можно задать цифрами: координаты CIE x/y, Кельвины, RGB 0–255 или оттенок с насыщенностью.</li>
                                <li>Без интерфейса и моста пульт работает в демо-режиме: плитки приборов показывают свет, сцены можно готовить заранее.</li>
                            </ul>
                        </div>
                    </div>
                </Modal>
            );
        }

        /* ═══════════ добавление прибора ═══════════ */
        function AddFixtureModal({ fixtures, customProfiles, onAdd, onClose }) {
            const [imported, setImported] = useState([]);
            const [query, setQuery] = useState('');
            const fileRef = useRef(null);
            const lib = useMemo(() => {
                const l = FIXTURE_LIB.map(b => ({ ...b, models: b.models.slice() }));
                if (imported.length) l.push({ brand: 'Загруженные из файлов', models: imported });
                if (customProfiles.length) l.push({ brand: 'Мои профили', models: [{ model: 'Сохранённые', cct: [2700, 6500], modes: customProfiles }] });
                OFL_LIB.forEach(b => l.push(b));
                return l;
            }, [customProfiles, imported]);

            // поиск по всей библиотеке: «arri sky», «astera», «titan»
            const found = useMemo(() => {
                const q = query.trim().toLowerCase();
                if (q.length < 2) return null;
                const words = q.split(/\s+/);
                const res = [];
                for (let b = 0; b < lib.length && res.length < 60; b++) {
                    const br = lib[b];
                    for (let m = 0; m < br.models.length && res.length < 60; m++) {
                        const hay = (br.brand + ' ' + br.models[m].model).toLowerCase();
                        if (words.every(w => hay.indexOf(w) >= 0)) res.push({ b, m, label: br.brand + ' — ' + br.models[m].model });
                    }
                }
                return res;
            }, [query, lib]);

            const importGdtf = async file => {
                try {
                    const buf = await file.arrayBuffer();
                    const xml = await unzipFind(buf, 'description.xml');
                    const parsed = parseGdtf(xml);
                    setImported(list => {
                        const next = [...list, { model: parsed.brand + ' ' + parsed.model, cct: [2700, 6500], modes: parsed.modes }];
                        setCustom(false);
                        setQuery('');
                        setBi(FIXTURE_LIB.length);      // раздел «Загруженные из файлов»
                        setMi(next.length - 1);
                        setMo(0);
                        return next;
                    });
                } catch (e) {
                    alert('Не получилось прочитать файл «' + file.name + '»: ' + e.message);
                }
            };
            const [bi, setBi] = useState(0);
            const [mi, setMi] = useState(0);
            const [mo, setMo] = useState(0);
            const [custom, setCustom] = useState(false);
            const [name, setName] = useState('');
            const [count, setCount] = useState(1);
            const [universe, setUniverse] = useState(1);
            const [addr, setAddr] = useState(() => nextFreeAddr(fixtures, 1));
            const [cctMin, setCctMin] = useState(2700);
            const [cctMax, setCctMax] = useState(6500);
            const [customCh, setCustomCh] = useState(['dim', 'r', 'g', 'b']);
            const [customPx, setCustomPx] = useState(0);
            const [customName, setCustomName] = useState('Мой прибор');

            const brand = lib[Math.min(bi, lib.length - 1)];
            const model = brand.models[Math.min(mi, brand.models.length - 1)];
            const mode = model.modes[Math.min(mo, model.modes.length - 1)];
            const profile = custom
                ? { id: 'cp' + uid(), name: customName || 'Мой прибор', ch: customCh,
                    px: customPx > 0 ? ['r', 'g', 'b'] : undefined, pixels: customPx > 0 ? customPx : undefined }
                : { ...mode, id: mode.id || 'lib' + uid(), name: model.model + ' · ' + mode.name };
            const allCh = (profile.ch || []).concat(profile.px || [], profile.ch2 || []);
            const hasCct = allCh.includes('cct');
            const foot = footprint(profile);

            useEffect(() => { setAddr(nextFreeAddr(fixtures, universe)); }, [universe]);
            useEffect(() => { setMi(0); setMo(0); }, [bi]);
            useEffect(() => { setMo(0); }, [mi]);
            useEffect(() => {
                if (!custom && model.cct) { setCctMin(model.cct[0]); setCctMax(model.cct[1]); }
            }, [bi, mi, custom]);

            const submit = () => {
                if (foot === 0) { alert('У профиля нет ни одного канала'); return; }
                const n = clamp(parseInt(count) || 1, 1, 64);
                const a0 = clamp(parseInt(addr) || 1, 1, 512);
                const base = (name || (custom ? profile.name : model.model)).trim();
                const list = [];
                for (let i = 0; i < n; i++) {
                    const a = a0 + i * foot;
                    if (a + foot - 1 > 512) break;
                    list.push({
                        id: uid() + i, name: n > 1 ? base + ' ' + (i + 1) : base,
                        universe, addr: a,
                        profile: JSON.parse(JSON.stringify(profile)),
                        cctMin: parseInt(cctMin) || 2700, cctMax: parseInt(cctMax) || 6500,
                        x: 0.1 + 0.8 * ((i + 0.5) / n), y: 0.5, rot: 0,
                        len: profile.pixels ? 0.5 : 0.14
                    });
                }
                if (list.length === 0) { alert('Не хватает адресов в юниверсе (максимум 512 каналов)'); return; }
                onAdd(list, custom ? JSON.parse(JSON.stringify(profile)) : null);
            };

            return (
                <Modal title="Добавить прибор" onClose={onClose}>
                    <div className="space-y-3">
                        <div className="flex gap-1">
                            <button onClick={() => setCustom(false)}
                                    className={"flex-1 py-2 rounded-lg text-xs font-bold " + (!custom ? 'bg-[var(--accent)] text-white' : 'bg-[var(--panel-2)] text-zinc-400')}>Из библиотеки</button>
                            <button onClick={() => setCustom(true)}
                                    className={"flex-1 py-2 rounded-lg text-xs font-bold " + (custom ? 'bg-[var(--accent)] text-white' : 'bg-[var(--panel-2)] text-zinc-400')}>Свой профиль</button>
                            <button onClick={() => fileRef.current.click()}
                                    title="Файл прибора GDTF с сайта производителя"
                                    className="px-3 py-2 rounded-lg text-xs font-bold bg-[var(--panel-2)] text-zinc-400 border border-dashed border-[var(--border)]">
                                Файл GDTF
                            </button>
                            <input ref={fileRef} type="file" accept=".gdtf" multiple className="hidden"
                                   onChange={async e => {
                                       const files = Array.from(e.target.files || []);
                                       for (const f of files) await importGdtf(f);
                                       e.target.value = '';
                                   }} />
                        </div>
                        {!custom && (
                            <React.Fragment>
                                <div>
                                    <label className="text-[11px] font-bold text-zinc-500">Поиск по библиотеке</label>
                                    <input className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1"
                                           placeholder="например: arri sky, astera titan, aputure"
                                           value={query} onChange={e => setQuery(e.target.value)} />
                                    {found && (
                                        <div className="mt-1.5 max-h-44 overflow-y-auto rounded-lg border border-[var(--border)]">
                                            {found.length === 0 && <div className="px-3 py-2 text-[11px] text-zinc-500">Ничего не нашлось</div>}
                                            {found.map((r, i) => (
                                                <button key={i} onClick={() => { setBi(r.b); setMi(r.m); setMo(0); setQuery(''); }}
                                                        className="w-full text-left px-3 py-2 text-xs border-b border-[var(--border)] last:border-0 hover:bg-white/5">
                                                    {r.label}
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                </div>
                                <div>
                                    <label className="text-[11px] font-bold text-zinc-500">Производитель</label>
                                    <select className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1" value={bi} onChange={e => setBi(parseInt(e.target.value))}>
                                        {lib.map((b, i) => <option key={b.brand + i} value={i}>{b.brand} ({b.models.length})</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="text-[11px] font-bold text-zinc-500">Модель</label>
                                    <select className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1" value={mi} onChange={e => setMi(parseInt(e.target.value))}>
                                        {brand.models.map((m, i) => <option key={m.model} value={i}>{m.model}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="text-[11px] font-bold text-zinc-500">Режим DMX</label>
                                    <select className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1" value={mo} onChange={e => setMo(parseInt(e.target.value))}>
                                        {model.modes.map((m, i) => <option key={i} value={i}>{m.name}</option>)}
                                    </select>
                                    <div className="text-[10px] text-zinc-500 mt-1 leading-relaxed">
                                        В меню самого прибора выберите режим с тем же числом каналов — у разных
                                        производителей они называются по-своему. Если картинка на площадке не совпала,
                                        поменяйте режим здесь или соберите свой профиль.
                                    </div>
                                </div>
                            </React.Fragment>
                        )}
                        {custom && (
                            <div className="rounded-xl border border-[var(--border)] p-3 space-y-2">
                                <input className="glass-input rounded-lg px-3 py-2 text-sm w-full" placeholder="Название профиля"
                                       value={customName} onChange={e => setCustomName(e.target.value)} />
                                <div className="flex items-center gap-2">
                                    <span className="text-[11px] text-zinc-500 flex-1">Пикселей RGB после общих каналов</span>
                                    <input type="number" min="0" max="170" className="glass-input rounded-lg px-2 py-1.5 text-xs w-20 font-mono"
                                           value={customPx} onChange={e => setCustomPx(clamp(parseInt(e.target.value) || 0, 0, 170))} />
                                </div>
                                {customCh.map((role, i) => (
                                    <div key={i} className="flex items-center gap-2">
                                        <span className="text-[11px] font-mono text-zinc-500 w-14">Кан. {i + 1}</span>
                                        <select className="glass-input rounded-lg px-2 py-1.5 text-xs flex-1" value={role}
                                                onChange={e => setCustomCh(ch => ch.map((r, j) => j === i ? e.target.value : r))}>
                                            {Object.entries(ROLES).map(([id, n]) => <option key={id} value={id}>{n}</option>)}
                                        </select>
                                        <button onClick={() => setCustomCh(ch => ch.filter((_, j) => j !== i))}
                                                className="p-1.5 text-zinc-500 hover:text-red-400"><Icons.X /></button>
                                    </div>
                                ))}
                                <button onClick={() => setCustomCh(ch => [...ch, 'none'])}
                                        className="w-full py-2 rounded-lg border border-dashed border-[var(--border)] text-xs text-zinc-400">+ канал</button>
                            </div>
                        )}
                        <div>
                            <label className="text-[11px] font-bold text-zinc-500">Название</label>
                            <input className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1" placeholder={custom ? profile.name : model.model}
                                   value={name} onChange={e => setName(e.target.value)} />
                        </div>
                        <div className="grid grid-cols-3 gap-2">
                            <div>
                                <label className="text-[11px] font-bold text-zinc-500">Кол-во</label>
                                <input type="number" min="1" max="64" className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1"
                                       value={count} onChange={e => setCount(e.target.value)} />
                            </div>
                            <div>
                                <label className="text-[11px] font-bold text-zinc-500">Юниверс</label>
                                <select className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1" value={universe}
                                        onChange={e => setUniverse(parseInt(e.target.value))}>
                                    {[1, 2, 3, 4].map(u => <option key={u} value={u}>{u}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="text-[11px] font-bold text-zinc-500">Адрес</label>
                                <input type="number" min="1" max="512" className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1 font-mono"
                                       value={addr} onChange={e => setAddr(e.target.value)} />
                            </div>
                        </div>
                        {hasCct && (
                            <div className="grid grid-cols-2 gap-2">
                                <div>
                                    <label className="text-[11px] font-bold text-zinc-500">CCT мин, K</label>
                                    <input type="number" className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1 font-mono"
                                           value={cctMin} onChange={e => setCctMin(e.target.value)} />
                                </div>
                                <div>
                                    <label className="text-[11px] font-bold text-zinc-500">CCT макс, K</label>
                                    <input type="number" className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1 font-mono"
                                           value={cctMax} onChange={e => setCctMax(e.target.value)} />
                                </div>
                            </div>
                        )}
                        <div className="text-[11px] text-zinc-500">
                            Займёт каналов: {foot} на прибор{profile.pixels ? ' · пикселей: ' + profile.pixels : ''}.
                            {count > 1 ? ' Адреса: ' + addr + '–' + (clamp(parseInt(addr) || 1, 1, 512) + foot * clamp(parseInt(count) || 1, 1, 64) - 1) + '.' : ''}
                        </div>
                        <button onClick={submit} className="w-full py-3 rounded-xl bg-[var(--accent)] text-white text-sm font-bold">Добавить</button>
                    </div>
                </Modal>
            );
        }

        /* ═══════════ правка прибора ═══════════ */
        function EditFixtureModal({ fixture, onSave, onDelete, onClose }) {
            if (!fixture) return null;
            const [name, setName] = useState(fixture.name);
            const [universe, setUniverse] = useState(fixture.universe);
            const [addr, setAddr] = useState(fixture.addr);
            const [cctMin, setCctMin] = useState(fixture.cctMin || 2700);
            const [cctMax, setCctMax] = useState(fixture.cctMax || 6500);
            const [rot, setRot] = useState(fixture.rot || 0);
            const [len, setLen] = useState(fixture.len === undefined ? 0.14 : fixture.len);
            const prof = fixture.profile;
            const hasCct = (prof.ch || []).concat(prof.px || [], prof.ch2 || []).includes('cct');
            const isPx = !!prof.pixels;
            return (
                <Modal title="Прибор" onClose={onClose}>
                    <div className="space-y-3">
                        <div>
                            <label className="text-[11px] font-bold text-zinc-500">Название</label>
                            <input className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1" value={name} onChange={e => setName(e.target.value)} />
                        </div>
                        <div className="text-[11px] text-zinc-500">
                            {prof.name} · каналов: {footprint(prof)}{isPx ? ' · пикселей: ' + prof.pixels : ''}
                        </div>
                        <div className="rounded-xl border border-[var(--border)] p-3 space-y-2">
                            <div className="text-[10px] font-bold uppercase tracking-wider text-zinc-500">Место на плане</div>
                            <HSlider label="Поворот" frac={rot / 360} text={Math.round(rot) + '°'} onFrac={v => setRot(v * 360)}
                                     gradient="linear-gradient(to right,#1c1b1a,#78716c)" />
                            {isPx && (
                                <HSlider label="Длина" frac={clamp(len, 0, 1)} text={Math.round(len * 100) + '%'} onFrac={setLen}
                                         gradient="linear-gradient(to right,#1c1b1a,#78716c)" />
                            )}
                            <div className="text-[10px] text-zinc-500 leading-relaxed">
                                {isPx ? 'Поворот и длина задают, как трубка лежит на плане — по этой линии и побегут пиксели.'
                                      : 'Поворот пригодится, когда по прибору идёт эффект. Само место задаётся перетаскиванием на странице «План».'}
                            </div>
                        </div>
                        <div className="grid grid-cols-2 gap-2">
                            <div>
                                <label className="text-[11px] font-bold text-zinc-500">Юниверс</label>
                                <select className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1" value={universe}
                                        onChange={e => setUniverse(parseInt(e.target.value))}>
                                    {[1, 2, 3, 4].map(u => <option key={u} value={u}>{u}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="text-[11px] font-bold text-zinc-500">Адрес</label>
                                <input type="number" min="1" max="512" className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1 font-mono"
                                       value={addr} onChange={e => setAddr(e.target.value)} />
                            </div>
                        </div>
                        {hasCct && (
                            <div className="grid grid-cols-2 gap-2">
                                <div>
                                    <label className="text-[11px] font-bold text-zinc-500">CCT мин, K</label>
                                    <input type="number" className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1 font-mono"
                                           value={cctMin} onChange={e => setCctMin(e.target.value)} />
                                </div>
                                <div>
                                    <label className="text-[11px] font-bold text-zinc-500">CCT макс, K</label>
                                    <input type="number" className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1 font-mono"
                                           value={cctMax} onChange={e => setCctMax(e.target.value)} />
                                </div>
                            </div>
                        )}
                        <div className="flex gap-2 pt-1">
                            <button onClick={() => onSave({
                                        name: name.trim() || fixture.name,
                                        universe,
                                        addr: clamp(parseInt(addr) || 1, 1, 512),
                                        cctMin: parseInt(cctMin) || 2700,
                                        cctMax: parseInt(cctMax) || 6500,
                                        rot, len
                                    })}
                                    className="flex-1 py-3 rounded-xl bg-[var(--accent)] text-white text-sm font-bold">Сохранить</button>
                            <button onClick={() => { if (window.confirm('Удалить прибор «' + fixture.name + '»?')) onDelete(); }}
                                    className="px-4 py-3 rounded-xl border border-red-900 text-red-400 text-sm font-bold">Удалить</button>
                        </div>
                    </div>
                </Modal>
            );
        }

        /* ═══════════ меню группы ═══════════ */
        function GroupMenuModal({ group, selCount, onRename, onAddTo, onReplace, onDelete, onClose }) {
            const [name, setName] = useState(group.name);
            return (
                <Modal title="Группа" onClose={onClose}>
                    <div className="space-y-3">
                        <div>
                            <label className="text-[11px] font-bold text-zinc-500">Название</label>
                            <input className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1" value={name} onChange={e => setName(e.target.value)} />
                        </div>
                        <div className="text-[11px] text-zinc-500">Приборов в группе: {group.ids.length}</div>
                        <div className="grid grid-cols-2 gap-2">
                            <button onClick={onAddTo} className="py-2.5 rounded-lg border border-[var(--border)] text-zinc-300 text-xs font-bold">Добавить к выбору</button>
                            <button disabled={selCount === 0} onClick={onReplace}
                                    className="py-2.5 rounded-lg border border-[var(--border)] text-zinc-300 text-xs font-bold disabled:opacity-35">
                                Перезаписать выбором ({selCount})
                            </button>
                        </div>
                        <div className="flex gap-2 pt-1">
                            <button onClick={() => onRename(name.trim() || group.name)}
                                    className="flex-1 py-3 rounded-xl bg-[var(--accent)] text-white text-sm font-bold">Сохранить</button>
                            <button onClick={() => { if (window.confirm('Удалить группу «' + group.name + '»?')) onDelete(); }}
                                    className="px-4 py-3 rounded-xl border border-red-900 text-red-400 text-sm font-bold">Удалить</button>
                        </div>
                    </div>
                </Modal>
            );
        }

        /* ═══════════ меню палитры ═══════════ */
        function PaletteMenuModal({ pal, selCount, usedIn, onRename, onUpdate, onDelete, onClose }) {
            const [name, setName] = useState(pal.name);
            return (
                <Modal title={pal.kind === 'color' ? 'Палитра цвета' : 'Палитра позиции'} onClose={onClose}>
                    <div className="space-y-3">
                        <div className="flex items-center gap-2">
                            <span className="w-8 h-8 rounded-lg border border-black/40 shrink-0" style={{ background: pal.tint }}></span>
                            <input className="glass-input rounded-lg px-3 py-2.5 text-sm flex-1" value={name} onChange={e => setName(e.target.value)} />
                        </div>
                        <div className="text-[11px] text-zinc-500 leading-relaxed">
                            {usedIn.length
                                ? 'Стоит в сценах: ' + usedIn.join(', ') + '. Обновите палитру — эти сцены поедут за ней.'
                                : 'Пока не используется ни в одной сцене.'}
                        </div>
                        <button disabled={selCount === 0} onClick={onUpdate}
                                className="w-full py-2.5 rounded-lg border border-[var(--border)] text-zinc-300 text-xs font-bold disabled:opacity-35">
                            Запомнить заново с выбранного прибора
                        </button>
                        <div className="flex gap-2 pt-1">
                            <button onClick={() => onRename(name.trim() || pal.name)}
                                    className="flex-1 py-3 rounded-xl bg-[var(--accent)] text-white text-sm font-bold">Сохранить</button>
                            <button onClick={() => { if (window.confirm('Удалить палитру «' + pal.name + '»?')) onDelete(); }}
                                    className="px-4 py-3 rounded-xl border border-red-900 text-red-400 text-sm font-bold">Удалить</button>
                        </div>
                    </div>
                </Modal>
            );
        }

        /* ═══════════ список сцен ═══════════ */
        function CuelistModal({ cl, playbacks, onSave, onDelete, onClose }) {
            const [name, setName] = useState(cl.name);
            const [steps, setSteps] = useState(cl.steps || []);
            const free = playbacks.map((pb, i) => pb ? i : -1).filter(i => i >= 0);
            const move = (i, d) => setSteps(s => {
                const j = i + d; if (j < 0 || j >= s.length) return s;
                const n = [...s]; const t = n[i]; n[i] = n[j]; n[j] = t; return n;
            });
            return (
                <Modal title="Список сцен" onClose={onClose} wide>
                    <div className="space-y-3">
                        <div>
                            <label className="text-[11px] font-bold text-zinc-500">Название</label>
                            <input className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1" value={name} onChange={e => setName(e.target.value)} />
                        </div>
                        <div className="text-[11px] text-zinc-500 leading-relaxed">
                            Шаги идут сверху вниз. «Держать» пусто — переход только по тапу на список;
                            если задать секунды, следующий шаг включится сам. Время перехода берётся
                            из самой сцены (её фейды).
                        </div>
                        <div className="space-y-1.5">
                            {steps.map((st, i) => {
                                const pb = playbacks[st.slot];
                                return (
                                    <div key={i} className="flex items-center gap-2 px-2 py-2 rounded-lg border border-[var(--border)] bg-[var(--panel-2)]">
                                        <span className="text-[11px] font-mono text-zinc-500 w-5">{i + 1}</span>
                                        <select className="glass-input rounded-lg px-2 py-1.5 text-xs flex-1 min-w-0" value={st.slot}
                                                onChange={e => setSteps(s => s.map((x, j) => j === i ? { ...x, slot: parseInt(e.target.value) } : x))}>
                                            {free.map(i2 => <option key={i2} value={i2}>{playbacks[i2].name}</option>)}
                                        </select>
                                        <input className="glass-input rounded-lg px-2 py-1.5 text-xs w-24 font-mono" placeholder="держать, с"
                                               value={st.hold === null || st.hold === undefined ? '' : st.hold}
                                               onChange={e => {
                                                   const v = e.target.value.trim();
                                                   const h = v === '' ? null : clamp(parseFloat(v.replace(',', '.')) || 0, 0, 600);
                                                   setSteps(s => s.map((x, j) => j === i ? { ...x, hold: h } : x));
                                               }} />
                                        <button onClick={() => move(i, -1)} className="px-1.5 text-zinc-500 text-sm">↑</button>
                                        <button onClick={() => move(i, 1)} className="px-1.5 text-zinc-500 text-sm">↓</button>
                                        <button onClick={() => setSteps(s => s.filter((_, j) => j !== i))} className="p-1 text-zinc-500 hover:text-red-400"><Icons.X /></button>
                                    </div>
                                );
                            })}
                            {steps.length === 0 && <div className="text-[11px] text-zinc-500 py-2">Шагов пока нет.</div>}
                        </div>
                        {free.length > 0 && (
                            <button onClick={() => setSteps(s => [...s, { slot: free[0], hold: null }])}
                                    className="w-full py-2 rounded-lg border border-dashed border-[var(--border)] text-xs text-zinc-400">+ шаг</button>
                        )}
                        <div className="flex gap-2 pt-1">
                            <button onClick={() => onSave({ name: name.trim() || cl.name, steps })}
                                    className="flex-1 py-3 rounded-xl bg-[var(--accent)] text-white text-sm font-bold">Сохранить</button>
                            <button onClick={() => { if (window.confirm('Удалить список «' + cl.name + '»?')) onDelete(); }}
                                    className="px-4 py-3 rounded-xl border border-red-900 text-red-400 text-sm font-bold">Удалить</button>
                        </div>
                    </div>
                </Modal>
            );
        }

        /* ═══════════ меню сцены ═══════════ */
        function PlaybackMenuModal({ pb, onSave, onRerecord, onDelete, onClose }) {
            const [name, setName] = useState(pb.name);
            const [fade, setFade] = useState(pb.fade);
            const [split, setSplit] = useState(pb.fadeC !== undefined || pb.fadeP !== undefined);
            const [fadeC, setFadeC] = useState(pb.fadeC === undefined ? pb.fade : pb.fadeC);
            const [fadeP, setFadeP] = useState(pb.fadeP === undefined ? pb.fade : pb.fadeP);
            return (
                <Modal title="Сцена" onClose={onClose}>
                    <div className="space-y-3">
                        <div>
                            <label className="text-[11px] font-bold text-zinc-500">Название</label>
                            <input className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1" value={name} onChange={e => setName(e.target.value)} />
                        </div>
                        <div>
                            <label className="text-[11px] font-bold text-zinc-500">{split ? 'Яркость — время, с' : 'Время фейда, секунды'}</label>
                            <input type="number" min="0" max="120" step="0.5" className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1 font-mono"
                                   value={fade} onChange={e => setFade(e.target.value)} />
                        </div>
                        <button onClick={() => setSplit(s => !s)}
                                className={"w-full py-2 rounded-lg border text-[11px] font-bold " +
                                  (split ? 'border-[var(--accent)] text-[var(--accent)]' : 'border-[var(--border)] text-zinc-400')}>
                            {split ? 'Одно время на всё' : 'Разное время для цвета и движения'}
                        </button>
                        {split && (
                            <div className="grid grid-cols-2 gap-2">
                                <div>
                                    <label className="text-[11px] font-bold text-zinc-500">Цвет, с</label>
                                    <input type="number" min="0" max="120" step="0.5" className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1 font-mono"
                                           value={fadeC} onChange={e => setFadeC(e.target.value)} />
                                </div>
                                <div>
                                    <label className="text-[11px] font-bold text-zinc-500">Движение, с</label>
                                    <input type="number" min="0" max="120" step="0.5" className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1 font-mono"
                                           value={fadeP} onChange={e => setFadeP(e.target.value)} />
                                </div>
                            </div>
                        )}
                        <div className="flex gap-2 pt-1">
                            <button onClick={() => onSave({
                                        name: name.trim() || pb.name,
                                        fade: clamp(parseFloat(fade) || 0, 0, 120),
                                        fadeC: split ? clamp(parseFloat(fadeC) || 0, 0, 120) : undefined,
                                        fadeP: split ? clamp(parseFloat(fadeP) || 0, 0, 120) : undefined
                                    })}
                                    className="flex-1 py-3 rounded-xl bg-[var(--accent)] text-white text-sm font-bold">Сохранить</button>
                            <button onClick={() => { if (window.confirm('Перезаписать сцену текущей картинкой света?')) onRerecord(); }}
                                    className="px-3 py-3 rounded-xl border border-[var(--border)] text-zinc-300 text-sm font-bold">Перезаписать</button>
                            <button onClick={() => { if (window.confirm('Удалить сцену «' + pb.name + '»?')) onDelete(); }}
                                    className="px-3 py-3 rounded-xl border border-red-900 text-red-400 text-sm font-bold">Удалить</button>
                        </div>
                    </div>
                </Modal>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
