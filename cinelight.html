        const { useState, useEffect, useRef, useMemo } = React;

        /* ═══════════ утилиты ═══════════ */
        const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
        const lerp = (a, b, t) => a + (b - a) * t;
        const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        const pct = v => Math.round(v * 100) + '%';

        function hsv2rgb(h, s, v) {
            h = ((h % 360) + 360) % 360;
            const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
            let r = 0, g = 0, b = 0;
            if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; }
            else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
            return [r + m, g + m, b + m];

        function rgb2hsv(r, g, b) {
            const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;

            const R = UNG(r), Gc = UNG(g), B = UNG(b);
            const X = R * 0.4124564 + Gc * 0.3575761 + B * 0.1804375;
            const Y = R * 0.2126729 + Gc * 0.7151522 + B * 0.0721750;
            const Z = R * 0.0193339 + Gc * 0.1191920 + B * 0.9503041;
            const s = X + Y + Z;
            if (s < 0.000001) return { x: 0.3127, y: 0.3290 };
            return { x: X / s, y: Y / s };
        }
        /* точка чёрного тела: куда попадает заданная температура на диаграмме */
        function kelvin2xy(k) {
            k = clamp(k, 1667, 25000);
            let x;
            if (k <= 4000) x = -0.2661239e9 / (k * k * k) - 0.2343589e6 / (k * k) + 0.8776956e3 / k + 0.179910;
            else x = -3.0258469e9 / (k * k * k) + 2.1070379e6 / (k * k) + 0.2226347e3 / k + 0.240390;
            let y;
            if (k <= 2222) y = -1.1063814 * x * x * x - 1.34811020 * x * x + 2.18555832 * x - 0.20219683;
            else if (k <= 4000) y = -0.9549476 * x * x * x - 1.37418593 * x * x + 2.09137015 * x - 0.16748867;
            else y = 3.0817580 * x * x * x - 5.87338670 * x * x + 3.75112997 * x - 0.37001483;
            return { x, y };
        }

        /* ── шум для «живых» эффектов (огонь, мерцание) ── */
        function hash1(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }
        function noise1(t) {
            const i = Math.floor(t), f = t - i;
            const u = f * f * (3 - 2 * f);
            return lerp(hash1(i), hash1(i + 1), u);
        }

        /* ═══════════ чтение файлов GDTF ═══════════
           GDTF — открытый паспорт прибора от самого производителя. Внутри это zip
           с файлом description.xml. Распаковываем силами самого браузера
           (DecompressionStream), без сторонних библиотек. */
        async function unzipFind(buf, wanted) {
            const dv = new DataView(buf);
            // ищем «конец каталога» с хвоста файла
            let eocd = -1;
            for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 66000); i--) {
                if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
            }
            if (eocd < 0) throw new Error('это не zip-архив');
            const count = dv.getUint16(eocd + 10, true);
            let p = dv.getUint32(eocd + 16, true);
            for (let i = 0; i < count; i++) {
                if (dv.getUint32(p, true) !== 0x02014b50) break;
                const method = dv.getUint16(p + 10, true);
                const compSize = dv.getUint32(p + 20, true);
                const nameLen = dv.getUint16(p + 28, true);
                const extraLen = dv.getUint16(p + 30, true);
                const commentLen = dv.getUint16(p + 32, true);
                const localOff = dv.getUint32(p + 42, true);
                const name = new TextDecoder().decode(new Uint8Array(buf, p + 46, nameLen));
                if (name.toLowerCase() === wanted.toLowerCase()) {
                    const lNameLen = dv.getUint16(localOff + 26, true);
                    const lExtraLen = dv.getUint16(localOff + 28, true);
                    const dataOff = localOff + 30 + lNameLen + lExtraLen;
                    const raw = new Uint8Array(buf, dataOff, compSize);
                    if (method === 0) return new TextDecoder().decode(raw);
                    if (method !== 8) throw new Error('неизвестное сжатие в архиве');
                    if (typeof DecompressionStream === 'undefined') throw new Error('браузер не умеет распаковывать — обновите его');
                    const ds = new DecompressionStream('deflate-raw');
                    const stream = new Blob([raw]).stream().pipeThrough(ds);
                    return await new Response(stream).text();
                }
                p += 46 + nameLen + extraLen + commentLen;
            }
            throw new Error('в файле нет description.xml');
        }

        /* Атрибут GDTF → наша роль канала */
        const GDTF_ROLE = {
            dimmer: 'dim', red: 'r', green: 'g', blue: 'b', white: 'w', amber: 'a', uv: 'uv',
            cyan: 'none', magenta: 'none', yellow: 'none', lime: 'g', warmwhite: 'w', coolwhite: 'w',
            colortemperature: 'cct', cto: 'cct', ctb: 'cct', ctc: 'cct',
            huerotation: 'hue', hue: 'hue', saturation: 'sat',
            greenmagenta: 'gm', tint: 'gm', plusgreen: 'gm',
            pan: 'pan', tilt: 'tilt', zoom: 'zoom', focus: 'focus',
            shutter: 'strobe', strobe: 'strobe'
        };
        function gdtfRole(attr) {
            if (!attr) return 'none';
            let a = String(attr).toLowerCase().replace(/[_\-\s]/g, '');
            a = a.replace(/\(.*\)/, '');
            if (GDTF_ROLE[a]) return GDTF_ROLE[a];
            // ColorAdd_R, ColorRGB_Red и подобные
            if (/^coloradd r$|^coloraddr$|^colorrgbred$/.test(a)) return 'r';
            if (/^coloraddg$|^colorrgbgreen$/.test(a)) return 'g';
            if (/^coloraddb$|^colorrgbblue$/.test(a)) return 'b';
            if (/^coloraddw$|^colorrgbwhite$/.test(a)) return 'w';
            if (/^coloradda$/.test(a)) return 'a';
            if (/^coloraddc$/.test(a)) return 'cct';
            if (/dimmer/.test(a)) return 'dim';
            if (/colortemp|^ct[obc]?$/.test(a)) return 'cct';
            if (/^pan$/.test(a)) return 'pan';
            if (/^tilt$/.test(a)) return 'tilt';
            if (/shutter|strobe/.test(a)) return 'strobe';
            return 'none';
        }

        /* description.xml → список моделей с режимами в нашем формате */
        function parseGdtf(xmlText) {
            const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
            if (doc.querySelector('parsererror')) throw new Error('повреждённый XML внутри файла');
            const ft = doc.querySelector('FixtureType');
            if (!ft) throw new Error('это не похоже на файл прибора GDTF');
            const brand = ft.getAttribute('Manufacturer') || 'GDTF';
            const model = ft.getAttribute('LongName') || ft.getAttribute('Name') || 'Прибор';
            const modes = [];
            ft.querySelectorAll('DMXModes > DMXMode').forEach(dm => {
                const slots = [];   // offset (1-based) → роль
                let maxOff = 0;
                dm.querySelectorAll('DMXChannels > DMXChannel').forEach(dc => {
                    const offs = (dc.getAttribute('Offset') || '').split(',')
                        .map(x => parseInt(x, 10)).filter(x => !isNaN(x));
                    if (offs.length === 0) return;
                    const lc = dc.querySelector('LogicalChannel');
                    const attr = lc ? (lc.getAttribute('Attribute') || '') : '';
                    const role = gdtfRole(attr);
                    offs.forEach((o, i) => {
                        maxOff = Math.max(maxOff, o);
                        let r = 'none';
                        if (i === 0) r = role;
                        else if (i === 1) r = ({ dim: 'dimF', pan: 'panF', tilt: 'tiltF', hue: 'hueF' })[role] || 'none';
                        slots[o] = r;
                    });
                });
                if (maxOff < 1 || maxOff > 512) return;
                const ch = [];
                for (let i = 1; i <= maxOff; i++) ch.push(slots[i] || 'none');
                if (ch.every(r => r === 'none')) return;
                modes.push({ name: (dm.getAttribute('Name') || 'Режим') + ' (' + maxOff + ' кан.)', ch });
            });
            if (modes.length === 0) throw new Error('в файле не нашлось пригодных DMX-режимов');
            return { brand, model, modes };
        }

        const FX_TYPES = [
            { id: 'rainbow',  name: 'Радуга',    hint: 'Цвета плывут по плану' },
            { id: 'wave',     name: 'Волна',     hint: 'Плавная волна яркости' },

            { id: 'strobe',   name: 'Строб',     hint: 'Резкие вспышки' }
        ];
        const FX_MODES = { color: 'Только цвет', intensity: 'Только яркость', both: 'Цвет и яркость' };
        const DEF_FX = { type: 'rainbow', on: true, level: 1, speed: 0.25, size: 1, angle: 0,
                         mode: 'both', colorA: [1, 0.15, 0], colorB: [0, 0.3, 1], targets: [] };

        function fxSample(fx, u, t, seed) {
            const sp = fx.speed, sz = Math.max(0.02, fx.size);
            const frac = v => ((v % 1) + 1) % 1;
            switch (fx.type) {
                case 'rainbow':
                    return { rgb: hsv2rgb(frac(u / sz + t * sp) * 360, 1, 1), i: 1 };
                case 'wave':
                    return { rgb: fx.colorA, i: 0.5 + 0.5 * Math.sin(2 * Math.PI * (u / sz - t * sp)) };
                case 'chase': {
                    const pos = frac(t * sp);
                    let d = Math.abs(frac(u / sz) - pos);
                    d = Math.min(d, 1 - d);
                    const v = clamp(1 - d / 0.18, 0, 1);
                    return { rgb: fx.colorA, i: v * v };
                }
                case 'pulse':
                    return { rgb: fx.colorA, i: 0.5 + 0.5 * Math.sin(2 * Math.PI * t * sp) };
                case 'sparkle': {
                    const n = noise1(t * sp * 6 + seed * 17.3);
                    return { rgb: fx.colorA, i: clamp(Math.pow(clamp(n, 0, 1), 5) * 3.5, 0, 1) };
                }
                case 'fire': {
                    const n = noise1(t * sp * 4 + u * 5 / sz + seed * 3.1);
                    const n2 = noise1(t * sp * 7 + seed * 9.7 + 40);
                    return { rgb: hsv2rgb(8 + n * 38, 1, 1), i: clamp(0.3 + n2 * 0.8, 0, 1) };
                }
                case 'gradient': {
                    const k = 0.5 - 0.5 * Math.cos(2 * Math.PI * frac(u / sz + t * sp));
                    return { rgb: [lerp(fx.colorA[0], fx.colorB[0], k), lerp(fx.colorA[1], fx.colorB[1], k), lerp(fx.colorA[2], fx.colorB[2], k)], i: 1 };
                }
                case 'strobe':
                    return { rgb: fx.colorA, i: frac(t * sp * 4) < 0.25 ? 1 : 0 };
            }
            return { rgb: fx.colorA, i: 1 };
        }

        /* положение пикселя i прибора f на плане (0..1) */
        function pixelPos(f, i, count) {
            const x0 = f.x === undefined ? 0.5 : f.x;
            const y0 = f.y === undefined ? 0.5 : f.y;
            if (count <= 1) return [x0, y0];
            const rot = (f.rot || 0) * Math.PI / 180;
            const len = f.len === undefined ? 0.14 : f.len;
            const off = (i / (count - 1) - 0.5) * len;
            return [x0 + Math.cos(rot) * off, y0 + Math.sin(rot) * off];
        }

        function applyEffects(out, fxList, fixtures, t) {
            const active = fxList.filter(fx => fx.on && fx.level > 0.001);
            if (active.length === 0) return;
            fixtures.forEach((f, fi) => {
                const P = out[f.id];
                if (!P) return;
                const mine = active.filter(fx => !fx.targets || fx.targets.length === 0 || fx.targets.indexOf(f.id) >= 0);
                if (mine.length === 0) return;
                const prof = f.profile;
                const N = prof.pixels || 0;
                const count = Math.max(1, N);
                const cols = [];
                let sumI = 0;
                for (let i = 0; i < count; i++) {
                    const pos = pixelPos(f, i, count);
                    let cr = P.r, cg = P.g, cb = P.b, ci = 1;
                    mine.forEach(fx => {
                        const a = (fx.angle || 0) * Math.PI / 180;
                        const u = pos[0] * Math.cos(a) + pos[1] * Math.sin(a);
                        const s = fxSample(fx, u, t, fi * 37 + i);
                        const L = fx.level;
                        if (fx.mode !== 'intensity') {
                            cr = lerp(cr, s.rgb[0], L); cg = lerp(cg, s.rgb[1], L); cb = lerp(cb, s.rgb[2], L);
                        }
                        if (fx.mode !== 'color') ci *= lerp(1, s.i, L);
                    });
                    sumI += ci;
                    cols.push([cr, cg, cb, ci]);
                }
                const avgI = sumI / count;
                if (N > 0) {
                    // яркость запекаем в сами пиксели — общего диммера у таких приборов обычно нет
                    P.px = cols.map(c => [c[0] * c[3], c[1] * c[3], c[2] * c[3], P.w * c[3]]);
                    P.r = cols[0][0]; P.g = cols[0][1]; P.b = cols[0][2];
                    let ar = 0, ag = 0, ab = 0;
                    P.px.forEach(c => { ar += c[0]; ag += c[1]; ab += c[2]; });
                    P.rAvg = ar / count; P.gAvg = ag / count; P.bAvg = ab / count;
                } else {
                    P.r = cols[0][0]; P.g = cols[0][1]; P.b = cols[0][2];
                    if ((prof.ch || []).includes('dim')) P.dim *= avgI;
                    else { P.r *= avgI; P.g *= avgI; P.b *= avgI; P.w *= avgI; }
                }
            });
        }

        /* ═══════════ DMX-математика ═══════════ */
        function roleBytes(f, P, roles, colScale, idle) {
            const b255 = v => Math.round(clamp(v, 0, 1) * 255);
            const rest = i => (idle && idle[i] !== undefined) ? idle[i] : 0;
            const pan16 = Math.round(clamp(P.pan, 0, 1) * 65535);
            const tilt16 = Math.round(clamp(P.tilt, 0, 1) * 65535);
            const dim16 = Math.round(clamp(P.dim, 0, 1) * 65535);
            const hs = rgb2hsv(P.r, P.g, P.b);
            const hue16 = Math.round(clamp(hs.h / 360, 0, 1) * 65535);
            return roles.map((role, i) => {
                switch (role) {
                    case 'dim': return dim16 >> 8;
                    case 'dimF': return dim16 & 255;
                    case 'r': return b255(P.r * colScale);
                    case 'g': return b255(P.g * colScale);
                    case 'b': return b255(P.b * colScale);
                    case 'w': return b255(P.w * colScale);
                    case 'a': return b255(P.a * colScale);
                    case 'uv': return b255(P.uv * colScale);
                    case 'cct': {
                        const mn = f.cctMin || 2700, mx = f.cctMax || 6500;
                        return b255((P.cct - mn) / Math.max(1, mx - mn));
                    }
                    case 'gm': return b255((P.gm + 1) / 2);
                    case 'hue': return hue16 >> 8;
                    case 'hueF': return hue16 & 255;
                    case 'sat': return b255(hs.s);
                    case 'pan': return pan16 >> 8;
                    case 'panF': return pan16 & 255;
                    case 'tilt': return tilt16 >> 8;
                    case 'tiltF': return tilt16 & 255;
                    case 'zoom': return b255(P.zoom);
                    case 'focus': return b255(P.focus);
                    // строб в нуле = «шторка открыта»: у многих приборов это не 0, а свой байт
                    case 'strobe': return P.strobe < 0.004 ? rest(i) : b255(P.strobe);
                    default: return rest(i);
                }
            });
        }

        function paramsToBytes(f, P) {
            const prof = f.profile;
            const ch = prof.ch || [];
            // если у прибора нет отдельного диммера, яркость подмешиваем в цвет
            const colScale = ch.includes('dim') ? 1 : P.dim;
            const out = roleBytes(f, P, ch, colScale, prof.dv);
            if (prof.pixels && prof.px && prof.px.length) {
                // у пиксельных приборов общий диммер редко есть — гасим сами
                const pxScale = ch.includes('dim') ? 1 : P.dim;
                for (let i = 0; i < prof.pixels; i++) {
                    const c = P.px && P.px[i] ? P.px[i] : null;
                    const PP = c ? { ...P, r: c[0], g: c[1], b: c[2], w: c.length > 3 ? c[3] : P.w } : P;
                    const arr = roleBytes(f, PP, prof.px, pxScale);
                    for (let j = 0; j < arr.length; j++) out.push(arr[j]);
                }
            }
            if (prof.ch2 && prof.ch2.length) {
                const arr = roleBytes(f, P, prof.ch2, colScale, prof.dv2);
                for (let j = 0; j < arr.length; j++) out.push(arr[j]);
            }
            return out;
        }

        const EMPTY512 = new Uint8Array(512);
        /* пакет Art-Net ArtDMX: его понимают ноды, радиопередатчики и визуализаторы */
        function artDmxPacket(universe, data) {
            const p = new Uint8Array(18 + 512);
            const id = 'Art-Net';
            for (let i = 0; i < 7; i++) p[i] = id.charCodeAt(i);
            p[7] = 0;
            p[8] = 0x00; p[9] = 0x50;      // OpDmx (little-endian)
            p[10] = 0; p[11] = 14;         // версия протокола
            p[12] = 0;                     // sequence выключен
            p[13] = 0;                     // physical
            p[14] = universe & 0xFF; p[15] = (universe >> 8) & 0x7F;
            p[16] = 2; p[17] = 0;          // длина 512 (big-endian)
            p.set(data, 18);
            return p;
        }

        /* пакет sACN (E1.31) — второй сетевой стандарт, его понимает новое железо.
           Мост различает Art-Net и sACN по первым байтам и шлёт куда надо. */
        const SACN_CID = (() => {
            let s = null;
            try { s = localStorage.getItem('cl_cid'); } catch (e) {}
            if (!s || s.length !== 32) {
                s = '';
                for (let i = 0; i < 32; i++) s += Math.floor(Math.random() * 16).toString(16);
                try { localStorage.setItem('cl_cid', s); } catch (e) {}
            }
            const b = new Uint8Array(16);
            for (let i = 0; i < 16; i++) b[i] = parseInt(s.substr(i * 2, 2), 16);
            return b;
        })();
        const SACN_SEQ = {};
        function sacnPacket(universe, data, priority) {
            const p = new Uint8Array(638);
            const dv = new DataView(p.buffer);
            // корневой слой
            dv.setUint16(0, 0x0010);                 // размер преамбулы
            dv.setUint16(2, 0x0000);                 // постамбула
            const acn = 'ASC-E1.17';
            for (let i = 0; i < acn.length; i++) p[4 + i] = acn.charCodeAt(i);
            dv.setUint16(16, 0x7000 | (638 - 16));   // флаги + длина
            dv.setUint32(18, 0x00000004);            // вектор: E1.31
            p.set(SACN_CID, 22);
            // слой кадра
            dv.setUint16(38, 0x7000 | (638 - 38));
            dv.setUint32(40, 0x00000002);            // вектор: пакет DMX
            const name = 'CineLight';
            for (let i = 0; i < name.length; i++) p[44 + i] = name.charCodeAt(i);
            p[108] = priority === undefined ? 100 : clamp(priority, 0, 200);
            dv.setUint16(109, 0);                    // синхро-юниверс не используем
            SACN_SEQ[universe] = ((SACN_SEQ[universe] || 0) + 1) & 255;
            p[111] = SACN_SEQ[universe];
            p[112] = 0;                              // опции
            dv.setUint16(113, universe);
            // слой данных
            dv.setUint16(115, 0x7000 | (638 - 115));
            p[117] = 0x02;                           // вектор DMP
            p[118] = 0xa1;                           // тип адресации
            dv.setUint16(119, 0x0000);               // первый адрес
            dv.setUint16(121, 0x0001);               // шаг адреса
            dv.setUint16(123, 513);                  // 512 каналов + стартовый код
            p[125] = 0x00;                           // стартовый код DMX
            p.set(data, 126);
            return p;
        }

        function displayColor(f, P, mul) {
            const prof = f.profile;
            const ch = (prof.ch || []).concat(prof.px || [], prof.ch2 || []);
            let rgb;
            if (ch.includes('r') || ch.includes('g') || ch.includes('b')) {
                rgb = P.rAvg !== undefined ? [P.rAvg, P.gAvg, P.bAvg] : [P.r, P.g, P.b];
                if (ch.includes('w') && P.w > 0) rgb = [rgb[0] + P.w, rgb[1] + P.w * 0.95, rgb[2] + P.w * 0.85];
                if (ch.includes('a') && P.a > 0) rgb = [rgb[0] + P.a, rgb[1] + P.a * 0.55, rgb[2]];
                rgb = rgb.map(c => clamp(c, 0, 1));
            } else if (ch.includes('cct')) {
                rgb = applyTint(kelvin2rgb(P.cct), P.gm);
            } else {
                rgb = [1, 0.85, 0.66];
            }
            const i = clamp(P.dim * (mul === undefined ? 1 : mul), 0, 1);
            return rgb.map(c => Math.round(c * i * 255));
        }

        function findConflicts(fixtures) {
            const bad = new Set();
            for (let i = 0; i < fixtures.length; i++) for (let j = i + 1; j < fixtures.length; j++) {
                const a = fixtures[i], b = fixtures[j];
                if (a.universe !== b.universe) continue;
                const a2 = a.addr + footprint(a.profile) - 1, b2 = b.addr + footprint(b.profile) - 1;
                if (a.addr <= b2 && b.addr <= a2) { bad.add(a.id); bad.add(b.id); }
            }
            return bad;
        }
        function nextFreeAddr(fixtures, universe) {
            let mx = 0;
            fixtures.forEach(f => { if (f.universe === universe) mx = Math.max(mx, f.addr + footprint(f.profile) - 1); });
            return Math.min(512, mx + 1);
        }

        /* ═══════════ стартовый проект (демо) ═══════════ */
        function seedProject() {
            const prof = id => JSON.parse(JSON.stringify(PROFILES.find(p => p.id === id)));

            });
            const fixtures = [

                mk('Би-колор 1', 'cct2', 21, 0.3, 0.55), mk('Би-колор 2', 'cct2', 23, 0.7, 0.55),
                mk('Мувинг 1', 'mover10', 25, 0.25, 0.82), mk('Мувинг 2', 'mover10', 35, 0.75, 0.82)
            ];
            const tube = { id: uid() + 'tube', name: 'Трубка 16 пикс.', universe: 1, addr: 45,
                profile: { id: 'seedpx', name: 'Пиксели: 16×RGB (48 кан.)', ch: [], px: ['r', 'g', 'b'], pixels: 16 },
                cctMin: 2700, cctMax: 6500, x: 0.5, y: 0.42, rot: 0, len: 0.6 };
            fixtures.push(tube);
            const sceneAll = fn => { const s = {}; fixtures.forEach(f => { s[f.id] = { ...DEF_PARAMS, ...fn(f) }; }); return s; };
            const kelvinScene = (k, dim) => sceneAll(() => {
                const [r, g, b] = kelvin2rgb(k);
                return { dim, cct: k, r, g, b };
            });
            const playbacks = new Array(10).fill(null);
            playbacks[0] = { id: uid() + 'p0', name: 'Тёплый общий', fade: 2, scene: kelvinScene(3200, 0.8), tint: 'rgb(255,180,107)' };
            playbacks[1] = { id: uid() + 'p1', name: 'Дневной', fade: 2, scene: kelvinScene(5600, 0.8), tint: 'rgb(255,236,224)' };
            playbacks[2] = { id: uid() + 'p2', name: 'Синий фон', fade: 3, scene: sceneAll(() => ({ dim: 0.7, r: 0.05, g: 0.25, b: 1, cct: 6500 })), tint: 'rgb(30,70,255)' };
            return { fixtures, playbacks, customSwatches: [], customProfiles: [], settings: { serialUniverse: 1 } };
        }
        function loadProject() {
            try {
                const s = localStorage.getItem('cl_project_v1');
                if (s) { const p = JSON.parse(s); if (p && Array.isArray(p.fixtures)) return p; }
            } catch (e) {}
