        }

        /* ═══════════ иконки ═══════════ */
        const Icons = {
            Gear: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
            Plus: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            Pen: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>,
            X: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
            Zap: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>
        };

        /* ═══════════ энкодер (крутилка в стиле MagicQ) ═══════════ */
        function arcPath(cx, cy, r, a0, a1) {
            const rad = d => d * Math.PI / 180;
            const p0 = [cx + r * Math.cos(rad(a0)), cy + r * Math.sin(rad(a0))];
            const p1 = [cx + r * Math.cos(rad(a1)), cy + r * Math.sin(rad(a1))];
            const large = (a1 - a0) > 180 ? 1 : 0;
            return 'M ' + p0[0].toFixed(2) + ' ' + p0[1].toFixed(2) + ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + p1[0].toFixed(2) + ' ' + p1[1].toFixed(2);
        }

        function Encoder({ label, frac, text, onTurn, disabled }) {
            const ref = useRef(null);
            const drag = useRef(null);
            useEffect(() => {
                const el = ref.current;
                const wheel = e => { e.preventDefault(); if (!disabled) onTurn((e.deltaY < 0 ? 1 : -1) * 0.02); };
                el.addEventListener('wheel', wheel, { passive: false });
                return () => el.removeEventListener('wheel', wheel);
            });
            const down = e => {
                if (disabled) return;
                e.preventDefault();
                const rect = ref.current.getBoundingClientRect();
                const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
                drag.current = { cx, cy, a: Math.atan2(e.clientY - cy, e.clientX - cx) };
                ref.current.setPointerCapture(e.pointerId);
            };
            const move = e => {
                const d = drag.current; if (!d) return;
                const a = Math.atan2(e.clientY - d.cy, e.clientX - d.cx);
                let da = a - d.a;
                if (da > Math.PI) da -= 2 * Math.PI;
                if (da < -Math.PI) da += 2 * Math.PI;
                d.a = a;
                onTurn(da / (2 * Math.PI));
            };
            const up = () => { drag.current = null; };
            const v = clamp(frac, 0, 1);
            const angle = 135 + 270 * v;
            const rad = angle * Math.PI / 180;
            return (
                <div className="flex flex-col items-center gap-1">
                    <div ref={ref} onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up}
                         className={"touch-none cursor-grab active:cursor-grabbing " + (disabled ? 'opacity-35' : '')}
                         style={{ width: 84, height: 84 }}>
                        <svg width="84" height="84" viewBox="0 0 100 100">
                            <path d={arcPath(50, 50, 44, 135, 405)} stroke="#363430" strokeWidth="6" fill="none" strokeLinecap="round" />
                            {v > 0.002 && <path d={arcPath(50, 50, 44, 135, angle)} stroke="var(--accent)" strokeWidth="6" fill="none" strokeLinecap="round" />}
                            <circle cx="50" cy="50" r="33" fill="var(--panel-2)" stroke="var(--border)" strokeWidth="1.5" />
                            <line x1={50 + 20 * Math.cos(rad)} y1={50 + 20 * Math.sin(rad)}
                                  x2={50 + 30 * Math.cos(rad)} y2={50 + 30 * Math.sin(rad)}
                                  stroke="var(--accent)" strokeWidth="3.5" strokeLinecap="round" />
                            <text x="50" y="55" textAnchor="middle" fill="var(--text)" fontSize="14" fontFamily="JetBrains Mono, monospace" fontWeight="600">{text}</text>
                        </svg>
                    </div>
                    <div className="text-[10px] font-semibold uppercase tracking-wider text-zinc-400">{label}</div>
                </div>
            );
        }

        /* ═══════════ горизонтальный слайдер ═══════════ */
        function HSlider({ label, frac, text, onFrac, gradient, disabled }) {
            const ref = useRef(null);
            const dragging = useRef(false);
            const set = e => {
                const r = ref.current.getBoundingClientRect();
                onFrac(clamp((e.clientX - r.left) / r.width, 0, 1));
            };
            const down = e => { if (disabled) return; e.preventDefault(); dragging.current = true; ref.current.setPointerCapture(e.pointerId); set(e); };
            const move = e => { if (dragging.current) set(e); };
            const up = () => { dragging.current = false; };
            const v = clamp(frac, 0, 1);
            return (
                <div className={disabled ? 'opacity-35' : ''}>
                    <div ref={ref} onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up}
                         className="relative h-9 rounded-lg overflow-hidden touch-none cursor-pointer border border-[var(--border)]"
                         style={{ background: gradient }}>
                        <div className="absolute top-0 bottom-0 w-[3px] bg-white rounded-full shadow-[0_0_4px_rgba(0,0,0,0.8)]"
                             style={{ left: 'calc(' + (v * 100) + '% - 1.5px)' }}></div>
                        <div className="absolute left-2 top-1/2 -translate-y-1/2 text-[11px] font-bold" style={{ textShadow: '0 1px 3px rgba(0,0,0,0.9)' }}>{label}</div>
                        <div className="absolute right-2 top-1/2 -translate-y-1/2 text-[11px] font-mono font-semibold" style={{ textShadow: '0 1px 3px rgba(0,0,0,0.9)' }}>{text}</div>
                    </div>
                </div>
            );
        }

        /* ═══════════ цветовой круг ═══════════ */
        function ColorWheel({ size, hs, onPick, disabled }) {
            const ref = useRef(null);
            const dragging = useRef(false);
            useEffect(() => {
                const cvs = ref.current;
                const ctx = cvs.getContext('2d');
                const r = size / 2;
                const img = ctx.createImageData(size, size);
                for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
                    const dx = x - r, dy = y - r, d = Math.sqrt(dx * dx + dy * dy);
                    const i = (y * size + x) * 4;
                    if (d > r) { img.data[i + 3] = 0; continue; }
                    const h = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
                    const [rr, gg, bb] = hsv2rgb(h, clamp(d / r, 0, 1), 1);
                    img.data[i] = rr * 255; img.data[i + 1] = gg * 255; img.data[i + 2] = bb * 255;
                    img.data[i + 3] = Math.round(clamp((r - d) / 1.5, 0, 1) * 255);
                }
                ctx.putImageData(img, 0, 0);
            }, [size]);
            const pick = e => {
                const rect = ref.current.getBoundingClientRect();
                const r = rect.width / 2;
                const dx = e.clientX - rect.left - r, dy = e.clientY - rect.top - r;
                const h = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
                onPick(h, clamp(Math.sqrt(dx * dx + dy * dy) / r, 0, 1));
            };
            const down = e => { if (disabled) return; e.preventDefault(); dragging.current = true; e.currentTarget.setPointerCapture(e.pointerId); pick(e); };
            const move = e => { if (dragging.current) pick(e); };
            const up = () => { dragging.current = false; };
            const mr = size / 2;
            const mx = mr + Math.cos(hs.h * Math.PI / 180) * hs.s * (mr - 6);
            const my = mr + Math.sin(hs.h * Math.PI / 180) * hs.s * (mr - 6);
            return (
                <div onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up}
                     className={"relative mx-auto touch-none " + (disabled ? 'opacity-35' : '')}
                     style={{ width: size, height: size }}>
                    <canvas ref={ref} width={size} height={size} className="rounded-full" />
                    <div className="absolute w-5 h-5 rounded-full border-2 border-white shadow-[0_0_6px_rgba(0,0,0,0.7)] pointer-events-none"
                         style={{ left: mx - 10, top: my - 10, background: 'rgb(' + hsv2rgb(hs.h, hs.s, 1).map(c => Math.round(c * 255)).join(',') + ')' }}></div>
                </div>
            );
        }

        /* ═══════════ XY-пад (pan/tilt) ═══════════ */
        function XYPad({ x, y, onXY, disabled }) {
            const ref = useRef(null);
            const dragging = useRef(false);
            const set = e => {
                const r = ref.current.getBoundingClientRect();
                onXY(clamp((e.clientX - r.left) / r.width, 0, 1), clamp(1 - (e.clientY - r.top) / r.height, 0, 1));
            };
            const down = e => { if (disabled) return; e.preventDefault(); dragging.current = true; ref.current.setPointerCapture(e.pointerId); set(e); };
            const move = e => { if (dragging.current) set(e); };
            const up = () => { dragging.current = false; };
            return (
                <div ref={ref} onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up}
                     className={"relative w-full rounded-xl border border-[var(--border)] touch-none " + (disabled ? 'opacity-35' : '')}
                     style={{ height: 190, background: 'var(--panel-2)' }}>
                    <div className="absolute left-1/2 top-0 bottom-0 w-px bg-[var(--border)]"></div>
                    <div className="absolute top-1/2 left-0 right-0 h-px bg-[var(--border)]"></div>
                    <div className="absolute w-6 h-6 rounded-full border-2 border-[var(--accent)] bg-[rgba(217,119,87,0.25)] pointer-events-none"
                         style={{ left: 'calc(' + (x * 100) + '% - 12px)', top: 'calc(' + ((1 - y) * 100) + '% - 12px)' }}></div>
                    <div className="absolute left-2 bottom-1 text-[10px] text-zinc-500 font-semibold">PAN →</div>
                    <div className="absolute left-1 top-2 text-[10px] text-zinc-500 font-semibold" style={{ writingMode: 'vertical-rl' }}>← TILT</div>
                </div>
            );
        }

        /* ═══════════ план площадки ═══════════
           Приборы можно двигать пальцем; пиксельные рисуются линией по своей длине
           и повороту — именно по этим точкам считается пиксель-мэппинг. */
        function LayoutView({ fixtures, outRef, selected, mul, onTap, onMove, editing }) {
            const ref = useRef(null);
            const drag = useRef(null);
            const toLocal = e => {
                const r = ref.current.getBoundingClientRect();
                return [clamp((e.clientX - r.left) / r.width, 0, 1), clamp((e.clientY - r.top) / r.height, 0, 1)];
            };
            const down = (e, f) => {
                e.preventDefault(); e.stopPropagation();
                const p = toLocal(e);
                drag.current = { id: f.id, moved: false, dx: (f.x || 0.5) - p[0], dy: (f.y || 0.5) - p[1] };
                e.currentTarget.setPointerCapture(e.pointerId);
            };
            const move = e => {
                const d = drag.current; if (!d || !editing) return;
                const p = toLocal(e);
                d.moved = true;
                onMove(d.id, clamp(p[0] + d.dx, 0, 1), clamp(p[1] + d.dy, 0, 1));
            };
            const up = () => {
                const d = drag.current; drag.current = null;
                if (d && !d.moved) onTap(d.id);
            };
            return (
                <div ref={ref} className="relative w-full h-full rounded-xl border border-[var(--border)] overflow-hidden"
                     style={{ background: 'var(--panel-2)',
                              backgroundImage: 'linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px)',
                              backgroundSize: '10% 10%' }}>
                    {fixtures.map(f => {
                        const P = (outRef.current || {})[f.id] || DEF_PARAMS;
                        const N = f.profile.pixels || 0;
                        const sel = selected.has(f.id);
                        if (N > 0) {
                            const px = P.px || [];
                            return (
                                <div key={f.id} onPointerDown={e => down(e, f)} onPointerMove={move} onPointerUp={up} onPointerCancel={up}
                                     className="absolute touch-none cursor-pointer flex flex-col items-center"
                                     style={{ left: ((f.x === undefined ? 0.5 : f.x) * 100) + '%', top: ((f.y === undefined ? 0.5 : f.y) * 100) + '%',
                                              width: ((f.len === undefined ? 0.14 : f.len) * 100) + '%',
                                              transform: 'translate(-50%,-50%) rotate(' + (f.rot || 0) + 'deg)' }}>
                                    <div className={"w-full flex rounded-md overflow-hidden border " + (sel ? 'border-[var(--accent)]' : 'border-black/50')}
                                         style={{ height: 18 }}>
                                        {new Array(N).fill(0).map((_, i) => {
                                            const c = px[i] ? px[i].map(v => Math.round(clamp(v * mul, 0, 1) * 255)) : [20, 19, 18];
                                            return <div key={i} className="flex-1" style={{ background: 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')' }}></div>;
                                        })}
                                    </div>
                                    <div className="text-[9px] mt-0.5 px-1 rounded bg-black/50 whitespace-nowrap truncate max-w-full">{f.name}</div>
                                </div>
                            );
                        }
                        const c = displayColor(f, P, mul);
                        const bright = (c[0] + c[1] + c[2]) / 3;
                        return (
                            <div key={f.id} onPointerDown={e => down(e, f)} onPointerMove={move} onPointerUp={up} onPointerCancel={up}
                                 className="absolute touch-none cursor-pointer flex flex-col items-center"
                                 style={{ left: ((f.x === undefined ? 0.5 : f.x) * 100) + '%', top: ((f.y === undefined ? 0.5 : f.y) * 100) + '%',
                                          transform: 'translate(-50%,-50%)' }}>
                                <div className={"w-9 h-9 rounded-full border-2 " + (sel ? 'border-[var(--accent)]' : 'border-black/50')}
                                     style={{ background: 'rgb(' + c.join(',') + ')',
                                              boxShadow: bright > 30 ? '0 0 18px rgba(' + c.join(',') + ',0.7)' : 'none' }}></div>
                                <div className="text-[9px] mt-0.5 px-1 rounded bg-black/50 whitespace-nowrap max-w-[80px] truncate">{f.name}</div>
                            </div>
                        );
                    })}
                    {fixtures.length === 0 && (
                        <div className="absolute inset-0 flex items-center justify-center text-zinc-500 text-sm text-center px-6">
                            Добавьте приборы на странице «Патч» — они появятся здесь, и их можно будет расставить как на площадке.
                        </div>
                    )}
                </div>
            );
        }

        /* ═══════════ инспектор прибора на плане ═══════════ */
        function PlanInspector({ fixture, onChange, onCommit, onOpen }) {
            if (!fixture) return null;
            const prof = fixture.profile;
            const isPx = !!prof.pixels;
            const done = useRef(false);
            const touch = () => { if (!done.current) { done.current = true; onCommit(); } };
            useEffect(() => { done.current = false; }, [fixture.id]);
            return (
                <div className="shrink-0 rounded-xl border border-[var(--border)] bg-[var(--panel)] p-2.5">
                    <div className="flex items-center gap-2 mb-2">
                        <input className="glass-input rounded-lg px-2 py-1.5 text-xs flex-1 min-w-0" value={fixture.name}
                               onChange={e => { touch(); onChange({ name: e.target.value }); }} />
                        <span className="text-[10px] font-mono text-zinc-500 shrink-0">
                            U{fixture.universe}·{String(fixture.addr).padStart(3, '0')}–{String(fixture.addr + footprint(prof) - 1).padStart(3, '0')}
                            {isPx ? ' · ' + prof.pixels + ' пикс.' : ''}
                        </span>
                        <button onClick={onOpen} className="px-2.5 py-1.5 rounded-lg border border-[var(--border)] text-[10px] font-bold text-zinc-300 shrink-0">Адрес и тип</button>
                    </div>
                    <div className={"grid gap-1.5 " + (isPx ? 'grid-cols-2' : 'grid-cols-1')}>
                        <HSlider label="Поворот" frac={((fixture.rot || 0) % 360) / 360} text={Math.round(fixture.rot || 0) + '°'}
                                 onFrac={v => { touch(); onChange({ rot: v * 360 }); }}
                                 gradient="linear-gradient(to right,#1c1b1a,#78716c)" />
                        {isPx && (
                            <HSlider label="Длина" frac={clamp(fixture.len === undefined ? 0.14 : fixture.len, 0, 1)}
                                     text={Math.round((fixture.len === undefined ? 0.14 : fixture.len) * 100) + '%'}
                                     onFrac={v => { touch(); onChange({ len: v }); }}
                                     gradient="linear-gradient(to right,#1c1b1a,#78716c)" />
                        )}
                    </div>
                </div>
            );
        }

        /* ═══════════ сворачивающийся раздел ═══════════ */
        function Section({ title, note, storeKey, defOpen, children }) {
            const [open, setOpen] = useState(() => {
                try {
                    const v = localStorage.getItem('cl_sec_' + storeKey);
                    if (v !== null) return v === '1';
                } catch (e) {}
                return !!defOpen;
            });
            const toggle = () => {
                setOpen(o => {
                    try { localStorage.setItem('cl_sec_' + storeKey, o ? '0' : '1'); } catch (e) {}
                    return !o;
                });
            };
            return (
                <div className="rounded-xl border border-[var(--border)] overflow-hidden">
                    <button onClick={toggle} className="w-full flex items-center gap-2 px-2.5 py-2 bg-[var(--panel-2)]">
                        <span className={"text-zinc-500 text-[10px] transition-transform " + (open ? 'rotate-90' : '')}>▶</span>
                        <span className="text-[10px] font-bold uppercase tracking-wider text-zinc-400 flex-1 text-left">{title}</span>
                        {note && !open && <span className="text-[10px] font-mono text-zinc-500">{note}</span>}
                    </button>
                    {open && <div className="p-2.5 space-y-1.5">{children}</div>}
                </div>
            );
        }

        /* ═══════════ ввод цвета цифрами ═══════════ */
        function NumField({ label, value, onCommit, step, hint }) {
            const [txt, setTxt] = useState(String(value));
            const focused = useRef(false);
            useEffect(() => { if (!focused.current) setTxt(String(value)); }, [value]);
            const commit = () => {
                focused.current = false;
                const v = parseFloat(txt.replace(',', '.'));
                if (!isNaN(v)) onCommit(v); else setTxt(String(value));
            };
            return (
                <div className="flex-1 min-w-0">
                    <label className="text-[9px] font-bold uppercase tracking-wider text-zinc-500">{label}</label>
                    <input className="glass-input rounded-lg px-2 py-1.5 text-xs w-full mt-0.5 font-mono"
                           inputMode="decimal" step={step} value={txt}
                           onFocus={() => { focused.current = true; }}
                           onChange={e => setTxt(e.target.value)}
                           onBlur={commit}
                           onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); }} />
                    {hint && <div className="text-[9px] text-zinc-600 mt-0.5">{hint}</div>}
                </div>
            );
        }

        /* ═══════════ плитка прибора ═══════════ */
        function FixtureTile({ f, sel, color, dim, hasProg, onTap, pixels, mul }) {
            const bright = (color[0] + color[1] + color[2]) / 3;
            const N = f.profile.pixels || 0;
            return (
                <div onClick={onTap}
                     className={"relative rounded-xl p-2 cursor-pointer border transition-colors " +
                       (sel ? 'border-[var(--accent)] ring-1 ring-[var(--accent)] bg-[rgba(217,119,87,0.08)]' : 'border-[var(--border)] bg-[var(--panel)]')}>
                    {hasProg && <div className="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-[var(--accent)]"></div>}
                    <div className="text-[11px] font-semibold truncate pr-3">{f.name}</div>
                    <div className="text-[9px] font-mono text-zinc-500">U{f.universe} · {String(f.addr).padStart(3, '0')}{N ? ' · ' + N + ' пикс.' : ''}</div>
                    {N > 0 && pixels && pixels.length ? (
                        <div className="mt-1.5 h-9 rounded-lg border border-black/40 flex overflow-hidden">
                            {pixels.map((c, i) => {
                                const rgb = c.map(v => Math.round(clamp(v * mul, 0, 1) * 255));
                                return <div key={i} className="flex-1" style={{ background: 'rgb(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ')' }}></div>;
                            })}
                        </div>
                    ) : (
                        <div className="mt-1.5 h-9 rounded-lg border border-black/40"
                             style={{ background: 'rgb(' + color.join(',') + ')', boxShadow: bright > 40 ? '0 0 16px rgba(' + color.join(',') + ',0.55)' : 'none' }}></div>
                    )}
                    <div className="mt-1 text-right text-[10px] font-mono text-zinc-400">{pct(dim)}</div>
                </div>
            );
        }

        /* ═══════════ плитка плейбека (сцены) ═══════════ */
        function PlaybackTile({ pb, idx, level, active, recMode, onRecord, onToggle, onLevel, onMenu }) {
            const ref = useRef(null);
            const st = useRef(null);
            const down = e => {
                e.preventDefault();
                ref.current.setPointerCapture(e.pointerId);
                st.current = {
                    y: e.clientY, moved: false, long: false, lv: level,
                    t: setTimeout(() => { const s = st.current; if (s && !s.moved && pb) { s.long = true; onMenu(); } }, 550)
                };
            };
            const move = e => {
                const s = st.current; if (!s) return;
                const dy = e.clientY - s.y;
                if (Math.abs(dy) > 8) {
                    s.moved = true; clearTimeout(s.t);
                    if (pb && !recMode) onLevel(clamp(s.lv - dy / 120, 0, 1));
                }
            };
            const up = () => {
                const s = st.current; st.current = null; if (!s) return;
                clearTimeout(s.t);
                if (s.moved || s.long) return;
                if (recMode) { onRecord(); return; }
                if (pb) onToggle();
            };
            return (
                <div ref={ref} onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up}
                     className={"shrink-0 w-[100px] h-[86px] rounded-xl border p-2 flex flex-col touch-none cursor-pointer relative overflow-hidden " +
                       (recMode ? 'border-red-500 animate-pulse ' : active ? 'border-[var(--accent)] bg-[rgba(217,119,87,0.1)] ' : pb ? 'border-[var(--border)] bg-[var(--panel)] ' : 'border-dashed border-[var(--border)] ')}>
                    {pb ? (
                        <React.Fragment>
                            <div className="flex items-center gap-1.5">
                                <div className="w-2.5 h-2.5 rounded-full border border-black/40 shrink-0" style={{ background: pb.tint || '#555' }}></div>
                                <div className="text-[11px] font-semibold leading-tight truncate">{pb.name}</div>
                            </div>
                            <div className="text-[9px] text-zinc-500 font-mono mt-0.5">фейд {pb.fade}с</div>
                            <div className="flex-1"></div>
                            <div className="flex items-center gap-1.5">
                                <div className="flex-1 h-1.5 rounded-full bg-black/40 overflow-hidden">
                                    <div className="h-full bg-[var(--accent)]" style={{ width: (level * 100) + '%' }}></div>
                                </div>
                                <div className="text-[9px] font-mono text-zinc-400 w-7 text-right">{Math.round(level * 100)}</div>
                            </div>
                        </React.Fragment>
                    ) : (
                        <div className="m-auto text-center text-zinc-600">
                            <div className="text-lg font-mono">{idx + 1}</div>
                            <div className="text-[9px]">{recMode ? 'записать сюда' : 'пусто'}</div>
                        </div>
                    )}
                </div>
            );
        }

        /* ═══════════ карточка-кнопка (группа или палитра) ═══════════
           Везде одинаково: тап — применить, долгое нажатие — меню. */
        function Chip({ label, sub, tint, active, onTap, onHold, wide }) {
            const st = useRef(null);
            const ref = useRef(null);
            const down = e => {
                e.preventDefault();
                ref.current.setPointerCapture(e.pointerId);
                st.current = { long: false, t: setTimeout(() => { const s = st.current; if (s) { s.long = true; onHold(); } }, 550) };
            };
            const up = () => {
                const s = st.current; st.current = null; if (!s) return;
                clearTimeout(s.t);
                if (!s.long) onTap();
            };
            const cancel = () => { const s = st.current; st.current = null; if (s) clearTimeout(s.t); };
            return (
                <button ref={ref} onPointerDown={down} onPointerUp={up} onPointerCancel={cancel}
                        className={"shrink-0 rounded-lg border px-2.5 py-1.5 text-left touch-none " + (wide ? 'min-w-[92px] ' : '') +
                          (active ? 'border-[var(--accent)] bg-[rgba(217,119,87,0.12)]' : 'border-[var(--border)] bg-[var(--panel)]')}>
                    <div className="flex items-center gap-1.5">
                        {tint && <span className="w-2.5 h-2.5 rounded-full border border-black/40 shrink-0" style={{ background: tint }}></span>}
                        <span className="text-[11px] font-semibold truncate">{label}</span>
                    </div>
                    {sub && <div className="text-[9px] text-zinc-500 mt-0.5">{sub}</div>}
                </button>
            );
        }

        /* ═══════════ полоса палитр ═══════════ */
        function PaletteStrip({ kind, palettes, onApply, onSave, onHold }) {
            const list = palettes.filter(p => p.kind === kind);
            return (
                <div>
                    <div className="text-[10px] font-bold uppercase tracking-wider text-zinc-500 mb-1.5">
                        {kind === 'color' ? 'Палитры цвета' : 'Палитры позиции'}
                    </div>
                    <div className="flex items-center gap-1.5 overflow-x-auto hide-scrollbar pb-0.5">
                        {list.map(p => (
                            <Chip key={p.id} label={p.name} tint={p.tint} onTap={() => onApply(p)} onHold={() => onHold(p)} />
                        ))}
                        <button onClick={onSave}
                                className="shrink-0 rounded-lg border border-dashed border-[var(--border)] px-2.5 py-2 text-zinc-500 flex items-center gap-1">
                            <Icons.Plus /><span className="text-[10px] font-bold">запомнить</span>
                        </button>
                    </div>
                    {list.length === 0 && (
                        <div className="text-[10px] text-zinc-600 mt-1 leading-relaxed">
                            Палитра — это запомненный {kind === 'color' ? 'цвет' : 'разворот'}, который можно
                            ставить одним тапом. Поменяете палитру — все сцены, где она стоит, поедут за ней.
                        </div>
                    )}
                </div>
            );
        }

        /* ═══════════ карточка эффекта ═══════════ */
        function FxCard({ fx, selCount, onChange, onTarget, onDelete }) {
            const [open, setOpen] = useState(true);
            const rgbTxt = c => 'rgb(' + c.map(v => Math.round(clamp(v, 0, 1) * 255)).join(',') + ')';
            const hexOf = c => '#' + c.map(v => Math.round(clamp(v, 0, 1) * 255).toString(16).padStart(2, '0')).join('');
            const fromHex = h => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
            const needsColor = ['wave', 'chase', 'pulse', 'sparkle', 'strobe', 'gradient'].includes(fx.type);
            const needsB = fx.type === 'gradient';
            const spatial = !['pulse', 'sparkle', 'strobe'].includes(fx.type);
            const info = FX_TYPES.find(t => t.id === fx.type);
            return (
                <div className={"rounded-xl border p-2.5 " + (fx.on ? 'border-[var(--accent)] bg-[rgba(217,119,87,0.06)]' : 'border-[var(--border)] bg-[var(--panel-2)]')}>
                    <div className="flex items-center gap-2">
                        <button onClick={() => onChange({ on: !fx.on })}
                                className={"w-11 h-6 rounded-full relative shrink-0 " + (fx.on ? 'bg-[var(--accent)]' : 'bg-zinc-700')}>
                            <span className="absolute top-0.5 w-5 h-5 rounded-full bg-white transition-all" style={{ left: fx.on ? 22 : 2 }}></span>
                        </button>
                        <select className="glass-input rounded-lg px-2 py-1.5 text-xs flex-1 min-w-0" value={fx.type}
                                onChange={e => onChange({ type: e.target.value })}>
                            {FX_TYPES.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                        </select>
                        <button onClick={() => setOpen(o => !o)} className="px-2 py-1.5 text-[10px] font-bold text-zinc-400 border border-[var(--border)] rounded-lg">
                            {open ? 'Свернуть' : 'Настройки'}
                        </button>
                        <button onClick={onDelete} className="p-1.5 text-zinc-500 hover:text-red-400"><Icons.X /></button>
                    </div>
                    <div className="text-[10px] text-zinc-500 mt-1">
                        {info ? info.hint : ''} · {fx.targets && fx.targets.length ? 'приборов: ' + fx.targets.length : 'на всех приборах'}
                    </div>
                    {open && (
                        <div className="mt-2 space-y-1.5">
                            <HSlider label="Сила" frac={fx.level} text={pct(fx.level)} onFrac={v => onChange({ level: v })}
                                     gradient="linear-gradient(to right,#141312,#d97757)" />
                            <HSlider label="Скорость" frac={clamp(fx.speed / 2, 0, 1)} text={Math.round(fx.speed * 100) / 100 + '×'}
                                     onFrac={v => onChange({ speed: v * 2 })} gradient="linear-gradient(to right,#1c1b1a,#78716c)" />
                            {spatial && (
                                <React.Fragment>
                                    <HSlider label="Размер" frac={clamp(fx.size / 3, 0, 1)} text={Math.round(fx.size * 100) / 100}
                                             onFrac={v => onChange({ size: Math.max(0.05, v * 3) })} gradient="linear-gradient(to right,#1c1b1a,#78716c)" />
                                    <HSlider label="Направление" frac={fx.angle / 360} text={Math.round(fx.angle) + '°'}
                                             onFrac={v => onChange({ angle: v * 360 })} gradient="linear-gradient(to right,#1c1b1a,#78716c)" />
                                </React.Fragment>
                            )}
                            <div className="flex items-center gap-2 pt-0.5">
                                <select className="glass-input rounded-lg px-2 py-1.5 text-[11px] flex-1" value={fx.mode}
                                        onChange={e => onChange({ mode: e.target.value })}>
                                    {Object.entries(FX_MODES).map(([id, n]) => <option key={id} value={id}>{n}</option>)}
                                </select>
                                {needsColor && (
                                    <input type="color" value={hexOf(fx.colorA)} onChange={e => onChange({ colorA: fromHex(e.target.value) })}
                                           className="w-9 h-9 rounded-lg border border-[var(--border)] bg-transparent p-0.5" title="Цвет эффекта" />
                                )}
                                {needsB && (
                                    <input type="color" value={hexOf(fx.colorB)} onChange={e => onChange({ colorB: fromHex(e.target.value) })}
                                           className="w-9 h-9 rounded-lg border border-[var(--border)] bg-transparent p-0.5" title="Второй цвет" />
                                )}
                            </div>
                            <button onClick={onTarget}
                                    className="w-full py-2 rounded-lg border border-[var(--border)] text-[11px] font-bold text-zinc-300">
                                {selCount ? 'Только на выбранные приборы (' + selCount + ')' : 'Снять привязку — на все приборы'}
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        /* ═══════════ модальное окно ═══════════ */
        function Modal({ title, onClose, children, wide }) {
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: 'rgba(0,0,0,0.6)' }} onClick={onClose}>
                    <div className={"glass-panel rounded-xl p-5 w-full max-h-[85vh] overflow-y-auto " + (wide ? 'max-w-2xl' : 'max-w-md')} onClick={e => e.stopPropagation()}>
                        <div className="flex items-center justify-between mb-4">
                            <h3 className="text-lg font-semibold">{title}</h3>
                            <button onClick={onClose} className="p-1.5 rounded-lg hover:bg-white/5 text-zinc-400"><Icons.X /></button>
                        </div>
                        {children}
                    </div>
                </div>
            );
        }

        /* ═══════════ главное приложение ═══════════ */
        function App() {
            const init = useMemo(loadProject, []);
            const [fixtures, setFixtures] = useState(init.fixtures);
            const [playbacks, setPlaybacks] = useState(init.playbacks);
            const [customSwatches, setCustomSwatches] = useState(init.customSwatches || []);
            const [customProfiles, setCustomProfiles] = useState(init.customProfiles || []);
            const [effects, setEffects] = useState(init.effects || []);
            const [groups, setGroups] = useState(init.groups || []);
            const [cuelists, setCuelists] = useState(init.cuelists || []);
            const [palettes, setPalettes] = useState(init.palettes || []);
            const [settings, setSettings] = useState({ serialUniverse: 1, artnetBase: 0, bridgeAddr: '', ...(init.settings || {}) });

            const [view, setView] = useState('board');           // board | plan | patch
            const [tab, setTab] = useState('color');             // int | color | pos | fx
            const [planEdit, setPlanEdit] = useState(true);
            const [selected, setSelected] = useState(new Set());
            const [master, setMaster] = useState(1);
            const [blackout, setBlackout] = useState(false);
            const [fine, setFine] = useState(false);
            const [recMode, setRecMode] = useState(false);
            const [progDirty, setProgDirty] = useState(false);
            const [blind, setBlind] = useState(false);
            const [highlight, setHighlight] = useState(false);
            const [undoLabel, setUndoLabel] = useState(null);
            const [dmxStatus, setDmxStatus] = useState('demo');  // demo | on
            const [netStatus, setNetStatus] = useState('off');   // off | connecting | on
            const [toastMsg, setToastMsg] = useState(null);
            const [modal, setModal] = useState(null);            // {type:...}
            const [, setUiTick] = useState(0);

            /* refs для движка (живут вне рендера) */
            const fixturesRef = useRef(fixtures); fixturesRef.current = fixtures;
            const playbacksRef = useRef(playbacks); playbacksRef.current = playbacks;
            const settingsRef = useRef(settings); settingsRef.current = settings;
            const effectsRef = useRef(effects); effectsRef.current = effects;
            const palettesRef = useRef(palettes); palettesRef.current = palettes;
            const groupsRef = useRef(groups); groupsRef.current = groups;
            const cuelistsRef = useRef(cuelists); cuelistsRef.current = cuelists;
            const clRunRef = useRef({});
            const blindRef = useRef(blind); blindRef.current = blind;
            const highlightRef = useRef(highlight); highlightRef.current = highlight;
            const undoStackRef = useRef([]);
            const masterRef = useRef(master); masterRef.current = master;
            const blackoutRef = useRef(blackout); blackoutRef.current = blackout;
            const selectedRef = useRef(selected); selectedRef.current = selected;
            const progRef = useRef(new Map());
            const pbRunRef = useRef({});
            const outRef = useRef({});      // что видно на экране (с ручными правками)
            const dmxRef = useRef({});     // что уходит в кабель (в слепом режиме — без правок)
            const hsRef = useRef({ h: 30, s: 0 });
            const lastColorRef = useRef({ rgb: [1, 1, 1] });
            const lastTickRef = useRef(performance.now());
            const portRef = useRef(null);
            const writerRef = useRef(null);
            const busyRef = useRef(false);
            const toastTRef = useRef(null);
            const wsRef = useRef(null);
            const wsWantRef = useRef(null);
            const wsTimerRef = useRef(null);

            playbacks.forEach(pb => { if (pb && !pbRunRef.current[pb.id]) pbRunRef.current[pb.id] = { level: 0, lvI: 0, lvC: 0, lvP: 0, target: 0, lastOn: 0 }; });

            const toast = msg => {
                setToastMsg(msg);
                clearTimeout(toastTRef.current);
                toastTRef.current = setTimeout(() => setToastMsg(null), 2600);
            };

            /* ── отмена: перед каждым изменением кладём снимок всего проекта ── */
            const snapshot = () => ({
                fixtures: JSON.parse(JSON.stringify(fixturesRef.current)),
                playbacks: JSON.parse(JSON.stringify(playbacksRef.current)),
                groups: JSON.parse(JSON.stringify(groupsRef.current)),
                palettes: JSON.parse(JSON.stringify(palettesRef.current)),
                cuelists: JSON.parse(JSON.stringify(cuelistsRef.current)),
                effects: JSON.parse(JSON.stringify(effectsRef.current)),
                prog: Array.from(progRef.current.entries()).map(([k, v]) => [k, { ...v }])
            });
            const pushUndo = label => {
                undoStackRef.current.push({ label, state: snapshot() });
                if (undoStackRef.current.length > 40) undoStackRef.current.shift();
                setUndoLabel(label);
            };
            const undo = () => {
                const last = undoStackRef.current.pop();
                if (!last) return;
                const s = last.state;
                setFixtures(s.fixtures);
                setPlaybacks(s.playbacks);
                setGroups(s.groups);
                setPalettes(s.palettes);
                setCuelists(s.cuelists || []);
                setEffects(s.effects);
                progRef.current = new Map(s.prog);
                setProgDirty(s.prog.length > 0);
                // сцены могли исчезнуть — чистим их «бегунки»
                const live = {};
                s.playbacks.forEach(pb => { if (pb) live[pb.id] = pbRunRef.current[pb.id] || { level: 0, lvI: 0, lvC: 0, lvP: 0, target: 0, lastOn: 0 }; });
                pbRunRef.current = live;
                const next = undoStackRef.current[undoStackRef.current.length - 1];
                setUndoLabel(next ? next.label : null);
                setUiTick(t => t + 1);
                toast('Отменено: ' + last.label.toLowerCase());
            };

            /* ── списки: сцены идут по порядку, GO переводит на следующий шаг ── */
            const clRun = id => {
                if (!clRunRef.current[id]) clRunRef.current[id] = { on: false, step: -1, t: 0 };
                return clRunRef.current[id];
            };
            const setPbTarget = (slot, v) => {
                const pb = playbacksRef.current[slot];
                if (!pb) return;
                const r = pbRunRef.current[pb.id];
                if (!r) return;
                if (v > 0 && r.target <= 0) r.lastOn = Date.now();
                r.target = v;
            };
            const goCuelist = (cl, dir) => {
                if (!cl.steps || cl.steps.length === 0) { toast('В списке пока нет шагов'); return; }
                const r = clRun(cl.id);
                const prev = r.step;
                const next = (!r.on || prev < 0)
                    ? (dir < 0 ? cl.steps.length - 1 : 0)
                    : (prev + dir + cl.steps.length) % cl.steps.length;
                if (prev >= 0 && cl.steps[prev] && prev !== next) setPbTarget(cl.steps[prev].slot, 0);
                setPbTarget(cl.steps[next].slot, 1);
                r.on = true; r.step = next; r.t = 0;
                setUiTick(t => t + 1);
            };
            const stopCuelist = cl => {
                const r = clRun(cl.id);
                (cl.steps || []).forEach(st => setPbTarget(st.slot, 0));
                r.on = false; r.step = -1; r.t = 0;
                setUiTick(t => t + 1);
            };
            const goRef = useRef(null); goRef.current = goCuelist;
            const stepCuelists = dt => {
                cuelistsRef.current.forEach(cl => {
                    const r = clRunRef.current[cl.id];
                    if (!r || !r.on || r.step < 0) return;
                    const st = (cl.steps || [])[r.step];
                    if (!st || st.hold === null || st.hold === undefined || st.hold <= 0) return;
                    r.t += dt;
                    if (r.t >= st.hold) goRef.current(cl, 1);
                });
            };
            const stepCuelistsRef = useRef(stepCuelists); stepCuelistsRef.current = stepCuelists;

            /* ── DMX-движок: 30 кадров в секунду ── */
            const tickFnRef = useRef(null);
            tickFnRef.current = () => {
                const now = performance.now();
                const dt = Math.min(0.2, (now - lastTickRef.current) / 1000);
                lastTickRef.current = now;
                const runs = pbRunRef.current;
                playbacksRef.current.forEach(pb => {
                    if (!pb) return;
                    const r = runs[pb.id]; if (!r) return;
                    const fI = pb.fade === undefined ? 2 : pb.fade;
                    const step = (cur, f) => {
                        if (cur === r.target) return cur;
                        const d = dt / Math.max(0.05, f === undefined ? fI : f);
                        return cur < r.target ? Math.min(r.target, cur + d) : Math.max(r.target, cur - d);
                    };
                    r.lvI = step(r.lvI, fI);
                    r.lvC = step(r.lvC, pb.fadeC);
                    r.lvP = step(r.lvP, pb.fadeP);
                    r.level = r.lvI;
                });
                stepCuelistsRef.current(dt);
                const tSec = now / 1000;
                const palMap = {};
                palettesRef.current.forEach(p => { palMap[p.id] = p; });

                /* базовый слой: сцены. Собирается один раз и переиспользуется
                   для «в кабель» и «на экран» — в слепом режиме они расходятся. */
                const buildBase = () => {
                    const o = {};
                    fixturesRef.current.forEach(f => { o[f.id] = { ...DEF_PARAMS }; });
                    playbacksRef.current
                        .filter(pb => pb && pb.scene && runs[pb.id] && Math.max(runs[pb.id].lvI, runs[pb.id].lvC, runs[pb.id].lvP) > 0.001)
                        .sort((a, b) => (runs[a.id].lastOn || 0) - (runs[b.id].lastOn || 0))
                        .forEach(pb => {
                            const r = runs[pb.id];
                            Object.entries(pb.scene).forEach(([fid, sp]) => {
                                const t = o[fid]; if (!t) return;
                                // ссылка на палитру: берём её сегодняшнее значение, а не запечённое
                                const rc = sp.palC && palMap[sp.palC] ? palMap[sp.palC].values : null;
                                const rp = sp.palP && palMap[sp.palP] ? palMap[sp.palP].values : null;
                                Object.keys(DEF_PARAMS).forEach(p => {
                                    const ref = (rc && rc[p] !== undefined) ? rc : (rp && rp[p] !== undefined) ? rp : null;
                                    const v = ref ? ref[p] : sp[p];
                                    if (v === undefined) return;
                                    // у яркости, цвета и движения своё время фейда
                                    const g = fadeGroupOf(p);
                                    const lv = g === 'I' ? r.lvI : g === 'P' ? r.lvP : r.lvC;
                                    if (p === 'dim') t.dim = Math.max(t.dim, v * lv);
                                    else t[p] = lerp(t[p], v, lv);
                                });
                            });
                        });
                    playbacksRef.current.forEach(pb => {
                        if (!pb || !pb.fx || !pb.fx.length) return;
                        const r = runs[pb.id];
                        const lv = r ? Math.max(r.lvI, r.lvC) : 0;
                        if (lv <= 0.001) return;
                        applyEffects(o, pb.fx.map(fx => ({ ...fx, level: fx.level * lv })), fixturesRef.current, tSec);
                    });
                    return o;
                };

                const addLive = o => {
                    progRef.current.forEach((pv, fid) => {
                        if (!o[fid]) return;
                        Object.keys(DEF_PARAMS).forEach(p => { if (pv[p] !== undefined) o[fid][p] = pv[p]; });
                    });
                    applyEffects(o, effectsRef.current, fixturesRef.current, tSec);
                    return o;
                };

                const view = addLive(buildBase());
                // в слепом режиме ручные правки видны на экране, но не уходят в приборы
                const dmx = blindRef.current ? buildBase() : view;

                // подсветка: найти прибор глазами в риге, ничего не меняя в программере
                if (highlightRef.current && selectedRef.current.size) {
                    [view, dmx].forEach(o => {
                        Object.keys(o).forEach(fid => {
                            if (selectedRef.current.has(fid)) {
                                Object.assign(o[fid], { dim: 1, r: 1, g: 1, b: 1, w: 1, a: 0, cct: 5600, gm: 0 });
                                delete o[fid].px;
                            } else o[fid].dim = 0;
                        });
                    });
                }

                outRef.current = view;
                dmxRef.current = dmx;

                const ws = wsRef.current;
                const wantSerial = !!writerRef.current;
                const wantNet = !!(ws && ws.readyState === 1);
                if (wantSerial || wantNet) {
                    const mul = blackoutRef.current ? 0 : masterRef.current;
                    const unis = {};
                    fixturesRef.current.forEach(f => {
                        if (!unis[f.universe]) unis[f.universe] = new Uint8Array(512);
                        const P = { ...dmx[f.id] };
                        P.dim = P.dim * mul;
                        const bytes = paramsToBytes(f, P);
                        for (let i = 0; i < bytes.length; i++) {
                            const a = f.addr - 1 + i;
                            if (a >= 0 && a < 512) unis[f.universe][a] = bytes[i];
                        }
                    });
                    if (wantSerial) sendSerial(unis[settingsRef.current.serialUniverse || 1] || EMPTY512);
                    if (wantNet) {
                        const st = settingsRef.current;
                        const proto = st.netProto || 'artnet';
                        Object.entries(unis).forEach(([u, data]) => {
                            const n = parseInt(u);
                            try {
                                if (proto === 'sacn') {
                                    ws.send(sacnPacket(Math.max(1, n + (st.sacnBase === undefined ? 0 : st.sacnBase)), data, st.sacnPriority));
                                } else {
                                    ws.send(artDmxPacket(Math.max(0, n - 1 + (st.artnetBase || 0)), data));
                                }
                            } catch (e) {}
                        });
                    }
                }
            };
            useEffect(() => {
                const t1 = setInterval(() => tickFnRef.current(), 33);
                const t2 = setInterval(() => setUiTick(t => t + 1), 100);
                return () => { clearInterval(t1); clearInterval(t2); };
            }, []);

            /* ── Web Serial (Enttec DMX USB Pro и совместимые) ── */
            function sendSerial(uni) {
                const w = writerRef.current;
                if (!w || busyRef.current) return;
                const len = 513;
                const pkt = new Uint8Array(4 + len + 1);
                pkt[0] = 0x7E; pkt[1] = 6; pkt[2] = len & 0xFF; pkt[3] = len >> 8; pkt[4] = 0;
                pkt.set(uni, 5); pkt[pkt.length - 1] = 0xE7;
                busyRef.current = true;
                w.write(pkt).then(() => { busyRef.current = false; })
                    .catch(() => { busyRef.current = false; disconnectSerial(); toast('DMX-интерфейс отключился'); });
            }
            async function connectSerial() {
                if (!('serial' in navigator)) { toast('Нужен Chrome или Edge на компьютере — там есть доступ к USB'); return; }
                try {
                    const port = await navigator.serial.requestPort();
                    await port.open({ baudRate: 115200 });
                    portRef.current = port;
                    writerRef.current = port.writable.getWriter();
                    setDmxStatus('on');
                    toast('DMX-интерфейс подключён');
                } catch (e) { /* пользователь закрыл окно выбора порта */ }
            }
            async function disconnectSerial() {
                try { if (writerRef.current) writerRef.current.releaseLock(); } catch (e) {}
                try { if (portRef.current) await portRef.current.close(); } catch (e) {}
                writerRef.current = null; portRef.current = null; busyRef.current = false;
                setDmxStatus('demo');
            }

            /* ── Art-Net мост по Wi-Fi (работает и с iPad) ── */
            function openWs(addr) {
                let ws;
                try { ws = new WebSocket('ws://' + addr); } catch (e) { setNetStatus('off'); wsWantRef.current = null; toast('Не получилось подключиться к мосту'); return; }
                ws.binaryType = 'arraybuffer';
                ws.onopen = () => { setNetStatus('on'); toast('Мост подключён — Art-Net уходит в сеть'); };
                ws.onclose = () => {
                    if (wsRef.current === ws) wsRef.current = null;
                    if (wsWantRef.current) {
                        setNetStatus('connecting');
                        clearTimeout(wsTimerRef.current);
                        wsTimerRef.current = setTimeout(() => { if (wsWantRef.current) openWs(wsWantRef.current); }, 2000);
                    } else setNetStatus('off');
                };
                ws.onerror = () => { try { ws.close(); } catch (e) {} };
                wsRef.current = ws;
            }
            function connectBridge() {
                let addr = (settingsRef.current.bridgeAddr || '').trim();
                // если пульт открыт с самого моста — адрес уже известен
                if (!addr && location.protocol === 'http:' && location.port === '9070') addr = location.host;
                if (!addr) { toast('Впишите адрес моста — он показан в его окне на компьютере'); return; }
                if (!/:[0-9]+$/.test(addr)) addr += ':9070';
                if (location.protocol === 'https:') toast('Откройте пульт по адресу моста (http://…) — со страницы https браузер блокирует связь с мостом');
                wsWantRef.current = addr;
                setNetStatus('connecting');
                openWs(addr);
            }
            function disconnectBridge() {
                wsWantRef.current = null;
                clearTimeout(wsTimerRef.current);
                const ws = wsRef.current; wsRef.current = null;
                if (ws) { try { ws.close(); } catch (e) {} }
                setNetStatus('off');
            }

            /* ── сохранение проекта ── */
            useEffect(() => {
                const t = setTimeout(() => {
                    try {
                        localStorage.setItem('cl_project_v1', JSON.stringify({ fixtures, playbacks, customSwatches, customProfiles, settings, effects, groups, palettes, cuelists }));
                    } catch (e) {}
                }, 500);
                return () => clearTimeout(t);
            }, [fixtures, playbacks, customSwatches, customProfiles, settings, effects, groups, palettes, cuelists]);

            /* ── программер ── */
            const getVal = p => {
                const fid = selected.values().next().value;
                if (fid === undefined) return DEF_PARAMS[p];
                const pv = progRef.current.get(fid);
                if (pv && pv[p] !== undefined) return pv[p];
                const o = outRef.current[fid];
                return o ? o[p] : DEF_PARAMS[p];
            };
            const applyToSelection = (partial, palId) => {
                const sel = selectedRef.current;
                if (sel.size === 0) return;
                sel.forEach(fid => {
                    const cur = progRef.current.get(fid) || {};
                    const merged = { ...cur, ...partial };
                    // палитра держится, пока её не «переехали» руками
                    if (palId === undefined) {
                        if (COLOR_KEYS.some(k => partial[k] !== undefined)) delete merged.palC;
                        if (POS_KEYS.some(k => partial[k] !== undefined)) delete merged.palP;
                    } else if (palId.kind === 'color') merged.palC = palId.id;
                    else merged.palP = palId.id;
                    // если задали цвет, а яркость на нуле — поднимаем, чтобы результат был виден
                    if (merged.dim === undefined) {
                        const liveDim = (outRef.current[fid] || DEF_PARAMS).dim;
                        const touchedColor = ['r', 'cct', 'w', 'a'].some(k => partial[k] !== undefined);
                        if (liveDim <= 0.001 && touchedColor) merged.dim = 1;
                    }
                    progRef.current.set(fid, merged);
                });
                setProgDirty(true);
                setUiTick(t => t + 1);
            };
            const clearProg = () => { if (progRef.current.size) pushUndo('Очистка правок'); progRef.current.clear(); setProgDirty(false); setUiTick(t => t + 1); };
            const locate = () => applyToSelection({ dim: 1, r: 1, g: 1, b: 1, w: 0, a: 0, cct: 5600, gm: 0, pan: 0.5, tilt: 0.5, zoom: 0.5, focus: 0.5, strobe: 0 });

            const applyHS = (h, s) => {
                hsRef.current = { h, s };
                const [r, g, b] = hsv2rgb(h, s, 1);
                lastColorRef.current = { rgb: [r, g, b] };
                applyToSelection({ r, g, b });
            };
            const applyRGBDirect = partial => {
                const cur = { r: getVal('r'), g: getVal('g'), b: getVal('b'), ...partial };
                const hs = rgb2hsv(cur.r, cur.g, cur.b);
                if (hs.s > 0.01) hsRef.current = { h: hs.h, s: hs.s };
                lastColorRef.current = { rgb: [cur.r, cur.g, cur.b] };
                applyToSelection(partial);
            };
            const applyCCT = (k, gm) => {
                const rgb = applyTint(kelvin2rgb(k), gm);
                lastColorRef.current = { rgb };
                applyToSelection({ cct: k, gm, r: rgb[0], g: rgb[1], b: rgb[2] });
            };
            const applyXY = (x, y) => {
                const rgb = xy2rgb(x, y);
                const hs = rgb2hsv(rgb[0], rgb[1], rgb[2]);
                if (hs.s > 0.01) hsRef.current = { h: hs.h, s: hs.s };
                lastColorRef.current = { rgb };
                applyToSelection({ r: rgb[0], g: rgb[1], b: rgb[2] });
            };
            const applySwatch = sw => {
                if (sw.k !== undefined) { applyCCT(sw.k, 0); return; }
                const [r, g, b] = sw.rgb;
                const hs = rgb2hsv(r, g, b);
                hsRef.current = { h: hs.h, s: hs.s };
                lastColorRef.current = { rgb: sw.rgb };
                applyToSelection({ r, g, b });
            };

            /* ── выбор приборов ── */
            const toggleSel = fid => {
                const next = new Set(selected);
                if (next.has(fid)) next.delete(fid); else next.add(fid);
                setSelected(next);
            };
            const selAll = () => setSelected(new Set(fixtures.map(f => f.id)));
            const selNone = () => setSelected(new Set());
            const selInvert = () => setSelected(new Set(fixtures.filter(f => !selected.has(f.id)).map(f => f.id)));

            /* ── группы: сохранённый набор приборов ── */
            const saveGroup = () => {
                if (selected.size === 0) { toast('Сначала выберите приборы'); return; }
                const ids = Array.from(selected);
                const name = window.prompt('Название группы', 'Группа ' + (groups.length + 1));
                if (name === null) return;
                pushUndo('Создание группы');
                setGroups(g => [...g, { id: uid(), name: name.trim() || 'Группа', ids }]);
                toast('Группа сохранена: приборов ' + ids.length);
            };
            const applyGroup = (g, add) => {
                const live = new Set(fixtures.map(f => f.id));
                const ids = g.ids.filter(id => live.has(id));
                setSelected(prev => add ? new Set([...prev, ...ids]) : new Set(ids));

                const keys = kind === 'color' ? COLOR_KEYS : POS_KEYS;

                const src = outRef.current[fid] || DEF_PARAMS;
                const keys = pal.kind === 'color' ? COLOR_KEYS : POS_KEYS;
                const values = {};
                keys.forEach(k => { values[k] = src[k]; });
                const f = fixtures.find(x => x.id === fid);
                const c = f ? displayColor(f, { ...src, dim: 1 }) : [200, 200, 200];
                pushUndo('Изменение палитры');

            /* ── списки сцен ── */

            const addEffect = () => {

            const autoArrange = () => {
                pushUndo('Расстановка рядами');
                setFixtures(fx => {
                    const cols = Math.ceil(Math.sqrt(fx.length)) || 1;
                    const rows = Math.ceil(fx.length / cols) || 1;
                    return fx.map((f, i) => ({

                        x: ((i % cols) + 0.5) / cols,

                fixturesRef.current.forEach(f => {

                    Object.keys(DEF_PARAMS).forEach(k => { snap[k] = src[k]; });

                    const pv = progRef.current.get(f.id);

                    scene[f.id] = snap;
                    const c = displayColor(f, src);
                    if (snap.dim > 0.03) { cr += c[0]; cg += c[1]; cb += c[2]; cn++; }

                const fxSnap = JSON.parse(JSON.stringify(effectsRef.current.filter(fx => fx.on)));

                                                    </button>
                                                </div>
                                                <HSlider label="Зум" frac={getVal('zoom')} text={pct(getVal('zoom'))} disabled={noSel}
                                                         onFrac={v => applyToSelection({ zoom: v })} gradient="linear-gradient(to right,#1c1b1a,#78716c)" />
                                                <HSlider label="Фокус" frac={getVal('focus')} text={pct(getVal('focus'))} disabled={noSel}
                                                         onFrac={v => applyToSelection({ focus: v })} gradient="linear-gradient(to right,#1c1b1a,#78716c)" />
                                            </React.Fragment>
                                        )}
                                    </div>

                                    {/* энкодеры */}
                                    <div className="shrink-0 border-t border-[var(--border)] px-3 pt-2 pb-3">
                                        <div className="flex items-center gap-2 mb-1.5">
                                            <button onClick={locate} disabled={noSel}
                                                    className="px-3 py-1.5 rounded-lg text-[11px] font-bold bg-[var(--panel-2)] border border-[var(--border)] text-zinc-300 disabled:opacity-35">Locate</button>
                                            <button onClick={() => setHighlight(h => !h)} disabled={noSel}
                                                    title="Гасит всё кроме выбранных — чтобы найти прибор глазами"
                                                    className={"px-3 py-1.5 rounded-lg text-[11px] font-bold border disabled:opacity-35 " +
                                                      (highlight ? 'bg-yellow-500 border-yellow-500 text-black' : 'bg-[var(--panel-2)] border-[var(--border)] text-zinc-300')}>Найти</button>
                                            <button onClick={clearProg}
                                                    className={"px-3 py-1.5 rounded-lg text-[11px] font-bold border " +
                                                      (progDirty ? 'border-[var(--accent)] text-[var(--accent)]' : 'border-[var(--border)] text-zinc-500')}>Очистить</button>
                                            <div className="flex-1"></div>
                                            <button onClick={() => setFine(f => !f)}
                                                    className={"px-3 py-1.5 rounded-lg text-[11px] font-bold border " +
                                                      (fine ? 'bg-[var(--accent)] border-[var(--accent)] text-white' : 'border-[var(--border)] text-zinc-400')}>Точно</button>
                                        </div>
                                        <div className="flex justify-between">
                                            {encoders.map(enc => (
                                                <Encoder key={tab + enc.label} label={enc.label} frac={enc.frac} text={enc.text}
                                                         onTurn={enc.onTurn} disabled={noSel} />
                                            ))}
                                        </div>
                                    </div>
                                </div>
            );

            /* ═══════════ вёрстка ═══════════ */
            return (
                <div className="app-h w-screen flex flex-col overflow-hidden">
                    {/* ── верхняя панель ── */}
                    <div className="h-[52px] shrink-0 flex items-center gap-2 px-3 border-b border-[var(--border)] bg-[var(--panel)]">
                        <h1 className="text-lg font-semibold mr-1">CineLight</h1>
                        <span className="text-[9px] font-mono px-1.5 py-0.5 rounded bg-[var(--panel-2)] border border-[var(--border)] text-zinc-400">DMX</span>
                        <div className="flex gap-1 ml-2">
                            {[['board', 'Пульт'], ['plan', 'План'], ['patch', 'Патч']].map(([id, nm]) => (
                                <button key={id} onClick={() => setView(id)}
                                        className={"px-3 py-1.5 rounded-lg text-xs font-semibold " + (view === id ? 'bg-[var(--accent)] text-white' : 'text-zinc-400 hover:bg-white/5')}>{nm}</button>
                            ))}
                        </div>
                        <div className="flex-1"></div>
                        <button onClick={undo} disabled={!undoLabel}
                                title={undoLabel ? 'Отменить: ' + undoLabel : 'Отменять нечего'}
                                className="px-2.5 py-1.5 rounded-lg text-[11px] font-bold border border-[var(--border)] text-zinc-300 disabled:opacity-30">
                            ↶ Отменить
                        </button>
                        <button onClick={() => setBlind(b => !b)}
                                title="Готовить свет, не трогая то, что идёт в приборы"
                                className={"px-2.5 py-1.5 rounded-lg text-[11px] font-bold border whitespace-nowrap " +
                                  (blind ? 'bg-sky-600 border-sky-600 text-white' : 'border-[var(--border)] text-zinc-400')}>
                            {blind ? 'Слепой · в приборы не идёт' : 'Слепой'}
                        </button>
                        <button onClick={() => setModal({ type: 'settings' })}
                                className={"flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-[10px] font-bold font-mono border " +
                                  (outActive ? 'border-green-700 text-green-400' : netStatus === 'connecting' ? 'border-yellow-700 text-yellow-500' : 'border-[var(--border)] text-zinc-500')}>
                            <Icons.Zap />{outLabel}
                        </button>
                        <div className="hidden md:flex items-center gap-2 px-2">
                            <span className="text-[10px] font-bold text-zinc-400">МАСТЕР</span>
                            <input type="range" min="0" max="100" value={Math.round(master * 100)}
                                   onChange={e => setMaster(e.target.value / 100)} className="w-32" />
                            <span className="text-[10px] font-mono w-8 text-zinc-300">{pct(master)}</span>
                        </div>
                        <button onClick={() => setBlackout(b => !b)}
                                className={"px-3 py-2 rounded-lg text-xs font-extrabold tracking-wide " +
                                  (blackout ? 'bg-red-600 text-white animate-pulse' : 'bg-[var(--panel-2)] border border-[var(--border)] text-zinc-300')}>
                            BLACKOUT
                        </button>
                        <button onClick={() => setModal({ type: 'settings' })} className="p-2 rounded-lg text-zinc-400 hover:bg-white/5"><Icons.Gear /></button>
                    </div>

                    {view === 'plan' ? (
                        /* ═══ страница ПЛАН ═══ */
                        <div className="flex-1 min-h-0 flex flex-col lg:flex-row">
                            <div className="flex-1 min-h-0 min-w-0 flex flex-col p-3 gap-2">
                                <div className="shrink-0 flex items-center gap-2 flex-wrap">
                                    <span className="text-[11px] text-zinc-400 font-semibold">План площадки · выбрано {selected.size}</span>
                                    <div className="flex-1"></div>
                                    <button onClick={() => setPlanEdit(p => !p)}
                                            className={"px-2.5 py-1.5 rounded-lg text-[11px] font-bold border " +
                                              (planEdit ? 'bg-[var(--accent)] border-[var(--accent)] text-white' : 'border-[var(--border)] text-zinc-400')}>
                                        {planEdit ? 'Двигать: вкл' : 'Двигать: выкл'}
                                    </button>
                                    <button onClick={selAll} className="px-2.5 py-1.5 rounded-lg text-[11px] font-semibold bg-[var(--panel)] border border-[var(--border)] text-zinc-300">Все</button>
                                    <button onClick={selNone} className="px-2.5 py-1.5 rounded-lg text-[11px] font-semibold bg-[var(--panel)] border border-[var(--border)] text-zinc-300">Сброс</button>
                                    <button onClick={autoArrange} className="px-2.5 py-1.5 rounded-lg text-[11px] font-semibold bg-[var(--panel)] border border-[var(--border)] text-zinc-300">Расставить рядами</button>
                                </div>
                                {/* группы работают и здесь */}
                                {groups.length > 0 && (
                                    <div className="shrink-0 flex items-center gap-1.5 overflow-x-auto hide-scrollbar">
                                        <span className="text-[10px] font-bold uppercase tracking-wider text-zinc-500 shrink-0 pr-1">Группы</span>
                                        {groups.map(g => (
                                            <Chip key={g.id} label={g.name} sub={g.ids.length + ' приб.'}
                                                  active={g.ids.length > 0 && g.ids.every(id => selected.has(id))}
                                                  onTap={() => applyGroup(g, false)}
                                                  onHold={() => setModal({ type: 'groupMenu', id: g.id })} />
                                        ))}
                                    </div>
                                )}
                                <div className="flex-1 min-h-0">
                                    <LayoutView fixtures={fixtures} outRef={outRef} selected={selected} mul={mul}
                                                editing={planEdit} onTap={toggleSel}
                                                onMove={(id, x, y) => setFixtures(fx => fx.map(f => f.id === id ? { ...f, x, y } : f))} />
                                </div>
                                {/* инспектор выбранного прибора */}
                                {selected.size === 1 ? (
                                    <PlanInspector fixture={fixtures.find(f => f.id === selected.values().next().value)}
                                                   onChange={upd => setFixtures(fx => fx.map(f => f.id === selected.values().next().value ? { ...f, ...upd } : f))}
                                                   onCommit={() => pushUndo('Настройка прибора')}
                                                   onOpen={() => setModal({ type: 'editFixture', id: selected.values().next().value })} />
                                ) : (
                                    <div className="shrink-0 text-[11px] text-zinc-500">
                                        {selected.size === 0
                                            ? 'Тап по прибору выбирает его — снизу появятся настройки, справа управление светом. Перетаскивание пальцем задаёт место на площадке.'
                                            : 'Выбрано приборов: ' + selected.size + '. Управление светом — справа. Настройки отдельного прибора появятся, если выбрать один.'}
                                    </div>
                                )}
                            </div>
                            {controlPanel}
                        </div>
                    ) : view === 'patch' ? (
                        /* ═══ страница ПАТЧ ═══ */
                        <div className="flex-1 min-h-0 overflow-y-auto p-4">
                            <div className="max-w-3xl mx-auto">
                                <div className="flex items-center justify-between mb-4">
                                    <h2 className="text-xl font-semibold">Патч приборов</h2>
                                    <button onClick={() => setModal({ type: 'addFixture' })}
                                            className="flex items-center gap-1.5 px-3 py-2 rounded-lg bg-[var(--accent)] text-white text-xs font-bold">
                                        <Icons.Plus />Добавить прибор
                                    </button>
                                </div>
                                {conflicts.size > 0 && (
                                    <div className="mb-3 px-3 py-2 rounded-lg border border-red-800 bg-red-950/40 text-red-300 text-xs">
                                        Внимание: адреса некоторых приборов пересекаются — они подсвечены красным.
                                    </div>
                                )}
                                {[...new Set(fixtures.map(f => f.universe))].sort((a, b) => a - b).map(u => (
                                    <div key={u} className="mb-4">
                                        <div className="text-[11px] font-bold uppercase tracking-wider text-zinc-500 mb-2">Юниверс {u}</div>
                                        <div className="space-y-1.5">
                                            {fixtures.filter(f => f.universe === u).sort((a, b) => a.addr - b.addr).map(f => (
                                                <div key={f.id}
                                                     className={"flex items-center gap-3 px-3 py-2.5 rounded-xl border cursor-pointer hover:bg-white/[0.03] " +
                                                       (conflicts.has(f.id) ? 'border-red-700 bg-red-950/30' : 'border-[var(--border)] bg-[var(--panel)]')}
                                                     onClick={() => setModal({ type: 'editFixture', id: f.id })}>
                                                    <span className="font-mono text-[11px] px-2 py-1 rounded-md bg-[var(--panel-2)] border border-[var(--border)] text-zinc-300">
                                                        {String(f.addr).padStart(3, '0')}–{String(f.addr + footprint(f.profile) - 1).padStart(3, '0')}
                                                    </span>
                                                    <span className="text-sm font-semibold flex-1 truncate">{f.name}</span>
                                                    <span className="text-[11px] text-zinc-500 hidden sm:block">{f.profile.name}</span>
                                                    <span className="text-zinc-500"><Icons.Pen /></span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                                {fixtures.length === 0 && (
                                    <div className="text-center text-zinc-500 py-16 text-sm">
                                        Приборов пока нет. Нажмите «Добавить прибор», выберите тип и DMX-адрес.
                                    </div>
                                )}
                            </div>
                        </div>
                    ) : (
                        /* ═══ страница ПУЛЬТ ═══ */
                        <div className="flex-1 min-h-0 flex flex-col lg:flex-row">
                            {/* левая часть: приборы + сцены */}
                            <div className="flex-1 min-h-0 min-w-0 flex flex-col">
                                <div className="shrink-0 flex items-center gap-2 px-3 pt-2">
                                    <span className="text-[11px] text-zinc-400 font-semibold">Приборы · выбрано {selected.size}</span>
                                    <div className="flex-1"></div>
                                    <button onClick={selAll} className="px-2.5 py-1.5 rounded-lg text-[11px] font-semibold bg-[var(--panel)] border border-[var(--border)] text-zinc-300">Все</button>
                                    <button onClick={selNone} className="px-2.5 py-1.5 rounded-lg text-[11px] font-semibold bg-[var(--panel)] border border-[var(--border)] text-zinc-300">Сброс</button>
                                    <button onClick={selInvert} className="px-2.5 py-1.5 rounded-lg text-[11px] font-semibold bg-[var(--panel)] border border-[var(--border)] text-zinc-300">Инверт</button>
                                </div>
                                {/* группы */}
                                <div className="shrink-0 flex items-center gap-1.5 px-3 py-2 overflow-x-auto hide-scrollbar">
