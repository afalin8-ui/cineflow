                        ? { ...old, scene, tint, fx: fxSnap }
                        : { id: uid() + 'p' + idx, name: 'Сцена ' + (idx + 1), fade: 2, scene, tint, fx: fxSnap };
                    return next;
                });
                setRecMode(false);
                // живые эффекты гасим, иначе они наложатся на записанные в сцену вторым слоем
                if (fxSnap.length) {
                    setEffects(list => list.map(fx => ({ ...fx, on: false })));
                    toast('Сцена записана в слот ' + (idx + 1) + ' вместе с эффектами');
                } else toast('Сцена записана в слот ' + (idx + 1));
            };

            /* ── патч ── */
            const conflicts = useMemo(() => findConflicts(fixtures), [fixtures]);

            /* ── энкодеры по вкладкам ── */
            const spd = fine ? 0.1 : 1;
            const encoders = tab === 'color' ? [
                { label: 'Оттенок', frac: hsRef.current.h / 360, text: Math.round(hsRef.current.h) + '°',
                  onTurn: t => { let h = hsRef.current.h + t * 360 * spd; h = ((h % 360) + 360) % 360; applyHS(h, hsRef.current.s); } },
                { label: 'Насыщ.', frac: hsRef.current.s, text: pct(hsRef.current.s),
                  onTurn: t => applyHS(hsRef.current.h, clamp(hsRef.current.s + t * spd, 0, 1)) },
                { label: 'CCT', frac: (getVal('cct') - 2000) / 8000, text: Math.round(getVal('cct') / 100) / 10 + 'K',
                  onTurn: t => applyCCT(clamp(getVal('cct') + t * 5000 * spd, 2000, 10000), getVal('gm')) },
                { label: 'Тон G/M', frac: (getVal('gm') + 1) / 2,
                  text: Math.abs(getVal('gm')) < 0.005 ? '0' : (getVal('gm') > 0 ? 'G' : 'M') + Math.round(Math.abs(getVal('gm')) * 100),
                  onTurn: t => applyCCT(getVal('cct'), clamp(getVal('gm') + t * 2 * spd, -1, 1)) }
            ] : tab === 'pos' ? [
                { label: 'Pan', frac: getVal('pan'), text: pct(getVal('pan')),
                  onTurn: t => applyToSelection({ pan: clamp(getVal('pan') + t * 0.5 * spd, 0, 1) }) },
                { label: 'Tilt', frac: getVal('tilt'), text: pct(getVal('tilt')),
                  onTurn: t => applyToSelection({ tilt: clamp(getVal('tilt') + t * 0.5 * spd, 0, 1) }) },
                { label: 'Зум', frac: getVal('zoom'), text: pct(getVal('zoom')),
                  onTurn: t => applyToSelection({ zoom: clamp(getVal('zoom') + t * spd, 0, 1) }) },
                { label: 'Фокус', frac: getVal('focus'), text: pct(getVal('focus')),
                  onTurn: t => applyToSelection({ focus: clamp(getVal('focus') + t * spd, 0, 1) }) }
            ] : [
                { label: 'Диммер', frac: getVal('dim'), text: pct(getVal('dim')),
                  onTurn: t => applyToSelection({ dim: clamp(getVal('dim') + t * spd, 0, 1) }) },
                { label: 'Строб', frac: getVal('strobe'), text: getVal('strobe') < 0.01 ? 'выкл' : pct(getVal('strobe')),
                  onTurn: t => applyToSelection({ strobe: clamp(getVal('strobe') + t * spd, 0, 1) }) },
                { label: 'Белый', frac: getVal('w'), text: pct(getVal('w')),
                  onTurn: t => applyRGBDirect({ w: clamp(getVal('w') + t * spd, 0, 1) }) },
                { label: 'Янтарь', frac: getVal('a'), text: pct(getVal('a')),
                  onTurn: t => applyRGBDirect({ a: clamp(getVal('a') + t * spd, 0, 1) }) }
            ];

            const noSel = selected.size === 0;
            const mul = blackout ? 0 : master;
            const curXY = rgb2xy(getVal('r'), getVal('g'), getVal('b'));
            const cctGrad = 'linear-gradient(to right,#ff8912,#ffb46b,#ffcda1,#ffece0,#ffffff,#dfe5ff,#ccdcff)';
            const outActive = dmxStatus === 'on' || netStatus === 'on';
            const outLabel = dmxStatus === 'on' && netStatus === 'on' ? 'USB+NET'
                : dmxStatus === 'on' ? 'USB U' + (settings.serialUniverse || 1)
                : netStatus === 'on' ? 'ART-NET'
                : netStatus === 'connecting' ? 'МОСТ…' : 'ДЕМО';

            /* ═══════════ вёрстка ═══════════ */
            return (
                <div className="app-h w-screen flex flex-col overflow-hidden">
                    {/* ── верхняя панель ── */}
                    <div className="h-[52px] shrink-0 flex items-center gap-2 px-3 border-b border-[var(--border)] bg-[var(--panel)]">
                        <h1 className="text-lg font-semibold mr-1">CineLight</h1>
                        <span className="text-[9px] font-mono px-1.5 py-0.5 rounded bg-[var(--panel-2)] border border-[var(--border)] text-zinc-400">DMX</span>
                        <div className="flex gap-1 ml-2">
                            {[['board', 'Пульт'], ['plan', 'План'], ['patch', 'Патч']].map(([id, nm]) => (
                                <button key={id} onClick={() => setView(id)}
                                        className={"px-3 py-1.5 rounded-lg text-xs font-semibold " + (view === id ? 'bg-[var(--accent)] text-white' : 'text-zinc-400 hover:bg-white/5')}>{nm}</button>
                            ))}
                        </div>
                        <div className="flex-1"></div>
                        <button onClick={undo} disabled={!undoLabel}
                                title={undoLabel ? 'Отменить: ' + undoLabel : 'Отменять нечего'}
                                className="px-2.5 py-1.5 rounded-lg text-[11px] font-bold border border-[var(--border)] text-zinc-300 disabled:opacity-30">
                            ↶ Отменить
                        </button>
                        <button onClick={() => setBlind(b => !b)}
                                title="Готовить свет, не трогая то, что идёт в приборы"
                                className={"px-2.5 py-1.5 rounded-lg text-[11px] font-bold border whitespace-nowrap " +
                                  (blind ? 'bg-sky-600 border-sky-600 text-white' : 'border-[var(--border)] text-zinc-400')}>
                            {blind ? 'Слепой · в приборы не идёт' : 'Слепой'}
                        </button>
                        <button onClick={() => setModal({ type: 'settings' })}
                                className={"flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-[10px] font-bold font-mono border " +
                                  (outActive ? 'border-green-700 text-green-400' : netStatus === 'connecting' ? 'border-yellow-700 text-yellow-500' : 'border-[var(--border)] text-zinc-500')}>
                            <Icons.Zap />{outLabel}
                        </button>
                        <div className="hidden md:flex items-center gap-2 px-2">
                            <span className="text-[10px] font-bold text-zinc-400">МАСТЕР</span>
                            <input type="range" min="0" max="100" value={Math.round(master * 100)}
                                   onChange={e => setMaster(e.target.value / 100)} className="w-32" />
                            <span className="text-[10px] font-mono w-8 text-zinc-300">{pct(master)}</span>
                        </div>
                        <button onClick={() => setBlackout(b => !b)}
                                className={"px-3 py-2 rounded-lg text-xs font-extrabold tracking-wide " +
                                  (blackout ? 'bg-red-600 text-white animate-pulse' : 'bg-[var(--panel-2)] border border-[var(--border)] text-zinc-300')}>
                            BLACKOUT
                        </button>
                        <button onClick={() => setModal({ type: 'settings' })} className="p-2 rounded-lg text-zinc-400 hover:bg-white/5"><Icons.Gear /></button>
                    </div>

                    {view === 'plan' ? (
                        /* ═══ страница ПЛАН ═══ */
                        <div className="flex-1 min-h-0 flex flex-col p-3 gap-2">
                            <div className="shrink-0 flex items-center gap-2 flex-wrap">
                                <span className="text-[11px] text-zinc-400 font-semibold">План площадки · выбрано {selected.size}</span>
                                <div className="flex-1"></div>
                                <button onClick={() => setPlanEdit(p => !p)}
                                        className={"px-2.5 py-1.5 rounded-lg text-[11px] font-bold border " +
                                          (planEdit ? 'bg-[var(--accent)] border-[var(--accent)] text-white' : 'border-[var(--border)] text-zinc-400')}>
                                    {planEdit ? 'Двигать: вкл' : 'Двигать: выкл'}
                                </button>
                                <button onClick={selNone} className="px-2.5 py-1.5 rounded-lg text-[11px] font-semibold bg-[var(--panel)] border border-[var(--border)] text-zinc-300">Сброс</button>
                                <button disabled={selected.size !== 1}
                                        onClick={() => setModal({ type: 'editFixture', id: selected.values().next().value })}
                                        className="px-2.5 py-1.5 rounded-lg text-[11px] font-semibold bg-[var(--panel)] border border-[var(--border)] text-zinc-300 disabled:opacity-35">
                                    Настроить прибор
                                </button>
                                <button onClick={autoArrange} className="px-2.5 py-1.5 rounded-lg text-[11px] font-semibold bg-[var(--panel)] border border-[var(--border)] text-zinc-300">Расставить рядами</button>
                            </div>
                            <div className="flex-1 min-h-0">
                                <LayoutView fixtures={fixtures} outRef={outRef} selected={selected} mul={mul}
                                            editing={planEdit} onTap={toggleSel}
                                            onMove={(id, x, y) => setFixtures(fx => fx.map(f => f.id === id ? { ...f, x, y } : f))} />
                            </div>
                            <div className="shrink-0 text-[11px] text-zinc-500">
                                Перетаскивайте приборы пальцем — расстановка задаёт, как по ним побегут эффекты.
                                Тап без перетаскивания выбирает прибор. Длину и поворот пиксельных трубок задаёт кнопка «Настроить прибор».
                            </div>
                        </div>
                    ) : view === 'patch' ? (
                        /* ═══ страница ПАТЧ ═══ */
                        <div className="flex-1 min-h-0 overflow-y-auto p-4">
                            <div className="max-w-3xl mx-auto">
                                <div className="flex items-center justify-between mb-4">
                                    <h2 className="text-xl font-semibold">Патч приборов</h2>
                                    <button onClick={() => setModal({ type: 'addFixture' })}
                                            className="flex items-center gap-1.5 px-3 py-2 rounded-lg bg-[var(--accent)] text-white text-xs font-bold">
                                        <Icons.Plus />Добавить прибор
                                    </button>
                                </div>
                                {conflicts.size > 0 && (
                                    <div className="mb-3 px-3 py-2 rounded-lg border border-red-800 bg-red-950/40 text-red-300 text-xs">
                                        Внимание: адреса некоторых приборов пересекаются — они подсвечены красным.
                                    </div>
                                )}
                                {[...new Set(fixtures.map(f => f.universe))].sort((a, b) => a - b).map(u => (
                                    <div key={u} className="mb-4">
                                        <div className="text-[11px] font-bold uppercase tracking-wider text-zinc-500 mb-2">Юниверс {u}</div>
                                        <div className="space-y-1.5">
                                            {fixtures.filter(f => f.universe === u).sort((a, b) => a.addr - b.addr).map(f => (
                                                <div key={f.id}
                                                     className={"flex items-center gap-3 px-3 py-2.5 rounded-xl border cursor-pointer hover:bg-white/[0.03] " +
                                                       (conflicts.has(f.id) ? 'border-red-700 bg-red-950/30' : 'border-[var(--border)] bg-[var(--panel)]')}
                                                     onClick={() => setModal({ type: 'editFixture', id: f.id })}>
                                                    <span className="font-mono text-[11px] px-2 py-1 rounded-md bg-[var(--panel-2)] border border-[var(--border)] text-zinc-300">
                                                        {String(f.addr).padStart(3, '0')}–{String(f.addr + footprint(f.profile) - 1).padStart(3, '0')}
                                                    </span>
                                                    <span className="text-sm font-semibold flex-1 truncate">{f.name}</span>
                                                    <span className="text-[11px] text-zinc-500 hidden sm:block">{f.profile.name}</span>
                                                    <span className="text-zinc-500"><Icons.Pen /></span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                                {fixtures.length === 0 && (
                                    <div className="text-center text-zinc-500 py-16 text-sm">
                                        Приборов пока нет. Нажмите «Добавить прибор», выберите тип и DMX-адрес.
                                    </div>
                                )}
                            </div>
                        </div>
                    ) : (
                        /* ═══ страница ПУЛЬТ ═══ */
                        <div className="flex-1 min-h-0 flex flex-col lg:flex-row">
                            {/* левая часть: приборы + сцены */}
                            <div className="flex-1 min-h-0 min-w-0 flex flex-col">
                                <div className="shrink-0 flex items-center gap-2 px-3 pt-2">
                                    <span className="text-[11px] text-zinc-400 font-semibold">Приборы · выбрано {selected.size}</span>
                                    <div className="flex-1"></div>
                                    <button onClick={selAll} className="px-2.5 py-1.5 rounded-lg text-[11px] font-semibold bg-[var(--panel)] border border-[var(--border)] text-zinc-300">Все</button>
                                    <button onClick={selNone} className="px-2.5 py-1.5 rounded-lg text-[11px] font-semibold bg-[var(--panel)] border border-[var(--border)] text-zinc-300">Сброс</button>
                                    <button onClick={selInvert} className="px-2.5 py-1.5 rounded-lg text-[11px] font-semibold bg-[var(--panel)] border border-[var(--border)] text-zinc-300">Инверт</button>
                                </div>
                                {/* группы */}
                                <div className="shrink-0 flex items-center gap-1.5 px-3 py-2 overflow-x-auto hide-scrollbar">
                                    <span className="text-[10px] font-bold uppercase tracking-wider text-zinc-500 shrink-0 pr-1">Группы</span>
                                    {groups.map(g => (
                                        <Chip key={g.id} label={g.name} sub={g.ids.length + ' приб.'}
                                              active={g.ids.length > 0 && g.ids.every(id => selected.has(id))}
                                              onTap={() => applyGroup(g, false)}
                                              onHold={() => setModal({ type: 'groupMenu', id: g.id })} />
                                    ))}
                                    <button onClick={saveGroup}
                                            className="shrink-0 rounded-lg border border-dashed border-[var(--border)] px-2.5 py-2 text-zinc-500 flex items-center gap-1">
                                        <Icons.Plus /><span className="text-[10px] font-bold">из выбора</span>
                                    </button>
                                </div>
                                <div className="flex-1 min-h-0 overflow-y-auto px-3 pb-2">
                                    <div className="grid gap-2" style={{ gridTemplateColumns: 'repeat(auto-fill, minmax(96px, 1fr))' }}>
                                        {fixtures.map(f => {
                                            const P = outRef.current[f.id] || DEF_PARAMS;
                                            return <FixtureTile key={f.id} f={f} sel={selected.has(f.id)}
                                                    color={displayColor(f, P, mul)} dim={P.dim}
                                                    hasProg={progRef.current.has(f.id)}
                                                    pixels={P.px} mul={mul}
                                                    onTap={() => toggleSel(f.id)} />;
                                        })}
                                    </div>
                                    {fixtures.length === 0 && (
                                        <div className="text-center text-zinc-500 pt-14 text-sm">
                                            Сначала добавьте приборы на странице «Патч».
                                        </div>
                                    )}
                                </div>
                                {/* сцены (плейбеки) */}
                                <div className="shrink-0 border-t border-[var(--border)] bg-[var(--panel-2)]">
                                    {recMode && (
                                        <div className="px-3 pt-2 text-[11px] text-red-400 font-semibold">
                                            Режим записи: нажмите на слот, куда сохранить текущую картинку света.
                                            <button onClick={() => setRecMode(false)} className="ml-2 underline">Отмена</button>
                                        </div>
                                    )}
                                    <div className="flex items-stretch gap-2 px-3 py-2 overflow-x-auto hide-scrollbar">
                                        <button onClick={() => setRecMode(r => !r)}
                                                className={"shrink-0 w-[64px] rounded-xl border text-[11px] font-extrabold " +
                                                  (recMode ? 'border-red-500 bg-red-600/20 text-red-400 animate-pulse' : 'border-[var(--border)] bg-[var(--panel)] text-zinc-300')}>
                                            ● ЗАПИСЬ
                                        </button>
                                        {playbacks.map((pb, idx) => {
                                            const run = pb ? pbRunRef.current[pb.id] : null;
                                            return <PlaybackTile key={pb ? pb.id : 'empty' + idx} pb={pb} idx={idx}
                                                    level={run ? run.level : 0} active={run ? run.target > 0 : false} recMode={recMode}
                                                    onRecord={() => recordScene(idx)}
                                                    onToggle={() => togglePb(pb)}
                                                    onLevel={v => setPbLevel(pb, v)}
                                                    onMenu={() => setModal({ type: 'pbMenu', idx })} />;
                                        })}
                                    </div>
                                </div>
                            </div>

                            {/* правая панель: параметры + энкодеры */}
                            <div className="lg:w-[400px] w-full h-[46%] lg:h-auto shrink-0 border-t lg:border-t-0 lg:border-l border-[var(--border)] bg-[var(--panel)] flex flex-col min-h-0">
                                <div className="shrink-0 flex p-2 gap-1">
                                    {[['int', 'Яркость'], ['color', 'Цвет'], ['pos', 'Позиция'], ['fx', 'Эффекты']].map(([id, name]) => (
                                        <button key={id} onClick={() => setTab(id)}
                                                className={"flex-1 py-2 rounded-lg text-[11px] font-bold " +
                                                  (tab === id ? 'bg-[var(--accent)] text-white' : 'bg-[var(--panel-2)] text-zinc-400')}>
                                            {name}{id === 'fx' && effects.filter(f => f.on).length > 0 ? ' ●' : ''}
                                        </button>
                                    ))}
                                </div>
                                <div className="flex-1 min-h-0 overflow-y-auto px-3 pb-2 space-y-3">
                                    {noSel && <div className="text-[11px] text-zinc-500 px-1 pt-1">Выберите приборы слева, чтобы управлять ими.</div>}

                                    {tab === 'int' && (
                                        <React.Fragment>
                                            <HSlider label="Диммер" frac={getVal('dim')} text={pct(getVal('dim'))} disabled={noSel}
                                                     onFrac={v => applyToSelection({ dim: v })}
                                                     gradient="linear-gradient(to right,#141312,#ffd9a0)" />
                                            <div className="flex gap-1.5">
                                                {[0, 0.25, 0.5, 0.75, 1].map(v => (
                                                    <button key={v} disabled={noSel} onClick={() => applyToSelection({ dim: v })}
                                                            className="flex-1 py-2.5 rounded-lg bg-[var(--panel-2)] border border-[var(--border)] text-xs font-mono font-bold text-zinc-300 disabled:opacity-35">
                                                        {Math.round(v * 100)}
                                                    </button>
                                                ))}
                                            </div>
                                            <HSlider label="Строб" frac={getVal('strobe')} text={getVal('strobe') < 0.01 ? 'выкл' : pct(getVal('strobe'))} disabled={noSel}
                                                     onFrac={v => applyToSelection({ strobe: v })}
                                                     gradient="linear-gradient(to right,#141312,#e7e5e4)" />
                                        </React.Fragment>
                                    )}

                                    {tab === 'color' && (
                                        <React.Fragment>
                                            <PaletteStrip kind="color" palettes={palettes} onApply={applyPalette}
                                                          onSave={() => savePalette('color')}
                                                          onHold={p => setModal({ type: 'palMenu', id: p.id })} />
                                            <ColorWheel size={216} hs={hsRef.current} onPick={applyHS} disabled={noSel} />
                                            <HSlider label="CCT" frac={(getVal('cct') - 2000) / 8000} text={Math.round(getVal('cct')) + 'K'} disabled={noSel}
                                                     onFrac={v => applyCCT(2000 + v * 8000, getVal('gm'))} gradient={cctGrad} />
                                            <HSlider label="Тон G/M"
                                                     frac={(getVal('gm') + 1) / 2}
                                                     text={Math.abs(getVal('gm')) < 0.005 ? '0' : (getVal('gm') > 0 ? 'G+' : 'M+') + Math.round(Math.abs(getVal('gm')) * 100)}
                                                     disabled={noSel}
                                                     onFrac={v => applyCCT(getVal('cct'), v * 2 - 1)}
                                                     gradient="linear-gradient(to right,#e858c8,#242322,#3dbb52)" />
                                            <div className="grid grid-cols-1 gap-1.5">
                                                <HSlider label="R" frac={getVal('r')} text={Math.round(getVal('r') * 255)} disabled={noSel}
                                                         onFrac={v => applyRGBDirect({ r: v })} gradient="linear-gradient(to right,#141312,#f43f3f)" />
                                                <HSlider label="G" frac={getVal('g')} text={Math.round(getVal('g') * 255)} disabled={noSel}
                                                         onFrac={v => applyRGBDirect({ g: v })} gradient="linear-gradient(to right,#141312,#3ddc55)" />
                                                <HSlider label="B" frac={getVal('b')} text={Math.round(getVal('b') * 255)} disabled={noSel}
                                                         onFrac={v => applyRGBDirect({ b: v })} gradient="linear-gradient(to right,#141312,#3b6bff)" />
                                                <HSlider label="W" frac={getVal('w')} text={Math.round(getVal('w') * 255)} disabled={noSel}
                                                         onFrac={v => applyRGBDirect({ w: v })} gradient="linear-gradient(to right,#141312,#ffffff)" />
                                                <HSlider label="A" frac={getVal('a')} text={Math.round(getVal('a') * 255)} disabled={noSel}
                                                         onFrac={v => applyRGBDirect({ a: v })} gradient="linear-gradient(to right,#141312,#ffb400)" />
                                            </div>
                                            <div className="rounded-xl border border-[var(--border)] p-2.5">
                                                <div className="text-[10px] font-bold uppercase tracking-wider text-zinc-500 mb-1.5">Цвет цифрами</div>
                                                <div className="flex gap-1.5 mb-2">
                                                    <NumField label="CIE x" value={Math.round(curXY.x * 10000) / 10000} step="0.001"
                                                              onCommit={v => applyXY(clamp(v, 0, 0.8), curXY.y)} />
                                                    <NumField label="CIE y" value={Math.round(curXY.y * 10000) / 10000} step="0.001"
                                                              onCommit={v => applyXY(curXY.x, clamp(v, 0.0001, 0.9))} />
                                                    <NumField label="Кельвины" value={Math.round(getVal('cct'))} step="50"
                                                              onCommit={v => applyCCT(clamp(v, 1000, 20000), getVal('gm'))} />
                                                </div>
                                                <div className="flex gap-1.5 mb-2">
                                                    <NumField label="R 0-255" value={Math.round(getVal('r') * 255)} step="1"
                                                              onCommit={v => applyRGBDirect({ r: clamp(v / 255, 0, 1) })} />
                                                    <NumField label="G 0-255" value={Math.round(getVal('g') * 255)} step="1"
                                                              onCommit={v => applyRGBDirect({ g: clamp(v / 255, 0, 1) })} />
                                                    <NumField label="B 0-255" value={Math.round(getVal('b') * 255)} step="1"
                                                              onCommit={v => applyRGBDirect({ b: clamp(v / 255, 0, 1) })} />
                                                </div>
                                                <div className="flex gap-1.5 items-end">
                                                    <NumField label="Оттенок °" value={Math.round(hsRef.current.h)} step="1"
                                                              onCommit={v => applyHS(((v % 360) + 360) % 360, hsRef.current.s)} />
                                                    <NumField label="Насыщ. %" value={Math.round(hsRef.current.s * 100)} step="1"
                                                              onCommit={v => applyHS(hsRef.current.h, clamp(v / 100, 0, 1))} />
                                                    <NumField label="Тон G/M" value={Math.round(getVal('gm') * 100)} step="1"
                                                              onCommit={v => applyCCT(getVal('cct'), clamp(v / 100, -1, 1))} />
                                                </div>
                                                <div className="text-[9px] text-zinc-600 mt-1.5 leading-relaxed">
                                                    x/y — координаты цвета по CIE 1931, как в паспортах приборов и на векторскопе.
                                                    Плюс/минус по «Тон G/M»: плюс — в зелень, минус — в пурпур.
                                                </div>
                                            </div>
                                            <div>
                                                <div className="text-[10px] font-bold uppercase tracking-wider text-zinc-500 mb-1.5">Температура света</div>
                                                <div className="grid grid-cols-4 gap-1.5">
                                                    {SWATCHES_K.map(sw => {
                                                        const c = kelvin2rgb(sw.k).map(x => Math.round(x * 255));
                                                        return (
                                                            <button key={sw.n} disabled={noSel} onClick={() => applySwatch(sw)}
                                                                    className="h-11 rounded-lg border border-black/40 text-[9px] font-bold text-black/70 disabled:opacity-35"
                                                                    style={{ background: 'rgb(' + c.join(',') + ')' }}>
                                                                {sw.n}<br />{sw.k}K
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                            <div>
                                                <div className="text-[10px] font-bold uppercase tracking-wider text-zinc-500 mb-1.5">Цвета</div>
                                                <div className="grid grid-cols-7 gap-1.5">
                                                    {SWATCHES_C.map(sw => (
                                                        <button key={sw.n} disabled={noSel} onClick={() => applySwatch(sw)} title={sw.n}
                                                                className="h-9 rounded-lg border border-black/40 disabled:opacity-35"
                                                                style={{ background: 'rgb(' + sw.rgb.map(x => Math.round(x * 255)).join(',') + ')' }}></button>
                                                    ))}
                                                </div>
                                            </div>
                                            <div>
                                                <div className="text-[10px] font-bold uppercase tracking-wider text-zinc-500 mb-1.5">Мои цвета</div>
                                                <div className="grid grid-cols-7 gap-1.5">
                                                    {customSwatches.map((sw, i) => (
                                                        <button key={i} disabled={noSel} onClick={() => applySwatch(sw)}
                                                                onDoubleClick={() => { setCustomSwatches(list => list.filter((_, j) => j !== i)); toast('Свотч удалён'); }}
                                                                className="h-9 rounded-lg border border-black/40 disabled:opacity-35"
                                                                style={{ background: 'rgb(' + sw.rgb.map(x => Math.round(x * 255)).join(',') + ')' }}></button>
                                                    ))}
                                                    <button onClick={() => {
                                                                setCustomSwatches(list => [...list.slice(-13), { n: 'Мой', rgb: lastColorRef.current.rgb }]);
                                                                toast('Текущий цвет сохранён (двойной тап по свотчу — удалить)');
                                                            }}
                                                            className="h-9 rounded-lg border border-dashed border-[var(--border)] text-zinc-500 flex items-center justify-center">
                                                        <Icons.Plus />
                                                    </button>
                                                </div>
                                            </div>
                                        </React.Fragment>
                                    )}

                                    {tab === 'fx' && (
                                        <React.Fragment>
                                            <div className="flex items-center gap-1.5">
                                                <button onClick={addEffect}
                                                        className="flex-1 py-2.5 rounded-lg bg-[var(--accent)] text-white text-xs font-bold flex items-center justify-center gap-1.5">
                                                    <Icons.Plus />Новый эффект
                                                </button>
                                                {effects.length > 0 && (
                                                    <button onClick={() => { pushUndo('Удаление эффектов'); setEffects([]); toast('Эффекты удалены'); }}
                                                            className="px-3 py-2.5 rounded-lg border border-red-900 text-red-400 text-xs font-bold">Убрать все</button>
                                                )}
                                            </div>
                                            {effects.length === 0 && (
                                                <div className="text-[11px] text-zinc-500 leading-relaxed">
                                                    Эффект — это движение света: радуга, волна, бегущий огонёк, живое пламя.
                                                    Он бежит по приборам так, как они расставлены на странице «План».
                                                    У пиксельных трубок эффект идёт по каждому пикселю отдельно.
                                                </div>
                                            )}
                                            {effects.map((fx, i) => (
                                                <FxCard key={fx.id} fx={fx} selCount={selected.size}
                                                        onChange={upd => setEffects(list => list.map((e, j) => j === i ? { ...e, ...upd } : e))}
                                                        onTarget={() => {
                                                            const ids = Array.from(selected);
                                                            setEffects(list => list.map((e, j) => j === i ? { ...e, targets: ids } : e));
                                                            toast(ids.length ? 'Эффект теперь только на выбранных приборах' : 'Эффект на всех приборах');
                                                        }}
                                                        onDelete={() => setEffects(list => list.filter((_, j) => j !== i))} />
                                            ))}
                                        </React.Fragment>
                                    )}

                                    {tab === 'pos' && (
                                        <React.Fragment>
                                            <PaletteStrip kind="pos" palettes={palettes} onApply={applyPalette}
                                                          onSave={() => savePalette('pos')}
                                                          onHold={p => setModal({ type: 'palMenu', id: p.id })} />
                                            <XYPad x={getVal('pan')} y={getVal('tilt')} disabled={noSel}
                                                   onXY={(x, y) => applyToSelection({ pan: x, tilt: y })} />
                                            <div className="flex gap-1.5">
                                                <button disabled={noSel} onClick={() => applyToSelection({ pan: 0.5, tilt: 0.5 })}
                                                        className="flex-1 py-2.5 rounded-lg bg-[var(--panel-2)] border border-[var(--border)] text-xs font-bold text-zinc-300 disabled:opacity-35">
                                                    В центр
                                                </button>
                                            </div>
                                            <HSlider label="Зум" frac={getVal('zoom')} text={pct(getVal('zoom'))} disabled={noSel}
                                                     onFrac={v => applyToSelection({ zoom: v })} gradient="linear-gradient(to right,#1c1b1a,#78716c)" />
                                            <HSlider label="Фокус" frac={getVal('focus')} text={pct(getVal('focus'))} disabled={noSel}
                                                     onFrac={v => applyToSelection({ focus: v })} gradient="linear-gradient(to right,#1c1b1a,#78716c)" />
                                        </React.Fragment>
                                    )}
                                </div>

                                {/* энкодеры */}
                                <div className="shrink-0 border-t border-[var(--border)] px-3 pt-2 pb-3">
                                    <div className="flex items-center gap-2 mb-1.5">
                                        <button onClick={locate} disabled={noSel}
                                                className="px-3 py-1.5 rounded-lg text-[11px] font-bold bg-[var(--panel-2)] border border-[var(--border)] text-zinc-300 disabled:opacity-35">Locate</button>
                                        <button onClick={() => setHighlight(h => !h)} disabled={noSel}
                                                title="Гасит всё кроме выбранных — чтобы найти прибор глазами"
                                                className={"px-3 py-1.5 rounded-lg text-[11px] font-bold border disabled:opacity-35 " +
                                                  (highlight ? 'bg-yellow-500 border-yellow-500 text-black' : 'bg-[var(--panel-2)] border-[var(--border)] text-zinc-300')}>Найти</button>
                                        <button onClick={clearProg}
                                                className={"px-3 py-1.5 rounded-lg text-[11px] font-bold border " +
                                                  (progDirty ? 'border-[var(--accent)] text-[var(--accent)]' : 'border-[var(--border)] text-zinc-500')}>Очистить</button>
                                        <div className="flex-1"></div>
                                        <button onClick={() => setFine(f => !f)}
                                                className={"px-3 py-1.5 rounded-lg text-[11px] font-bold border " +
                                                  (fine ? 'bg-[var(--accent)] border-[var(--accent)] text-white' : 'border-[var(--border)] text-zinc-400')}>Точно</button>
                                    </div>
                                    <div className="flex justify-between">
                                        {encoders.map(enc => (
                                            <Encoder key={tab + enc.label} label={enc.label} frac={enc.frac} text={enc.text}
                                                     onTurn={enc.onTurn} disabled={noSel} />
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ── слепой режим: рамка, чтобы это нельзя было забыть ── */}
                    {blind && <div className="pointer-events-none fixed inset-0 z-40 border-2 border-sky-600"></div>}
                    {highlight && (
                        <div className="pointer-events-none fixed bottom-4 left-4 z-40 px-3 py-1.5 rounded-lg bg-yellow-500 text-black text-[10px] font-bold">
                            ПОИСК ПРИБОРА · остальные погашены
                        </div>
                    )}

                    {/* ── тост ── */}
                    {toastMsg && (
                        <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl glass-panel text-sm shadow-xl">
                            {toastMsg}
                        </div>
                    )}

                    {/* ── модалки ── */}
                    {modal && modal.type === 'settings' && (
                        <SettingsModal settings={settings} setSettings={setSettings} dmxStatus={dmxStatus} netStatus={netStatus}
                                       connectSerial={connectSerial} disconnectSerial={disconnectSerial}
                                       connectBridge={connectBridge} disconnectBridge={disconnectBridge}
                                       fixtures={fixtures} playbacks={playbacks} customSwatches={customSwatches} customProfiles={customProfiles} effects={effects} groups={groups} palettes={palettes}
                                       onImport={data => {
                                           setFixtures(data.fixtures || []);
                                           setPlaybacks(data.playbacks && data.playbacks.length === 10 ? data.playbacks : new Array(10).fill(null));
                                           setCustomSwatches(data.customSwatches || []);
                                           setCustomProfiles(data.customProfiles || []);
                                           setEffects(data.effects || []);
                                           setGroups(data.groups || []);
                                           setPalettes(data.palettes || []);
                                           setSettings(data.settings || { serialUniverse: 1 });
                                           setSelected(new Set()); progRef.current.clear(); setProgDirty(false);
                                           toast('Проект загружен');
                                       }}
                                       onReset={() => {
                                           localStorage.removeItem('cl_project_v1');
                                           const p = seedProject();
                                           setFixtures(p.fixtures); setPlaybacks(p.playbacks);
                                           setCustomSwatches([]); setCustomProfiles([]); setEffects([]); setGroups([]); setPalettes([]); setSettings(p.settings);
                                           setSelected(new Set()); progRef.current.clear(); setProgDirty(false);
                                           setModal(null); toast('Проект сброшен');
                                       }}
                                       onClose={() => setModal(null)} />
                    )}
                    {modal && modal.type === 'addFixture' && (
                        <AddFixtureModal fixtures={fixtures} customProfiles={customProfiles}
                                         onAdd={(list, newProfile) => {
                                             pushUndo('Добавление приборов');
                                             setFixtures(fx => [...fx, ...list]);
                                             if (newProfile) setCustomProfiles(ps => [...ps, newProfile]);
                                             setModal(null);
                                             toast(list.length > 1 ? 'Добавлено приборов: ' + list.length : 'Прибор добавлен');
                                         }}
                                         onClose={() => setModal(null)} />
                    )}
                    {modal && modal.type === 'editFixture' && (
                        <EditFixtureModal fixture={fixtures.find(f => f.id === modal.id)}
                                          onSave={upd => {
                                              pushUndo('Настройка прибора');
                                              setFixtures(fx => fx.map(f => f.id === modal.id ? { ...f, ...upd } : f));
                                              setModal(null);
                                          }}
                                          onDelete={() => {
                                              pushUndo('Удаление прибора');
                                              setFixtures(fx => fx.filter(f => f.id !== modal.id));
                                              setSelected(s => { const n = new Set(s); n.delete(modal.id); return n; });
                                              progRef.current.delete(modal.id);
                                              setModal(null); toast('Прибор удалён');
                                          }}
                                          onClose={() => setModal(null)} />
                    )}
                    {modal && modal.type === 'groupMenu' && groups.find(g => g.id === modal.id) && (
                        <GroupMenuModal group={groups.find(g => g.id === modal.id)} selCount={selected.size}
                                        onRename={nm => { pushUndo('Переименование группы'); setGroups(l => l.map(g => g.id === modal.id ? { ...g, name: nm } : g)); setModal(null); }}
                                        onAddTo={() => { applyGroup(groups.find(g => g.id === modal.id), true); setModal(null); }}
                                        onReplace={() => {
                                            pushUndo('Изменение группы');
                                            setGroups(l => l.map(g => g.id === modal.id ? { ...g, ids: Array.from(selected) } : g));
                                            setModal(null); toast('Группа перезаписана выбором');
                                        }}
                                        onDelete={() => { pushUndo('Удаление группы'); setGroups(l => l.filter(g => g.id !== modal.id)); setModal(null); toast('Группа удалена'); }}
                                        onClose={() => setModal(null)} />
                    )}
                    {modal && modal.type === 'palMenu' && palettes.find(p => p.id === modal.id) && (
                        <PaletteMenuModal pal={palettes.find(p => p.id === modal.id)} selCount={selected.size}
                                          usedIn={playbacks.filter(pb => pb && pb.scene && Object.values(pb.scene).some(s => s.palC === modal.id || s.palP === modal.id)).map(pb => pb.name)}
                                          onRename={nm => { pushUndo('Переименование палитры'); setPalettes(l => l.map(p => p.id === modal.id ? { ...p, name: nm } : p)); setModal(null); }}
                                          onUpdate={() => { updatePalette(palettes.find(p => p.id === modal.id)); setModal(null); }}
                                          onDelete={() => { pushUndo('Удаление палитры'); setPalettes(l => l.filter(p => p.id !== modal.id)); setModal(null); toast('Палитра удалена'); }}
                                          onClose={() => setModal(null)} />
                    )}
                    {modal && modal.type === 'pbMenu' && playbacks[modal.idx] && (
                        <PlaybackMenuModal pb={playbacks[modal.idx]}
                                           onSave={upd => {
                                               setPlaybacks(pbs => pbs.map((p, i) => i === modal.idx ? { ...p, ...upd } : p));
                                               setModal(null);
                                           }}
                                           onRerecord={() => { recordScene(modal.idx); setModal(null); }}
                                           onDelete={() => {
                                               pushUndo('Удаление сцены');
                                               const pb = playbacks[modal.idx];
                                               if (pb) delete pbRunRef.current[pb.id];
                                               setPlaybacks(pbs => pbs.map((p, i) => i === modal.idx ? null : p));
                                               setModal(null); toast('Сцена удалена');
                                           }}
                                           onClose={() => setModal(null)} />
                    )}
                </div>
            );
        }

        /* ═══════════ настройки ═══════════ */
        function SettingsModal({ settings, setSettings, dmxStatus, netStatus, connectSerial, disconnectSerial, connectBridge, disconnectBridge, fixtures, playbacks, customSwatches, customProfiles, effects, groups, palettes, onImport, onReset, onClose }) {
            const fileRef = useRef(null);
            const doExport = () => {
                const data = JSON.stringify({ fixtures, playbacks, customSwatches, customProfiles, settings, effects, groups, palettes }, null, 2);
                const blob = new Blob([data], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'cinelight-project.json';
                a.click();
                URL.revokeObjectURL(a.href);
            };
            const doImport = e => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const data = JSON.parse(reader.result);
                        if (!Array.isArray(data.fixtures)) throw new Error('bad');
                        onImport(data); onClose();
                    } catch (err) { alert('Не получилось прочитать файл проекта'); }
                };
                reader.readAsText(file);
                e.target.value = '';
            };
            return (
                <Modal title="Настройки" onClose={onClose}>
                    <div className="space-y-5">
                        <div>
                            <div className="text-[11px] font-bold uppercase tracking-wider text-zinc-500 mb-2">Выход DMX · USB (Windows, Chrome/Edge)</div>
                            <div className="flex items-center gap-2 mb-2">
                                {dmxStatus === 'on' ? (
                                    <button onClick={disconnectSerial} className="px-3 py-2 rounded-lg bg-[var(--panel-2)] border border-green-700 text-green-400 text-xs font-bold">Подключено · Отключить</button>
                                ) : (
                                    <button onClick={connectSerial} className="px-3 py-2 rounded-lg bg-[var(--accent)] text-white text-xs font-bold">Подключить USB-DMX</button>
                                )}
                                <select className="glass-input rounded-lg px-2 py-2 text-xs"
                                        value={settings.serialUniverse || 1}
                                        onChange={e => setSettings(s => ({ ...s, serialUniverse: parseInt(e.target.value) }))}>
                                    {[1, 2, 3, 4].map(u => <option key={u} value={u}>Юниверс {u}</option>)}
                                </select>
                            </div>
                            <p className="text-[11px] text-zinc-500 leading-relaxed">
                                Для USB-DMX интерфейсов с протоколом Enttec DMX USB Pro (Enttec Pro, DMXKing
                                и совместимые). Работает в Chrome и Edge на компьютере; на iPad USB недоступен —
                                используйте мост ниже.
                            </p>
                        </div>
                        <div>
                            <div className="text-[11px] font-bold uppercase tracking-wider text-zinc-500 mb-2">Выход DMX · Art-Net мост (iPad и Windows, по Wi-Fi)</div>
                            <div className="flex items-center gap-2 mb-2">
                                <input className="glass-input rounded-lg px-3 py-2 text-xs flex-1 font-mono" placeholder="адрес моста, напр. 192.168.1.50:9070"
                                       value={settings.bridgeAddr || ''}
                                       onChange={e => setSettings(s => ({ ...s, bridgeAddr: e.target.value }))} />
                                {netStatus === 'off' ? (
                                    <button onClick={connectBridge} className="px-3 py-2 rounded-lg bg-[var(--accent)] text-white text-xs font-bold whitespace-nowrap">Подключить мост</button>
                                ) : (
                                    <button onClick={disconnectBridge} className={"px-3 py-2 rounded-lg bg-[var(--panel-2)] border text-xs font-bold whitespace-nowrap " +
                                            (netStatus === 'on' ? 'border-green-700 text-green-400' : 'border-yellow-700 text-yellow-500')}>
                                        {netStatus === 'on' ? 'Подключено · Отключить' : 'Подключаюсь… Отмена'}
                                    </button>
                                )}
                            </div>
                            <select className="glass-input rounded-lg px-2 py-2 text-xs mb-2"
                                    value={settings.artnetBase || 0}
                                    onChange={e => setSettings(s => ({ ...s, artnetBase: parseInt(e.target.value) }))}>
                                <option value={0}>Юниверс 1 → Art-Net universe 0 (стандарт)</option>
                                <option value={1}>Юниверс 1 → Art-Net universe 1</option>
                            </select>
                            <p className="text-[11px] text-zinc-500 leading-relaxed">
                                Мост — маленькая программа на компьютере в той же Wi-Fi сети (файлы
                                cinelight-bridge.js и cinelight-bridge.bat лежат рядом с пультом). Один раз
                                установите Node.js с nodejs.org, затем запускайте cinelight-bridge.bat —
                                окно покажет адрес вида http://192.168.1.50:9070. Откройте этот адрес на iPad —
                                пульт загрузится прямо с моста — и нажмите «Подключить мост». Дальше сигнал
                                уходит в сеть как Art-Net: его понимают Art-Net ноды и радиопередатчики (CRMX
                                и похожие). Мост шлёт все юниверсы, где есть приборы.
                            </p>
                        </div>
                        <div>
                            <div className="text-[11px] font-bold uppercase tracking-wider text-zinc-500 mb-2">Проект</div>
                            <div className="flex flex-wrap gap-2">
                                <button onClick={doExport} className="px-3 py-2 rounded-lg bg-[var(--panel-2)] border border-[var(--border)] text-xs font-bold text-zinc-300">Экспорт в файл</button>
                                <button onClick={() => fileRef.current.click()} className="px-3 py-2 rounded-lg bg-[var(--panel-2)] border border-[var(--border)] text-xs font-bold text-zinc-300">Импорт из файла</button>
                                <button onClick={() => { if (window.confirm('Удалить все приборы и сцены и начать заново?')) onReset(); }}
                                        className="px-3 py-2 rounded-lg bg-[var(--panel-2)] border border-red-900 text-xs font-bold text-red-400">Сбросить всё</button>
                                <input ref={fileRef} type="file" accept=".json" className="hidden" onChange={doImport} />
                            </div>
                            <p className="text-[11px] text-zinc-500 mt-2">
                                Проект сохраняется в этом браузере автоматически. Файл нужен, чтобы перенести
                                настройку на другой компьютер или планшет.
                            </p>
                        </div>
                        <div>
                            <div className="text-[11px] font-bold uppercase tracking-wider text-zinc-500 mb-2">Как пользоваться</div>
                            <ul className="text-[11px] text-zinc-400 leading-relaxed list-disc pl-4 space-y-1">
                                <li>«Патч» — выберите приборы из библиотеки (производитель → модель → режим DMX) и задайте адреса.</li>
                                <li>«План» — расставьте приборы пальцем так, как они стоят на площадке. По этой расстановке бегут эффекты.</li>
                                <li>На пульте выберите приборы и задайте цвет: круг, температура (CCT), тон G/M, ползунки RGB.</li>
                                <li>Энкодеры внизу крутятся пальцем по кругу; кнопка «Точно» — медленный ход.</li>
                                <li>«● ЗАПИСЬ» и затем слот — сохранить текущую картинку как сцену. Тап по сцене — включить с фейдом, вертикальное движение — уровень, долгое нажатие — настройки сцены.</li>
                                <li>«Очистить» — убрать ручные правки и вернуться к сценам. BLACKOUT — мгновенно всё в ноль.</li>
                                <li>Вкладка «Эффекты» — движение света: радуга, волна, бегущий огонёк, пламя. У пиксельных трубок эффект идёт по каждому пикселю.</li>
                                <li>Цвет можно задать цифрами: координаты CIE x/y, Кельвины, RGB 0–255 или оттенок с насыщенностью.</li>
                                <li>Без интерфейса и моста пульт работает в демо-режиме: плитки приборов показывают свет, сцены можно готовить заранее.</li>
                            </ul>
                        </div>
                    </div>
                </Modal>
            );
        }

        /* ═══════════ добавление прибора ═══════════ */
        function AddFixtureModal({ fixtures, customProfiles, onAdd, onClose }) {
            const lib = useMemo(() => {
                const l = FIXTURE_LIB.map(b => ({ ...b, models: b.models.slice() }));
                if (customProfiles.length) l.push({ brand: 'Мои профили', models: [{ model: 'Сохранённые', cct: [2700, 6500], modes: customProfiles }] });
                return l;
            }, [customProfiles]);
            const [bi, setBi] = useState(0);
            const [mi, setMi] = useState(0);
            const [mo, setMo] = useState(0);
            const [custom, setCustom] = useState(false);
            const [name, setName] = useState('');
            const [count, setCount] = useState(1);
            const [universe, setUniverse] = useState(1);
            const [addr, setAddr] = useState(() => nextFreeAddr(fixtures, 1));
            const [cctMin, setCctMin] = useState(2700);
            const [cctMax, setCctMax] = useState(6500);
            const [customCh, setCustomCh] = useState(['dim', 'r', 'g', 'b']);
            const [customPx, setCustomPx] = useState(0);
            const [customName, setCustomName] = useState('Мой прибор');

            const brand = lib[Math.min(bi, lib.length - 1)];
            const model = brand.models[Math.min(mi, brand.models.length - 1)];
            const mode = model.modes[Math.min(mo, model.modes.length - 1)];
            const profile = custom
                ? { id: 'cp' + uid(), name: customName || 'Мой прибор', ch: customCh,
                    px: customPx > 0 ? ['r', 'g', 'b'] : undefined, pixels: customPx > 0 ? customPx : undefined }
                : { ...mode, id: mode.id || 'lib' + uid(), name: model.model + ' · ' + mode.name };
            const allCh = (profile.ch || []).concat(profile.px || []);
            const hasCct = allCh.includes('cct');
            const foot = footprint(profile);

            useEffect(() => { setAddr(nextFreeAddr(fixtures, universe)); }, [universe]);
            useEffect(() => { setMi(0); setMo(0); }, [bi]);
            useEffect(() => { setMo(0); }, [mi]);
            useEffect(() => {
                if (!custom && model.cct) { setCctMin(model.cct[0]); setCctMax(model.cct[1]); }
            }, [bi, mi, custom]);

            const submit = () => {
                if (foot === 0) { alert('У профиля нет ни одного канала'); return; }
                const n = clamp(parseInt(count) || 1, 1, 64);
                const a0 = clamp(parseInt(addr) || 1, 1, 512);
                const base = (name || (custom ? profile.name : model.model)).trim();
                const list = [];
                for (let i = 0; i < n; i++) {
                    const a = a0 + i * foot;
                    if (a + foot - 1 > 512) break;
                    list.push({
                        id: uid() + i, name: n > 1 ? base + ' ' + (i + 1) : base,
                        universe, addr: a,
                        profile: JSON.parse(JSON.stringify(profile)),
                        cctMin: parseInt(cctMin) || 2700, cctMax: parseInt(cctMax) || 6500,
                        x: 0.1 + 0.8 * ((i + 0.5) / n), y: 0.5, rot: 0,
                        len: profile.pixels ? 0.5 : 0.14
                    });
                }
                if (list.length === 0) { alert('Не хватает адресов в юниверсе (максимум 512 каналов)'); return; }
                onAdd(list, custom ? JSON.parse(JSON.stringify(profile)) : null);
            };

            return (
                <Modal title="Добавить прибор" onClose={onClose}>
                    <div className="space-y-3">
                        <div className="flex gap-1">
                            <button onClick={() => setCustom(false)}
                                    className={"flex-1 py-2 rounded-lg text-xs font-bold " + (!custom ? 'bg-[var(--accent)] text-white' : 'bg-[var(--panel-2)] text-zinc-400')}>Из библиотеки</button>
                            <button onClick={() => setCustom(true)}
                                    className={"flex-1 py-2 rounded-lg text-xs font-bold " + (custom ? 'bg-[var(--accent)] text-white' : 'bg-[var(--panel-2)] text-zinc-400')}>Свой профиль</button>
                        </div>
                        {!custom && (
                            <React.Fragment>
                                <div>
                                    <label className="text-[11px] font-bold text-zinc-500">Производитель</label>
                                    <select className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1" value={bi} onChange={e => setBi(parseInt(e.target.value))}>
                                        {lib.map((b, i) => <option key={b.brand} value={i}>{b.brand}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="text-[11px] font-bold text-zinc-500">Модель</label>
                                    <select className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1" value={mi} onChange={e => setMi(parseInt(e.target.value))}>
                                        {brand.models.map((m, i) => <option key={m.model} value={i}>{m.model}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="text-[11px] font-bold text-zinc-500">Режим DMX</label>
                                    <select className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1" value={mo} onChange={e => setMo(parseInt(e.target.value))}>
                                        {model.modes.map((m, i) => <option key={i} value={i}>{m.name}</option>)}
                                    </select>
                                    <div className="text-[10px] text-zinc-500 mt-1 leading-relaxed">
                                        В меню самого прибора выберите режим с тем же числом каналов — у разных
                                        производителей они называются по-своему. Если картинка на площадке не совпала,
                                        поменяйте режим здесь или соберите свой профиль.
                                    </div>
                                </div>
                            </React.Fragment>
                        )}
                        {custom && (
                            <div className="rounded-xl border border-[var(--border)] p-3 space-y-2">
                                <input className="glass-input rounded-lg px-3 py-2 text-sm w-full" placeholder="Название профиля"
                                       value={customName} onChange={e => setCustomName(e.target.value)} />
                                <div className="flex items-center gap-2">
                                    <span className="text-[11px] text-zinc-500 flex-1">Пикселей RGB после общих каналов</span>
                                    <input type="number" min="0" max="170" className="glass-input rounded-lg px-2 py-1.5 text-xs w-20 font-mono"
                                           value={customPx} onChange={e => setCustomPx(clamp(parseInt(e.target.value) || 0, 0, 170))} />
                                </div>
                                {customCh.map((role, i) => (
                                    <div key={i} className="flex items-center gap-2">
                                        <span className="text-[11px] font-mono text-zinc-500 w-14">Кан. {i + 1}</span>
                                        <select className="glass-input rounded-lg px-2 py-1.5 text-xs flex-1" value={role}
                                                onChange={e => setCustomCh(ch => ch.map((r, j) => j === i ? e.target.value : r))}>
                                            {Object.entries(ROLES).map(([id, n]) => <option key={id} value={id}>{n}</option>)}
                                        </select>
                                        <button onClick={() => setCustomCh(ch => ch.filter((_, j) => j !== i))}
                                                className="p-1.5 text-zinc-500 hover:text-red-400"><Icons.X /></button>
                                    </div>
                                ))}
                                <button onClick={() => setCustomCh(ch => [...ch, 'none'])}
                                        className="w-full py-2 rounded-lg border border-dashed border-[var(--border)] text-xs text-zinc-400">+ канал</button>
                            </div>
                        )}
                        <div>
                            <label className="text-[11px] font-bold text-zinc-500">Название</label>
                            <input className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1" placeholder={custom ? profile.name : model.model}
                                   value={name} onChange={e => setName(e.target.value)} />
                        </div>
                        <div className="grid grid-cols-3 gap-2">
                            <div>
                                <label className="text-[11px] font-bold text-zinc-500">Кол-во</label>
                                <input type="number" min="1" max="64" className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1"
                                       value={count} onChange={e => setCount(e.target.value)} />
                            </div>
                            <div>
                                <label className="text-[11px] font-bold text-zinc-500">Юниверс</label>
                                <select className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1" value={universe}
                                        onChange={e => setUniverse(parseInt(e.target.value))}>
                                    {[1, 2, 3, 4].map(u => <option key={u} value={u}>{u}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="text-[11px] font-bold text-zinc-500">Адрес</label>
                                <input type="number" min="1" max="512" className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1 font-mono"
                                       value={addr} onChange={e => setAddr(e.target.value)} />
                            </div>
                        </div>
                        {hasCct && (
                            <div className="grid grid-cols-2 gap-2">
                                <div>
                                    <label className="text-[11px] font-bold text-zinc-500">CCT мин, K</label>
                                    <input type="number" className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1 font-mono"
                                           value={cctMin} onChange={e => setCctMin(e.target.value)} />
                                </div>
                                <div>
                                    <label className="text-[11px] font-bold text-zinc-500">CCT макс, K</label>
                                    <input type="number" className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1 font-mono"
                                           value={cctMax} onChange={e => setCctMax(e.target.value)} />
                                </div>
                            </div>
                        )}
                        <div className="text-[11px] text-zinc-500">
                            Займёт каналов: {foot} на прибор{profile.pixels ? ' · пикселей: ' + profile.pixels : ''}.
                            {count > 1 ? ' Адреса: ' + addr + '–' + (clamp(parseInt(addr) || 1, 1, 512) + foot * clamp(parseInt(count) || 1, 1, 64) - 1) + '.' : ''}
                        </div>
                        <button onClick={submit} className="w-full py-3 rounded-xl bg-[var(--accent)] text-white text-sm font-bold">Добавить</button>
                    </div>
                </Modal>
            );
        }

        /* ═══════════ правка прибора ═══════════ */
        function EditFixtureModal({ fixture, onSave, onDelete, onClose }) {
            if (!fixture) return null;
            const [name, setName] = useState(fixture.name);
            const [universe, setUniverse] = useState(fixture.universe);
            const [addr, setAddr] = useState(fixture.addr);
            const [cctMin, setCctMin] = useState(fixture.cctMin || 2700);
            const [cctMax, setCctMax] = useState(fixture.cctMax || 6500);
            const [rot, setRot] = useState(fixture.rot || 0);
            const [len, setLen] = useState(fixture.len === undefined ? 0.14 : fixture.len);
            const prof = fixture.profile;
            const hasCct = (prof.ch || []).concat(prof.px || []).includes('cct');
            const isPx = !!prof.pixels;
            return (
                <Modal title="Прибор" onClose={onClose}>
                    <div className="space-y-3">
                        <div>
                            <label className="text-[11px] font-bold text-zinc-500">Название</label>
                            <input className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1" value={name} onChange={e => setName(e.target.value)} />
                        </div>
                        <div className="text-[11px] text-zinc-500">
                            {prof.name} · каналов: {footprint(prof)}{isPx ? ' · пикселей: ' + prof.pixels : ''}
                        </div>
                        <div className="rounded-xl border border-[var(--border)] p-3 space-y-2">
                            <div className="text-[10px] font-bold uppercase tracking-wider text-zinc-500">Место на плане</div>
                            <HSlider label="Поворот" frac={rot / 360} text={Math.round(rot) + '°'} onFrac={v => setRot(v * 360)}
                                     gradient="linear-gradient(to right,#1c1b1a,#78716c)" />
                            {isPx && (
                                <HSlider label="Длина" frac={clamp(len, 0, 1)} text={Math.round(len * 100) + '%'} onFrac={setLen}
                                         gradient="linear-gradient(to right,#1c1b1a,#78716c)" />
                            )}
                            <div className="text-[10px] text-zinc-500 leading-relaxed">
                                {isPx ? 'Поворот и длина задают, как трубка лежит на плане — по этой линии и побегут пиксели.'
                                      : 'Поворот пригодится, когда по прибору идёт эффект. Само место задаётся перетаскиванием на странице «План».'}
                            </div>
                        </div>
                        <div className="grid grid-cols-2 gap-2">
                            <div>
                                <label className="text-[11px] font-bold text-zinc-500">Юниверс</label>
                                <select className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1" value={universe}
                                        onChange={e => setUniverse(parseInt(e.target.value))}>
                                    {[1, 2, 3, 4].map(u => <option key={u} value={u}>{u}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="text-[11px] font-bold text-zinc-500">Адрес</label>
                                <input type="number" min="1" max="512" className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1 font-mono"
                                       value={addr} onChange={e => setAddr(e.target.value)} />
                            </div>
                        </div>
                        {hasCct && (
                            <div className="grid grid-cols-2 gap-2">
                                <div>
                                    <label className="text-[11px] font-bold text-zinc-500">CCT мин, K</label>
                                    <input type="number" className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1 font-mono"
                                           value={cctMin} onChange={e => setCctMin(e.target.value)} />
                                </div>
                                <div>
                                    <label className="text-[11px] font-bold text-zinc-500">CCT макс, K</label>
                                    <input type="number" className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1 font-mono"
                                           value={cctMax} onChange={e => setCctMax(e.target.value)} />
                                </div>
                            </div>
                        )}
                        <div className="flex gap-2 pt-1">
                            <button onClick={() => onSave({
                                        name: name.trim() || fixture.name,
                                        universe,
                                        addr: clamp(parseInt(addr) || 1, 1, 512),
                                        cctMin: parseInt(cctMin) || 2700,
                                        cctMax: parseInt(cctMax) || 6500,
                                        rot, len
                                    })}
                                    className="flex-1 py-3 rounded-xl bg-[var(--accent)] text-white text-sm font-bold">Сохранить</button>
                            <button onClick={() => { if (window.confirm('Удалить прибор «' + fixture.name + '»?')) onDelete(); }}
                                    className="px-4 py-3 rounded-xl border border-red-900 text-red-400 text-sm font-bold">Удалить</button>
                        </div>
                    </div>
                </Modal>
            );
        }

        /* ═══════════ меню группы ═══════════ */
        function GroupMenuModal({ group, selCount, onRename, onAddTo, onReplace, onDelete, onClose }) {
            const [name, setName] = useState(group.name);
            return (
                <Modal title="Группа" onClose={onClose}>
                    <div className="space-y-3">
                        <div>
                            <label className="text-[11px] font-bold text-zinc-500">Название</label>
                            <input className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1" value={name} onChange={e => setName(e.target.value)} />
                        </div>
                        <div className="text-[11px] text-zinc-500">Приборов в группе: {group.ids.length}</div>
                        <div className="grid grid-cols-2 gap-2">
                            <button onClick={onAddTo} className="py-2.5 rounded-lg border border-[var(--border)] text-zinc-300 text-xs font-bold">Добавить к выбору</button>
                            <button disabled={selCount === 0} onClick={onReplace}
                                    className="py-2.5 rounded-lg border border-[var(--border)] text-zinc-300 text-xs font-bold disabled:opacity-35">
                                Перезаписать выбором ({selCount})
                            </button>
                        </div>
                        <div className="flex gap-2 pt-1">
                            <button onClick={() => onRename(name.trim() || group.name)}
                                    className="flex-1 py-3 rounded-xl bg-[var(--accent)] text-white text-sm font-bold">Сохранить</button>
                            <button onClick={() => { if (window.confirm('Удалить группу «' + group.name + '»?')) onDelete(); }}
                                    className="px-4 py-3 rounded-xl border border-red-900 text-red-400 text-sm font-bold">Удалить</button>
                        </div>
                    </div>
                </Modal>
            );
        }

        /* ═══════════ меню палитры ═══════════ */
        function PaletteMenuModal({ pal, selCount, usedIn, onRename, onUpdate, onDelete, onClose }) {
            const [name, setName] = useState(pal.name);
            return (
                <Modal title={pal.kind === 'color' ? 'Палитра цвета' : 'Палитра позиции'} onClose={onClose}>
                    <div className="space-y-3">
                        <div className="flex items-center gap-2">
                            <span className="w-8 h-8 rounded-lg border border-black/40 shrink-0" style={{ background: pal.tint }}></span>
                            <input className="glass-input rounded-lg px-3 py-2.5 text-sm flex-1" value={name} onChange={e => setName(e.target.value)} />
                        </div>
                        <div className="text-[11px] text-zinc-500 leading-relaxed">
                            {usedIn.length
                                ? 'Стоит в сценах: ' + usedIn.join(', ') + '. Обновите палитру — эти сцены поедут за ней.'
                                : 'Пока не используется ни в одной сцене.'}
                        </div>
                        <button disabled={selCount === 0} onClick={onUpdate}
                                className="w-full py-2.5 rounded-lg border border-[var(--border)] text-zinc-300 text-xs font-bold disabled:opacity-35">
                            Запомнить заново с выбранного прибора
                        </button>
                        <div className="flex gap-2 pt-1">
                            <button onClick={() => onRename(name.trim() || pal.name)}
                                    className="flex-1 py-3 rounded-xl bg-[var(--accent)] text-white text-sm font-bold">Сохранить</button>
                            <button onClick={() => { if (window.confirm('Удалить палитру «' + pal.name + '»?')) onDelete(); }}
                                    className="px-4 py-3 rounded-xl border border-red-900 text-red-400 text-sm font-bold">Удалить</button>
                        </div>
                    </div>
                </Modal>
            );
        }

        /* ═══════════ меню сцены ═══════════ */
        function PlaybackMenuModal({ pb, onSave, onRerecord, onDelete, onClose }) {
            const [name, setName] = useState(pb.name);
            const [fade, setFade] = useState(pb.fade);
            return (
                <Modal title="Сцена" onClose={onClose}>
                    <div className="space-y-3">
                        <div>
                            <label className="text-[11px] font-bold text-zinc-500">Название</label>
                            <input className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1" value={name} onChange={e => setName(e.target.value)} />
                        </div>
                        <div>
                            <label className="text-[11px] font-bold text-zinc-500">Время фейда, секунды</label>
                            <input type="number" min="0" max="120" step="0.5" className="glass-input rounded-lg px-3 py-2.5 text-sm w-full mt-1 font-mono"
                                   value={fade} onChange={e => setFade(e.target.value)} />
                        </div>
                        <div className="flex gap-2 pt-1">
                            <button onClick={() => onSave({ name: name.trim() || pb.name, fade: clamp(parseFloat(fade) || 0, 0, 120) })}
                                    className="flex-1 py-3 rounded-xl bg-[var(--accent)] text-white text-sm font-bold">Сохранить</button>
                            <button onClick={() => { if (window.confirm('Перезаписать сцену текущей картинкой света?')) onRerecord(); }}
                                    className="px-3 py-3 rounded-xl border border-[var(--border)] text-zinc-300 text-sm font-bold">Перезаписать</button>
                            <button onClick={() => { if (window.confirm('Удалить сцену «' + pb.name + '»?')) onDelete(); }}
                                    className="px-3 py-3 rounded-xl border border-red-900 text-red-400 text-sm font-bold">Удалить</button>
                        </div>
                    </div>
                </Modal>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
