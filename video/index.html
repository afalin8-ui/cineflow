<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Видео теперь в самом CineFlow</title>
<!-- ПРОЩАЛЬНАЯ СТРАНИЦА ТЕСТОВОЙ ПАПКИ.
     Видео уехало в рабочее приложение, и копия «на посмотреть» больше
     не нужна. Просто удалить папку нельзя: у копии свой service worker,
     и у того, кто поставил её на домашний экран, он остался бы жить
     навсегда — приложение открывалось бы из кэша старой сборкой, молча
     и без единой ошибки. Поэтому страница СНИМАЕТ свой service worker,
     СТИРАЕТ только свои кэши (корневые начинаются иначе — снести их
     значило бы отобрать офлайн у рабочего адреса) и уводит в приложение. -->
<style>
  :root { --bg:#1a1918; --card:#242322; --border:#33312d; --text:#f0eee6; --muted:#a6a39a; --accent:#d97757;
          --font-ui:-apple-system,'SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif; }
  html,body { margin:0; background:var(--bg); color:var(--text); font-family:var(--font-ui); }
  body { min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .box { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:24px; max-width:420px; }
  h1 { font-size:20px; font-weight:700; letter-spacing:-.02em; margin:0 0 10px; }
  p { font-size:15px; line-height:1.5; color:var(--muted); margin:0 0 16px; }
  a.go { display:inline-flex; align-items:center; min-height:44px; padding:0 18px; border-radius:10px;
         background:var(--accent); color:var(--bg); font-weight:700; font-size:15px; text-decoration:none; }
  .small { font-size:12.5px; color:#6f6b63; margin:14px 0 0; }
</style>
</head>
<body>
  <div class="box">
    <h1>Видео теперь в самом CineFlow</h1>
    <p>Эта тестовая версия больше не нужна: ролики, стоп-кадр и скачивание
       работают в рабочем приложении. Сейчас откроется оно — проект тот же,
       ничего переносить не надо.</p>
    <a class="go" href="../">Открыть CineFlow</a>
    <p class="small" id="st">Убираю тестовую версию с устройства…</p>
  </div>
<script>
(async function () {
  var st = document.getElementById('st');
  try {
    if ('serviceWorker' in navigator) {
      var regs = await navigator.serviceWorker.getRegistrations();
      for (var i = 0; i < regs.length; i++) {
        var sc = regs[i].scope || '';
        if (sc.indexOf('/video/') >= 0) await regs[i].unregister();
      }
    }
    if (window.caches) {
      var keys = await caches.keys();
      // ТОЛЬКО СВОИ: кэши рабочего приложения начинаются с 'cineflow-v'
      // и 'cf-app-build' — их не трогаем.
      for (var j = 0; j < keys.length; j++) {
        if (keys[j].indexOf('cineflow-video') === 0 || keys[j] === 'cf-app-build-video') await caches.delete(keys[j]);
      }
    }
    st.textContent = 'Тестовая версия убрана. Если она стоит на домашнем экране, значок можно удалить.';
  } catch (e) {
    st.textContent = 'Открывайте приложение по кнопке выше.';
  }
  setTimeout(function () { location.replace('../'); }, 2500);
})();
</script>
</body>
</html>
